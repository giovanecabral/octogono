/* A pauta: nível mais alto que vale, girando. A mesma pauta não volta na
   entrevista seguinte se houver outra que valha (fato forte só perde um
   pouco, porque cinturão e zebra são raros e importantes). */
function escolherPauta(f,olhou){
  const n=narrativaDa(),usadas=n.pautas||[];
  const elig=PAUTAS_ENTREVISTA.filter(p=>p.cond(f)&&!(olhou&&p.passado));
  const nota=p=>p.nivel*10-(usadas[usadas.length-1]===p.id?(p.nivel>=3?6:12):usadas.slice(-3).includes(p.id)?5:0);
  const h=hashEstavel(`${SEED}:${fightNo}:pauta`);
  /* fato forte desempata pela ordem fixa (cinturão > lesão > zebra); o resto gira */
  elig.sort((a,b)=>nota(b)-nota(a)||(a.nivel>=3&&b.nivel>=3?PAUTAS_ENTREVISTA.indexOf(a)-PAUTAS_ENTREVISTA.indexOf(b)
    :hashEstavel(h+a.id)%7-hashEstavel(h+b.id)%7));
  const p=elig[0];
  n.pautas=[...usadas,p.id].slice(-8);
  return p;
}
/* a variação da pauta gira na carreira (vai no save): a mesma pauta não
   repete a mesma pergunta enquanto houver outra */
function proximaVariacao(chave,total){
  const n=narrativaDa();n.variacoes=n.variacoes||{};
  const k=n.variacoes[chave]||0;n.variacoes[chave]=k+1;
  return(k+hashEstavel(`${SEED}:${chave}`))%total;
}
function perguntaDaPauta(p,f){
  const vs=p.q(f);
  return vs[proximaVariacao(p.id,vs.length)];
}
/* Evento: só cenário da chegada do repórter, coerente com o resultado. A
   pergunta nunca parte dele (o filtro barra pergunta que repete o evento). */
function eventosDaEntrevista(f){
  if(f.titulo&&f.won)return["O cinturão ainda estava no seu ombro quando o repórter chegou com o microfone."];
  const v=f.won?[`A sua equipe invadiu a área da entrevista antes da primeira pergunta.`,
      `A torcida ainda gritava o seu nome quando o repórter chegou com o microfone.`,
      `${f.opp} passou atrás da câmera e bateu no seu ombro antes de ir para o vestiário.`,
      `Alguém da equipe entregou um celular com uma ligação da sua família.`,
      `Os fotógrafos cercaram a grade enquanto o repórter esperava a vez dele.`,
      `A organização trouxe o banner do evento para a foto antes da entrevista.`]
    :[`O repórter esperou alguém da equipe trazer gelo para o seu rosto.`,
      `${f.opp} comemorava do outro lado da grade enquanto o repórter se aproximava.`,
      `O seu treinador ficou ao seu lado, em silêncio, durante a entrevista.`,
      `O médico da organização terminou de examinar você antes de liberar a entrevista.`,
      `Os fotógrafos já tinham ido para o lado de ${f.opp} quando o repórter chegou.`,
      `A sua equipe recolhia as toalhas e a água no canto do octógono.`];
  v.push(f.metodo==="decisão"?`O locutor tinha acabado de ler os cartões quando o repórter puxou o microfone.`
    :`O replay do fim da luta ainda passava no telão atrás do repórter.`);
  return v;
}
function eventoDaEntrevista(f){
  const evs=eventosDaEntrevista(f),usados=eventosUsados("entrevista").join(" ");
  const h=hashEstavel(`${SEED}:${fightNo}:entrevista:evento`);
  for(let k=0;k<evs.length;k++){const e=evs[(h+k)%evs.length];if(!usados.includes(e.slice(0,40)))return e;}
  return evs[h%evs.length];
}
/* Filtro de coerência da pergunta da entrevista (IA e moldes). Devolve o
   motivo pra cair no molde local, ou null. */
const PERGUNTA_GENERICA=/como (?:voc[eê] )?se sente|o que passou pela sua cabe[çc]a|qual (?:[eé] )?o (?:seu )?recado|o que (?:voc[eê] )?achou da luta|como (?:voc[eê] )?avalia (?:a|essa|esta) luta|o que (?:esse|este) resultado diz sobre voc[eê]|o que (?:essa|esta) (?:luta|vit[oó]ria|derrota) prova|alguma mensagem|o que (?:voc[eê] )?sentiu/i;
const ANCORA_DA_LUTA=/\bround|\b\d{2}\s*(?:-|a)\s*\d{2}\b|decis|\bpontos\b|nocaute|finaliz|\bquedas?\b|\bch[aã]o\b|cart[oõ]es|ju[ií]z|placar|cintur[aã]o|les[aã]o|favorit|apostav|golpe|abertura|ritmo|dist[aâ]ncia|press[aã]o|troca[çc]|clinch|grade|intervalo|corner|plano|knockdown|derrub|finaliza|octógono|revanche|primeiro encontro|última vez/i;
function motivoPerguntaRuim(pergunta,evento,f,nomes=[]){
  const p=String(pergunta||"");
  const frases=p.split(/(?<=[.!?])\s+/).filter(Boolean);
  const final=frases[frases.length-1]||p;
  const pe=palavrasDaCena(evento,nomes);
  for(const fr of frases){
    const pf=palavrasDaCena(fr,nomes);
    if(pf.size>=4&&pe.size>=4){let i=0;for(const w of pf)if(pe.has(w))i++;if(i/pf.size>=.6)return"repete o evento";}
  }
  /* o método vale pra luta de hoje: frase que fala de luta passada ("da
     última vez", "vinha de") pode citar outro fim de luta */
  const hoje=frases.filter(fr=>!/\b(?:da [uú]ltima vez|da outra vez|luta passada|luta anterior|vinha de|primeiro encontro|antes desta)\b/i.test(fr)).join(" ");
  if(f.metodo!=="decisão"&&/\bju[ií]z|\bcart[oõ]es\b|\bpontua|\bpor decis[aã]o|decis[aã]o dos/i.test(hoje))return"juízes sem decisão";
  const tentou=/\b(quase|tentativa|tentou|tentar|amea[çc]|perto d)/i.test(hoje);
  if(f.metodo==="decisão"&&!tentou&&/\b(nocaute|nocauteou|nocauteado|finalizou|finalizado|por finaliza[çc][aã]o)\b/i.test(hoje))return"fim de luta que não aconteceu";
  if(f.metodo==="nocaute"&&!tentou&&/\b(finalizou|finalizado|finalizar|por finaliza[çc][aã]o)\b/i.test(hoje))return"fim de luta que não aconteceu";
  /* o adjetivo do placar tem que bater com a diferença real (medido: "o placar
     baixo" numa vitória por 30-27) */
  if(/placar baixo|placar alto/i.test(p))return"placar descrito errado";
  if(f.metodo==="decisão"&&!f.placar&&/apertad|por um ponto|um ponto de diferen|\b(clara|folgad|abismo)|n[aã]o foi decisiva|equilibrad/i.test(hoje))return"placar descrito errado";
  /* o relógio do round é tempo desde o início (medido: "faltando 35 segundos"
     num nocaute aos 35 segundos de round) */
  if(f.segundos!=null&&f.segundos<240&&/\b(faltando|restando|nos [uú]ltimos)\b/i.test(hoje))return"tempo descrito errado";
  if(f.metodo==="nocaute"&&!tentou&&/\bfinaliza[çc][aã]o\b/i.test(hoje))return"fim de luta que não aconteceu";
  /* cacoete de questionário gerado (medido no modelo: "qual foi o detalhe
     técnico" em 5 de 26 perguntas) e tratamento formal fora do lugar */
  if(/detalhe (?:f[ií]sico|t[eé]cnico)|ajuste (?:t[eé]cnico )?ou leitura|leitura t[eé]cnica|sequ[eê]ncia t[eé]cnica|precis[aã]o cronol|\bsenhor(?:a)?\b/i.test(p))return"fórmula de questionário";
  /* zebra: quem chegou como favorito foi o adversário (medido: "mesmo sendo
     considerado o favorito" numa vitória de azarão) */
  if(f.zebra&&/\b(?:voc[eê]|sendo)\b[^.?!]{0,30}\bfavorit/i.test(hoje))return"fato invertido";
  /* vantagem que ele nunca teve (medido no modelo: "onde você perdeu a
     vantagem técnica" numa derrota por 27-30, sem round, queda ou
     knockdown a favor dele) */
  const levouRound=f.rounds.some(x=>x.quem==="eu")||(!!f.placar&&f.placar.eu>9*(f.round||3));
  const nuncaNaFrente=!f.won&&!levouRound&&!f.kds.some(k=>k.caiu==="ele")&&f.quedas.eu<=f.quedas.ele;
  if(nuncaNaFrente&&/\b(?:perdeu|deixou escapar|deixou fugir)\s+(?:a |o |sua |seu )?(?:vantagem|controle|lideran[çc]a|dom[ií]nio)/i.test(hoje))return"fato invertido";
  if(f.placar&&!f.apertada&&/apertad|por um ponto|um ponto de diferen|equilibrad/i.test(hoje))return"placar descrito errado";
  if(f.placar&&f.apertada&&/\b(clara|folgad|tranquil|abismo|domin[aâ]ncia total)/i.test(hoje))return"placar descrito errado";
  /* a pauta é a luta: contrato, bolsa e próxima luta ficam fora (medido: a
     linha editorial de negócios levava a pergunta pro contrato) */
  if(/\b(contrato|bolsa|negocia[çc]|patroc[ií]n|sal[aá]rio|dinheiro|pr[oó]xima luta|pr[oó]ximo advers[aá]rio|pr[oó]ximo passo)/i.test(p))return"assunto fora da luta";
  if(f.metodo==="finalização"&&!tentou&&/\b(nocaute|nocauteou|nocauteado)\b/i.test(hoje))return"fim de luta que não aconteceu";
  if(/\b(dividida|un[aâ]nime|majorit[aá]ria)\b|\btr[eê]s (?:cart[oõ]es|ju[ií]zes)|\bos tr[eê]s ju/i.test(p))return"tipo de decisão inventado";
  /* resultado invertido (medido no modelo: "Você garantiu a vitória por um
     ponto" numa derrota por 28-29) */
  /* ganhar ou perder UM round não é o resultado da luta ("você perdeu o
     primeiro round e virou") */
  const umRound="(?!\\s+(?:o|um|os|dois|tr[eê]s)\\s+(?:\\S+\\s+)?rounds?\\b)";
  if(!f.won&&new RegExp(`\\bvoc[eê] (?:venceu|ganhou)${umRound}|garantiu a vit[oó]ria|\\bsua vit[oó]ria|vit[oó]ria sua`,"i").test(hoje))return"resultado invertido";
  if(f.won&&new RegExp(`\\bvoc[eê] perdeu${umRound}|\\bsua derrota|voc[eê] foi derrotad`,"i").test(hoje))return"resultado invertido";
  /* minutos e segundos ditos na pergunta têm que bater com o relógio do
     round (medido: "com apenas um minuto de luta" numa finalização aos
     1min55; "nos primeiros trinta segundos" num nocaute com 1min50) */
  if(f.segundos!=null){
    const NUM={um:1,uma:1,dois:2,duas:2,"três":3,tres:3,quatro:4,cinco:5,dez:10,quinze:15,vinte:20,trinta:30,quarenta:40,cinquenta:50};
    const v=x=>NUM[x.toLowerCase()]??+x,NS="\\d+|dez|quinze|vinte|trinta|quarenta|cinquenta";
    const mm=new RegExp(`\\b(\\d|um|uma|dois|duas|tr[eê]s|quatro|cinco)\\s+minutos?(?:\\s+e\\s+(${NS})\\s+segundos)?\\b`,"i").exec(hoje);
    const ms=/\b(\d)\s*min\s*(\d\d)\b/i.exec(hoje);
    const ss=new RegExp(`\\b(${NS})\\s+segundos\\b`,"i").exec(hoje);
    const t=mm?v(mm[1])*60+(mm[2]?v(mm[2]):0):ms?+ms[1]*60+ +ms[2]:ss?v(ss[1]):null;
    if(t!=null&&Math.abs(t-f.segundos)>(mm&&!mm[2]?45:20))return"tempo descrito errado";
  }
  /* a pauta é instrução, não fala (medido no modelo: "Nosso foco é entender
     como a finalização apareceu, então me conta...") */
  if(/\b(?:nosso foco|a pauta|minha pauta|o foco (?:aqui|desta pergunta|da pergunta))\b/i.test(p))return"pauta vazou na pergunta";
  /* o motor dá o total das quedas, não o de cada round (medido no modelo:
     "no segundo round, você derrubou o adversário duas vezes" com 2 quedas
     na luta toda); knockdown tem round no log e vale */
  if(f.round>1)for(const fr of hoje.split(/(?<=[.!?;])\s+/)){
    const rd=/\b(primeiro|segundo|terceiro|quarto|quinto)\s+round\b/i.exec(fr);
    const nq=/\b(\d+|duas|dois|tr[eê]s|quatro|cinco|seis)\s+(?:quedas|vezes)\b/i.exec(fr);
    if(!rd||!nq||!/\bquedas?\b|\blevou\b[^.?!]{0,30}\bch[aã]o\b|\bderrub/i.test(fr))continue;
    const NQ={duas:2,dois:2,"três":3,tres:3,quatro:4,cinco:5,seis:6};
    const n=NQ[nq[1].toLowerCase()]||+nq[1],r=ORDINAL.indexOf(rd[1].toLowerCase())+1;
    if(!(/\bderrub/i.test(fr)&&f.kds.filter(k=>k.round===r).length>=n))return"número fora dos fatos";
  }
  /* golpe ou posição que não está no que o motor registrou (medido: "o
     clinch do segundo round" sem clinch nenhum na luta) */
  const tec=/\b(clinch|jab|cruzado|uppercut|gancho|chute|joelhada|cotovelada|mata-le[aã]o|guilhotina|tri[aâ]ngulo|armlock|kimura|americana|chave de bra[çc]o|chave de p[eé]|ground and pound|guarda)\b/i.exec(hoje);
  if(tec&&!new RegExp(escRe(tec[1]),"i").test(f.textoDoLog||""))return"golpe que não está na luta";
  const oppNome=String(f.opp||"").split(/\s+/).filter(w=>w.length>2).map(escRe).join("|")||"\\u0000";
  /* nome de adversário desta luta ou da anterior também liga a pergunta à carreira */
  const nomesDaLuta=[f.opp,f.anterior&&f.anterior.adv].filter(Boolean).join(" ").split(/\s+/).filter(w=>w.length>2).map(escRe).join("|")||"\\u0000";
  if(new RegExp(`\\b(?:treinador|t[eé]cnico|corner|equipe|empres[aá]rio|torcida|torcedor(?:es)?|[aá]rbitro|juiz|m[eé]dico|advers[aá]rio|${oppNome})\\b[^.?!]{0,40}\\b(?:disse|falou|gritou|pediu|mandou|avisou|comentou|reclamou|garantiu|prometeu|xingou|provocou|chamou)\\s+(?:que\\b|:|["'“])`,"i").test(p)
    ||/\bsegundo (?:o|a|os|as) (?:seu |sua )?(?:treinador|t[eé]cnico|equipe|torcida|advers[aá]rio)/i.test(p))return"fala de terceiro sem evidência";
  if(/\?\s*$/.test(final)&&/\bou\b/i.test(final)&&final.replace(/[?!.,]/g,"").trim().split(/\s+/).length<=9)return"escolha vazia";
  if(PERGUNTA_GENERICA.test(p))return"genérica";
  if(!ANCORA_DA_LUTA.test(p)&&!/'[^']{3,}'/.test(p)&&!new RegExp(`\\b(?:${nomesDaLuta})\\b`,"i").test(p))return"sem ligação com a luta";
  if(frases.some(fr=>!/\?\s*$/.test(fr)&&/\bvoc[eê]\s+(?:ficou|estava|est[aá]|se sentiu|sentiu)\s+(?:muito\s+)?(?:nervos|frustrad|abalad|emocionad|irritad|desesperad|com raiva|com medo|aliviad|feliz|triste)/i.test(fr)))return"emoção afirmada";
  return null;
}
/* O que vai pra IA na cena da entrevista (a tela e a suíte entrevista usam
   a mesma função) */
function pedidoDaEntrevista(cache,{opp,r,won,td0,tdt0,zebra,titleFight,amostra},token){
  const{reporter,dados,lesaoTxt,historicoRival}=cache;
  return{name:me.name,record:`${st.wins}-${st.losses}`,followers:fmtNum(st.followers),fan:st.fan.toFixed(1),
    opp:opp.name,ganhou:won,metodo:r.method,round:r.round,clock:r.clock,tdApl:td0,tdSof:tdt0,zebra:!!zebra,
    title:!!titleFight,lesao:lesaoTxt,historicoRival,reporter:`${reporter.nome} (${reporter.veiculo})`,linhaReporter:reporter.linha,
    resumo:dados.resumo,pauta:dados.pauta,fato:dados.fato,angulo:dados.pauta,dossie:dados.dossie,
    eventoBase:dados.eventoBase,eventosUsados:eventosUsados("entrevista"),recentes:cenasRecentesPrompt("entrevista"),token,amostra};
}
/* Monta a entrevista (só no primeiro abrir de cada luta; depois vem do
   cache): fala da coletiva (memória) ou pauta, repórter, evento, molde
   local e o que vai pra IA. Os efeitos (fala cobrada, pauta usada, passado,
   lesão tratada) acontecem aqui, uma vez. */
function prepararEntrevista({opp,r,titleFight,won,td0,tdt0,zebra,ehRival,amostra=false}){
  const n=narrativaDa(),olhou=!!n.passado.entrevista;
  /* na entrevista a lesão vai em texto natural ("uma lesão que afeta a defesa
     de golpes"), não no rótulo do atributo ("Defesa de golpes machucado(a)") */
  const LESAO_AFETA={slpm:"o volume de golpes",strDef:"a defesa de golpes",tdAvg:"as quedas",tdDef:"a defesa de queda",
    subAvg:"as finalizações",kdAvg:"o poder de nocaute",durability:"o queixo",reach:"o alcance"};
  const lesaoTxt=st.lesao?`uma lesão que afeta ${LESAO_AFETA[st.lesao.atributo]||"o jogo dele"}`:null;
  const chaveLesao=st.lesao?`${st.lesao.atributo}:${st.lesao.desdeLuta}`:null;
  const lesaoNova=lesaoPraEntrevista(lesaoTxt);
  const f=fatosDaLuta(r,won,opp,td0,tdt0,{titulo:titleFight,zebra,lesao:lesaoNova});
  const falaCol=falaColetivaPraEntrevista(amostra);
  if(falaCol)falaCol.cobrada++;
  const pauta=falaCol?null:escolherPauta(f,olhou);
  if(pauta&&pauta.id==="lesao")n.lesaoTratada=chaveLesao;
  n.passado.entrevista=!!(falaCol||(pauta&&pauta.passado));
  const sitFala=falaCol?situacaoDaFala(falaCol):null;
  const evento=eventoDaEntrevista(f);
  const local={evento,pergunta:falaCol?perguntaSobreFala(falaCol,sitFala):perguntaDaPauta(pauta,f)};
  const reporter=reporterDaCena("entrevista",pauta?pauta.id:"geral");
  return{f,falaCol,sitFala,pauta,local,reporter,lesaoTxt,historicoRival:ehRival?historicoRivalTexto():null,
    dados:{resumo:resumoDaLuta(f),
      pauta:falaCol?(["cumpriu","parcial","quebrou","contradisse"].includes(sitFala.tipo)
        ?"confrontar a fala da coletiva com o resultado da luta"
        :"retomar a fala da coletiva e perguntar como a luta saiu, sem inventar contradição"):pauta.intencao(f),
      fato:falaCol?`antes desta luta, na coletiva, ele disse: "${falaCol.trecho}". O que aconteceu: ${sitFala.txt}`:pauta.fato(f),
      dossie:pauta&&pauta.passado?dossieCarreira(1):null,eventoBase:evento}};
}
/* Resume o histórico de um Rival em texto curto pro prompt: a MESMA frase
   pra coletiva e entrevista. null quando não há histórico (1º encontro). */
function historicoRivalTexto(){
  if(!st.rival||!st.rival.historico.length)return null;
  const linhas=st.rival.historico.map(h=>`${h.ganhou?"você venceu":"ele venceu"} por ${h.metodo.toLowerCase()}`);
  return `${st.rival.historico.length}º encontro entre os dois. Anteriores: ${linhas.join("; ")}.`;
}
/* O convite fica no embrulho da luta (pós-luta, que depois vai pro Cartel).
   Convite de luta anterior sem resposta some quando a próxima luta chama
   de novo (achado jogando, 2026-09-22); respondido, vira o resumo da
   entrevista e fica no histórico. */
let entrevistaWrapAtual=null,entrevistaWrapRespondida=true;
function renderBotaoEntrevista(bouts,opp,r,titleFight,won,td0,tdt0,zebra,ehRival){
  if(entrevistaWrapAtual&&!entrevistaWrapRespondida)entrevistaWrapAtual.innerHTML="";
  const wrap=el("div","entrevista-convite");
  entrevistaWrapAtual=wrap;entrevistaWrapRespondida=false;
  const btn=el("button","botao botao-sec",`${ICONE("microfone")}<span>Dar entrevista</span>`);
  btn.type="button";
  bouts.appendChild(wrap);
  const luta=fightNo;
  /* a amostra foi recusada depois de o convite nascer aberto: volta a ser
     o convite travado do grátis */
  const travarConvite=()=>{
    if(entrevistaWrapAtual!==wrap||entrevistaWrapRespondida)return;
    wrap.innerHTML="";wrap.appendChild(bloqueioPro(btn));
  };
  btn.onclick=()=>{
    SOM.toque();
    const amostra=!meuPro&&amostraLiberada("entrevista");
    if(!meuPro&&!amostra)return travarConvite();
    if(luta!==fightNo||entrevistaWrapAtual!==wrap||entrevistaWrapRespondida)return;
    abrirCenaEntrevista({wrap,opp,r,titleFight,won,td0,tdt0,zebra,ehRival,amostra,aoNegar:travarConvite});
  };
  /* Revamp fase 5: sem Pro o convite aparece travado pelo componente
     único bloqueioPro() (a vitrine continua, o clique não). Na 1ª luta
     da carreira ele vem aberto, com o selo da amostra grátis. */
  if(!meuPro&&amostraLiberada("entrevista"))
    wrap.append(btn,el("span","amostra-selo",`${ICONE("estrela")}<span>Amostra do Pro</span>`));
  else wrap.appendChild(bloqueioPro(btn));
}
/* A entrevista abre como etapa própria da noite (fundo do lugar), no mesmo
   #escolha da oferta/camp/coletiva. entrevistaAberta trava "Próxima luta"
   até o jogador sair dela (Continuar ou Voltar ao resultado). */
function abrirCenaEntrevista({wrap,opp,r,titleFight,won,td0,tdt0,zebra,ehRival,amostra=false,aoNegar=null}){
  const box=document.getElementById("escolha");
  if(!box)return;
  entrevistaAberta=true;
  box.style.display="";
  const ct=++CENA_TOKEN;
  const chave=`${SEED}:${fightNo}:${opp.name}`;
  if(!cacheEntrevista||cacheEntrevista.chave!==chave)
    cacheEntrevista={chave,...prepararEntrevista({opp,r,titleFight,won,td0,tdt0,zebra,ehRival,amostra}),cena:null,promessa:null};
  const cache=cacheEntrevista,{reporter,falaCol,sitFala,local,f,lesaoTxt,historicoRival}=cache;
  const falaColetiva=falaCol?{trecho:falaCol.trecho,situacao:sitFala.txt}:null;
  cenaGuardada(cache,local,token=>ai("entrevistaCena",pedidoDaEntrevista(cache,{opp,r,won,td0,tdt0,zebra,titleFight,amostra},token)),
    "entrevista",{permitidas:falaCol?[falaCol.texto]:[],exige:falaCol?falaCol.texto:null,amostra,nomes:[opp.name],fatos:f});

  box.innerHTML="";
  box.appendChild(el("div","esc-hd",`Entrevista · ${won?"depois da vitória":"depois da derrota"}`));
  const meio=montarCena(box,"entrevista",reporter,"entrevista-microfone");
  const p=pecasDaConversa("ent",reporter);
  const area=el("div","cena-responder",`<textarea id="entresp" maxlength="200" rows="3" placeholder="Sua resposta"></textarea>
      <button class="botao" id="entgo" type="button">Responder</button>`);
  p.resp.appendChild(area);
  const voltar=el("button","botao botao-sec","Voltar ao resultado");voltar.id="entvoltar";voltar.type="button";
  p.acoes.appendChild(voltar);
  const faixa=amostra?faixaAmostra("A entrevista da primeira luta também vem sem o Pro. A reação da imprensa mexe nos seus seguidores e no seu fã."):null;
  if(faixa)meio.appendChild(faixa);
  meio.append(p.memoria,p.evento,p.fala,p.resp,p.desfecho,p.acoes);
  if(falaCol)mostrarMemoria(p,"Na coletiva você disse",falaCol);
  const inp=document.getElementById("entresp"),go=document.getElementById("entgo");
  const cresce=()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";};
  inp.addEventListener("input",cresce);
  manterBotaoVisivel(inp,go);
  const sair=()=>{CENA_TOKEN++;entrevistaAberta=false;box.style.display="none";box.innerHTML="";};
  const fundoResultado=won?"confete":"apagado";
  voltar.onclick=()=>{SOM.toque();sair();mostrarNoite("resultado",fundoResultado);};
  let cena=cache.cena||local;
  if(cache.cena){mostrarPergunta(p,reporter,cena);if(!semHover())inp.focus();}
  else{
    inp.disabled=true;go.disabled=true;
    const tk=CARREIRA_TOKEN;
    cache.promessa.then(c=>{
      if(tk!==CARREIRA_TOKEN||ct!==CENA_TOKEN)return;
      cena=c;mostrarPergunta(p,reporter,c);
      if(amostra&&AMOSTRA_NEGADA){travarAmostra(p,area,faixa);if(aoNegar)aoNegar();return;}
      inp.disabled=false;go.disabled=false;if(!semHover())inp.focus();
    });
  }
  go.onclick=async()=>{
    const txt=inp.value.trim();
    if(!txt)return inp.focus();
    if(!meuPro&&!(amostra&&!AMOSTRA_NEGADA))return;
    go.disabled=true;inp.disabled=true;go.textContent="…";voltar.hidden=true;
    const tk=CARREIRA_TOKEN;
    const token=await meuAccessToken();
    const j=conteudoInseguro(txt)?null:await ai("entrevista",{name:me.name,opp:opp.name,
      ganhou:won,metodo:r.method,round:r.round,clock:r.clock,tdApl:td0,tdSof:tdt0,
      zebra:!!zebra,title:!!titleFight,lesao:lesaoTxt,evento:cena.evento,pergunta:cena.pergunta,resposta:txt,
      record:`${st.wins}-${st.losses}`,followers:fmtNum(st.followers),fan:st.fan.toFixed(1),
      rendaBase:RENDA_BASE,historicoRival,falaColetiva,token,amostra});
    if(tk!==CARREIRA_TOKEN||ct!==CENA_TOKEN)return;
    aplicarEntrevista({p,wrap,cena,txt,j,sair,fundoResultado,opp,falaCol});
  };
  SOM.flashes();
  mostrarNoite("entrevista");
}
/* Fala da coletiva desta luta que a entrevista cobra. Na amostra grátis
   qualquer fala volta (é a continuidade que a amostra mostra). No Pro
   (narrativa 2026-10-01), só quando o resultado deixa a fala notável
   (promessa cumprida, quebrada ou pela metade; provocação seguida de
   derrota) e a entrevista anterior não olhou pro passado. Medido antes:
   67% das entrevistas citavam a fala. */
function falaColetivaPraEntrevista(amostra){
  const fc=memoriaDa().falas.find(f=>f.onde==="coletiva"&&f.luta===fightNo&&f.resultado);
  if(!fc||fc.cobrada>=2)return null;
  if(amostra)return fc;
  const notavel=["cumpriu","parcial","quebrou","contradisse"].includes(situacaoDaFala(fc).tipo);
  return notavel&&!narrativaDa().passado.entrevista?fc:null;
}
/* lesão vira o fato obrigatório da entrevista uma vez por lesão */
function lesaoPraEntrevista(lesaoTxt){
  const k=st.lesao?`${st.lesao.atributo}:${st.lesao.desdeLuta}`:null;
  return k&&narrativaDa().lesaoTratada!==k?lesaoTxt:null;
}
/* Botão "Continuar" depois da entrevista (2026-09-22, pedido explícito:
   "não tá dando tempo de ler"): entrevistaAberta trava a próxima luta até
   ele ser clicado, e aí segue pra próxima luta de propósito. Na última luta
   ou com dilema aberto não há próxima luta pra abrir: volta pro resultado. */
function aplicarEntrevista({p,wrap,cena,txt,j:jBruto,sair,fundoResultado,opp=null,falaCol=null}){
  /* reação que atribui ao jogador uma citação que ele não disse vale como
     reação nenhuma (mesma rede de baixo do conteúdo inseguro) */
  const j=(jBruto&&(conteudoInseguro(jBruto.reacao)||
    !falasAtribuidasOk(jBruto.reacao,[txt].concat(falaCol?[falaCol.texto]:[]),me.name,{exigeCitacao:false})))?null:jBruto;
  /* memória narrativa: a resposta literal da entrevista também vira fala */
  registrarFala({onde:"entrevista",luta:fightNo,adv:opp?opp.name:"",texto:txt,decl:j&&j.declaracao});
  const dFan=lim(j&&j.fa,-2,2,0);
  const dSeg=lim(j&&j.seguidores,-.30,.50,0);
  const mencionaDinheiro=MENCIONA_DINHEIRO.test(semAcento(j&&j.reacao||""));
  const dDinheiro=mencionaDinheiro?Math.round(RENDA_BASE*lim(j&&j.dinheiro,-1,1,0)):0;
  const antes=st.followers;
  st.followers=Math.max(120,Math.round(st.followers*(1+dSeg)));
  st.fan=Math.max(0,Math.min(10,st.fan+dFan));
  st.dinheiro=Math.max(0,(st.dinheiro||0)+dDinheiro);
  const dif=st.followers-antes;
  st.entrevistasFeitas=(st.entrevistasFeitas||0)+1;
  const bruto=(j&&j.reacao)?String(j.reacao).slice(0,800):"";
  const reacao=semTag(bruto||fraseFallback());
  entrevistaWrapRespondida=true;             // fica pra sempre no histórico, não é mais "pendente"
  registrarExtra({tipo:"entrevista",cena:`${cena.evento?semTag(cena.evento)+" ":""}"${semTag(cena.pergunta)}"`,
    resposta:semTag(txt),texto:reacao});
  const fx=`<div class="dil-fx">
      ${dif!==0?`<span class="delta ${dif>=0?"up":"down"}">${dif>=0?"+":"−"}${fmtNum(Math.abs(dif))} seguidores</span>`:""}
      ${Math.abs(dFan)>=0.05?`<span class="delta ${dFan>=0?"up":"down"}">${dFan>=0?"+":"−"}${Math.abs(dFan).toFixed(1)} de fã</span>`:""}
      ${dDinheiro!==0?`<span class="delta ${dDinheiro>=0?"up":"down"}">${dDinheiro>=0?"+":"−"}R$${fmtNum(Math.abs(dDinheiro))}</span>`:""}</div>`;
  /* resumo no embrulho da luta: é o que vai pro Cartel */
  wrap.innerHTML=`<div class="dil-eyebrow">Entrevista</div>
    <div class="dil-c">"${semTag(cena.pergunta)}"</div>
    <div class="dil-r">"${semTag(txt)}"</div>
    <div class="dil-o">${reacao}</div>${fx}`;
  mostrarResposta(p,txt);
  mostrarDesfecho(p,reacao,fx);
  p.acoes.innerHTML="";
  const semProxima=()=>fightNo>=TOTAL_FIGHTS||dilemaAberto;
  const cont=el("button","botao",semProxima()?"Voltar ao resultado":"Continuar pra próxima luta");
  cont.id="entcontinuar";cont.type="button";
  cont.onclick=()=>{
    SOM.toque();
    sair();
    atualizarControles();
    if(semProxima())mostrarNoite("resultado",fundoResultado);
    else nextFight();
  };
  p.acoes.appendChild(cont);
  renderFicha();
  salvarCarreira();
}


/* =========================================================================
   BONECO v2 (revamp dos personagens, 2026-09-28): meio-corpo desenhado por
   código, sem imagem. Traço grosso, sombra em bloco do lado direito e luz de
   palco vermelha na borda esquerda (identidade "Noite de Luta"). Oito
   arquétipos tirados de estilos reais de MMA (ARQUETIPOS) e as peças que o
   criador mistura. Aprovado pelo dono em 2026-09-28, sem o protetor bucal.
   Só o lutador do JOGADOR tem rosto: os lutadores reais continuam sem
   retrato (direito de imagem).

   pele (8 tons), cabelo (raspado, máquina, curto, social, topete, moicano,
   coque, dreads, longo), corCabelo (12 cores), barba (nenhuma, por fazer,
   bigode, cavanhaque, curta, média, cheia, costeleta), cicatriz (nenhuma,

   cores). Olhos, sobrancelha e boca não existem mais (o protetor bucal da
   boca antiga saiu a pedido do dono). */
function normalizarRosto(c){
  const num=(v,n)=>{ const x=Math.floor(Number(v)); return Number.isFinite(x)?((x%n)+n)%n:0; };
  if(c&&c.v===2){
    const f={v:2};
    const listas={pele:PELES,porte:PORTES,cabelo:CABELO_TIPOS,corCabelo:CORES_CABELO,barba:BARBAS,orelha:ORELHAS,
      nariz:NARIZES,cicatriz:CICATRIZES,tatuagem:TATUAGENS,entrada:ENTRADAS,prajiad:PRAJIADS,corEntrada:CORES_ENTRADA};
    for(const k in listas)f[k]=num(c[k],listas[k].length);
    if(typeof c.arquetipo==="string"&&ARQUETIPOS.some(a=>a.id===c.arquetipo))f.arquetipo=c.arquetipo;
    return f;
  }
  const o=c||{};
  return{v:2,
    pele:Math.min(5,Math.round(num(o.pele,8)*5/7)),
    porte:num(o.porte??1,3),
    cabelo:[0,1,1,1,7,2,5,4,5][num(o.cabelo??2,9)],
    corCabelo:[0,0,1,2,2,3,3,5,6,5,4,0][num(o.corCabelo??1,12)],
    barba:[0,1,5,4,1,3,3,1][num(o.barba??1,8)],
    orelha:0,nariz:0,
    cicatriz:[0,1,2,2,2,2][num(o.cicatriz,6)],
    tatuagem:0,entrada:0,prajiad:0,
    corEntrada:[0,2,3,7,4,5,2,1][num(o.calcao,8)]};
}

/* Hash estável: o mesmo lutador tem sempre o mesmo rosto, em qualquer sessão. */
function hashNome(s){
  let x=2166136261>>>0;
  for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0;}
  return x;
}
function cfgPadrao(){
  return{v:2,pele:2,porte:1,cabelo:1,corCabelo:0,barba:1,orelha:0,nariz:0,cicatriz:0,
         tatuagem:0,entrada:0,prajiad:0,corEntrada:0};
}
/* Não existe rosto para os lutadores do dataset, e é deliberado: eles são
   pessoas reais e retrato reconhecível é direito de imagem. Só o lutador do
   jogador tem rosto. A função que derivava rosto de lutador real foi removida
   em vez de deixada sem uso, para ninguém reintroduzir sem querer. */

/* =========================================================================
   CARD COMPARTILHÁVEL
   Desenhado em canvas 1080x1350 (retrato, formato de story e de timeline).
   O importante não é a imagem: é a semente impressa nela. Com ela, quem vê
   pode jogar a MESMA carreira — mesmas cartas, mesmos adversários — e comparar.
   ========================================================================= */
const CARD_W=1080, CARD_H=1350;
/* O canvas não enxerga as variáveis CSS, então a paleta é repetida aqui
   (revamp fase 5: identidade "Noite de Luta", a mesma do :root em
   estilo.css). Mexeu lá, mexa aqui. */
const C={fundo:"#07080B",sup:"#11131A",sup2:"#1A1D26",osso:"#F2EEE6",osso2:"#C9CBD2",cinza:"#8A8F9C",
         sangue:"#D7261E",ouro:"#D4A017",ganho:"#2FBF71",linha:"rgba(255,255,255,.10)",linhaForte:"rgba(255,255,255,.20)"};
const FONTE={
  titulo:p=>`400 ${p}px Anton,Impact,"Arial Narrow",sans-serif`,
  ui:(p,w=700)=>`${w} ${p}px "Barlow Condensed","Arial Narrow",sans-serif`,
  texto:(p,w=400,it=false)=>`${it?"italic ":""}${w} ${p}px Barlow,system-ui,sans-serif`,
};
/* Fonte que ainda não apareceu na página não existe pro canvas: mede e
   desenha com a de reserva. Espera as três famílias antes de qualquer
   measureText. */
async function garantirFontesCard(){
  try{
    if(!document.fonts||!document.fonts.load)return;
    await Promise.all([FONTE.titulo(100),FONTE.ui(40,700),FONTE.ui(40,600),FONTE.texto(34,400,true),FONTE.texto(30,500)]
      .map(f=>document.fonts.load(f)));
    await document.fonts.ready;
  }catch(e){}
}
/* letterSpacing no canvas só existe em navegador novo; sem ele o texto só
   sai sem o espaçamento, nada quebra */
function espacar(x,px){ try{ if("letterSpacing" in x)x.letterSpacing=px+"px"; }catch(e){} }
function carregarImagem(src){
  return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;});
}
/* Foto da série de fundos do jogo cobrindo o card, escurecida de cima pra
   baixo: a parte de cima respira, a de baixo vira fundo liso pro texto. */
async function fotoCard(x,nome,w,h){
  try{
    const img=await carregarImagem(`img/${nome}.webp`);
    const esc=Math.max(w/img.width,h*.72/img.height);
    const iw=img.width*esc,ih=img.height*esc;
    x.save();x.globalAlpha=.95;x.drawImage(img,(w-iw)/2,0,iw,ih);x.restore();
  }catch(e){/* sem foto o card sai no fundo liso, nunca quebra o compartilhar */}
  const gr=x.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,"rgba(7,8,11,.30)");gr.addColorStop(.30,"rgba(7,8,11,.62)");
  gr.addColorStop(.52,"rgba(7,8,11,.93)");gr.addColorStop(1,"rgba(7,8,11,.98)");
  x.fillStyle=gr;x.fillRect(0,0,w,h);
}
function quebrar(ctx,txt,max){
  const linhas=[];let atual="";
  for(const p of String(txt).split(" ")){
    const t=atual?atual+" "+p:p;
    if(ctx.measureText(t).width>max&&atual){linhas.push(atual);atual=p;}
    else atual=t;
  }
  if(atual)linhas.push(atual);
  return linhas;
}

/* Plano Pro (item 5) — acabamento do card, opção A do plano aprovado:
   contorno duplo + canto cortado. Reconhecível de relance, SEM escrever
   "PRO" em letra grande — moldura, selo, na paleta que já existe (C.ouro,
   mesma cor de raridade das conquistas), nunca gradiente/brilho/cor nova.
   Card grátis continua pixel a pixel igual a antes; só entra quando
   meuPro é true no momento de gerar o card (é o próprio card que vira
   propaganda do plano quando compartilhado, não precisa de texto dizendo
   isso). Compartilhado pelos dois cards (fim de carreira e momento) —
   um único desenho, não dois inventados. */
const CORTE_CANTO_PRO=34;
/* 3 modelos de card (2026-09-22, pedido explícito) — mesmo corte/contorno
   de sempre, só a cor de destaque muda. "Ouro" é EXATAMENTE C.ouro: quem
   já é Pro hoje não pode ver o card mudar de cor sozinho, então o padrão
   tem que ser bit-a-bit igual ao que já existia. */
const CORES_CARD_PRO=[
  {id:"ouro",nome:"Ouro",cor:"#D4A017"},
  {id:"prata",nome:"Prata",cor:"#A9B2BC"},
  {id:"bronze",nome:"Bronze",cor:"#A9683A"},
];
let corCardProEscolha=(()=>{try{const v=parseInt(localStorage.getItem("corCardPro"),10);
  return(v>=0&&v<CORES_CARD_PRO.length)?v:0;}catch(e){return 0;}})();
function definirCorCardPro(i){
  corCardProEscolha=i;
  try{localStorage.setItem("corCardPro",String(i));}catch(e){}
}
function fundoCard(x,w,h,pro,cor){
  cor=cor||CORES_CARD_PRO[corCardProEscolha].cor;
  x.save();
  x.beginPath();
  if(pro){
    x.moveTo(CORTE_CANTO_PRO,0);x.lineTo(w,0);x.lineTo(w,h);x.lineTo(0,h);
    x.lineTo(0,CORTE_CANTO_PRO);x.closePath();
  }else x.rect(0,0,w,h);
  x.fillStyle=C.fundo;x.fill();
  x.restore();
  if(!pro)return;
  x.strokeStyle=cor;x.lineWidth=2;
  x.beginPath();
  x.moveTo(CORTE_CANTO_PRO,0);x.lineTo(w,0);x.lineTo(w,h);x.lineTo(0,h);
  x.lineTo(0,CORTE_CANTO_PRO);x.closePath();x.stroke();
  const o=14;                                   // régua interna, recuada — o "duplo" do contorno
  x.beginPath();
  x.moveTo(CORTE_CANTO_PRO+o,o);x.lineTo(w-o,o);x.lineTo(w-o,h-o);x.lineTo(o,h-o);
  x.lineTo(o,CORTE_CANTO_PRO+o);x.closePath();x.stroke();
}
/* Granulação por cima de tudo (mesma textura de filme da interface),
   gerada com gerador próprio: nunca toca nos 8 geradores da carreira. */
function granularCard(x,w,h){
  let s=987654321;const r=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  x.save();
  for(let i=0;i<Math.round(w*h/260);i++){
    x.fillStyle=r()<.5?"rgba(255,255,255,.05)":"rgba(0,0,0,.18)";
    x.fillRect(r()*w,r()*h,1.4,1.4);
  }
  x.restore();
}
/* Selo: octógono sólido, do tamanho de uma inicial — glifo, nunca texto
   "PRO". Fica no canto oposto ao rodapé octogono.fun (que é sempre
   alinhado à direita), pra não competir com ele. */
function seloProCanvas(x,cx,cy,r,cor){
  x.save();x.translate(cx,cy);
  x.beginPath();
  for(let i=0;i<8;i++){
    const ang=Math.PI/8+i*Math.PI/4,px=Math.cos(ang)*r,py=Math.sin(ang)*r;
    i===0?x.moveTo(px,py):x.lineTo(px,py);
  }
  x.closePath();x.fillStyle=cor||CORES_CARD_PRO[corCardProEscolha].cor;x.fill();
  x.restore();
}
/* Peças comuns dos cards (revamp fase 5). */
function cabecalhoCard(x,M,direita,subtitulo){
  x.textBaseline="alphabetic";x.textAlign="left";
  x.fillStyle=C.sangue;x.fillRect(M,M,70,6);
  x.fillStyle=C.osso;x.font=FONTE.titulo(52);x.fillText("OCTÓGONO",M,M+66);
  if(subtitulo){x.fillStyle=C.cinza;x.font=FONTE.texto(23,400,true);x.fillText(subtitulo,M,M+102);}
  if(direita){
    x.textAlign="right";x.fillStyle=C.sangue;x.font=FONTE.ui(25,700);espacar(x,4);
    x.fillText(direita.toUpperCase(),CARD_W-M,M+60);espacar(x,0);x.textAlign="left";
  }
}
/* Carimbo quadrado girado: nota da carreira (uma letra) ou rótulo do
   momento (1 a 3 linhas, a fonte encolhe até caber na caixa). */
function carimboCard(x,cx,cy,texto,{ouro=false,lado=190}={}){
  x.save();x.translate(cx,cy);x.rotate(-4*Math.PI/180);
  x.fillStyle=ouro?C.ouro:C.sangue;x.fillRect(-lado/2,-lado/2,lado,lado);
  x.fillStyle=ouro?"#15120A":"#FFFFFF";x.textAlign="center";x.textBaseline="middle";
  const max=lado-28;
  let t=texto.length<=2?168:66,linhas=[texto];
  for(;t>=20;t-=2){
    x.font=FONTE.titulo(t);linhas=quebrar(x,texto,max);
    if(linhas.length<=3&&linhas.every(l=>x.measureText(l).width<=max)&&linhas.length*t<=lado-22)break;
  }
  const alt=linhas.length*t;
  linhas.forEach((l,i)=>x.fillText(l,0,-alt/2+t/2+i*t+(texto.length<=2?8:3)));
  x.restore();x.textAlign="left";x.textBaseline="alphabetic";
}
function avatarCard(x,src,px,py,w,h){
  return svgParaImagem(src).then(img=>x.drawImage(img,px,py,w,h)).catch(()=>{});
}
function nomeCard(x,nome,txX,y0,txW,{max=108,min=48}={}){
  let t=max;x.font=FONTE.titulo(t);
  while(x.measureText(nome).width>txW&&t>min){t-=4;x.font=FONTE.titulo(t);}
  const ls=quebrar(x,nome,txW).slice(0,2);
  x.fillStyle=C.osso;
  ls.forEach((l,i)=>x.fillText(l,txX,y0+t+i*t*.96));
  return y0+t+(ls.length-1)*t*.96;
}
function rodapeCard(x,M,h,pro,cor,semente){
  const yf=h-M-74;
  x.fillStyle=C.linhaForte;x.fillRect(M,yf,CARD_W-M*2,2);
  x.textAlign="left";x.fillStyle=C.osso;x.font=FONTE.ui(28,700);espacar(x,3);
  x.fillText("JOGUE COM A MESMA SEMENTE",M+(pro?34:0),yf+50);espacar(x,0);
  x.textAlign="right";x.fillStyle=C.sangue;x.font=FONTE.titulo(48);x.fillText(semente,CARD_W-M,yf+58);
  x.fillStyle=C.cinza;x.font=FONTE.ui(22,700);espacar(x,4);x.fillText(DOMINIO_JOGO.toUpperCase(),CARD_W-M,yf+90);espacar(x,0);
  x.textAlign="left";
  if(pro)seloProCanvas(x,M+12,yf+40,13,cor);
}
/* Preview sintético pra vitrine do Plano Pro (item 2, 2026-09-22) — NÃO
   é desenharCard() de verdade: aquele lê me/st/DIVISION, que só existem
   com uma carreira real. Síncrono (a vitrine desenha na hora), por isso
   usa brilho de refletor no lugar da foto de fundo. */
function desenharPreviewCard(pro,cor){
  const cv=document.createElement("canvas");
  cv.width=CARD_W;cv.height=CARD_H;
  const x=cv.getContext("2d");
  /* getContext("2d") pode vir null (harness de teste sem canvas de
     verdade, navegador raro sem suporte): devolve o canvas em branco. */
  if(!x)return cv;
  const M=72;
  fundoCard(x,CARD_W,CARD_H,pro,cor);
  const rg=x.createRadialGradient(CARD_W*.5,-40,20,CARD_W*.5,-40,CARD_H*.85);
  rg.addColorStop(0,"rgba(215,38,30,.38)");rg.addColorStop(1,"rgba(7,8,11,0)");
  x.fillStyle=rg;x.fillRect(0,0,CARD_W,CARD_H);
  cabecalhoCard(x,M,"Carreira encerrada");
  x.fillStyle=C.osso;x.font=FONTE.titulo(104);x.fillText("SEU LUTADOR",M,M+300);
  x.font=FONTE.titulo(230);x.fillText("14-2",M,M+560);
  x.fillStyle=C.cinza;x.font=FONTE.ui(26,700);espacar(x,5);x.fillText("CARTEL",M+6,M+604);espacar(x,0);
  carimboCard(x,CARD_W-M-110,M+420,"A");
  rodapeCard(x,M,CARD_H,pro,cor,"#EXEMPLO");
  granularCard(x,CARD_W,CARD_H);
  return cv;
}
async function desenharCard(g){
  await garantirFontesCard();
  const cv=document.createElement("canvas");
  cv.width=CARD_W;cv.height=CARD_H;

  await fotoCard(x,(st.foiCampeao||st.title)?"cinturao":"arquibancada",CARD_W,CARD_H);
  cabecalhoCard(x,M,"Carreira encerrada");

  const avW=260,avH=Math.round(avW*1.2),avY=M+124;
  await avatarCard(x,bonecoSVG(ROSTO||cfgPadrao(),{w:avW}),M-8,avY,avW,avH);
  const txX=M+avW+14,txW=CARD_W-M-230-txX;

  const dv=(DIVISOES.find(d=>d.id===DIVISION)||{}).nome||DIVISION;
  x.fillStyle=C.cinza;x.font=FONTE.ui(26,700);espacar(x,4);
  x.fillText((dv+(MODO==="lenda"?" · Seja uma lenda":"")).toUpperCase(),txX,y+42);espacar(x,0);
  x.fillStyle=C.osso;x.font=FONTE.titulo(150);
  x.fillText(`${st.wins}-${st.losses}`,txX,avY+avH-26);
  x.fillStyle=C.cinza;x.font=FONTE.ui(24,700);espacar(x,5);x.fillText("CARTEL",txX+6,avY+avH+8);espacar(x,0);
  carimboCard(x,CARD_W-M-100,avY+104,g.letter,{ouro:g.letter==="S"});
  x.fillStyle=C.cinza;x.font=FONTE.ui(22,700);espacar(x,4);x.textAlign="center";
  x.fillText("NOTA",CARD_W-M-100,avY+244);x.textAlign="left";espacar(x,0);

  y=avY+avH+56;
  const cel=[["Pico no ranking",fmtPico(st.peak)],["Vitórias antes do fim",`${st.finishes} de ${st.wins}`],
    ["Maior sequência",`${st.longestW} vitórias`],["Seguidores",fmtNum(st.followers)],
    ["Medidor de fã",st.fan.toFixed(1)+" de 10"],["Cinturão",st.title?"Sim":"Não"]];
  const cw=(CARD_W-M*2)/2,ch=96;
  cel.forEach(([rot,val],i)=>{
    const cx=M+(i%2)*cw,cy=y+Math.floor(i/2)*ch;
    x.fillStyle=C.linha;x.fillRect(cx,cy,cw-(i%2?0:24),2);
    x.fillStyle=C.cinza;x.font=FONTE.ui(21,700);espacar(x,3);x.fillText(rot.toUpperCase(),cx,cy+36);espacar(x,0);
    x.fillStyle=(rot==="Cinturão"&&st.title)?C.ouro:C.osso;x.font=FONTE.titulo(46);x.fillText(String(val),cx,cy+86);
  });
  y+=ch*3+18;
  if(st.bonusNoite){
    x.fillStyle=C.ouro;x.font=FONTE.ui(24,700);espacar(x,3);
    x.fillText(`BÔNUS DA NOITE · LUTA ${st.bonusNoite.luta} CONTRA ${String(st.bonusNoite.adversario).toUpperCase()}`,M,y+10);espacar(x,0);y+=48;
  }
  x.font=FONTE.texto(33,400,true);
  const leg=LEGACY.find(l=>l.when(st)).t(me.name);
  const ls=quebrar(x,leg,CARD_W-M*2-34).slice(0,3);
  y+=30;
  x.fillStyle=C.sangue;x.fillRect(M,y-32,6,ls.length*44+8);
  x.fillStyle=C.osso;ls.forEach((l,i)=>x.fillText(l,M+30,y+i*44));
  y+=ls.length*44+26;
  const limite=CARD_H-M-74-24;
  if(y+34<limite){
    x.fillStyle=C.cinza;x.font=FONTE.ui(21,700);espacar(x,3);x.fillText("ESSE LUTADOR ERA FEITO DE",M,y);espacar(x,0);y+=34;
    x.fillStyle=C.osso2;x.font=FONTE.texto(23,500);
    quebrar(x,picks.map(p=>`${p.pair.label} do ${p.from}`).join("  ·  "),CARD_W-M*2).slice(0,2)
      .forEach(l=>{if(y<limite){x.fillText(l,M,y);y+=31;}});
  }
  rodapeCard(x,M,CARD_H,meuPro,null,"#"+SEED.toString(36).toUpperCase());
  granularCard(x,CARD_W,CARD_H);
  return cv;
}

/* Rótulo curto pro carimbo do card de momento — mesma caixa rotativa do
   desenharCard, etiqueta de 1-2 palavras em vez da nota A-F. Achado
   jogando (2026-09-08): "RARO" é nome interno de CATEGORIA, não fato —
   quem vê o print não entende por que aquele momento virou card. Cada
   rótulo agora diz o FATO ("CINTURÃO", "PERDEU O CINTURÃO", "ZEBRA",
   "ESTREIA NO MAIN CARD"), não a categoria. Dois tipos não têm fato fixo
   por design (o número muda a cada instância) — `ko` (tempo do nocaute)
   e `raro` (qual recorde específico) — esses são resolvidos por
   `rotuloMomento(m)`, não por esta tabela estática; entram aqui só como
   documentação do que cada tipo SIGNIFICA quando a tabela é a fonte. */
const ROTULO_MOMENTO={cinturao:"CINTURÃO",cinturaoPerdido:"PERDEU O CINTURÃO",
  upset:"ZEBRA",lesao:"VENCEU MACHUCADO",estreia:"ESTREIA NO MAIN CARD",
  cinturaoInterino:"CINTURÃO INTERINO",topoDivisao:"NÚMERO 1 DA TABELA",
  bonusNoite:"MELHOR ATUAÇÃO"};
/* raro é UMA categoria que cobre 3 recordes bem diferentes entre si (ver
   RARE, card:true) — não dá pra ter 1 rótulo estático pra "raro", cada
   id precisa dizer o recorde de verdade. invicto12/invicto18: o cartel
   JÁ É o rótulo (m.cartel, montado em criarMomento() no instante certo,
   antes do standing andar) — nenhuma tabela nova, reaproveita o que já
   existe. finishStreak não tem um número óbvio pra mostrar (é sobre NÃO
   ter ido aos cartões nenhuma vez), por isso ganha frase própria. */
const ROTULO_RARO={finishStreak:"NUNCA FOI AOS CARTÕES"};
/* Prioridade quando mais de um gatilho dispara NA MESMA LUTA (achado
   jogando: cinturão + 12-0 na mesma luta gerava DOIS cards, e o jogador
   só viu o card errado — raro, empurrado por último). Cinturão é o
   momento maior da carreira, sempre ganha; da metade pra baixo é
   julgamento de importância narrativa, não medido — cinturaoPerdido e
   estreia nunca competem entre si nem com cinturao/cinturaoInterino na
   prática (ramos won/lost são mutuamente exclusivos, e estreia só
   dispara ANTES de existir cinturao na mesma luta em título vencido —
   ver comentário de finishFight()), então só a ORDEM RELATIVA entre os
   que realisticamente colidem importa: cinturao/interino > upset/ko/
   lesao/raro (destaques de UMA luta) — cinturão continua sendo o fato
   maior mesmo disputado contra favorito, vencido rápido, ou com lesão. */
/* bonusNoite por último de propósito: "melhor atuação até agora" é comum
   (medido: 75-78% das carreiras batem pelo menos 1 recorde só na 2ª
   metade) — se colidir com QUALQUER outro tipo na mesma luta (achado
   escrevendo o teste: um 18-0 na luta 18 também é, por definição, a
   1ª vez que st.bonusNoite existe, e por isso também "bate recorde"),
   o outro tipo é sempre o fato mais especial. */
const ORDEM_MOMENTO=["cinturao","cinturaoInterino","cinturaoPerdido","estreia",
  "topoDivisao","upset","ko","lesao","raro","bonusNoite"];
function rotuloMomento(m){
  if(m.tipo==="raro")return ROTULO_RARO[m.raroId]||m.cartel;
  if(m.tipo==="ko"&&m.segundosKO!=null)return`NOCAUTE EM ${m.segundosKO}s`;
  return ROTULO_MOMENTO[m.tipo]||"MOMENTO";
}

/* SVG do busto -> <img> carregável, pra desenhar no canvas com drawImage().
   data: URI com encodeURIComponent (não btoa): bonecoSVG() é auto-contido —
   só paths/gradientes/clipPaths INTERNOS (url(#id) aponta pra <defs> do
   mesmo documento, nunca pra fora), width/height explícitos no <svg> raiz
   (não só viewBox) — os dois requisitos que historicamente quebravam
   SVG-em-canvas no Safari (tamanho 0 sem width/height; canvas "tainted" em
   toDataURL() com referência externa). Não dá pra testar num iPhone de
   verdade a partir daqui — conferir manualmente depois do deploy. */
function svgParaImagem(svg){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });
}

/* Fundo do card de momento: a foto combina com o que aconteceu. */
const FUNDO_MOMENTO={cinturao:"cinturao",cinturaoInterino:"cinturao",cinturaoPerdido:"apagado",ko:"confete",
  upset:"arena-alto",lesao:"vestiario",estreia:"entrada",topoDivisao:"arena",bonusNoite:"confete",raro:"fotos"};
async function desenharCardMomento(m){
  await garantirFontesCard();
  const cv=document.createElement("canvas");
  cv.width=CARD_W;cv.height=CARD_H;
  const x=cv.getContext("2d");
  const M=72;
  /* Altura dinâmica (achado jogando em produção): mede a frase e as
     linhas de dados ANTES de fixar a altura; frase curta não deixa um
     buraco vazio antes do rodapé. A largura nunca muda. */
  x.font=FONTE.texto(36,400,true);
  const lsFrase=quebrar(x,m.frase,CARD_W-M*2-34).slice(0,5);
  const avW=250,avH=Math.round(avW*1.2),avY=M+140;
  const dados=[["Adversário",m.adversario],["Resultado",m.resultado],["Posição na divisão",m.posicao]].filter(d=>d[1]);
  const yDados=avY+avH+64;
  const yFrase=yDados+dados.length*62+54;
  const H=Math.max(1060,yFrase+lsFrase.length*50+30+104+M);
  cv.width=CARD_W;cv.height=H;      // reseta o canvas pro tamanho final (nada foi desenhado ainda)

  fundoCard(x,CARD_W,H,meuPro);
  await fotoCard(x,FUNDO_MOMENTO[m.tipo]||"arena",CARD_W,H);
  cabecalhoCard(x,M,`Luta ${m.luta} de ${TOTAL_FIGHTS}`,"Monte seu lutador de MMA. Jogue a carreira inteira.");

  await avatarCard(x,bonecoSVG(ROSTO||cfgPadrao(),{w:avW}),M-8,avY,avW,avH);
  const txX=M+avW+14,txW=CARD_W-M-230-txX;
  const y=nomeCard(x,me.name.toUpperCase(),txX,avY+6,txW,{max:92,min:44});
  const dv=(DIVISOES.find(d=>d.id===DIVISION)||{}).nome||DIVISION;
  x.fillStyle=C.cinza;x.font=FONTE.ui(24,700);espacar(x,4);x.fillText(dv.toUpperCase(),txX,y+40);espacar(x,0);
  x.fillStyle=C.osso;x.font=FONTE.titulo(116);x.fillText(m.cartel,txX,avY+avH-22);
  x.fillStyle=C.cinza;x.font=FONTE.ui(22,700);espacar(x,5);x.fillText("CARTEL NA HORA",txX+4,avY+avH+10);espacar(x,0);
  carimboCard(x,CARD_W-M-100,avY+104,rotuloMomento(m),{ouro:/CINTUR/.test(rotuloMomento(m))&&m.tipo!=="cinturaoPerdido"});

  let yl=yDados;
  dados.forEach(([rot,val])=>{
    x.fillStyle=C.linha;x.fillRect(M,yl-40,CARD_W-M*2,2);
    x.fillStyle=C.cinza;x.font=FONTE.ui(22,700);espacar(x,3);x.fillText(rot.toUpperCase(),M,yl);espacar(x,0);
    x.fillStyle=C.osso;x.font=FONTE.ui(30,700);x.textAlign="right";x.fillText(String(val),CARD_W-M,yl);x.textAlign="left";
    yl+=62;
  });

  x.font=FONTE.texto(36,400,true);
  x.fillStyle=C.sangue;x.fillRect(M,yFrase-36,6,lsFrase.length*50+6);
  x.fillStyle=C.osso;lsFrase.forEach((l,i)=>x.fillText(l,M+30,yFrase+i*50));

  rodapeCard(x,M,H,meuPro,null,"#"+SEED.toString(36).toUpperCase());
  granularCard(x,CARD_W,H);
  return cv;
}

/* Abre por cima de tudo, sem tocar em playing/auto/dilemaAberto — o
   automático continua rodando por baixo se o jogador não fechar. */
async function abrirPainelMomentos(){
  const p=document.getElementById("painelMomentos");
  p.innerHTML="";
  const box=el("div","hub-lista momentos");
  if(!st.momentos.length){
    box.appendChild(vazio("cards","Nenhum card ainda","Nocaute rápido, cinturão, zebra: os momentos marcantes da carreira viram card pra compartilhar."));
  }else{
    for(const m of st.momentos){
      const item=el("div","momento-item");
      const texto=el("div","momento-texto");
      texto.appendChild(el("div","frase",m.frase));
      texto.appendChild(el("div","meta",`Luta ${m.luta} de ${TOTAL_FIGHTS} · ${m.cartel}`));
      const acoes=el("div","row");
      const btnSalvar=el("button","btn btn-sm","Salvar imagem");
      btnSalvar.onclick=()=>salvarImagem(m,btnSalvar,desenharCardMomento);
      const btnCopiar=el("button","btn btn-ghost btn-sm","Copiar imagem");
      btnCopiar.onclick=()=>copiarImagem(m,btnCopiar,desenharCardMomento);
      acoes.append(btnSalvar,btnCopiar);
      texto.appendChild(acoes);
      /* miniatura: o mesmo canvas do card de verdade, reduzido — sem prévia
         o jogador só descobre o que vai postar depois de baixar.

         Fundo CSS, não <canvas>/<img> (2026-09-11, achado jogando: botão
         direito → "Copiar imagem" na miniatura copiava o canvas de 140px
         DIRETO, ilegível — o navegador lê o pixel do elemento, nunca passa
         pelo onclick). Interceptar o clique não resolve: "Copiar imagem"
         do menu do navegador não é evento de JS, não tem como redirecionar
         pra outra fonte. `background-image` também não some do "Salvar
         imagem": Chrome/Firefox só oferecem esse item de menu pra
         <img>/<canvas>/<svg> — um <div> com fundo CSS não é destino
         desses itens. A miniatura também aciona salvarImagem() no clique
         esquerdo, mesmo caminho do botão "Salvar" — atalho, não a defesa. */
      try{
        const cv=await desenharCardMomento(m);
        const thumbW=180,thumbH=Math.round(thumbW*CARD_H/CARD_W);
        /* Moldura (Fase 8, 2026-09-17): passe-partout ao redor da miniatura
           — .momento-moldura é só padding+borda, .momento-mini continua o
           MESMO <div> de fundo CSS de sempre, tamanho/onclick/background
           intactos. Não é <canvas>/<img> antes nem depois. */
        const mini=el("div","momento-mini");
        mini.style.width=thumbW+"px";mini.style.height=thumbH+"px";
        mini.style.backgroundImage=`url(${cv.toDataURL("image/png")})`;
        mini.onclick=()=>salvarImagem(m,btnSalvar,desenharCardMomento);
        const moldura=el("div","momento-moldura");
        moldura.appendChild(mini);
        item.appendChild(moldura);
      }catch(e){/* sem prévia não impede salvar — segue sem a miniatura */}
      item.appendChild(texto);
      box.appendChild(item);
    }
  }
  p.appendChild(box);
}

/* Visual de documento, sem canto arredondado. Na frente do nome, ícone de
   check (desbloqueada) ou cadeado (travada): redundância de propósito,
   ajuda quem não distingue a cor do glifo (revamp fase 5: eram os
   caracteres "✓"/"·"; ícone só SVG). O ícone (iconeConquista(), moldura+glifo por
   categoria) e o rótulo de raridade (raridadeConquista(), badge
   reaproveitado) entraram em 2026-09-21 — ver comentário perto de
   CONQUISTAS/TAXA_MEDIDA_CONQUISTAS pro raciocínio completo. Igual ao
   painel de cards: não toca em playing/auto/dilemaAberto, o automático
   continua rodando por baixo se o jogador não fechar. */
function abrirPainelConquistas(){
  const p=document.getElementById("painelConquistas");
  p.innerHTML="";
  const box=el("div","hub-lista conquistas");
  const n=CONQUISTAS_DESBLOQUEADAS.size,total=CONQUISTAS.length;
  box.appendChild(el("div","conq-progresso",`<div class="conq-num">${n}<small>/${total}</small></div>
    <div class="conq-barra"><i style="width:${Math.round(100*n/Math.max(1,total))}%"></i></div>`));
  CONQUISTAS.forEach(c=>{
    const ok=CONQUISTAS_DESBLOQUEADAS.has(c.id);
    const item=el("div","conquista"+(ok?" ok":""));
    item.innerHTML=iconeConquista(c.cat);
    const raridade=raridadeConquista(c.id);
    const texto=el("div","conquista-texto",`
      <div class="conquista-nome">${ICONE(ok?"check":"cadeado","conquista-estado")}<span>${c.nome}</span>${
        raridade?`<span class="badge badge-${RARIDADE_BADGE[raridade]}">${raridade}</span>`:""}</div>
      <div class="conquista-desc">${c.desc}</div>`);
    item.appendChild(texto);
    box.appendChild(item);
  });
  const plat=el("div","conquista"+(n>=total?" ok":""));
  plat.innerHTML=iconeConquista("estrela");
  const platTexto=el("div","conquista-texto",`
    <div class="conquista-nome">${ICONE(n>=total?"check":"cadeado","conquista-estado")}<span>Platina</span></div>
    <div class="conquista-desc">${n>=total?"Todas as conquistas desbloqueadas.":`Faltam ${total-n} pra completar.`}</div>`);
  plat.appendChild(platTexto);
  box.appendChild(plat);
  p.appendChild(box);
}

/* Foto de cada produto (fundo do card na aba Loja): cena da mesma série

const IMG_LOJA={treinador:"saco",equipamento:"vestiario",empresario:"contrato",casa:"fotos",consultoria:"imprensa"};
function abrirPainelTreinador(){
  const p=document.getElementById("painelTreinador");

    const comprado=item.comprado();
    const linha=el("div","loja-item"+(comprado?" comprado":""));
    linha.style.cssText=`--img:url(img/${IMG_LOJA[item.id]||"academia"}.webp)`;
    linha.appendChild(el("div","loja-nome",item.nome));
    linha.appendChild(el("div","item-desc",item.desc()));
    linha.appendChild(el("div","loja-efeito-lb","Efeito medido"));
    /* mesmo texto de efeito() de sempre, só sem repetir "Efeito:" — o
       rótulo acima já diz isso, copy nenhuma nova. */
    linha.appendChild(el("div","item-efeito",item.efeito().replace(/^Efeito:\s*/,"")));
    const custo=item.custo();
    const rodape=el("div","loja-rodape");
    if(comprado){
      rodape.appendChild(el("span","loja-selo",
        `${ICONE("check")}<span>${item.recorrente?"Ativa para a próxima luta":"Adquirido"}</span>`));
    }else{
      rodape.appendChild(el("span","loja-preco",`R$ ${fmtNum(custo)}`));
      const buy=el("button","botao","Comprar");
      buy.disabled=(st.dinheiro||0)<custo;
      buy.onclick=()=>{
        if((st.dinheiro||0)<custo)return;
        st.dinheiro-=custo;
        item.comprar();
        SOM.caixa();
        salvarCarreira();
        renderBarraHub();
        abrirPainelTreinador();        // redesenha já adquirido
      };
      rodape.appendChild(buy);
    }
    linha.appendChild(rodape);
    box.appendChild(linha);
  });
  p.appendChild(box);
}

function urlDesafio(){
  const base=location.origin+location.pathname;
  /* O modo entra no link porque ele troca o pool: a mesma semente em modos
     diferentes dá cartas e adversários diferentes. Link antigo, sem m=, cai em
     "normal" — que é o que ele sempre foi. */
  return `${base}?d=${DIVISION}&s=${SEED.toString(36)}${MODO==="lenda"?"&m=lenda":""}`;
}

/* Desenha o canvas e devolve o PNG já em blob — usado por salvarImagem() e
   copiarImagem(), que faziam a mesma espera de fonte+canvas duas vezes
   quando eram uma função só (compartilhar()). */
async function gerarBlobCard(g,desenhar){
  /* Achado jogando (2026-09-24): "joguei uma carreira e não vi card
     nenhum novo" — meuPro só é atualizado 1x, no INÍCIO da carreira
     (atualizarStatusPro() fire-and-forget em startCareer()), sem
     retry. Se essa chamada falhar (rede) ou simplesmente não tiver
     terminado ainda, meuPro fica false o resto da carreira INTEIRA,
     inclusive no momento mais importante: gerar o card final. Reconfere
     fresco bem aqui, no ÚNICO lugar por onde salvarImagem()/
     copiarImagem() passam — mesmo raciocínio do bug do fechamento
     capturado no botão "Seja uma lenda" (nunca confiar num valor pego
     de antemão quando dá pra reconferir na hora que importa). */
  await atualizarStatusPro();
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const cv=await desenhar(g);
  return await new Promise(r=>cv.toBlob(r,"image/png"));
}
/* Salvar e Copiar eram UM botão só (compartilhar(), via navigator.share())
   que decidia sozinho, por navegador, se baixava o arquivo ou abria a
   folha de compartilhamento do sistema. Achado: no Mac, share() com
   {files,text,url} juntos podia devolver a folha do SO oferecendo o
   arquivo da imagem E o link como dois itens de compartilhamento — lê
   como "a imagem veio duplicada" sem nenhum bug de verdade no arquivo
   gerado (sempre foi um só). Separado em dois botões determinísticos, sem
   folha nativa nenhuma no meio: Salvar sempre baixa, Copiar sempre
   escreve na área de transferência — mesmo resultado em qualquer
   navegador. Mesmo guard de antes (disabled checado, não só atribuído) —
   é o que já provava, com dente, que toque duplo não gera 2 arquivos. */
async function salvarImagem(g,btn,desenhar=desenharCard){
  if(btn.disabled)return;
  btn.disabled=true;const antes=btn.textContent;btn.textContent="Gerando…";
  try{
    const blob=await gerarBlobCard(g,desenhar);
    const a=document.createElement("a");

async function copiarImagem(g,btn,desenhar=desenharCard){
  if(btn.disabled)return;
  btn.disabled=true;const antes=btn.textContent;btn.textContent="Gerando…";
  try{
    const blob=await gerarBlobCard(g,desenhar);
    if(!navigator.clipboard||!window.ClipboardItem)throw new Error("sem suporte a copiar imagem neste navegador");
    await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
    btn.textContent="Copiada!";           // aviso claro, mesmo padrão do "Copiado" no botão de link de desafio
  }catch(e){ btn.textContent="Não deu pra copiar"; }
  setTimeout(()=>{btn.textContent=antes;btn.disabled=false;},2200);
}

const MIN_LUTADORES=40;

/* ---------- modo de jogo ----------
   "lenda" troca o pool INTEIRO — draft e adversários — por campeões e nomes
   grandes. Lenda é quem já disputou cinturão OU está no topo do rating.

   O corte é 13/18 escrito assim, e não 0.72, porque rating é vitórias em 18
   simulações: os únicos valores que existem são múltiplos de 1/18. Escrever
   "0.70" pegaria exatamente o mesmo conjunto que "0.67" e esconderia que a
   escala é discreta. Medido: esse corte deixa 32% a 43% de cada divisão.

   Nem toda divisão fecha nesse modo. Uma carreira são 22 lutas sem repetir
   adversário, e peso-mosca (32 lendas) e as três divisões femininas
   (15 a 25) ficam abaixo de MIN_LUTADORES. Elas somem do modo lenda em vez de
   entrar e repetir adversário no meio da carreira. */
const RATING_LENDA=13/18;
const ehLenda=f=>(f.titulos&&f.titulos.disputas>=1)||f.rating>=RATING_LENDA-1e-9;
let MODO="normal";
/* Modo Rival — ativação explícita (item 4, 2026-09-22). Escolha feita em
   screenAtivarRival(), entre a divisão e o draft; sobrevive até
   startCareer() copiar pra dentro de st (mesmo padrão de MODO/DIVISION/
   SEED — variável de módulo que atravessa o setup da carreira). Sem isto,
   Modo Rival era 100% automático e silencioso: o jogador só descobria
   que existia se reparasse num selo pequeno na 4ª carta, sem escolha,
   sem nome próprio, sem aviso — achado jogando (pedido explícito). */
let RIVAL_ATIVADO=false,RIVAL_NOME_ESCOLHIDO=null;
function poolDivisao(id,modo){
  const p=ROSTER?ROSTER.filter(f=>f.division===id):[];
  return (modo||MODO)==="lenda"?p.filter(ehLenda):p;
}

/* Campeão nomeado. Critério é conquista (titulos.vitorias/disputas), não
   rating: rating é vitórias em 18 simulações, só existem ~19 valores
   distintos e no peso-leve 26 lutadores empatam — não dá pra nomear ninguém
   com isso. Estático, deriva só do dataset: nenhuma carreira de NPC é
   simulada (o cinturão só troca de mãos com o jogador; ver PENDENCIAS 1b).

   Recência entra como BUCKET, não como corte: quem não luta há
   CUTOFF_RANKING anos cai pro fim da lista em vez de sumir dela, senão o
   peso-pesado "atual" seria o Randy Couture. Medido nas 11 divisões × 2
   modos com esse corte de 6 anos: nenhum campeão sai com zero título, e o
   modo lenda nomeia os mesmos campeões do modo normal (ehLenda nunca
   derruba quem já é campeão). Sem fallback — não é caso que acontece. */
let CUTOFF_RANKING=null;
function buildRanking(pool){
  const comparar=(a,b)=>
    (b.titulos.vitorias-a.titulos.vitorias)||
    (b.titulos.disputas-a.titulos.disputas)||
    (b.fights-a.fights);
  const ativos=pool.filter(f=>f.era&&f.era[1]>=CUTOFF_RANKING).sort(comparar);
  const inativos=pool.filter(f=>!f.era||f.era[1]<CUTOFF_RANKING).sort(comparar);
  const lista=[...ativos,...inativos].slice(0,16);
  return{campeao:lista[0]||null,desafiante:lista[1]||null,lista};
}

/* O Supabase devolve login com Google, confirmação de e-mail e link de
   recuperação de senha no HASH (#access_token=...&type=...). Se isso
   virasse nome de rota, o jogo abria a 404 e, pior, reescrevia o hash
   antes do Supabase ler o token: login perdido. auth:true avisa quem
   chama pra NÃO mexer na URL. */
function lerRota(){
  let h="";
  try{ h=String(location.hash||""); }catch(e){}
  if(/access_token=|refresh_token=|error_description=|type=recovery|type=signup/.test(h))
    return{nome:"menu",param:null,auth:true};
  const partes=h.replace(/^#\/?/,"").split("/").filter(Boolean);
  return{nome:partes[0]||"menu",param:partes.slice(1).join("/")||null,auth:false};
}
function irPara(nome,param=null,{substituir=false}={}){
  const alvo="#/"+nome+(param?"/"+param:"");
  try{
    if(location.hash!==alvo){
      if(substituir)history.replaceState(null,"",alvo);
      else history.pushState(null,"",alvo);
    }
  }catch(e){/* sem history: navega igual, só não entra no histórico */}
  mostrarRota(nome,param);
}

function bloqueioPro(elemento){

    if(prox.focus)try{prox.focus();}catch(e){}
  };
  fundo.onkeydown=e=>{
    if(e.key==="Escape"){fecharTutorial();}
    else if(e.key==="ArrowRight")ir(i+1);
    else if(e.key==="ArrowLeft")ir(i-1);
  };
  /* clique no fundo escuro fecha; dentro da caixa não */
  fundo.onclick=e=>{if(e&&e.target===fundo)fecharTutorial();};
  (document.body||document.getElementById("app")).appendChild(fundo);
  desenhar();
}

/* =========================================================================
   JxJ (2026-10-01): telas do Jogador contra Jogador. A tela só mostra e
   escolhe; resultado, rating, XP, fichas, fila e prazo são do servidor
   (api/jxj.js) e do banco (supabase_jxj.sql). Spec:
   docs/superpowers/specs/2026-10-01-jxj-design.md.
   Rota #/jxj/<sub>/<id>. Polling com token de tela: sair da tela troca o
   token e a continuação velha desiste (mesma regra do CARREIRA_TOKEN).
   ========================================================================= */
const JXJ_URL="/api/jxj";
let JXJ_DEF=null,JXJ_TIMER=null,JXJ_TOKEN=0;
function jxjParar(){ if(JXJ_TIMER){clearTimeout(JXJ_TIMER);JXJ_TIMER=null;} JXJ_TOKEN++; }
async function jxj(acao,dados={}){
  const token=await meuAccessToken();
  let r,j=null;
  try{
    r=await fetch(JXJ_URL,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({...(token?{token}:{}),acao,...dados})});
    try{ j=await r.json(); }catch(e){}
  }catch(e){ throw{status:0,erro:"Sem conexão com o servidor do JxJ. Confira a internet e tente de novo."}; }
  if(!r.ok)throw{status:r.status,erro:(j&&j.erro)||"O servidor do JxJ não respondeu. Tente de novo.",desligado:!!(j&&j.desligado)};
  return j;
}
async function jxjDef(){ if(!JXJ_DEF)JXJ_DEF=await jxj("definicoes"); return JXJ_DEF; }
const jxjEsc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jxjEstilo=id=>(JXJ_DEF&&JXJ_DEF.estilos[id]&&JXJ_DEF.estilos[id].nome)||id;
const jxjCategoria=id=>(JXJ_DEF&&JXJ_DEF.categorias[id]&&JXJ_DEF.categorias[id].nome)||nomeDivisao(id)||id;
const jxjMetodo=m=>({KO:"Nocaute",TKO:"Nocaute técnico",FIN:"Finalização",DEC:"Decisão",EMPATE:"Empate",WO:"W.O.",ANULADA:"Anulada"}[m]||m);
function jxjCartel(l){
  const c=Array.isArray(l.cartel)?l.cartel:[l.vitorias||0,l.derrotas||0,l.empates||0];
  return{v:c[0],d:c[1],e:c[2],txt:`${c[0]}-${c[1]}${c[2]?`-${c[2]}`:""}`,total:c[0]+c[1]+c[2]};
}
/* taxa de vitórias: vitórias sobre o total de lutas (empate conta no total) */
function jxjTaxa(l){ const c=jxjCartel(l); return c.total?Math.round(100*c.v/c.total)+"%":"Sem lutas"; }
const jxjProvisorio=l=>(l.lutasRating!=null?l.lutasRating:l.lutas_rating||0)<((JXJ_DEF&&JXJ_DEF.regras.lutasPraClassificar)||5);
function jxjRetrato(l,w=120,cls=""){
  const m=l&&l.moldura&&l.moldura!=="padrao"?` moldura-${jxjEsc(l.moldura)}`:"";
  return `<span class="jxj-retrato${m}${cls?" "+cls:""}">${bonecoSVG(l&&l.rosto,{w})}</span>`;
}
function jxjCarregando(c,txt="Carregando"){ c.innerHTML=""; c.appendChild(el("p","carregando",txt)); }
function jxjErro(c,e,tentar){
  c.innerHTML="";
  if(e&&e.desligado){ c.appendChild(jxjEmBreve()); return; }
  const v=vazio("alerta","Não deu certo",jxjEsc((e&&e.erro)||"Falha inesperada."));
  if(tentar){ const b=el("button","botao botao-sec",`${ICONE("reenviar")}<span>Tentar de novo</span>`); b.type="button"; b.onclick=()=>{SOM.toque();tentar();}; v.appendChild(b); }
  c.appendChild(v);
}
function jxjEmBreve(){
  return vazio("relogio","O JxJ abre em breve",
    "O modo competitivo está pronto e entra no ar assim que o banco de dados dele for liberado. A carreira continua igual.");
}
/* navegação interna do JxJ (troca de rota, não de aba) */
function jxjNav(atual){
  const nav=el("nav","guias jxj-nav");
  [["","Painel","painel"],["ranking","Ranking","trofeu"],["temporada","Temporada","calendario"],
   ["torneios","Torneios","coroa"],["hall","Hall da Fama","hall"]].forEach(([sub,rot,ico])=>{

function jxjTela({titulo,fundo="octogono-luz",nav=null,voltar="menu",classe=""}){

/* contagem regressiva pelo relógio do SERVIDOR: restaMs na chegada da
   resposta, descontado o tempo local que passou desde então */
function jxjRelogio(restaMs){
  const chegou=Date.now();
  return()=>Math.max(0,restaMs-(Date.now()-chegou));
}
const jxjSeg=ms=>Math.ceil(ms/1000);
function jxjFmtDuracao(ms){
  const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d?`${d}d ${h}h`:h?`${h}h ${m}min`:m?`${m}min`:`${s%60}s`;
}
function jxjBarra(valor,max,cls=""){
  const p=Math.max(0,Math.min(100,Math.round(100*valor/Math.max(1,max))));
  return `<span class="jxj-barra${cls?" "+cls:""}" role="progressbar" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${Math.round(valor)}"><i style="width:${p}%"></i></span>`;
}
/* linha do rating em SVG (sem biblioteca) */
function jxjSparkline(pontos,{w=280,h=64}={}){
  if(!pontos||pontos.length<2)return `<p class="jxj-nota">O gráfico aparece depois da segunda luta com rating.</p>`;
  const vs=pontos.map(p=>p.r),mn=Math.min(...vs),mx=Math.max(...vs),amp=Math.max(20,mx-mn);
  const xy=vs.map((v,i)=>[Math.round(i*(w-8)/(vs.length-1))+4,Math.round(h-6-(v-mn)*(h-12)/amp)]);
  const d=xy.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  const ult=xy[xy.length-1];
  return `<svg class="jxj-spark" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Rating de ${vs[0]} a ${vs[vs.length-1]}">
    <path d="${d}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="${ult[0]-4}" y="${ult[1]-4}" width="8" height="8" fill="var(--sangue)"/></svg>`;
}

/* ---------- entrada e painel (#/jxj) ---------- */
async function jxjTelaEntrada(){
  const c=jxjTela({titulo:"JxJ",fundo:"arena",nav:""});
  const area=el("div","jxj-area"); c.appendChild(area);
  jxjCarregando(area);
  let def;
  try{ def=await jxjDef(); }catch(e){ return jxjErro(area,e,jxjTelaEntrada); }
  if(!def.ativo){ area.innerHTML=""; area.appendChild(jxjEmBreve()); jxjApresentacao(area,def,{semBotao:true}); return; }
  const s=await sessaoAtual();
  if(!s){ area.innerHTML=""; jxjApresentacao(area,def,{entrar:true}); return; }
  await Promise.race([atualizarStatusPro(),new Promise(r=>setTimeout(r,2500))]);
  let est;
  try{ est=await jxj("estado"); }catch(e){ return jxjErro(area,e,jxjTelaEntrada); }
  area.innerHTML="";
  if(est.luta&&["confirmacao","andamento"].includes(est.luta.status)){
    const b=el("button","jxj-faixa-luta",`${ICONE("espadas")}<span><b>Luta em andamento</b><small>Ela continua mesmo fora da tela. Volte pra escolher a próxima ação.</small></span>${ICONE("seta-dir")}`);
    b.type="button"; b.onclick=()=>{SOM.toque();irPara("jxj","luta/"+est.luta.id);};
    area.appendChild(b);
  }
  if(!est.lutadores.length){ jxjApresentacao(area,def,{criar:true,est}); return; }
  jxjPainel(area,def,est);
}

function jxjPainel(area,def,est){

    :"A luta grátis já foi usada. O Pro libera a fila, a revanche e os torneios."));
  if(!podeFila&&!est.pro)hero.querySelector(".jxj-principal-info").appendChild(bloqueioPro(el("button","botao botao-sec","Fila do Pro")));
  area.appendChild(hero);

  temp.innerHTML=`<p class="jxj-rotulo">${ICONE("calendario")} Temporada ${est.temporada.numero}</p>

  const riv=el("section","painel-n jxj-card entra"); riv.innerHTML=`<p class="jxj-rotulo">${ICONE("espadas")} Rivais</p><p class="carregando">Carregando</p>`;

  const tk=JXJ_TOKEN;
  jxj("perfil",{lutadorId:principal.id}).then(p=>{

      ?`<ul class="jxj-lista-simples">${rivais.map(o=>`<li><a href="#/jxj/perfil/${o.id}">${jxjEsc(o.nome)}</a>: ${o.n} lutas, ${o.v} vitórias e ${o.d} derrotas</li>`).join("")}</ul>`

    tor.innerHTML=`<p class="jxj-rotulo">${ICONE("coroa")} Próximo torneio</p>`+(t

/* ---------- regras da árvore no cliente: só pra prévia; quem decide é o servidor ---------- */
const jxjPontosDoNivel=n=>3+Math.max(0,Math.min(30,n)-1);
function jxjNos(def){
  const m={};
  for(const [ramo,r] of Object.entries(def.ramos))r.nos.forEach(no=>{m[no.id]={...no,ramo,estilo:r.estilo};});
  return m;
}
function jxjValidar(def,estilo,build,nivel){
  const A=def.arvore,NOS=jxjNos(def),porRamo={};let gasto=0;
  const custo=(no,nv)=>(no.estilo===estilo?A.custoProprio:A.custoHibrido)*nv;
  for(const [id,nv] of Object.entries(build)){
    if(!nv)continue; const no=NOS[id]; if(!no)return{ok:false,erro:"habilidade desconhecida"};
    if(no.estilo!==estilo&&no.tier>A.tiersHibridos)return{ok:false,erro:`${no.nome} só abre pro estilo dele`};
    gasto+=custo(no,nv); porRamo[no.ramo]=(porRamo[no.ramo]||0)+custo(no,nv);
  }
  for(const [id,nv] of Object.entries(build)){
    if(!nv)continue; const no=NOS[id];
    const antes=def.ramos[no.ramo].nos.slice(0,no.tier-1).reduce((s,x)=>s+custo({estilo:no.estilo},build[x.id]||0),0);
    if(antes<A.pedidoPorTier[no.tier-1])return{ok:false,erro:`${no.nome} pede ${A.pedidoPorTier[no.tier-1]} pontos antes no ramo`};
  }
  for(const [ramo,p] of Object.entries(porRamo))if(p>A.pontosPorRamoMax)return{ok:false,erro:`o ramo ${def.ramos[ramo].nome} aceita até ${A.pontosPorRamoMax} pontos`};
  const disp=jxjPontosDoNivel(nivel);
  if(gasto>disp)return{ok:false,erro:`faltam pontos (${gasto} de ${disp})`};
  return{ok:true,gasto,porRamo,sobra:disp-gasto};
}
function jxjPerfilPrevia(def,estilo,categoria,build){
  const A=def.arvore,NOS=jxjNos(def),est=def.estilos[estilo],aj=(def.categorias[categoria]||{ajuste:{}}).ajuste||{};
  const bonA={},bonM={...(est.mec||{})};
  for(const [id,nv] of Object.entries(build||{})){ const no=NOS[id]; if(!no||!nv)continue;
    for(const e of no.efeitos){ if(e.a)bonA[e.a]=(bonA[e.a]||0)+e.v*nv; else bonM[e.m]=(bonM[e.m]||0)+e.v*nv; } }
  const suave=(b,t)=>t*(1-Math.exp(-b/t));
  const atr={},mec={};
  for(const k of Object.keys(est.base))atr[k]=Math.min(A.atributoMax,Math.round((est.base[k]+(aj[k]||0)+suave(bonA[k]||0,A.tetoBonus))*10)/10);
  for(const [k,m] of Object.entries(def.mecanicas))mec[k]=bonM[k]?suave(bonM[k],m.teto):0;
  return{atr,mec};
}
const JXJ_ENERGIA=new Set(["eficienciaGolpe","eficienciaQueda","eficienciaOfensiva","chuteCorpo","retornoDistancia","recuperacao"]);
/* Efeito de um nó como o motor usa: atributo soma por nível; efeito de
   mecânica mostra o valor real em cada nível, já com o teto suave (o
   mesmo de jxjPerfilPrevia e do servidor), pra ninguém ler 32% por nível
   e achar que o nível 3 dá 96%. */
function jxjTxtEfeito(def,e){
  const f=(x,d)=>String(Math.round(x*10**d)/10**d).replace(".",",");
  if(e.a)return `${def.atributos[e.a]} +${f(e.v,1)} por nível`;
  const m=def.mecanicas[e.m]; if(!m)return e.m;
  const suave=(b,t)=>t*(1-Math.exp(-b/t));
  const fmt=JXJ_ENERGIA.has(e.m)?(x=>`${f(x,2)} de energia`):m.teto>2?(x=>`${f(x,1)} pontos`):(x=>`${f(x*100,0)}%`);
  const n=def.arvore.nivelMaxNo,niveis=Array.from({length:n},(_,i)=>fmt(suave(e.v*(i+1),m.teto)));
  return `${m.desc}: ${niveis.join(" / ")} nos níveis ${Array.from({length:n},(_,i)=>i+1).join(", ").replace(/, (\d+)$/," e $1")} (teto ${fmt(m.teto)})`;
}

const JXJ_ICONE_ACAO={golpes:"punho",queda:"queda",defesa:"escudo",pressao:"avancar"};

async function jxjTelaLuta(id){
  const c=jxjTela({titulo:"Luta",fundo:"octogono-luz",voltar:()=>irPara("jxj"),nav:null,classe:"tela-jxj-luta"});
  const area=el("div","jxj-area"); c.appendChild(area); jxjCarregando(area);
  try{ await jxjDef(); }catch(e){ return jxjErro(area,e,()=>jxjTelaLuta(id)); }
  const tk=JXJ_TOKEN;
  let assinatura="",relogio=null,vista=null,enviando=false;
  const tick=setInterval(()=>{
    if(tk!==JXJ_TOKEN){ clearInterval(tick); return; }
    const alvo=document.getElementById("jxj-relogio");
    if(alvo&&relogio){ const s=jxjSeg(relogio()); alvo.textContent=s+"s"; alvo.classList.toggle("urgente",s<=5); }
  },250);
  const ciclo=async(acao=null,extra={})=>{
    if(tk!==JXJ_TOKEN)return;
    try{
      vista=await jxj(acao||"luta",{lutaId:id,...extra});
      if(tk!==JXJ_TOKEN)return;
      const ass=[vista.status,vista.round,vista.troca,vista.minhaAcao,vista.adversarioEscolheu,(vista.trocas||[]).length,vista.confirmado&&vista.confirmado.a,vista.confirmado&&vista.confirmado.b,!!vista.narracao,JSON.stringify(vista.revanche||null)].join("|");
      if(ass!==assinatura){ assinatura=ass; desenhar(); }
      relogio=vista.status==="confirmacao"?jxjRelogio(Date.parse(vista.confirmacaoAte)-Date.parse(vista.agora))
        :vista.status==="andamento"?jxjRelogio(Date.parse(vista.prazo)-Date.parse(vista.agora)):null;
    }catch(e){
      if(tk!==JXJ_TOKEN)return;
      if(!vista)return jxjErro(area,e,()=>ciclo());
      const av=document.getElementById("jxj-aviso"); if(av){ av.textContent=e.erro||"Reconectando"; av.hidden=false; }

    if(tk!==JXJ_TOKEN)return;
    const espera=!vista?3000:vista.status==="andamento"?1200:vista.status==="confirmacao"?1500:(vista.status==="encerrada"&&vista.revanche&&!vista.revanche.luta&&Date.parse(vista.revanche.ate)>Date.parse(vista.agora))?2000:null;
    if(vista&&vista.status==="encerrada"&&vista.revanche&&vista.revanche.luta)return irPara("jxj","luta/"+vista.revanche.luta,{substituir:true});
    if(espera)JXJ_TIMER=setTimeout(()=>ciclo(),espera);

  const desenhar=()=>{
    area.innerHTML="";
    const aviso=el("p","jxj-aviso"); aviso.id="jxj-aviso"; aviso.hidden=true; area.appendChild(aviso);
    if(vista.status==="cancelada"){

      const b=el("button","botao",`${ICONE("espadas")}<span>Voltar pra fila</span>`); b.type="button"; b.onclick=()=>{SOM.toque();irPara("jxj","fila");};
      area.appendChild(el("div","jxj-acoes")).appendChild(b); return;
    }
    if(vista.status==="confirmacao")return jxjDesenharConfirmacao(area,vista,lados(),ciclo);

async function jxjConferirSemente(semente,compromisso){
  try{
    const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(semente));
    return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,"0")).join("")===compromisso;
  }catch(e){ return null; }
}

async function jxjTelaTorneios(){

  const area=el("div","jxj-area"); c.appendChild(area); jxjCarregando(area);
  let def,ts,est=null;
  try{ def=await jxjDef(); if(!def.ativo){ area.innerHTML=""; area.appendChild(jxjEmBreve()); return; } ts=await jxj("torneios");
    if(await sessaoAtual()){ try{ est=await jxj("estado"); }catch(e){} } }
  catch(e){ return jxjErro(area,e,jxjTelaTorneios); }
  area.innerHTML="";
  area.appendChild(el("p","tela-sub",`Chave de ${def.regras.torneioVagas}: quartas, semifinal e final. Fecha quando chega a ${def.regras.torneioVagas} inscritos e as sementes saem do rating. Cada confronto tem ${def.regras.torneioJanelaH} horas pra acontecer: os dois entram na sala e lutam. Quem não aparece perde por W.O. O campeão leva o cinturão da categoria.`));
  const reqs=el("p","jxj-nota",`Pra entrar: Pro, lutador principal da categoria e ${def.regras.torneioLutasMin} lutas com rating. Uma inscrição por conta.`);

      ${t.status==="encerrado"&&t.campeao?`<p>Campeão: <b>${jxjEsc(t.campeao.nome)}</b></p>`:`<p class="jxj-card-num">${t.inscritos} de ${t.vagas}<small>inscritos</small></p>${jxjBarra(t.inscritos,t.vagas)}`}`;

      if(t.inscrito){
        const sair=el("button","botao botao-sec","Sair do torneio"); sair.type="button";

        const ins=el("button","botao",`${ICONE("check")}<span>Inscrever ${jxjEsc(principal.nome)}</span>`); ins.type="button";
        const msg=el("p","jxj-erro"); msg.hidden=true;
        ins.onclick=async()=>{ SOM.toque(); ins.disabled=true; try{ await jxj("torneioInscrever",{lutadorId:principal.id}); jxjTelaTorneios(); }catch(e){ msg.textContent=e.erro; msg.hidden=false; ins.disabled=false; } };
        acoes.appendChild(est.pro?ins:bloqueioPro(ins)); card.appendChild(msg);
      }

    card.appendChild(acoes); g.appendChild(card);
  }
  if(!ts.length)g.appendChild(vazio("coroa","Nenhum torneio agora",""));
