    if(st.rival&&!out.some(o=>o.f.name===st.rival.f.name))
      out.push({f:st.rival.f,ganho:.09,rival:true});
  }
  return out;
}

/* Chance de o jogador vencer ESTE adversário, com os atributos de agora
   (draft × treino × evento): 24 lutas simuladas com semente própria
   (simulateFight), o rng da carreira não mexe. Balanço 2026-09-28: a escada
   de adversários ficou acima da posição no ranking, e nem st.standing nem
   a nota dos lutadores reais (rateAll, contra o mediano) previam a luta
   contra o lutador draftado; o rótulo da carta e a zebra passaram a sair
   daqui. Guardada por adversário e estado do jogador. */
let cacheChance=null;
function chanceContra(opp){
  if(!me||!opp)return .5;
  const chave=opp.name+"|"+fightNo+"|"+JSON.stringify(st.treino||{})+JSON.stringify(st.eventoMod||{});
  if(!cacheChance||cacheChance.base!==JSON.stringify([DIVISION,MODO,SEED]))cacheChance={base:JSON.stringify([DIVISION,MODO,SEED]),v:{}};
  if(chave in cacheChance.v)return cacheChance.v[chave];
  const eu=lutadorEfetivo();
  let w=0;
  for(let s=1;s<=24;s++)if(simulateFight(eu,opp,{seed:s*31+7}).winner===eu.name)w++;
  return cacheChance.v[chave]=w/24;
}
function dificuldade(opp){
  const p=chanceContra(opp);
  if(p>=.64)return{n:1,rot:"Acessível",pips:1};
  if(p>=.48)return{n:2,rot:"Parelho",pips:2};
  if(p>=.34)return{n:3,rot:"Duro",pips:3};
  return{n:4,rot:"Perigoso",pips:4};
}
function bioLutador(f){
  const t=f.titulos||{disputas:0,vitorias:0};
  const linhas=[`<b>${f.fights}</b> lutas`+(f.era?` · ${f.era[0]}-${f.era[1]}`:"")];
  if(t.vitorias>0)linhas.push(`<b>${t.vitorias}</b> ${t.vitorias>1?"vitórias":"vitória"} em luta de cinturão`);
  else if(t.disputas>0)linhas.push(`disputou o cinturão <b>${t.disputas}</b>x, nunca venceu`);
  if(f.destaque)linhas.push(`${f.destaque.eixo} no <b>${Math.round(f.destaque.pct*100)}º</b> percentil`);
  return linhas.join("<br>");
}

function telaAdversario(guardadas){
  const box=document.getElementById("escolha");
  box.style.display="";
  /* Revamp fase 5: candidatos() consome rng, então roda UMA vez por luta.
     Voltar do camp e reabrir a noite passam a oferta guardada. A oferta
     sorteada vai pro save (PENDENTE "oferta"): recarregar, comprar na
     loja ou sair pro menu com ela aberta reabre as MESMAS cartas. */
  const opts=guardadas||candidatos();
  ofertaAtual=opts;
  /* Modo Rival: anúncio de 1ª aparição (item 4) — sem isto, o rival só
     se distingue por um selo pequeno na carta, fácil de nunca notar
     (achado jogando). Uma vez só por carreira (st.rivalAnunciado). */
  const rivalNovo=!guardadas&&opts.find(o=>o.rival)&&!st.rivalAnunciado;
  if(rivalNovo)st.rivalAnunciado=true;
  if(!guardadas){
    PENDENTE={tipo:"oferta",opts:opts.map(o=>({nome:o.f.name,ganho:o.ganho,rival:!!o.rival}))};

  box.innerHTML=`${rivalNovo?`<div class="rival-anuncio">Novo rival<span class="sub">"${st.rival.nome}" entra na sua carreira. É a primeira luta entre vocês.</span></div>`:""}
    <div class="esc-hd">Escolha o adversário</div>
    <div class="opps" id="opps"></div>`;
  const g=document.getElementById("opps");
  /* Fase 6 (2026-09-16): dificuldade vira faixa colorida no topo do card
     (protagonista) em vez de 4 quadradinhos de 9px cuidando sozinhos da
     decisão mais importante que o jogador toma fora da luta — os pips
     continuam, só encolhem pra confirmação secundária dentro da faixa.
     "+N" de ranking ganha rótulo ("se vencer") — é a aposta, não um
     número solto. E o próprio jogador entra no card ("SEU NOME vs
     ADVERSÁRIO") — é isso que faz a tela parecer anúncio de confronto
     em vez de grade de botão. Nenhum dado novo: mesma dificuldade(),
     bioLutador(), o.ganho de sempre — só reorganizado. */
  opts.forEach(o=>{
    const d=dificuldade(o.f);
    /* Modo Rival: mesma estrutura de card, só acrescenta o selo "RIVAL" e
       troca a bio pelo histórico entre os dois — não é um lutador comum,
       é continuidade de uma rivalidade que atravessa a carreira. */
    const hist=o.rival&&st.rival.historico;
    const bioOuHistorico=o.rival
      ?(hist.length?`${hist.length+1}ª vez que se enfrentam · ${hist[hist.length-1].ganhou?"você venceu":"ele venceu"} a última, por ${hist[hist.length-1].metodo.toLowerCase()}`
        :"1ª vez que se enfrentam")
      :bioLutador(o.f);
    const b=el("button","opp d"+d.n+(o.rival?" rival":""),`
      ${o.rival?`<span class="rival-selo">RIVAL</span>`:""}
      <span class="dbanda"><b>${d.rot}</b><span class="pips">${[1,2,3,4].map(i=>`<i class="${i<=d.pips?"on":""}"></i>`).join("")}</span></span>
      <span class="vs"><span class="quem">${me.name}</span><span class="vslabel">vs</span></span>
      <span class="nm">${o.f.name}</span>
      ${o.f.arquetipo?`<span class="arq">${o.f.arquetipo}</span>`:""}
      <span class="bio">${bioOuHistorico}</span>
      ${compararOferta(o.f)}
      <span class="stake"><span>se vencer</span><b>+${Math.round(o.ganho*100)} ranking</b></span>`);
    b.onclick=()=>{SOM.toque();telaCamp(o);};
    g.appendChild(b);
  });
  SOM.carta();
  mostrarNoite("oferta");
}
/* Comparação na carta da oferta (revamp fase 5): só dado público de
   ficha (alcance, base, lutas no UFC). Atributo de luta do adversário
   continua escondido de propósito (ver COUNTER_ATTR na escolha da luta). */
function compararOferta(f){
  const alc=a=>a!=null?Math.round(a)+String.fromCharCode(34):"-";
  const linha=(rot,eu,ele)=>`<span class="comp-linha"><span class="comp-eu">${eu}</span><span class="comp-rot">${rot}</span><span class="comp-ele">${ele}</span></span>`;
  return `<span class="opp-comp">${linha("Alcance",alc(me.reach),alc(f.reach))}${
    me.stance&&f.stance?linha("Base",me.stance,f.stance):""}${linha("Lutas",fightNo,f.fights!=null?f.fights:"-")}</span>`;
}

function telaCamp(escolhido){
  escolhidoAtual=escolhido;
  const box=document.getElementById("escolha");
  box.innerHTML=`<div class="esc-hd">Camp pra ${escolhido.f.name}</div>

    <div class="camps" id="camps"></div>`;
  const g=document.getElementById("camps");
  CAMPS.forEach(c=>{

    /* Fase 6 (2026-09-16): a barra de 5px + rótulo categórico ("rende
       muito"/"quase no teto") escondia a magnitude atrás de um
       adjetivo — o jogador não tinha como ver que o 16º camp no mesmo
       eixo rende ~0,03% contra ~5,4% do 1º. "restante" (fração 0-1 até
       o teto) já existia; "ganhoPct" é novo, só de exibição — mesma
       conta de aplicarCamp() (falta×RITMO_TREINO×peso por eixo,
       mesma média por eixo que "restante" já fazia), sem chamar
       aplicarCamp() nem gravar em st.treino. Reaproveita pctBar/pctClass
       do draft (mesma barra, mesmas 5 cores) — dado diferente, mesma
       linguagem visual. */
    const alvos=Object.keys(c.alvos);

    alvos.forEach(k=>{

      restante+=falta/(TETO_TREINO-1);
      ganhoPct+=falta*RITMO_TREINO*c.alvos[k]*100;
    });
    restante/=alvos.length; ganhoPct/=alvos.length;
    const barra=`<span class="pctwrap ${pctClass(restante)}">
        <span class="pctbar"><i style="width:${Math.max(2,Math.round(restante*100))}%"></i></span>
        <span class="pctnum">+${ganhoPct.toFixed(1)}%</span></span>
      <span class="camp-cap">ganho neste camp${vezes?` · feito ${vezes}x`:""}</span>`;
    const b=el("button","camp",`<span class="t">${c.nome}</span>
      <span class="d">${c.desc}</span>
      <span class="g">${c.ganho}</span>
      ${barra}`);
    b.onclick=()=>{SOM.toque();box.style.display="none";box.innerHTML="";telaColetiva(escolhido,c);};
    g.appendChild(b);
  });
  SOM.carta();
  mostrarNoite("camp");
}

/* ---------- Plano Pro: coletiva de imprensa pré-luta ---------- */
/* Hash estável (não-rng) só pra escolher QUAL variante de abertura mostrar
   pro mesmo adversário — nunca pode consumir rng()/qualquer stream, senão
   desloca a sequência e o link de desafio compartilhado para de reproduzir
   a mesma carreira pra quem abre sem ser Pro (Modo Rival vai usar o mesmo
   truque, ver PENDENCIAS.md item "Plano Pro"). */
function hashEstavel(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
const ABERTURA_COLETIVA=[
  opp=>`${opp.name} disse, na coletiva, que essa luta "não devia nem estar marcada".`,
  opp=>`${opp.name} sorriu pra câmera e falou que você "ainda não pegou ninguém do top 10".`,
  opp=>`${opp.name} prometeu resolver isso "antes do intervalo", direto pro microfone.`,
  opp=>`Perguntado sobre você, ${opp.name} só respondeu "quem?". A sala riu.`,
  opp=>`${opp.name} chamou seu estilo de "fácil de ler" na entrevista de ontem.`,
  opp=>`${opp.name} disse que está cansado de "gente que fala mais que luta", olhando pra você.`,
];
function textoColetivaAbertura(opp){
  return ABERTURA_COLETIVA[hashEstavel(opp.name)%ABERTURA_COLETIVA.length](opp);
}
/* Vitrine ligada (2026-09-22, item 5 pós-pagamento): grátis PRECISA ver
   que a coletiva existe. Revamp fase 5: a vitrine é o componente único
   bloqueioPro() (área a 35%, sem clique, selo Assine o Pro), e "Pular"
   fica fora do bloqueio. */
function telaColetiva(escolhido,camp){
  const box=document.getElementById("escolha");
  box.style.display="";
  const opp=escolhido.f,dif=dificuldade(opp);
  const abertura=textoColetivaAbertura(opp);
  const seguir=()=>{box.style.display="none";box.innerHTML="";lutar(escolhido,camp);};
  /* Revamp fase 5: sem Pro, a área de provocar aparece travada pelo
     componente único bloqueioPro() (35%, sem clique, selo Assine o Pro);
     "Pular" fica FORA do bloqueio e segue pra luta. */
  box.innerHTML="";
  box.appendChild(el("div","esc-hd",`Coletiva · ${me.name} x ${opp.name}`));
  box.appendChild(el("div","contra coletiva-abertura",abertura));
  const area=el("div","dil-in coletiva-provocar",`<textarea id="colresp" maxlength="200" rows="3" placeholder="O que você responde?"></textarea>
      <button class="botao" id="colgo" type="button">Provocar</button>`);
  box.appendChild(bloqueioPro(area));
  const pular=el("button","botao botao-sec coletiva-pular","Pular a coletiva");pular.id="colpular";pular.type="button";
  box.appendChild(pular);
  const inp=document.getElementById("colresp"),go=document.getElementById("colgo");
  const cresce=()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";};
  inp.addEventListener("input",cresce);
  manterBotaoVisivel(inp,go);
  pular.onclick=()=>{SOM.toque();seguir();};
  go.onclick=async()=>{
    const txt=inp.value.trim();
    if(!txt)return inp.focus();
    /* Grátis é vitrine (mesmo tratamento da entrevista, ver
       renderBotaoEntrevista()): campo e botão aparecem, clique abre a
       oferta do Pro em vez de chamar a IA — nunca gasta chamada com quem
       não pode receber o resultado (api/ai.js recusaria com 403 de
       qualquer jeito, isto só evita a viagem de rede). */
    if(!meuPro)return;
    go.disabled=true;inp.disabled=true;go.textContent="…";
    const volta=document.getElementById("noiteVoltar");if(volta)volta.hidden=true;   // resposta a caminho: sem voltar
    const tk=CARREIRA_TOKEN;
    const token=await meuAccessToken();
    /* Corta ANTES de chamar a IA — mesmo motivo do dilema: mais barato e
       não depende de a IA ter obedecido a instrução de conteúdo inseguro. */
    const historicoRival=escolhido.rival?historicoRivalTexto():null;
    const j=conteudoInseguro(txt)?null:await ai("coletiva",{name:me.name,opp:opp.name,
      estilo:opp.arquetipo||"completo",dificuldade:dif.rot,title:!!st.tituloEstaLuta,
      abertura,resposta:txt,record:`${st.wins}-${st.losses}`,
      followers:fmtNum(st.followers),fan:st.fan.toFixed(1),historicoRival,token});
    if(tk!==CARREIRA_TOKEN)return;
    aplicarColetiva(box,opp,txt,j,seguir);
  };
  if(meuPro)inp.focus();
  SOM.flashes();
  mostrarNoite("coletiva");
}
function aplicarColetiva(box,opp,txt,jBruto,seguir){
  const jSeguro=(jBruto&&conteudoInseguro(jBruto.reacao))?null:jBruto;
  const j=jSeguro;
  st.coletivaHype=lim(j&&j.hype,.85,1.20,1);
  const mult=lim(j&&j.pressao,.90,1.10,1);
  const atr=["slpm","strDef","tdAvg","tdDef","subAvg","kdAvg","durability"].includes(j&&j.atributoPressao)?j.atributoPressao:null;
  st.coletivaPressao=atr?{atributo:atr,mult}:null;
  /* mesma rede de baixo do dilema: nunca deixa a IA afirmar quem ganha a
     luta que ainda vai acontecer — semResultadoDeLuta() já existe pra
     isso, reaproveitado aqui igual foi feito no dilema. */
  const bruto=(j&&j.reacao)?semResultadoDeLuta(String(j.reacao)).slice(0,800):"";
  if(bruto){
    box.innerHTML=`<div class="dil-eyebrow">Coletiva</div>
      <div class="dil-r">"${txt.replace(/</g,"&lt;")}"</div>
      <div class="dil-o">${bruto}</div>`;
    /* Botão em vez de tempo fixo (pedido do dono, 2026-09-28): em 2,2 s
       não dava pra ler a reação. A luta só começa quando o jogador manda. */
    const tk=CARREIRA_TOKEN;
    const ir=el("button","botao coletiva-seguir",`<span>Ir pra luta</span>${ICONE("seta-dir")}`);
    ir.id="colseguir";ir.type="button";
    ir.onclick=()=>{ if(tk!==CARREIRA_TOKEN)return; SOM.toque(); seguir(); };
    box.appendChild(ir);
  }else seguir();
}

/* ---------- Plano Pro: entrevista pós-luta ---------- */
/* Fato obrigatório: prioridade FIXA, decidida por string interpolation no
   cliente — NÃO pela IA, NÃO por sorteio. Garante citação de fato real na
   pergunta por CONSTRUÇÃO, não por instrução de prompt (mesma lição já
   medida no evento — forçar bate sugerir, ver EVENTO_TEMAS/proximoTema()).
   Ordem: cinturão > lesão > zebra > método (nocaute/finalização vs
   decisão) — "quedas" não é um 6º degrau separado (método sempre existe
   pra toda luta, então um degrau abaixo dele nunca seria alcançado); em
   vez disso entra como ENRIQUECIMENTO da pergunta de método quando há
   quedas de verdade pra citar, sem competir na prioridade. par (paridade
   de fightNo, sem rng) só varia a REDAÇÃO entre 2 frases por categoria,
   pra não repetir a mesma pergunta palavra por palavra toda vez que o
   mesmo tipo de fato aparece. */
function perguntaEntrevista(opp,ganhou,metodo,round,clock,title,zebra,lesaoTxt,tdApl,tdSof,fightNo){
  const par=fightNo%2===0;
  const comQuedas=s=>(tdApl>=1||tdSof>=1)?`${s} (foram ${tdApl} quedas aplicadas contra ${tdSof} sofridas)`:s;
  if(title)return{pergunta:par?`O cinturão estava em jogo hoje. O que passou pela sua cabeça quando o sino tocou?`
    :`Essa era luta de cinturão. Depois de tudo isso, o que você sente agora?`,fatoObrigatorio:"cinturão"};
  if(lesaoTxt)return{pergunta:par?`Você entrou nessa luta com ${lesaoTxt.toLowerCase()}. Valeu a pena arriscar?`
    :`Como está ${lesaoTxt.toLowerCase()} depois do que aconteceu hoje contra ${opp.name}?`,fatoObrigatorio:"lesão"};
  if(zebra)return{pergunta:par?`Poucos apostavam em você contra ${opp.name}. O que mudou?`
    :`Ninguém esperava esse resultado contra ${opp.name}. Você esperava?`,fatoObrigatorio:"zebra"};
  if(/ocaute/.test(metodo))return{pergunta:comQuedas(par
    ?`Foi nocaute no round ${round}, aos ${clock}. O que você viu no momento do golpe?`
    :`${ganhou?"Você fechou":"Você sofreu"} por nocaute no round ${round}. Como foi aquele instante?`),fatoObrigatorio:"nocaute"};
  if(metodo==="Finalização")return{pergunta:comQuedas(par
    ?`Foi finalização no round ${round}. Em que momento você sentiu que ${ganhou?"tinha fechado":"não ia escapar"}?`
    :`${ganhou?"Você finalizou":"Você foi finalizado"} no round ${round}, aos ${clock}. Como foi por dentro?`),fatoObrigatorio:"finalização"};
  return{pergunta:comQuedas(par
    ?`Foi pros cartões contra ${opp.name}. Você achou que o placar refletiu a luta?`
    :`Decisão dos juízes hoje contra ${opp.name}. Como você avalia essa luta?`),fatoObrigatorio:"decisão"};
}
/* Resume o histórico de um Rival em texto curto pro prompt — chamado tanto
   por coletiva (telaColetiva) quanto entrevista (aqui embaixo), sempre a
   MESMA frase pros dois, pra não inventar dois jeitos de contar a mesma
   rivalidade. null quando não há histórico ainda (1º encontro) — o prompt
   não recebe a chave nesse caso, não "histórico vazio". */
function historicoRivalTexto(){
  if(!st.rival||!st.rival.historico.length)return null;
  const linhas=st.rival.historico.map(h=>`${h.ganhou?"você venceu":"ele venceu"} por ${h.metodo.toLowerCase()}`);
  return `${st.rival.historico.length}º encontro entre os dois. Anteriores: ${linhas.join("; ")}.`;
}
/* entrevistaWrapAtual/entrevistaWrapRespondida (2026-09-22, achado
   jogando: "o botão de dar entrevista das lutas passadas continuam
   aparecendo") — cada luta chamava isto e só ACRESCENTAVA um wrap novo
   em #bouts, nunca tirando o convite da luta anterior que ficou sem
   resposta. #bouts continua mostrando o HISTÓRICO completo (cada linha
   de resultado fica pra sempre, é o cartel) — só o CONVITE não
   respondido é que não devia sobreviver pra próxima luta. */
let entrevistaWrapAtual=null,entrevistaWrapRespondida=true;
function renderBotaoEntrevista(bouts,opp,r,titleFight,won,td0,tdt0,zebra,ehRival){
  if(entrevistaWrapAtual&&!entrevistaWrapRespondida)entrevistaWrapAtual.innerHTML="";
  const wrap=el("div","entrevista-convite");
  entrevistaWrapAtual=wrap;entrevistaWrapRespondida=false;
  const btn=el("button","botao botao-sec",`${ICONE("microfone")}<span>Dar entrevista</span>`);
  btn.type="button";
  bouts.appendChild(wrap);
  btn.onclick=()=>{
    SOM.toque();
    if(!meuPro)return;
    entrevistaAberta=true;atualizarControles();
    const lesaoTxt=st.lesao?`${ROTULO_ATTR[st.lesao.atributo]||st.lesao.atributo} machucado(a)`:null;
    const{pergunta}=perguntaEntrevista(opp,won,r.method,r.round,r.clock,
      titleFight,zebra,lesaoTxt,td0,tdt0,fightNo);
    wrap.innerHTML=`<div class="dil-eyebrow">Entrevista</div>
      <div class="dil-c">"${pergunta}"</div>
      <div class="dil-in">
        <textarea id="entresp" maxlength="200" rows="3" placeholder="Sua resposta"></textarea>
        <button class="btn btn-sm" id="entgo">Responder</button></div>`;
    const inp=document.getElementById("entresp"),go=document.getElementById("entgo");
    const cresce=()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";};
    inp.addEventListener("input",cresce);
    manterBotaoVisivel(inp,go);
    inp.focus();
    go.onclick=async()=>{
      const txt=inp.value.trim();
      if(!txt)return inp.focus();
      go.disabled=true;inp.disabled=true;go.textContent="…";
      const tk=CARREIRA_TOKEN;
      const token=await meuAccessToken();
      const historicoRival=ehRival?historicoRivalTexto():null;
      const j=conteudoInseguro(txt)?null:await ai("entrevista",{name:me.name,opp:opp.name,
        ganhou:won,metodo:r.method,round:r.round,clock:r.clock,tdApl:td0,tdSof:tdt0,
        zebra:!!zebra,title:!!titleFight,lesao:lesaoTxt,pergunta,resposta:txt,
        record:`${st.wins}-${st.losses}`,followers:fmtNum(st.followers),fan:st.fan.toFixed(1),
        rendaBase:RENDA_BASE,historicoRival,token});
      if(tk!==CARREIRA_TOKEN)return;
      aplicarEntrevista(wrap,pergunta,txt,j);
    };
  };
  /* Revamp fase 5: sem Pro o convite aparece travado pelo componente
     único bloqueioPro() (a vitrine continua, o clique não). */
  wrap.appendChild(bloqueioPro(btn));
}
/* Botão "Continuar" depois da entrevista (2026-09-22, pedido explícito:
   "não tá dando tempo de ler") — sem isto, o automático (1,1s/speed) ou
   um clique cedo em "Próxima luta" cortava a resposta da IA antes do
   jogador terminar de ler. entrevistaAberta trava os dois (ver
   atualizarControles()/nextFight()/o timer do automático) até este
   botão ser clicado — aí sim segue pra próxima luta, de propósito
   (pedido foi "um botão de ir pra luta", não só "fechar o painel"). */
function aplicarEntrevista(box,pergunta,txt,jBruto){
  const j=(jBruto&&conteudoInseguro(jBruto.reacao))?null:jBruto;
  const dFan=lim(j&&j.fa,-2,2,0);
  const dSeg=lim(j&&j.seguidores,-.30,.50,0);
  const mencionaDinheiro=MENCIONA_DINHEIRO.test(semAcento(j&&j.reacao||""));
  const dDinheiro=mencionaDinheiro?Math.round(RENDA_BASE*lim(j&&j.dinheiro,-1,1,0)):0;
  const antes=st.followers;
  st.followers=Math.max(120,Math.round(st.followers*(1+dSeg)));
  st.fan=Math.max(0,Math.min(10,st.fan+dFan));
  st.dinheiro=Math.max(0,(st.dinheiro||0)+dDinheiro);
  const dif=st.followers-antes;
  st.entrevistasFeitas=(st.entrevistasFeitas||0)+1;
  const bruto=(j&&j.reacao)?String(j.reacao).slice(0,800):"";
  const reacao=bruto||fraseFallback();
  entrevistaWrapRespondida=true;             // fica pra sempre no histórico, não é mais "pendente"
  registrarExtra({tipo:"entrevista",cena:`"${pergunta}"`,resposta:txt.replace(/</g,"&lt;"),texto:reacao});
  box.innerHTML=`<div class="dil-eyebrow">Entrevista</div>
    <div class="dil-c">"${pergunta}"</div>
    <div class="dil-r">"${txt.replace(/</g,"&lt;")}"</div>
    <div class="dil-o">${reacao}</div>
    <div class="dil-fx">
      ${dif!==0?`<span class="delta ${dif>=0?"up":"down"}">${dif>=0?"+":"−"}${fmtNum(Math.abs(dif))} seguidores</span>`:""}
      ${Math.abs(dFan)>=0.05?`<span class="delta ${dFan>=0?"up":"down"}">${dFan>=0?"+":"−"}${Math.abs(dFan).toFixed(1)} de fã</span>`:""}
      ${dDinheiro!==0?`<span class="delta ${dDinheiro>=0?"up":"down"}">${dDinheiro>=0?"+":"−"}R$${fmtNum(Math.abs(dDinheiro))}</span>`:""}</div>
    <div class="dil-in"><button class="btn btn-sm" id="entcontinuar">${fightNo>=TOTAL_FIGHTS?"Continuar":"Continuar pra próxima luta"}</button></div>`;
  document.getElementById("entcontinuar").onclick=()=>{
    SOM.toque();
    entrevistaAberta=false;
    atualizarControles();
    nextFight();
  };
  renderFicha();
  salvarCarreira();
}


/* =========================================================================
   BONECO — SVG desenhado por código, sem imagem nenhuma.
   Mantém o jogo em arquivo único, escala em qualquer tamanho e acompanha as
   variáveis de cor do tema. Os adversários também têm boneco, derivado do nome
   e dos stats: se só o jogador tivesse, a tela de escolha ficaria torta.
   ========================================================================= */
/* =========================================================================
   ROSTO v2 — busto em SVG construído sobre anatomia, não sobre coordenadas
   soltas.

   O sistema anterior quebrava porque cada peça tinha número fixo no código:
   olho em x=39, boca em y=71. Trocar o formato da cabeça não movia nada disso,
   então bastava mexer numa peça para as outras saírem do lugar.

   Três decisões resolvem isso na raiz:

   1. ANCORAGEM — o objeto A descreve a anatomia (linha dos olhos, base do
      nariz, largura da mandíbula...). Toda peça se posiciona em relação a ele.
      Mudar o porte move a mandíbula e barba, orelha e queixo acompanham.

   2. SIMETRIA POR CONSTRUÇÃO — olho, sobrancelha e orelha são desenhados uma
      vez e espelhados por transform. É impossível ficarem desalinhados ou de
      tamanhos diferentes: são o mesmo desenho.

   3. RECORTE — o cabelo é cortado pela região do crânio, a barba pela região da
      mandíbula. Não conseguem invadir o rosto nem flutuar, por construção.

   Sombra e realce saem do tom de pele por cálculo, então trocar a cor mantém a
   iluminação coerente em rosto, pescoço e orelha.
   ========================================================================= */

/* ---------------------------- paletas ---------------------------- */
const PELES=["#F5D6B8","#EAC39C","#DBA878","#C08B57","#9E6B3E","#7A4E2B","#573520","#3B2317"];
const CABELOS=["#0F0C0A","#241A14","#3B2A1C","#5A3E24","#7E5A2E","#A8823F","#CBB077","#E0D2A8",
               "#8A8A8A","#CFCFCF","#8C3327","#2B3F63"];
const OLHOS_COR=["#4A2F1B","#6B4423","#8A6A3A","#4E6B4A","#3E6478","#5A6B7A","#2E2622"];
const CALCOES=["#C0392B","#1F3A6E","#1E6B4A","#7A2D8C","#B9932F","#242A36","#0F5C6B","#8C3A1E"];

const CABELO_TIPOS=["raspado","máquina","curto","social","topete","moicano","coque","dreads","longo"];
const BARBAS=["nenhuma","por fazer","bigode","cavanhaque","curta","média","cheia","costeleta"];
const OLHOS=["neutro","firme","fundo","inchado","cerrado"];
const SOBRANCELHAS=["reta","grossa","angulada","fina","partida","arqueada"];
const BOCAS=["neutra","cerrada","firme","larga","fina","protetor"];
const CICATRIZES=["nenhuma","supercílio","maçã do rosto","abaixo do olho","queixo","lábio"];
const PORTES=["magro","atlético","forte"];

/* ---------------------- cor derivada do tom de pele ----------------------
   Sombra e realce calculados a partir da base, então trocar o tom mantém a
   iluminação coerente em rosto, pescoço e orelha ao mesmo tempo. */
function mistura(hex,alvo,q){
  const h=hex.replace("#","");
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const a=alvo.replace("#","");
  const r2=parseInt(a.slice(0,2),16),g2=parseInt(a.slice(2,4),16),b2=parseInt(a.slice(4,6),16);
  const m=(x,y)=>Math.round(x+(y-x)*q).toString(16).padStart(2,"0");
  return "#"+m(r,r2)+m(g,g2)+m(b,b2);
}
const sombrear=(c,q=.22)=>mistura(c,"#241512",q);
const iluminar=(c,q=.16)=>mistura(c,"#FFF3E4",q);

/* ---------------------------- anatomia ----------------------------
   Todas as medidas em viewBox 0 0 100 120. Um único lugar. */
function anatomia(porte){
  const largura=[0,1,2].indexOf(porte)>=0?porte:1;
  const jaw=[21.5,23.5,25.5][largura];      // meia-largura da mandíbula
  return {
    cx:50,
    topo:18,                 // topo do crânio
    testa:36,                // linha da testa
    sobrancelha:44,          // linha da sobrancelha
    olhos:50,                // linha dos olhos
    nariz:60,                // base do nariz
    boca:70,                 // linha da boca
    queixo:90,               // ponta do queixo
    jaw,                     // mandíbula
    zigo:jaw+2.5,            // maçã do rosto: sempre mais larga que a mandíbula
    tempora:jaw+1.5,
    olhoDx:10.5,             // afastamento do centro (uma medida só: simetria)
    olhoRx:5.0, olhoRy:3.3,
    orelhaY:52,
    pescocoW:[9,10.5,12][largura],
    ombro:[30,35,40][largura],
  };
}

/* silhueta da cabeça derivada da anatomia: mudar o porte muda tudo junto */
function caminhoCabeca(A){
  const {cx,topo,testa,olhos,nariz,queixo,jaw,zigo,tempora}=A;
  return `M${cx-tempora} ${testa}
    C${cx-tempora} ${topo+2} ${cx-13} ${topo} ${cx} ${topo}
    C${cx+13} ${topo} ${cx+tempora} ${topo+2} ${cx+tempora} ${testa}
    C${cx+zigo} ${olhos-1} ${cx+zigo} ${nariz} ${cx+jaw} ${nariz+7}
    C${cx+jaw-1} ${queixo-11} ${cx+11} ${queixo} ${cx} ${queixo}
    C${cx-11} ${queixo} ${cx-jaw+1} ${queixo-11} ${cx-jaw} ${nariz+7}
    C${cx-zigo} ${nariz} ${cx-zigo} ${olhos-1} ${cx-tempora} ${testa}Z`;
}
/* região do crânio: recorta o cabelo. Ele não consegue invadir o rosto. */
function caminhoCranio(A){
  const {cx,topo,olhos,tempora,zigo,nariz}=A;
  return `M${cx-tempora-7} ${olhos+4}
    C${cx-tempora-7} ${topo-8} ${cx+tempora+7} ${topo-8} ${cx+tempora+7} ${olhos+4}
    C${cx+zigo} ${nariz+2} ${cx-zigo} ${nariz+2} ${cx-tempora-7} ${olhos+4}Z`;
}
/* Região da barba. A borda de baixo é o próprio contorno da mandíbula; a de
   cima sobe alto nas laterais (costeleta) e MERGULHA abaixo do nariz no centro.
   Sem esse mergulho a barba cobria o nariz, que é o erro clássico de barba
   colada por cima em vez de seguir o rosto. */
function caminhoBarbaArea(A){
  const {cx,olhos,queixo,jaw,zigo,nariz}=A;
  return `M${cx-zigo+1} ${olhos+4}
    C${cx-zigo} ${nariz+4} ${cx-jaw-1} ${queixo-9} ${cx} ${queixo-1}
    C${cx+jaw+1} ${queixo-9} ${cx+zigo} ${nariz+4} ${cx+zigo-1} ${olhos+4}
    C${cx+12} ${nariz+3} ${cx+7} ${nariz+5} ${cx} ${nariz+5}
    C${cx-7} ${nariz+5} ${cx-12} ${nariz+3} ${cx-zigo+1} ${olhos+4}Z`;
}

let _svgId=0;
function bonecoSVG(c,{w=120,alt=null}={}){
  const id="f"+(++_svgId);
  const A=anatomia((c.porte||0)%3);
  const {cx}=A;
  const pele=PELES[(c.pele||0)%PELES.length];
  const som=sombrear(pele), som2=sombrear(pele,.4), luz=iluminar(pele);
  const cab=CABELOS[(c.corCabelo||0)%CABELOS.length];
  const cabS=mistura(cab,"#000000",.28);
  const iris=OLHOS_COR[(c.corOlho||0)%OLHOS_COR.length];
  const cal=CALCOES[(c.calcao||0)%CALCOES.length];
  const linha="#171B22";
  const T=n=>CABELO_TIPOS[(c.cabelo||0)%CABELO_TIPOS.length]===n;
  const B=n=>BARBAS[(c.barba||0)%BARBAS.length]===n;
  const O=OLHOS[(c.olho||0)%OLHOS.length];
  const S=SOBRANCELHAS[(c.sobrancelha||0)%SOBRANCELHAS.length];
  const M=BOCAS[(c.boca||0)%BOCAS.length];
  const CIC=CICATRIZES[(c.cicatriz||0)%CICATRIZES.length];

  /* ---- olho: desenhado UMA vez, espelhado. Não há como desalinhar. ---- */
  const ex=cx-A.olhoDx, ey=A.olhos;
  let rx=A.olhoRx, ry=A.olhoRy, tampa="";
  if(O==="firme"){ry=2.7;}
  if(O==="cerrado"){ry=2.1;}
  if(O==="fundo"){ry=2.9;tampa=`<path d="M${ex-rx-1} ${ey+4.4} Q${ex} ${ey+6} ${ex+rx+1} ${ey+4.4}"
      stroke="${som2}" stroke-width="1.1" fill="none" opacity=".75"/>`;}
  if(O==="inchado"){ry=2.2;tampa=`<path d="M${ex-rx-1.5} ${ey+3.6} Q${ex} ${ey+6.6} ${ex+rx+1.5} ${ey+3.6}
      Q${ex} ${ey+4.4} ${ex-rx-1.5} ${ey+3.6}Z" fill="#8E4A3C" opacity=".55"/>`;}
  const olhoUm=`
    <ellipse cx="${ex}" cy="${ey}" rx="${rx}" ry="${ry}" fill="#F6F3EE"/>
    <circle cx="${ex+.4}" cy="${ey}" r="${Math.min(ry-.15,2.5)}" fill="${iris}"/>
    <circle cx="${ex+.4}" cy="${ey}" r="${Math.min(ry-.15,2.5)*.45}" fill="#12100E"/>
    <circle cx="${ex+1.5}" cy="${ey-1}" r=".8" fill="#FFFFFF" opacity=".85"/>
    <path d="M${ex-rx-.6} ${ey-.4} Q${ex} ${ey-ry-1.6} ${ex+rx+.6} ${ey-.4}"
      stroke="${linha}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    ${tampa}`;

  /* ---- sobrancelha: ancorada na linha da sobrancelha, também espelhada ---- */
  const bx=cx-A.olhoDx, by=A.sobrancelha;
  const CEJA={
    reta:`<path d="M${bx-6.5} ${by+.5} Q${bx} ${by-1.6} ${bx+6} ${by+.2}" stroke="${cabS}"
            stroke-width="3.1" fill="none" stroke-linecap="round"/>`,
    grossa:`<path d="M${bx-7} ${by+1} Q${bx} ${by-2.6} ${bx+6.5} ${by-.2}" stroke="${cabS}"
            stroke-width="5" fill="none" stroke-linecap="round"/>`,
    angulada:`<path d="M${bx-6.8} ${by-2} L${bx+6.2} ${by+1.8}" stroke="${cabS}"
            stroke-width="4" fill="none" stroke-linecap="round"/>`,
    fina:`<path d="M${bx-6} ${by+.4} Q${bx} ${by-1.4} ${bx+5.5} ${by}" stroke="${cabS}"
            stroke-width="1.9" fill="none" stroke-linecap="round"/>`,
    partida:`<path d="M${bx-6.8} ${by+.6} Q${bx-4} ${by-1.6} ${bx-1.8} ${by-1.2}" stroke="${cabS}"
            stroke-width="3.4" fill="none" stroke-linecap="round"/>
           <path d="M${bx+1.4} ${by-.6} Q${bx+4} ${by-.8} ${bx+6.2} ${by+.6}" stroke="${cabS}"
            stroke-width="3.4" fill="none" stroke-linecap="round"/>`,
    arqueada:`<path d="M${bx-6.5} ${by+1.4} Q${bx-1} ${by-3.4} ${bx+6} ${by+.4}" stroke="${cabS}"
            stroke-width="3.2" fill="none" stroke-linecap="round"/>`,
  }[S];

  /* ---- orelha: ancorada na têmpora, espelhada ---- */
  const oy=A.orelhaY, ox=cx-A.tempora;
  const orelhaUma=`
    <path d="M${ox+1} ${oy-6} C${ox-6} ${oy-7} ${ox-7} ${oy+3} ${ox-3.5} ${oy+7}
      C${ox-1} ${oy+9} ${ox+1} ${oy+7} ${ox+1} ${oy+5}Z" fill="${pele}"
      stroke="${linha}" stroke-width="1.6"/>
    <path d="M${ox-1.5} ${oy-2.5} C${ox-4} ${oy-2} ${ox-4} ${oy+2} ${ox-2.5} ${oy+4}"
      stroke="${som2}" stroke-width="1.2" fill="none" opacity=".8"/>`;

  /* ---- boca: ancorada na linha da boca ---- */
  const my=A.boca;
  const BOCA={
    neutra:`<path d="M${cx-7.5} ${my} Q${cx} ${my+2.6} ${cx+7.5} ${my}" stroke="${linha}"
              stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M${cx-6} ${my-2.4} Q${cx} ${my-3.6} ${cx+6} ${my-2.4}" stroke="${som2}"
              stroke-width="1.1" fill="none" opacity=".55"/>`,
    cerrada:`<path d="M${cx-8} ${my} L${cx+8} ${my}" stroke="${linha}" stroke-width="2.6" stroke-linecap="round"/>
             <path d="M${cx-6.5} ${my-2.6} Q${cx} ${my-4} ${cx+6.5} ${my-2.6}" stroke="${som2}"
              stroke-width="1.2" fill="none" opacity=".6"/>`,
    firme:`<path d="M${cx-8} ${my-.6} Q${cx} ${my+1.6} ${cx+8} ${my-.6}" stroke="${linha}"

    larga:`<path d="M${cx-9.5} ${my} Q${cx} ${my+3} ${cx+9.5} ${my}" stroke="${linha}"
              stroke-width="2.2" fill="none" stroke-linecap="round"/>
           <path d="M${cx-7.5} ${my-2.6} Q${cx} ${my-4.2} ${cx+7.5} ${my-2.6}" stroke="${som2}"
              stroke-width="1.2" fill="none" opacity=".55"/>`,
    fina:`<path d="M${cx-6.5} ${my} Q${cx} ${my+1.6} ${cx+6.5} ${my}" stroke="${linha}"
              stroke-width="1.7" fill="none" stroke-linecap="round"/>`,
    protetor:`<path d="M${cx-8} ${my-3} Q${cx} ${my-5} ${cx+8} ${my-3}
              L${cx+7.5} ${my+2.6} Q${cx} ${my+4.6} ${cx-7.5} ${my+2.6}Z"
              fill="#DCE4EC" stroke="${linha}" stroke-width="1.2"/>
            <path d="M${cx-4} ${my-3.6} L${cx-4} ${my+3.4} M${cx} ${my-4.2} L${cx} ${my+4}
              M${cx+4} ${my-3.6} L${cx+4} ${my+3.4}" stroke="#A9B4C0" stroke-width=".9"/>`,
  }[M];

  /* ---- cabelo ----------------------------------------------------------
     A versão anterior desenhava o crânio cheio de cabelo e depois "apagava" a
     testa com uma forma cor de pele. Essa forma descia até a linha dos olhos e
     cobria olhos e sobrancelhas.

     Agora o cabelo é UM caminho fechado que sobe do lado da têmpora, passa pelo
     topo do crânio e desce do outro lado, fechando por uma LINHA DO CABELO
     desenhada explicitamente. Não existe nada para apagar, então não há como
     invadir o rosto. */
  const capa=(linhaY,forma)=>{
    const {cx,topo,tempora,olhos}=A;
    const L=cx-tempora-1.5, R=cx+tempora+1.5;
    return `M${L} ${olhos-2}
      C${L-1} ${topo+3} ${cx-13} ${topo-2} ${cx} ${topo-2}
      C${cx+13} ${topo-2} ${R+1} ${topo+3} ${R} ${olhos-2}
      L${R} ${linhaY+3} ${forma} L${L} ${linhaY+3}Z`;
  };
  const tipoCab=CABELO_TIPOS[(c.cabelo||0)%CABELO_TIPOS.length];
  const th=A.testa;                       // linha do cabelo padrão
  const CABELO={
    raspado:``,
    "máquina":`<path d="${capa(th+1,`C${cx+A.tempora-4} ${th-2} ${cx-A.tempora+4} ${th-2} ${cx-A.tempora-1.5} ${th+1}`)}"
                fill="${cab}" opacity=".45"/>`,
    curto:`<path d="${capa(th,`C${cx+A.tempora-5} ${th-4} ${cx-A.tempora+5} ${th-4} ${cx-A.tempora-1.5} ${th}`)}"
            fill="${cab}"/>`,
    social:`<path d="${capa(th-1,`C${cx+A.tempora-3} ${th-6} ${cx-6} ${th-7} ${cx-A.tempora-1.5} ${th-1}`)}"
            fill="${cab}"/>`,
    topete:`<path d="${capa(th-2,`C${cx+A.tempora-5} ${th-7} ${cx-A.tempora+5} ${th-7} ${cx-A.tempora-1.5} ${th-2}`)}"
            fill="${cab}"/>
            <path d="M${cx-9} ${th-3} Q${cx-3} ${A.topo-12} ${cx+9} ${th-6} Q${cx} ${th-6} ${cx-9} ${th-3}Z"
            fill="${cab}"/>`,
    moicano:`<path d="${capa(th+2,`C${cx+A.tempora-4} ${th} ${cx-A.tempora+4} ${th} ${cx-A.tempora-1.5} ${th+2}`)}"
             fill="${cab}" opacity=".3"/>
             <path d="M${cx-6} ${th+1} C${cx-6} ${A.topo-10} ${cx+6} ${A.topo-10} ${cx+6} ${th+1}Z"
             fill="${cab}"/>`,
    coque:`<path d="${capa(th,`C${cx+A.tempora-5} ${th-4} ${cx-A.tempora+5} ${th-4} ${cx-A.tempora-1.5} ${th}`)}"
           fill="${cab}"/>`,
    dreads:`<path d="${capa(th+1,`C${cx+A.tempora-5} ${th-3} ${cx-A.tempora+5} ${th-3} ${cx-A.tempora-1.5} ${th+1}`)}"
            fill="${cab}"/>`,
    longo:`<path d="${capa(th,`C${cx+A.tempora-5} ${th-4} ${cx-A.tempora+5} ${th-4} ${cx-A.tempora-1.5} ${th}`)}"
           fill="${cab}"/>`,
  }[tipoCab];

  /* peças que ficam FORA do crânio, desenhadas sobre o cabelo base */
  const cabeloFora=tipoCab==="coque"
    ? `<circle cx="${cx}" cy="${A.topo-7}" r="7.5" fill="${cab}" stroke="${cabS}" stroke-width="1.2"/>`
    : tipoCab==="dreads"
    ? [0,1,2,3,4,5].map(i=>{
        const lado=i<3?-1:1,k=i%3;
        const x=cx+lado*(A.tempora-1+k*3.2), y=A.olhos-6+k*2.6;
        return `<rect x="${x-2.2}" y="${y}" width="4.4" height="${16+k*6}" rx="2.2" fill="${cab}"/>`;
      }).join("")
    : tipoCab==="longo"
    ? `<path d="M${cx-A.tempora-1} ${A.testa+2} C${cx-A.zigo-5} ${A.nariz} ${cx-A.zigo-4} ${A.queixo-4}
        ${cx-A.jaw-3} ${A.queixo+4} L${cx-A.jaw+1} ${A.queixo+4}
        C${cx-A.zigo+2} ${A.nariz+2} ${cx-A.tempora+1} ${A.olhos} ${cx-A.tempora+1} ${A.testa+3}Z" fill="${cab}"/>
       <path d="M${cx+A.tempora+1} ${A.testa+2} C${cx+A.zigo+5} ${A.nariz} ${cx+A.zigo+4} ${A.queixo-4}
        ${cx+A.jaw+3} ${A.queixo+4} L${cx+A.jaw-1} ${A.queixo+4}
        C${cx+A.zigo-2} ${A.nariz+2} ${cx+A.tempora-1} ${A.olhos} ${cx+A.tempora-1} ${A.testa+3}Z" fill="${cab}"/>`
    : "";

  /* ---- barba: recortada pela mandíbula, acompanha o formato do rosto ---- */
  const areaBarba=caminhoBarbaArea(A);
  const bigode=`<path d="M${cx-7} ${my-3.4} Q${cx} ${my-6} ${cx+7} ${my-3.4}
      Q${cx} ${my-1.4} ${cx-7} ${my-3.4}Z" fill="${cab}"/>`;
  const queixinho=`<path d="M${cx-4.5} ${my+4} Q${cx} ${my+2.6} ${cx+4.5} ${my+4}
      Q${cx+4} ${A.queixo-3} ${cx} ${A.queixo-1.5} Q${cx-4} ${A.queixo-3} ${cx-4.5} ${my+4}Z" fill="${cab}"/>`;
  const manto=(op,topo)=>`<path d="${areaBarba}" fill="${cab}" opacity="${op}"
      clip-path="url(#bar${id})" transform="translate(0 ${topo})"/>`;
  const BARBA={
    nenhuma:``,
    "por fazer":`<path d="${areaBarba}" fill="${cab}" opacity=".22" clip-path="url(#bar${id})"/>`,
    bigode:bigode,
    cavanhaque:bigode+queixinho,
    curta:`<path d="${areaBarba}" fill="${cab}" opacity=".55" clip-path="url(#bar${id})"/>`+bigode,
    "média":`<path d="${areaBarba}" fill="${cab}" opacity=".8" clip-path="url(#bar${id})"/>`+bigode,
    cheia:`<path d="${areaBarba}" fill="${cab}" clip-path="url(#bar${id})"/>`+bigode,
    costeleta:`<path d="M${cx-A.tempora+1} ${A.olhos-2} L${cx-A.jaw-1} ${A.nariz+8}
        L${cx-A.jaw+4} ${A.nariz+8} L${cx-A.tempora+5} ${A.olhos-2}Z" fill="${cab}"/>
      <path d="M${cx+A.tempora-1} ${A.olhos-2} L${cx+A.jaw+1} ${A.nariz+8}
        L${cx+A.jaw-4} ${A.nariz+8} L${cx+A.tempora-5} ${A.olhos-2}Z" fill="${cab}"/>`,
  }[BARBAS[(c.barba||0)%BARBAS.length]];

  /* ---- cicatriz: segue a anatomia da região, com relevo em vez de risco ---- */
  const cicCor="#B5806E";
  const CICS={
    nenhuma:``,
    "supercílio":`<path d="M${bx-3} ${by-4} L${bx-1.5} ${by+5}" stroke="${cicCor}" stroke-width="1.8"
        stroke-linecap="round"/><path d="M${bx-3.4} ${by-2} L${bx-1} ${by-1.4}
        M${bx-2.6} ${by+2} L${bx-.4} ${by+2.6}" stroke="${cicCor}" stroke-width=".9" opacity=".8"/>`,
    "maçã do rosto":`<path d="M${cx+A.zigo-4} ${A.olhos+6} Q${cx+A.zigo-6} ${A.nariz-1} ${cx+A.jaw-5} ${A.nariz+4}"
        stroke="${cicCor}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`,
    "abaixo do olho":`<path d="M${ex-4} ${ey+6.5} L${ex+3.5} ${ey+7.6}" stroke="${cicCor}"
        stroke-width="1.7" stroke-linecap="round"/>`,
    queixo:`<path d="M${cx-3} ${A.queixo-6} L${cx+2} ${A.queixo-3}" stroke="${cicCor}"
        stroke-width="1.8" stroke-linecap="round"/>`,
    "lábio":`<path d="M${cx+3.5} ${my-4.5} L${cx+5} ${my+3}" stroke="${cicCor}"
        stroke-width="1.7" stroke-linecap="round"/>`,
  };

  const altura=alt||Math.round(w*1.2);
  /* xmlns explícito: sem ele, o navegador aceita o SVG normalmente quando
     injetado direto no innerHTML (o parser de HTML já sabe que é SVG por
     contexto), mas REJEITA como recurso de imagem autônomo — data: URI ou
     Blob viram Image() que nunca carrega (onerror, sem mensagem útil).
     Confirmado com teste real em Chrome: falha sem xmlns, carrega normal
     com — é o que desenharCardMomento() precisa pra pôr o busto no canvas
     (ver "Card de momento" no LEIA-ME). Inofensivo pro uso inline de
     sempre, xmlns em SVG dentro de HTML é ignorado sem efeito. */
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="${w}" height="${altura}" class="boneco" aria-hidden="true">
  <defs>
    <clipPath id="cra${id}"><path d="${caminhoCranio(A)}"/></clipPath>
    <clipPath id="bar${id}"><path d="${caminhoCabeca(A)}"/></clipPath>
    <linearGradient id="luz${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${luz}" stop-opacity=".55"/>
      <stop offset=".55" stop-color="${pele}" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ombros -->
  <path d="M${cx-A.ombro} 120 C${cx-A.ombro+4} ${104} ${cx-14} ${100} ${cx} ${99}
           C${cx+14} ${100} ${cx+A.ombro-4} ${104} ${cx+A.ombro} 120Z"
    fill="${cal}" stroke="${linha}" stroke-width="1.8"/>
  <path d="M${cx} 99 L${cx} 120" stroke="${mistura(cal,'#000000',.3)}" stroke-width="1.4"/>

  <!-- pescoço: largura vem da anatomia, encaixa sob a mandíbula -->
  <path d="M${cx-A.pescocoW} ${A.queixo-9} L${cx-A.pescocoW-1} ${A.queixo+12}
           Q${cx} ${A.queixo+16} ${cx+A.pescocoW+1} ${A.queixo+12}
           L${cx+A.pescocoW} ${A.queixo-9}Z" fill="${pele}" stroke="${linha}" stroke-width="1.7"/>
  <path d="M${cx-A.pescocoW+1} ${A.queixo-6} Q${cx} ${A.queixo+3} ${cx+A.pescocoW-1} ${A.queixo-6}"
    fill="${som}" opacity=".55"/>
  <!-- trapézio -->
  <path d="M${cx-A.ombro+3} ${106} Q${cx} ${A.queixo+8} ${cx+A.ombro-3} ${106}"
    fill="none" stroke="${mistura(cal,'#000000',.22)}" stroke-width="1.2"/>

  <!-- orelhas (espelhadas): antes da cabeça, para ficarem atrás -->
  ${orelhaUma}
  <g transform="translate(${cx*2} 0) scale(-1 1)">${orelhaUma}</g>

  <!-- cabeça -->
  <path d="${caminhoCabeca(A)}" fill="${pele}" stroke="${linha}" stroke-width="2"/>
  <path d="${caminhoCabeca(A)}" fill="url(#luz${id})"/>
  <!-- maçãs do rosto e têmporas -->
  <path d="M${cx-A.zigo+2} ${A.olhos+4} Q${cx-A.jaw+3} ${A.nariz+3} ${cx-A.jaw+7} ${A.nariz+7}"
    stroke="${som}" stroke-width="1.6" fill="none" opacity=".35"/>
  <path d="M${cx+A.zigo-2} ${A.olhos+4} Q${cx+A.jaw-3} ${A.nariz+3} ${cx+A.jaw-7} ${A.nariz+7}"
    stroke="${som}" stroke-width="1.6" fill="none" opacity=".35"/>

  ${BARBA}

  <!-- nariz: base ancorada, quebrado como o de lutador -->
  <path d="M${cx-1.5} ${A.olhos+2} L${cx-2.5} ${A.nariz-3} Q${cx-4.5} ${A.nariz} ${cx-3} ${A.nariz+1.5}
    Q${cx} ${A.nariz+2.6} ${cx+3} ${A.nariz+1.5} Q${cx+4.5} ${A.nariz} ${cx+2.5} ${A.nariz-3}
    L${cx+1.5} ${A.olhos+2}" fill="${som}" opacity=".3"/>
  <path d="M${cx-4.2} ${A.nariz+.6} Q${cx} ${A.nariz+3.2} ${cx+4.2} ${A.nariz+.6}"
    stroke="${linha}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="${cx-2.4}" cy="${A.nariz+.4}" r=".9" fill="${linha}" opacity=".7"/>
  <circle cx="${cx+2.4}" cy="${A.nariz+.4}" r=".9" fill="${linha}" opacity=".7"/>

  <!-- olhos e sobrancelhas: desenhados uma vez, espelhados -->
  ${olhoUm}
  <g transform="translate(${cx*2} 0) scale(-1 1)">${olhoUm}</g>
  ${CEJA}
  <g transform="translate(${cx*2} 0) scale(-1 1)">${CEJA}</g>

  ${BOCA}
  ${CICS[CIC]||""}

  <!-- cabelo por último, recortado pelo crânio -->
  ${CABELO}
  ${cabeloFora}
</svg>`;
}

/* Hash estável: o mesmo lutador tem sempre o mesmo rosto, em qualquer sessão. */
function hashNome(s){
  let x=2166136261>>>0;
  for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0;}
  return x;
}
function cfgPadrao(){
  return{pele:1,cabelo:2,corCabelo:1,barba:1,olho:0,corOlho:0,sobrancelha:0,
         boca:0,cicatriz:0,calcao:0,porte:1};
}
/* Não existe rosto para os lutadores do dataset, e é deliberado: eles são
   pessoas reais e retrato reconhecível é direito de imagem. Só o lutador do
   jogador tem rosto. A função que derivava rosto de lutador real foi removida
   em vez de deixada sem uso, para ninguém reintroduzir sem querer. */

/* =========================================================================
   CARD COMPARTILHÁVEL
   Desenhado em canvas 1080x1350 (retrato, formato de story e de timeline).
   O importante não é a imagem: é a semente impressa nela. Com ela, quem vê
   pode jogar a MESMA carreira — mesmas cartas, mesmos adversários — e comparar.
   ========================================================================= */
const CARD_W=1080, CARD_H=1350;
/* O canvas não enxerga as variáveis CSS, então a paleta é repetida aqui
   (revamp fase 5: identidade "Noite de Luta", a mesma do :root em
   estilo.css). Mexeu lá, mexa aqui. */
const C={fundo:"#07080B",sup:"#11131A",sup2:"#1A1D26",osso:"#F2EEE6",osso2:"#C9CBD2",cinza:"#8A8F9C",
         sangue:"#D7261E",ouro:"#D4A017",ganho:"#2FBF71",linha:"rgba(255,255,255,.10)",linhaForte:"rgba(255,255,255,.20)"};
const FONTE={
  titulo:p=>`400 ${p}px Anton,Impact,"Arial Narrow",sans-serif`,
  ui:(p,w=700)=>`${w} ${p}px "Barlow Condensed","Arial Narrow",sans-serif`,
  texto:(p,w=400,it=false)=>`${it?"italic ":""}${w} ${p}px Barlow,system-ui,sans-serif`,
};
/* Fonte que ainda não apareceu na página não existe pro canvas: mede e
   desenha com a de reserva. Espera as três famílias antes de qualquer
   measureText. */
async function garantirFontesCard(){
  try{
    if(!document.fonts||!document.fonts.load)return;
    await Promise.all([FONTE.titulo(100),FONTE.ui(40,700),FONTE.ui(40,600),FONTE.texto(34,400,true),FONTE.texto(30,500)]
      .map(f=>document.fonts.load(f)));
    await document.fonts.ready;
  }catch(e){}
}
/* letterSpacing no canvas só existe em navegador novo; sem ele o texto só
   sai sem o espaçamento, nada quebra */
function espacar(x,px){ try{ if("letterSpacing" in x)x.letterSpacing=px+"px"; }catch(e){} }
function carregarImagem(src){
  return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;});
}
/* Foto da série de fundos do jogo cobrindo o card, escurecida de cima pra
   baixo: a parte de cima respira, a de baixo vira fundo liso pro texto. */
async function fotoCard(x,nome,w,h){
  try{
    const img=await carregarImagem(`img/${nome}.webp`);
    const esc=Math.max(w/img.width,h*.72/img.height);
    const iw=img.width*esc,ih=img.height*esc;
    x.save();x.globalAlpha=.95;x.drawImage(img,(w-iw)/2,0,iw,ih);x.restore();
  }catch(e){/* sem foto o card sai no fundo liso, nunca quebra o compartilhar */}
  const gr=x.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,"rgba(7,8,11,.30)");gr.addColorStop(.30,"rgba(7,8,11,.62)");
  gr.addColorStop(.52,"rgba(7,8,11,.93)");gr.addColorStop(1,"rgba(7,8,11,.98)");
  x.fillStyle=gr;x.fillRect(0,0,w,h);
}
function quebrar(ctx,txt,max){
  const linhas=[];let atual="";
  for(const p of String(txt).split(" ")){
    const t=atual?atual+" "+p:p;
    if(ctx.measureText(t).width>max&&atual){linhas.push(atual);atual=p;}
    else atual=t;
  }
  if(atual)linhas.push(atual);
  return linhas;
}

/* Plano Pro (item 5) — acabamento do card, opção A do plano aprovado:
   contorno duplo + canto cortado. Reconhecível de relance, SEM escrever
   "PRO" em letra grande — moldura, selo, na paleta que já existe (C.ouro,
   mesma cor de raridade das conquistas), nunca gradiente/brilho/cor nova.
   Card grátis continua pixel a pixel igual a antes; só entra quando
   meuPro é true no momento de gerar o card (é o próprio card que vira
   propaganda do plano quando compartilhado, não precisa de texto dizendo
   isso). Compartilhado pelos dois cards (fim de carreira e momento) —
   um único desenho, não dois inventados. */
const CORTE_CANTO_PRO=34;
/* 3 modelos de card (2026-09-22, pedido explícito) — mesmo corte/contorno
   de sempre, só a cor de destaque muda. "Ouro" é EXATAMENTE C.ouro: quem
   já é Pro hoje não pode ver o card mudar de cor sozinho, então o padrão
   tem que ser bit-a-bit igual ao que já existia. */
const CORES_CARD_PRO=[
  {id:"ouro",nome:"Ouro",cor:"#D4A017"},
  {id:"prata",nome:"Prata",cor:"#A9B2BC"},
  {id:"bronze",nome:"Bronze",cor:"#A9683A"},
];
let corCardProEscolha=(()=>{try{const v=parseInt(localStorage.getItem("corCardPro"),10);
  return(v>=0&&v<CORES_CARD_PRO.length)?v:0;}catch(e){return 0;}})();
function definirCorCardPro(i){
  corCardProEscolha=i;
  try{localStorage.setItem("corCardPro",String(i));}catch(e){}
}
function fundoCard(x,w,h,pro,cor){
  cor=cor||CORES_CARD_PRO[corCardProEscolha].cor;
  x.save();
  x.beginPath();
  if(pro){
    x.moveTo(CORTE_CANTO_PRO,0);x.lineTo(w,0);x.lineTo(w,h);x.lineTo(0,h);
    x.lineTo(0,CORTE_CANTO_PRO);x.closePath();
  }else x.rect(0,0,w,h);
  x.fillStyle=C.fundo;x.fill();
  x.restore();
  if(!pro)return;
  x.strokeStyle=cor;x.lineWidth=2;
  x.beginPath();
  x.moveTo(CORTE_CANTO_PRO,0);x.lineTo(w,0);x.lineTo(w,h);x.lineTo(0,h);
  x.lineTo(0,CORTE_CANTO_PRO);x.closePath();x.stroke();
  const o=14;                                   // régua interna, recuada — o "duplo" do contorno
  x.beginPath();
  x.moveTo(CORTE_CANTO_PRO+o,o);x.lineTo(w-o,o);x.lineTo(w-o,h-o);x.lineTo(o,h-o);
  x.lineTo(o,CORTE_CANTO_PRO+o);x.closePath();x.stroke();
}
/* Granulação por cima de tudo (mesma textura de filme da interface),
   gerada com gerador próprio: nunca toca nos 8 geradores da carreira. */
function granularCard(x,w,h){
  let s=987654321;const r=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  x.save();
  for(let i=0;i<Math.round(w*h/260);i++){
    x.fillStyle=r()<.5?"rgba(255,255,255,.05)":"rgba(0,0,0,.18)";
    x.fillRect(r()*w,r()*h,1.4,1.4);
  }
  x.restore();
}
/* Selo: octógono sólido, do tamanho de uma inicial — glifo, nunca texto
   "PRO". Fica no canto oposto ao rodapé octogono.fun (que é sempre
   alinhado à direita), pra não competir com ele. */
function seloProCanvas(x,cx,cy,r,cor){
  x.save();x.translate(cx,cy);
  x.beginPath();
  for(let i=0;i<8;i++){
    const ang=Math.PI/8+i*Math.PI/4,px=Math.cos(ang)*r,py=Math.sin(ang)*r;
    i===0?x.moveTo(px,py):x.lineTo(px,py);
  }
  x.closePath();x.fillStyle=cor||CORES_CARD_PRO[corCardProEscolha].cor;x.fill();
  x.restore();
}
/* Peças comuns dos cards (revamp fase 5). */
function cabecalhoCard(x,M,direita,subtitulo){
  x.textBaseline="alphabetic";x.textAlign="left";
  x.fillStyle=C.sangue;x.fillRect(M,M,70,6);
  x.fillStyle=C.osso;x.font=FONTE.titulo(52);x.fillText("OCTÓGONO",M,M+66);
  if(subtitulo){x.fillStyle=C.cinza;x.font=FONTE.texto(23,400,true);x.fillText(subtitulo,M,M+102);}
  if(direita){
    x.textAlign="right";x.fillStyle=C.sangue;x.font=FONTE.ui(25,700);espacar(x,4);
    x.fillText(direita.toUpperCase(),CARD_W-M,M+60);espacar(x,0);x.textAlign="left";
  }
}
/* Carimbo quadrado girado: nota da carreira (uma letra) ou rótulo do
   momento (1 a 3 linhas, a fonte encolhe até caber na caixa). */
function carimboCard(x,cx,cy,texto,{ouro=false,lado=190}={}){
  x.save();x.translate(cx,cy);x.rotate(-4*Math.PI/180);
  x.fillStyle=ouro?C.ouro:C.sangue;x.fillRect(-lado/2,-lado/2,lado,lado);
  x.fillStyle=ouro?"#15120A":"#FFFFFF";x.textAlign="center";x.textBaseline="middle";
  const max=lado-28;
  let t=texto.length<=2?168:66,linhas=[texto];
  for(;t>=20;t-=2){
    x.font=FONTE.titulo(t);linhas=quebrar(x,texto,max);
    if(linhas.length<=3&&linhas.every(l=>x.measureText(l).width<=max)&&linhas.length*t<=lado-22)break;
  }
  const alt=linhas.length*t;
  linhas.forEach((l,i)=>x.fillText(l,0,-alt/2+t/2+i*t+(texto.length<=2?8:3)));
  x.restore();x.textAlign="left";x.textBaseline="alphabetic";
}
function avatarCard(x,src,px,py,w,h){

}
function nomeCard(x,nome,txX,y0,txW,{max=108,min=48}={}){
  let t=max;x.font=FONTE.titulo(t);
  while(x.measureText(nome).width>txW&&t>min){t-=4;x.font=FONTE.titulo(t);}
  const ls=quebrar(x,nome,txW).slice(0,2);
  x.fillStyle=C.osso;
  ls.forEach((l,i)=>x.fillText(l,txX,y0+t+i*t*.96));
  return y0+t+(ls.length-1)*t*.96;
}
function rodapeCard(x,M,h,pro,cor,semente){

  x.textAlign="left";

}
/* Preview sintético pra vitrine do Plano Pro (item 2, 2026-09-22) — NÃO

function desenharPreviewCard(pro,cor){
  const cv=document.createElement("canvas");

  const x=cv.getContext("2d");

     verdade, navegador raro sem suporte): devolve o canvas em branco. */
  if(!x)return cv;
  const M=72;

  x.fillStyle=C.cinza;x.font=FONTE.ui(26,700);espacar(x,5);x.fillText("CARTEL",M+6,M+604);espacar(x,0);

/* Rótulo curto pro carimbo do card de momento — mesma caixa rotativa do
   desenharCard, etiqueta de 1-2 palavras em vez da nota A-F. Achado
   jogando (2026-09-08): "RARO" é nome interno de CATEGORIA, não fato —
   quem vê o print não entende por que aquele momento virou card. Cada
   rótulo agora diz o FATO ("CINTURÃO", "PERDEU O CINTURÃO", "ZEBRA",
   "ESTREIA NO MAIN CARD"), não a categoria. Dois tipos não têm fato fixo
   por design (o número muda a cada instância) — `ko` (tempo do nocaute)
   e `raro` (qual recorde específico) — esses são resolvidos por
   `rotuloMomento(m)`, não por esta tabela estática; entram aqui só como
   documentação do que cada tipo SIGNIFICA quando a tabela é a fonte. */
const ROTULO_MOMENTO={cinturao:"CINTURÃO",cinturaoPerdido:"PERDEU O CINTURÃO",
  upset:"ZEBRA",lesao:"VENCEU MACHUCADO",estreia:"ESTREIA NO MAIN CARD",
  cinturaoInterino:"CINTURÃO INTERINO",topoDivisao:"NÚMERO 1 DA TABELA",
  bonusNoite:"MELHOR ATUAÇÃO"};
/* raro é UMA categoria que cobre 3 recordes bem diferentes entre si (ver
   RARE, card:true) — não dá pra ter 1 rótulo estático pra "raro", cada
   id precisa dizer o recorde de verdade. invicto12/invicto18: o cartel
   JÁ É o rótulo (m.cartel, montado em criarMomento() no instante certo,
   antes do standing andar) — nenhuma tabela nova, reaproveita o que já
   existe. finishStreak não tem um número óbvio pra mostrar (é sobre NÃO
   ter ido aos cartões nenhuma vez), por isso ganha frase própria. */
const ROTULO_RARO={finishStreak:"NUNCA FOI AOS CARTÕES"};
/* Prioridade quando mais de um gatilho dispara NA MESMA LUTA (achado
   jogando: cinturão + 12-0 na mesma luta gerava DOIS cards, e o jogador
   só viu o card errado — raro, empurrado por último). Cinturão é o
   momento maior da carreira, sempre ganha; da metade pra baixo é
   julgamento de importância narrativa, não medido — cinturaoPerdido e
   estreia nunca competem entre si nem com cinturao/cinturaoInterino na
   prática (ramos won/lost são mutuamente exclusivos, e estreia só
   dispara ANTES de existir cinturao na mesma luta em título vencido —
   ver comentário de finishFight()), então só a ORDEM RELATIVA entre os
   que realisticamente colidem importa: cinturao/interino > upset/ko/
   lesao/raro (destaques de UMA luta) — cinturão continua sendo o fato
   maior mesmo disputado contra favorito, vencido rápido, ou com lesão. */
/* bonusNoite por último de propósito: "melhor atuação até agora" é comum
   (medido: 75-78% das carreiras batem pelo menos 1 recorde só na 2ª
   metade) — se colidir com QUALQUER outro tipo na mesma luta (achado
   escrevendo o teste: um 18-0 na luta 18 também é, por definição, a
   1ª vez que st.bonusNoite existe, e por isso também "bate recorde"),
   o outro tipo é sempre o fato mais especial. */
const ORDEM_MOMENTO=["cinturao","cinturaoInterino","cinturaoPerdido","estreia",
  "topoDivisao","upset","ko","lesao","raro","bonusNoite"];
function rotuloMomento(m){
  if(m.tipo==="raro")return ROTULO_RARO[m.raroId]||m.cartel;
  if(m.tipo==="ko"&&m.segundosKO!=null)return`NOCAUTE EM ${m.segundosKO}s`;
  return ROTULO_MOMENTO[m.tipo]||"MOMENTO";
}

/* SVG do busto -> <img> carregável, pra desenhar no canvas com drawImage().
   data: URI com encodeURIComponent (não btoa): bonecoSVG() é auto-contido —
   só paths/gradientes/clipPaths INTERNOS (url(#id) aponta pra <defs> do
   mesmo documento, nunca pra fora), width/height explícitos no <svg> raiz
   (não só viewBox) — os dois requisitos que historicamente quebravam
   SVG-em-canvas no Safari (tamanho 0 sem width/height; canvas "tainted" em
   toDataURL() com referência externa). Não dá pra testar num iPhone de
   verdade a partir daqui — conferir manualmente depois do deploy. */
function svgParaImagem(svg){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });
}

/* Fundo do card de momento: a foto combina com o que aconteceu. */
const FUNDO_MOMENTO={cinturao:"cinturao",cinturaoInterino:"cinturao",cinturaoPerdido:"apagado",ko:"confete",
  upset:"arena-alto",lesao:"vestiario",estreia:"entrada",topoDivisao:"arena",bonusNoite:"confete",raro:"fotos"};
async function desenharCardMomento(m){
  await garantirFontesCard();
  const cv=document.createElement("canvas");
  cv.width=CARD_W;cv.height=CARD_H;
  const x=cv.getContext("2d");
  const M=72;
  /* Altura dinâmica (achado jogando em produção): mede a frase e as
     linhas de dados ANTES de fixar a altura; frase curta não deixa um
     buraco vazio antes do rodapé. A largura nunca muda. */
  x.font=FONTE.texto(36,400,true);
  const lsFrase=quebrar(x,m.frase,CARD_W-M*2-34).slice(0,5);
  const avW=250,avH=Math.round(avW*1.2),avY=M+140;
  const dados=[["Adversário",m.adversario],["Resultado",m.resultado],["Posição na divisão",m.posicao]].filter(d=>d[1]);
  const yDados=avY+avH+64;
  const yFrase=yDados+dados.length*62+54;
  const H=Math.max(1060,yFrase+lsFrase.length*50+30+104+M);
  cv.width=CARD_W;cv.height=H;      // reseta o canvas pro tamanho final (nada foi desenhado ainda)

  fundoCard(x,CARD_W,H,meuPro);
  await fotoCard(x,FUNDO_MOMENTO[m.tipo]||"arena",CARD_W,H);
  cabecalhoCard(x,M,`Luta ${m.luta} de ${TOTAL_FIGHTS}`,"Monte seu lutador de MMA. Jogue a carreira inteira.");

  await avatarCard(x,bonecoSVG(ROSTO||cfgPadrao(),{w:avW}),M-8,avY,avW,avH);
  const txX=M+avW+14,txW=CARD_W-M-230-txX;
  const y=nomeCard(x,me.name.toUpperCase(),txX,avY+6,txW,{max:92,min:44});
  const dv=(DIVISOES.find(d=>d.id===DIVISION)||{}).nome||DIVISION;
  x.fillStyle=C.cinza;x.font=FONTE.ui(24,700);espacar(x,4);x.fillText(dv.toUpperCase(),txX,y+40);espacar(x,0);
  x.fillStyle=C.osso;x.font=FONTE.titulo(116);x.fillText(m.cartel,txX,avY+avH-22);
  x.fillStyle=C.cinza;x.font=FONTE.ui(22,700);espacar(x,5);x.fillText("CARTEL NA HORA",txX+4,avY+avH+10);espacar(x,0);
  carimboCard(x,CARD_W-M-100,avY+104,rotuloMomento(m),{ouro:/CINTUR/.test(rotuloMomento(m))&&m.tipo!=="cinturaoPerdido"});

  let yl=yDados;
  dados.forEach(([rot,val])=>{
    x.fillStyle=C.linha;x.fillRect(M,yl-40,CARD_W-M*2,2);
    x.fillStyle=C.cinza;x.font=FONTE.ui(22,700);espacar(x,3);x.fillText(rot.toUpperCase(),M,yl);espacar(x,0);
    x.fillStyle=C.osso;x.font=FONTE.ui(30,700);x.textAlign="right";x.fillText(String(val),CARD_W-M,yl);x.textAlign="left";
    yl+=62;
  });

  x.font=FONTE.texto(36,400,true);
  x.fillStyle=C.sangue;x.fillRect(M,yFrase-36,6,lsFrase.length*50+6);
  x.fillStyle=C.osso;lsFrase.forEach((l,i)=>x.fillText(l,M+30,yFrase+i*50));

  rodapeCard(x,M,H,meuPro,null,"#"+SEED.toString(36).toUpperCase());
  granularCard(x,CARD_W,H);
  return cv;
}

/* Abre por cima de tudo, sem tocar em playing/auto/dilemaAberto — o
   automático continua rodando por baixo se o jogador não fechar. */
async function abrirPainelMomentos(){
  const p=document.getElementById("painelMomentos");
  p.innerHTML="";
  const box=el("div","hub-lista momentos");
  if(!st.momentos.length){
    box.appendChild(vazio("cards","Nenhum card ainda","Nocaute rápido, cinturão, zebra: os momentos marcantes da carreira viram card pra compartilhar."));
  }else{
    for(const m of st.momentos){
      const item=el("div","momento-item");
      const texto=el("div","momento-texto");
      texto.appendChild(el("div","frase",m.frase));
      texto.appendChild(el("div","meta",`Luta ${m.luta} de ${TOTAL_FIGHTS} · ${m.cartel}`));
      const acoes=el("div","row");
      const btnSalvar=el("button","btn btn-sm","Salvar imagem");
      btnSalvar.onclick=()=>salvarImagem(m,btnSalvar,desenharCardMomento);
      const btnCopiar=el("button","btn btn-ghost btn-sm","Copiar imagem");
      btnCopiar.onclick=()=>copiarImagem(m,btnCopiar,desenharCardMomento);
      acoes.append(btnSalvar,btnCopiar);
      texto.appendChild(acoes);
      /* miniatura: o mesmo canvas do card de verdade, reduzido — sem prévia
         o jogador só descobre o que vai postar depois de baixar.

         Fundo CSS, não <canvas>/<img> (2026-09-11, achado jogando: botão
         direito → "Copiar imagem" na miniatura copiava o canvas de 140px
         DIRETO, ilegível — o navegador lê o pixel do elemento, nunca passa
         pelo onclick). Interceptar o clique não resolve: "Copiar imagem"
         do menu do navegador não é evento de JS, não tem como redirecionar
         pra outra fonte. `background-image` também não some do "Salvar
         imagem": Chrome/Firefox só oferecem esse item de menu pra
         <img>/<canvas>/<svg> — um <div> com fundo CSS não é destino
         desses itens. A miniatura também aciona salvarImagem() no clique
         esquerdo, mesmo caminho do botão "Salvar" — atalho, não a defesa. */
      try{
        const cv=await desenharCardMomento(m);
        const thumbW=180,thumbH=Math.round(thumbW*CARD_H/CARD_W);
        /* Moldura (Fase 8, 2026-09-17): passe-partout ao redor da miniatura
           — .momento-moldura é só padding+borda, .momento-mini continua o
           MESMO <div> de fundo CSS de sempre, tamanho/onclick/background
           intactos. Não é <canvas>/<img> antes nem depois. */
        const mini=el("div","momento-mini");
        mini.style.width=thumbW+"px";mini.style.height=thumbH+"px";
        mini.style.backgroundImage=`url(${cv.toDataURL("image/png")})`;
        mini.onclick=()=>salvarImagem(m,btnSalvar,desenharCardMomento);
        const moldura=el("div","momento-moldura");
        moldura.appendChild(mini);
        item.appendChild(moldura);
      }catch(e){/* sem prévia não impede salvar — segue sem a miniatura */}
      item.appendChild(texto);
      box.appendChild(item);
    }
  }
  p.appendChild(box);
}

/* Visual de documento, sem canto arredondado. Na frente do nome, ícone de
   check (desbloqueada) ou cadeado (travada): redundância de propósito,
   ajuda quem não distingue a cor do glifo (revamp fase 5: eram os
   caracteres "✓"/"·"; ícone só SVG). O ícone (iconeConquista(), moldura+glifo por
   categoria) e o rótulo de raridade (raridadeConquista(), badge
   reaproveitado) entraram em 2026-09-21 — ver comentário perto de
   CONQUISTAS/TAXA_MEDIDA_CONQUISTAS pro raciocínio completo. Igual ao
   painel de cards: não toca em playing/auto/dilemaAberto, o automático
   continua rodando por baixo se o jogador não fechar. */
function abrirPainelConquistas(){
  const p=document.getElementById("painelConquistas");
  p.innerHTML="";
  const box=el("div","hub-lista conquistas");
  const n=CONQUISTAS_DESBLOQUEADAS.size,total=CONQUISTAS.length;
  box.appendChild(el("div","conq-progresso",`<div class="conq-num">${n}<small>/${total}</small></div>
    <div class="conq-barra"><i style="width:${Math.round(100*n/Math.max(1,total))}%"></i></div>`));
  CONQUISTAS.forEach(c=>{
    const ok=CONQUISTAS_DESBLOQUEADAS.has(c.id);
    const item=el("div","conquista"+(ok?" ok":""));
    item.innerHTML=iconeConquista(c.cat);
    const raridade=raridadeConquista(c.id);
    const texto=el("div","conquista-texto",`
      <div class="conquista-nome">${ICONE(ok?"check":"cadeado","conquista-estado")}<span>${c.nome}</span>${
        raridade?`<span class="badge badge-${RARIDADE_BADGE[raridade]}">${raridade}</span>`:""}</div>
      <div class="conquista-desc">${c.desc}</div>`);
    item.appendChild(texto);
    box.appendChild(item);
  });
  const plat=el("div","conquista"+(n>=total?" ok":""));
  plat.innerHTML=iconeConquista("estrela");
  const platTexto=el("div","conquista-texto",`
    <div class="conquista-nome">${ICONE(n>=total?"check":"cadeado","conquista-estado")}<span>Platina</span></div>
    <div class="conquista-desc">${n>=total?"Todas as conquistas desbloqueadas.":`Faltam ${total-n} pra completar.`}</div>`);
  plat.appendChild(platTexto);
  box.appendChild(plat);
  p.appendChild(box);
}

/* Loja: compras permanentes até a aposentadoria, uma vez cada por
   carreira. Nenhuma mexe em me.__base — cada uma escreve numa camada
   derivada que já existe (eventoMod, chance de lesão), do jeito que a
   lesão faz. Cada item carrega descrição em linguagem de jogador
   (negrito, "o que é") separada do efeito mecânico (negrito, verde
   escuro, "o que muda e quanto") — sem isso o jogador compra no
   escuro, mesmo problema do treinador antigo (+0,05 vitórias) que
   ninguém percebia que era inútil (ver PENDENCIAS.md). */
const LOJA_ITENS=[
  {id:"treinador",nome:"Treinador melhor",custo:()=>CUSTO_TREINADOR,
   comprado:()=>!!st.treinadorComprado,
   desc:()=>"Fisioterapia particular: se machucar, você volta muito mais rápido. Vale até o fim da carreira.",
   efeito:()=>{
     const antes=LESAO_TIPOS.temporaria.duracao,depois=Math.round(antes*REDUCAO_CURA_TREINADOR);
     return `Efeito: lesão temporária dura ${depois} lutas em vez de ${antes} (recuperação, não muda a força da lesão).`;
   },
   comprar:()=>{st.treinadorComprado=true;}},
  {id:"equipamento",nome:"Equipamento de proteção",custo:()=>CUSTO_EQUIPAMENTO,
   comprado:()=>!!st.equipamentoComprado,

/* Desenha o canvas e devolve o PNG já em blob — usado por salvarImagem() e
   copiarImagem(), que faziam a mesma espera de fonte+canvas duas vezes
   quando eram uma função só (compartilhar()). */
async function gerarBlobCard(g,desenhar){
  /* Achado jogando (2026-09-24): "joguei uma carreira e não vi card
     nenhum novo" — meuPro só é atualizado 1x, no INÍCIO da carreira
     (atualizarStatusPro() fire-and-forget em startCareer()), sem
     retry. Se essa chamada falhar (rede) ou simplesmente não tiver
     terminado ainda, meuPro fica false o resto da carreira INTEIRA,
     inclusive no momento mais importante: gerar o card final. Reconfere
     fresco bem aqui, no ÚNICO lugar por onde salvarImagem()/
     copiarImagem() passam — mesmo raciocínio do bug do fechamento
     capturado no botão "Seja uma lenda" (nunca confiar num valor pego
     de antemão quando dá pra reconferir na hora que importa). */
  await atualizarStatusPro();
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const cv=await desenhar(g);
  return await new Promise(r=>cv.toBlob(r,"image/png"));
}
/* Salvar e Copiar eram UM botão só (compartilhar(), via navigator.share())
   que decidia sozinho, por navegador, se baixava o arquivo ou abria a
   folha de compartilhamento do sistema. Achado: no Mac, share() com
   {files,text,url} juntos podia devolver a folha do SO oferecendo o
   arquivo da imagem E o link como dois itens de compartilhamento — lê
   como "a imagem veio duplicada" sem nenhum bug de verdade no arquivo
   gerado (sempre foi um só). Separado em dois botões determinísticos, sem
   folha nativa nenhuma no meio: Salvar sempre baixa, Copiar sempre
   escreve na área de transferência — mesmo resultado em qualquer
   navegador. Mesmo guard de antes (disabled checado, não só atribuído) —
   é o que já provava, com dente, que toque duplo não gera 2 arquivos. */
async function salvarImagem(g,btn,desenhar=desenharCard){
  if(btn.disabled)return;
  btn.disabled=true;const antes=btn.textContent;btn.textContent="Gerando…";
  try{
    const blob=await gerarBlobCard(g,desenhar);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`${me.name.replace(/\s+/g,"-").toLowerCase()}.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    btn.textContent="Salvo";
  }catch(e){ btn.textContent="Não deu"; }
  setTimeout(()=>{btn.textContent=antes;btn.disabled=false;},1800);
}
async function copiarImagem(g,btn,desenhar=desenharCard){
  if(btn.disabled)return;
  btn.disabled=true;const antes=btn.textContent;btn.textContent="Gerando…";
  try{
    const blob=await gerarBlobCard(g,desenhar);
    if(!navigator.clipboard||!window.ClipboardItem)throw new Error("sem suporte a copiar imagem neste navegador");
    await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
    btn.textContent="Copiada!";           // aviso claro, mesmo padrão do "Copiado" no botão de link de desafio
  }catch(e){ btn.textContent="Não deu pra copiar"; }
  setTimeout(()=>{btn.textContent=antes;btn.disabled=false;},2200);
}

/* Uma carreira são 22 lutas sem repetir adversário, então divisão com menos de
   40 lutadores não fecha. O peso-pena feminino tem 5 e fica de fora. */
const MIN_LUTADORES=40;

/* ---------- modo de jogo ----------
   "lenda" troca o pool INTEIRO — draft e adversários — por campeões e nomes
   grandes. Lenda é quem já disputou cinturão OU está no topo do rating.

   O corte é 13/18 escrito assim, e não 0.72, porque rating é vitórias em 18
   simulações: os únicos valores que existem são múltiplos de 1/18. Escrever
   "0.70" pegaria exatamente o mesmo conjunto que "0.67" e esconderia que a
   escala é discreta. Medido: esse corte deixa 32% a 43% de cada divisão.

   Nem toda divisão fecha nesse modo. Uma carreira são 22 lutas sem repetir
   adversário, e peso-mosca (32 lendas) e as três divisões femininas
   (15 a 25) ficam abaixo de MIN_LUTADORES. Elas somem do modo lenda em vez de
   entrar e repetir adversário no meio da carreira. */
const RATING_LENDA=13/18;
const ehLenda=f=>(f.titulos&&f.titulos.disputas>=1)||f.rating>=RATING_LENDA-1e-9;
let MODO="normal";
/* Modo Rival — ativação explícita (item 4, 2026-09-22). Escolha feita em
   screenAtivarRival(), entre a divisão e o draft; sobrevive até
   startCareer() copiar pra dentro de st (mesmo padrão de MODO/DIVISION/
   SEED — variável de módulo que atravessa o setup da carreira). Sem isto,
   Modo Rival era 100% automático e silencioso: o jogador só descobria
   que existia se reparasse num selo pequeno na 4ª carta, sem escolha,
   sem nome próprio, sem aviso — achado jogando (pedido explícito). */
let RIVAL_ATIVADO=false,RIVAL_NOME_ESCOLHIDO=null;
function poolDivisao(id,modo){
  const p=ROSTER?ROSTER.filter(f=>f.division===id):[];
  return (modo||MODO)==="lenda"?p.filter(ehLenda):p;
}

/* Campeão nomeado. Critério é conquista (titulos.vitorias/disputas), não
   rating: rating é vitórias em 18 simulações, só existem ~19 valores
   distintos e no peso-leve 26 lutadores empatam — não dá pra nomear ninguém
   com isso. Estático, deriva só do dataset: nenhuma carreira de NPC é
   simulada (o cinturão só troca de mãos com o jogador; ver PENDENCIAS 1b).

   Recência entra como BUCKET, não como corte: quem não luta há
   CUTOFF_RANKING anos cai pro fim da lista em vez de sumir dela, senão o
   peso-pesado "atual" seria o Randy Couture. Medido nas 11 divisões × 2
   modos com esse corte de 6 anos: nenhum campeão sai com zero título, e o
   modo lenda nomeia os mesmos campeões do modo normal (ehLenda nunca
   derruba quem já é campeão). Sem fallback — não é caso que acontece. */
let CUTOFF_RANKING=null;
function buildRanking(pool){
  const comparar=(a,b)=>
    (b.titulos.vitorias-a.titulos.vitorias)||
    (b.titulos.disputas-a.titulos.disputas)||
    (b.fights-a.fights);
  const ativos=pool.filter(f=>f.era&&f.era[1]>=CUTOFF_RANKING).sort(comparar);
  const inativos=pool.filter(f=>!f.era||f.era[1]<CUTOFF_RANKING).sort(comparar);
  const lista=[...ativos,...inativos].slice(0,16);
  return{campeao:lista[0]||null,desafiante:lista[1]||null,lista};
}

const ICONE=(nome,cls="")=>
  `<svg class="ico${cls?" "+cls:""}" aria-hidden="true" focusable="false"><use href="img/icones.svg#${nome}"></use></svg>`;

const ROTAS={};

/* O Supabase devolve login com Google, confirmação de e-mail e link de
   recuperação de senha no HASH (#access_token=...&type=...). Se isso
   virasse nome de rota, o jogo abria a 404 e, pior, reescrevia o hash
   antes do Supabase ler o token: login perdido. auth:true avisa quem
   chama pra NÃO mexer na URL. */
function lerRota(){
  let h="";
  try{ h=String(location.hash||""); }catch(e){}
  if(/access_token=|refresh_token=|error_description=|type=recovery|type=signup/.test(h))
    return{nome:"menu",param:null,auth:true};
  const partes=h.replace(/^#\/?/,"").split("/").filter(Boolean);
  return{nome:partes[0]||"menu",param:partes.slice(1).join("/")||null,auth:false};
}
function irPara(nome,param=null,{substituir=false}={}){
  const alvo="#/"+nome+(param?"/"+param:"");
  try{
    if(location.hash!==alvo){
      if(substituir)history.replaceState(null,"",alvo);
      else history.pushState(null,"",alvo);
    }
  }catch(e){/* sem history: navega igual, só não entra no histórico */}
  mostrarRota(nome,param);
}
function mostrarRota(nome,param){

/* Corte diagonal vermelho: cobre a tela em ~170ms, troca o conteúdo
   coberto, descobre. Sem animação (reduce-motion ou sem o elemento),
   troca direto. */
function transicao(trocar){
  const c=document.getElementById("corte");
  if(reduceMotion()||!c||!c.classList){ trocar(); rolarTopo(); return; }
  c.classList.remove("corte-on"); void c.offsetWidth; c.classList.add("corte-on");
  setTimeout(()=>{ trocar(); rolarTopo(); },170);
}

   recurso Pro. Sem Pro, o recurso aparece a 35% de opacidade e não
   responde a clique; o único ponto clicável é o selo "Assine o Pro", que
   leva à aba do plano. Com Pro, devolve o elemento sem mudar nada. A
   trava de verdade continua no servidor (api/ai.js confere o plano);
   isto é só a interface não oferecer o que a pessoa não tem. */
function bloqueioPro(elemento){
  if(meuPro)return elemento;
  elemento.className=(elemento.className?elemento.className+" ":"")+"bloqueado";
  elemento.onclick=null;
  elemento.inert=true;   // o miolo (campo, botão) também sai do teclado, não só do mouse
  if(elemento.setAttribute){ elemento.setAttribute("aria-disabled","true"); elemento.setAttribute("tabindex","-1"); }
  const w=el("div","bloqueio-pro");
  const selo=el("button","selo-assine",`${ICONE("cadeado")}<span>Assine o Pro</span>`);
  selo.type="button";
  selo.onclick=e=>{ if(e&&e.stopPropagation)e.stopPropagation(); SOM.toque(); irPara("conta","pro"); };
  w.append(elemento,selo);
  return w;
}

/* Mês em 3 letras, maiúsculo, sem depender de Intl (o teste roda sem). */
const MESES=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
function fmtData(iso){
  const d=new Date(iso+(String(iso).length===10?"T12:00:00":""));
  return isNaN(d)?String(iso):`${String(d.getDate()).padStart(2,"0")} ${MESES[d.getMonth()]}`;
}
const fmtPontos=n=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,".");

/* Placar (a fase 3 cria a tabela). Nunca rejeita: sem Supabase, sem
   tabela, sem rede ou erro de RLS, devolve lista vazia e a tela mostra
   o estado vazio. */
async function buscarPlacar({divisao=null,modo="normal",limite=50}={}){
  const sb=getSupabase();
  if(!sb)return[];
  try{
    let q=sb.from("placar").select("nome_lutador,divisao,modo,pontuacao,cartel,nota,cinturoes,rosto").eq("modo",modo);
    if(divisao)q=q.eq("divisao",divisao);
    const{data,error}=await q.order("pontuacao",{ascending:false}).limit(limite);
    return error||!Array.isArray(data)?[]:data;
  }catch(e){ return[]; }
}

/* "há 2 horas" sem Intl (o teste roda sem) */
function fmtRelativo(iso){
  const d=new Date(iso);if(isNaN(d))return"";
  const min=Math.round((Date.now()-d.getTime())/60000);
  if(min<2)return"agora há pouco";
  if(min<60)return`há ${min} minutos`;
  const h=Math.round(min/60);if(h<24)return`há ${h} hora${h>1?"s":""}`;
  const dias=Math.round(h/24);return dias===1?"ontem":`há ${dias} dias`;
}

/* Card de um espaço ocupado. modo "continuar": Continuar + Apagar;
   modo "substituir": Substituir (tela de espaço cheio). Apagar e
   substituir pedem confirmação no próprio card, nunca em diálogo. */
function slotSalvo(sv,n,modo,aoMudar){
  const compat=sv.versao===VERSAO_SAVE;
  const s=sv.st||{};
  /* elementos de verdade (não string): as ações entram DENTRO do miolo,
     senão o flex do .cartao põe os botões ao lado do conteúdo */
  const card=el("div","cartao save-slot save-slot-cheio entra");
  const miolo=el("div","cartao-miolo");
  const conteudo=el("div","cartao-conteudo",
    `<span class="cartao-rotulo">Espaço ${n}${sv.modo==="lenda"?` <span class="selo-lenda">Lenda</span>`:""}</span>
     <span class="slot-retrato">${bonecoSVG(sv.rosto||cfgPadrao(),{w:110})}</span>
     <span class="cartao-titulo">${sv.nome||"Sem nome"}</span>
     <span class="slot-linha">${nomeDivisao(sv.divisao)}${s.title?` ${ICONE("medalha","slot-cinturao")}`:""}</span>
     <span class="slot-linha slot-cartel"><b>${s.wins||0}-${s.losses||0}</b> · Luta ${sv.fightNo||0} de ${TOTAL_FIGHTS}</span>
     <span class="slot-quando">${compat?`Jogado ${fmtRelativo(sv.atualizadoEm)}`:"Save de uma versão antiga do jogo"}</span>`);
  miolo.appendChild(conteudo);card.appendChild(miolo);
  card.style.animationDelay=((n-1)*80)+"ms";
  const acoes=el("div","slot-acoes-linha");
  const confirmar=(rotulo,classeSim,aoConfirmar)=>{
    acoes.innerHTML="";
    const sim=el("button",`botao ${classeSim}`,rotulo);sim.type="button";
    const nao=el("button","botao botao-sec","Cancelar");nao.type="button";
    sim.onclick=async()=>{ SOM.toque(); await aoConfirmar(); };
    nao.onclick=()=>{ SOM.toque(); desenharAcoes(); };
    acoes.append(sim,nao);
  };
  const desenharAcoes=()=>{
    acoes.innerHTML="";
    if(modo==="substituir"){
      const sub=el("button","botao botao-sec slot-substituir",`${ICONE("lixeira")}<span>Substituir</span>`);sub.type="button";
      sub.onclick=()=>{ SOM.toque(); confirmar("Substituir de vez","slot-substituir-sim",async()=>{
        await apagarSave(n); SLOT_ATUAL=n; screenName(); }); };
      acoes.appendChild(sub);
      return;
    }
    const cont=el("button","botao slot-continuar",`<span>Continuar</span>${ICONE("seta-dir")}`);cont.type="button";
    cont.disabled=!compat;
    cont.onclick=()=>{ SOM.toque(); SLOT_ATUAL=n; retomarCarreira(sv); };
    const apagar=el("button","botao botao-sec slot-apagar",`${ICONE("lixeira")}<span>Apagar</span>`);apagar.type="button";
    apagar.onclick=()=>{ SOM.toque(); confirmar("Apagar de vez","slot-apagar-sim",async()=>{
      await apagarSave(n); if(aoMudar)aoMudar(); }); };
    acoes.append(cont,apagar);
  };
  desenharAcoes();
  conteudo.appendChild(acoes);
  return card;
}
/* Nova carreira (revamp fase 3): ocupa o 1º espaço livre; com os 3

function nomeDivisao(id){ const d=DIVISOES.find(x=>x.id===id); return d?d.nome:""; }
/* Melhor carreira do jogador logado no filtro atual + posição dela
   (quantas têm pontuação maior, +1). Sem sessão ou sem carreira: null. */
async function buscarMinhaPosicao({divisao=null,modo="normal"}={}){
  const sb=getSupabase();
  if(!sb)return null;
  if(!USUARIO_ID)await sessaoAtual();
  if(!USUARIO_ID)return null;
  try{
    let q=sb.from("placar").select("nome_lutador,divisao,pontuacao,cartel,nota,cinturoes,rosto").eq("user_id",USUARIO_ID).eq("modo",modo);
    if(divisao)q=q.eq("divisao",divisao);
    const{data}=await q.order("pontuacao",{ascending:false}).limit(1);
    const minha=Array.isArray(data)&&data[0];
    if(!minha)return null;
    let c=sb.from("placar").select("seed",{count:"exact",head:true}).eq("modo",modo).gt("pontuacao",minha.pontuacao);
    if(divisao)c=c.eq("divisao",divisao);
    const{count}=await c;
    return{...minha,posicao:(count||0)+1};
  }catch(e){ return null; }
}
function desenharRanking(area,linhas,minha){
  area.innerHTML="";
  if(!linhas.length){
    area.appendChild(vazio("trofeu","Nenhuma carreira no placar ainda.","Termine uma carreira para aparecer aqui."));
    return;
  }
  if(minha){
    const barra=el("div","rank-minha",`<span class="rank-minha-rot">Sua melhor posição</span>`+linhaRanking(minha,minha.posicao).innerHTML);
    area.appendChild(barra);
  }
  const podio=el("div","podio");
  [1,0,2].forEach(i=>{ if(linhas[i])podio.appendChild(degrauPodio(linhas[i],i+1)); });
  area.appendChild(podio);
  const lista=el("ol","ranking-lista");
  linhas.slice(3).forEach((l,i)=>lista.appendChild(linhaRanking(l,i+4)));
  area.appendChild(lista);
}
function degrauPodio(l,pos){
  return el("div",`degrau degrau-${pos} entra`,
    `<span class="degrau-retrato">${bonecoSVG(l.rosto||cfgPadrao(),{w:pos===1?120:96})}</span>
