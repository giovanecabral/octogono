/* Gráfico da aba Mídia: seguidores no começo e depois de cada luta. */
function renderMidia(){
  const g=document.getElementById("midiaGrafico");
  if(!g||!st)return;
  const pts=[SEGUIDORES_INICIAIS].concat((st.registro||[]).filter(r=>typeof r.seg==="number").map(r=>r.seg));
  if(pts.length<2){
    g.innerHTML="";
    g.appendChild(vazio("grafico","Sem curva ainda","Os seguidores de cada luta aparecem aqui depois da primeira."));
    return;
  }
  const W=640,H=220,pad=14;
  const max=Math.max(...pts),min=Math.min(...pts);
  const x=i=>pad+(W-2*pad)*i/(pts.length-1);
  const y=v=>H-pad-(H-2*pad)*((v-min)/Math.max(1,max-min));
  const linha=pts.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  g.innerHTML=`<div class="painel-cab">${ICONE("seguidores")}Seguidores por luta</div>
    <div class="grafico-num"><b>${fmtNum(st.followers)}</b><span>pico ${fmtNum(st.peakFollowers)}</span></div>
    <svg class="grafico" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Seguidores por luta">
      <defs><linearGradient id="grafArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7261E" stop-opacity=".42"/><stop offset="1" stop-color="#D7261E" stop-opacity="0"/></linearGradient></defs>
      <polyline points="${linha}" fill="none" stroke="#E8362D" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <polygon points="${pad},${H-pad} ${linha} ${x(pts.length-1).toFixed(1)},${H-pad}" fill="url(#grafArea)"/>
    </svg>
    <div class="grafico-eixo"><span>Início</span><span>Luta ${pts.length-1}</span></div>`;
}
/* O que aconteceu depois da luta (evento, raro, dilema, entrevista) vai
   pra última entrada do registro, pra carreira retomada mostrar igual. */
function registrarExtra(x,luta){
  /* luta: número da luta dona do extra (evento da IA pode chegar depois
     da luta seguinte já ter terminado); sem ele, a última luta */
  const reg=st&&st.registro&&(luta!=null?st.registro.find(r=>r.n===luta):st.registro[st.registro.length-1]);
  if(reg)(reg.extras=reg.extras||[]).push(x);
}
function linhaExtra(x){
  /* Save gravado antes da regra de texto (fase 7) guarda narração, evento
     ("— " na frente) e texto de IA com travessão: limpa na hora de mostrar.
     A resposta digitada pelo jogador fica como ele escreveu. */
  x={...x,titulo:semTravessao(x.titulo),cena:semTravessao(x.cena),texto:semTravessao(x.texto)};
  if(x.tipo==="dilema"||x.tipo==="entrevista"||x.tipo==="coletiva"){
    const b=el("div","dilema");
    b.innerHTML=`<div class="dil-eyebrow">${x.tipo==="dilema"?"Decisão":x.tipo==="coletiva"?"Coletiva":"Entrevista"}</div>
      ${x.titulo?`<div class="dil-t">${x.titulo}</div>`:""}
      ${x.cena?`<div class="dil-c">${x.cena}</div>`:""}
      ${x.resposta?`<div class="dil-r">"${x.resposta}"</div>`:""}
      ${x.tipo==="dilema"?`<div class="dil-eyebrow">O desfecho</div>`:""}
      <div class="dil-o">${x.texto}</div>`;
    return b;
  }
  return el("div","event"+(x.tipo==="raro"?" rare":""),x.texto);
}
function finishFight(opp,r,titleFight,td0,tdt0,ehRival){
  playing=false;atualizarControles();
  /* Modo Rival: registra o confronto no histórico ANTES de qualquer coisa
     que dependa dele (entrevista, próxima aparição). Sempre st.rival aqui
     porque ehRival só é true quando candidatos() já tinha gerado um. */
  if(ehRival&&st.rival)st.rival.historico.push({luta:fightNo,ganhou:r.winner===me.name,metodo:r.method});
  const momentosAntes=st.momentos.length;   // pra filtrar por prioridade no fim, ver ORDEM_MOMENTO
  const won=r.winner===me.name;
  const isKO=/ocaute/.test(r.method),finish=r.method!=="Decisão";
  const myKd=r.knockdowns[opp.name]||0,oppKd=r.knockdowns[me.name]||0;
  st.kdGiven+=myKd;st.kdTaken+=oppKd;
  /* Estreia no main card (item 8, já citado no item 1b): primeira vez que
     o jogador pega uma luta de nível de campeonato — vitória ou derrota,
     é o "chegou ao topo" que existe ANTES de "cinturao" (que só dispara
     ganhando). Sem evento numerado de verdade ainda (não construído);
     proxy: RANKING.lista (campeão+15) só aparece via a carta travada de
     título/defesa (candidatos() bane esses 16 das bandas comuns), então
     titleFight===true JÁ SIGNIFICA "adversário de main card" — não precisa
     checar o nome contra a lista de novo. */
  if(titleFight&&!st.estreouMainCard){
    st.estreouMainCard=true;
    st.momentos.push(criarMomento("estreia",FRASE_ESTREIA_MAIN_CARD(me.name),opp,r));
  }
  /* renda por luta (item 4) — paga em toda luta, vitória ou derrota, igual
     bolsa de MMA de verdade. Sobe com standing: quem está mais alto na
     divisão ganha mais por luta. st.dinheiro reseta por carreira (não é
     progressão permanente, é caixa da temporada). Guardado numa const —
     precisa aparecer na linha do resultado lá embaixo, calculado ANTES do
     standing desta luta mudar (mesmo valor que entrou no caixa). */
  const rendaLuta=RENDA_BASE+Math.round(RENDA_BASE*st.standing);
  st.dinheiro=(st.dinheiro||0)+rendaLuta;
  /* estado ANTES desta luta — precisa pra saber se um evento é a PRIMEIRA
     vez (cinturão, lesão) e pro upset comparar com quem o jogador era antes
     de vencer, não depois. standing muda logo abaixo; os outros três não
     mudam aqui, mas capturar junto deixa claro que são "antes desta luta",
     não "antes desta função". */
  const standingPre=st.standing;
  const chancePre=chanceContra(opp);   // zebra: a chance que o jogador TINHA nesta luta
  const foiCampeaoAntes=st.foiCampeao,lutandoMachucado=!!st.lesao;
  /* Antes de mexer no standing: é daqui que sai a seta de subiu/caiu na ficha. */
  const _rkAntes=posicaoDivisao();
  if(_rkAntes)st.rankAnt=_rkAntes.n;

  if(won){
    st.wins++;st.streakW++;st.streakL=0;st.longestW=Math.max(st.longestW,st.streakW);
    if(finish)st.finishes++;
    if(opp.rating>st.bestBeaten){st.bestBeaten=opp.rating;st.bestWin=opp.name;}
    st.standing=Math.min(1,st.standing+(titleFight?.05:(st.ganhoEscolhido??.07)));
    st.peak=Math.max(st.peak,st.standing);
    /* foiCampeao é permanente (histórico: já foi campeão, ninguém tira — usado
       pelo LEGACY). title é o status ATUAL, e É esse que zera na derrota
       abaixo — os dois precisam existir separados, senão reconquistar o
       cinturão não tem como ser distinguido de nunca tê-lo perdido. */
    if(titleFight){
      const eraUnificacao=st.title&&st.cinturaoInterino;
      if(st.title&&!eraUnificacao){
        /* rotação de contender: essa defesa (ganha) usou o desafiante da
           vez — a próxima aponta pro próximo nome do RANKING.lista, não
           repete o mesmo pra sempre. Unificação não veio da rotação (foi
           sempre contra RANKING.campeao, travado), não empurra o índice. */
        st.defesas=(st.defesas||0)+1;
        if(RANKING&&RANKING.lista)st.desafianteIdx=Math.min((st.desafianteIdx||1)+1,RANKING.lista.length-1);
        st.title=true;st.foiCampeao=true;st.exCampeao=null;
      }else if(!st.title&&st.tituloInterinoLuta){
        /* Cinturão interino: title=true pras regras que já existem (ficha,
           RARE, evento gerado pela IA, passoCinturao()), mas foiCampeao/vezesCampeao/o
           momento de 1º cinturão SÓ disparam na unificação, abaixo — é
           isso que torna o interino incompleto até provar (ver
           CHANCE_CINTURAO_INTERINO). */
        st.title=true;st.cinturaoInterino=true;st.exCampeao=null;st.foiCinturaoInterino=true;
        st.momentos.push(criarMomento("cinturaoInterino",
          FRASE_CINTURAO_INTERINO(me.name,RANKING.campeao?RANKING.campeao.name:"o campeão"),opp,r));
      }else{
        /* conta AQUISIÇÃO nova do cinturão de verdade (1ª vez, reconquista
           ou unificação do interino) — usado pela conquista "Fênix". */
        st.vezesCampeao=(st.vezesCampeao||0)+1;
        if(r.method==="Decisão")st.tituloPorDecisao=true;   // permanente — ganhou o cinturão indo aos cartões, alguma vez
        st.title=true;st.foiCampeao=true;st.exCampeao=null;st.cinturaoInterino=false;
        if(!foiCampeaoAntes)st.momentos.push(criarMomento("cinturao",
          eraUnificacao?FRASE_UNIFICACAO(me.name,opp.name):FRASE_PRIMEIRO_CINTURAO(me.name),opp,r));
      }
    }
    /* rápido é clock ALTO nesta luta — ver clockSeconds() */
    if(isKO&&r.round===1&&(300-clockSeconds(r.clock))<60){
      const mko=criarMomento("ko",FRASE_KO_RAPIDO(me.name),opp,r);
      mko.segundosKO=300-clockSeconds(r.clock);      // pro rótulo "NOCAUTE EM Ns"
      st.momentos.push(mko);
    }
    if(lutandoMachucado&&!st.lesao.venceuMachucado){
      st.lesao.venceuMachucado=true;
      const fraseLesao=st.lesao.origem==="nocaute"?FRASE_LESAO_VENCIDA_NOCAUTE:FRASE_LESAO_VENCIDA;
      st.momentos.push(criarMomento("lesao",fraseLesao(me.name),opp,r));
    }
  }else{
    st.losses++;st.streakL++;st.streakW=0;
    st.longestL=Math.max(st.longestL||0,st.streakL);   // mesmo padrão de longestW, espelhado
    if(isKO)st.koLosses++;
    if(r.method==="Finalização")st.subLosses=(st.subLosses||0)+1;
    /* Nocaute -> lesão (item cortado da v1): uma de cada vez, mesma regra
       do dilema — não pode ter duas lesões ativas ao mesmo tempo. lesaoRng
       é stream próprio, nunca o rng principal (mesmo motivo do holdRng —
       senão desloca a sequência e link de desafio antigo para de
       reproduzir a mesma carreira). Atributo sorteado, não escolhido —
       nocaute não tem "cena" pra dizer QUAL parte do corpo bateu. */
    if(isKO&&!st.lesao&&lesaoRng()<(st.equipamentoComprado?CHANCE_LESAO_NOCAUTE_EQUIP:CHANCE_LESAO_NOCAUTE)){
      const ATTRS_LESAO_KO=["slpm","strDef","durability","tdDef","subAvg","kdAvg"];
      const atr=ATTRS_LESAO_KO[Math.floor(lesaoRng()*ATTRS_LESAO_KO.length)];
      if(me[atr]!=null){
        st.eventoMod=st.eventoMod||{};
        st.eventoMod[atr]=(st.eventoMod[atr]||1)*LESAO_NOCAUTE.mult;
        st.lesao={nome:"Sequela do nocaute",atributo:atr,mult:LESAO_NOCAUTE.mult,
          permanente:false,desdeLuta:st.fightNo,duracao:LESAO_NOCAUTE.duracao,origem:"nocaute"};
      }
    }
    if(titleFight&&st.title){
      /* defesas só incrementa em vitória (acima), então defesas===0 aqui
         significa que esta é a PRIMEIRA defesa perdida — só nesse caso o
         evento raro "perdeu na primeira defesa" é verdade. Perder a 5ª
         defesa não é a mesma coisa e não pode usar o mesmo texto. Perder a
         UNIFICAÇÃO (cinturaoInterino) fica de fora: nunca houve reinado
         indiscutido pra "perder rápido" — o interino nem chega a defender,
         vai direto pra unificação (ver candidatos()). */
      if(!st.cinturaoInterino&&(st.defesas||0)===0){
        st.lostBeltFast=true;
        /* mesmo texto do RARE "lostBeltFast", achado por id — não duplica a
           frase nem depende de índice do array (ver comentário no RARE). */
        st.momentos.push(criarMomento("cinturaoPerdido",
          RARE.find(rr=>rr.id==="lostBeltFast").t(me.name),opp,r));
      }
      /* perder uma defesa (ou a unificação) custa o cinturão que se tinha:
         title volta a false, exCampeao guarda quem tirou (opp — no caso da
         unificação, é sempre RANKING.campeao, o campeão de verdade; a
         ficha e a próxima disputa passam a nomear essa pessoa, não mais o
         jogador), defesas zera (reinado novo começa do zero se
         reconquistar), cinturaoInterino zera (sem isso ficaria um "campeão
         interino" fantasma sem title) e disputaLiberada reseta — sem isso
         a reconquista aproveitaria a concessão antiga do holdRng e nunca
         sortearia de novo (ver candidatos()/tituloLiberado()). */
      if(isKO)st.perdeuCinturaoPorNocaute=true;   // permanente — não zera se reconquistar depois
      st.title=false;st.exCampeao=opp;st.defesas=0;st.disputaLiberada=false;st.cinturaoInterino=false;
      /* Guarda o número da luta em que perdeu — evento por IA usa isso
         pra saber se foi NESTA luta (não é histórico permanente como
         foiCampeao, é só "aconteceu agora"). Ver dispararEventoIA(). */
      st.perdeuCinturaoNaLuta=st.fightNo;
      /* essa defesa (perdida) também usou o desafiante da vez — mesma
         rotação da vitória acima. Reconquistar mais tarde enfrenta de novo
         RANKING.campeao (não muda com rotação), mas ao voltar a DEFENDER o
         próximo nome já está um passo adiante. */
      if(RANKING&&RANKING.lista)st.desafianteIdx=Math.min((st.desafianteIdx||1)+1,RANKING.lista.length-1);
    }else if(titleFight&&!st.title){
      /* Perdeu a DISPUTA em si, antes de nunca ter sido campeão — st.title
         já era false, então o bloco acima não roda, mas o reset do
         disputaLiberada precisa acontecer aqui do mesmo jeito. Sem isso, a
         próxima vez que standing/streakW voltarem a bater o limiar,
         tituloLiberado() acha disputaLiberada ainda true (da concessão
         antiga) e devolve o campeão sem sortear holdRng de novo — só que
         agora ignorando `fought` (ver candidatos()), então mesmo achando o
         campeão em `fought` a carta trava nele mesmo assim, revanche de
         verdade. Esse ELSE existe só pra documentar por que o reset não
         soma com o bloco de cima: são estados mutuamente exclusivos
         (perdeu sendo campeão vs. perdeu não sendo). */
      st.disputaLiberada=false;
    }
    /* perder para quem estava abaixo custa mais caro que perder para um perigoso */
    const punicao=st.ganhoEscolhido<=.05?.13:st.ganhoEscolhido>=.12?.06:.09;
    st.standing=Math.max(.05,st.standing-punicao);
  }
  st.lastMethod=r.method;st.lastWon=won;st.lastRound=r.round;st.lastKO=isKO;

  /* Tick de cura. st.eventoMod já acumula multiplicativo (outro evento pode
     ter mexido no MESMO atributo antes ou depois da lesão) — dividir pelo
     mult da lesão desfaz só o que ela escreveu; um "=1" apagaria também um
     bônus de evento que nada tem a ver com a lesão. Roda depois da luta
     recém-simulada (a lesão ainda vale PRA ELA), então passa a valer pra
     próxima a partir daqui. */
  if(st.lesao&&!st.lesao.permanente&&st.fightNo-st.lesao.desdeLuta>=st.lesao.duracao){
    const a=st.lesao.atributo;
    st.eventoMod[a]=(st.eventoMod[a]||1)/st.lesao.mult;
    st.lesao=null;
  }

  /* --- repercussão --- */
  /* Plano Pro — hype da coletiva multiplica o hype DESTA luta, não
     substitui: entra ANTES de bonusNoite/fã/seguidor lerem a variável,
     então uma boa provocação genuinamente pode virar recorde de "melhor
     atuação" (é a intenção — provocar e entregar é o auge do hype).
     st.coletivaHype é 1 (neutro) quando não houve coletiva ou ela caiu no
     fallback; nunca null, pra não precisar de "||1" espalhado. Resetado
     em resetColetiva() (ver nextFight()) — vale só PRA ESTA luta. */
  const hypeBase=hypeOf(r,won,opp,me,titleFight,myKd,oppKd),multColetiva=st.coletivaHype||1;
  const hype=hypeBase*multColetiva;
  /* Já consumido acima (mAttr foi lido na construção de B, em lutar(); hype
     acabou de ler st.coletivaHype) — limpa pra próxima luta não herdar por
     engano. Reset aqui, não em nextFight(): telaColetiva() da PRÓXIMA luta
     só existe depois que ESTA finishFight() já terminou, então não há
     risco de apagar um valor que ainda não foi lido. */
  st.coletivaHype=1;st.coletivaPressao=null;
  /* Bônus de performance da noite: só rótulo, nenhum número novo — reaproveita
     hype, que já existe e já alimenta fã/seguidor. Sem limiar pra calibrar:
     é sempre a luta de MAIOR hype da carreira ATÉ AGORA, tipo st.bestWin/
     st.peak — não precisa medir nada porque não é um corte absoluto, é
     recorde relativo. Aparece no relatório final e no card compartilhável. */
  if(!st.bonusNoite||hype>st.bonusNoite.hype)
    st.bonusNoite={hype,luta:fightNo,adversario:opp.name,cartel:`${st.wins}-${st.losses}`};
  /* Card de "melhor atuação" (2026-09-11) — o número acima já existia sem
     virar card (ver LEIA-ME "Card de momento"/PENDENCIAS "onde
     desperdiça trabalho"). Medido ANTES de decidir o gatilho (500
     carreiras/divisão, estratégia "parelho" fixa, candidatos()/
     simulateFight()/finishFight() reais): "todo novo recorde vira card"
     dava 3,0-3,4 recordes por carreira em MÉDIA — ruído, deixaria de ser
     marco. Restringir a só a 2ª metade (luta>=12) não bastou sozinho:
     75-78% das carreiras batem pelo menos 1 recorde ali, ainda comum se
     repetir. Conserto: dispara UMA vez só por carreira, no PRIMEIRO
     recorde que a luta 12 em diante bate (`bonusNoiteMarco` trava,
     nunca mais dispara na mesma carreira) — st.bonusNoite continua
     sendo atualizado TODA luta, sem trava, então relatório final e card
     compartilhável sempre mostram o recorde VERDADEIRO, mesmo que ele
     seja batido de novo depois deste card. */
  if(fightNo>=12&&!st.bonusNoiteMarco&&st.bonusNoite.luta===fightNo){
    st.bonusNoiteMarco=true;
    st.momentos.push(criarMomento("bonusNoite",FRASE_BONUS_NOITE(me.name,opp.name),opp,r));
  }
  /* Card de "número 1 da tabela" (2026-09-11, apertado no mesmo dia) —
     posicaoDivisao() é a posição na tabela INTEIRA que a ficha já
     mostra (não o RANKING oficial de campeão+15, ver "Campeão nomeado"
     no LEIA-ME); reusa o mesmo número, sem calibrar nada.

     1ª medição (qualquer luta): 66,8%/67,6% das carreiras (leve/pesado)
     chegam ao nº1 em ALGUM momento — alto demais, fora da faixa dos
     outros gatilhos de momento (2%-30%), o mesmo padrão já cortado em
     "topo_da_divisao" (conquistas) e em streakW>=8 (RARE, ver "Card de
     momento"). Remedido: exigir CEDO, não só "algum dia" — mediana de
     "geral" já era luta 15-16, então até a luta 15 corta perto da
     metade de quem chega. `fightNo<=15` (não invicto: invicto até o
     topo caiu pra 8%/17%, longe demais pra baixo do alvo) fecha
     25,2%/36,4% — dentro de 25%-40%. Continua travando em 1x só
     (`st.topoDivisaoAlcancado`); depois da luta 15 o nº1 deixa de ser
     "cedo" e para de contar como marco, mesmo que aconteça. */
  if(!st.topoDivisaoAlcancado&&fightNo<=15){
    const posAtual=posicaoDivisao();
    if(posAtual&&posAtual.n===1){
      st.topoDivisaoAlcancado=true;
      st.momentos.push(criarMomento("topoDivisao",FRASE_TOPO_DIVISAO(me.name,posAtual.de),opp,r));
    }
  }
  /* upset compara com quem o jogador ERA antes de vencer — standingPre, não
     st.standing (que essa altura do won já subiu). Usar o pós-luta fazia
     "vitória sobre favorito" quase nunca disparar: o próprio salto de
     standing da vitória encolhia a diferença que definia o upset.
     fightNo>=6 e diferença >.20 (era >.15, sem piso): medido em 120
     carreiras, 77% dos upsets caíam nas lutas 1-5 só porque standing começa
     baixo (.18) — não é zebra de verdade, é o jogador ainda subindo do
     fundo da tabela. Ver LEIA-ME "Card de momento". */
  /* Balanço 2026-09-28: zebra é vencer com chance real baixa (chancePre,
     simulada antes do resultado), não contra o ranking: a escada agora
     oferece adversários acima da posição, e contra o ranking quase toda
     vitória virava zebra. */
  const upset=won&&fightNo>=6&&chancePre<.30;
  if(upset)st.momentos.push(criarMomento("upset",FRASE_UPSET(me.name,opp.name),opp,r));
  const alvo=Math.max(0,Math.min(10,1.3+hype*1.30));
  const fanAntesLuta=st.fan;
  st.fan=Math.max(0,Math.min(10,st.fan*.62+alvo*.38));      /* média móvel */
  /* Casa melhor (loja): bônus permanente aplicado no delta já calculado,
     vitória ou derrota — não entra em followerDelta() (função pura,
     testada isolada) pra não misturar mecânica do motor com item de
     compra opcional. */
  const multLoja=(st.casaComprada?CASA_FOLLOWER_MULT:1)*(st.consultoriaAtiva?CASA_FOLLOWER_MULT:1);
  const delta=Math.round(followerDelta(st.followers,hype,won,st.standing)*multLoja);
  /* Parte da coletiva (2026-09-28): a mesma conta sem o multiplicador
     dela. Só exibição: nada aqui muda o que a luta rendeu. */
  const coletivaNaLuta=multColetiva===1?null:{hype:multColetiva,
    seg:delta-Math.round(followerDelta(st.followers,hypeBase,won,st.standing)*multLoja),
    fa:Math.round((st.fan-Math.max(0,Math.min(10,fanAntesLuta*.62+Math.max(0,Math.min(10,1.3+hypeBase*1.30))*.38)))*10)/10};
  st.followers=Math.max(120,st.followers+delta);
  st.peakFollowers=Math.max(st.peakFollowers,st.followers);
  st.consultoriaAtiva=false;   // pontual — consumida nesta luta, precisa comprar de novo
  st.lastDelta=delta;
  const ph=document.getElementById("phone");
  if(ph){
    const molde=buildFeed(r,won,titleFight,myKd,oppKd,upset,rng,me.name,st.fan);
    ph.style.visibility="visible";
    const tk=CARREIRA_TOKEN;
    resolveFeed(molde).then(f=>{ if(tk===CARREIRA_TOKEN)renderPhone(f,st.fan,delta,st.followers); });
  }

  /* Registro da luta como DADO (revamp fase 3): o save guarda isto e a
     tela retomada redesenha o histórico daqui; antes a linha só existia
     no DOM e sumia ao recarregar. linhaBout() é a mesma nos dois casos. */
  st.registro=st.registro||[];
  /* revamp fase 5: seguidores e fã depois da luta (gráfico da Mídia) e a
     narração inteira (o Cartel reabre a luta). Campos opcionais: save
     antigo sem eles continua abrindo, só sem gráfico e sem narração. */
  const reg={n:fightNo,adv:opp.name,venceu:won,metodo:r.method,round:r.round,relogio:r.clock,
    cartoes:r.cards||null,kd:[myKd,oppKd],renda:rendaLuta,titulo:!!titleFight,extras:[],
    seg:st.followers,fa:Math.round(st.fan*10)/10,
    narracao:(r.log||[]).map(L=>[L.clock,L.kind||"",L.text])};
  if(coletivaNaLuta)reg.coletiva=coletivaNaLuta;   // opcional: save antigo não tem
  /* memória narrativa: a fala da coletiva desta luta ganha o resultado
     real, e a promessa é julgada pelo jogo; a coletiva vira o 1º extra */
  fecharFalaDaLuta(won,r);
  const coletivaReg=st.coletivaDaLuta&&st.coletivaDaLuta.luta===fightNo?st.coletivaDaLuta:null;
  st.coletivaDaLuta=null;
  if(coletivaReg)reg.extras.push(coletivaReg);
  st.registro.push(reg);
  const bouts=document.getElementById("bouts");
  bouts.appendChild(linhaBout(reg));
  const pos=novoPosLuta(fightNo);
  if(coletivaReg)pos.appendChild(linhaExtra(coletivaReg));
  const rkDepois=posicaoDivisao();
  (won?SOM.vitoria:SOM.derrota)();     // um só, no carimbo, seja qual for o método
  /* Plano Pro — "zebra" da entrevista reaproveita a MESMA definição de
     upset já medida acima (won&&fightNo>=6&&diferença>.20, ver LEIA-ME
     "Card de momento") — não inventa um segundo conceito de zebra. */
  renderBotaoEntrevista(pos,opp,r,titleFight,won,td0,tdt0,upset,ehRival);

  /* dilema interativo a cada 5 lutas; nas outras, evento — um por luta
     agora (era só luta par ou com finish, throttle que existia pra poupar
     índice do pool fixo; a IA não tem pool pra poupar, evento é chamada
     de IA em TODA luta que não caiu em dilema). RARE continua local e
     síncrono, checado primeiro (mesma prioridade de sempre); só o comum
     virou IA, sem fallback — ver dispararEventoIA(). */
  if(fightNo%5===0&&fightNo<TOTAL_FIGHTS){
    dilemaAberto=true;
    if(auto){auto=false;clearTimeout(autoTimer);}
    atualizarControles();
    abrirDilema()
      .catch(()=>{})                       // falha do dilema não pode travar a carreira
      .then(()=>{dilemaAberto=false;PENDENTE=null;verificarConquistas();atualizarControles();renderFicha();salvarCarreira();});
  }else{
    const raro=sortearRaro(st,rng,rareUsed);
    if(raro){
      pos.appendChild(el("div","event rare",raro.t(me.name)));
      registrarExtra({tipo:"raro",texto:raro.t(me.name)});
      tocarSom(raro.tom||0);
      st.events++;
      st.rares.push(raro.t(me.name));
      if(raro.card){
        const mr=criarMomento("raro",raro.t(me.name),opp,r);
        mr.raroId=raro.id;                            // pro rótulo dizer o recorde certo
        st.momentos.push(mr);
      }
    }else{
      dispararEventoIA(pos,opp,r);   // assíncrono; o embrulho da luta segura o lugar certo mesmo se chegar tarde
    }
  }
  /* Prioridade entre gatilhos da MESMA luta (achado jogando: cinturão +
     12-0 na mesma luta empurrava DOIS cards, o de raro por último — o
     jogador só viu o errado). Mais de um momento pode nascer nesta
     chamada (estreia+cinturao, cinturao+ko, cinturao+raro, etc.) — fica
     só o de maior prioridade (ORDEM_MOMENTO); os outros são removidos
     do CARD, mas o resto do efeito de cada gatilho (texto no feed,
     st.rares, st.events, contadores de conquista) já rodou antes desta
     linha e continua valendo — só a disputa por QUAL card aparece muda. */
  if(st.momentos.length>momentosAntes+1){
    const desdeAqui=st.momentos.slice(momentosAntes);
    const melhor=desdeAqui.reduce((a,b)=>
      ORDEM_MOMENTO.indexOf(a.tipo)<=ORDEM_MOMENTO.indexOf(b.tipo)?a:b);
    st.momentos.length=momentosAntes;
    st.momentos.push(melhor);
  }
  if(verificarConquistas().length)setTimeout(()=>SOM.conquista(),won?1800:1200);
  if(!won&&r.method==="Decisão")setTimeout(()=>SOM.vaia(),900);   // a arena vaia os cartões
  atualizarControles();renderFicha();
  /* luta terminada: some a pendência (se abriu dilema, abrirDilema() grava
     a pendência dele logo depois, quando o texto estiver pronto) */
  if(PENDENTE&&PENDENTE.tipo==="luta")PENDENTE=null;
  salvarCarreira();

  /* "Terminou a luta 1", "terminou a luta 5" e "terminou as 22". fightNo já
     foi incrementado em lutar() antes de finishFight() rodar, então aqui já
     reflete a luta que acabou de concluir. Fixo nesses pontos, não "a cada
     N" — o funil quer corte, não série. terminou_luta_1 é o que a fase 2 do
     PLANO-LANCAMENTO.md precisa pra medir "abriu → primeira luta terminou":
     sem ele só dava pra medir até o fim do draft (terminou_draft), que é
     ANTES da primeira luta, ou até a luta 5, que é tarde demais pro corte
     que a fase 2 quer (3 minutos de crédito de quem clicou no anúncio). */
  /* Resultado na noite (revamp fase 5). No automático a noite segue na
     etapa da luta (a próxima começa em 1,1 s); dilema desliga o
     automático antes daqui, então ele sempre aparece no pós-luta. */
  if(!auto)mostrarResultado(reg,{delta,rk:rkDepois,mov:st.rankAnt!=null&&rkDepois?st.rankAnt-rkDepois.n:0,coletiva:coletivaNaLuta});
  if(fightNo===1)evento("terminou_luta_1",{segundos:Math.round((Date.now()-TEMPO_ABERTURA)/1000)});
  if(fightNo===5)evento("terminou_luta_5");
  if(fightNo>=TOTAL_FIGHTS)evento("terminou_22");

  if(fightNo>=TOTAL_FIGHTS){
    auto=false;clearTimeout(autoTimer);
    setTimeout(()=>{document.getElementById("stage").style.display="none";},2600);
    const c=document.getElementById("controls");c.innerHTML="";
    const fin=el("button","btn","Encerrar a carreira");fin.onclick=screenReport;
    c.appendChild(fin);return;
  }
  atualizarControles();
  if(auto&&!dilemaAberto&&!entrevistaAberta){
    const tk=CARREIRA_TOKEN;
    autoTimer=setTimeout(()=>{if(tk===CARREIRA_TOKEN&&auto&&!dilemaAberto&&!entrevistaAberta)nextFight();},1100/speed);
  }
}

/* ---------- tela 4: relatório ---------- */
/* Faixas da nota (revamp fase 3: saíram de dentro de grade() pro placar
   no servidor, api/_placar-regras.js, conferir contra as mesmas). */
const TIERS_NOTA=[[90,"S","Lenda. Uma das melhores carreiras da história da divisão."],
    [78,"A","Nome grande. Entrou no hall da fama da divisão."],
    [64,"B","Carreira sólida. Foi luta principal várias vezes."],
    [48,"C","Meio de card. Sustentou a família lutando."],
    [32,"D","Ficou pelo caminho, longe do topo da divisão."],
    [0,"F","Não deu. A carreira terminou longe do ranking."]];
const FAIXAS_NOTA=TIERS_NOTA.map(t=>[t[0],t[1]]);
/* Corpo do envio ao placar (api/placar.js confere tudo isto de novo no
   servidor, com as mesmas faixas). Pontuação = nota bruta × 100
   arredondada pra BAIXO: 89,996 continua A, igual à letra do grade(). */
function corpoPlacar(g){
  return{seed:SEED,nome:me.name,divisao:DIVISION,modo:MODO,wins:st.wins,losses:st.losses,
    finishes:st.finishes,cinturoes:st.vezesCampeao||0,title:!!st.title,
    pontuacao:g.pontos,nota:g.letter,rosto:ROSTO||null};
}
async function enviarPlacar(g,linha){
  const sb=getSupabase();
  if(!sb)return;
  let session=null;
  try{ ({data:{session}}=await sb.auth.getSession()); }catch(e){}
  if(!session)return;
  try{
    const r=await fetch("/api/placar",{method:"POST",
      headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},
      body:JSON.stringify(corpoPlacar(g))});
    let j={};try{ j=await r.json(); }catch(e){}
    if(linha)linha.textContent=r.ok?`Carreira enviada ao ranking com ${fmtPontos(g.pontos)} pontos de legado.`:`Não entrou no ranking: ${j.erro||"erro no servidor"}.`;
  }catch(e){ if(linha)linha.textContent="Não deu pra enviar ao ranking agora."; }
}
/* Pontos de legado (nome dado em 2026-09-28, pedido do dono: o número ao
   lado de cada jogador no ranking não dizia o que era). É a nota da
   carreira × 100, a MESMA escala no fim de carreira e no ranking (antes o
   fim mostrava "78 de 100" e o ranking "7.823"). As cinco partes somam o
   total exato: cada uma arredonda pra baixo e o que sobra vai pras de
   maior fração (maior resto), então a conta mostrada fecha. */
function grade(){
  const winPct=st.wins/Math.max(1,st.wins+st.losses);
  const finishPct=st.finishes/Math.max(1,st.wins);
  const brutas=[["Pico no ranking",st.peak*40],["Melhor vitória",st.bestBeaten*30],
    ["Aproveitamento",winPct*12],["Vitórias antes do fim",finishPct*8],["Cinturão",st.title?10:0]];
  const score=brutas.reduce((a,[,v])=>a+v,0);   // mesma ordem de soma de sempre: o placar confere a faixa
  const pontos=Math.floor(score*100);
  const cem=brutas.map(([,v])=>v*100),partes=cem.map(Math.floor);
  let falta=pontos-partes.reduce((a,b)=>a+b,0);
  const porFracao=cem.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;falta>0&&k<porFracao.length;k++,falta--)partes[porFracao[k][1]]++;
  while(falta<0){const i=partes.indexOf(Math.max(...partes));partes[i]--;falta++;}   // só em erro de ponto flutuante
  const tiers=TIERS_NOTA;
  const t=tiers.find(x=>score>=x[0]);
  /* fightNo===0 (aposentadoria antes da 1ª luta) sempre cai no score baixo
     da faixa F — mas "você entrou no octógono" é falso pra quem nunca
     lutou. Mesma letra (a pontuação de verdade não muda), parecer
     diferente, honesto com o que realmente aconteceu. */
  const verdict=st.fightNo===0
    ?"Não chegou a entrar no octógono. Aposentado antes da primeira luta."
    :t[2];
  return{score:Math.round(score),bruto:score,pontos,letter:t[1],verdict,
    partes:brutas.map(([rot],i)=>({rot,v:partes[i]}))};
}
function screenReport(){
  const g=grade();
  /* Histórico (2026-09-09): salva local sempre (mesmo sem conta, mesmo
     padrão de conquistas), sincroniza com a nuvem embaixo se tiver
     sessão (mesmo bloco que já sincroniza conquistas, ver adiante). */
  salvarCarreiraLocal({seed:SEED,nome:me.name,cartel:`${st.wins}-${st.losses}`,
    nota:g.letter,data:new Date().toISOString()});
  /* Revamp fase 5: a carreira acabou. Nada atrasado escreve mais nela e
     o endereço sai de #/carreira (recarregar aqui abriria outra). */
  pararCarreira();
  try{ history.replaceState(null,"","#/menu"); }catch(e){}
  const c=montarTela({fundo:(st.foiCampeao||st.title)?"cinturao":"arquibancada",voltar:"menu",classe:"tela-fim"});
  const topo=el("div","fim-topo");
  topo.appendChild(el("div","fim-quem",`<div class="fim-retrato">${bonecoSVG(ROSTO||cfgPadrao(),{w:210})}</div>
    <div class="fim-id"><span class="fim-rot">Fim de carreira</span><b class="fim-nome">${me.name}</b>
      <span class="fim-sub">${st.wins}-${st.losses} · ${idadeAtual()} anos · ${nomeDivisao(DIVISION)}${MODO==="lenda"?" · Seja uma lenda":""}</span></div>`));
  topo.appendChild(el("div","fim-nota",`<span class="fim-rot">Parecer da comissão</span>
    <div class="fim-letra nota-${g.letter}">${g.letter}</div>
    <span class="fim-pontos"><b>${fmtPontos(g.pontos)}</b> pontos de legado</span><p class="fim-parecer">${g.verdict}</p>
    <ul class="fim-partes">${g.partes.map(x=>`<li><span>${x.rot}</span><b>${fmtPontos(x.v)}</b></li>`).join("")}</ul>`));
  c.appendChild(topo);
  c.appendChild(el("blockquote","fim-legado",LEGACY.find(l=>l.when(st)).t(me.name)));
  const num=(rot,v)=>`<div class="fim-num"><span>${rot}</span><b>${v}</b></div>`;
  const nums=el("div","fim-numeros");
  [["Cartel",`${st.wins}-${st.losses}`],
   ["Vitórias antes do fim",`${st.finishes} de ${st.wins} (${Math.round(100*st.finishes/Math.max(1,st.wins))}%)`],
   ["Maior sequência",`${st.longestW} vitórias`],
   ["Cinturão",st.title?"Sim":"Não"],
   ["Defesas de cinturão",st.defesas||0],
   ["Pico no ranking",fmtPico(st.peak)],
   ["Melhor vitória",st.bestWin||"Nenhuma"],
   ["Golpe marcante",assinatura()],
   ["Knockdowns aplicados e sofridos",`${st.kdGiven} e ${st.kdTaken}`],
   ["Nocautes sofridos",st.koLosses],
   ["Seguidores no fim",fmtNum(st.followers)],
   ["Pico de seguidores",fmtNum(st.peakFollowers)],
   ["Medidor de fã",st.fan.toFixed(1)+" de 10"],
   ["Momentos fora do octógono",st.events],
   ["Decisões que você tomou",st.dilemas||0]]
   .concat(st.bonusNoite?[["Bônus da noite",`Luta ${st.bonusNoite.luta} contra ${st.bonusNoite.adversario}`]]:[])
   .forEach(([rot,v])=>{ const d=el("div","fim-num",`<span>${rot}</span><b>${v}</b>`); nums.appendChild(d); });
  c.appendChild(nums);
  if(st.rares.length)
    c.appendChild(el("div","fim-destaque",`<span class="fim-rot">Fora da curva</span>${st.rares.map(t=>`<p>${t}</p>`).join("")}`));
  c.appendChild(el("p","fim-feito",`<b>${me.name}</b> era feito de: `+picks.map(p=>`${p.pair.label} do ${p.from}`).join(" · ")));

  const acoes=el("div","fim-acoes");
  const btnSalvar=el("button","botao","Salvar imagem");
  btnSalvar.onclick=()=>salvarImagem(g,btnSalvar);
  const btnCopiar=el("button","botao botao-sec","Copiar imagem");
  btnCopiar.onclick=()=>copiarImagem(g,btnCopiar);
  const link=el("button","botao botao-sec","Copiar desafio");
  link.onclick=async()=>{
    try{await navigator.clipboard.writeText(urlDesafio());link.textContent="Copiado";}
    catch(e){link.textContent=urlDesafio();}
    setTimeout(()=>link.textContent="Copiar desafio",2200);
  };
  const again=el("button","botao botao-sec","Nova carreira");
  again.onclick=()=>{docmeta.textContent="Comissão Atlética · Registro";
    history.replaceState(null,"",location.pathname);SEED=0;irPara("nova");};   // revamp fase 3: passa pelo portão e pela escolha de espaço
  acoes.append(btnSalvar,btnCopiar,link,again);
  c.appendChild(acoes);

  /* revamp fase 3: carreira encerrada vai pro placar e libera o espaço
     do save (o histórico já ficou em carreiras_usuario acima) */
  const linhaPlacar=el("p","fim-status","");
  c.appendChild(linhaPlacar);
  enviarPlacar(g,linhaPlacar);
  if(SLOT_ATUAL){ apagarSave(SLOT_ATUAL); SLOT_ATUAL=null; }

  /* Fim de carreira sobe conquistas e histórico pra conta. Revamp fase 3:
     jogar já exige conta, então aqui não tem mais oferta de criar conta.
     Sem sessão neste ponto só acontece com a rede caindo: o histórico
     fica no aparelho e sobe na próxima sincronização, sem aviso novo. */
  if(getSupabase()){
    const contaBox=el("div","fim-status");
    c.appendChild(contaBox);
    sincronizarConquistasNaNuvem().then(async email=>{
      if(!email)return;
      await sincronizarCarreirasNaNuvem(); // mesma sessão, mesmo instante: sobe a carreira que acabou de terminar
      contaBox.appendChild(el("p","",`Conquistas e histórico salvos na conta <b>${email}</b>.`));
    });
  }
  c.appendChild(el("p","fim-semente",
    `Semente <b>#${SEED.toString(36).toUpperCase()}</b>: quem abrir seu link pega as mesmas cartas e os mesmos adversários.`));
}
armarTrilha();
armarConfig();
armarRotas();
armarSave();
boot();
</script>
