<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha do Lutador</title>
<!-- Vercel Web Analytics — sem backend, sem SDK (o projeto não tem build step).
     O stub deixa chamar va(...) antes do script real carregar (fila em vaq);
     script.js só existe/funciona se Analytics estiver ligado no projeto na
     Vercel — sem isso, o <script defer> dá 404 em silêncio e window.va nunca
     vira a função de verdade, então TODA chamada de va() no jogo usa
     window.va&&... com try/catch (ver evento() no script principal). Igual
     ao princípio de audio/localStorage: analytics nunca pode derrubar a
     carreira de ninguém. -->

<script id="va-stub">window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Preto com azul de arena. Sem gradiente, sem brilho, sem canto arredondado:
     é isso que separa "escuro" de "escuro gerado por IA". O acento é o vermelho
     de sangue seco do esporte, usado com parcimônia. */
  --bg:#0A0D13;
  --panel:#111722;
  --panel2:#161E2B;
  --line:#222C3C;
  --line2:#33415A;
  --ink:#E6EBF2;
  --ink2:#AAB6C6;
  --faded:#6B7A90;
  --stamp:#C0392B;
  --win:#4E9A62;
  --gold:#B9932F;
  /* nomes antigos mantidos para não quebrar regras existentes */
  --stock:#0A0D13;
  --stock-2:#111722;
  --rule:#222C3C;
  --loss:#C0392B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--stock);
  color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.014) 0 1px,transparent 1px 3px);
}
/* A carreira tem três áreas lado a lado (ficha, narração, celular). Em 940px
   elas se esmagavam e a narração sobrava com ~300px. */
.wrap{max-width:1260px;margin:0 auto;padding:24px 18px 80px}

/* ---------- cabeçalho da ficha ---------- */
.doc-head{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);
  padding:10px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.doc-head h1{font-family:Oswald,Impact,sans-serif;font-weight:700;font-size:26px;
  letter-spacing:.06em;text-transform:uppercase;margin:0}
.doc-head .meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faded)}

.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faded);
  margin:26px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:5px}

/* ---------- botões ---------- */
/* Botão NÃO herda color do body: usa o preto padrão do navegador. Sem esta
   linha, toda carta (que é <button>) fica com texto preto sobre fundo preto. */
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ink);color:var(--bg);border:none;padding:11px 20px;
  font-family:Oswald,sans-serif;font-weight:500;font-size:15px;letter-spacing:.1em;
  text-transform:uppercase;transition:transform .08s ease,background .15s ease}
.btn:hover{background:var(--stamp);color:#fff}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--rule);color:var(--faded);cursor:default;transform:none}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--bg)}
.btn-ghost.on{background:var(--stamp);border-color:var(--stamp);color:#fff}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

input[type=text]{font-family:inherit;font-size:16px;background:transparent;
  border:none;border-bottom:1.5px solid var(--ink);padding:6px 2px;color:var(--ink);width:min(320px,100%)}
input[type=text]:focus{outline:none;border-bottom-color:var(--stamp)}

/* ---------- orçamento ---------- */
.budget{display:flex;align-items:center;gap:12px;margin:14px 0 18px;flex-wrap:wrap}
.budget-bar{flex:1;min-width:180px;height:12px;border:1px solid var(--ink);position:relative;background:transparent}
.budget-fill{position:absolute;inset:1px auto 1px 1px;background:var(--ink);transition:width .35s ease}
.budget-fill.low{background:var(--stamp)}
.budget-num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* ---------- cartas do draft ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{border:1px solid var(--line2);background:var(--panel);padding:10px 11px;text-align:left;
  display:flex;flex-direction:column;gap:6px;transition:background .12s,transform .08s}
.card:hover{background:var(--panel2);border-color:var(--line2);transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--line2)}
.card:active{transform:none;box-shadow:none}
.card .pair{color:var(--ink);font-family:Oswald,sans-serif;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.card .src{font-size:11.5px;color:var(--faded);margin-top:-6px}
.card .attr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  border-top:1px dotted var(--rule);padding-top:6px}
.card:hover .mira-attr .attr-l{color:#A8756E}
.card .attr-l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faded)}
.card .attr-v{font-variant-numeric:tabular-nums;font-weight:500}
.pctwrap{display:flex;align-items:center;gap:6px;margin-top:2px}
.pctbar{flex:1;height:7px;background:rgba(255,255,255,.07);position:relative;min-width:52px}
.pctbar i{position:absolute;left:0;top:0;bottom:0;display:block;transition:width .3s ease}
.pctnum{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;min-width:76px;text-align:right}
/* escala: quanto mais verde, melhor que mais gente da divisão */
.p1 i{background:#C0392B} .p1{color:#D1584A}
.p2 i{background:#B07A3A} .p2{color:#C08F52}
.p3 i{background:#5E6B7E} .p3{color:#8B99AC}
.p4 i{background:#5E8A4A} .p4{color:#7CB069}
.p5 i{background:#4E9A62} .p5{color:#6FC486}
.elite{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:#6FC486;border:1px solid #4E9A62;padding:0 4px;margin-left:6px;vertical-align:1px}
.legend{border:1px dashed var(--line2);padding:10px 12px;margin:0 0 14px;
  font-size:12px;line-height:1.6;color:var(--ink2);background:var(--panel)}
.legend b{color:var(--ink);font-weight:600}
.legend .sc{display:inline-flex;align-items:center;gap:0;margin:0 4px;vertical-align:-2px}
.legend .sc span{width:16px;height:8px;display:block}
.card .cost{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faded);border-top:1px solid var(--ink);padding-top:7px}
.card .cost b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- luta ao vivo ---------- */
.live{border:1px solid var(--ink);background:var(--stock-2);margin:14px 0}
.live-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:9px 13px;border-bottom:1px solid var(--ink);flex-wrap:wrap}
.live-head .vs{font-family:Oswald,sans-serif;font-weight:700;font-size:14px;
  letter-spacing:.05em;text-transform:uppercase}
.live-head .rd{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faded);font-variant-numeric:tabular-nums}
.play{padding:6px 13px 12px;min-height:110px}
.pbp{display:grid;grid-template-columns:52px 1fr;gap:9px;padding:4px 0;font-size:13px;
  animation:pbpin .22s ease both}
@keyframes pbpin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pbp .clk{color:var(--faded);font-size:11.5px;font-variant-numeric:tabular-nums;padding-top:1px}
.pbp.big{font-weight:600}
.pbp.kd{color:var(--stamp);font-weight:600}
.pbp.rd{border-top:1px solid var(--rule);margin-top:6px;padding-top:8px;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--faded)}
.pbp.fin{font-family:Oswald,sans-serif;font-weight:700;font-size:17px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--stamp);padding-top:8px}
.btn-sm{padding:7px 13px;font-size:13px}

/* ---------- escolha de divisão ---------- */
/* ---------- seletor de modo ---------- */
.modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px;
  margin:14px 0 10px}
.modo{border:1px solid var(--line);background:var(--stock-2);padding:10px 12px;
  display:flex;flex-direction:column;gap:4px;text-align:left}
.modo:hover{border-color:var(--line2)}
.modo.on{border-color:var(--stamp);background:var(--panel2)}
.modo .n{font-family:Oswald,sans-serif;font-weight:700;font-size:13px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faded)}
.modo.on .n{color:var(--stamp)}
.modo .d{font-size:11px;color:var(--faded);line-height:1.45}
.modo-nota{font-size:11px;color:var(--faded);line-height:1.6;margin:0 0 12px}
.divs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.div-c{border:1px solid var(--ink);background:var(--stock-2);padding:11px 12px;
  text-align:left;display:flex;flex-direction:column;gap:5px;
  transition:background .12s,transform .08s}
.div-c:hover{background:var(--panel2);border-color:var(--line2);transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--line2)}
.div-c:active{transform:none;box-shadow:none}
.div-c .n{color:var(--ink);font-family:Oswald,sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.04em;text-transform:uppercase}
.div-c .lb{font-size:11px;color:var(--faded);letter-spacing:.08em}
.div-c .qt{font-size:11px;color:var(--faded);border-top:1px dotted var(--rule);
  padding-top:5px;margin-top:2px}
.div-c .qt b{color:var(--ink);font-weight:600}
.div-c .top{font-size:11px;color:var(--faded);font-style:italic}
.div-c.fem .n::after{content:" ♀";color:var(--stamp);font-size:13px}

/* ---------- painel do lutador ---------- */
.carreira{display:grid;grid-template-columns:262px minmax(0,1fr);gap:18px;align-items:start}
.ficha{background:var(--panel);border:1px solid var(--line);position:sticky;top:72px}
.ficha-top{padding:13px 14px 11px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}
.ficha-top .boneco{flex:0 0 auto}
.ficha-top .id{min-width:0}
.ficha-top .nm{font-family:Oswald,sans-serif;font-weight:700;font-size:17px;line-height:1.1;
  word-break:break-word}
.ficha-top .sub{font-size:11px;color:var(--faded);margin-top:3px}
.ficha-top .assin{font-size:11px;color:var(--gold);margin-top:4px;letter-spacing:.04em}
.ficha-sec{padding:11px 14px;border-bottom:1px solid var(--line)}
.ficha-sec:last-child{border-bottom:none}
.ficha-sec h4{margin:0 0 8px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faded);font-weight:400}
.cint{display:flex;align-items:center;gap:9px}
.cint .b{font-family:Oswald,sans-serif;font-weight:700;font-size:15px;letter-spacing:.05em;
  text-transform:uppercase;border:2px solid currentColor;padding:2px 9px}
.cint .b.sim{color:var(--gold)}
.cint .b.nao{color:var(--faded)}
.cint small{font-size:11px;color:var(--faded)}
/* vermelho escuro: é aviso do que falta, não alarme */
.passo{margin-top:8px;font-size:11.5px;line-height:1.45;color:#9E4238;
  border-left:2px solid #6E3A38;padding-left:9px}
/* Posição na divisão: o número é a informação, o movimento é o drama. */
.rank{display:flex;align-items:baseline;gap:8px}
.rank .pos{font-family:Oswald,sans-serif;font-weight:700;font-size:19px;
  letter-spacing:.03em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.rank .de{font-size:11px;color:var(--faded)}
.rank .mov{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:var(--faded)}
.rank .mov.sobe{color:#6FC486}
.rank .mov.cai{color:var(--stamp)}
.rank-pico{margin-top:7px;font-size:11px;color:var(--faded)}
.lesao-nome{font-family:Oswald,sans-serif;font-weight:600;font-size:13px;color:var(--ink)}
.lesao-mag{margin-top:2px;font-size:12px;font-weight:600;color:var(--stamp)}
.lesao-dur{margin-top:3px;font-size:11px;color:var(--stamp)}
.atrs{display:grid;gap:7px}
.atr{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:baseline}
.atr .r{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faded)}
.atr .v{font-size:11.5px;font-variant-numeric:tabular-nums;font-weight:600}
.atr .g{font-size:10px;color:#6FC486;margin-left:4px}
.atr .dn{font-size:10px;color:var(--stamp);margin-left:4px}
.atrbar{grid-column:1/-1;height:6px;background:rgba(255,255,255,.07);position:relative;margin-top:1px}
.atrbar .base{position:absolute;left:0;top:0;bottom:0;background:var(--ink2);opacity:.55}
.atrbar .gan{position:absolute;top:0;bottom:0;background:#4E9A62}
.atrbar .perda{position:absolute;top:0;bottom:0;background:var(--stamp);opacity:.55}
@media (max-width:1080px){.carreira{grid-template-columns:1fr}.ficha{position:static}}

/* ---------- criador de personagem ---------- */
.criador{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;margin-top:8px}
.palco{background:var(--panel);border:1px solid var(--line);padding:22px 18px;text-align:center;
  position:sticky;top:70px;
  background-image:radial-gradient(ellipse at 50% 32%,rgba(255,255,255,.045),transparent 62%)}
.palco .boneco{display:block;margin:0 auto;max-width:100%;height:auto}
.palco .nomebox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.palco .nomebox small{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faded);margin-bottom:5px}
.palco input{width:100%;max-width:260px;text-align:center;font-size:17px}
.painelC{background:var(--panel);border:1px solid var(--line)}
.abas{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line)}
.aba{flex:1 1 auto;background:transparent;border:none;border-bottom:2px solid transparent;
  color:var(--faded);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:11px 6px;transition:color .12s,border-color .12s}
.aba:hover{color:var(--ink)}
.aba.on{color:var(--ink);border-bottom-color:var(--stamp)}
.corpoC{padding:15px 16px 18px;min-height:230px}
.linhaC{margin-bottom:16px}
.linhaC:last-child{margin-bottom:0}
.linhaC-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.linhaC-hd span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faded)}
.linhaC-hd b{font-size:12.5px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line2);background:transparent;color:var(--ink2);
  font-size:11.5px;padding:5px 10px;transition:all .12s}
.chip:hover{border-color:var(--ink2);color:var(--ink)}
.chip.on{background:var(--stamp);border-color:var(--stamp);color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:28px;height:28px;border:1px solid var(--line2);padding:0;transition:transform .1s}
.sw:hover{transform:scale(1.12)}
.sw.on{outline:2px solid var(--stamp);outline-offset:2px}
@media (max-width:860px){.criador{grid-template-columns:1fr}.palco{position:static}
  .aba{font-size:9.5px;padding:9px 4px}}

/* ---------- tabuleiro do octógono ---------- */
.arena{display:grid;grid-template-columns:270px minmax(340px,1fr) 290px;gap:16px;
  align-items:start;margin-top:6px}
/* A lista tinha 8 cartas e esticava a página inteira: não dava pra ver a última
   opção e o octógono ao mesmo tempo. Agora ela rola dentro da própria coluna. */
.cards-scroll{max-height:min(62vh,470px);overflow-y:auto;padding-right:5px;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.cards-scroll::-webkit-scrollbar{width:7px}
.cards-scroll::-webkit-scrollbar-thumb{background:var(--line2)}
.col-t{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faded);
  margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.painel{background:var(--panel);border:1px solid var(--line);padding:13px 14px}
/* O raio dos slots precisa deixar meia-largura de caixa para dentro, senão
   eles vazam por cima das colunas vizinhas e do texto acima. */
.oct-wrap{position:relative;width:100%;aspect-ratio:1/1;max-width:460px;margin:8px auto 0;
  padding:0}
.oct-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:92px;z-index:2;
  background:var(--panel);border:1px solid var(--line);padding:7px 8px;text-align:center;
  transition:border-color .2s,background .2s}
.slot .lab{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faded);
  display:block;line-height:1.25}
.slot .val{font-family:Oswald,sans-serif;font-weight:700;font-size:17px;line-height:1.1;
  display:block;color:var(--faded)}
.slot .src{font-size:9px;color:var(--faded);display:block;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.cheio{border-color:var(--line2);background:var(--panel2)}
.slot.cheio .val{color:var(--ink)}
/* Destaque, não alarme: vermelho dessaturado e sem preenchimento.
   O salto roda a cada passada de mouse porque desenhaOctogono recria os nós,
   então a animação reinicia sozinha — é mais curto e mais fraco que o da
   escolha, que é o momento que realmente merece peso. */
.slot.mira{border-color:#6E3A38;box-shadow:inset 0 0 0 1px rgba(192,57,43,.16);
  animation:salta .34s cubic-bezier(.3,1.5,.5,1) both}
.slot.mira .lab{color:#A8756E}
@keyframes salta{
  0%{transform:translate(-50%,-50%) scale(1)}
  45%{transform:translate(-50%,-58%) scale(1.11)}
  100%{transform:translate(-50%,-50%) scale(1)}}
.slot.novo{animation:fixa .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes fixa{from{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.oct-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:130px;z-index:1}
.oct-mid .n{font-family:Oswald,sans-serif;font-weight:700;font-size:34px;line-height:1;color:var(--ink)}
.oct-mid .l{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faded);margin-top:3px}
.oct-mid .b{height:5px;background:rgba(255,255,255,.08);margin-top:9px;position:relative}
.oct-mid .b i{position:absolute;left:0;top:0;bottom:0;background:var(--stamp);transition:width .4s ease}
/* dossiê */
.dossie .nm{font-family:Oswald,sans-serif;font-weight:700;font-size:23px;line-height:1.08;margin:2px 0 7px}
.dossie .tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.dossie .tag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line2);padding:2px 6px;color:var(--ink2)}
.dossie .tag.t{border-color:var(--gold);color:var(--gold)}
.dossie p{font-size:12.5px;line-height:1.55;color:var(--ink2);margin:0 0 10px}
.dossie .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-bottom:11px}
.dossie .cel{background:var(--panel2);padding:7px 9px}
/* Mesma marcação dos slots do octógono: liga visualmente "estes dois atributos"
   com "estes dois lados". Sem isso o jogador não conecta os dois lados da tela. */
.dossie .cel.mira{box-shadow:inset 0 0 0 1px #6E3A38;background:#151A24}
.dossie .cel.mira small{color:#A8756E}
.dossie .cel small{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faded)}
.dossie .cel b{font-family:Oswald,sans-serif;font-weight:700;font-size:16px}
.dossie .vazio{color:var(--faded);font-size:12.5px;line-height:1.6;padding:24px 0;text-align:center}
@media (max-width:1000px){.arena{grid-template-columns:1fr}
  .oct-wrap{max-width:420px}.slot{width:84px}}
@media (max-width:560px){.oct-wrap{max-width:330px}.slot{width:70px;padding:5px 4px}
  .slot .val{font-size:14px}.slot .lab{font-size:8px}.slot .src{display:none}}

/* ---------- escolha de adversário e camp ---------- */
.escolha{margin:12px 0 4px}
.esc-hd{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faded);
  margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opp{border:1px solid var(--ink);background:var(--stock-2);padding:12px 13px;text-align:left;
  display:flex;flex-direction:column;gap:7px;transition:background .12s,transform .08s}
.opp:hover{background:var(--panel2);border-color:var(--line2);transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--line2)}
.opp:active{transform:none;box-shadow:none}
.opp .nm{color:var(--ink);font-family:Oswald,sans-serif;font-weight:700;font-size:16px;letter-spacing:.03em;line-height:1.15}
.opp .arq{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faded)}
.opp .bio{font-size:11.5px;color:var(--faded);line-height:1.45;
  border-top:1px dotted var(--rule);padding-top:6px}
.opp .bio b{color:var(--ink);font-weight:600}
.opp .dif{display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-top:1px solid var(--ink);padding-top:7px;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase}
.opp .dif b{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.06em}
.d1 b{color:#6FC486}.d2 b{color:#9FBF7C}.d3 b{color:#C08F52}.d4 b{color:#E05A48}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border:1px solid var(--line2);display:block}
.pips i.on{background:var(--ink2)}
.d4 .pips i.on{background:var(--stamp);border-color:var(--stamp)}
.camps{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.camp{border:1px solid var(--ink);background:var(--stock-2);padding:11px 12px;text-align:left;
  display:flex;flex-direction:column;gap:5px;transition:background .12s,transform .08s}
.camp:hover{background:var(--panel2);border-color:var(--line2);transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--line2)}
.camp .t{color:var(--ink);font-family:Oswald,sans-serif;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.camp .d{font-size:11.5px;color:var(--faded);line-height:1.4}
.camp .g{font-size:11px;font-weight:600;color:#6FC486}
.camp-bar{display:block;height:5px;background:rgba(255,255,255,.08);margin-top:4px;position:relative}
.camp-bar i{position:absolute;left:0;top:0;bottom:0;background:#4E9A62;transition:width .3s ease}
.camp-st{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faded);margin-top:3px}
.contra{border-left:3px solid var(--stamp);padding:8px 0 8px 11px;margin:9px 0 2px;
  font-size:12.5px;line-height:1.45}
.contra b{font-weight:600}

/* ---------- dilema interativo ---------- */
.dilema{border:1.5px solid var(--line2);background:var(--panel);
  padding:13px 15px;margin:10px 0 12px;animation:fade .4s ease both}
.dil-t{font-family:Oswald,sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.dil-c{font-size:13.5px;line-height:1.55}
.dil-in{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.dil-in input{flex:1;min-width:180px;font-size:14px}
.dil-r{font-style:italic;color:var(--faded);font-size:13px;margin-top:10px;
  padding-left:12px;border-left:2px solid var(--rule)}
.dil-o{font-size:13.5px;line-height:1.55;margin-top:9px;padding-top:9px;
  border-top:1px dotted var(--rule)}
.dil-fx{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap;align-items:baseline}

/* ---------- celular: repercussão ---------- */
.stage{display:grid;grid-template-columns:minmax(340px,1fr) 300px;gap:16px;align-items:start;margin:14px 0}
.phone{border:2px solid var(--line2);border-radius:22px;background:var(--panel);
  padding:9px 8px 12px;position:relative;box-shadow:3px 3px 0 rgba(0,0,0,.10)}
.phone::before{content:"";display:block;width:52px;height:4px;border-radius:3px;
  background:var(--rule);margin:0 auto 9px}
.phone-hd{display:flex;justify-content:space-between;align-items:baseline;
  padding:0 6px 7px;border-bottom:1px solid var(--rule);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faded)}
.feed{max-height:340px;overflow-y:auto;padding:0 4px}
.tw{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 4px;
  border-bottom:1px solid var(--rule);animation:pbpin .25s ease both}
.tw .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:600;color:#fff;letter-spacing:.02em}
.tw .who{display:block;font-size:11.5px;font-weight:600;line-height:1.3}
.tw .who span{font-weight:400;color:var(--faded);font-size:10.5px}
.tw .txt{display:block;font-size:12px;line-height:1.42;margin-top:3px}
.tw .rt{display:block;font-size:10px;color:var(--faded);margin-top:6px;letter-spacing:.06em}
.tw.hater .av{filter:saturate(.35)}
.tw.hater .txt{color:#D1584A}

.meters{display:grid;gap:9px;margin:11px 0 0;padding:10px 8px 2px;border-top:1px solid var(--ink)}
.meter{display:grid;gap:4px}
.meter-hd{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faded)}
.meter-hd b{font-size:15px;font-family:Oswald,sans-serif;letter-spacing:.02em;color:var(--ink)}
.fanbar{height:9px;background:rgba(255,255,255,.07);position:relative}
.fanbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .6s ease}
.fanbar.hot i{background:#4E9A62}
.fanbar.cold i{background:var(--stamp)}
.delta{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.delta.up{color:#6FC486}.delta.down{color:var(--stamp)}
@media (max-width:900px){.stage{grid-template-columns:1fr}
  .phone{max-width:340px;margin:0 auto}}

/* ---------- registro de lutas ---------- */
.bouts{border-top:1px solid var(--rule);margin-top:6px}
.bout{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--rule);
  animation:slide .3s ease both}
@keyframes slide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.bout .no{font-size:11px;color:var(--faded);font-variant-numeric:tabular-nums}
.bout .opp{font-weight:500}
.bout .how{font-size:11.5px;color:var(--faded);letter-spacing:.04em}
.bout.title-fight .opp::after{content:" ★";color:var(--gold)}

/* ---------- o carimbo (elemento assinatura) ---------- */
.stamp{font-family:Oswald,sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;border:2.5px solid currentColor;padding:2px 8px;
  color:var(--win);transform:rotate(-4deg);white-space:nowrap;
  animation:press .3s cubic-bezier(.2,1.6,.4,1) both}
.stamp.d{color:var(--loss);transform:rotate(3deg)}
@keyframes press{from{opacity:0;transform:scale(2.6) rotate(-14deg)}
  60%{opacity:1}to{opacity:.9;transform:scale(1) rotate(-4deg)}}
.stamp.d{animation-name:pressD}
@keyframes pressD{from{opacity:0;transform:scale(2.6) rotate(12deg)}
  60%{opacity:1}to{opacity:.9;transform:scale(1) rotate(3deg)}}

.event{font-style:italic;color:var(--faded);font-size:12.5px;padding:2px 0 10px 44px;
  border-bottom:1px solid var(--rule);animation:fade .5s ease both}
.event.rare{color:var(--stamp);font-style:normal;font-weight:500;
  border-left:3px solid var(--stamp);padding:8px 0 8px 12px;margin-left:32px}
.legacy{border-left:3px solid var(--ink);padding:12px 0 12px 16px;margin:20px 0 6px;
  font-size:15px;line-height:1.6;font-style:italic}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* nocaute: a página leva o golpe */
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-7px,3px)}35%{transform:translate(6px,-3px)}
  55%{transform:translate(-4px,-2px)}75%{transform:translate(3px,2px)}}
body.ko .wrap{animation:shake .42s ease}
body.ko::after{content:"";position:fixed;inset:0;background:var(--stamp);
  opacity:.16;pointer-events:none;animation:flash .42s ease forwards}
@keyframes flash{from{opacity:.3}to{opacity:0}}

/* ---------- relatório final ---------- */
.tape{width:100%;border-collapse:collapse;margin-top:6px}
.tape td{padding:7px 0;border-bottom:1px dotted var(--rule);vertical-align:baseline}
.tape td:first-child{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faded);width:46%}
.tape td:last-child{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.verdict{display:flex;align-items:center;gap:20px;margin:22px 0 8px;
  border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:18px 0}
.verdict .letter{font-family:Oswald,sans-serif;font-weight:700;font-size:72px;line-height:.8;
  color:var(--stamp);border:4px solid var(--stamp);padding:8px 18px 12px;transform:rotate(-3deg);
  animation:press .45s cubic-bezier(.2,1.6,.4,1) both}
.verdict .said{font-size:14px;line-height:1.45}
.verdict .said small{display:block;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faded);margin-bottom:5px}
.made-of{font-size:12px;color:var(--faded);line-height:1.7;margin-top:14px}
.made-of b{color:var(--ink);font-weight:500}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
/* Durante a narração a página cresce e empurra os controles pra fora da tela.
   Sem isto não dá pra desligar o automático depois de ligado. */
/* padding-right = largura da engrenagem (36px) + o right:14px dela: reserva
   exatamente a faixa que ela ocupa no topo, então o conteúdo desta barra
   (inclusive o contador, que é o que costuma sobrar pro fim da linha em
   viewport estreito) nunca desenha por baixo dela, em qualquer largura. */
#controls{position:sticky;top:0;z-index:30;margin:0 0 4px;padding:11px 50px 10px 0;
  background:var(--bg);border-bottom:1px solid var(--line2)}
#controls::before{content:"";position:absolute;left:-40px;right:-40px;top:0;bottom:0;
  background:var(--bg);z-index:-1}
#controls.travado{border-bottom-color:var(--stamp)}
#controls.travado .aviso{color:var(--stamp);font-weight:600}
.hint{font-size:11.5px;color:var(--faded)}
.hint .g{color:#6FC486;font-weight:600}
.hint .dn{color:var(--stamp);font-weight:600}
.hidden{display:none!important}
.err{border:1.5px solid var(--stamp);padding:14px 16px;background:var(--stock-2)}
.err b{font-family:Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;
  display:block;margin-bottom:6px;color:var(--stamp)}
.err code{background:var(--stock);padding:1px 5px;font-size:12px}

/* ---------- configurações (engrenagem) ---------- */
/* Fica no canto inferior direito e fixo: a barra de controles é sticky no topo
   e só existe durante a carreira. Embaixo o botão alcança todas as telas sem
   disputar espaço com nada. */
/* Canto superior direito, ancorada pela direita: cresce pro lado esquerdo no
   hover em vez de "abrir pra direita" e sair da tela, que é onde ela mora.
   width/max-width anima com transition (não `right`), então a engrenagem em
   si não se desloca — só o espaço à esquerda dela aparece. overflow:hidden
   esconde o rótulo até o max-width crescer o bastante pra revelar. */
.cfg-btn{position:fixed;top:14px;right:14px;z-index:50;
  display:flex;align-items:center;justify-content:flex-end;
  height:36px;max-width:36px;overflow:hidden;
  padding:0;background:var(--bg);border:1px solid var(--line);color:var(--faded);
  transition:max-width .22s ease,border-color .15s ease,color .15s ease}
.cfg-btn:hover,.cfg-btn:focus-visible{max-width:180px;color:var(--ink);border-color:var(--line2)}
.cfg-btn svg{flex:none;width:17px;height:17px;margin:0 9px}
.cfg-btn .cfg-lbl{flex:none;padding-left:12px;white-space:nowrap;
  font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  opacity:0;transform:translateX(6px);
  transition:opacity .16s ease,transform .16s ease}
.cfg-btn:hover .cfg-lbl,.cfg-btn:focus-visible .cfg-lbl{opacity:1;transform:translateX(0)}
/* prefers-reduced-motion já zera toda transition/animation via *{...} lá embaixo —
   essa engrenagem usa só transition (max-width/opacity/transform), nada de JS
   controlando a animação, então cai nessa regra global de graça. */
.cfg-overlay{position:fixed;inset:0;z-index:70;background:rgba(6,8,12,.74);
  display:flex;align-items:center;justify-content:center;padding:18px}
.cfg-painel{width:100%;max-width:380px;background:var(--panel);
  border:1px solid var(--line2);padding:16px 18px 15px}
.cfg-top{display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding-bottom:9px}
.cfg-top h2{font-family:Oswald,Impact,sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--ink)}
.cfg-x{background:none;border:0;color:var(--faded);font-size:15px;padding:2px 5px;
  line-height:1}
.cfg-x:hover{color:var(--stamp)}
.cfg-linha{display:flex;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--rule)}
.cfg-rot{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink2);width:70px;flex:none}
.cfg-num{font-size:11.5px;color:var(--faded);width:40px;text-align:right;
  flex:none;font-weight:400}
.cfg-off{opacity:.32}
.cfg-toggle{margin-left:auto;background:none;border:1px solid var(--line2);
  color:var(--ink2);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 13px}
.cfg-toggle.on{background:var(--stamp);border-color:var(--stamp);color:#fff}
.cfg-nota{font-size:11px;color:var(--faded);line-height:1.6;margin:13px 0 0}
/* Barra sem canto arredondado e polegar retangular: o resto da página não tem
   um único raio de canto, uma barra padrão de navegador destoaria. */
.cfg-range{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:18px;
  background:none;margin:0;cursor:pointer}
.cfg-range::-webkit-slider-runnable-track{height:2px;background:var(--line2)}
.cfg-range::-moz-range-track{height:2px;background:var(--line2)}
.cfg-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:10px;height:16px;margin-top:-7px;background:var(--ink);border:0}
.cfg-range::-moz-range-thumb{width:10px;height:16px;background:var(--ink);
  border:0;border-radius:0}
.cfg-range:disabled{cursor:default}

/* Card de momento: sobrepõe, nunca trava. Sem display:none no #app nem
   pausa de auto/nextFight — só um overlay que o jogador abre e fecha
   quando quiser, inclusive com o automático rodando por baixo. */
.painel-overlay{position:fixed;inset:0;background:rgba(6,9,14,.72);
  display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.painel-momentos{background:var(--panel2);border:1px solid var(--rule);
  max-width:480px;width:100%;max-height:82vh;overflow:auto;padding:18px}
.painel-momentos h3{margin:0 0 12px;font-family:Oswald,sans-serif;font-size:18px;color:var(--ink)}
.painel-momentos .vazio{color:var(--faded);font-size:13px}
.momento-item{border:1px solid var(--rule);padding:10px 12px;margin-bottom:10px;
  display:flex;gap:12px;align-items:flex-start}
.momento-mini{flex:none;border:1px solid var(--rule)}
.momento-texto{flex:1;min-width:0}
.momento-item .frase{font-size:13px;color:var(--ink);margin-bottom:8px}
.momento-item .meta{font-size:11px;color:var(--faded);margin-bottom:8px}
.painel-fechar{margin-top:4px}
/* Conquistas: documento, não troféu ilustrado — sem ícone, sem imagem, sem
   canto arredondado, mono herdado do body (sobrescreve o Oswald do h3
   compartilhado com o painel de cards). */
.painel-momentos.conquistas h3{font-family:inherit;font-weight:600}
.conquista{border-bottom:1px solid var(--rule);padding:8px 0}
.conquista:last-child{border-bottom:none}
.conquista-nome{font-size:13px;color:var(--faded)}
.conquista.ok .conquista-nome{color:var(--ink);font-weight:600}
.conquista-desc{font-size:11px;color:var(--faded);margin-top:2px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:560px){
  .doc-head h1{font-size:20px}
  .bout{grid-template-columns:26px 1fr;row-gap:4px}
  .bout .stamp{grid-column:2;justify-self:start}
  .event{padding-left:36px}
  .verdict{flex-direction:column;align-items:flex-start;gap:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="doc-head">
    <h1>Ficha do Lutador</h1>
    <div class="meta" id="docmeta">Comissão Atlética · Registro</div>
  </div>
  <div id="app"></div>
</div>

<!-- Engrenagem e painel ficam no HTML estático: existem em todas as telas e o
     JS só precisa achá-los por id, sem depender de document.body. -->
<!-- Rótulo vem ANTES do svg no DOM: com justify-content:flex-end no .cfg-btn,
     os dois ficam colados na borda direita e o rótulo abre espaço à
     ESQUERDA da engrenagem no hover — ela não se move.
     title/aria-label continuam no botão: toque não tem hover, então o
     rótulo visual nunca aparece em celular, mas o nome acessível segue ali. -->
<button id="cfgbtn" class="cfg-btn" type="button" title="Configurações"
        aria-label="Configurações">
  <span class="cfg-lbl" aria-hidden="true">Configurações</span>
  <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M20.00,12.00 L19.79,13.81 L22.13,14.35 L20.82,17.50 L18.79,16.23 L17.66,17.66 L16.23,18.79 L17.50,20.82 L14.35,22.13 L13.81,19.79 L12.00,20.00 L10.19,19.79 L9.65,22.13 L6.50,20.82 L7.77,18.79 L6.34,17.66 L5.21,16.23 L3.18,17.50 L1.87,14.35 L4.21,13.81 L4.00,12.00 L4.21,10.19 L1.87,9.65 L3.18,6.50 L5.21,7.77 L6.34,6.34 L7.77,5.21 L6.50,3.18 L9.65,1.87 L10.19,4.21 L12.00,4.00 L13.81,4.21 L14.35,1.87 L17.50,3.18 L16.23,5.21 L17.66,6.34 L18.79,7.77 L20.82,6.50 L22.13,9.65 L19.79,10.19 Z M15.30,12.00 A3.3,3.3 0 1,0 8.70,12.00 A3.3,3.3 0 1,0 15.30,12.00 Z"/>
  </svg>
</button>
<div id="cfg" class="cfg-overlay" style="display:none"></div>

<script>
/* =========================================================================
   MOTOR — mesma lógica de fightsim.js, calibrada em 6.000 lutas
   ========================================================================= */
const TUNING={tickSeconds:15,roundSeconds:300,
  koPower:{flyweight:.55,bantamweight:.65,featherweight:.80,lightweight:.95,
    welterweight:1.05,middleweight:1.20,light_heavyweight:1.40,heavyweight:1.75,
    w_strawweight:.45,w_flyweight:.50,w_bantamweight:.60,w_featherweight:.65},
  reachPerInch:.012,reachCap:.10,gnpVolume:.65,gnpAccuracy:.80,
  kdBase:.045,finishGivenKd:.58,subBase:1.4,standUpBase:.08,contestTemp:.55,leagueStrDef:.60,formSpread:.22};

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;};}
function contest(attack,defense){const a=clamp(attack,.02,.98),d=clamp(defense,.02,.98);
  const k=TUNING.contestTemp,n=Math.pow(a*(1-d),k);
  return n/(n+Math.pow((1-a)*d,k));}
function poisson(l,rng){if(l<=0)return 0;const L=Math.exp(-l);let k=0,p=1;
  do{k++;p*=rng();}while(p>L);return k-1;}
function fmtClock(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
/* inverso do fmtClock — precisa pro card de momento saber se um nocaute no
   round 1 foi rápido: r.clock é o relógio REGRESSIVO (começa "5:00", desce),
   então "rápido" é clock ALTO, não baixo — o oposto do que a leitura de
   transmissão real sugere. Ver LEIA-ME "Card de momento". */
function clockSeconds(s){const[m,ss]=s.split(":").map(Number);return m*60+ss;}

function mkState(f,form){return{ref:f,form,damage:0,sigStrikes:0,takedowns:0,knockdowns:0,
  subAttempts:0,controlTicks:0};}

function exchange(att,def,rng,opts={}){
  const A=att.ref,D=def.ref,minutes=TUNING.tickSeconds/60;
  const reachEdge=clamp(((A.reach??72)-(D.reach??72))*TUNING.reachPerInch,-TUNING.reachCap,TUNING.reachCap);
  const baseAcc=opts.ground?TUNING.gnpAccuracy:A.strAcc;
  const baseDef=opts.ground?D.strDef*.45:D.strDef;
  const effAcc=clamp(contest((baseAcc+reachEdge)*att.form,baseDef*def.form),.05,.95);
  const refAcc=clamp(contest(baseAcc,TUNING.leagueStrDef),.05,.95);
  let lambda=A.slpm*minutes*(effAcc/refAcc)*att.form;
  if(opts.ground)lambda*=TUNING.gnpVolume;
  lambda*=clamp(1-att.damage/220,.45,1);
  const landed=poisson(lambda,rng);
  att.sigStrikes+=landed;
  const power=TUNING.koPower[A.division]??1;
  def.damage+=landed*power*(opts.ground?1.25:1)*2.15/(D.durability??1);
  return landed;
}
/* devolve "" | "kd" | "ko". A rolagem decide QUEDA; só depois decide se a queda
   vira nocaute. kdBase = koBase antigo / finishGivenKd, preservando a taxa de KO. */
function impact(att,def,landed,rng){
  if(!landed)return"";
  const power=TUNING.koPower[att.ref.division]??1;
  const punch=clamp((att.ref.kdAvg??.36)/.36,.45,2.4);
  const p=TUNING.kdBase*power*punch*landed*
    Math.pow(clamp(def.damage/100,0,2.5),1.6)/(def.ref.durability??1);
  if(rng()>=clamp(p,0,.9))return"";
  def.knockdowns=(def.knockdowns||0)+1;
  return rng()<TUNING.finishGivenKd?"ko":"kd";
}
function simulateFight(fa,fb,{seed=1,rounds=3}={}){
  const rng=mulberry32(seed);
  const form=()=>1+(rng()+rng()+rng()-1.5)/1.5*TUNING.formSpread;
  const A=mkState(fa,form()),B=mkState(fb,form());
  const tpr=TUNING.roundSeconds/TUNING.tickSeconds;
  const log=[];let sa=0,sb=0;
  const push=(round,clock,kind,text)=>log.push({round,clock,kind,text});
  const kds=()=>({[A.ref.name]:A.knockdowns,[B.ref.name]:B.knockdowns});
  const fin=(w,l,round,clock,m)=>{
    push(round,clock,"fin",`${w.ref.name} vence por ${m.toLowerCase()}`);
    return{winner:w.ref.name,loser:l.ref.name,method:m,round,clock,cards:null,log,knockdowns:kds()};};

  for(let round=1;round<=rounds;round++){
    push(round,"5:00","rd",`Round ${round}`);
    const snap={a:A.sigStrikes,at:A.takedowns,ac:A.controlTicks,
                b:B.sigStrikes,bt:B.takedowns,bc:B.controlTicks};
    let pos="STANDING",burst={a:0,b:0},since=0;

    for(let t=0;t<tpr;t++){
      const clock=fmtClock(TUNING.roundSeconds-t*TUNING.tickSeconds);
      if(pos==="STANDING"){
        for(const[att,def,tag]of[[A,B,"A"],[B,A,"B"]]){
          const rate=(att.ref.tdAvg/clamp(att.ref.tdAcc,.1,1))/(900/TUNING.tickSeconds);
          if(rng()<rate){
            if(rng()<contest(att.ref.tdAcc*att.form,def.ref.tdDef*def.form)){
              att.takedowns++;pos=tag==="A"?"GROUND_A":"GROUND_B";
              push(round,clock,"big",`Queda de ${att.ref.name}. Levou pro chão.`);
            }else push(round,clock,"",`${def.ref.name} defendeu a queda e voltou pra distância.`);
            break;
          }
        }
      }
      if(pos==="STANDING"){
        const la=exchange(A,B,rng),lb=exchange(B,A,rng);
        burst.a+=la;burst.b+=lb;since++;
        const ia=impact(A,B,la,rng);
        if(ia==="ko")return fin(A,B,round,clock,"Nocaute");
        if(ia==="kd")push(round,clock,"kd",`${B.ref.name} foi ao chão! Levantou cambaleando.`);
        const ib=impact(B,A,lb,rng);
        if(ib==="ko")return fin(B,A,round,clock,"Nocaute");
        if(ib==="kd")push(round,clock,"kd",`${A.ref.name} foi ao chão! Levantou cambaleando.`);
        if(since>=4){
          if(burst.a+burst.b===0)push(round,clock,"",`Round estudado. Ninguém quer se abrir.`);
          else if(burst.a>burst.b)push(round,clock,"",`${A.ref.name} acerta mais na troca, ${burst.a} a ${burst.b}.`);
          else if(burst.b>burst.a)push(round,clock,"",`${B.ref.name} acerta mais na troca, ${burst.b} a ${burst.a}.`);
          else push(round,clock,"",`Troca parelha, ${burst.a} a ${burst.b}.`);
          burst={a:0,b:0};since=0;
        }
      }else{
        const top=pos==="GROUND_A"?A:B,bot=pos==="GROUND_A"?B:A;
        top.controlTicks++;
        const landed=exchange(top,bot,rng,{ground:true});
        const im=impact(top,bot,landed,rng);
        if(im==="ko")return fin(top,bot,round,clock,"Nocaute técnico no chão");
        if(landed>=3)push(round,clock,"big",`${top.ref.name} martelando por cima. ${bot.ref.name} só protege.`);
        else if(top.controlTicks%3===0)push(round,clock,"",`${top.ref.name} controla a posição.`);
        for(const[g,opp,mult]of[[top,bot,1.4],[bot,top,1.0]]){
          const rate=(g.ref.subAvg/(900/TUNING.tickSeconds))*mult;
          if(rng()<rate){
            g.subAttempts++;
            const p=contest(TUNING.subBase*clamp(g.ref.subAvg/2.5,.15,.9),opp.ref.tdDef);
            if(rng()<p*3.6)return fin(g,opp,round,clock,"Finalização");
            push(round,clock,"big",`${g.ref.name} tenta a finalização! ${opp.ref.name} escapa.`);
          }
        }
        if(rng()<TUNING.standUpBase*(.5+bot.ref.tdDef)){
          pos="STANDING";push(round,clock,"",`${bot.ref.name} conseguiu levantar.`);
        }
      }
    }
    const pa=(A.sigStrikes-snap.a)+(A.takedowns-snap.at)*6+(A.controlTicks-snap.ac)*.7;
    const pb=(B.sigStrikes-snap.b)+(B.takedowns-snap.bt)*6+(B.controlTicks-snap.bc)*.7;
    if(pa>pb){sa+=10;sb+=9;push(round,"0:00","rd",`Fim do round ${round} — ${A.ref.name} levou.`);}
    else if(pb>pa){sb+=10;sa+=9;push(round,"0:00","rd",`Fim do round ${round} — ${B.ref.name} levou.`);}
    else{sa+=10;sb+=10;push(round,"0:00","rd",`Fim do round ${round} — round dividido.`);}
    A.damage*=.88;B.damage*=.88;
  }
  const w=sa>sb?A:sb>sa?B:(rng()<.5?A:B),l=w===A?B:A;
  log.push({round:rounds,clock:"0:00",kind:"fin",
    text:`Vai pros cartões. ${w.ref.name} vence por decisão, ${Math.max(sa,sb)}-${Math.min(sa,sb)}.`});
  return{winner:w.ref.name,loser:l.ref.name,method:"Decisão",round:rounds,clock:"0:00",
    cards:sa+"-"+sb,log,knockdowns:kds()};
}

/* Medidos por ferramentas/sensibilidade.js contra ESTE motor.
   Rode a ferramenta de novo sempre que mexer no TUNING — se o motor muda,
   os pesos mudam junto e o draft passa a cobrar errado. */
const WEIGHTS={slpm:1.00,subAvg:.63,tdAvg:.63,kdAvg:.48,tdDef:.48,strDef:.42,durability:.31,reach:.28};
const RIDERS={slpm:["strAcc"],tdAvg:["tdAcc"],strDef:["sapm"]};
const PAIRS=[
 {id:"trocacao",label:"Trocação",
  a:{key:"slpm",label:"Volume",fmt:v=>v.toFixed(2)+"/min"},
  b:{key:"reach",label:"Envergadura",fmt:v=>v.toFixed(0)+'"'}},
 {id:"poder",label:"Pancada",
  a:{key:"kdAvg",label:"Poder",fmt:v=>v.toFixed(2)+"/15min"},
  b:{key:"durability",label:"Queixo",fmt:v=>v.toFixed(2)}},
 {id:"chao",label:"Luta agarrada",
  a:{key:"tdAvg",label:"Quedas",fmt:v=>v.toFixed(2)+"/15min"},
  b:{key:"tdDef",label:"Defesa de queda",fmt:v=>(v*100).toFixed(0)+"%"}},
 {id:"jiujitsu",label:"Jiu-jitsu",
  a:{key:"subAvg",label:"Finalizações",fmt:v=>v.toFixed(2)+"/15min"},
  b:{key:"strDef",label:"Defesa de golpes",fmt:v=>(v*100).toFixed(0)+"%"}},
];
const TOTAL_WEIGHT=Object.values(WEIGHTS).reduce((a,b)=>a+b,0);
const BUDGET_PCT=.76;

function makePercentiler(pool){
  const s={};Object.keys(WEIGHTS).forEach(k=>s[k]=pool.map(f=>f[k]).sort((x,y)=>x-y));
  return(key,value)=>{const arr=s[key];let lo=0,hi=arr.length;
    while(lo<hi){const m=(lo+hi)>>1;arr[m]<value?lo=m+1:hi=m;}return lo/arr.length;};
}
const cost=(pair,src,pct)=>WEIGHTS[pair.a.key]*pct(pair.a.key,src[pair.a.key])
                          +WEIGHTS[pair.b.key]*pct(pair.b.key,src[pair.b.key]);

/* Correção da dívida da iteração 3: se os dois candidatos de um par saírem
   zerados, a linha vira decisão morta. ~25% das rolagens caíam nisso. */
function rollTable(pool,remaining,rng,pct){
  const rows=[];
  for(const pair of remaining){
    let cand=[];
    for(let tries=0;tries<12;tries++){
      cand=[pool[Math.floor(rng()*pool.length)],pool[Math.floor(rng()*pool.length)]];
      if(cand.some(s=>s[pair.a.key]>0))break;
    }
    cand.forEach(src=>rows.push({pair,src,cost:cost(pair,src,pct)}));
  }
  return rows;
}

/* =========================================================================
   AVALIAÇÃO — rating sai do próprio motor, contra um oponente mediano
   ========================================================================= */
function rateAll(roster){
  const byDiv={};roster.forEach(f=>(byDiv[f.division]??=[]).push(f));
  for(const div in byDiv){
    const pool=byDiv[div];
    const med=k=>{const v=pool.map(f=>f[k]).sort((a,b)=>a-b);return v[Math.floor(v.length/2)];};
    const ref={name:"__med__",division:div};
    ["slpm","strAcc","strDef","kdAvg","tdAvg","tdAcc","tdDef","subAvg","durability","reach","sapm"]
      .forEach(k=>ref[k]=med(k));
    for(const f of pool){let w=0;
      for(let s=1;s<=18;s++)if(simulateFight(f,ref,{seed:s*31+7}).winner===f.name)w++;
      f.rating=w/18;}
  }
  return roster;
}

/* =========================================================================
   CARD DE MOMENTO — congela um instante NO MEIO da carreira, não só no fim.
   Mesma voz do RARE/LEGACY: seca, específica, sem adjetivo de comentarista.
   st.momentos acumula silencioso (mesmo padrão de st.rares/st.events); nada
   aqui interrompe a narração nem o automático — ver LEIA-ME "Card de
   momento" pro porquê de cada gatilho ter sido cortado ou mantido, medido
   em 120 carreiras antes de escrever uma linha desta seção. */
function criarMomento(tipo,frase,opp,r){
  /* 3 linhas fixas, sempre as mesmas 3 — adversário, resultado, posição na
     divisão. Capturadas AQUI (no instante do gatilho), não no desenho:
     por quando o jogador abrir o card, standing já andou. */
  const pos=posicaoDivisao();
  return{tipo,frase,cartel:`${st.wins}-${st.losses}`,luta:fightNo,
    adversario:opp?opp.name:null,
    resultado:r?`${r.method} · round ${r.round} ${r.clock}`:null,
    posicao:pos?`#${pos.n} de ${pos.de}`:null};
}
const FRASE_KO_RAPIDO=n=>`${n} não deixou o locutor terminar de apresentar o adversário.`;
const FRASE_PRIMEIRO_CINTURAO=n=>`${n} levantou o cinturão e não soltou pra nenhuma foto.`;
const FRASE_UPSET=(n,opp)=>`${opp} tinha tudo pra vencer, menos a luta.`;
const FRASE_LESAO_VENCIDA=n=>`${n} entrou mancando e saiu com a mão levantada.`;

/* =========================================================================
   CONQUISTAS — troféu local, sem conta, sem IA. Cada check(st,modo) é
   função pura sobre o estado que o motor já mantém — nenhuma delas lê
   nada que a IA classificou (seguidores/fã são parcialmente influenciados
   pela IA a cada dilema, mas a maior parte do número vem de hype de luta
   real; todo o resto é 100% motor). Desbloqueio é PERMANENTE entre
   carreiras — troféu de verdade não some quando você começa outra.

   LIMIAR_IDOLO medido (180 carreiras, bot automático em 3 divisões):
   mediana de seguidores no fim é 1,4M, p75 é 6,1M — 5M fica logo abaixo do
   p75, top ~25% das carreiras, nem trivial nem quase impossível. */
const LIMIAR_IDOLO=5000000;
const CONQUISTAS=[
 {id:"primeiro_sangue",nome:"Primeiro sangue",desc:"Vença sua primeira luta.",
  check:st=>st.wins>=1},
 {id:"invicto",nome:"Invicto",desc:"Termine a carreira sem nenhuma derrota.",
  check:st=>st.fightNo>=TOTAL_FIGHTS&&st.losses===0},

  check:st=>(st.defesas||0)>=5},

/* localStorage guarda só os ids desbloqueados, nunca o estado da carreira —
   mesmo princípio de mudo/vol_musica/rosto: try/catch, sem IA nem conta,
   sem derrubar a carreira se o navegador bloquear. */
let CONQUISTAS_DESBLOQUEADAS=(()=>{
  try{return new Set(JSON.parse(localStorage.getItem("conquistas")||"[]"));}
  catch(e){return new Set();}
})();
function salvarConquistas(){
  try{localStorage.setItem("conquistas",JSON.stringify([...CONQUISTAS_DESBLOQUEADAS]));}catch(e){}
}
/* Roda depois de toda luta (não só no fim) — desbloqueio acontece na hora,
   igual card de momento. Retorna as que acabaram de desbloquear NESTA
   checagem, pra quem quiser avisar o jogador sem reabrir o painel inteiro. */
function verificarConquistas(){
  const novas=[];
  for(const c of CONQUISTAS){
    if(CONQUISTAS_DESBLOQUEADAS.has(c.id))continue;
    if(c.check(st,MODO)){CONQUISTAS_DESBLOQUEADAS.add(c.id);novas.push(c);}
  }
  if(novas.length)salvarConquistas();
  return novas;
}

/* Em vez de rotular 28 eventos à mão (e errar quando alguém editar o texto),
   a direção sai do próprio efeito: aplica num clone e compara os atributos.
   Evento sem efeito é neutro. */
const EIXOS_SOM=["slpm","strDef","tdDef","tdAvg","subAvg","kdAvg","durability","reach"];
function direcaoEvento(e,f){
  if(e&&e.tom)return e.tom;        // marcado à mão: os raros não mexem em atributo
  if(!e||!e.fx)return 0;
  let antes=0,depois=0;
  try{
    const d=e.fx(f);
    for(const k of EIXOS_SOM){
      if(d[k]==null||f[k]==null)continue;
      antes+=1; depois+=d[k]/f[k];
    }
  }catch(err){return 0;}
  if(!antes)return 0;
  const razao=depois/antes;
  return razao>1.008?1:razao<0.992?-1:0;
}
function somDoEvento(e,f){
  const d=direcaoEvento(e,f);
  (d>0?SOM.bom:d<0?SOM.ruim:SOM.evento)();
}

function drawEvent(st,rng,used,rareUsed){
  const rare=RARE.filter((e,i)=>!rareUsed.has(i)&&e.when(st));
  if(rare.length&&rng()<.85){const e=rare[0];rareUsed.add(RARE.indexOf(e));return{e,rare:true};}
  return _drawNormal(st,rng,used);
}
function _drawNormal(st,rng,used){
  const pool=EVENTS.filter((e,i)=>!used.has(i)&&(!e.when||e.when(st)));
  if(!pool.length)return null;
  const trig=pool.filter(e=>e.when);
  const from=(trig.length&&rng()<.72)?trig:pool;
  const e=from[Math.floor(rng()*from.length)];
  used.add(EVENTS.indexOf(e));return{e,rare:false};
}


/* =========================================================================
   REPERCUSSÃO — fã e seguidores saem da SIMULAÇÃO, não de texto gerado.
   A luta já sabe se teve nocaute no primeiro round, quantas quedas caíram e
   se foi zebra. Transformar isso em número é fórmula, não IA.
   ========================================================================= */
function hypeOf(r,won,opp,me_,titleFight,myKd,oppKd){
  let h=0;
  if(/ocaute/.test(r.method))h+=3.0;
  else if(r.method==="Finalização")h+=2.4;
  else h+=0.5;
  if(r.round===1&&r.method!=="Decisão")h+=1.6;
  if(r.round>=3&&r.method!=="Decisão")h+=0.8;      /* guerra longa */
  h+=myKd*1.1+oppKd*0.6;                          /* apanhar também é drama */
  if(titleFight)h+=2.2;
  const upset=(opp.rating||.5)-(me_.__rating||.5);
  if(won&&upset>.15)h+=2.0*Math.min(1,upset*3);   /* zebra */
  h+=won?1.4:-0.8;
  return Math.max(0,h);
}
/* seguidores crescem em porcentagem, então campeão chega a milhões e
   perdedor apodrece devagar — igual à vida real */
function followerDelta(followers,hype,won,standing){
  /* multiplicado pelo standing: lutar no card principal rende muito mais
     audiência que lutar no preliminar. É o que faz seguidor separar carreira. */
  const g=(hype/6)*(won?.26:.07)*(.25+standing*1.8)-(won?0:.075);
  const floor=won?260:-90;
  return Math.round(followers*g+floor*(1+standing));
}
const fmtPico=p=>p>=.5?`top ${Math.round(100-p*100)}%`:"fora do top 50";
const fmtNum=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace(".",",")+"M"
  :n>=1e3?(n/1e3).toFixed(n>=1e5?0:1).replace(".",",")+"mil":String(n);

/* Sorteio SEM REPOSIÇÃO num pool combinado.
   O bug antigo: numa vitória por finalização o único bucket era subWin, com 3
   moldes pra 4 linhas. O laço tentava 8 vezes, desistia e repetia o comentário.
   Agora hater e meme sempre entram no pool, então nunca falta candidato. */
function buildFeed(r,won,titleFight,myKd,oppKd,upset,rng,name,followers=0){
  const ko=/ocaute/.test(r.method),sub=r.method==="Finalização";
  const cand=[];
  /* peso é POR BUCKET, dividido entre os moldes dele. Sem isso o bucket com
     mais textos domina o sorteio só por ser maior — foi o que aconteceu com
     os haters, que tomaram 46% da timeline. */
  const add=(bucket,peso,hater)=>{
    const pool=TWEETS[bucket]||[];
    pool.forEach(fn=>cand.push({fn,peso:peso/pool.length,hater:!!hater}));
  };
  if(titleFight&&won)add("title",5);
  if(upset&&won)add("upset",5);
  add(won?(ko?"koWin":sub?"subWin":"decWin"):(ko?"koLoss":sub?"subLoss":"decLoss"),4);
  if(oppKd>0)add("knockdown",3);
  if(r.method==="Decisão"&&!titleFight)add("boring",3);
  add("meme",2);
  /* fama atrai hater: quase nenhum no começo, presença real no topo.
     Escala entre 2 mil (fama 0) e 1 milhão de seguidores (fama 1). */
  const fama=Math.max(0,Math.min(1,(Math.log10(Math.max(100,followers))-3.3)/2.7));
  add("hater",.5+fama*4.5,true);

  const out=[],usados=new Set();
  for(let i=0;i<4&&cand.length;i++){
    const total=cand.reduce((s,c)=>s+(usados.has(c.fn)?0:c.peso),0);
    if(total<=0)break;
    let alvo=rng()*total,esc=null;
    for(const c of cand){
      if(usados.has(c.fn))continue;
      alvo-=c.peso;
      if(alvo<=0){esc=c;break;}
    }
    if(!esc)break;
    usados.add(esc.fn);
    out.push({p:persona(rng),text:esc.fn(name),hater:esc.hater});
  }
  return out;
}

/* =========================================================================
   CAMADA DE IA — opcional por design.
   Se AI_URL estiver vazio, se a rede cair ou se estourar o tempo, tudo cai
   no molde local e o jogador não percebe. A IA melhora o jogo, nunca o
   sustenta. Todo número que volta do modelo é limitado no cliente: o texto
   do jogador entra no prompt, então tratar a resposta como confiável seria
   entregar as regras do jogo pra quem souber digitar.
   ========================================================================= */
const AI_URL="https://draft-ufc.vercel.app/api/ai";           /* ex: "https://seu-projeto.vercel.app/api/ai" */
let aiVivo=true;
/* Timestamp (ms), não segundos: rate limit (429) é ESPERADO com tráfego
   real, não exceção — pausa com espera, não desliga a carreira inteira por
   causa de 60s ruins. 60000 é chute inicial, não medido — não sei a janela
   real do limite do OpenRouter nesse plano; se 429 continuar comum mesmo
   com a pausa, é isso que precisa remedir, não o desenho. */
let aiPausadoAte=0;
const AI_PAUSA_MS=60000;
/* Falha de rede pontual (sem resposta nenhuma — servidor não respondeu, não
   é ele dizendo "não" com um status) merece nova tentativa; a 2ª seguida
   sem resposta já é sinal de que o caminho está inalcançável, e continuar
   tentando paga o timeout inteiro (9,5s) em toda chamada — pior que
   qualquer erro rápido. Zera a cada resposta recebida, mesmo de erro:
   resposta de erro significa que a rede está de pé, só o proxy disse não. */
let falhasRedeSeguidas=0;

async function ai(kind,data,ms=9500){
  /* Achado jogando: "aceito" (dilema binário comum) caiu no fallback
     genérico, e não tinha como saber POR QUÊ — ai() sempre devolvia null
     pelos mesmos 5 motivos possíveis, indistinguíveis de fora. Investigado
     na hora: nem piso de tamanho (não existe nenhum), nem falso positivo
     de CONTEUDO_INSEGURO (testado, nenhuma das frases curtas bate), nem
     falha de classificação (reproduzido ao vivo com a cena e resposta
     exatas, funcionou normal) — sobrou circuito aberto (aiVivo/pausa), o
     que bate com 429 tendo aparecido em 2 de 6 chamadas na medição. Este
     evento não conserta nada sozinho, mas da próxima vez dá pra saber
     qual dos 5 caminhos foi, em vez de reconstruir por eliminação. */
  if(!AI_URL){evento("ia_null",{motivo:"sem_url",kind});return null;}
  if(!aiVivo){evento("ia_null",{motivo:"desligado",kind});return null;}
  if(Date.now()<aiPausadoAte){evento("ia_null",{motivo:"pausado",kind});return null;}
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms);
  try{
    const r=await fetch(AI_URL,{method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({kind,data})});
    clearTimeout(t);
    falhasRedeSeguidas=0;
    if(!r.ok){
      /* O servidor já sabe o que aconteceu — não adivinha por status HTTP
         externo (502 cobre seis coisas diferentes, ver api/ai.js). Corpo
         pode não vir (resposta não-JSON de algum proxy no meio do caminho)
         ou pode faltar "transitorio" (deploy do client mais novo que o do
         servidor) — nos dois casos não desliga nada, só essa chamada
         falhou. */
      let corpo=null;
      try{corpo=await r.json();}catch(e){}
      if(corpo&&corpo.status===429){aiPausadoAte=Date.now()+AI_PAUSA_MS;
        evento("ia_null",{motivo:"429",kind});}
      else if(corpo&&corpo.transitorio===false){aiVivo=false;
        evento("ia_null",{motivo:"erro_permanente",kind});}
      else evento("ia_null",{motivo:"erro_transitorio",kind});
      return null;
    }
    const j=await r.json();
    return j.result??null;
  }catch(e){
    clearTimeout(t);
    falhasRedeSeguidas++;
    if(falhasRedeSeguidas>=2)aiVivo=false;
    evento("ia_null",{motivo:"rede",kind});
    return null;
  }
}
const lim=(v,lo,hi,def)=>{const n=Number(v);
  return Number.isFinite(n)?Math.max(lo,Math.min(hi,n)):def;};

/* Analytics nunca pode derrubar a carreira de ninguém — mesmo princípio de
   áudio/localStorage. window.va existe sempre (stub no <head>, ver
   comentário lá) mas só vira a função de verdade se Analytics estiver
   ligado no projeto; se não estiver, script.js dá 404 e window.va fica
   sendo o stub que só enfileira sem nunca ler — sem custo, sem quebra. */
function evento(nome,dados){
  try{window.va&&window.va("event",{name:nome,data:dados});}catch(e){}
}
/* Marca de tempo no carregamento do script — praticamente o mesmo instante
   de evento("abriu") em boot(), sem depender do await de fetch() lá dentro
   atrasar a marcação. É contra ela que terminou_luta_1 mede quanto tempo
   passa até a primeira luta acabar (PLANO-LANCAMENTO.md fase 2). */
const TEMPO_ABERTURA=Date.now();

/* busca antecipada: dispara quando a luta COMEÇA e resolve durante a
   narração, que dura uns 12 segundos. Latência percebida vai a zero. */
let feedPromise=null;
function prefetchFeed(r,won,opp,titleFight,myKd,oppKd,upset){
  feedPromise=ai("feed",{name:me.name,opp:opp.name,won,method:r.method,
    round:r.round,clock:r.clock,myKd,oppKd,title:titleFight,upset,
    record:`${st.wins}-${st.losses}`,followers:fmtNum(st.followers)});
}
async function resolveFeed(fallback,rng){
  const got=await(feedPromise||Promise.resolve(null));
  feedPromise=null;
  if(!Array.isArray(got)||got.length===0)return fallback;
  return got.slice(0,4).map(o=>{
    const p=persona(rng);
    if(o&&typeof o.nome==="string"&&o.nome.trim())
      {p.name=o.nome.trim().slice(0,14);p.initials=p.name.slice(0,2).toUpperCase();}
    return{p,text:String(o&&o.texto||"").slice(0,180)||"..."};
  }).filter(t=>t.text!=="...");
}

/* ---------- dilema: o jogador escreve o que faz, a IA julga ---------- */
const SEEDS=["imprensa provocando","dinheiro curto","família cobrando",
  "lesão escondida","proposta de patrocínio duvidosa","polêmica nas redes",
  "adversário te humilhando","convite pra outro esporte","treinador querendo sair",
  "fã passando do limite","corte de peso dando errado","entrevista ao vivo"];
const DILEMA_LOCAL=[
 {titulo:"A pergunta na coletiva",cena:"Um repórter pergunta, ao vivo, se você não acha que só venceu porque o adversário estava machucado. O microfone está na sua frente e o ginásio inteiro escuta."},
 {titulo:"O patrocínio esquisito",cena:"Uma casa de apostas oferece o dobro do que você ganha por luta. Seu treinador fez cara feia quando ouviu. O contrato vence amanhã."},
 {titulo:"O primo com ideia",cena:"Seu primo apareceu com um plano de abrir uma academia com seu nome. Ele quer que você entre com tudo e não trouxe nenhum papel."},
];

/* O lim() trava número que a IA devolve; isto trava TEXTO no mesmo espírito
   — a IA nunca é dependência. O desfecho do dilema é sobre a vida FORA do
   octógono; nenhum resultado de luta é dela pra afirmar, quem decide isso é
   o motor (ver api/ai.js, prompt de "julgar"). Corta só a FRASE que ofende,
   não o desfecho inteiro — perder a narração toda por causa de uma frase
   sai caro. CONTEXTO_TREINO existe porque um dilema pode ser sobre sparring
   ou o desempenho de outra pessoa (parceiro de treino, adversário no
   passado) sem afirmar nada da carreira do jogador — "nocauteou o parceiro
   no sparring" não pode cair aqui. Medido em 40 desfechos reais da IA: 5%
   das frases batem, sem falso positivo nos casos de terceiro.

   Dois buracos achados jogando, fechados depois: "venceu por KO" (sem a
   palavra nocaute) e "o médico parou a luta"/"a médica interrompeu"
   (resultado afirmado sem a palavra árbitro). `ko` sozinho na alternação
   basta — o \b da regex inteira já impede grudar em outra palavra ("KOch"
   não bate). O padrão de médico é restrito a "parou/interrompeu/
   encerrou/deteve" logo depois, de propósito — "menção a médico" sozinha
   sem isso (curativo de rotina, check-up) não pode virar corte.
   `node testar.js resultado` cobre os dois buracos e 6 controles. */
const RESULTADO_LUTA=/\b(nocaute\w*|ko|finaliz\w*(ou|ad[oa])|foi parad[oa] pelo árbitro|médic[oa]\s+(da comissão\s+)?(parou|interrompeu|encerrou|deteve)|perdeu (a luta|o combate) por|venceu (a luta|o combate) por|(saiu|saí)\s+d[oa]\s+(oct[aáoó]gono|tatame|ringue)\s+(carregad\w*|derrotad\w*|chorando)|decis[ãa]o\s+(un[âa]nime|dividida|majorit[áa]ria))\b/i;
const CONTEXTO_TREINO=/\b(sparring|trein\w*)\b/i;
function semResultadoDeLuta(texto){
  const frases=String(texto).split(/(?<=[.!?])\s+/).filter(Boolean);
  const mantidas=frases.filter(f=>!(RESULTADO_LUTA.test(f)&&!CONTEXTO_TREINO.test(f)));
  return mantidas.join(" ").trim();
}

/* A DEFESA PRINCIPAL É A INSTRUÇÃO NO PROMPT (api/ai.js, "julgar" e VOZ) —
   isto aqui é REDE DE BAIXO, não o freio. RESULTADO_LUTA funciona por regex
   porque o vocabulário de "quem venceu a luta" é fechado (nocaute, decisão,
   finalização — um punhado de palavras). Automutilação, violência gráfica e
   conteúdo sexual não têm vocabulário fechado: a IA narra a mesma coisa com
   outra palavra, eufemismo, ou outra língua, e o regex não pega. Por isso
   ESTE filtro não mira falso positivo baixo como o RESULTADO_LUTA (~5%) —
   mira pegar tudo que puder, aceitando gastar desfecho legítimo se precisar.
   Dispara em dois pontos: no texto do JOGADOR, antes de sequer chamar a IA
   (mais barato, e não depende da IA ter obedecido a instrução); e no
   "desfecho" que a IA devolve, como rede pro que passar da instrução. Se
   disparar em qualquer um dos dois, a resposta inteira da IA é descartada —
   não só o texto: um "j" que narrou isso não é confiável em nenhum campo,
   número incluso. */
const CONTEUDO_INSEGURO=/\b(automutila\w*|mutila\w*|amputa\w*|decepa\w*|cutelo|suicid\w*|se\s+matar|tirar\s+a\s+(própria\s+)?vida|overdose\s+proposital|esfaquea\w*|estrangula\w*|tortura\w*|degola\w*|desmembra\w*|estupr\w*|abus\w*\s+sexual|cort\w*.{0,25}(mãos?|braços?|pernas?|dedos?|pulsos?|veias?|membros?)|(mãos?|braços?|pernas?|dedos?|pulsos?|veias?|membros?).{0,25}cort\w*)/i;
function conteudoInseguro(texto){
  return CONTEUDO_INSEGURO.test(String(texto||""));
}
/* Fallback quando j vem nulo — filtro local (antes da chamada), rede pós-
   chamada pegando o desfecho da IA, ou falha de rede pura: as três causas
   caem aqui, indistinguíveis entre si de propósito. O que não pode
   acontecer é UMA FRASE SÓ, sempre igual — isso vira assinatura do filtro
   tão forte quanto a que já foi resolvida do lado da IA (ver LEIA-ME
   "Conteúdo inseguro no dilema"). Em segunda pessoa, igual sempre foi —
   não confundir com o texto neutro que a própria IA gera (terceira
   pessoa) quando é ELA quem decide neutralizar. */
const FALLBACK_NEUTRO=[
  "Você seguiu em frente e a semana passou sem grande consequência.",
  "Você não deu muita importância e a rotina continuou normal.",
  "Você mudou de assunto e ninguém comentou mais nada.",
  "Você deixou pra lá e voltou pro treino sem alarde.",
  "Você respondeu por cima e a semana seguiu tranquila.",
  "Você desconversou e a semana passou sem barulho nenhum.",
  "Você ficou na sua e nada mais aconteceu por causa disso.",
  "Você não se estendeu no assunto e a rotina não mudou em nada.",
];
function fraseFallback(){
  return FALLBACK_NEUTRO[Math.floor((fraseRng?fraseRng():Math.random())*FALLBACK_NEUTRO.length)];
}

async function abrirDilema(){
  const bouts=document.getElementById("bouts");
  const box=el("div","dilema");
  box.innerHTML=`<div class="dil-t">Carregando…</div>`;
  bouts.appendChild(box);
  box.scrollIntoView({behavior:"smooth",block:"nearest"});

  const seed=SEEDS[Math.floor(rng()*SEEDS.length)];
  const mood=st.streakW>=3?"em alta":st.streakL>=2?"em queda":"estável";
  let d=await ai("dilema",{name:me.name,record:`${st.wins}-${st.losses}`,
    followers:fmtNum(st.followers),fan:st.fan.toFixed(1),mood,seed});
  /* dilema não recebe texto do jogador — não dá pra provocar ele do jeito
     que dá pra provocar o julgar. Ainda assim, rede embaixo: se a IA gerar
     algo ruim sem provocação (improvável, mas não impossível), cai no
     mesmo fallback que já existe pra quando ela falha. */
  if(!d||!d.cena||conteudoInseguro(d.cena)||conteudoInseguro(d.titulo))
    d=DILEMA_LOCAL[Math.floor(rng()*DILEMA_LOCAL.length)];

  box.innerHTML=`<div class="dil-t">${String(d.titulo||"E agora?").slice(0,60)}</div>
    <div class="dil-c">${String(d.cena).slice(0,400)}</div>
    <div class="dil-in">
      <input type="text" id="dilresp" maxlength="200" placeholder="O que você faz?">
      <button class="btn btn-sm" id="dilgo">Decidir</button></div>`;
  const inp=document.getElementById("dilresp"),go=document.getElementById("dilgo");
  inp.focus();
  const enviar=async()=>{
    const txt=inp.value.trim();
    if(!txt)return inp.focus();
    go.disabled=true;inp.disabled=true;go.textContent="…";
    /* Corta ANTES de chamar a IA, não só depois: mais barato (economiza a
       chamada inteira) e não depende de o julgar ter obedecido a instrução
       de conteúdo inseguro — o texto nunca sai daqui. */
    const j=conteudoInseguro(txt)?null:await ai("julgar",{name:me.name,cena:d.cena,resposta:txt,
      record:`${st.wins}-${st.losses}`,followers:fmtNum(st.followers),fan:st.fan.toFixed(1)});
    aplicarDilema(box,d,txt,j);
  };
  go.onclick=enviar;
  inp.onkeydown=e=>{if(e.key==="Enter")enviar();};
  return new Promise(res=>{box.__done=res;});
}
/* Severidade e duração da lesão são do JOGO, medidas — não da IA. Medido em
   400 carreiras (candidatos()/simulateFight() reais), do jeito que o
   TETO_TREINO foi medido: temporária custa ~0,7-0,9 vitórias em 22,
   permanente ~1,0 (mesma ordem de grandeza do treino, não maior — é evento
   situacional). A IA só classifica TIPO e ATRIBUTO (ver prompt de "julgar"
   em api/ai.js) — deixar a MAGNITUDE com ela decepcionou: em 40 desfechos
   reais medidos, o "efeito" que ela devolveu ficou quase sempre perto de
   1.0, mesmo em cena dramática. Isto não passa por lim() porque não é
   número da IA — é constante do jogo. lim() continua travando "efeito" no
   dilema comum, abaixo. */
const LESAO_TIPOS={
  temporaria:{mult:.50,duracao:8},
  permanente:{mult:.75,duracao:null},
};

function aplicarDilema(box,d,txt,jBruto){
  /* Rede de baixo do conteúdo inseguro (ver CONTEUDO_INSEGURO acima): um "j"
     cujo desfecho narrou automutilação/violência/sexual não é confiável em
     NENHUM campo, não só no texto — descarta o objeto inteiro, não só a
     frase. A partir daqui só se usa jSeguro, nunca jBruto. */
  const jSeguro=(jBruto&&conteudoInseguro(jBruto.desfecho))?null:jBruto;
  const j=jSeguro;
  /* Todo número volta limitado. O jogador digita texto livre que entra no
     prompt, então nada que o modelo devolve é aceito sem trava. */
  const dSeg=lim(j&&j.seguidores,-.35,.60,0);
  const dFan=lim(j&&j.fa,-2.5,2.5,0);
  const ATTRS_LESAO=["slpm","strDef","durability","tdDef","subAvg","kdAvg"];

  /* Uma lesão de cada vez: st.lesao é objeto único, não lista. Se uma nova
     sobrescrevesse a ativa, o multiplicador da primeira ficaria órfão em
     st.eventoMod pra sempre (o tick de cura, em finishFight(), divide pelo
     mult guardado em st.lesao — sem ele não tem como reverter o que já foi
     aplicado). "já está machucado" também é defensável sozinho: não
     empilha um segundo problema em cima do primeiro.

     Existiu aqui um portão exigindo j.houveLesao===true concordando com o
     objeto lesao, mais um campo separado no prompt do julgar pedindo pra
     decidir isso ANTES do resto. Foi revertido: medido depois de deploy de
     verdade (a medição anterior tinha testado uma versão do prompt que
     nunca tinha saído do arquivo local — ver LEIA-ME.md, seção "Lesão"), o
     prompt sem o portão já acerta 8/8 nas cenas de lesão e 0/34 nas sem
     lesão. O portão era complexidade resolvendo um problema que não
     existia. A IA às vezes preenche lesao E o atributo/efeito comum ao
     mesmo tempo (o prompt pede pra não fazer isso, mas acontece — visto em
     3 das 8 respostas medidas) — isso é ignorado aqui de propósito, só a
     validade do PRÓPRIO objeto lesao importa. */
  const lesaoBruta=j&&j.lesao;
  const lesaoValida=!st.lesao&&lesaoBruta
    &&ATTRS_LESAO.includes(lesaoBruta.atributo)&&me[lesaoBruta.atributo]!=null;
  let atr=null, mult=1;
  if(lesaoValida){
    const tipo=LESAO_TIPOS[lesaoBruta.permanente?"permanente":"temporaria"];
    atr=lesaoBruta.atributo; mult=tipo.mult;
    st.eventoMod=st.eventoMod||{};
    st.eventoMod[atr]=(st.eventoMod[atr]||1)*mult;
    st.lesao={nome:String(lesaoBruta.regiao||"Lesão").slice(0,40),atributo:atr,mult,
      permanente:!!lesaoBruta.permanente,desdeLuta:st.fightNo,duracao:tipo.duracao};
  }else{
    /* dilema comum (ou lesão bloqueada por já ter uma ativa): atributo/efeito
       seguem vindo da IA, travados no lim() de sempre — o bypass acima é só
       pra tabela de lesão, nunca pra isto. */
    atr=ATTRS_LESAO.includes(j&&j.atributo)?j.atributo:null;
    mult=lim(j&&j.efeito,.90,1.10,1);
    if(atr&&me[atr]!=null){st.eventoMod=st.eventoMod||{};
      st.eventoMod[atr]=(st.eventoMod[atr]||1)*mult;}
  }

  /* evitouLesao: risco físico evitado por escolha prudente. O custo em fama
     já sai de dSeg/dFan (o prompt pede pra IA não tratar recusa como
     neutra); o custo em ranking é mecânica nova — dilema nunca tocou
     st.standing antes de hoje — e por isso fica fixo aqui, não depende da
     IA lembrar de aplicar um número certo. */
  if(j&&j.evitouLesao){st.standing=Math.max(.05,st.standing-.06);st.evitouAlgumaVez=true;}

  const antes=st.followers;
  st.followers=Math.max(120,Math.round(st.followers*(1+dSeg)));
  st.fan=Math.max(0,Math.min(10,st.fan+dFan));
  const dif=st.followers-antes;
  /* aqui a direção é direta: os números já vieram limitados pelo lim() */
  const peso=(dSeg*2.2)+(dFan*0.55);
  (peso>0.12?SOM.bom:peso<-0.12?SOM.ruim:SOM.evento)();
  /* Filtra ANTES do slice: cortar frase por regex depois de truncar em 500
     poderia deixar uma frase pela metade sem o ponto final que a divide. */
  const bruto=(j&&j.desfecho)?semResultadoDeLuta(String(j.desfecho)).slice(0,500):"";
  const desfecho=bruto||fraseFallback();
  box.innerHTML=`<div class="dil-t">${String(d.titulo||"E agora?").slice(0,60)}</div>
    <div class="dil-c">${String(d.cena).slice(0,400)}</div>
    <div class="dil-r">"${txt.replace(/</g,"&lt;")}"</div>
    <div class="dil-o">${desfecho}</div>
    <div class="dil-fx">
      ${dif!==0?`<span class="delta ${dif>=0?"up":"down"}">${dif>=0?"+":"−"}${fmtNum(Math.abs(dif))} seguidores</span>`:""}
      ${Math.abs(dFan)>=0.05?`<span class="delta ${dFan>=0?"up":"down"}">${dFan>=0?"+":"−"}${Math.abs(dFan).toFixed(1)} de fã</span>`:""}
      ${atr?`<span class="hint">${ROTULO_ATTR[atr]||atr} <span class="${mult>=1?"g":"dn"}">${
        mult>=1?"+":""}${Math.round((mult-1)*100)}%</span></span>`:""}</div>`;
  st.dilemas=(st.dilemas||0)+1;
  if(box.__done)box.__done();
}




/* =========================================================================
   SOM — sintetizado na Web Audio API, sem nenhum arquivo.
   Motivos: o jogo continua sendo um HTML só, não depende de licença de
   sample, não tem download nem espera. E o navegador BLOQUEIA áudio antes do
   primeiro clique do usuário, então o contexto só nasce quando ele interage.
   ========================================================================= */
let AC=null, MASTER=null, BUS=null, MUSICA=null, AMB=null;
let mudo=(()=>{try{return localStorage.getItem("mudo")==="1";}catch(e){return false;}})();

/* Música e efeitos em barramentos separados porque na prática a pessoa quer
   abaixar a trilha e manter o soco. O padrão dos dois é 1.00, que é o nível em
   que o jogo foi equilibrado — quem não abrir o painel ouve exatamente o que
   ouvia antes. Number() e não parseFloat(): o testar.js roda num sandbox
   enxuto e parseFloat não está lá. */
const lerVol=k=>{try{
    const b=localStorage.getItem(k); if(b===null)return 1;
    const v=Number(b); return isNaN(v)?1:clamp(v,0,1);
  }catch(e){return 1;}};
let volMusica=lerVol("vol_musica"), volEfeitos=lerVol("vol_efeitos");

/* Dois barramentos sob o mesmo master: BUS carrega os efeitos, MUSICA carrega a
   trilha. O mudo continua sendo ponto único — com ele ligado o contexto nem
   nasce. */
function ctx(){
  if(mudo)return null;
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      MASTER=AC.createGain(); MASTER.gain.value=.9;        MASTER.connect(AC.destination);
      BUS=AC.createGain();    BUS.gain.value=volEfeitos;   BUS.connect(MASTER);
      MUSICA=AC.createGain(); MUSICA.gain.value=volMusica; MUSICA.connect(MASTER);
    }catch(e){AC=null;return null;}
  }
  if(AC.state==="suspended")AC.resume();
  return AC;
}
function env(g,t,pico,dur,atq=0.006){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(pico,t+atq);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
}
function ruido(dur,decai=true){
  const a=ctx();if(!a)return null;
  const n=Math.floor(a.sampleRate*dur);
  const buf=a.createBuffer(1,n,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(decai?(1-i/n):1);
  const s=a.createBufferSource();s.buffer=buf;return s;
}

/* ---------------- TRILHA ----------------
   Bordão grave contínuo: fundamental em Lá0 (55 Hz), a quinta acima e uma
   oitava, todas levemente desafinadas entre si. A desafinação é o que produz o
   batimento lento que faz o som "respirar" em vez de zumbir parado.
   Um filtro passa-baixa varre devagar por cima. Volume baixo de propósito:
   é cama, não música. */
function trilhaLiga(){
  const a=ctx(); if(!a||AMB) return;
  const g=a.createGain(); g.gain.value=0;
  const lp=a.createBiquadFilter(); lp.type="lowpass";
  lp.frequency.value=220; lp.Q.value=.7;
  lp.connect(g); g.connect(MUSICA);

  const vozes=[[55,0],[55.35,-0.4],[82.5,-6],[110,-9]];
  const osc=vozes.map(([f,db])=>{
    const o=a.createOscillator(), vg=a.createGain();
    o.type="sine"; o.frequency.value=f;
    vg.gain.value=Math.pow(10,db/20);
    o.connect(vg).connect(lp); o.start();
    return o;
  });
  /* sopro de sala: ruído filtrado bem embaixo, dá corpo sem virar chiado */
  const s=ruido(8,false);
  let sN=null;
  if(s){ s.loop=true;
    const bp=a.createBiquadFilter(); bp.type="lowpass"; bp.frequency.value=140;
    const sg=a.createGain(); sg.gain.value=.045;
    s.connect(bp).connect(sg).connect(lp); s.start(); sN=s; }

  /* varredura lenta do filtro: 40 s de ida e volta */
  const lfo=a.createOscillator(), lfoG=a.createGain();
  lfo.type="sine"; lfo.frequency.value=1/40;
  lfoG.gain.value=90; lfo.connect(lfoG).connect(lp.frequency); lfo.start();

  g.gain.setValueAtTime(0.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.16,a.currentTime+3);   // entra devagar
  AMB={g,osc,lfo,noise:sN};
}
function trilhaDesliga(){
  if(!AMB||!AC)return;
  const t=AC.currentTime;
  AMB.g.gain.cancelScheduledValues(t);
  AMB.g.gain.setValueAtTime(Math.max(.0001,AMB.g.gain.value),t);
  AMB.g.gain.exponentialRampToValueAtTime(.0001,t+.8);
  const {osc,lfo,noise}=AMB;
  setTimeout(()=>{try{osc.forEach(o=>o.stop());lfo.stop();if(noise)noise.stop();}catch(e){}},900);
  AMB=null;
}

/* ---------------- EFEITOS ----------------
   Tudo transposto uma oitava e meia para baixo do que era antes, e com filtro
   passa-baixa no lugar de onda crua. Agudo corta a trilha e cansa. */
