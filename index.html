        <div class="cint"><span class="b ${st.title?"sim":"nao"}">${st.title?(st.cinturaoInterino?"Interino":"Campeão"):"Não"}</span>
          ${st.title&&!st.cinturaoInterino?`<small>${st.defesas||0} defesa${(st.defesas||0)===1?"":"s"}</small>`:""}
          ${st.cinturaoInterino?`<small>unificação na próxima luta</small>`:""}</div>
        ${passo?`<div class="passo-label">Caminho até o cinturão</div><div class="passo">${passo}</div>`:""}
      </div>
      ${RANKING&&RANKING.campeao?`<div class="ficha-sec">
        <h4>Ranking</h4>
        <div class="rank-pico">Campeão: <b>${(st.title&&!st.cinturaoInterino)?me.name:(st.exCampeao?st.exCampeao.name:RANKING.campeao.name)}</b></div>
        ${st.cinturaoInterino?`<div class="rank-pico">Interino: <b>${me.name}</b></div>`:""}
      </div>`:""}
      ${rk?`<div class="ficha-sec">

        </div>

      </div>`:""}
      <div class="ficha-sec ficha-sair">

    </div>
    <div class="ficha-tape">
      ${st.lesao?`<div class="ficha-sec ficha-lesao">
        <h4>Lesão</h4>

          <div class="lesao-mag">${ROTULO_ATTR[st.lesao.atributo]||st.lesao.atributo}

      <div class="ficha-sec">

  </div>`;
  /* NÃO calcula disabled aqui dentro do innerHTML: renderFicha() só roda de
     novo quando alguém chama ela (fim de luta, aplicarCamp(), etc) — se
     ficasse travado no valor de playing/escolhaAberta/dilemaAberto DESTE
     instante, o botão nasceria "habilitado" no meio de uma luta que só
     começou DEPOIS da última renderFicha() e ficaria errado até a
     próxima chamada (achado testando: renderFicha() roda ANTES de
     iniciarTelaLuta() setar playing=true em lutar()). Quem decide
     visualmente é o CSS via html[data-estado-carreira] (ver @media no
     fim do legado.css, mesmo mecanismo de #next) — sempre correto
     porque atualizarEstadoCarreira() já roda em toda transição real.
     Botão vive dentro do innerHTML de cima (a ficha inteira é uma string
     só) — liga o handler de verdade depois, mesmo padrão de #nomeIn em
     screenCriador(). Trava dupla: CSS acima (visual, sempre em dia) E o
     guard em abrirConfirmarAposentadoria() (funcional, mesmo raciocínio
     de next.disabled em atualizarControles()) — pra não abrir o
     encerramento em cima de uma narração ou escolha em andamento mesmo
     no instante entre a luta começar e a próxima renderFicha(). */
  const btnApos=document.getElementById("btnAposentar");
  if(btnApos)btnApos.onclick=abrirConfirmarAposentadoria;
  renderBarraHub();
}
/* Aposentadoria voluntária: mesmo destino de fim de carreira natural
   (screenReport() — não hardcoda "22 lutas" em lugar nenhum, lê st.wins/
   st.losses/grade() do estado atual, então funciona em qualquer fightNo).
   Confirmação em painel próprio, não confirm() nativo — o jogo inteiro
   evita chrome de navegador (mesma razão do cfg-overlay/painel-momentos
   já existirem). Sem fechar em toque fora, de propósito: é permanente,
   merece escolha explícita entre Cancelar e Aposentar-se, não um toque
   sem querer no fundo. */
function abrirConfirmarAposentadoria(){
  if(playing||escolhaAberta||dilemaAberto)return;
  const p=document.getElementById("painelAposentar");
  if(!p)return;
  p.innerHTML="";
  const box=el("div","painel-n confirma-sair");
  box.appendChild(el("h2","painel-titulo","Aposentar-se agora?"));
  box.appendChild(el("p","confirma-txt",
    `A carreira de <b>${me.name}</b> termina aqui, com ${st.wins}-${st.losses} no cartel.
     Não dá pra desfazer. Você vai direto pro encerramento, igual ao fim das 22 lutas.`));
  const row=el("div","confirma-acoes");
  const cancelar=el("button","botao botao-sec","Cancelar");
  cancelar.onclick=()=>{SOM.toque();fecharConfirmarAposentadoria();};
  const confirmar=el("button","botao","Aposentar-se");
  confirmar.onclick=confirmarAposentadoria;
  row.append(cancelar,confirmar);
  box.appendChild(row);
  p.appendChild(box);
  p.style.display="flex";
}
function fecharConfirmarAposentadoria(){
  const p=document.getElementById("painelAposentar");
  if(p){p.style.display="none";p.innerHTML="";}
}
function confirmarAposentadoria(){
  SOM.toque();
  /* Mesma limpeza que o fim natural de carreira já faz (ver o bloco
     fightNo>=TOTAL_FIGHTS em finishFight()): sem isso, um autoTimer
     pendente do modo automático dispararia nextFight() por cima da tela
     de encerramento que screenReport() acabou de montar. */
  auto=false;clearTimeout(autoTimer);
  fecharConfirmarAposentadoria();
  screenReport();
}

/* =========================================================================
   ESCOLHAS DE CARREIRA
   O jogo pedia 4 decisões no draft e depois só "próxima luta" 22 vezes.
   Agora cada luta tem duas: contra quem lutar e como se preparar.
   ========================================================================= */
/* Treino agora é PERMANENTE. Isso obriga teto e retorno decrescente: sem eles,
   22 lutas de +10% viram +700% e a calibração toda vai embora.

   Cada atributo tem um multiplicador acumulado que começa em 1.00 e satura em
   TETO_TREINO. O ganho de cada camp é proporcional ao que FALTA para o teto,
   então os primeiros treinos rendem muito e os últimos quase nada — que é como
   evolução de atleta funciona de verdade.

   Baixado de 1.26 pra 1.18 nesta leva (decisão registrada em LEIA-ME.md,
   seção "Progressão do lutador"): medido que a alavanca do cinturão fácil
   demais era a ALTURA do teto, não o formato da curva (cortar o 1º camp
   pela metade não mudava o título em nada, 70,0%=70,0%; baixar o teto de
   1.26→1.18→1.12 tirava 9-10 pontos por passo). Efeito em vitórias
   remedido no teto novo — ver LEIA-ME. */
/* 1.18 -> 1.10 no balanço de 2026-09-28 (ver BUDGET_PCT). */
const TETO_TREINO=1.05;
const CAMPS=[
 {id:"boxe",nome:"Boxe",desc:"Semanas na luva, cabeça saindo da linha.",
  ganho:"defesa de golpes e volume",
  alvos:{strDef:1.00,slpm:0.55},
  contra:["Nocauteador","Pressão","Contragolpeador"]},
 {id:"wrestling",nome:"Wrestling",desc:"Camp inteiro no tatame, sprawl e levantada.",
  ganho:"defesa de queda e quedas",
  alvos:{tdDef:1.00,tdAvg:0.60},
  contra:["Wrestler","Finalizador","Antiqueda"]},
 {id:"jiujitsu",nome:"Jiu-jitsu",desc:"Guarda, raspagem e caça de pescoço.",
  ganho:"finalizações e defesa de queda",
  alvos:{subAvg:1.00,tdDef:0.45},
  contra:["Finalizador","Wrestler"]},
 {id:"fisico",nome:"Físico",desc:"Só condicionamento e força. Aguenta e machuca.",
  ganho:"queixo e poder",
  alvos:{durability:0.85,kdAvg:0.85},
  contra:["Queixo de ferro","Completo","Nocauteador"]},
];
/* Medidos nesta leva (item 4) — node testar.js dinheiro, 400 carreiras de
   bot, candidatos()/aplicarCamp()/simulateFight() reais. Meta: treinador
   melhor acessível entre a luta 6 e a 8 numa carreira mediana — bateu luta
   7 (mediana), 0/400 carreiras nunca alcançaram. Ver PENDENCIAS item 4. */
const RENDA_BASE=6000;
const CUSTO_TREINADOR=54000;
/* Trocado nesta leva seguinte: acelerar RITMO_TREINO media +0,05
   vitórias/22 (testado até 3x sem passar de +0,37) — a mesma curva de
   retorno decrescente do TETO_TREINO limitava qualquer multiplicador,
   comprar não mudava nada que se sentisse. Substituído por algo que o
   treino não toca: reduz o tempo de recuperação de lesão TEMPORÁRIA pela
   metade (não mexe em permanente — não tem "cura" pra acelerar ali).
   Medido (protocolo do LEIA-ME "Lesão": 300 carreiras, camp fixo mirando o
   atributo lesionado, lesão forçada na luta 6, mesmas seeds com/sem):
   baseline (duração 8) custa 1,07 vitórias/22 — bate com o 1,06 já
   documentado. Duração pela metade (4) recupera 0,37; duração num quarto
   (2) recupera 0,66. Fica em metade — visível na ficha (o "Cura em N
   lutas" desce mais rápido de verdade) sem zerar o custo da lesão, que é
   o ponto dela existir. Comparado com a outra ideia medida (reduzir a
   CHANCE da lesão acontecer, via rng próprio): a 50% de chance de evitar
   recupera 0,55/22, mesma ordem de grandeza — mas invisível quando "quase
   aconteceu" (nada pra mostrar), enquanto acelerar cura é um número que o
   jogador vê contar mais rápido. Escolhido por isso, não só pela medição. */
const REDUCAO_CURA_TREINADOR=0.5;
const ATTR_TREINAVEIS=["slpm","strDef","tdAvg","tdDef","subAvg","kdAvg","durability"];
const RITMO_TREINO=0.30;      // fração do que falta para o teto, por camp

function aplicarCamp(camp){
  st.campHist=st.campHist||{};
  st.campHist[camp.id]=(st.campHist[camp.id]||0)+1;
  st.treino=st.treino||{};
  for(const [k,peso] of Object.entries(camp.alvos)){
    const atual=st.treino[k]||1;
    const falta=TETO_TREINO-atual;
    st.treino[k]=atual+falta*RITMO_TREINO*peso;
  }
}
/* valor efetivo = base do draft × multiplicador de treino × modificadores de evento */
function statAtual(k){
  const base=(me.__base&&me.__base[k]!=null)?me.__base[k]:me[k];
  const t=(st.treino&&st.treino[k])||1;
  const ev=(st.eventoMod&&st.eventoMod[k])||1;
  return base*t*ev;
}
function lutadorEfetivo(){
  const f=Object.assign({},me);
  ATTR_TREINAVEIS.forEach(k=>{if(me[k]!=null)f[k]=statAtual(k);});
  if(f.strDef>.93)f.strDef=.93;
  if(f.tdDef>.95)f.tdDef=.95;
  return f;
}

/* Escalonamento aprovado nesta leva: base 0,65, +0,12 por recusa, teto
   0,95 — quanto mais vezes o jogador fica esperando elegível, mais fácil
   fica a próxima rolagem (frustração crescente, não sorteio isolado
   repetido pra sempre). Medido antes/depois (node testar.js espera,
   2.000 carreiras): efeito pequeno, e é isso mesmo — CHANCE_DISPUTA=.65
   já é alto sozinho, a mediana já era 0 luta extra ANTES do
   escalonamento (a maioria recebe na primeira rolagem elegível). Antes:
   p90=2, p95=4, p99=7, pior caso=10. Depois: p90=1, p95=4, p99=7, pior
   caso=11 (dentro do ruído de amostra, não piorou de verdade). O
   escalonamento só muda algo pra quem já teria 2+ recusas seguidas — uma
   fatia pequena da distribuição, porque a base já é generosa. Registrado
   honesto: pedido implementado, efeito real é modesto, não o tipo de
   mudança que se sente jogando. */
const CHANCE_DISPUTA=0.65;
const CHANCE_DISPUTA_INCREMENTO=0.12;
const CHANCE_DISPUTA_TETO=0.95;

/* Cinturão interino: quando a disputa pelo cinturão de verdade é concedida
   (tituloLiberado()==true, jogador ainda não é campeão de nada), o campeão
   nomeado (RANKING.campeao) pode estar indisponível — sorteio em holdRng,
   nunca em rng (mesmo motivo do sorteio acima). Se sair indisponível, a
   luta é pelo interino contra RANKING.desafiante (=RANKING.lista[1], o nº1
   da divisão), não pelo cinturão de verdade — RANKING.campeao não muda,
   é ausência, não derrota. Alvo do usuário: ~12% das CARREIRAS que chegam
   a uma disputa (não 12% por rolagem — uma carreira pode rolar de novo se
   perder a primeira disputa e for elegível outra vez, então o valor por
   carreira sai maior que o valor por rolagem). Medido (2026-09-05, 3.000
   carreiras por valor): .12 dá 10,4% no peso-leve (pool grande, poucas
   redisputas) e 13,5% no peso-pesado (pool menor, mais redisputa) — as
   duas divisões testadas ficam nos dois lados do alvo, sem precisar de
   valor por divisão. */
const CHANCE_CINTURAO_INTERINO=0.12;

/* Elegível (standing>.88 + streak 3) != disputa concedida. "Pode não vir"
   (lesão do campeão, política) é um sorteio em holdRng — nunca em rng, senão
   desloca a sequência e link de desafio antigo para de reproduzir a mesma
   carreira. Uma vez concedida fica concedida (st.disputaLiberada), não
   sorteia de novo a cada fight-decision. Defesa (st.title já true) não
   sorteia: é obrigatória, como no UFC real.

   st.disputaRecusas zera quando a elegibilidade cai (perdeu o streak ou o
   standing) — é frustração de UMA janela de espera, não uma dívida que
   atravessa a carreira inteira sem relação com a forma atual. */
function tituloLiberado(){
  if(st.title)return true;
  const elegivel=st.standing>.88&&st.streakW>=3;
  if(!elegivel){st.disputaRecusas=0;return false;}
  if(st.disputaLiberada)return true;
  const chance=Math.min(CHANCE_DISPUTA_TETO,
    CHANCE_DISPUTA+CHANCE_DISPUTA_INCREMENTO*(st.disputaRecusas||0));
  if(holdRng()<chance){st.disputaLiberada=true;return true;}
  st.disputaRecusas=(st.disputaRecusas||0)+1;
  st.maxDisputaRecusas=Math.max(st.maxDisputaRecusas||0,st.disputaRecusas);  // disputaRecusas zera quando a elegibilidade cai; isto não
  return false;
}

/* três candidatos: mais fraco, parelho e acima. A diferença não é só risco —
   é quanto o ranking anda. Ganhar de quem está acima vale muito mais.

   Campeão e desafiante nº1 (RANKING) nunca aparecem aqui — são reservados
   pra luta de título/defesa forçada abaixo. Sem essa reserva, standing alto
   deixa a faixa "duro" bem em cima do topo da escada, onde o campeão está:
   ele apareceria como luta comum antes da disputa, e a disputa de verdade
   viraria revanche. */
/* ---------- Modo Rival (Plano Pro, item 4) ----------
   Nome fictício, stats emprestados de um lutador real da divisão — mesma
   proteção de imagem que a ausência de retrato pros 1.527 reais (ver
   CLAUDE.md "Nada de rosto para os lutadores reais"): a IA vai dar VOZ a
   esse rival (coletiva/entrevista), e falas inventadas na boca de um
   atleta de verdade são o mesmo risco que retrato, só que em texto. Por
   isso o nome NUNCA é de um lutador real (pool próprio abaixo), e a
   bio emprestada (fights/era/titulos) é sanitizada — só os números de
   COMBATE (rating e os atributos treináveis) vêm do lutador real, pra
   manter a dificuldade justa no motor; o resto (quantas lutas teve, em
   que época, quantos títulos) seria história de uma pessoa de verdade
   contada como se fosse ficção, e isso continua sendo o problema que a
   regra de "sem retrato" já resolveu pro rosto. */
const RIVAL_PRIMEIRO_M=["Rafael","Thiago","Bruno","Igor","Cauê","Renan","Diego",
  "Vitor","Matheus","Gustavo","André","Felipe","Marcos","Leandro"];
const RIVAL_PRIMEIRO_F=["Camila","Larissa","Beatriz","Juliana","Fernanda","Priscila",
  "Vanessa","Aline","Débora","Renata","Patrícia","Gabriela","Carolina","Natália"];
const RIVAL_SOBRENOME=["Duarte","Farias","Cordeiro","Bastos","Teixeira","Amaral",
  "Pontes","Siqueira","Moraes","Cavalcante","Nogueira","Brandão","Falcão","Marinho"];
function nomeRival(nomesReais){
  const primeiros=(DIVISION||"").startsWith("w_")?RIVAL_PRIMEIRO_F:RIVAL_PRIMEIRO_M;
  let nome,tentativas=0;
  do{
    nome=primeiros[Math.floor(rivalRng()*primeiros.length)]+" "+
      RIVAL_SOBRENOME[Math.floor(rivalRng()*RIVAL_SOBRENOME.length)];
    tentativas++;
  }while(nomesReais.has(nome)&&tentativas<20); // some combinação bate um nome real — troca, não trava
  return nome;
}
/* Cedo na carreira (luta 3), reaparece a cada 4 lutas depois disso — pausa
   de vez quando o jogador já venceu ele uma vez (rivalidade "resolvida",
   não persegue pra sempre). Nunca durante luta de título/defesa (o motor
   já reserva essa luta pra uma coisa só, ver candidatos() acima).
   st.rivalAtivado (item 4, 2026-09-22): sem a escolha explícita em
   screenAtivarRival(), o rival NUNCA aparece — meuPro sozinho não basta
   mais (antes disso, todo Pro tinha rival automático e silencioso). */
function rivalDeveAparecer(){
  if(!meuPro||!st.rivalAtivado||st.tituloEstaLuta)return false;
  if(st.rival&&st.rival.historico.some(h=>h.ganhou))return false;
  const proximaLuta=fightNo+1;
  if(!st.rival)return proximaLuta===3;
  return proximaLuta>=3&&(proximaLuta-3)%4===0;
}
function gerarRival(){
  const reservados=new Set((RANKING&&RANKING.lista||[]).map(f=>f.name));
  const pool=LADDER.filter(f=>!reservados.has(f.name));
  const base=pool[Math.floor(rivalRng()*pool.length)]||LADDER[0];
  // nome do jogador (validado em screenAtivarRival(): não bate com
  // nenhum dos 1.527 reais, passou por CONTEUDO_INSEGURO) — nomeRival()
  // só entra como fallback se por algum motivo nada foi escolhido
  // (nunca deveria acontecer, rivalDeveAparecer() já exige rivalAtivado).
  const nome=st.rivalNomeEscolhido||nomeRival(new Set(LADDER.map(f=>f.name)));
  st.rival={
    nome,
    // stats de combate reais (mantém dificuldade justa), bio sanitizada
    // (nunca a carreira de verdade de quem emprestou os números)
    f:{...base,name:nome,fights:12+Math.floor(rivalRng()*16),era:null,
       titulos:{disputas:0,vitorias:0}},
    historico:[],
  };
}

function candidatos(){
  /* NÃO chama tituloLiberado() aqui. st.tituloEstaLuta já foi decidido em
     nextFight(), uma vez por luta, antes de existir tela ou pick automático.
     candidatos() só lê. Se o sorteio do holdRng morasse aqui, qualquer chamada
     futura a candidatos() fora de nextFight() (ou uma segunda chamada por
     engano) sortearia de novo e a chance efetiva de "a disputa vir" deixaria
     de ser CHANCE_DISPUTA por luta — passaria a depender de quantas vezes a
     função foi invocada. */
  if(st.tituloEstaLuta){
    /* A carta travada IGNORA `fought` de propósito — revanche de título é o
       caso NORMAL do UFC, não exceção. Perder pro campeão e voltar pra
       reconquistar, ou defender contra o mesmo desafiante nº1 mais de uma
       vez, é a história, não um furo. Isso já foi tentado com guard
       (`!fought.has(alvo.name)`) e quebrou: depois de qualquer disputa —
       vitória OU derrota — `lutar()` marca `fought.add(opp.name)`
       incondicional, então RANKING.campeao/desafiante ficam banidos de si
       mesmos pra sempre a partir da 1ª vez, e a reconquista caía no fallback
       comum contra um nome qualquer — o jogador ganhava o cinturão de
       alguém aleatório enquanto a ficha continuava nomeando o campeão de
       verdade. RANKING.campeao/desafiante continuam banidos das 3 BANDAS
       COMUNS (reservados, abaixo) — só este caminho travado passa por cima
       do `fought`. Repetir contra os dois nomeados é esperado e testado
       (`node testar.js interface`/`cinturao`, ver LEIA-ME "O passo para o
       cinturão" pela explicação completa); repetir contra qualquer outra
       pessoa continua sendo bug. */
    /* Defendendo, o alvo roda pelo RANKING.lista (rotação de contender —
       ver st.desafianteIdx em finishFight()); desafiando, é sempre o
       campeão nomeado, que não roda (só existe um campeão de verdade).
       Duas exceções, cinturão interino (ver CHANCE_CINTURAO_INTERINO):
       - desafiando com o campeão indisponível (tituloInterinoLuta): a
         disputa é pelo interino, contra RANKING.desafiante (nº1 da
         divisão), não contra o campeão que não apareceu.
       - já com o interino (st.cinturaoInterino): a próxima luta NÃO
         segue a rotação de contender — é a unificação, sempre contra
         RANKING.campeao, nomeado. Interino não defende antes de unificar
         (ver finishFight()): é incompleto até provar contra o de verdade. */
    let alvo;
    if(st.title&&st.cinturaoInterino) alvo=RANKING.campeao;
    else if(!st.title&&st.tituloInterinoLuta) alvo=RANKING.desafiante;
    else{
      const idx=Math.min(st.desafianteIdx||1,RANKING.lista.length-1);
      alvo=st.title?RANKING.lista[idx]:RANKING.campeao;
    }
    if(alvo)return[{f:alvo,ganho:st.title?.10:.15}];
  }
  const N=LADDER.length;
  /* Os 16 do RANKING.lista inteiro ficam de fora das 3 bandas comuns, não só
     campeão+desafiante — com rotação, qualquer um deles pode vir a ser o
     próximo desafiante trancado; medido antes de escrever (node testar.js
     divisoes): pior caso é peso-pesado lenda, 49-16=33 sobrando pras 22
     lutas, margem de 11. */
  const reservados=new Set((RANKING&&RANKING.lista||[]).map(f=>f.name));
  /* No topo do ranking não existe "acima": a faixa perigosa colapsava num
     único adversário repetido e virava a opção MAIS fácil. Recuamos o centro
     para que as três faixas sempre tenham gente de verdade. */
  /* Balanço 2026-09-28: as três faixas subiram na escada (eram -16..-7%,
     -3..+3% e +8..+20%) e o centro nunca fica abaixo de 25% da divisão:
     o fundo da tabela (quem quase não vence ninguém) não aparece mais, e
     perder não devolve o jogador pra uma fila de vitória fácil. Medido em
     node testar.js balanco (LEIA-ME "Balanço"). */
  const larg=0.30;
  /* Orçamento .70 (2026-09-28, mesmo dia): o lutador draftado nasce mais
     forte, então a escada subiu de novo pra manter ~50% de vitórias. Piso
     .25 -> .45 e faixas +16% (eram -6..+3%, +7..+13%, +18..+30%). Medido
     em node testar.js balanco (LEIA-ME "Balanço"). */
  const c=Math.floor((0.45+(1-larg-0.45)*Math.min(st.standing/(1-larg),1))*(N-1));
  const faixas=[[0.10,0.19,0.045],[0.23,0.29,0.075],[0.34,larg+0.16,0.125]];
  const out=[];
  for(const [lo,hi,ganho] of faixas){
    const a=Math.max(0,Math.min(N-1,c+Math.round(lo*N)));
    const b=Math.max(a,Math.min(N-1,c+Math.round(hi*N)));
    let esc=null;
    for(let t=0;t<60;t++){
      const cand=LADDER[a+Math.floor(rng()*(b-a+1))];
      if(cand&&!fought.has(cand.name)&&!reservados.has(cand.name)&&!out.some(o=>o.f.name===cand.name)){esc=cand;break;}
    }
    if(!esc){ // varre a faixa inteira antes de desistir
      for(let i=a;i<=b;i++){const cd=LADDER[i];
        if(cd&&!fought.has(cd.name)&&!reservados.has(cd.name)&&!out.some(o=>o.f.name===cd.name)){esc=cd;break;}}
    }
    /* Último recurso: o mais próximo da faixa que ainda não foi enfrentado.
       Antes isso devolvia LADDER[a] direto e, num pool apertado, devolvia alguém
       JÁ ENFRENTADO em silêncio — o modo lenda (49 lutadores no peso-pesado) fez
       isso aparecer, mas o buraco sempre esteve aqui. A varredura não consome
       rng, então link de desafio antigo continua reproduzindo a mesma carreira. */
    if(!esc)for(let r=1;r<N&&!esc;r++){
      for(const i of [a-r,b+r]){
        const cd=LADDER[i];
        if(cd&&!fought.has(cd.name)&&!reservados.has(cd.name)&&!out.some(o=>o.f.name===cd.name)){esc=cd;break;}
      }
    }
    /* só sobra se o pool for menor que a carreira, e aí a divisão nem é oferecida */
    if(!esc)esc=LADDER[Math.max(0,Math.min(N-1,a))];
    out.push({f:esc,ganho});
  }
  /* Modo Rival: 4ª carta, só Pro, só quando elegível (rivalDeveAparecer()).
     Nunca troca uma das 3 bandas comuns — soma, não substitui. Guard contra
     colisão de nome com uma das 3 já escolhidas (raro, mas o rival empresta
     stats de alguém do mesmo LADDER que as bandas comuns também sorteiam). */
  if(rivalDeveAparecer()){
    if(!st.rival)gerarRival();
    if(st.rival&&!out.some(o=>o.f.name===st.rival.f.name))
      out.push({f:st.rival.f,ganho:.09,rival:true});
  }
  return out;
}

/* Chance de o jogador vencer ESTE adversário, com os atributos de agora
   (draft × treino × evento): 24 lutas simuladas com semente própria
   (simulateFight), o rng da carreira não mexe. Balanço 2026-09-28: a escada
   de adversários ficou acima da posição no ranking, e nem st.standing nem
   a nota dos lutadores reais (rateAll, contra o mediano) previam a luta
   contra o lutador draftado; o rótulo da carta e a zebra passaram a sair
   daqui. Guardada por adversário e estado do jogador. */
let cacheChance=null;
function chanceContra(opp){
  if(!me||!opp)return .5;
  const chave=opp.name+"|"+fightNo+"|"+JSON.stringify(st.treino||{})+JSON.stringify(st.eventoMod||{});
  if(!cacheChance||cacheChance.base!==JSON.stringify([DIVISION,MODO,SEED]))cacheChance={base:JSON.stringify([DIVISION,MODO,SEED]),v:{}};
  if(chave in cacheChance.v)return cacheChance.v[chave];
  const eu=lutadorEfetivo();
  let w=0;
  for(let s=1;s<=24;s++)if(simulateFight(eu,opp,{seed:s*31+7}).winner===eu.name)w++;
  return cacheChance.v[chave]=w/24;
}
function dificuldade(opp){
  const p=chanceContra(opp);
  if(p>=.64)return{n:1,rot:"Acessível",pips:1};
  if(p>=.48)return{n:2,rot:"Parelho",pips:2};
  if(p>=.34)return{n:3,rot:"Duro",pips:3};
  return{n:4,rot:"Perigoso",pips:4};
}
function bioLutador(f){
  const t=f.titulos||{disputas:0,vitorias:0};
  const linhas=[`<b>${f.fights}</b> lutas`+(f.era?` · ${f.era[0]}-${f.era[1]}`:"")];
  if(t.vitorias>0)linhas.push(`<b>${t.vitorias}</b> ${t.vitorias>1?"vitórias":"vitória"} em luta de cinturão`);
  else if(t.disputas>0)linhas.push(`disputou o cinturão <b>${t.disputas}</b>x, nunca venceu`);
  if(f.destaque)linhas.push(`${f.destaque.eixo} no <b>${Math.round(f.destaque.pct*100)}º</b> percentil`);
  return linhas.join("<br>");
}

function telaAdversario(guardadas){
  const box=document.getElementById("escolha");
  box.style.display="";
  /* Revamp fase 5: candidatos() consome rng, então roda UMA vez por luta.
     Voltar do camp e reabrir a noite passam a oferta guardada. A oferta
     sorteada vai pro save (PENDENTE "oferta"): recarregar, comprar na
     loja ou sair pro menu com ela aberta reabre as MESMAS cartas. */
  const opts=guardadas||candidatos();
  ofertaAtual=opts;
  /* Modo Rival: anúncio de 1ª aparição (item 4) — sem isto, o rival só
     se distingue por um selo pequeno na carta, fácil de nunca notar
     (achado jogando). Uma vez só por carreira (st.rivalAnunciado). */
  const rivalNovo=!guardadas&&opts.find(o=>o.rival)&&!st.rivalAnunciado;
  if(rivalNovo)st.rivalAnunciado=true;
  if(!guardadas){
    PENDENTE={tipo:"oferta",opts:opts.map(o=>({nome:o.f.name,ganho:o.ganho,rival:!!o.rival}))};

  box.innerHTML=`${rivalNovo?`<div class="rival-anuncio">Novo rival<span class="sub">"${st.rival.nome}" entra na sua carreira. É a primeira luta entre vocês.</span></div>`:""}
    <div class="esc-hd">Escolha o adversário</div>
    <div class="opps" id="opps"></div>`;
  const g=document.getElementById("opps");
  /* Fase 6 (2026-09-16): dificuldade vira faixa colorida no topo do card
     (protagonista) em vez de 4 quadradinhos de 9px cuidando sozinhos da
     decisão mais importante que o jogador toma fora da luta — os pips
     continuam, só encolhem pra confirmação secundária dentro da faixa.
     "+N" de ranking ganha rótulo ("se vencer") — é a aposta, não um
     número solto. E o próprio jogador entra no card ("SEU NOME vs
     ADVERSÁRIO") — é isso que faz a tela parecer anúncio de confronto
     em vez de grade de botão. Nenhum dado novo: mesma dificuldade(),
     bioLutador(), o.ganho de sempre — só reorganizado. */
  opts.forEach(o=>{
    const d=dificuldade(o.f);
    /* Modo Rival: mesma estrutura de card, só acrescenta o selo "RIVAL" e
       troca a bio pelo histórico entre os dois — não é um lutador comum,
       é continuidade de uma rivalidade que atravessa a carreira. */
    const hist=o.rival&&st.rival.historico;
    const bioOuHistorico=o.rival
      ?(hist.length?`${hist.length+1}ª vez que se enfrentam · ${hist[hist.length-1].ganhou?"você venceu":"ele venceu"} a última, por ${hist[hist.length-1].metodo.toLowerCase()}`
        :"1ª vez que se enfrentam")
      :bioLutador(o.f);
    const b=el("button","opp d"+d.n+(o.rival?" rival":""),`
      ${o.rival?`<span class="rival-selo">RIVAL</span>`:""}
      <span class="dbanda"><b>${d.rot}</b><span class="pips">${[1,2,3,4].map(i=>`<i class="${i<=d.pips?"on":""}"></i>`).join("")}</span></span>
      <span class="vs"><span class="quem">${me.name}</span><span class="vslabel">vs</span></span>
      <span class="nm">${o.f.name}</span>
      ${o.f.arquetipo?`<span class="arq">${o.f.arquetipo}</span>`:""}
      <span class="bio">${bioOuHistorico}</span>
      ${compararOferta(o.f)}
      <span class="stake"><span>se vencer</span><b>+${Math.round(o.ganho*100)} ranking</b></span>`);
    b.onclick=()=>{SOM.toque();telaCamp(o);};
    g.appendChild(b);
  });
  SOM.carta();
  mostrarNoite("oferta");
  /* primeira noite de luta: o tutorial da luta abre por cima (uma vez por aparelho) */
  if(!guardadas)abrirTutorialSeNovo("luta");
}
/* Comparação na carta da oferta (revamp fase 5): só dado público de
   ficha (alcance, base, lutas no UFC). Atributo de luta do adversário
   continua escondido de propósito (ver COUNTER_ATTR na escolha da luta). */
function compararOferta(f){
  const alc=a=>a!=null?Math.round(a)+String.fromCharCode(34):"-";
  const linha=(rot,eu,ele)=>`<span class="comp-linha"><span class="comp-eu">${eu}</span><span class="comp-rot">${rot}</span><span class="comp-ele">${ele}</span></span>`;
  return `<span class="opp-comp">${linha("Alcance",alc(me.reach),alc(f.reach))}${
    me.stance&&f.stance?linha("Base",me.stance,f.stance):""}${linha("Lutas",fightNo,f.fights!=null?f.fights:"-")}</span>`;
}

function telaCamp(escolhido){

  const box=document.getElementById("escolha");
  box.innerHTML=`<div class="esc-hd">Camp pra ${escolhido.f.name}</div>

      Prepare o que precisa.</div>
    <div class="camps" id="camps"></div>`;
  const g=document.getElementById("camps");
  CAMPS.forEach(c=>{
    const vezes=(st.campHist&&st.campHist[c.id])||0;
    /* Fase 6 (2026-09-16): a barra de 5px + rótulo categórico ("rende
       muito"/"quase no teto") escondia a magnitude atrás de um
       adjetivo — o jogador não tinha como ver que o 16º camp no mesmo
       eixo rende ~0,03% contra ~5,4% do 1º. "restante" (fração 0-1 até
       o teto) já existia; "ganhoPct" é novo, só de exibição — mesma
       conta de aplicarCamp() (falta×RITMO_TREINO×peso por eixo,
       mesma média por eixo que "restante" já fazia), sem chamar
       aplicarCamp() nem gravar em st.treino. Reaproveita pctBar/pctClass
       do draft (mesma barra, mesmas 5 cores) — dado diferente, mesma
       linguagem visual. */
    const alvos=Object.keys(c.alvos);
    let restante=0,ganhoPct=0;
    alvos.forEach(k=>{
      const at=(st.treino&&st.treino[k])||1;
      const falta=TETO_TREINO-at;
      restante+=falta/(TETO_TREINO-1);
      ganhoPct+=falta*RITMO_TREINO*c.alvos[k]*100;
    });
    restante/=alvos.length; ganhoPct/=alvos.length;
    const barra=`<span class="pctwrap ${pctClass(restante)}">
        <span class="pctbar"><i style="width:${Math.max(2,Math.round(restante*100))}%"></i></span>
        <span class="pctnum">+${ganhoPct.toFixed(1)}%</span></span>
      <span class="camp-cap">ganho neste camp${vezes?` · feito ${vezes}x`:""}</span>`;
    const b=el("button","camp",`<span class="t">${c.nome}</span>
      <span class="d">${c.desc}</span>
      <span class="g">${c.ganho}</span>
      ${barra}`);
    b.onclick=()=>{SOM.toque();box.style.display="none";box.innerHTML="";telaColetiva(escolhido,c);};
    g.appendChild(b);
  });
  SOM.carta();
  mostrarNoite("camp");
}

/* ---------- Plano Pro: coletiva (antes da luta) e entrevista (depois) ----------
   Reta final (2026-09-28), pedido do dono: "coletiva e entrevistas estão
   sem graça, não ocorre nada demais e sempre estão surgindo perguntas
   genéricas". Antes, a abertura da coletiva saía de 6 frases fixas (a
   mesma pro mesmo adversário) e a pergunta da entrevista de 2 moldes por
   tipo de fato. Agora a CENA (o que acontece e a pergunta do repórter) é
   da IA, com tema forçado por carreira (cartela sem reposição, mesma lição
   do evento: forçar bate sugerir) e as cenas recentes no prompt pra não
   repetir. Sem IA (grátis, falha, pausa) a cena sai dos moldes locais, que
   também variam por tema e citam fato da luta.
   Layout do mapa do dono: o lutador do jogador à esquerda, quem pergunta à
   direita (a imprensa, com foto do lugar: lutador real nunca tem retrato,
   é direito de imagem), a conversa no meio (a fala da IA aponta pra ela, a
   resposta do jogador aponta pra ele) e o que aconteceu embaixo. */

/* Hash estável (não-rng): escolhe variante, repórter e cartela sem consumir
   nenhum gerador da carreira, senão o link de desafio e o save deixariam de
   reproduzir a mesma carreira pra quem abre sem ser Pro. */
function hashEstavel(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
const semTag=s=>String(s==null?"":s).replace(/</g,"&lt;");
/* corta no fim de frase mais próximo do limite, nunca no meio da palavra */
function cortarFrase(s,n){
  s=String(s||"").trim();
  if(s.length<=n)return s;
  const c=s.slice(0,n),i=Math.max(c.lastIndexOf(". "),c.lastIndexOf("? "),c.lastIndexOf("! "));
  return i>n*.4?c.slice(0,i+1):c.replace(/\s+\S*$/,"")+".";
}

/* Repórteres e veículos inventados: nunca um jornalista real. A IA recebe o
   nome pronto e o prompt proíbe inventar outro. Narrativa (2026-10-01):
   cada repórter tem linha editorial fixa (o jeito de perguntar) e veículo
   fixo, e é escalado pelas situações que combinam com a linha dele. */
const REPORTERES=["Lia Monteverde","Otávio Paranhos","Débora Venturini","Caio Serrat","Bianca Tavora",
  "Hugo Lessa","Renata Brum","Tiago Arantes","Marta Quintela","Ícaro Vilhena","Sônia Barreto","Lucas Amaral Pinho"];
const VEICULOS=["Portal Guarda Alta","Rádio Três Rounds","TV Octógono","Revista Mão Pesada",
  "Canal Chão e Pancada","Jornal do Cinturão"];
const LINHA_EDITORIAL={
  "Lia Monteverde":["tática: quer entender o plano e a técnica",["estilo","camp","plano","momento","numeros","finalizacao"]],
  "Otávio Paranhos":["polêmica: cobra, provoca e não aceita resposta pronta",["provocacao","equipe","criticas","fala-adversario","atraso"]],
  "Débora Venturini":["bastidores: equipe, família e rotina",["familia","corner","estreia","ex-parceiro","dedicatoria"]],
  "Caio Serrat":["números: cartel, sequência e estatística",["cartel","sequencia","numeros","juizes","favorito"]],
  "Bianca Tavora":["trajetória: liga a luta de hoje à carreira inteira",["carreira","prova","rival","cinturao","estreia"]],
  "Hugo Lessa":["humor seco: pergunta com ironia, sem ofender",["sala","pesagem","video","elogio","atraso"]],
  "Renata Brum":["direta: pergunta curta, sem rodeio",["encarada","provocacao","cinturao","adversario"]],
  "Tiago Arantes":["torcida e repercussão: o que a arena e as redes estão dizendo",["torcida","video","criticas"]],
  "Marta Quintela":["veterana: cobra coerência entre o que ele diz e o que faz",["prova","criticas","juizes","cartel","ex-campeao"]],
  "Ícaro Vilhena":["curioso: pergunta o que ninguém pergunta, de um jeito inesperado",["ex-campeao","elogio","momento","finalizacao","ex-parceiro"]],
  "Sônia Barreto":["negócios: bolsa, contrato e o próximo passo na organização",["bolsa","favorito","carreira"]],
  "Lucas Amaral Pinho":["saúde: corpo, peso e recuperação",["lesao","pesagem","corpo"]],
};
function narrativaDa(){
  st.narrativa=st.narrativa||{};
  const n=st.narrativa;
  n.cartela=n.cartela||{};n.situacoes=n.situacoes||{};n.estruturas=n.estruturas||{};n.reporter=n.reporter||{};
  n.passado=n.passado||{};n.fatos=n.fatos||[];
  return n;
}
/* o mesmo repórter não faz duas cenas seguidas do mesmo tipo */
function reporterDaCena(tipo,sitId=null){
  const n=narrativaDa(),ultimo=n.reporter[tipo];
  const afins=tipo==="entrevista"?(REPORTERES_DA_PAUTA[sitId]||[]):REPORTERES.filter(r=>sitId&&LINHA_EDITORIAL[r][1].includes(sitId));
  let cands=afins.filter(r=>r!==ultimo);
  if(!cands.length)cands=REPORTERES.filter(r=>r!==ultimo);
  const nome=cands[hashEstavel(`${SEED}:${fightNo}:${tipo}`)%cands.length];
  n.reporter[tipo]=nome;
  return{nome,veiculo:VEICULOS[REPORTERES.indexOf(nome)%VEICULOS.length],linha:LINHA_EDITORIAL[nome][0]};
}
/* =========================================================================
   NARRATIVA DAS CENAS (2026-10-01, pedido do dono: "coletivas e entrevistas
   repetitivas"). Medido antes (suíte diversidade): 10 temas e 10 ângulos
   girando, a pergunta sempre nas mesmas formas e o exemplo fixo do prompt
   virando cópia. Agora cada cena é uma DUPLA: a situação diz o que
   acontece, a estrutura diz a forma da pergunta, e cada situação só aceita
   as estruturas que combinam com ela. O jogo escolhe a dupla e manda pra
   IA; o molde local usa a mesma dupla.
   ========================================================================= */
const ESTRUTURAS={
  dado:"parte de um dado concreto que veio nos dados e pede uma resposta direta",
  comparacao:"compara com a luta anterior dele, que vem nos dados",
  escolha:"oferece duas opções concretas e pede que ele escolha uma",
  hipotese:"propõe uma hipótese (e se...) ligada à situação",
  terceiro:"parte do que outra pessoa fez ou disse no evento e pede a resposta dele",
  pessoa:"pergunta sobre uma pessoa: treinador, equipe, família ou o próprio adversário",
  bastidor:"pergunta sobre a preparação ou a rotina fora do octógono",
  direta:"pergunta curta e incômoda, de responder com sim ou não",
};
/* luta já registrada da carreira (atras=0 é a última): fato real do
   registro, nunca inventado */
function lutaAnterior(atras=0){
  const reg=st.registro||[],r=reg[reg.length-1-atras];
  if(!r)return null;
  return{adv:r.adv,txt:descreverResultado({venceu:r.venceu,metodo:r.metodo,round:r.round,cartoes:r.cartoes},r.adv)};
}
/* último encontro com este adversário, do registro (null se nunca lutaram) */
function reencontroCom(nome,atras=0){
  const reg=(st.registro||[]).slice(0,Math.max(0,(st.registro||[]).length-atras));
  const r=reg.filter(x=>x.adv===nome).pop();
  return r?{txt:descreverResultado({venceu:r.venceu,metodo:r.metodo,round:r.round,cartoes:r.cartoes},r.adv)}:null;
}
/* Dossiê da carreira: fatos reais e curtos (últimas 3 lutas e sequência).
   Só vai pra IA quando a cena foi escolhida pra olhar pro passado (fio
   narrativo ou forma "comparação"): sem ele, a IA não tem do que lembrar e
   não força referência ao passado. */
function dossieCarreira(atras=0){
  const reg=(st.registro||[]).slice(0,Math.max(0,(st.registro||[]).length-atras)).slice(-3).reverse();
  if(!reg.length)return null;
  const partes=[`últimas lutas, da mais recente: ${reg.map(r=>descreverResultado({venceu:r.venceu,metodo:r.metodo,round:r.round,cartoes:r.cartoes},r.adv)).join("; ")}`];
  if(st.streakW>=2)partes.push(`${st.streakW} vitórias seguidas`);
  else if(st.streakL>=2)partes.push(`${st.streakL} derrotas seguidas`);
  return cortarFrase(partes.join(". "),420);
}
function ctxColetiva(opp,camp,escolhido){
  const hist=escolhido&&escolhido.rival&&st.rival&&st.rival.historico&&st.rival.historico.length?st.rival.historico:null;
  const d=dificuldade(opp).n;
  return{opp:opp.name,estilo:`estilo ${(opp.arquetipo||"completo").toLowerCase()}`,rec:`${st.wins}-${st.losses}`,
    estreia:st.wins+st.losses===0,streakW:st.streakW||0,streakL:st.streakL||0,camp:String(camp&&camp.nome||"treino").toLowerCase(),
    titulo:!!st.tituloEstaLuta,lesao:!!st.lesao,rival:hist?hist[hist.length-1]:null,anterior:lutaAnterior(0),
    reencontro:hist?null:reencontroCom(opp.name,0),fav:d===1?"voce":d>=3?"ele":null};
}
const SITUACOES_COLETIVA=[

const temaDaSituacao=(sit,c)=>typeof sit.tema==="function"?sit.tema(c):sit.tema;
/* Escolhe a dupla situação × estrutura. Situação com condição (cinturão,
   rival, lesão, sequência, estreia, cartões, finalização) entra com
   prioridade quando vale e não saiu nas últimas 3 cenas do tipo; as outras
   vêm de uma cartela sem reposição, que a memória entre carreiras
   (localStorage, só de apoio: some com o navegador e nunca é histórico da
   conta) reordena pra quem saiu há pouco ficar pro fim. A estrutura sai das
   que combinam com a situação, a usada há mais tempo primeiro.
   Gerador local e descartável: nada aqui usa os 8 geradores da carreira. */
const MEM_SITUACOES={coletiva:"memSituacoesColetiva",entrevista:"memSituacoesEntrevista"};
function escolherCena(tipo,c){
  /* só a coletiva usa a dupla; a entrevista usa a pauta (escolherPauta) */
  const lista=SITUACOES_COLETIVA,n=narrativaDa();
  const daCartela=lista.filter(s=>!s.prioridade),mem=Math.round(daCartela.length*.6);
  const recentes=n.situacoes[tipo]||[],h=hashEstavel(`${SEED}:${fightNo}:${tipo}:cena`);
  /* a cena anterior deste tipo olhou pro passado: esta não olha (sem fio
     de passado e sem comparação). Ninguém força lembrança em toda cena. */
  const olhou=!!n.passado[tipo];
  const especiais=lista.filter(s=>s.prioridade&&s.cond(c)&&!recentes.slice(-3).includes(s.id)&&!(olhou&&s.passado));
  let sit=especiais.length&&h%100<40?especiais[h%especiais.length]:null;
  for(let volta=0;volta<2&&!sit;volta++){
    if(!n.cartela[tipo]||!n.cartela[tipo].length)
      n.cartela[tipo]=cartelaComMemoria(daCartela.map(s=>s.id),mulberry32(hashEstavel(`${SEED}:${tipo}:${fightNo}:cartela`)),MEM_SITUACOES[tipo],mem);
    const adiadas=[];
    while(n.cartela[tipo].length&&!sit){
      const id=n.cartela[tipo].pop(),cand=daCartela.find(s=>s.id===id);
      if(!cand)continue;
      /* com condição que não vale agora: volta pro fundo da cartela */
      if(cand.cond&&!cand.cond(c)){adiadas.push(id);continue;}
      sit=cand;
    }
    n.cartela[tipo].unshift(...adiadas);
  }
  if(!sit)sit=daCartela.filter(s=>!s.cond||s.cond(c))[h%daCartela.filter(s=>!s.cond||s.cond(c)).length];
  const usadas=n.estruturas[tipo]||[];
  const valem=Object.keys(sit.est).filter(e=>e!=="comparacao"||c.anterior);
  const opcoes=valem.filter(e=>!(olhou&&e==="comparacao")).length?valem.filter(e=>!(olhou&&e==="comparacao")):valem;
  opcoes.sort((a,b)=>usadas.lastIndexOf(a)-usadas.lastIndexOf(b)||hashEstavel(h+a)%7-hashEstavel(h+b)%7);
  const est=opcoes[0];
  n.situacoes[tipo]=[...recentes,sit.id].slice(-8);
  n.estruturas[tipo]=[...usadas,est].slice(-8);
  n.passado[tipo]=!!(sit.passado||est==="comparacao");
  marcarMemoriaEntreCarreiras(MEM_SITUACOES[tipo],sit.id,mem);
  return{sit,est};
}
/* a cena olha pro passado (fio, comparação, fala antiga ou fato anterior):
   manda o dossiê pra IA; senão, nada de histórico no prompt */
const olhaPassado=sel=>!!sel&&(!!sel.sit.passado||sel.est==="comparacao");
/* molde local da mesma dupla: o que o Free vê e o que entra quando a IA falha */
function cenaLocal(sel,c){
  const evs=sel.sit.ev(c),h=hashEstavel(`${SEED}:${fightNo}:${sel.sit.id}`);
  return{evento:evs[h%evs.length],pergunta:sel.sit.est[sel.est](c)};
}
function cenasRecentes(tipo){return((st.cenasRecentes||{})[tipo]||[]).slice(-4);}
/* O que vai pro prompt (narrativa 2026-10-01): as cenas recentes SEM a fala
   citada (medido: a IA reaproveitava fala antiga das recentes em cena que
   não podia citar nada, e a cena caía) e os acontecimentos das últimas 8. */
const semFalaCitada=t=>String(t||"").replace(/'[^']{3,}'|"[^"]{3,}"|“[^”]{3,}”|‘[^’]{3,}’/g,"(fala)");
function cenasRecentesPrompt(tipo){return cenasRecentes(tipo).map(semFalaCitada);}

    .map(t=>{const k=t.lastIndexOf("Pergunta: ");return semFalaCitada(k>=0?t.slice(0,k):"").trim().slice(0,110);}).filter(Boolean);
}
function lembrarCena(tipo,c){
  st.cenasRecentes=st.cenasRecentes||{};
  const l=st.cenasRecentes[tipo]=st.cenasRecentes[tipo]||[];
  l.push(cortarFrase(`${c.evento?c.evento+" ":""}Pergunta: ${c.pergunta}`,480));
  if(l.length>8)l.splice(0,l.length-8);

/* O que a IA devolveu vira cena só se tiver pergunta, passar no filtro de
   conteúdo e não repetir uma pergunta recente; senão fica o molde local.
   Na coletiva a luta ainda não aconteceu: o evento perde a frase que
   afirma resultado (a pergunta é pergunta, não afirma nada). */
/* ---------- memória narrativa (etapa 1 do plano de 2026-09-29) ----------
   Pedido do dono: coletiva, resultado e entrevista formam uma história, e
   a imprensa só cobra o que o jogador disse DE VERDADE. Cada resposta dele
   na coletiva e na entrevista vira uma "fala" guardada na carreira
   (st.memoria, que vai no save: sem tabela nova), com:
   - o texto literal que ele escreveu, inteiro (o campo tem 200 letras);
   - um trecho literal, recortado do próprio texto (a IA só aponta qual
     parte; se o que ela devolve não estiver no texto, fica o começo dele);
   - o tom e, se houver, a promessa, classificados na MESMA chamada da
     reação (campo "declaracao"): nenhuma chamada nova de IA.
   Quem decide se a promessa foi cumprida é o jogo, pelo resultado real
   (avaliarPromessa). E nenhum texto da IA pode atribuir ao jogador uma
   fala que não esteja aqui (falasAtribuidasOk). */
const TONS_FALA=["provocacao","promessa","respeito","neutro"];
const METODOS_PROMESSA=["vencer","nocaute","finalizacao","decisao"];
const MAX_FALAS=20;
function memoriaDa(){
  st.memoria=st.memoria||{falas:[]};
  st.memoria.falas=st.memoria.falas||[];
  return st.memoria;
}
/* Forma de comparar texto: minúsculas, sem acento, pontuação vira espaço.
   O mapa diz de qual letra do original veio cada letra da forma
   normalizada, pra recortar o trecho na grafia do próprio jogador. */
function normalizarComMapa(s){
  s=String(s||"");
  let out="",esp=true;
  const mapa=[];
  for(let i=0;i<s.length;i++){
    const c=s[i].normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
    for(const ch of c){
      if(/[a-z0-9]/.test(ch)){out+=ch;mapa.push(i);esp=false;}
      else if(!esp){out+=" ";mapa.push(i);esp=true;}
    }
  }
  if(out.endsWith(" ")){out=out.slice(0,-1);mapa.pop();}
  return{out,mapa};
}
const formaComparavel=s=>normalizarComMapa(s).out;
/* corta na última palavra inteira e marca o corte; nunca acrescenta
   pontuação ou palavra que o jogador não escreveu */
function cortarLiteral(s,n){
  s=String(s||"").trim();
  if(s.length<=n)return s;
  const c=s.slice(0,n),i=c.lastIndexOf(" ");
  return(i>n*.5?c.slice(0,i):c).replace(/[\s,;:]+$/,"")+"…";
}
function trechoLiteral(texto,trechoIA){
  const T=normalizarComMapa(texto),P=formaComparavel(trechoIA);
  if(P.length>=4){
    const k=T.out.indexOf(P);
    if(k>=0){
      const ini=T.mapa[k],fim=T.mapa[k+P.length-1];
      const t=String(texto).slice(ini,fim+1).trim();
      if(t)return cortarLiteral(t,140);
    }
  }
  return cortarLiteral(texto,120);
}
/* Grava a fala. decl é o campo "declaracao" da reação, já passado pelo
   limparTextoIA; tudo nele é conferido aqui. Texto inseguro do jogador não
   entra na memória (não pode voltar numa pergunta futura). */
function registrarFala({onde,luta,adv,texto,decl}){
  const t=String(texto||"").trim().slice(0,200);
  if(!t||conteudoInseguro(t))return null;
  const d=decl&&typeof decl==="object"?decl:{};
  let promessa=null;
  if(d.promessa&&typeof d.promessa==="object"&&METODOS_PROMESSA.includes(d.promessa.metodo)){
    const rd=Number(d.promessa.round);
    promessa={metodo:d.promessa.metodo,round:Number.isInteger(rd)&&rd>=1&&rd<=5?rd:null};
  }

/* Cena guardada por luta: voltar pro camp e voltar à coletiva (ou sair e
   voltar à entrevista) mostra a MESMA cena, sem outra chamada de IA e sem
   gastar outro tema da cartela. */
let cacheColetiva=null,cacheEntrevista=null;
function cenaGuardada(cache,local,pedir,tipo,opcoes={}){
  if(cache.cena||cache.promessa)return;
  if(!meuPro&&!opcoes.amostra){cache.cena=local;lembrarCena(tipo,local);return;}
  const tk=CARREIRA_TOKEN;
  cache.promessa=(async()=>{
    try{return cenaDaIA(await pedir(await meuAccessToken()),local,tipo,opcoes);}catch(e){return local;}
  })();
  /* resposta que chega depois de trocar de carreira não escreve no st novo */
  cache.promessa.then(c=>{if(tk!==CARREIRA_TOKEN)return;cache.cena=c;lembrarCena(tipo,c);});
}

/* Faixa da amostra grátis dentro da cena (etapa 2 do plano de evolução). */
function faixaAmostra(texto){

/* O servidor recusou a amostra (cota da conta usada, ou sem como conferir):
   a cena fica como a do grátis, com a resposta travada, e a faixa diz por
   quê. */
function travarAmostra(p,area,faixa){
  p.resp.innerHTML="";
  p.resp.appendChild(bloqueioPro(area));
  if(faixa)faixa.innerHTML=`${ICONE("cadeado")}<span><b>Amostra do Pro</b>${textoAmostraNegada()}</span>`;
}

/* Vitrine ligada (2026-09-22): grátis PRECISA ver que a coletiva existe.
   Revamp fase 5: a vitrine é o componente único bloqueioPro() (área a
   35%, sem clique, selo Assine o Pro) e "Pular" fica fora do bloqueio. */
function telaColetiva(escolhido,camp){

  const ct=++CENA_TOKEN;
  const seguir=()=>{CENA_TOKEN++;box.style.display="none";box.innerHTML="";lutar(escolhido,camp);};
  const chave=`${SEED}:${fightNo}:${opp.name}`;
  const ctxC=ctxColetiva(opp,camp,escolhido);
  if(!cacheColetiva||cacheColetiva.chave!==chave){
    const cobranca=falaParaColetiva(opp);
    if(cobranca){cobranca.fala.cobrada++;memoriaDa().ultimaCobranca=fightNo+1;}
    const sel=cobranca?null:escolherCena("coletiva",ctxC);
    if(cobranca)narrativaDa().passado.coletiva=true;
    cacheColetiva={chave,cobranca,sel,reporter:reporterDaCena("coletiva",sel&&sel.sit.id),cena:null,promessa:null,
      tema:cobranca?(cobranca.motivo==="revanche"?"revanche: o que o lutador disse no último encontro entre os dois"
        :"cobrança de uma fala antiga do lutador"):temaDaSituacao(sel.sit,ctxC)};
  }
  const cache=cacheColetiva,{reporter,tema,cobranca,sel}=cache;
  const amostra=amostraLiberada("coletiva");
  const local=cobranca?cenaColetivaMemoria(opp,cobranca):cenaLocal(sel,ctxC);
  const historicoRival=escolhido.rival?historicoRivalTexto():null;
  const falaAntiga=cobranca?linhaMemoria(cobranca.fala):null;
  cenaGuardada(cache,local,token=>ai("coletivaCena",{name:me.name,record:`${st.wins}-${st.losses}`,
    followers:fmtNum(st.followers),fan:st.fan.toFixed(1),
    sequencia:st.streakW>1?`${st.streakW} vitórias seguidas`:st.streakL>1?`${st.streakL} derrotas seguidas`:null,
    opp:opp.name,estilo:opp.arquetipo||"completo",dificuldade:dif.rot,title:!!st.tituloEstaLuta,
    camp:camp&&camp.nome,lesao:st.lesao?`${ROTULO_ATTR[st.lesao.atributo]||st.lesao.atributo} machucado(a)`:null,
    historicoRival,reporter:`${reporter.nome} (${reporter.veiculo})`,linhaReporter:reporter.linha,tema,
    estrutura:sel?ESTRUTURAS[sel.est]:null,anterior:sel&&sel.est==="comparacao"&&ctxC.anterior?ctxC.anterior.txt:null,
    dossie:olhaPassado(sel)?dossieCarreira(0):null,eventoBase:sel?cenaLocal(sel,ctxC).evento:null,
    eventosUsados:eventosUsados("coletiva"),recentes:cenasRecentesPrompt("coletiva"),memoria:falaAntiga?[falaAntiga]:[],token,amostra}),"coletiva",
    {permitidas:cobranca?[cobranca.fala.texto]:[],exige:cobranca?cobranca.fala.texto:null,amostra,nomes:[opp.name]});

  box.innerHTML="";
  box.appendChild(el("div","esc-hd",`Coletiva · ${me.name} x ${opp.name}`));
  const meio=montarCena(box,"coletiva",reporter,"coletiva-mesa");
  const p=pecasDaConversa("col",reporter);
  const area=el("div","cena-responder",`<textarea id="colresp" maxlength="200" rows="3" placeholder="Sua resposta"></textarea>
      <button class="botao" id="colgo" type="button">Responder</button>`);
  p.resp.appendChild(amostra?area:bloqueioPro(area));
  const pular=el("button","botao botao-sec coletiva-pular","Pular a coletiva");pular.id="colpular";pular.type="button";
  p.acoes.appendChild(pular);
  const faixa=amostra?faixaAmostra("Nesta primeira luta você responde à imprensa sem o Pro. A resposta muda o hype da luta, e na entrevista depois dela o repórter volta ao que você disse."):null;
  if(faixa)meio.appendChild(faixa);
  meio.append(p.memoria,p.evento,p.fala,p.resp,p.desfecho,p.acoes);
  if(cobranca)mostrarMemoria(p,cobranca.fala.onde==="coletiva"?`Na coletiva da luta ${cobranca.fala.luta} você disse`
    :`Depois da luta ${cobranca.fala.luta} você disse`,cobranca.fala);
  const inp=document.getElementById("colresp"),go=document.getElementById("colgo");
  const cresce=()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";};
  inp.addEventListener("input",cresce);
  manterBotaoVisivel(inp,go);
  pular.onclick=()=>{SOM.toque();seguir();};
  let cena=cache.cena||local;
  if(cache.cena)mostrarPergunta(p,reporter,cena);
  else{
    inp.disabled=true;go.disabled=true;
    const tk=CARREIRA_TOKEN;
    cache.promessa.then(c=>{
      if(tk!==CARREIRA_TOKEN||ct!==CENA_TOKEN)return;
      cena=c;mostrarPergunta(p,reporter,c);
      if(amostra&&AMOSTRA_NEGADA)return travarAmostra(p,area,faixa);
      inp.disabled=false;go.disabled=false;if(!semHover())inp.focus();
    });
  }
  go.onclick=async()=>{
    const txt=inp.value.trim();
    if(!txt)return inp.focus();
    /* Grátis é vitrine: o clique nunca chama a IA (api/ai.js recusaria com
       403 de qualquer jeito, isto só evita a viagem de rede). A exceção é
       a amostra da 1ª luta, enquanto o servidor não recusou. */
    if(!meuPro&&!(amostra&&!AMOSTRA_NEGADA))return;
    go.disabled=true;inp.disabled=true;go.textContent="…";pular.hidden=true;
    const volta=document.getElementById("noiteVoltar");if(volta)volta.hidden=true;   // resposta a caminho: sem voltar
    const tk=CARREIRA_TOKEN;
    const token=await meuAccessToken();
    /* Corta ANTES de chamar a IA: mais barato e não depende de a IA ter
       obedecido a instrução de conteúdo inseguro. */
    const j=conteudoInseguro(txt)?null:await ai("coletiva",{name:me.name,opp:opp.name,
      estilo:opp.arquetipo||"completo",dificuldade:dif.rot,title:!!st.tituloEstaLuta,
      evento:cena.evento,pergunta:cena.pergunta,resposta:txt,record:`${st.wins}-${st.losses}`,
      followers:fmtNum(st.followers),fan:st.fan.toFixed(1),historicoRival,falaAntiga,token,amostra});
    if(tk!==CARREIRA_TOKEN||ct!==CENA_TOKEN)return;
    aplicarColetiva(p,opp,txt,j,seguir,{cena,cobranca});
  };
  /* foco só com mouse: no toque ele abre o teclado por cima da pergunta */
  if(cache.cena&&(meuPro||amostra)&&!semHover())inp.focus();
  SOM.flashes();
  mostrarNoite("coletiva");
}
/* O que a coletiva muda na luta (pedido do dono, 2026-09-28: "a coletiva
   não mexe em fã e seguidores, é bug?"). Não mexe na hora, mexe na luta:
   o hype multiplica o hype desta luta (seguidores e fã saem dele depois
   do resultado) e a pressão, quando a IA narra o adversário perdendo o
   foco, muda um atributo dele só nesta luta. Antes isso era invisível. */
function efeitoColetivaHTML(){
  const pct=Math.round(((st.coletivaHype||1)-1)*100);
  const pr=st.coletivaPressao,pp=pr?Math.round((pr.mult-1)*100):0;
  const partes=[];
  partes.push(pct?`<span class="delta ${pct>0?"up":"down"}">Hype desta luta ${pct>0?"+":"−"}${Math.abs(pct)}%</span>`
    :`<span class="delta">Hype desta luta sem mudança</span>`);
  if(pr&&pp)partes.push(`<span class="delta ${pp<0?"up":"down"}">Adversário ${pp<0?"abalado":"mais ligado"}: ${
    (ROTULO_ATTR[pr.atributo]||pr.atributo).toLowerCase()} ${pp>0?"+":"−"}${Math.abs(pp)}% nesta luta</span>`);
  return `<div class="dil-fx">${partes.join("")}</div>`+
    (pct?`<p class="cena-nota">O hype multiplica os seguidores e o fã que a luta render: o resultado mostra quanto veio da coletiva.</p>`:"");
}
function aplicarColetiva(p,opp,txt,jBruto,seguir,{cena=null,cobranca=null}={}){
  /* reação que atribui ao jogador uma citação que ele não disse vale como
     reação nenhuma (mesma rede de baixo do conteúdo inseguro) */
  const jSeguro=(jBruto&&(conteudoInseguro(jBruto.reacao)||
    !falasAtribuidasOk(jBruto.reacao,[txt].concat(cobranca?[cobranca.fala.texto]:[]),me.name,{exigeCitacao:false})))?null:jBruto;
  const j=jSeguro;
  st.coletivaHype=lim(j&&j.hype,.85,1.20,1);
  const mult=lim(j&&j.pressao,.90,1.10,1);
  const atr=["slpm","strDef","tdAvg","tdDef","subAvg","kdAvg","durability"].includes(j&&j.atributoPressao)?j.atributoPressao:null;
  st.coletivaPressao=atr?{atributo:atr,mult}:null;
  /* mesma rede de baixo do dilema: nunca deixa a IA afirmar quem ganha a
     luta que ainda vai acontecer (semResultadoDeLuta). */
  const bruto=(j&&j.reacao)?semResultadoDeLuta(String(j.reacao)).slice(0,800):"";
  mostrarResposta(p,txt);
  /* memória narrativa: a resposta literal vira fala da carreira, com o tom
     e a promessa que vieram na mesma chamada (nada se a IA falhou: fica a
     resposta literal, com tom neutro) */
  registrarFala({onde:"coletiva",luta:fightNo+1,adv:opp.name,texto:txt,decl:j&&j.declaracao});
  /* Sem reação (IA fora, texto cortado): a resposta fica registrada e a
     sala segue, em vez de pular pra luta sem mostrar nada. */
  const reacaoTxt=bruto?semTag(bruto):"A assessoria anotou a resposta e passou a palavra pro próximo repórter.";
  mostrarDesfecho(p,reacaoTxt,efeitoColetivaHTML());
  /* a coletiva entra no Cartel junto com a luta (o registro dela só nasce
     no fim da luta, em finishFight) */
  if(cena&&!conteudoInseguro(txt))
    st.coletivaDaLuta={tipo:"coletiva",luta:fightNo+1,cena:`"${semTag(cena.pergunta)}"`,resposta:semTag(txt),texto:reacaoTxt};
  /* Botão em vez de tempo fixo (pedido do dono, 2026-09-28): a luta só
     começa quando o jogador manda. */
  const tk=CARREIRA_TOKEN;
  p.acoes.innerHTML="";
  const ir=el("button","botao coletiva-seguir",`<span>Ir pra luta</span>${ICONE("seta-dir")}`);
  ir.id="colseguir";ir.type="button";
  ir.onclick=()=>{ if(tk!==CARREIRA_TOKEN)return; SOM.toque(); seguir(); };
  p.acoes.appendChild(ir);
}

/* ---------- entrevista pós-luta ---------- */
/* =========================================================================
   ENTREVISTA PÓS-LUTA COM PAUTA (2026-10-01, pedido do dono: perguntas
   "artificiais, desconexas e sem sentido", ex.: "O seu treinador ainda
   estava com a toalha no ombro quando o repórter chegou. Ele disse algo
   específico no corner sobre a decisão dos juízes?").
   Causa: a pergunta juntava quatro peças sem relação entre si (uma
   situação sorteada, uma forma que mandava partir do evento, o evento da
   chegada do repórter e um fato obrigatório), a IA escrevia com a voz de
   torcedor do feed, os moldes tinham escolha vazia ("A arena te empurrou
   ou te pressionou?") e nenhum filtro barrava pergunta incoerente.
   Agora: os FATOS da luta saem do log e do resultado (fatosDaLuta); a
   PAUTA (o que o repórter quer descobrir) é escolhida pelos fatos; a
   pergunta parte de um fato e segue a pauta; o evento é só cenário da
   chegada do repórter. O filtro de coerência (motivoPerguntaRuim) vale pra
   resposta da IA e pros moldes (a suíte entrevista confere os moldes).
   A coletiva não mudou.
   ========================================================================= */
const ORDINAL=["primeiro","segundo","terceiro","quarto","quinto"];
const ord=n=>ORDINAL[n-1]||`${n}º`;
const cap1=s=>String(s||"").charAt(0).toUpperCase()+String(s||"").slice(1);
/* o relógio da luta corre pra trás: "3:40" no round = 1min20 de luta nele */
function segundosDoRound(clock){
  const m=/^(\d+):(\d\d)$/.exec(String(clock||""));
  return m?Math.max(0,300-(+m[1]*60+ +m[2])):null;
}
function tempoDoRound(clock){
  const s=segundosDoRound(clock);
  if(s==null)return null;
  return s<60?`${s} segundos`:`${Math.floor(s/60)}min${String(s%60).padStart(2,"0")}`;
}
/* Fatos da luta, só do que o motor registrou: método, round e tempo, quem
   levou cada round ("Fim do round N. Fulano levou."), knockdowns, tentativas
   de finalização, quedas e o placar (o motor tem UM placar, nunca três
   juízes: nada de decisão dividida ou unânime). */
function fatosDaLuta(r,won,opp,td0,tdt0,{titulo=false,zebra=false,lesao=null}={}){
  const eu=me.name,ele=opp.name,log=(r&&r.log)||[];
  const quem=t=>String(t||"").startsWith(eu)?"eu":String(t||"").startsWith(ele)?"ele":null;
  const metodo=/ocaute/.test(r.method)?"nocaute":r.method==="Finalização"?"finalização":"decisão";
  const rounds=log.filter(L=>L.kind==="rd").map(L=>{
    const m=/Fim do round (\d+)\. (.+) levou\./.exec(L.text||"");
    return{n:m?+m[1]:L.round,quem:m?(m[2]===eu?"eu":m[2]===ele?"ele":null):null};
  });
  const kds=log.filter(L=>L.kind==="kd").map(L=>({round:L.round,caiu:quem(L.text)})).filter(k=>k.caiu);
  const tentativas=log.filter(L=>L.kind==="big"&&/tenta a finaliza/.test(L.text||""))
    .map(L=>({round:L.round,quem:quem(L.text)})).filter(t=>t.quem);
  const pl=String(r.cards||"").split("-").map(Number);
  const placar=metodo==="decisão"&&pl.length===2&&pl.every(Number.isFinite)?{eu:pl[0],ele:pl[1]}:null;
  return{won:!!won,metodo,round:r.round,tempo:metodo==="decisão"?null:tempoDoRound(r.clock),
    segundos:metodo==="decisão"?null:segundosDoRound(r.clock),opp:ele,
    rounds,kds,tentativas,quedas:{eu:td0||0,ele:tdt0||0},placar,apertada:!!placar&&Math.abs(placar.eu-placar.ele)<=1,
    titulo:!!titulo,zebra:!!zebra,lesao,rec:`${st.wins}-${st.losses}`,anterior:lutaAnterior(1),reencontro:reencontroCom(ele,1),
    textoDoLog:log.map(L=>L.text||"").join(" ")};
}
const placarTxt=f=>f.placar?`${Math.max(f.placar.eu,f.placar.ele)}-${Math.min(f.placar.eu,f.placar.ele)}`:"";
/* como a luta terminou, do ponto de vista do lutador do jogador */
const nosCartoes=f=>f.placar?`nos cartões, por ${placarTxt(f)}`:"nos cartões";
function comoTerminou(f,comNome=true){
  const o=comNome?` ${f.opp}`:"";
  if(f.metodo==="decisão")return f.won?`você venceu ${nosCartoes(f)}`:`${f.opp} venceu ${nosCartoes(f)}`;
  if(f.metodo==="nocaute")return f.won?`você nocauteou${o} no ${ord(f.round)} round`:`você foi nocauteado no ${ord(f.round)} round`;
  return f.won?`você finalizou${o} no ${ord(f.round)} round`:`você foi finalizado no ${ord(f.round)} round`;
}
function fimCurto(f){
  return f.metodo==="decisão"?nosCartoes(f):`por ${f.metodo} no ${ord(f.round)} round`;
}
/* resumo factual pra IA (curto; só o que aconteceu) */
function resumoDaLuta(f){
  const eu=me.name;
  const partes=[f.metodo==="decisão"
    ?`${eu} ${f.won?"venceu":"perdeu para"} ${f.opp} nos cartões${f.placar?`, ${placarTxt(f)}${f.won?"":" para "+f.opp}`:""}`
    :`${eu} ${f.won?"venceu":"perdeu para"} ${f.opp} por ${f.metodo} no ${ord(f.round)} round${f.tempo?`, ${f.tempo} depois do início do round`:""}`];
  const rs=f.rounds.filter(x=>x.quem).map(x=>`${ord(x.n)} round de ${x.quem==="eu"?eu:f.opp}`);
  if(rs.length)partes.push(`rounds completos: ${rs.join(", ")}`);
  for(const k of f.kds)partes.push(`${k.caiu==="eu"?eu:f.opp} foi ao chão no ${ord(k.round)} round`);
  for(const t of f.tentativas.slice(0,2))partes.push(`${t.quem==="eu"?eu:f.opp} tentou uma finalização no ${ord(t.round)} round`);
  if(f.quedas.eu||f.quedas.ele)partes.push(`quedas na luta toda: ${eu} ${f.quedas.eu}, ${f.opp} ${f.quedas.ele}`);
  return cortarFrase(partes.join(". ")+".",600);
}
const venceuRound1=f=>f.rounds.length&&f.rounds[0].n===1?f.rounds[0].quem:null;
/* Pautas: o que o repórter quer descobrir, escolhido pelos fatos. Nível 3
   (fato forte) passa na frente; nível 2 é fato específico desta luta; nível
   1 serve pra luta com pouca informação, sem virar pergunta genérica. Cada
   pauta tem a intenção (vai pra IA), o fato central e os moldes locais. */
const PAUTAS_ENTREVISTA=[
  {id:"cinturao",nivel:3,cond:f=>f.titulo,
   intencao:f=>f.won?"entender o que decidiu a conquista do cinturão":"entender o que faltou na disputa de cinturão",
   fato:f=>`era luta de cinturão e ${comoTerminou(f)}`,
   q:f=>f.won?[`O cinturão é seu: ${comoTerminou(f)}. Em que momento a luta começou a ficar do seu lado?`,
       `${cap1(comoTerminou(f))} numa luta de cinturão. O que a sua equipe preparou que fez diferença?`]
     :[`A disputa de cinturão ficou com ${f.opp}, ${fimCurto(f)}. O que faltou?`,
       `Você perdeu a disputa de cinturão ${fimCurto(f)}. O que precisa mudar para voltar a essa posição?`]},
  {id:"lesao",nivel:3,cond:f=>!!f.lesao,
   intencao:()=>"saber se a lesão com que ele entrou na luta atrapalhou",
   fato:f=>`ele entrou na luta com uma lesão e ${f.won?"venceu":"perdeu"} ${fimCurto(f)}`,
   q:f=>[`Você entrou nesta luta com uma lesão. Em algum momento ela limitou o que você queria fazer contra ${f.opp}?`,
     `Você lutou com uma lesão contra ${f.opp}. Ela mudou o plano que vocês tinham?`,
     `Como a lesão que você trouxe para esta luta afetou o seu jogo contra ${f.opp}?`]},
  {id:"zebra",nivel:3,cond:f=>f.zebra&&f.won,
   intencao:()=>"entender como venceu um adversário que chegou como favorito",
   fato:f=>`${f.opp} era o favorito e ${comoTerminou(f,false)}`,
   q:f=>[`${f.opp} chegou como favorito e você venceu ${fimCurto(f)}. O que vocês viram no jogo dele que funcionou hoje?`,
     `Pouca gente apostava em você contra ${f.opp}. Qual parte do plano fez a diferença?`,
     `Quase ninguém via você vencendo ${f.opp}. O que você sabia sobre essa luta que os outros não sabiam?`]},
  {id:"nocaute-rapido",nivel:2,cond:f=>f.won&&f.metodo==="nocaute"&&f.round===1&&/segundos|^0min|^1min[0-2]/.test(f.tempo||""),
