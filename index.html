function tom(f,{tipo="sine",pico=.09,dur=.3,atq=.006,em=0,corte=null,varre=null}={}){
  const a=ctx();if(!a)return;
  const t=a.currentTime+em;
  const o=a.createOscillator(), g=a.createGain();
  o.type=tipo; o.frequency.setValueAtTime(f,t);
  if(varre)o.frequency.exponentialRampToValueAtTime(varre,t+dur);
  let no=o;
  if(corte){const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=corte;
    o.connect(lp); no=lp;}
  env(g,t,pico,dur,atq); no.connect(g).connect(BUS);
  o.start(t); o.stop(t+dur+.12);
}
const SOM={
  toque(){ if(toca("click",.75))return; tom(150,{tipo:"triangle",pico:.05,dur:.06,varre:96,corte:900}); },

  fixa(){ tom(98,{tipo:"sine",pico:.10,dur:.22,corte:700});
          tom(147,{tipo:"sine",pico:.07,dur:.26,em:.06,corte:800}); },

  /* estalo abafado, tipo luva em corpo */
  golpe(){ const a=ctx();if(!a)return;const t=a.currentTime;
    const s=ruido(.11);if(!s)return;
    const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(500,t);
    const g=a.createGain();env(g,t,.11,.12,.002);
    s.connect(lp).connect(g).connect(BUS);s.start(t);
    tom(70,{tipo:"sine",pico:.07,dur:.1,varre:45}); },

  queda(){ tom(96,{tipo:"sine",pico:.24,dur:.42,varre:34,atq:.005});
    const a=ctx();if(!a)return;const t=a.currentTime;
    const s=ruido(.3);if(!s)return;
    const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(300,t);
    const g=a.createGain();env(g,t,.13,.3,.004);
    s.connect(lp).connect(g).connect(BUS);s.start(t); },

  nocaute(){ tom(120,{tipo:"sine",pico:.38,dur:.85,varre:26,atq:.004});
    const a=ctx();if(!a)return;const t=a.currentTime;
    const s=ruido(2.2);if(!s)return;
    const bp=a.createBiquadFilter();bp.type="lowpass";bp.frequency.setValueAtTime(700,t);
    const g=a.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.16,t+.35);     // a plateia leva um tempo
    g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
    s.connect(bp).connect(g).connect(BUS);s.start(t); },

  /* sino de round: grave e abafado, não o triângulo agudo de antes */
  sino(){ [330,495,660].forEach((f,i)=>
    tom(f,{tipo:"sine",pico:.055/(i+1),dur:1.4,atq:.002,corte:1200})); },

  /* VITÓRIA: acorde maior grave que abre, com um peso embaixo */
  vitoria(){ if(toca("vitoria",.85))return; tom(65,{tipo:"sine",pico:.16,dur:1.1,atq:.02});
    [131,165,196].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.085,dur:1.0,em:i*.10,atq:.02,corte:1000}));
    tom(262,{tipo:"sine",pico:.05,dur:1.2,em:.30,atq:.05,corte:900}); },

  /* Evento neutro: um toque só, discreto. Serve de pontuação. */
  evento(){ tom(147,{tipo:"sine",pico:.09,dur:.5,atq:.02,corte:900});
            tom(220,{tipo:"sine",pico:.045,dur:.4,em:.03,atq:.03,corte:1100}); },

  /* Evento BOM: terça maior subindo, curto. Menor que a vitória de propósito —
     é uma boa notícia, não o fim de uma luta. */
  bom(){ tom(98,{tipo:"sine",pico:.11,dur:.7,atq:.015});
    [196,247,294].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.075,dur:.55,em:i*.075,atq:.012,corte:1500})); },

  /* Evento RUIM: segunda menor descendo, com o chão saindo embaixo. */
  ruim(){ tom(110,{tipo:"sine",pico:.12,dur:.9,atq:.015});
    [233,208,175].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.07,dur:.55,em:i*.09,atq:.012,corte:1100}));
    tom(87,{tipo:"sine",pico:.09,dur:.8,em:.28,atq:.04}); },

  /* DERROTA: menor, desce, e a fundamental fica sozinha no fim */
  derrota(){ if(toca("derrota",.85))return; tom(98,{tipo:"sine",pico:.14,dur:1.3,atq:.02});
    [156,131,117].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.075,dur:.8,em:i*.16,atq:.02,corte:700}));
    tom(58,{tipo:"sine",pico:.10,dur:1.6,em:.5,atq:.08}); },
};

/* O navegador só libera áudio depois de um gesto do usuário. Este ouvinte roda
   uma vez e morre — é a única janela em que dá pra iniciar a trilha. */
/* ---------------- ARQUIVOS ----------------
   Os quatro áudios da pasta /audio substituem os sons sintetizados quando
   carregam. Se algum faltar ou o navegador recusar o formato, o sintetizado
   assume — o jogo nunca fica mudo por causa de um 404. */
const ARQ={click:"audio/button_click.wav",vitoria:"audio/victory.wav",
           derrota:"audio/defeat.wav",bgm:"audio/bgm_fight.ogg"};
const BUF={};
async function carregaAudio(){
  const a=ctx(); if(!a) return;
  await Promise.all(Object.entries(ARQ).map(async ([k,url])=>{
    try{
      const r=await fetch(url); if(!r.ok)throw 0;
      BUF[k]=await a.decodeAudioData(await r.arrayBuffer());
    }catch(e){ /* fica sem: o sintetizado cobre */ }
  }));
}
function toca(k,ganho=1){
  const a=ctx(); if(!a||!BUF[k])return false;
  const s=a.createBufferSource(); s.buffer=BUF[k];
  const g=a.createGain(); g.gain.value=ganho;
  s.connect(g).connect(BUS); s.start();
  return true;
}
let BGM=null;
function bgmLiga(){
  const a=ctx(); if(!a||!BUF.bgm||BGM) return false;
  const s=a.createBufferSource(); s.buffer=BUF.bgm; s.loop=true;
  const g=a.createGain(); g.gain.setValueAtTime(.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.34,a.currentTime+2.5);
  s.connect(g).connect(MUSICA); s.start();
  BGM={s,g}; return true;
}
function bgmDesliga(){
  if(!BGM||!AC)return;
  const t=AC.currentTime;
  BGM.g.gain.cancelScheduledValues(t);
  BGM.g.gain.setValueAtTime(Math.max(.0001,BGM.g.gain.value),t);
  BGM.g.gain.exponentialRampToValueAtTime(.0001,t+.9);
  const s=BGM.s; setTimeout(()=>{try{s.stop();}catch(e){}},1000);
  BGM=null;
}

function armarTrilha(){
  if(!document.addEventListener)return;      // ambiente sem eventos: sem trilha, sem erro
  const arma=async()=>{
    await carregaAudio();
    if(!bgmLiga())trilhaLiga();          // sem arquivo, cai no bordão sintetizado
    document.removeEventListener("pointerdown",arma);
    document.removeEventListener("keydown",arma); };
  document.addEventListener("pointerdown",arma);
  document.addEventListener("keydown",arma);
}

/* Rampa curta em vez de salto: arrastar a barra mexe no ganho dezenas de vezes
   por segundo e salto de ganho estala. */
function ajustaGanho(no,v){
  if(!no)return;
  try{ no.gain.setTargetAtTime(v,AC.currentTime,.02); }
  catch(e){ try{ no.gain.value=v; }catch(e2){} }
}
function aplicarVolumes(){
  ajustaGanho(MUSICA,volMusica);
  ajustaGanho(BUS,volEfeitos);
}
function definirVolume(qual,v){
  v=clamp(Number(v)||0,0,1);
  if(qual==="musica"){ volMusica=v; try{localStorage.setItem("vol_musica",String(v));}catch(e){} }
  else               { volEfeitos=v; try{localStorage.setItem("vol_efeitos",String(v));}catch(e){} }
  aplicarVolumes();
}
function definirMudo(v){
  mudo=!!v;
  try{localStorage.setItem("mudo",mudo?"1":"0");}catch(e){}
  if(mudo){ bgmDesliga(); trilhaDesliga(); return; }
  SOM.toque();                 // é ele que faz o contexto nascer
  aplicarVolumes();
  /* Quem começou mudo nunca chegou a baixar os arquivos: o ctx() devolvia null
     e o carregaAudio saía na primeira linha. Carrega agora, e só então escolhe
     entre arquivo e bordão sintetizado. */
  try{ carregaAudio().then(()=>{ if(!bgmLiga())trilhaLiga(); }); }
  catch(e){ if(!bgmLiga())trilhaLiga(); }
}

/* =========================================================================
   CONFIGURAÇÕES — o painel da engrenagem
   O botão "Som on/off" que morava na barra fixa SAIU e virou item daqui. Ter a
   mesma função em dois lugares é a receita para os dois estados discordarem.
   ========================================================================= */
let cfgAberto=false;

function linhaVolume(id,rotulo,valor,aoMudar){
  const li=el("div","cfg-linha");
  const inp=el("input");
  inp.type="range"; inp.min="0"; inp.max="100"; inp.step="1";
  inp.value=String(Math.round(valor*100));
  inp.id=id; inp.className="cfg-range";
  inp.setAttribute&&inp.setAttribute("aria-label",rotulo);
  const num=el("b","cfg-num",inp.value+"%");
  const aplica=()=>{
    const v=clamp(Number(inp.value)/100,0,1);
    num.textContent=Math.round(v*100)+"%";
    aoMudar(v);
  };
  inp.oninput=aplica; inp.onchange=aplica;
  li.append(el("span","cfg-rot",rotulo),inp,num);
  return {li,inp};
}

function abrirConfig(){
  const cx=document.getElementById("cfg");
  if(!cx||cfgAberto)return;
  cfgAberto=true;
  cx.innerHTML="";

  const p=el("div","cfg-painel");
  const topo=el("div","cfg-top","<h2>Configurações</h2>");
  const fechar=el("button","cfg-x","&#10005;");
  fechar.id="cfgx"; fechar.type="button";
  fechar.setAttribute&&fechar.setAttribute("aria-label","Fechar");
  fechar.onclick=()=>{SOM.toque();fecharConfig();};
  topo.appendChild(fechar);

  const somL=el("div","cfg-linha");
  const tg=el("button","cfg-toggle","");
  tg.id="cfgmudo"; tg.type="button";
  const mus=linhaVolume("cfg_mus","Música",volMusica,v=>definirVolume("musica",v));
  const efe=linhaVolume("cfg_efe","Efeitos",volEfeitos,v=>definirVolume("efeitos",v));

  /* Um lugar só decide a aparência das três linhas, senão o mudo e as barras
     saem de sincronia como já saíam antes. */
  const pintar=()=>{
    tg.textContent=mudo?"Mudo":"Ligado";
    tg.className="cfg-toggle"+(mudo?"":" on");
    mus.li.className="cfg-linha"+(mudo?" cfg-off":"");
    efe.li.className="cfg-linha"+(mudo?" cfg-off":"");
    mus.inp.disabled=mudo; efe.inp.disabled=mudo;
  };
  tg.onclick=()=>{ definirMudo(!mudo); pintar(); };
  pintar();

  somL.append(el("span","cfg-rot","Som"),tg);
  p.append(topo,somL,mus.li,efe.li);
  p.appendChild(el("p","cfg-nota",
    "A trilha é cama de fundo e entra bem abaixo dos efeitos. Se quiser ouvir só "+
    "o soco, zere a música — o resto continua igual."));

  /* Clique no fundo fecha; clique dentro do painel não. */
  cx.onclick=e=>{ if(!e||e.target===cx)fecharConfig(); };
  p.onclick=e=>{ if(e&&e.stopPropagation)e.stopPropagation(); };

  cx.appendChild(p);
  cx.style.display="flex";
}
function fecharConfig(){
  const cx=document.getElementById("cfg");
  cfgAberto=false;
  if(!cx)return;
  cx.style.display="none";
  cx.innerHTML="";
}
function armarConfig(){
  const b=document.getElementById("cfgbtn");
  if(b)b.onclick=()=>{ SOM.toque(); cfgAberto?fecharConfig():abrirConfig(); };
  if(document.addEventListener)
    document.addEventListener("keydown",e=>{
      if(e&&e.key==="Escape"&&cfgAberto)fecharConfig(); });
}

/* =========================================================================
   FICHA DO LUTADOR — o painel que mostra a carreira acontecendo
   ========================================================================= */
const ROTULO_ATTR={slpm:"Volume",strDef:"Defesa de golpes",tdAvg:"Quedas",
  tdDef:"Defesa de queda",subAvg:"Finalizações",kdAvg:"Poder",
  durability:"Queixo",reach:"Alcance"};
const FMT_ATTR={slpm:v=>v.toFixed(2),strDef:v=>Math.round(v*100)+"%",tdAvg:v=>v.toFixed(2),
  tdDef:v=>Math.round(v*100)+"%",subAvg:v=>v.toFixed(2),kdAvg:v=>v.toFixed(2),
  durability:v=>v.toFixed(2),reach:v=>v.toFixed(0)+String.fromCharCode(34)};

/* Idade: começa em 24 e anda com a carreira. 22 lutas em ~9 anos é o ritmo de
   um cartel de UFC de verdade. */
const IDADE_INICIAL=24;
const idadeAtual=()=>IDADE_INICIAL+Math.floor(fightNo/2.4);

/* Assinatura derivada do eixo mais forte. É RÓTULO, não golpe simulado: o motor
   não tem tipos de golpe, e inventar um seria mentir para o jogador. */
function assinatura(){
  const f=lutadorEfetivo();
  const pares=[
    ["kdAvg", f.kdAvg/0.36,  me.stance==="Southpaw"?"Canhota de nocaute":"Cruzado de direita"],
    ["tdAvg", f.tdAvg/1.5,   "Queda dupla"],
    ["subAvg",f.subAvg/0.7,  "Mata-leão"],
    ["slpm",  f.slpm/3.5,    "Jab em série"],
    ["tdDef", f.tdDef/0.62,  "Sprawl de ferro"],
    ["strDef",f.strDef/0.58, "Esquiva e contra"],
  ];
  pares.sort((a,b)=>b[1]-a[1]);
  return pares[0][1]>1.05?pares[0][2]:"Sem golpe marcante";
}

/* O próximo passo para o cinturão, em linguagem de UFC. Limiares de standing
   intocados — são os mesmos que passam no testar.js. Só o texto mudou: nas
   duas últimas faixas dá pra nomear gente de verdade (RANKING), porque ali
   já são só 1-2 posições de banda. Entre 0.35 e 0.80 fica sem nome de
   propósito — com 26 empatados no peso-leve, nomear ali fingiria uma
   precisão que a escala não tem. */
function passoCinturao(){
  if(st.title)return null;
  const s=st.standing;
  if(s<0.35)return "Vencer no card preliminar até entrar no ranking dos 15";
  if(s<0.60)return "Subir no ranking encadeando vitórias contra quem está acima";
  if(s<0.80)return "Chegar ao top 5 da divisão";
  if(s<0.88){
    const nm=RANKING&&RANKING.desafiante?RANKING.desafiante.name:"um contender do top 5";
    return `Vencer ${nm} para virar desafiante`;
  }
  if(st.streakW<3)return "Emplacar 3 vitórias seguidas para receber a disputa";
  /* candidatos() garante esse nome — a carta travada ignora `fought` (ver
     lá), então nomear aqui não promete o que o mecanismo pode não entregar.
     "concedida" junta st.disputaLiberada (persistente: já foi sorteado
     favorável antes, sobrevive entre lutas) com st.tituloEstaLuta (só é
     fresco DURANTE a decisão desta luta, setado em nextFight() — ver lá);
     qualquer um dos dois já garante que a próxima disputa, quando vier, é
     contra este nome. Reconquista (perdeu o cinturão antes) nomeia
     exCampeao, não RANKING.campeao — é contra quem tirou que a disputa de
     volta acontece. */
  const nm=st.exCampeao?st.exCampeao.name:(RANKING&&RANKING.campeao?RANKING.campeao.name:"o campeão");
  const concedida=st.disputaLiberada||st.tituloEstaLuta;
  return concedida
    ? `Você é o desafiante: a disputa contra ${nm} vem na próxima luta`
    : `Você é o desafiante: a disputa contra ${nm} pode vir, ou não — lesão do campeão, política, prioridade da organização`;
}

/* A posição sai da MESMA escala que escolhe adversário: candidatos() coloca o
   jogador em standing*(N-1) na escada, então essa é a posição que o jogo já
   usa de fato, só que invisível até agora.

   Não conto "quantos têm rating maior" de propósito: rating é vitórias em 18
   simulações, então só existem ~19 valores distintos e no peso-leve 26
   lutadores empatam no mesmo número. Uma vitória faria a posição saltar 20
   lugares de uma vez e a barra de progresso viraria escada de degrau alto. */
function posicaoDivisao(s){
  if(!LADDER||!LADDER.length||!st)return null;
  const N=LADDER.length;
  const v=clamp(s==null?st.standing:s,0,1);
  return {n:N-Math.round(v*(N-1)),de:N};
}

function renderFicha(){
  const box=document.getElementById("ficha");
  if(!box||!st||!me)return;
  const passo=passoCinturao();
  const base=me.__base||{};
  const linhas=ATTR_TREINAVEIS.concat(["reach"]).map(k=>{
    const b=base[k]!=null?base[k]:me[k];
    if(b==null)return "";
    const atual=ATTR_TREINAVEIS.includes(k)?statAtual(k):b;
    const ganho=b>0?(atual/b-1):0;
    const pct=Math.max(0,Math.min(1,PCT?PCT(k,atual):0.5));
    const pctBase=Math.max(0,Math.min(1,PCT?PCT(k,b):0.5));
    /* Marcador de lesão não pode depender só de cor (vermelho já é usado por
       qualquer perda comum, de propósito — ver LEIA-ME). Negrito no NOME do
       atributo é uma segunda pista que não é cor: funciona igual pra quem
       não distingue vermelho de outra coisa. */
    const machucado=st.lesao&&st.lesao.atributo===k;
    return `<div class="atr">
      <span class="r"${machucado?' style="font-weight:800"':""}>${ROTULO_ATTR[k]||k}</span>
      <span class="v">${FMT_ATTR[k]?FMT_ATTR[k](atual):atual.toFixed(2)}${
        ganho>0.005?`<span class="g">+${Math.round(ganho*100)}%</span>`
        :ganho<-0.005?`<span class="dn">${Math.round(ganho*100)}%</span>`:""}</span>
      <span class="atrbar"><i class="base" style="width:${(pctBase*100).toFixed(0)}%"></i>
        <i class="gan" style="left:${(pctBase*100).toFixed(0)}%;width:${
          Math.max(0,(pct-pctBase)*100).toFixed(0)}%"></i>
        <i class="perda" style="left:${(pct*100).toFixed(0)}%;width:${
          Math.max(0,(pctBase-pct)*100).toFixed(0)}%"></i></span>
    </div>`;
  }).join("");

  box.innerHTML=`
    <div class="ficha-top">
      ${bonecoSVG(ROSTO||cfgPadrao(),{w:64})}
      <div class="id">
        <div class="nm">${me.name}</div>
        <div class="sub">${idadeAtual()} anos · ${st.wins}-${st.losses}</div>
        <div class="assin">${assinatura()}</div>
      </div>
    </div>
    <div class="ficha-sec">
      <h4>Cinturão</h4>
      <div class="cint"><span class="b ${st.title?"sim":"nao"}">${st.title?"Campeão":"Não"}</span>
        ${st.title?`<small>${st.defesas||0} defesa${(st.defesas||0)===1?"":"s"}</small>`:""}</div>
      ${passo?`<div class="passo">${passo}</div>`:""}
    </div>
    ${RANKING&&RANKING.campeao?`<div class="ficha-sec">
      <h4>Ranking</h4>
      <div class="rank-pico">Campeão: <b>${st.title?me.name:(st.exCampeao?st.exCampeao.name:RANKING.campeao.name)}</b></div>
    </div>`:""}
    ${(()=>{
      const rk=posicaoDivisao();
      if(!rk)return "";
      /* rankAnt é gravado antes do standing mudar, então o movimento é sempre
         o da última luta, não o acumulado. */
      const mov=st.rankAnt!=null?st.rankAnt-rk.n:0;
      const pico=posicaoDivisao(st.peak);
      return `<div class="ficha-sec">
        <h4>Posição na divisão</h4>
        <div class="rank">
          <span class="pos">#${rk.n}</span>
          <span class="de">de ${rk.de}</span>
          ${mov?`<span class="mov ${mov>0?"sobe":"cai"}">${mov>0?"&#9650;":"&#9660;"} ${Math.abs(mov)}</span>`:""}
        </div>
        ${pico&&pico.n<rk.n?`<div class="rank-pico">Melhor da carreira: #${pico.n}</div>`:""}
      </div>`;
    })()}
    ${st.lesao?`<div class="ficha-sec">
      <h4>Lesão</h4>
      <div class="lesao">
        <div class="lesao-nome">${st.lesao.nome}</div>
        <div class="lesao-mag">${ROTULO_ATTR[st.lesao.atributo]||st.lesao.atributo}
          ${Math.round((st.lesao.mult-1)*100)}%</div>
        <div class="lesao-dur">${(()=>{
          if(st.lesao.permanente)return "Lesão permanente — não cura";
          const curaNaLuta=st.lesao.desdeLuta+st.lesao.duracao;
          if(curaNaLuta>TOTAL_FIGHTS)return "Dura até o fim da carreira";
          const restam=Math.max(0,curaNaLuta-st.fightNo);
          return `Cura em ${restam} luta${restam===1?"":"s"}`;
        })()}</div>
      </div>
    </div>`:""}
    <div class="ficha-sec">
      <h4>Atributos · base e treino</h4>
      <div class="atrs">${linhas}</div>
    </div>`;
}

/* =========================================================================
   ESCOLHAS DE CARREIRA
   O jogo pedia 4 decisões no draft e depois só "próxima luta" 22 vezes.
   Agora cada luta tem duas: contra quem lutar e como se preparar.
   ========================================================================= */
/* Treino agora é PERMANENTE. Isso obriga teto e retorno decrescente: sem eles,
   22 lutas de +10% viram +700% e a calibração toda vai embora.

   Cada atributo tem um multiplicador acumulado que começa em 1.00 e satura em
   TETO_TREINO. O ganho de cada camp é proporcional ao que FALTA para o teto,
   então os primeiros treinos rendem muito e os últimos quase nada — que é como
   evolução de atleta funciona de verdade. */
const TETO_TREINO=1.26;
const CAMPS=[
 {id:"boxe",nome:"Boxe",desc:"Semanas na luva, cabeça saindo da linha.",
  ganho:"defesa de golpes e volume",
  alvos:{strDef:1.00,slpm:0.55},
  contra:["Nocauteador","Pressão","Contragolpeador"]},
 {id:"wrestling",nome:"Wrestling",desc:"Camp inteiro no tatame, sprawl e levantada.",
  ganho:"defesa de queda e quedas",
  alvos:{tdDef:1.00,tdAvg:0.60},
  contra:["Wrestler","Finalizador","Antiqueda"]},
 {id:"jiujitsu",nome:"Jiu-jitsu",desc:"Guarda, raspagem e caça de pescoço.",
  ganho:"finalizações e defesa de queda",
  alvos:{subAvg:1.00,tdDef:0.45},
  contra:["Finalizador","Wrestler"]},
 {id:"fisico",nome:"Físico",desc:"Só condicionamento e força. Aguenta e machuca.",
  ganho:"queixo e poder",
  alvos:{durability:0.85,kdAvg:0.85},
  contra:["Queixo de ferro","Completo","Nocauteador"]},
];
const ATTR_TREINAVEIS=["slpm","strDef","tdAvg","tdDef","subAvg","kdAvg","durability"];
const RITMO_TREINO=0.30;      // fração do que falta para o teto, por camp

function aplicarCamp(camp){
  st.treino=st.treino||{};
  for(const [k,peso] of Object.entries(camp.alvos)){
    const atual=st.treino[k]||1;
    const falta=TETO_TREINO-atual;
    st.treino[k]=atual+falta*RITMO_TREINO*peso;
  }
  st.campHist=st.campHist||{};
  st.campHist[camp.id]=(st.campHist[camp.id]||0)+1;
}
/* valor efetivo = base do draft × multiplicador de treino × modificadores de evento */
function statAtual(k){
  const base=(me.__base&&me.__base[k]!=null)?me.__base[k]:me[k];
  const t=(st.treino&&st.treino[k])||1;
  const ev=(st.eventoMod&&st.eventoMod[k])||1;
  return base*t*ev;
}
function lutadorEfetivo(){
  const f=Object.assign({},me);
  ATTR_TREINAVEIS.forEach(k=>{if(me[k]!=null)f[k]=statAtual(k);});
  if(f.strDef>.93)f.strDef=.93;
  if(f.tdDef>.95)f.tdDef=.95;
  return f;
}

/* CHANCE_DISPUTA não é medido — é o primeiro número pra uma mecânica nova
   (diferente de WEIGHTS/TETO_TREINO, que vieram de medição). Falta medir
   quantas lutas em média o jogador espera pela disputa depois de virar
   desafiante. Ver PENDENCIAS item 1. */
const CHANCE_DISPUTA=0.65;

/* Elegível (standing>.88 + streak 3) != disputa concedida. "Pode não vir"
   (lesão do campeão, política) é um sorteio em holdRng — nunca em rng, senão
   desloca a sequência e link de desafio antigo para de reproduzir a mesma
   carreira. Uma vez concedida fica concedida (st.disputaLiberada), não
   sorteia de novo a cada fight-decision. Defesa (st.title já true) não
   sorteia: é obrigatória, como no UFC real. */
function tituloLiberado(){
  if(st.title)return true;
  if(!(st.standing>.88&&st.streakW>=3))return false;
  if(st.disputaLiberada)return true;
  if(holdRng()<CHANCE_DISPUTA){st.disputaLiberada=true;return true;}
  return false;
}

/* três candidatos: mais fraco, parelho e acima. A diferença não é só risco —
   é quanto o ranking anda. Ganhar de quem está acima vale muito mais.

   Campeão e desafiante nº1 (RANKING) nunca aparecem aqui — são reservados
   pra luta de título/defesa forçada abaixo. Sem essa reserva, standing alto
   deixa a faixa "duro" bem em cima do topo da escada, onde o campeão está:
   ele apareceria como luta comum antes da disputa, e a disputa de verdade
   viraria revanche. */
function candidatos(){
  /* NÃO chama tituloLiberado() aqui. st.tituloEstaLuta já foi decidido em
     nextFight(), uma vez por luta, antes de existir tela ou pick automático.
     candidatos() só lê. Se o sorteio do holdRng morasse aqui, qualquer chamada
     futura a candidatos() fora de nextFight() (ou uma segunda chamada por
     engano) sortearia de novo e a chance efetiva de "a disputa vir" deixaria
     de ser CHANCE_DISPUTA por luta — passaria a depender de quantas vezes a
     função foi invocada. */
  if(st.tituloEstaLuta){
    /* A carta travada IGNORA `fought` de propósito — revanche de título é o
       caso NORMAL do UFC, não exceção. Perder pro campeão e voltar pra
       reconquistar, ou defender contra o mesmo desafiante nº1 mais de uma
       vez, é a história, não um furo. Isso já foi tentado com guard
       (`!fought.has(alvo.name)`) e quebrou: depois de qualquer disputa —
       vitória OU derrota — `lutar()` marca `fought.add(opp.name)`
       incondicional, então RANKING.campeao/desafiante ficam banidos de si
       mesmos pra sempre a partir da 1ª vez, e a reconquista caía no fallback
       comum contra um nome qualquer — o jogador ganhava o cinturão de
       alguém aleatório enquanto a ficha continuava nomeando o campeão de
       verdade. RANKING.campeao/desafiante continuam banidos das 3 BANDAS
       COMUNS (reservados, abaixo) — só este caminho travado passa por cima
       do `fought`. Repetir contra os dois nomeados é esperado e testado
       (`node testar.js interface`/`cinturao`, ver LEIA-ME "O passo para o
       cinturão" pela explicação completa); repetir contra qualquer outra
       pessoa continua sendo bug. */
    /* Defendendo, o alvo roda pelo RANKING.lista (rotação de contender —
       ver st.desafianteIdx em finishFight()); desafiando, é sempre o
       campeão nomeado, que não roda (só existe um campeão de verdade). */
    const idx=Math.min(st.desafianteIdx||1,RANKING.lista.length-1);
    const alvo=st.title?RANKING.lista[idx]:RANKING.campeao;
    if(alvo)return[{f:alvo,ganho:st.title?.10:.15}];
  }
  const N=LADDER.length;
  /* Os 16 do RANKING.lista inteiro ficam de fora das 3 bandas comuns, não só
     campeão+desafiante — com rotação, qualquer um deles pode vir a ser o
     próximo desafiante trancado; medido antes de escrever (node testar.js
     divisoes): pior caso é peso-pesado lenda, 49-16=33 sobrando pras 22
     lutas, margem de 11. */
  const reservados=new Set((RANKING&&RANKING.lista||[]).map(f=>f.name));
  /* No topo do ranking não existe "acima": a faixa perigosa colapsava num
     único adversário repetido e virava a opção MAIS fácil. Recuamos o centro
     para que as três faixas sempre tenham gente de verdade. */
  const larg=0.20;
  const c=Math.floor(Math.min(st.standing,1-larg)*(N-1));
  const faixas=[[-0.16,-0.07,0.045],[-0.03,0.03,0.075],[0.08,larg,0.125]];
  const out=[];
  for(const [lo,hi,ganho] of faixas){
    const a=Math.max(0,Math.min(N-1,c+Math.round(lo*N)));
    const b=Math.max(a,Math.min(N-1,c+Math.round(hi*N)));
    let esc=null;
    for(let t=0;t<60;t++){
      const cand=LADDER[a+Math.floor(rng()*(b-a+1))];
      if(cand&&!fought.has(cand.name)&&!reservados.has(cand.name)&&!out.some(o=>o.f.name===cand.name)){esc=cand;break;}
    }
    if(!esc){ // varre a faixa inteira antes de desistir
      for(let i=a;i<=b;i++){const cd=LADDER[i];
        if(cd&&!fought.has(cd.name)&&!reservados.has(cd.name)&&!out.some(o=>o.f.name===cd.name)){esc=cd;break;}}
    }
    /* Último recurso: o mais próximo da faixa que ainda não foi enfrentado.
       Antes isso devolvia LADDER[a] direto e, num pool apertado, devolvia alguém
       JÁ ENFRENTADO em silêncio — o modo lenda (49 lutadores no peso-pesado) fez
       isso aparecer, mas o buraco sempre esteve aqui. A varredura não consome
       rng, então link de desafio antigo continua reproduzindo a mesma carreira. */
    if(!esc)for(let r=1;r<N&&!esc;r++){
      for(const i of [a-r,b+r]){
        const cd=LADDER[i];
        if(cd&&!fought.has(cd.name)&&!reservados.has(cd.name)&&!out.some(o=>o.f.name===cd.name)){esc=cd;break;}
      }
    }
    /* só sobra se o pool for menor que a carreira, e aí a divisão nem é oferecida */
    if(!esc)esc=LADDER[Math.max(0,Math.min(N-1,a))];
    out.push({f:esc,ganho});
  }
  return out;
}

function dificuldade(opp){
  const d=(opp.rating??.5)-st.standing;
  if(d<-0.10)return{n:1,rot:"Acessível",pips:1};
  if(d<0.04) return{n:2,rot:"Parelho",pips:2};
  if(d<0.16) return{n:3,rot:"Duro",pips:3};
  return{n:4,rot:"Perigoso",pips:4};
}
function bioLutador(f){
  const t=f.titulos||{disputas:0,vitorias:0};
  const era=f.era?`${f.era[0]}–${f.era[1]}`:"—";
  const linhas=[`<b>${f.fights}</b> lutas · ${era}`];
  if(t.vitorias>0)linhas.push(`<b>${t.vitorias}</b> ${t.vitorias>1?"vitórias":"vitória"} em luta de cinturão`);
  else if(t.disputas>0)linhas.push(`disputou o cinturão <b>${t.disputas}</b>x, nunca venceu`);
  if(f.destaque)linhas.push(`${f.destaque.eixo} no <b>${Math.round(f.destaque.pct*100)}º</b> percentil`);
  return linhas.join("<br>");
}

function telaAdversario(){
  const box=document.getElementById("escolha");
  box.style.display="";
  const opts=candidatos();
  box.innerHTML=`<div class="esc-hd">Luta ${fightNo+1} de ${TOTAL_FIGHTS} — escolha o adversário</div>
    <div class="opps" id="opps"></div>`;
  const g=document.getElementById("opps");
  opts.forEach(o=>{
    const d=dificuldade(o.f);
    const b=el("button","opp d"+d.n,`
      <span class="nm">${o.f.name}</span>
      <span class="arq">${o.f.arquetipo||"—"}</span>
      <span class="bio">${bioLutador(o.f)}</span>
      <span class="dif"><span class="pips">${[1,2,3,4].map(i=>`<i class="${i<=d.pips?"on":""}"></i>`).join("")}</span>
        <b>${d.rot}</b></span>
      <span class="dif" style="border:none;padding-top:0"><span>ranking</span>
        <b>+${Math.round(o.ganho*100)}</b></span>`);
    b.onclick=()=>{SOM.toque();telaCamp(o);};
    g.appendChild(b);
  });
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function telaCamp(escolhido){
  const box=document.getElementById("escolha");
  box.innerHTML=`<div class="esc-hd">Camp para ${escolhido.f.name}</div>
    <div class="contra">Ele é <b>${escolhido.f.arquetipo||"completo"}</b>${
      escolhido.f.destaque?`, com ${escolhido.f.destaque.eixo} no <b>${Math.round(escolhido.f.destaque.pct*100)}º percentil</b> da divisão`:""}.
      Prepare o que precisa.</div>
    <div class="camps" id="camps"></div>`;
  const g=document.getElementById("camps");
  CAMPS.forEach(c=>{
    /* mostra quanto ainda RENDE: sem isso o jogador não percebe o retorno
       decrescente e continua repetindo um camp que já saturou */
    const alvos=Object.keys(c.alvos);
    const restante=alvos.reduce((s,k)=>{
      const at=(st.treino&&st.treino[k])||1;
      return s+(TETO_TREINO-at)/(TETO_TREINO-1);
    },0)/alvos.length;
    const rot=restante>.72?"rende muito":restante>.4?"ainda rende":
              restante>.15?"quase no teto":"saturado";
    const vezes=(st.campHist&&st.campHist[c.id])||0;
    const b=el("button","camp",`<span class="t">${c.nome}</span>
      <span class="d">${c.desc}</span>
      <span class="g">${c.ganho}</span>
      <span class="camp-bar"><i style="width:${Math.round(restante*100)}%"></i></span>
      <span class="camp-st">${rot}${vezes?` · feito ${vezes}x`:""}</span>`);
    b.onclick=()=>{SOM.toque();box.style.display="none";box.innerHTML="";lutar(escolhido,c);};
    g.appendChild(b);
  });
}


/* =========================================================================
   BONECO — SVG desenhado por código, sem imagem nenhuma.
   Mantém o jogo em arquivo único, escala em qualquer tamanho e acompanha as
   variáveis de cor do tema. Os adversários também têm boneco, derivado do nome
   e dos stats: se só o jogador tivesse, a tela de escolha ficaria torta.
   ========================================================================= */
/* =========================================================================
   ROSTO v2 — busto em SVG construído sobre anatomia, não sobre coordenadas
   soltas.

   O sistema anterior quebrava porque cada peça tinha número fixo no código:
   olho em x=39, boca em y=71. Trocar o formato da cabeça não movia nada disso,
   então bastava mexer numa peça para as outras saírem do lugar.

   Três decisões resolvem isso na raiz:

   1. ANCORAGEM — o objeto A descreve a anatomia (linha dos olhos, base do
      nariz, largura da mandíbula...). Toda peça se posiciona em relação a ele.
      Mudar o porte move a mandíbula e barba, orelha e queixo acompanham.

   2. SIMETRIA POR CONSTRUÇÃO — olho, sobrancelha e orelha são desenhados uma
      vez e espelhados por transform. É impossível ficarem desalinhados ou de
      tamanhos diferentes: são o mesmo desenho.

   3. RECORTE — o cabelo é cortado pela região do crânio, a barba pela região da
      mandíbula. Não conseguem invadir o rosto nem flutuar, por construção.

   Sombra e realce saem do tom de pele por cálculo, então trocar a cor mantém a
   iluminação coerente em rosto, pescoço e orelha.
   ========================================================================= */

/* ---------------------------- paletas ---------------------------- */
const PELES=["#F5D6B8","#EAC39C","#DBA878","#C08B57","#9E6B3E","#7A4E2B","#573520","#3B2317"];
const CABELOS=["#0F0C0A","#241A14","#3B2A1C","#5A3E24","#7E5A2E","#A8823F","#CBB077","#E0D2A8",
               "#8A8A8A","#CFCFCF","#8C3327","#2B3F63"];
const OLHOS_COR=["#4A2F1B","#6B4423","#8A6A3A","#4E6B4A","#3E6478","#5A6B7A","#2E2622"];
const CALCOES=["#C0392B","#1F3A6E","#1E6B4A","#7A2D8C","#B9932F","#242A36","#0F5C6B","#8C3A1E"];

const CABELO_TIPOS=["raspado","máquina","curto","social","topete","moicano","coque","dreads","longo"];
const BARBAS=["nenhuma","por fazer","bigode","cavanhaque","curta","média","cheia","costeleta"];
const OLHOS=["neutro","firme","fundo","inchado","cerrado"];
const SOBRANCELHAS=["reta","grossa","angulada","fina","partida","arqueada"];
const BOCAS=["neutra","cerrada","firme","larga","fina","protetor"];
const CICATRIZES=["nenhuma","supercílio","maçã do rosto","abaixo do olho","queixo","lábio"];
const PORTES=["magro","atlético","forte"];

/* ---------------------- cor derivada do tom de pele ----------------------
   Sombra e realce calculados a partir da base, então trocar o tom mantém a
   iluminação coerente em rosto, pescoço e orelha ao mesmo tempo. */
function mistura(hex,alvo,q){
  const h=hex.replace("#","");
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const a=alvo.replace("#","");
  const r2=parseInt(a.slice(0,2),16),g2=parseInt(a.slice(2,4),16),b2=parseInt(a.slice(4,6),16);
  const m=(x,y)=>Math.round(x+(y-x)*q).toString(16).padStart(2,"0");
  return "#"+m(r,r2)+m(g,g2)+m(b,b2);
}
const sombrear=(c,q=.22)=>mistura(c,"#241512",q);
const iluminar=(c,q=.16)=>mistura(c,"#FFF3E4",q);

/* ---------------------------- anatomia ----------------------------
   Todas as medidas em viewBox 0 0 100 120. Um único lugar. */
function anatomia(porte){
  const largura=[0,1,2].indexOf(porte)>=0?porte:1;
  const jaw=[21.5,23.5,25.5][largura];      // meia-largura da mandíbula
  return {
    cx:50,
    topo:18,                 // topo do crânio
    testa:36,                // linha da testa
    sobrancelha:44,          // linha da sobrancelha
    olhos:50,                // linha dos olhos
    nariz:60,                // base do nariz
    boca:70,                 // linha da boca
    queixo:90,               // ponta do queixo
    jaw,                     // mandíbula
    zigo:jaw+2.5,            // maçã do rosto: sempre mais larga que a mandíbula
    tempora:jaw+1.5,
    olhoDx:10.5,             // afastamento do centro (uma medida só: simetria)
    olhoRx:5.0, olhoRy:3.3,
    orelhaY:52,
    pescocoW:[9,10.5,12][largura],
    ombro:[30,35,40][largura],
  };
}

/* silhueta da cabeça derivada da anatomia: mudar o porte muda tudo junto */
function caminhoCabeca(A){
  const {cx,topo,testa,olhos,nariz,queixo,jaw,zigo,tempora}=A;
  return `M${cx-tempora} ${testa}
    C${cx-tempora} ${topo+2} ${cx-13} ${topo} ${cx} ${topo}
    C${cx+13} ${topo} ${cx+tempora} ${topo+2} ${cx+tempora} ${testa}
    C${cx+zigo} ${olhos-1} ${cx+zigo} ${nariz} ${cx+jaw} ${nariz+7}
    C${cx+jaw-1} ${queixo-11} ${cx+11} ${queixo} ${cx} ${queixo}
    C${cx-11} ${queixo} ${cx-jaw+1} ${queixo-11} ${cx-jaw} ${nariz+7}
    C${cx-zigo} ${nariz} ${cx-zigo} ${olhos-1} ${cx-tempora} ${testa}Z`;
}
/* região do crânio: recorta o cabelo. Ele não consegue invadir o rosto. */
function caminhoCranio(A){
  const {cx,topo,olhos,tempora,zigo,nariz}=A;
  return `M${cx-tempora-7} ${olhos+4}
    C${cx-tempora-7} ${topo-8} ${cx+tempora+7} ${topo-8} ${cx+tempora+7} ${olhos+4}
    C${cx+zigo} ${nariz+2} ${cx-zigo} ${nariz+2} ${cx-tempora-7} ${olhos+4}Z`;
}
/* Região da barba. A borda de baixo é o próprio contorno da mandíbula; a de
   cima sobe alto nas laterais (costeleta) e MERGULHA abaixo do nariz no centro.
   Sem esse mergulho a barba cobria o nariz, que é o erro clássico de barba
   colada por cima em vez de seguir o rosto. */
function caminhoBarbaArea(A){
  const {cx,olhos,queixo,jaw,zigo,nariz}=A;
  return `M${cx-zigo+1} ${olhos+4}
    C${cx-zigo} ${nariz+4} ${cx-jaw-1} ${queixo-9} ${cx} ${queixo-1}
    C${cx+jaw+1} ${queixo-9} ${cx+zigo} ${nariz+4} ${cx+zigo-1} ${olhos+4}
    C${cx+12} ${nariz+3} ${cx+7} ${nariz+5} ${cx} ${nariz+5}
    C${cx-7} ${nariz+5} ${cx-12} ${nariz+3} ${cx-zigo+1} ${olhos+4}Z`;
}

let _svgId=0;
function bonecoSVG(c,{w=120,alt=null}={}){
  const id="f"+(++_svgId);
  const A=anatomia((c.porte||0)%3);
  const {cx}=A;
  const pele=PELES[(c.pele||0)%PELES.length];
  const som=sombrear(pele), som2=sombrear(pele,.4), luz=iluminar(pele);
  const cab=CABELOS[(c.corCabelo||0)%CABELOS.length];
  const cabS=mistura(cab,"#000000",.28);
  const iris=OLHOS_COR[(c.corOlho||0)%OLHOS_COR.length];
  const cal=CALCOES[(c.calcao||0)%CALCOES.length];
  const linha="#171B22";
  const T=n=>CABELO_TIPOS[(c.cabelo||0)%CABELO_TIPOS.length]===n;
  const B=n=>BARBAS[(c.barba||0)%BARBAS.length]===n;
  const O=OLHOS[(c.olho||0)%OLHOS.length];
  const S=SOBRANCELHAS[(c.sobrancelha||0)%SOBRANCELHAS.length];
  const M=BOCAS[(c.boca||0)%BOCAS.length];
  const CIC=CICATRIZES[(c.cicatriz||0)%CICATRIZES.length];

  /* ---- olho: desenhado UMA vez, espelhado. Não há como desalinhar. ---- */
  const ex=cx-A.olhoDx, ey=A.olhos;
  let rx=A.olhoRx, ry=A.olhoRy, tampa="";
  if(O==="firme"){ry=2.7;}
  if(O==="cerrado"){ry=2.1;}
  if(O==="fundo"){ry=2.9;tampa=`<path d="M${ex-rx-1} ${ey+4.4} Q${ex} ${ey+6} ${ex+rx+1} ${ey+4.4}"
      stroke="${som2}" stroke-width="1.1" fill="none" opacity=".75"/>`;}
  if(O==="inchado"){ry=2.2;tampa=`<path d="M${ex-rx-1.5} ${ey+3.6} Q${ex} ${ey+6.6} ${ex+rx+1.5} ${ey+3.6}
      Q${ex} ${ey+4.4} ${ex-rx-1.5} ${ey+3.6}Z" fill="#8E4A3C" opacity=".55"/>`;}
  const olhoUm=`
    <ellipse cx="${ex}" cy="${ey}" rx="${rx}" ry="${ry}" fill="#F6F3EE"/>
    <circle cx="${ex+.4}" cy="${ey}" r="${Math.min(ry-.15,2.5)}" fill="${iris}"/>
    <circle cx="${ex+.4}" cy="${ey}" r="${Math.min(ry-.15,2.5)*.45}" fill="#12100E"/>
    <circle cx="${ex+1.5}" cy="${ey-1}" r=".8" fill="#FFFFFF" opacity=".85"/>
    <path d="M${ex-rx-.6} ${ey-.4} Q${ex} ${ey-ry-1.6} ${ex+rx+.6} ${ey-.4}"
      stroke="${linha}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    ${tampa}`;

  /* ---- sobrancelha: ancorada na linha da sobrancelha, também espelhada ---- */
  const bx=cx-A.olhoDx, by=A.sobrancelha;
  const CEJA={
    reta:`<path d="M${bx-6.5} ${by+.5} Q${bx} ${by-1.6} ${bx+6} ${by+.2}" stroke="${cabS}"
            stroke-width="3.1" fill="none" stroke-linecap="round"/>`,
    grossa:`<path d="M${bx-7} ${by+1} Q${bx} ${by-2.6} ${bx+6.5} ${by-.2}" stroke="${cabS}"
            stroke-width="5" fill="none" stroke-linecap="round"/>`,
    angulada:`<path d="M${bx-6.8} ${by-2} L${bx+6.2} ${by+1.8}" stroke="${cabS}"
            stroke-width="4" fill="none" stroke-linecap="round"/>`,
    fina:`<path d="M${bx-6} ${by+.4} Q${bx} ${by-1.4} ${bx+5.5} ${by}" stroke="${cabS}"
            stroke-width="1.9" fill="none" stroke-linecap="round"/>`,
    partida:`<path d="M${bx-6.8} ${by+.6} Q${bx-4} ${by-1.6} ${bx-1.8} ${by-1.2}" stroke="${cabS}"
            stroke-width="3.4" fill="none" stroke-linecap="round"/>
           <path d="M${bx+1.4} ${by-.6} Q${bx+4} ${by-.8} ${bx+6.2} ${by+.6}" stroke="${cabS}"
            stroke-width="3.4" fill="none" stroke-linecap="round"/>`,
    arqueada:`<path d="M${bx-6.5} ${by+1.4} Q${bx-1} ${by-3.4} ${bx+6} ${by+.4}" stroke="${cabS}"
            stroke-width="3.2" fill="none" stroke-linecap="round"/>`,
  }[S];

  /* ---- orelha: ancorada na têmpora, espelhada ---- */
  const oy=A.orelhaY, ox=cx-A.tempora;
  const orelhaUma=`
    <path d="M${ox+1} ${oy-6} C${ox-6} ${oy-7} ${ox-7} ${oy+3} ${ox-3.5} ${oy+7}
      C${ox-1} ${oy+9} ${ox+1} ${oy+7} ${ox+1} ${oy+5}Z" fill="${pele}"
      stroke="${linha}" stroke-width="1.6"/>
    <path d="M${ox-1.5} ${oy-2.5} C${ox-4} ${oy-2} ${ox-4} ${oy+2} ${ox-2.5} ${oy+4}"
      stroke="${som2}" stroke-width="1.2" fill="none" opacity=".8"/>`;

  /* ---- boca: ancorada na linha da boca ---- */
  const my=A.boca;
  const BOCA={
    neutra:`<path d="M${cx-7.5} ${my} Q${cx} ${my+2.6} ${cx+7.5} ${my}" stroke="${linha}"
              stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M${cx-6} ${my-2.4} Q${cx} ${my-3.6} ${cx+6} ${my-2.4}" stroke="${som2}"
              stroke-width="1.1" fill="none" opacity=".55"/>`,
    cerrada:`<path d="M${cx-8} ${my} L${cx+8} ${my}" stroke="${linha}" stroke-width="2.6" stroke-linecap="round"/>
             <path d="M${cx-6.5} ${my-2.6} Q${cx} ${my-4} ${cx+6.5} ${my-2.6}" stroke="${som2}"
              stroke-width="1.2" fill="none" opacity=".6"/>`,
    firme:`<path d="M${cx-8} ${my-.6} Q${cx} ${my+1.6} ${cx+8} ${my-.6}" stroke="${linha}"
              stroke-width="2.4" fill="none" stroke-linecap="round"/>`,
    larga:`<path d="M${cx-9.5} ${my} Q${cx} ${my+3} ${cx+9.5} ${my}" stroke="${linha}"
              stroke-width="2.2" fill="none" stroke-linecap="round"/>
           <path d="M${cx-7.5} ${my-2.6} Q${cx} ${my-4.2} ${cx+7.5} ${my-2.6}" stroke="${som2}"
              stroke-width="1.2" fill="none" opacity=".55"/>`,
    fina:`<path d="M${cx-6.5} ${my} Q${cx} ${my+1.6} ${cx+6.5} ${my}" stroke="${linha}"
              stroke-width="1.7" fill="none" stroke-linecap="round"/>`,
    protetor:`<path d="M${cx-8} ${my-3} Q${cx} ${my-5} ${cx+8} ${my-3}
              L${cx+7.5} ${my+2.6} Q${cx} ${my+4.6} ${cx-7.5} ${my+2.6}Z"
              fill="#DCE4EC" stroke="${linha}" stroke-width="1.2"/>
            <path d="M${cx-4} ${my-3.6} L${cx-4} ${my+3.4} M${cx} ${my-4.2} L${cx} ${my+4}
              M${cx+4} ${my-3.6} L${cx+4} ${my+3.4}" stroke="#A9B4C0" stroke-width=".9"/>`,
  }[M];

  /* ---- cabelo ----------------------------------------------------------
     A versão anterior desenhava o crânio cheio de cabelo e depois "apagava" a
     testa com uma forma cor de pele. Essa forma descia até a linha dos olhos e
     cobria olhos e sobrancelhas.

     Agora o cabelo é UM caminho fechado que sobe do lado da têmpora, passa pelo
     topo do crânio e desce do outro lado, fechando por uma LINHA DO CABELO
     desenhada explicitamente. Não existe nada para apagar, então não há como
     invadir o rosto. */
  const capa=(linhaY,forma)=>{
    const {cx,topo,tempora,olhos}=A;
    const L=cx-tempora-1.5, R=cx+tempora+1.5;
    return `M${L} ${olhos-2}
      C${L-1} ${topo+3} ${cx-13} ${topo-2} ${cx} ${topo-2}
      C${cx+13} ${topo-2} ${R+1} ${topo+3} ${R} ${olhos-2}
      L${R} ${linhaY+3} ${forma} L${L} ${linhaY+3}Z`;
  };
  const tipoCab=CABELO_TIPOS[(c.cabelo||0)%CABELO_TIPOS.length];
  const th=A.testa;                       // linha do cabelo padrão
  const CABELO={
    raspado:``,
    "máquina":`<path d="${capa(th+1,`C${cx+A.tempora-4} ${th-2} ${cx-A.tempora+4} ${th-2} ${cx-A.tempora-1.5} ${th+1}`)}"
                fill="${cab}" opacity=".45"/>`,
    curto:`<path d="${capa(th,`C${cx+A.tempora-5} ${th-4} ${cx-A.tempora+5} ${th-4} ${cx-A.tempora-1.5} ${th}`)}"
            fill="${cab}"/>`,
    social:`<path d="${capa(th-1,`C${cx+A.tempora-3} ${th-6} ${cx-6} ${th-7} ${cx-A.tempora-1.5} ${th-1}`)}"
            fill="${cab}"/>`,
    topete:`<path d="${capa(th-2,`C${cx+A.tempora-5} ${th-7} ${cx-A.tempora+5} ${th-7} ${cx-A.tempora-1.5} ${th-2}`)}"
            fill="${cab}"/>
            <path d="M${cx-9} ${th-3} Q${cx-3} ${A.topo-12} ${cx+9} ${th-6} Q${cx} ${th-6} ${cx-9} ${th-3}Z"
            fill="${cab}"/>`,
    moicano:`<path d="${capa(th+2,`C${cx+A.tempora-4} ${th} ${cx-A.tempora+4} ${th} ${cx-A.tempora-1.5} ${th+2}`)}"
             fill="${cab}" opacity=".3"/>
             <path d="M${cx-6} ${th+1} C${cx-6} ${A.topo-10} ${cx+6} ${A.topo-10} ${cx+6} ${th+1}Z"
             fill="${cab}"/>`,
    coque:`<path d="${capa(th,`C${cx+A.tempora-5} ${th-4} ${cx-A.tempora+5} ${th-4} ${cx-A.tempora-1.5} ${th}`)}"
           fill="${cab}"/>`,
    dreads:`<path d="${capa(th+1,`C${cx+A.tempora-5} ${th-3} ${cx-A.tempora+5} ${th-3} ${cx-A.tempora-1.5} ${th+1}`)}"
            fill="${cab}"/>`,
    longo:`<path d="${capa(th,`C${cx+A.tempora-5} ${th-4} ${cx-A.tempora+5} ${th-4} ${cx-A.tempora-1.5} ${th}`)}"
           fill="${cab}"/>`,
  }[tipoCab];

  /* peças que ficam FORA do crânio, desenhadas sobre o cabelo base */
  const cabeloFora=tipoCab==="coque"
    ? `<circle cx="${cx}" cy="${A.topo-7}" r="7.5" fill="${cab}" stroke="${cabS}" stroke-width="1.2"/>`
    : tipoCab==="dreads"
    ? [0,1,2,3,4,5].map(i=>{
        const lado=i<3?-1:1,k=i%3;
        const x=cx+lado*(A.tempora-1+k*3.2), y=A.olhos-6+k*2.6;
        return `<rect x="${x-2.2}" y="${y}" width="4.4" height="${16+k*6}" rx="2.2" fill="${cab}"/>`;
      }).join("")
    : tipoCab==="longo"
    ? `<path d="M${cx-A.tempora-1} ${A.testa+2} C${cx-A.zigo-5} ${A.nariz} ${cx-A.zigo-4} ${A.queixo-4}
        ${cx-A.jaw-3} ${A.queixo+4} L${cx-A.jaw+1} ${A.queixo+4}
        C${cx-A.zigo+2} ${A.nariz+2} ${cx-A.tempora+1} ${A.olhos} ${cx-A.tempora+1} ${A.testa+3}Z" fill="${cab}"/>
       <path d="M${cx+A.tempora+1} ${A.testa+2} C${cx+A.zigo+5} ${A.nariz} ${cx+A.zigo+4} ${A.queixo-4}
        ${cx+A.jaw+3} ${A.queixo+4} L${cx+A.jaw-1} ${A.queixo+4}
        C${cx+A.zigo-2} ${A.nariz+2} ${cx+A.tempora-1} ${A.olhos} ${cx+A.tempora-1} ${A.testa+3}Z" fill="${cab}"/>`
    : "";

  /* ---- barba: recortada pela mandíbula, acompanha o formato do rosto ---- */
  const areaBarba=caminhoBarbaArea(A);
  const bigode=`<path d="M${cx-7} ${my-3.4} Q${cx} ${my-6} ${cx+7} ${my-3.4}
      Q${cx} ${my-1.4} ${cx-7} ${my-3.4}Z" fill="${cab}"/>`;
  const queixinho=`<path d="M${cx-4.5} ${my+4} Q${cx} ${my+2.6} ${cx+4.5} ${my+4}
      Q${cx+4} ${A.queixo-3} ${cx} ${A.queixo-1.5} Q${cx-4} ${A.queixo-3} ${cx-4.5} ${my+4}Z" fill="${cab}"/>`;
  const manto=(op,topo)=>`<path d="${areaBarba}" fill="${cab}" opacity="${op}"
      clip-path="url(#bar${id})" transform="translate(0 ${topo})"/>`;
  const BARBA={
    nenhuma:``,
    "por fazer":`<path d="${areaBarba}" fill="${cab}" opacity=".22" clip-path="url(#bar${id})"/>`,
    bigode:bigode,
    cavanhaque:bigode+queixinho,
    curta:`<path d="${areaBarba}" fill="${cab}" opacity=".55" clip-path="url(#bar${id})"/>`+bigode,
    "média":`<path d="${areaBarba}" fill="${cab}" opacity=".8" clip-path="url(#bar${id})"/>`+bigode,
    cheia:`<path d="${areaBarba}" fill="${cab}" clip-path="url(#bar${id})"/>`+bigode,
    costeleta:`<path d="M${cx-A.tempora+1} ${A.olhos-2} L${cx-A.jaw-1} ${A.nariz+8}
        L${cx-A.jaw+4} ${A.nariz+8} L${cx-A.tempora+5} ${A.olhos-2}Z" fill="${cab}"/>
      <path d="M${cx+A.tempora-1} ${A.olhos-2} L${cx+A.jaw+1} ${A.nariz+8}
        L${cx+A.jaw-4} ${A.nariz+8} L${cx+A.tempora-5} ${A.olhos-2}Z" fill="${cab}"/>`,
  }[BARBAS[(c.barba||0)%BARBAS.length]];

  /* ---- cicatriz: segue a anatomia da região, com relevo em vez de risco ---- */
  const cicCor="#B5806E";
  const CICS={
    nenhuma:``,
    "supercílio":`<path d="M${bx-3} ${by-4} L${bx-1.5} ${by+5}" stroke="${cicCor}" stroke-width="1.8"
        stroke-linecap="round"/><path d="M${bx-3.4} ${by-2} L${bx-1} ${by-1.4}
        M${bx-2.6} ${by+2} L${bx-.4} ${by+2.6}" stroke="${cicCor}" stroke-width=".9" opacity=".8"/>`,
    "maçã do rosto":`<path d="M${cx+A.zigo-4} ${A.olhos+6} Q${cx+A.zigo-6} ${A.nariz-1} ${cx+A.jaw-5} ${A.nariz+4}"
        stroke="${cicCor}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`,
    "abaixo do olho":`<path d="M${ex-4} ${ey+6.5} L${ex+3.5} ${ey+7.6}" stroke="${cicCor}"
        stroke-width="1.7" stroke-linecap="round"/>`,
    queixo:`<path d="M${cx-3} ${A.queixo-6} L${cx+2} ${A.queixo-3}" stroke="${cicCor}"
        stroke-width="1.8" stroke-linecap="round"/>`,
    "lábio":`<path d="M${cx+3.5} ${my-4.5} L${cx+5} ${my+3}" stroke="${cicCor}"
        stroke-width="1.7" stroke-linecap="round"/>`,
  };

  const altura=alt||Math.round(w*1.2);
  return `<svg viewBox="0 0 100 120" width="${w}" height="${altura}" class="boneco" aria-hidden="true">
  <defs>
    <clipPath id="cra${id}"><path d="${caminhoCranio(A)}"/></clipPath>
    <clipPath id="bar${id}"><path d="${caminhoCabeca(A)}"/></clipPath>
    <linearGradient id="luz${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${luz}" stop-opacity=".55"/>
      <stop offset=".55" stop-color="${pele}" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ombros -->
  <path d="M${cx-A.ombro} 120 C${cx-A.ombro+4} ${104} ${cx-14} ${100} ${cx} ${99}
           C${cx+14} ${100} ${cx+A.ombro-4} ${104} ${cx+A.ombro} 120Z"
    fill="${cal}" stroke="${linha}" stroke-width="1.8"/>
  <path d="M${cx} 99 L${cx} 120" stroke="${mistura(cal,'#000000',.3)}" stroke-width="1.4"/>

  <!-- pescoço: largura vem da anatomia, encaixa sob a mandíbula -->
  <path d="M${cx-A.pescocoW} ${A.queixo-9} L${cx-A.pescocoW-1} ${A.queixo+12}
           Q${cx} ${A.queixo+16} ${cx+A.pescocoW+1} ${A.queixo+12}
           L${cx+A.pescocoW} ${A.queixo-9}Z" fill="${pele}" stroke="${linha}" stroke-width="1.7"/>
  <path d="M${cx-A.pescocoW+1} ${A.queixo-6} Q${cx} ${A.queixo+3} ${cx+A.pescocoW-1} ${A.queixo-6}"
    fill="${som}" opacity=".55"/>
  <!-- trapézio -->
  <path d="M${cx-A.ombro+3} ${106} Q${cx} ${A.queixo+8} ${cx+A.ombro-3} ${106}"
    fill="none" stroke="${mistura(cal,'#000000',.22)}" stroke-width="1.2"/>

  <!-- orelhas (espelhadas): antes da cabeça, para ficarem atrás -->
  ${orelhaUma}
  <g transform="translate(${cx*2} 0) scale(-1 1)">${orelhaUma}</g>

  <!-- cabeça -->
  <path d="${caminhoCabeca(A)}" fill="${pele}" stroke="${linha}" stroke-width="2"/>
  <path d="${caminhoCabeca(A)}" fill="url(#luz${id})"/>
  <!-- maçãs do rosto e têmporas -->
  <path d="M${cx-A.zigo+2} ${A.olhos+4} Q${cx-A.jaw+3} ${A.nariz+3} ${cx-A.jaw+7} ${A.nariz+7}"
    stroke="${som}" stroke-width="1.6" fill="none" opacity=".35"/>
  <path d="M${cx+A.zigo-2} ${A.olhos+4} Q${cx+A.jaw-3} ${A.nariz+3} ${cx+A.jaw-7} ${A.nariz+7}"
    stroke="${som}" stroke-width="1.6" fill="none" opacity=".35"/>

  ${BARBA}

  <!-- nariz: base ancorada, quebrado como o de lutador -->
  <path d="M${cx-1.5} ${A.olhos+2} L${cx-2.5} ${A.nariz-3} Q${cx-4.5} ${A.nariz} ${cx-3} ${A.nariz+1.5}
    Q${cx} ${A.nariz+2.6} ${cx+3} ${A.nariz+1.5} Q${cx+4.5} ${A.nariz} ${cx+2.5} ${A.nariz-3}
    L${cx+1.5} ${A.olhos+2}" fill="${som}" opacity=".3"/>
  <path d="M${cx-4.2} ${A.nariz+.6} Q${cx} ${A.nariz+3.2} ${cx+4.2} ${A.nariz+.6}"
    stroke="${linha}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="${cx-2.4}" cy="${A.nariz+.4}" r=".9" fill="${linha}" opacity=".7"/>
  <circle cx="${cx+2.4}" cy="${A.nariz+.4}" r=".9" fill="${linha}" opacity=".7"/>

  <!-- olhos e sobrancelhas: desenhados uma vez, espelhados -->
  ${olhoUm}
  <g transform="translate(${cx*2} 0) scale(-1 1)">${olhoUm}</g>
  ${CEJA}
  <g transform="translate(${cx*2} 0) scale(-1 1)">${CEJA}</g>

  ${BOCA}
  ${CICS[CIC]||""}

  <!-- cabelo por último, recortado pelo crânio -->
  ${CABELO}
  ${cabeloFora}
</svg>`;
}

/* Hash estável: o mesmo lutador tem sempre o mesmo rosto, em qualquer sessão. */
function hashNome(s){
  let x=2166136261>>>0;
  for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0;}
  return x;
}
function cfgPadrao(){
  return{pele:1,cabelo:2,corCabelo:1,barba:1,olho:0,corOlho:0,sobrancelha:0,
         boca:0,cicatriz:0,calcao:0,porte:1};
}
/* Não existe rosto para os lutadores do dataset, e é deliberado: eles são
   pessoas reais e retrato reconhecível é direito de imagem. Só o lutador do
   jogador tem rosto. A função que derivava rosto de lutador real foi removida
   em vez de deixada sem uso, para ninguém reintroduzir sem querer. */

/* =========================================================================
   CARD COMPARTILHÁVEL
   Desenhado em canvas 1080x1350 (retrato, formato de story e de timeline).
   O importante não é a imagem: é a semente impressa nela. Com ela, quem vê
   pode jogar a MESMA carreira — mesmas cartas, mesmos adversários — e comparar.
   ========================================================================= */
const CARD_W=1080, CARD_H=1350;
/* O canvas não enxerga as variáveis CSS, então a paleta é repetida aqui.
   Se você mexer no :root, mexa nestas também — senão o card sai com a cara
   antiga e você só descobre quando alguém compartilha. */
const C={stock:"#0A0D13",stock2:"#161E2B",ink:"#E6EBF2",stamp:"#C0392B",
         faded:"#6B7A90",rule:"#222C3C",line2:"#33415A",win:"#4E9A62",gold:"#B9932F"};

function quebrar(ctx,txt,max){
  const linhas=[];let atual="";
  for(const p of String(txt).split(" ")){
    const t=atual?atual+" "+p:p;
    if(ctx.measureText(t).width>max&&atual){linhas.push(atual);atual=p;}
    else atual=t;
  }
  if(atual)linhas.push(atual);
  return linhas;
}

async function desenharCard(g){
  const cv=document.createElement("canvas");
  cv.width=CARD_W;cv.height=CARD_H;
  const x=cv.getContext("2d");
  const M=72;                                    // margem

  x.fillStyle=C.stock;x.fillRect(0,0,CARD_W,CARD_H);
  // textura de papel: mesmas linhas horizontais da página
  x.fillStyle="rgba(255,255,255,.014)";
  for(let y=0;y<CARD_H;y+=3)x.fillRect(0,y,CARD_W,1);

  const regra=(y,esp=2,cor=C.line2)=>{x.fillStyle=cor;x.fillRect(M,y,CARD_W-M*2,esp);};
  const mono=(p,w=400)=>`${w} ${p}px "IBM Plex Mono",monospace`;
  const disp=(p,w=700)=>`${w} ${p}px Oswald,Impact,sans-serif`;

  // cabeçalho
  regra(M,4,C.line2);
  x.fillStyle=C.ink;x.font=disp(46);x.textBaseline="alphabetic";
  x.fillText("FICHA DO LUTADOR",M,M+72);
  x.fillStyle=C.faded;x.font=mono(19,500);
  const dv=(DIVISOES.find(d=>d.id===DIVISION)||{}).nome||DIVISION;
  x.fillText(dv.toUpperCase()+" · CARREIRA ENCERRADA",M,M+104);
  regra(M+126,2,C.rule);

  // nome — encolhe até caber na largura inteira, acima da linha do cartel
  let y=M+200;
  x.fillStyle=C.ink;
  let tam=76;
  do{ x.font=disp(tam); tam-=3; }while(x.measureText(me.name.toUpperCase()).width>CARD_W-M*2&&tam>30);
  x.fillText(me.name.toUpperCase(),M,y);

  // cartel grande, com o carimbo à direita centrado NELE (não no nome)
  y+=160;
  x.font=disp(148);x.fillStyle=C.ink;
  x.fillText(`${st.wins}-${st.losses}`,M,y);
  x.font=mono(21,500);x.fillStyle=C.faded;
  x.fillText("CARTEL",M+5,y+34);

  x.save();
  x.translate(CARD_W-M-76,y-52);
  x.rotate(-4*Math.PI/180);
  x.strokeStyle=C.stamp;x.lineWidth=7;
  x.strokeRect(-72,-72,144,144);
  x.fillStyle=C.stamp;x.font=disp(100);
  x.textAlign="center";x.textBaseline="middle";
  x.fillText(g.letter,0,6);
  x.restore();
  x.textAlign="left";x.textBaseline="alphabetic";

  // linhas de dados
  y+=74;
  regra(y,2,C.rule);y+=46;
  const linha=(rot,val,destaque)=>{
    x.fillStyle=C.faded;x.font=mono(21,500);
    x.fillText(rot.toUpperCase(),M,y);
    x.fillStyle=destaque?C.stamp:C.ink;x.font=mono(25,600);
    x.textAlign="right";x.fillText(String(val),CARD_W-M,y);
    x.textAlign="left";
    x.fillStyle=C.rule;x.fillRect(M,y+15,CARD_W-M*2,1);
    y+=53;
  };
  linha("Pico no ranking",fmtPico(st.peak));
  linha("Vitórias antes do fim",`${st.finishes} de ${st.wins}`);
  linha("Maior sequência",`${st.longestW} vitórias`);
  linha("Seguidores",fmtNum(st.followers));
  linha("Medidor de fã",st.fan.toFixed(1)+" / 10");
  linha("Cinturão",st.title?"SIM":"não",st.title);
  if(st.bonusNoite)linha("Bônus da noite",`Luta ${st.bonusNoite.luta}`,true);

  // legado — é a carga emocional do card, ganha o espaço que sobra
  y+=34;
  x.font=`italic 28px "IBM Plex Mono",monospace`;
  const leg=LEGACY.find(l=>l.when(st)).t(me.name);
  const ls=quebrar(x,leg,CARD_W-M*2-32).slice(0,4);
  x.fillStyle=C.stamp;x.fillRect(M,y-30,5,ls.length*40+14);
  x.fillStyle=C.ink;                       // canvas mantém o último fillStyle
  ls.forEach((l,i)=>x.fillText(l,M+28,y+i*40));
  y+=ls.length*40+46;

  // feito de
  x.fillStyle=C.faded;x.font=mono(20,500);
  x.fillText("ESSE LUTADOR ERA FEITO DE",M,y);y+=34;
  x.fillStyle=C.ink;x.font=mono(22,500);
  quebrar(x,picks.map(p=>`${p.pair.label} do ${p.from}`).join("  ·  "),CARD_W-M*2)
    .slice(0,3).forEach(l=>{x.fillText(l,M,y);y+=31;});

  // rodapé: a semente é a parte que importa
  const yf=CARD_H-M-86;
  regra(yf,4,C.line2);
  x.fillStyle=C.ink;x.font=mono(24,600);
  x.fillText("MESMA CARREIRA, SUAS ESCOLHAS",M,yf+46);
  x.fillStyle=C.stamp;x.font=mono(26,600);
  x.textAlign="right";
  x.fillText("#"+SEED.toString(36).toUpperCase(),CARD_W-M,yf+46);
  x.fillStyle=C.faded;x.font=mono(19,400);
  x.fillText(location.host||"ficha do lutador",CARD_W-M,yf+76);
  x.textAlign="left";
  return cv;
}

/* rótulo curto pro carimbo do card de momento — mesma caixa rotativa do
   desenharCard, só que com uma etiqueta de 1-2 palavras em vez da nota A-F
   (nota não faz sentido pra carreira em andamento). */
const ROTULO_MOMENTO={cinturao:"CAMPEÃO",cinturaoPerdido:"PERDEU",
  ko:"NOCAUTE",raro:"RARO",upset:"ZEBRA",lesao:"MACHUCADO"};

async function desenharCardMomento(m){
  const cv=document.createElement("canvas");
  cv.width=CARD_W;cv.height=CARD_H;
  const x=cv.getContext("2d");
  const M=72;

  x.fillStyle=C.stock;x.fillRect(0,0,CARD_W,CARD_H);
  x.fillStyle="rgba(255,255,255,.014)";
  for(let y=0;y<CARD_H;y+=3)x.fillRect(0,y,CARD_W,1);

  const regra=(y,esp=2,cor=C.line2)=>{x.fillStyle=cor;x.fillRect(M,y,CARD_W-M*2,esp);};
  const mono=(p,w=400)=>`${w} ${p}px "IBM Plex Mono",monospace`;
  const disp=(p,w=700)=>`${w} ${p}px Oswald,Impact,sans-serif`;

  regra(M,4,C.line2);
  x.fillStyle=C.ink;x.font=disp(46);x.textBaseline="alphabetic";
  x.fillText("MOMENTO DA CARREIRA",M,M+72);
  x.fillStyle=C.faded;x.font=mono(19,500);
  const dv=(DIVISOES.find(d=>d.id===DIVISION)||{}).nome||DIVISION;
  x.fillText(dv.toUpperCase()+` · LUTA ${m.luta} DE ${TOTAL_FIGHTS}`,M,M+104);
  regra(M+126,2,C.rule);

  let y=M+200;
  x.fillStyle=C.ink;
  let tam=76;
  do{ x.font=disp(tam); tam-=3; }while(x.measureText(me.name.toUpperCase()).width>CARD_W-M*2&&tam>30);
  x.fillText(me.name.toUpperCase(),M,y);

  y+=160;
  x.font=disp(148);x.fillStyle=C.ink;
  x.fillText(m.cartel,M,y);
  x.font=mono(21,500);x.fillStyle=C.faded;
  x.fillText("CARTEL NA HORA",M+5,y+34);

  x.save();
  x.translate(CARD_W-M-76,y-52);
  x.rotate(-4*Math.PI/180);
  x.strokeStyle=C.stamp;x.lineWidth=7;
  x.strokeRect(-72,-72,144,144);
  x.fillStyle=C.stamp;
  const rot=ROTULO_MOMENTO[m.tipo]||"MOMENTO";
  let tamR=48;
  do{ x.font=disp(tamR); tamR-=3; }while(x.measureText(rot).width>128&&tamR>18);
  x.textAlign="center";x.textBaseline="middle";
  x.fillText(rot,0,6);
  x.restore();
  x.textAlign="left";x.textBaseline="alphabetic";

  // bloco de dados: 3 linhas fixas, nem mais nem menos — cartel já apareceu
  // grande acima, então não repete aqui. Crescer essa lista vira planilha
  // (ver LEIA-ME "Card de momento"); se o card ainda parecer vazio, o
  // ajuste é a frase, não mais linha.
  y+=74;
  regra(y,2,C.rule);y+=46;
  const linha=(rot,val)=>{
    x.fillStyle=C.faded;x.font=mono(21,500);
    x.fillText(rot.toUpperCase(),M,y);
    x.fillStyle=C.ink;x.font=mono(25,600);
    x.textAlign="right";x.fillText(String(val),CARD_W-M,y);
    x.textAlign="left";
    x.fillStyle=C.rule;x.fillRect(M,y+15,CARD_W-M*2,1);
    y+=53;
  };
  if(m.adversario)linha("Adversário",m.adversario);
  if(m.resultado)linha("Resultado",m.resultado);
  if(m.posicao)linha("Posição na divisão",m.posicao);
  y+=34;

  // frase — mesma carga emocional do LEGACY no card de fim de carreira
  x.font=`italic 30px "IBM Plex Mono",monospace`;
  const ls=quebrar(x,m.frase,CARD_W-M*2-32).slice(0,5);
  x.fillStyle=C.stamp;x.fillRect(M,y-30,5,ls.length*42+14);
  x.fillStyle=C.ink;
  ls.forEach((l,i)=>x.fillText(l,M+28,y+i*42));

  const yf=CARD_H-M-86;
  regra(yf,4,C.line2);
  x.fillStyle=C.ink;x.font=mono(24,600);
  x.fillText("MESMA CARREIRA, SUAS ESCOLHAS",M,yf+46);
  x.fillStyle=C.stamp;x.font=mono(26,600);
  x.textAlign="right";
  x.fillText("#"+SEED.toString(36).toUpperCase(),CARD_W-M,yf+46);
  x.fillStyle=C.faded;x.font=mono(19,400);
  x.fillText(location.host||"card de momento",CARD_W-M,yf+76);
  x.textAlign="left";
  return cv;
}

/* Abre por cima de tudo, sem tocar em playing/auto/dilemaAberto — o
   automático continua rodando por baixo se o jogador não fechar. */
async function abrirPainelMomentos(){
  const p=document.getElementById("painelMomentos");
  p.innerHTML="";

  box.appendChild(el("h3","",`Cards da carreira (${st.momentos.length})`));

    box.appendChild(el("p","vazio","Nenhum momento marcante ainda."));
  }else{
    for(const m of st.momentos){
      const item=el("div","momento-item");
      /* miniatura: o mesmo canvas do card de verdade, reduzido — sem prévia
         o jogador só descobre o que vai postar depois de baixar. */
      try{
        const cv=await desenharCardMomento(m);
        const thumbW=140,thumbH=Math.round(thumbW*CARD_H/CARD_W);
        const mini=document.createElement("canvas");
        mini.width=thumbW;mini.height=thumbH;mini.className="momento-mini";
        mini.getContext("2d").drawImage(cv,0,0,thumbW,thumbH);

function urlDesafio(){
  const base=location.origin+location.pathname;
  /* O modo entra no link porque ele troca o pool: a mesma semente em modos
     diferentes dá cartas e adversários diferentes. Link antigo, sem m=, cai em
     "normal" — que é o que ele sempre foi. */
  return `${base}?d=${DIVISION}&s=${SEED.toString(36)}${MODO==="lenda"?"&m=lenda":""}`;
}

async function compartilhar(g,btn,desenhar=desenharCard){
  btn.disabled=true;const antes=btn.textContent;btn.textContent="Gerando…";
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const cv=await desenhar(g);
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    const arq=new File([blob],`${me.name.replace(/\s+/g,"-").toLowerCase()}.png`,{type:"image/png"});
    /* g.frase só existe no card de momento (desenharCardMomento); g.letter
       só no de fim de carreira (desenharCard) — texto do compartilhamento
       segue o mesmo duck-typing em vez de mais um parâmetro. */
    const texto=g.frase
      ?`${me.name}: ${g.frase} Joga a mesma carreira:`
      :`${me.name}: ${st.wins}-${st.losses}, nota ${g.letter}. Joga a mesma carreira:`;
    if(navigator.canShare&&navigator.canShare({files:[arq]})){
      await navigator.share({files:[arq],text:texto,url:urlDesafio()});
    }else{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);a.download=arq.name;a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    }
  }catch(e){ btn.textContent="Não deu"; setTimeout(()=>{btn.textContent=antes;btn.disabled=false;},1800); return; }
  btn.textContent=antes;btn.disabled=false;
}

   INTERFACE
   ========================================================================= */
const app=document.getElementById("app");
const docmeta=document.getElementById("docmeta");
let ROSTER=null,POOL=null,PCT=null,LADDER=null,RANKING=null;
let me=null,picks=[],st=null,rng=null,holdRng=null,fraseRng=null,usedEvents=null,rareUsed=null,fought=null;
let budgetLeft=0,remaining=[],fightNo=0,auto=false,autoTimer=null;
let speed=1,playing=false,playTimer=null;
/* Dilema aberto trava TUDO. O bug era eu desabilitar só o "Próxima luta":
   clicar no automático chamava nextFight por cima do dilema, a promessa nunca
   resolvia e a carreira travava de vez. */
let dilemaAberto=false;
let escolhaAberta=false;
const TOTAL_FIGHTS=22,SPEEDS=[1,2,4];
let DIVISION="lightweight";
let SEED=0;
let ROSTO=null;
/* Uma carreira são 22 lutas sem repetir adversário, então divisão com menos de
   40 lutadores não fecha. O peso-pena feminino tem 5 e fica de fora. */
const MIN_LUTADORES=40;

/* ---------- modo de jogo ----------
   "lenda" troca o pool INTEIRO — draft e adversários — por campeões e nomes
   grandes. Lenda é quem já disputou cinturão OU está no topo do rating.

   O corte é 13/18 escrito assim, e não 0.72, porque rating é vitórias em 18
   simulações: os únicos valores que existem são múltiplos de 1/18. Escrever
   "0.70" pegaria exatamente o mesmo conjunto que "0.67" e esconderia que a
   escala é discreta. Medido: esse corte deixa 32% a 43% de cada divisão.

   Nem toda divisão fecha nesse modo. Uma carreira são 22 lutas sem repetir
   adversário, e peso-mosca (32 lendas) e as três divisões femininas
   (15 a 25) ficam abaixo de MIN_LUTADORES. Elas somem do modo lenda em vez de
   entrar e repetir adversário no meio da carreira. */
const RATING_LENDA=13/18;
const ehLenda=f=>(f.titulos&&f.titulos.disputas>=1)||f.rating>=RATING_LENDA-1e-9;
let MODO="normal";
function poolDivisao(id,modo){
  const p=ROSTER?ROSTER.filter(f=>f.division===id):[];
  return (modo||MODO)==="lenda"?p.filter(ehLenda):p;
}

/* Campeão nomeado. Critério é conquista (titulos.vitorias/disputas), não
   rating: rating é vitórias em 18 simulações, só existem ~19 valores
   distintos e no peso-leve 26 lutadores empatam — não dá pra nomear ninguém
   com isso. Estático, deriva só do dataset: nenhuma carreira de NPC é
   simulada (o cinturão só troca de mãos com o jogador; ver PENDENCIAS 1b).

   Recência entra como BUCKET, não como corte: quem não luta há
   CUTOFF_RANKING anos cai pro fim da lista em vez de sumir dela, senão o
   peso-pesado "atual" seria o Randy Couture. Medido nas 11 divisões × 2
   modos com esse corte de 6 anos: nenhum campeão sai com zero título, e o
   modo lenda nomeia os mesmos campeões do modo normal (ehLenda nunca
   derruba quem já é campeão). Sem fallback — não é caso que acontece. */
let CUTOFF_RANKING=null;
function buildRanking(pool){
  const comparar=(a,b)=>
    (b.titulos.vitorias-a.titulos.vitorias)||
    (b.titulos.disputas-a.titulos.disputas)||
    (b.fights-a.fights);
  const ativos=pool.filter(f=>f.era&&f.era[1]>=CUTOFF_RANKING).sort(comparar);
  const inativos=pool.filter(f=>!f.era||f.era[1]<CUTOFF_RANKING).sort(comparar);
  const lista=[...ativos,...inativos].slice(0,16);
  return{campeao:lista[0]||null,desafiante:lista[1]||null,lista};
}
const DIVISOES=[
 {id:"flyweight",        nome:"Peso-mosca",      lbs:125},
 {id:"bantamweight",     nome:"Peso-galo",       lbs:135},

 {id:"welterweight",     nome:"Meio-médio",      lbs:170},
 {id:"middleweight",     nome:"Peso-médio",      lbs:185},
 {id:"light_heavyweight",nome:"Meio-pesado",     lbs:205},
 {id:"heavyweight",      nome:"Peso-pesado",     lbs:265},
 {id:"w_strawweight",    nome:"Peso-palha",      lbs:115,f:true},
 {id:"w_flyweight",      nome:"Peso-mosca",      lbs:125,f:true},
 {id:"w_bantamweight",   nome:"Peso-galo",       lbs:135,f:true},
 {id:"w_featherweight",  nome:"Peso-pena",       lbs:145,f:true},
];
const reduceMotion=()=>window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;
  if(h!==undefined)n.innerHTML=h;return n;};
/* 5 faixas: o jogador precisa bater o olho e saber se é bom, sem fazer conta */
const pctClass=p=>p>=.80?"p5":p>=.60?"p4":p>=.40?"p3":p>=.20?"p2":"p1";
const pctLabel=p=>{const n=Math.round(p*100);
  if(n>=90)return n+"% — elite";
  if(n>=70)return n+"% — forte";
  if(n>=45)return n+"% — mediano";
  if(n>=25)return n+"% — fraco";
  return n+"% — ruim";};
const pctBar=p=>`<span class="pctwrap ${pctClass(p)}">
  <span class="pctbar"><i style="width:${Math.max(2,Math.round(p*100))}%"></i></span>
  <span class="pctnum">${pctLabel(p)}</span></span>`;

/* ---------- carregar dados ---------- */
async function boot(){
  /* "Abriu o jogo" — evento 1 de 4 do funil (PLANO-LANCAMENTO.md, fase 0).
     Primeira linha de propósito: conta toda visita, mesmo as que falham
     depois (fetch do fighters.json caindo em askForFile()) — "abriu" não
     deveria depender de nada dar certo depois. */
  evento("abriu");
  app.innerHTML=`<p class="hint" style="margin-top:30px">Carregando os lutadores…</p>`;
  let data=null;
  try{
    const r=await fetch("./fighters.json");
    if(!r.ok)throw 0;
    data=await r.json();
  }catch(e){ return askForFile(); }
  ready(data);
}
function askForFile(){
  app.innerHTML="";
  const box=el("div","err",`<b>Não achei o fighters.json</b>
    O navegador bloqueia leitura de arquivo local quando a página é aberta direto.
    Rode um servidor na pasta do projeto:<br><br>
    <code>python3 -m http.server 8000</code><br><br>
    e abra <code>http://localhost:8000</code>. Ou escolha o arquivo aqui:`);
  const inp=el("input");inp.type="file";inp.accept=".json";
  inp.style.marginTop="12px";
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{ ready(JSON.parse(await f.text())); }
    catch(err){ box.appendChild(el("p","hint","Esse arquivo não é um fighters.json válido.")); }
  };
  box.appendChild(inp);app.appendChild(box);
}
function ready(data){
  app.innerHTML=`<p class="hint" style="margin-top:30px">Avaliando ${data.length} lutadores…</p>`;
  setTimeout(()=>{
    ROSTER=rateAll(data);
    CUTOFF_RANKING=Math.max(...ROSTER.map(f=>f.era?f.era[1]:0))-6;
    POOL=poolDivisao(DIVISION);
    PCT=makePercentiler(POOL);
    LADDER=[...POOL].sort((a,b)=>a.rating-b.rating);
    RANKING=buildRanking(POOL);
    screenName();
  },30);
}

/* ---------- tela 1: nome ---------- */
/* ?d=divisao&s=semente vira desafio: mesma carreira, escolhas suas */
function lerDesafio(){
  try{
    const p=new URLSearchParams(location.search);
    const d=p.get("d"), s=p.get("s");
    if(!d||!s)return null;
    if(!DIVISOES.some(x=>x.id===d))return null;
    const n=parseInt(s,36);
    if(!Number.isFinite(n)||n<=0)return null;
    return{div:d,seed:n>>>0,modo:p.get("m")==="lenda"?"lenda":"normal"};
  }catch(e){return null;}
}
function screenName(){
  app.innerHTML="";
  const desafio=lerDesafio();
  app.appendChild(el("div","eyebrow",desafio?"Você foi desafiado":"Abertura de registro"));
  if(desafio){
    const d=DIVISOES.find(x=>x.id===desafio.div);
    app.appendChild(el("div","legend",
      `Alguém mandou a carreira dele pra você. <b>${d.nome}</b>${
        desafio.modo==="lenda"?", no modo <b>Seja uma lenda</b>":""}, as mesmas
       cartas no draft e os mesmos adversários na mesma ordem. Só as escolhas
       são suas.`));
  }
  const p=el("p","",`Todo lutador começa com um nome numa ficha. Depois disso é só o que ele faz no octógono.`);
  const inp=el("input");inp.type="text";inp.placeholder="Nome do lutador";inp.maxLength=28;
  const row=el("div","row");
  const go=el("button","btn","Montar o lutador");
  go.onclick=()=>{
    const n=inp.value.trim();
    if(!n){inp.focus();return;}
    const dz=lerDesafio();
    try{const r=localStorage.getItem("rosto");if(r)ROSTO=JSON.parse(r);}catch(e){}
    if(dz){DIVISION=dz.div;SEED=dz.seed;MODO=dz.modo;screenCriador(n);}
    else{SEED=0;MODO="normal";screenCriador(n);}
  };
  inp.onkeydown=e=>{if(e.key==="Enter")go.click();};
  row.appendChild(go);
  app.append(p,inp,row);
  inp.focus();
}

        const b=tipo==="cor"
          ? el("button","sw"+(ROSTO[campo]===i?" on":""),"")
          : el("button","chip"+(ROSTO[campo]===i?" on":""),item);
        if(tipo==="cor")b.style.background=item;
        b.onclick=()=>{
          ROSTO[campo]=i;SOM.toque();
          g.querySelectorAll(tipo==="cor"?".sw":".chip")
            .forEach((x,j)=>x.classList.toggle("on",j===i));
          const v=bloco.querySelector("#v_"+campo);
          if(v&&tipo==="lista")v.textContent=item;
          desenha();
        };
        g.appendChild(b);
      });
    });
  }

  const rostoAleatorio=()=>{
    const r=n=>Math.floor(Math.random()*n);
    return{pele:r(PELES.length),cabelo:r(CABELO_TIPOS.length),corCabelo:r(CABELOS.length),
      barba:r(BARBAS.length),olho:r(OLHOS.length),corOlho:r(OLHOS_COR.length),
      sobrancelha:r(SOBRANCELHAS.length),boca:r(BOCAS.length),
      cicatriz:r(CICATRIZES.length),calcao:r(CALCOES.length),porte:r(3)};
  };
  const dz=lerDesafio();
  /* pular() e ok.onclick avançam pro mesmo lugar — pular só decide o rosto
     por sorteio em vez de deixar o jogador escolher. PLANO-LANCAMENTO.md
     fase 2: quem clicou no anúncio tem uns 3 minutos, não 40; customizar 9
     componentes antes da primeira luta é exatamente o tipo de passo que
     sobra pra quem quer, e trava quem não quer. */
  const avancar=()=>{
    const ni=document.getElementById("nomeIn");
    const n=(ni?ni.value:name||"").trim();
    if(!n){if(ni)ni.focus();return;}
    SOM.toque();
    try{localStorage.setItem("rosto",JSON.stringify(ROSTO));}catch(e){}
    if(dz){DIVISION=dz.div;SEED=dz.seed;MODO=dz.modo;startDraft(n);}
    else screenDivisao(n);
  };

  const row=el("div","row");
  const rand=el("button","btn btn-ghost","Sortear");
  rand.onclick=()=>{SOM.toque();ROSTO=rostoAleatorio();desenha();corpo();};
  const pular=el("button","btn btn-ghost","Pular");
  pular.onclick=()=>{ROSTO=rostoAleatorio();evento("pulou_criador");avancar();};
  const ok=el("button","btn",dz?"Começar a carreira":"Escolher divisão");
  ok.onclick=avancar;
  row.append(ok,rand,pular);app.appendChild(row);
  desenha();corpo();
}

const MODOS=[
 {id:"normal",nome:"Carreira",
  desc:"A divisão inteira. Você começa no card preliminar e sobe."},
 /* O texto NÃO promete "mais difícil" porque a medição não confirma: o pool de
    lendas te dá um lutador melhor na mesma proporção em que dá adversários
    melhores. Muda quem entra no octógono, não o placar. */
 {id:"lenda", nome:"Seja uma lenda",
  desc:"Campeões e ex-desafiantes, no draft e do outro lado do octógono."},
];
function screenDivisao(name){
  app.innerHTML="";
  docmeta.textContent=`Registro · ${name}`;
  app.appendChild(el("div","eyebrow","Em que divisão você vai lutar"));
  app.appendChild(el("p","","A divisão muda tudo: quem você enfrenta, quanto se nocauteia e o quanto o seu queixo aguenta. Peso-pesado acaba luta cedo; mosca vai pros cartões."));
  /* O modo vem ANTES da divisão porque é ele que decide quantos lutadores cada
     divisão tem — e quais delas deixam de fechar 22 lutas sem repetir. */
  const modos=el("div","modos");
  const nota=el("p","modo-nota","");
  const grid=el("div","divs");
  app.append(modos,nota,grid);

  const desenha=()=>{
    modos.innerHTML="";
    MODOS.forEach(m=>{
      const b=el("button","modo"+(MODO===m.id?" on":""),
        `<span class="n">${m.nome}</span><span class="d">${m.desc}</span>`);
      b.id="modo_"+m.id;
      b.onclick=()=>{ if(MODO===m.id)return; SOM.toque(); MODO=m.id; desenha(); };
      modos.appendChild(b);
    });

    grid.innerHTML="";
    const fora=[];
    DIVISOES.forEach(d=>{
      /* divisão pequena demais no dataset inteiro nunca foi jogável */
      if(ROSTER.filter(f=>f.division===d.id).length<MIN_LUTADORES)return;
      const pool=poolDivisao(d.id);
      if(pool.length<MIN_LUTADORES){
        fora.push(`${d.nome}${d.f?" fem.":""} (${pool.length})`);
        return;
      }
      const top=[...pool].sort((a,b)=>b.rating-a.rating)[0];
      const ko=TUNING.koPower[d.id];
      const c=el("button","div-c"+(d.f?" fem":""),
        `<span class="n">${d.nome}</span>
         <span class="lb">até ${d.lbs} lb · ${ko>=1.3?"nocaute alto":ko>=.9?"nocaute médio":"nocaute baixo"}</span>
         <span class="qt"><b>${pool.length}</b> ${MODO==="lenda"?"lendas":"lutadores"}</span>
         <span class="top">o melhor daqui é ${top.name}</span>`);
      c.onclick=()=>{SOM.toque();DIVISION=d.id;startDraft(name);};
      grid.appendChild(c);
    });

    nota.innerHTML=fora.length
      ? `Uma carreira são 22 lutas sem repetir adversário, então divisão com menos
         de ${MIN_LUTADORES} lendas não fecha. Fora daqui: ${fora.join(" · ")}.`
      : "";
  };
  desenha();
}
function startDraft(name){
  /* refeito a cada carreira porque a divisão OU o modo podem ter mudado */
  POOL=poolDivisao(DIVISION);
  PCT=makePercentiler(POOL);
  LADDER=[...POOL].sort((a,b)=>a.rating-b.rating);
  RANKING=buildRanking(POOL);
  /* A semente controla TUDO que é sorteado: as cartas oferecidas no draft, os
     adversários e a ordem deles. Duas pessoas com a mesma semente recebem a
     mesma carreira e só diferem nas escolhas. É isso que torna o link um
     desafio de verdade em vez de um print. */
  SEED=SEED||((Math.random()*4294967295)>>>0);
  rng=mulberry32(SEED);
  /* Stream separado pra "a disputa pode não vir": nunca consome do rng
     principal, senão qualquer sorteio aqui deslocaria a sequência e link de
     desafio antigo pararia de reproduzir a mesma carreira. */
  holdRng=mulberry32((SEED^0x9E3779B9)>>>0);
  /* Mesmo motivo do holdRng, stream próprio: sorteia qual frase neutra do
     fallback local aparece, sem tocar no rng principal — senão qualquer
     dilema cortado localmente deslocaria a sequência e o link de desafio
     pararia de reproduzir a mesma carreira. */
  fraseRng=mulberry32((SEED^0x1234ABCD)>>>0);
  me={name,division:DIVISION};picks=[];
  budgetLeft=TOTAL_WEIGHT*BUDGET_PCT;
  remaining=[...PAIRS];
  docmeta.textContent=`Registro · ${name}`;
  renderDraft();
}
/* Os 8 atributos ocupam os 8 lados do octógono, e cada par preenche dois lados
   VIZINHOS. O encaixe é exato — não é decoração adaptada. */
const SLOTS=[
 {k:"slpm",       lab:"Volume",    par:"trocacao", ang:-90},
 {k:"reach",      lab:"Alcance",   par:"trocacao", ang:-45},
 {k:"kdAvg",      lab:"Poder",     par:"poder",    ang:0},
 {k:"durability", lab:"Queixo",    par:"poder",    ang:45},
 {k:"tdAvg",      lab:"Quedas",    par:"chao",     ang:90},
 {k:"tdDef",      lab:"Def. queda",par:"chao",     ang:135},
 {k:"subAvg",     lab:"Finaliz.",  par:"jiujitsu", ang:180},
 {k:"strDef",     lab:"Def. golpe",par:"jiujitsu", ang:225},
];
const FMT={slpm:v=>v.toFixed(1),reach:v=>v.toFixed(0)+'"',kdAvg:v=>v.toFixed(2),
  durability:v=>v.toFixed(2),tdAvg:v=>v.toFixed(1),tdDef:v=>Math.round(v*100)+"%",
  subAvg:v=>v.toFixed(1),strDef:v=>Math.round(v*100)+"%"};

function octogonoSVG(){
  const p=[];
  for(let i=0;i<8;i++){const a=(i*45-67.5)*Math.PI/180;
    p.push(`${50+41*Math.cos(a)},${50+41*Math.sin(a)}`);}
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="${p.join(" ")}" fill="none" stroke="var(--line2)" stroke-width="1.1"/>
    <polygon points="${p.join(" ")}" fill="none" stroke="var(--line)" stroke-width="6"
      transform="translate(50 50) scale(.72) translate(-50 -50)"/>
    <polygon points="${p.join(" ")}" fill="none" stroke="var(--line)" stroke-width=".5"
      transform="translate(50 50) scale(.46) translate(-50 -50)"/></svg>`;
}
let parRecem=null;
function desenhaOctogono(destacar){
  const w=document.getElementById("oct");
  if(!w)return;
  const feitos=picks.length, total=4;
  w.innerHTML=octogonoSVG()+
    `<div class="oct-mid"><div class="n">${feitos}<span style="font-size:17px;color:var(--faded)">/${total}</span></div>
      <div class="l">montado</div><div class="b"><i style="width:${feitos/total*100}%"></i></div></div>`;
  SLOTS.forEach(s=>{
    const a=s.ang*Math.PI/180;
    const x=50+38*Math.cos(a), y=50+38*Math.sin(a);
    const v=me[s.k];
    const cheio=v!=null;
    const origem=(picks.find(p=>p.pair.id===s.par)||{}).from||"";
    const d=document.createElement("div");
    /* A fixada tem que rodar UMA vez, quando o par acaba de ser escolhido.
       Como esta função roda a cada passada de mouse, sem a flag ela reanimava
       atributos já preenchidos toda hora. */
    d.className="slot"+(cheio?" cheio":"")+(destacar===s.par?" mira":"")+
      (parRecem===s.par?" novo":"");
    d.style.left=x+"%"; d.style.top=y+"%";
    d.innerHTML=`<span class="lab">${s.lab}</span>
      <span class="val">${cheio?FMT[s.k](v):"—"}</span>
      <span class="src">${cheio?origem:"vazio"}</span>`;
    w.appendChild(d);
  });
  parRecem=null;                 // consumida: não reanima nas próximas passadas
}

function renderDraft(){
  app.innerHTML="";
  app.appendChild(el("div","eyebrow",

     naquele atributo. Passe o mouse numa carta para ver os dois lados que ela preenche.`));

function pick(r){
  me[r.pair.a.key]=r.src[r.pair.a.key];
  me[r.pair.b.key]=r.src[r.pair.b.key];
  [r.pair.a.key,r.pair.b.key].forEach(k=>(RIDERS[k]||[]).forEach(rk=>me[rk]=r.src[rk]));
  budgetLeft-=r.cost;
  picks.push({pair:r.pair,from:r.src.name});
  parRecem=r.pair.id;SOM.fixa();
  remaining=remaining.filter(p=>p.id!==r.pair.id);
  if(remaining.length)renderDraft(); else startCareer();
}

     startCareer() só roda quando as 4 cartas já foram escolhidas
