  marcarMemoriaEntreCarreiras("memDilemaFallback",d.titulo,MEM_DILEMA_LOCAL);
  return d;
}

/* O lim() trava número que a IA devolve; isto trava TEXTO no mesmo espírito
   — a IA nunca é dependência. O desfecho do dilema é sobre a vida FORA do
   octógono; nenhum resultado de luta é dela pra afirmar, quem decide isso é
   o motor (ver api/ai.js, prompt de "julgar"). Corta só a FRASE que ofende,
   não o desfecho inteiro — perder a narração toda por causa de uma frase
   sai caro. CONTEXTO_TREINO existe porque um dilema pode ser sobre sparring
   ou o desempenho de outra pessoa (parceiro de treino, adversário no
   passado) sem afirmar nada da carreira do jogador — "nocauteou o parceiro
   no sparring" não pode cair aqui. Medido em 40 desfechos reais da IA: 5%
   das frases batem, sem falso positivo nos casos de terceiro.

   Dois buracos achados jogando, fechados depois: "venceu por KO" (sem a
   palavra nocaute) e "o médico parou a luta"/"a médica interrompeu"
   (resultado afirmado sem a palavra árbitro). `ko` sozinho na alternação
   basta — o \b da regex inteira já impede grudar em outra palavra ("KOch"
   não bate). O padrão de médico é restrito a "parou/interrompeu/
   encerrou/deteve" logo depois, de propósito — "menção a médico" sozinha
   sem isso (curativo de rotina, check-up) não pode virar corte.
   `node testar.js resultado` cobre os dois buracos e 6 controles. */
const RESULTADO_LUTA=/\b(nocaute\w*|ko|finaliz\w*(ou|ad[oa])|foi parad[oa] pelo árbitro|médic[oa]\s+(da comissão\s+)?(parou|interrompeu|encerrou|deteve)|perdeu (a luta|o combate) por|venceu (a luta|o combate) por|(saiu|saí)\s+d[oa]\s+(oct[aáoó]gono|tatame|ringue)\s+(carregad\w*|derrotad\w*|chorando)|decis[ãa]o\s+(un[âa]nime|dividida|majorit[áa]ria))\b/i;
const CONTEXTO_TREINO=/\b(sparring|trein\w*)\b/i;
function semResultadoDeLuta(texto){
  const frases=String(texto).split(/(?<=[.!?])\s+/).filter(Boolean);
  const mantidas=frases.filter(f=>!(RESULTADO_LUTA.test(f)&&!CONTEXTO_TREINO.test(f)));
  return mantidas.join(" ").trim();
}

/* A DEFESA PRINCIPAL É A INSTRUÇÃO NO PROMPT (api/ai.js, "julgar" e VOZ) —
   isto aqui é REDE DE BAIXO, não o freio. RESULTADO_LUTA funciona por regex
   porque o vocabulário de "quem venceu a luta" é fechado (nocaute, decisão,
   finalização — um punhado de palavras). Automutilação, violência gráfica e
   conteúdo sexual não têm vocabulário fechado: a IA narra a mesma coisa com
   outra palavra, eufemismo, ou outra língua, e o regex não pega. Por isso
   ESTE filtro não mira falso positivo baixo como o RESULTADO_LUTA (~5%) —
   mira pegar tudo que puder, aceitando gastar desfecho legítimo se precisar.
   Dispara em dois pontos: no texto do JOGADOR, antes de sequer chamar a IA
   (mais barato, e não depende da IA ter obedecido a instrução); e no
   "desfecho" que a IA devolve, como rede pro que passar da instrução. Se
   disparar em qualquer um dos dois, a resposta inteira da IA é descartada —
   não só o texto: um "j" que narrou isso não é confiável em nenhum campo,
   número incluso. */
/* Achado medindo direto contra produção (2026-09-11): a versão anterior
   ("cort" + qualquer parte do corpo dentro de 25 caracteres, nas duas
   ordens) disparava em texto de dilema completamente comum — "corte feio
   na perna", "cortei a mão treinando", "corte no braço" são vocabulário
   de ROTINA de MMA (o esporte é sobre apanhar corte), não indício de
   automutilação. Medido: 5 de 12 respostas de dilema plausíveis (todas
   mencionando corte/lesão de treino ou luta, nenhuma remotamente insegura)
   bloqueadas ANTES de a IA sequer ser chamada — 41,7%, contra as 40
   frases benignas antigas que nunca continham essa combinação e por isso
   nunca pegaram esse buraco. Esse bloqueio não passa por ai(), não gera
   `evento("ia_null",...)` — é invisível pra instrumentação que existe,
   diferente dos outros motivos de fallback.

   Conserto: só dispara SEM exigir "fora" quando a parte do corpo é pulso
   ou veia — as únicas da lista que não têm uso corriqueiro de MMA (luta
   não produz corte de pulso/veia como vocabulário normal, self-harm
   sim). "mãos/braços/pernas/dedos/membros" (as que colidem com
   vocabulário de luta) só disparam junto de "fora" (cortar X FORA é
   mutilação, nunca é como se descreve um corte de treino ou sparring).
   Reflexivo "me/se cort-" ("eu me corto", "ele se cortou") cobre o caso
   sem parte do corpo nenhuma, sem depender da lista.

   Isso ESTREITA a rede de baixo pra caber o jogo: "eu corto meus braços"
   (primeira pessoa, sem "fora", sem reflexivo) deixaria de disparar por
   aqui — cenário real de risco que a versão antiga pegava e esta não.
   A defesa PRINCIPAL continua sendo o prompt em api/ai.js (ver comentário
   acima), não este regex; isto é rede de baixo, e uma rede de baixo que
   quebra o próprio jogo na maioria das respostas normais não está
   protegendo ninguém, só empurrando o jogador pro fallback genérico
   toda vez que descreve um corte de luta — o caso mais comum do gênero. */
const CONTEUDO_INSEGURO=/\b(automutila\w*|mutila\w*|amputa\w*|decepa\w*|cutelo|suicid\w*|se\s+matar|tirar\s+a\s+(própria\s+)?vida|overdose\s+proposital|esfaquea\w*|estrangula\w*|tortura\w*|degola\w*|desmembra\w*|estupr\w*|abus\w*\s+sexual|(me|se)\s+cort\w*|cort\w*.{0,20}(pulsos?|veias?)|(pulsos?|veias?).{0,20}cort\w*|cort\w*.{0,20}(mãos?|braços?|pernas?|dedos?|membros?)\s+fora)/i;
function conteudoInseguro(texto){
  return CONTEUDO_INSEGURO.test(String(texto||""));
}
/* Fallback quando j vem nulo — filtro local (antes da chamada), rede pós-
   chamada pegando o desfecho da IA, ou falha de rede pura: as três causas
   caem aqui, indistinguíveis entre si de propósito. O que não pode
   acontecer é UMA FRASE SÓ, sempre igual — isso vira assinatura do filtro
   tão forte quanto a que já foi resolvida do lado da IA (ver LEIA-ME
   "Conteúdo inseguro no dilema"). Em segunda pessoa, igual sempre foi —
   não confundir com o texto neutro que a própria IA gera (terceira
   pessoa) quando é ELA quem decide neutralizar. */
/* Terceira pessoa de propósito — o desfecho REAL da IA (aplicarDilema()) e o
   próprio molde neutro dela (api/ai.js, prompt de "julgar") narram na
   terceira pessoa. Se este fallback local ficasse em segunda ("Você..."),
   ficaria distinguível dos dois outros por pronome só — a mesma assinatura
   de filtro, só mais sutil. Ver LEIA-ME "Conteúdo inseguro no dilema". */
const FALLBACK_NEUTRO=[
  n=>`${n} mudou de assunto e ninguém insistiu.`,
  n=>`${n} deu de ombros e voltou pro treino, sem clima.`,
  n=>`A pergunta ficou no ar e a pauta virou outra coisa.`,
  n=>`${n} não se estendeu no assunto e a rotina seguiu igual.`,
  n=>`${n} respondeu por cima e a semana passou sem barulho.`,
  n=>`Ninguém comentou mais nada e a rotina continuou normal.`,
  n=>`${n} ficou na sua e nada mais aconteceu por causa disso.`,
  n=>`${n} desconversou e a entrevista seguiu andando.`,
];
function fraseFallback(){
  const f=FALLBACK_NEUTRO[Math.floor((fraseRng?fraseRng():Math.random())*FALLBACK_NEUTRO.length)];
  return f(me&&me.name||"Ele");
}

async function abrirDilema(dPronto){
  const alvo=posLutaAtual||document.getElementById("bouts");
  const box=el("div","dilema");
  box.innerHTML=`<div class="dil-t">Carregando…</div>`;
  alvo.appendChild(box);
  box.scrollIntoView({behavior:"smooth",block:"nearest"});

  /* Save (revamp fase 3): dilema retomado de um save chega pronto
     (dPronto) e NÃO sorteia nem pede texto novo; o sorteio e a IA já
     aconteceram antes de gravar. Senão, recarregar a página trocava de
     dilema até vir um fácil. */
  let d=dPronto||null;
  if(!d){
    /* Revamp fase 5: a semente vai pro PENDENTE ANTES da IA responder
       (o save do fim da luta já sai com ela). Recarregar nesse intervalo
       reabre o dilema da mesma semente, em vez de perder o dilema. */
    const seed=(PENDENTE&&PENDENTE.tipo==="dilema"&&PENDENTE.seed!=null)?PENDENTE.seed:proximoDilemaSeed();
    PENDENTE={tipo:"dilema",d:null,seed};
    const tk=CARREIRA_TOKEN;
    const mood=st.streakW>=3?"em alta":st.streakL>=2?"em queda":"estável";
    const recentes=(st.dilemaRecentes||[]).slice(-3);
    d=await ai("dilema",{name:me.name,record:`${st.wins}-${st.losses}`,
      followers:fmtNum(st.followers),fan:st.fan.toFixed(1),mood,seed,recentes});
    if(tk!==CARREIRA_TOKEN)return new Promise(()=>{});   // carreira trocada: abandona
    /* dilema não recebe texto do jogador — não dá pra provocar ele do jeito
       que dá pra provocar o julgar. Ainda assim, rede embaixo: se a IA gerar
       algo ruim sem provocação (improvável, mas não impossível), cai no
       mesmo fallback que já existe pra quando ela falha. Mesma rede pro
       título repetir um dos recentes — a instrução de não repetir (acima,
       no prompt) reduz mas não garante, mesma regra do evento. */
    if(!d||!d.cena||conteudoInseguro(d.cena)||conteudoInseguro(d.titulo)||
      recentes.some(t=>t.toLowerCase()===String(d.titulo||"").toLowerCase()))
      d=proximoDilemaFallback();
    st.dilemaRecentes=st.dilemaRecentes||[];
    st.dilemaRecentes.push(String(d.titulo||"E agora?"));
    if(st.dilemaRecentes.length>3)st.dilemaRecentes.shift();
    PENDENTE={tipo:"dilema",d};
    salvarCarreira();
  }

  box.innerHTML=`<div class="dil-eyebrow">Decisão</div>
    <div class="dil-t">${String(d.titulo||"E agora?").slice(0,60)}</div>
    <div class="dil-c">${String(d.cena).slice(0,400)}</div>
    <div class="dil-in">
      <textarea id="dilresp" maxlength="200" rows="3" placeholder="O que você faz?"></textarea>
      <button class="btn btn-sm" id="dilgo">Decidir</button></div>`;
  const inp=document.getElementById("dilresp"),go=document.getElementById("dilgo");
  /* Textarea de verdade (2026-09-16), não <input> de uma linha — medido em
     380px: um input só mostrava ~220px de um campo com 852px de conteúdo
     pra uma resposta de duas frases, a pessoa não conseguia reler o que
     escreveu. É o único lugar do jogo com texto livre, o diferencial
     contra a concorrência — não podia ficar ruim no celular. Cresce com
     o conteúdo (scrollHeight) em vez de rolar escondido por dentro.
     Enter quebra linha, não envia — só o botão Decidir envia. */
  const cresce=()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";};
  inp.addEventListener("input",cresce);
  manterBotaoVisivel(inp,go);
  inp.focus();
  const enviar=async()=>{
    const txt=inp.value.trim();
    if(!txt)return inp.focus();
    go.disabled=true;inp.disabled=true;go.textContent="…";
    const tk=CARREIRA_TOKEN;
    /* Corta ANTES de chamar a IA, não só depois: mais barato (economiza a
       chamada inteira) e não depende de o julgar ter obedecido a instrução
       de conteúdo inseguro — o texto nunca sai daqui. */
    const j=conteudoInseguro(txt)?null:await ai("julgar",{name:me.name,cena:d.cena,resposta:txt,
      record:`${st.wins}-${st.losses}`,followers:fmtNum(st.followers),fan:st.fan.toFixed(1),
      rendaBase:RENDA_BASE});
    if(tk!==CARREIRA_TOKEN)return;
    aplicarDilema(box,d,txt,j);
  };
  go.onclick=enviar;
  return new Promise(res=>{box.__done=res;});
}
/* Severidade e duração da lesão são do JOGO, medidas — não da IA. Medido em
   400 carreiras (candidatos()/simulateFight() reais), do jeito que o
   TETO_TREINO foi medido: temporária custa ~0,7-0,9 vitórias em 22,
   permanente ~1,0 (mesma ordem de grandeza do treino, não maior — é evento
   situacional). A IA só classifica TIPO e ATRIBUTO (ver prompt de "julgar"
   em api/ai.js) — deixar a MAGNITUDE com ela decepcionou: em 40 desfechos
   reais medidos, o "efeito" que ela devolveu ficou quase sempre perto de
   1.0, mesmo em cena dramática. Isto não passa por lim() porque não é
   número da IA — é constante do jogo. lim() continua travando "efeito" no
   dilema comum, abaixo. */
const LESAO_TIPOS={
  temporaria:{mult:.50,duracao:8},
  permanente:{mult:.75,duracao:null},
};

/* Nocaute -> lesão (item cortado da v1, medido nesta leva): severidade
   PRÓPRIA, não reaproveita LESAO_TIPOS.temporaria — um nocaute justifica
   mais dano que uma decisão de dilema, e mudar o valor compartilhado
   também mudaria o custo da lesão de dilema sem pedido pra isso. Alvo
   dado: 0,3-0,5 vitórias em 22 de custo TOTAL desta fonte (não por
   lesão isolada). Medido direto (simulação de carreira inteira com o
   mecanismo probabilístico real, não algebra sobre o custo isolado —
   a algebra superestimava: nocaute pode acontecer perto do fim da
   carreira, sobrando pouco tempo pra lesão custar algo). Combinação
   chance/severidade que fechou o alvo com folga nas duas pontas de
   seed testadas (0,32 e 0,33 vitórias/22, 1.500 carreiras cada):
   chance=.70, -70% (chance sozinha não bastava — 100% de chance com
   -50%/8 lutas só chegava a 0,25; -50% permanente pra sempre só
   chegava a 0,27 — o teto de 22 lutas limita quanto UMA lesão pode
   custar, tem que ser mais severa, não só mais provável). */
const CHANCE_LESAO_NOCAUTE=.70;
const LESAO_NOCAUTE={mult:.30,duracao:8};
/* Item de loja "Equipamento de proteção" (leva seguinte): reduz a MESMA
   chance acima, não a severidade/duração — item separado de propósito
   (severidade é o que fecha o alvo de custo, ver comentário acima; mexer
   nela mudaria o balanceamento medido sem pedido pra isso). .45 escolhido
   e medido em CHANCE_LESAO_NOCAUTE_EQUIP mais abaixo (node testar.js
   equipamento) — não é chute, é fração testada contra 1.500 carreiras
   pareadas com/sem, mesma seed, mesmo lesaoRng. */
const CHANCE_LESAO_NOCAUTE_EQUIP=.45;
/* Preço ancorado em RENDA_BASE, mesmo protocolo do CUSTO_TREINADOR (node
   testar.js dinheiro): 400 carreiras de bot ganancioso, luta em que o
   caixa acumulado alcança o preço. 42000 bate mediana na luta 6 — dentro
   do alvo 6-8, na ponta cedo (é o item mais valioso da loja por
   vitória/22 até aqui: ver medição acima do "benefício da compra"). */
const CUSTO_EQUIPAMENTO=42000;
/* Empresário financeiro (loja): reduz pela metade o lado NEGATIVO de
   dDinheiro no julgar do dilema — ver aplicarDilema() mais abaixo. Não
   precisa de simulação pra "medir": é metade exata por construção, não
   probabilística. Preço mais baixo que os outros dois — não muda
   vitória nenhuma, é rede de segurança de caixa, coerente com custar
   menos que algo que muda combate. */
const CUSTO_EMPRESARIO=24000;
/* Casa melhor (loja): bônus permanente no followerDelta de toda luta,
   vitória ou derrota. followerDelta() já cresce PROPORCIONAL ao total de
   seguidores (crescimento composto luta a luta) — um multiplicador
   parece pequeno de cara mas AMPLIFICA ao longo de 22 lutas. Medido
   (400 carreiras de bot, candidatos()/simulateFight()/finishFight()
   reais): 1.15 (+15%/luta) chegou a +160% de seguidores ao fim da
   carreira — descartado, exagerado demais pra "casa melhor". 1.03
   (+3%/luta) fecha em +21% ao fim da carreira — perceptível, não
   quebra a curva. */
const CASA_FOLLOWER_MULT=1.03;
const CUSTO_CASA=30000;
/* Consultoria de mídia (loja, item RECORRENTE — 2026-09-11): os quatro
   itens acima são compra única, e por volta da luta 10 o jogador já tem
   todos — dinheiro perde função pro resto da carreira (ver
   PENDENCIAS.md "onde desperdiça trabalho já feito"). Reusa a MESMA
   alavanca já medida/calibrada de "Casa melhor" (CASA_FOLLOWER_MULT),
   só que PONTUAL (1 luta, não permanente) — nenhum multiplicador novo
   pra calibrar. Preço testado em 4 pontos (400 carreiras/preço, bot
   guloso comprando toda vez que tem caixa, candidatos()/simulateFight()/
   finishFight() reais): 10000 rende 18,3 compras/carreira e +21,5% de
   seguidores (empata com o permanente de Casa melhor — caro demais pro
   item ficar redundante); 24000 (mesmo preço do Empresário, o mais
   barato dos 4 originais) rende 7,8 compras/carreira e +9,5% — menos da
   metade do +21% de Casa melhor, não compete com ele, e ainda dá pra
   comprar bastante vez ao longo da carreira mesmo depois dos outros 4
   itens levados. `node testar.js loja` cobre o consumo (1 luta só,
   precisa comprar de novo) e o efeito medido. */
const CUSTO_CONSULTORIA=24000;

/* Extraídos de aplicarDilema() (2026-09-21, Plano Pro) — aplicarEntrevista()
   precisa exatamente da mesma checagem (mesmo motivo: "dinheiro" só é
   confiável quando o TEXTO de verdade menciona algo financeiro, ver
   comentário original abaixo, em aplicarDilema). Duplicar o regex em dois
   lugares seria o tipo de "dois números que deveriam ser um" que este
   projeto já cortou antes. */
const semAcento=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const MENCIONA_DINHEIRO=/r\$|\breais?\b|multas?|patrocin\w*|contrat\w*|premi\w*|bolsas?|cache|\bpag(a|as|ou|am|ando|amento|amentos|ar|avel|aveis)\b|receb\w*|indeniza\w*|apost\w*|salari\w*|\bpix\b|divida\w*|emprest\w*|dinheiro/;
function aplicarDilema(box,d,txt,jBruto){
  /* Rede de baixo do conteúdo inseguro (ver CONTEUDO_INSEGURO acima): um "j"
     cujo desfecho narrou automutilação/violência/sexual não é confiável em
     NENHUM campo, não só no texto — descarta o objeto inteiro, não só a
     frase. A partir daqui só se usa jSeguro, nunca jBruto. */
  const jSeguro=(jBruto&&conteudoInseguro(jBruto.desfecho))?null:jBruto;
  const j=jSeguro;
  /* Todo número volta limitado. O jogador digita texto livre que entra no
     prompt, então nada que o modelo devolve é aceito sem trava. */
  const dSeg=lim(j&&j.seguidores,-.35,.60,0);
  const dFan=lim(j&&j.fa,-2.5,2.5,0);
  /* Dinheiro do dilema (item 2): fração de UMA bolsa de luta (RENDA_BASE),
     pra cima ou pra baixo — mesma âncora que "seguidores" já usa (fração
     relativa, não número solto). ±1 bolsa inteira é o teto: um dilema é
     evento situacional, não pode valer mais que uma luta inteira paga. */
  /* Empresário financeiro (loja, item recém-medido): reduz pela metade o
     lado NEGATIVO de dDinheiro — perda de dilema custa menos, ganho
     continua o mesmo. Efeito aplicado no valor JÁ arredondado, não antes
     de lim()/Math.round — mais simples de medir e não muda o teto de
     ±1 bolsa que lim() já trava. */
  /* Rede de baixo pro mesmo problema do "não repita" (LEIA-ME.md, "Regra
     geral: restrição negativa no prompt não é garantia"): pedir no prompt
     pra só preencher "dinheiro" quando o desfecho narra um evento
     financeiro de verdade reduz, mas não impede, a IA inventar um valor
     sem nenhum r$/multa/contrato/prêmio no texto (medido: 4 de 20
     desfechos tinham "dinheiro" não-zero sem NENHUMA palavra de dinheiro
     na narração). Checagem mecânica, não sentimento — só confere se o
     TEXTO menciona algo financeiro; não tenta decidir se a cena foi boa
     ou ruim (isso é frágil demais em texto livre com gíria, não vale a
     pena arriscar falso positivo). Sem acento de propósito (semAcento):
     não depender de a IA ter acentuado igual.
     Raiz de palavra (\w*), não forma exata: medido contra os 20 desfechos
     reais da leva anterior, "pagou"/"recebeu" sozinhos perderam "não PAGA
     a segunda parcela"/"sem RECEBER o resto" (conjugação diferente) — só
     não incomodou aquela vez porque o padrão (zera quando não acha) deu
     por acaso o resultado certo. Ampliado pra não depender de sorte.
     Conta a CENA também, não só o desfecho: medido (v2 dos 20 casos) — quando
     a cena já estabelece a oferta ("R$500 pra postar isso"), o desfecho às
     vezes narra só o desdobramento e nunca repete o valor, porque já foi
     dito antes. Checar só o desfecho zerava um "dinheiro" certo (0.083,
     batendo com os R$500 da cena) por engano. semAcento/MENCIONA_DINHEIRO
     agora são de módulo (ver acima de aplicarDilema) — aplicarEntrevista()
     reusa a mesma checagem. */
  const mencionaDinheiro=MENCIONA_DINHEIRO
    .test(semAcento((j&&j.desfecho||"")+" "+(d&&d.cena||"")));
  const dDinheiroBruto=mencionaDinheiro?Math.round(RENDA_BASE*lim(j&&j.dinheiro,-1,1,0)):0;
  const dDinheiro=(st.empresarioComprado&&dDinheiroBruto<0)?Math.round(dDinheiroBruto/2):dDinheiroBruto;
  const ATTRS_LESAO=["slpm","strDef","durability","tdDef","subAvg","kdAvg"];

  /* Uma lesão de cada vez: st.lesao é objeto único, não lista. Se uma nova
     sobrescrevesse a ativa, o multiplicador da primeira ficaria órfão em
     st.eventoMod pra sempre (o tick de cura, em finishFight(), divide pelo
     mult guardado em st.lesao — sem ele não tem como reverter o que já foi
     aplicado). "já está machucado" também é defensável sozinho: não
     empilha um segundo problema em cima do primeiro.

     Existiu aqui um portão exigindo j.houveLesao===true concordando com o
     objeto lesao, mais um campo separado no prompt do julgar pedindo pra
     decidir isso ANTES do resto. Foi revertido: medido depois de deploy de
     verdade (a medição anterior tinha testado uma versão do prompt que
     nunca tinha saído do arquivo local — ver LEIA-ME.md, seção "Lesão"), o
     prompt sem o portão já acerta 8/8 nas cenas de lesão e 0/34 nas sem
     lesão. O portão era complexidade resolvendo um problema que não
     existia. A IA às vezes preenche lesao E o atributo/efeito comum ao
     mesmo tempo (o prompt pede pra não fazer isso, mas acontece — visto em
     3 das 8 respostas medidas) — isso é ignorado aqui de propósito, só a
     validade do PRÓPRIO objeto lesao importa. */
  const lesaoBruta=j&&j.lesao;
  const lesaoValida=!st.lesao&&lesaoBruta
    &&ATTRS_LESAO.includes(lesaoBruta.atributo)&&me[lesaoBruta.atributo]!=null;
  let atr=null, mult=1;
  if(lesaoValida){
    const tipo=LESAO_TIPOS[lesaoBruta.permanente?"permanente":"temporaria"];
    atr=lesaoBruta.atributo; mult=tipo.mult;
    /* treinador melhor (item 2, trocado do treino pra cá): corta a
       duração da lesão TEMPORÁRIA pela metade. Não mexe em permanente —
       não existe "cura" pra acelerar ali. */
    const duracao=(tipo.duracao!=null&&st.treinadorComprado)
      ?Math.round(tipo.duracao*REDUCAO_CURA_TREINADOR):tipo.duracao;
    st.eventoMod=st.eventoMod||{};
    st.eventoMod[atr]=(st.eventoMod[atr]||1)*mult;
    /* origem:"dilema" — distingue de "nocaute" (ver finishFight()). Achado
       jogando em produção: o momento "lesão aceita e vencida" disparava
       pra QUALQUER st.lesao ativo, nocaute incluso — a frase ("entrou
       mancando e saiu com a mão levantada") narra uma escolha corajosa
       que o jogador nunca fez quando a lesão veio de apanhar, não de
       decidir lutar machucado. */
    st.lesao={nome:String(lesaoBruta.regiao||"Lesão").slice(0,40),atributo:atr,mult,
      permanente:!!lesaoBruta.permanente,desdeLuta:st.fightNo,duracao,origem:"dilema"};
  }else{
    /* dilema comum (ou lesão bloqueada por já ter uma ativa): atributo/efeito
       seguem vindo da IA, travados no lim() de sempre — o bypass acima é só
       pra tabela de lesão, nunca pra isto. */
    atr=ATTRS_LESAO.includes(j&&j.atributo)?j.atributo:null;
    mult=lim(j&&j.efeito,.90,1.10,1);
    if(atr&&me[atr]!=null){st.eventoMod=st.eventoMod||{};
      st.eventoMod[atr]=(st.eventoMod[atr]||1)*mult;}
  }

  /* evitouLesao: risco físico evitado por escolha prudente. O custo em fama
     já sai de dSeg/dFan (o prompt pede pra IA não tratar recusa como
     neutra); o custo em ranking é mecânica nova — dilema nunca tocou
     st.standing antes de hoje — e por isso fica fixo aqui, não depende da
     IA lembrar de aplicar um número certo. */
  if(j&&j.evitouLesao){st.standing=Math.max(.05,st.standing-.06);st.evitouAlgumaVez=true;}

  const antes=st.followers;
  st.followers=Math.max(120,Math.round(st.followers*(1+dSeg)));
  st.fan=Math.max(0,Math.min(10,st.fan+dFan));
  st.dinheiro=Math.max(0,(st.dinheiro||0)+dDinheiro);
  const dif=st.followers-antes;
  /* aqui a direção é direta: os números já vieram limitados pelo lim() */
  const peso=(dSeg*2.2)+(dFan*0.55)+(dDinheiro/RENDA_BASE*1.4);
  (peso>0.12?SOM.bom:peso<-0.12?SOM.ruim:SOM.evento)();
  /* Filtra ANTES do slice: cortar frase por regex depois de truncar
     poderia deixar uma frase pela metade sem o ponto final que a divide.
     1200 (era 2000, 2026-09-18; e 500 antes disso, 2026-09-11): desfecho
     voltou de 6-10 pra 4-6 frases — virava parede de texto na tela,
     sobretudo no celular. Medido antes de escolher o número (20
     desfechos reais de 6-10 frases, sessão anterior): média 595-687
     caracteres, máximo observado 953 pra ~9-10 frases — pra 4-6 frases
     o esperado é bem menor que isso. 1200 é rede de segurança contra
     resposta fugindo do tamanho pedido, não um limite que a resposta
     normal deveria tocar — a caixa (.dil-o, max-width mas sem
     max-height) já cresce com o texto, quem rola é o container de
     narração (`box.scrollIntoView` já existe). */
  const bruto=(j&&j.desfecho)?semResultadoDeLuta(String(j.desfecho)).slice(0,1200):"";
  const desfecho=bruto||fraseFallback();
  box.innerHTML=`<div class="dil-eyebrow">Decisão</div>
    <div class="dil-t">${String(d.titulo||"E agora?").slice(0,60)}</div>
    <div class="dil-c">${String(d.cena).slice(0,400)}</div>
    <div class="dil-r">"${txt.replace(/</g,"&lt;")}"</div>
    <div class="dil-eyebrow">O desfecho</div>
    <div class="dil-o">${desfecho}</div>
    <div class="dil-fx">
      ${dif!==0?`<span class="delta ${dif>=0?"up":"down"}">${dif>=0?"+":"−"}${fmtNum(Math.abs(dif))} seguidores</span>`:""}
      ${Math.abs(dFan)>=0.05?`<span class="delta ${dFan>=0?"up":"down"}">${dFan>=0?"+":"−"}${Math.abs(dFan).toFixed(1)} de fã</span>`:""}
      ${dDinheiro!==0?`<span class="delta ${dDinheiro>=0?"up":"down"}">${dDinheiro>=0?"+":"−"}R$${fmtNum(Math.abs(dDinheiro))}</span>`:""}
      ${atr?`<span class="hint">${ROTULO_ATTR[atr]||atr} <span class="${mult>=1?"g":"dn"}">${
        mult>=1?"+":""}${Math.round((mult-1)*100)}%</span></span>`:""}</div>`;
  registrarExtra({tipo:"dilema",titulo:String(d.titulo||"E agora?").slice(0,60),cena:String(d.cena).slice(0,400),
    resposta:txt.replace(/</g,"&lt;"),texto:desfecho});
  st.dilemas=(st.dilemas||0)+1;
  if(box.__done)box.__done();
}




/* =========================================================================
   SOM — sintetizado na Web Audio API, sem nenhum arquivo.
   Motivos: o jogo continua sendo um HTML só, não depende de licença de
   sample, não tem download nem espera. E o navegador BLOQUEIA áudio antes do
   primeiro clique do usuário, então o contexto só nasce quando ele interage.
   ========================================================================= */
let AC=null, MASTER=null, BUS=null, MUSICA=null, AMB=null;
let mudo=(()=>{try{return localStorage.getItem("mudo")==="1";}catch(e){return false;}})();

/* Música e efeitos em barramentos separados porque na prática a pessoa quer
   abaixar a trilha e manter o soco. O padrão dos dois é 1.00, que é o nível em
   que o jogo foi equilibrado — quem não abrir o painel ouve exatamente o que
   ouvia antes. Number() e não parseFloat(): o testar.js roda num sandbox
   enxuto e parseFloat não está lá. */
const lerVol=k=>{try{
    const b=localStorage.getItem(k); if(b===null)return 1;
    const v=Number(b); return isNaN(v)?1:clamp(v,0,1);
  }catch(e){return 1;}};
let volMusica=lerVol("vol_musica"), volEfeitos=lerVol("vol_efeitos");

/* Dois barramentos sob o mesmo master: BUS carrega os efeitos, MUSICA carrega a
   trilha. O mudo continua sendo ponto único — com ele ligado o contexto nem
   nasce. */
function ctx(){
  if(mudo)return null;
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      MASTER=AC.createGain(); MASTER.gain.value=.9;        MASTER.connect(AC.destination);
      BUS=AC.createGain();    BUS.gain.value=volEfeitos;   BUS.connect(MASTER);
      MUSICA=AC.createGain(); MUSICA.gain.value=volMusica; MUSICA.connect(MASTER);
    }catch(e){AC=null;return null;}
  }
  if(AC.state==="suspended")AC.resume();
  return AC;
}
function env(g,t,pico,dur,atq=0.006){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(pico,t+atq);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
}
function ruido(dur,decai=true){
  const a=ctx();if(!a)return null;
  const n=Math.floor(a.sampleRate*dur);
  const buf=a.createBuffer(1,n,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(decai?(1-i/n):1);
  const s=a.createBufferSource();s.buffer=buf;return s;
}

/* ---------------- TRILHA ----------------
   Bordão grave contínuo: fundamental em Lá0 (55 Hz), a quinta acima e uma
   oitava, todas levemente desafinadas entre si. A desafinação é o que produz o
   batimento lento que faz o som "respirar" em vez de zumbir parado.
   Um filtro passa-baixa varre devagar por cima. Volume baixo de propósito:
   é cama, não música. */
function trilhaLiga(){
  const a=ctx(); if(!a||AMB) return;
  const g=a.createGain(); g.gain.value=0;
  const lp=a.createBiquadFilter(); lp.type="lowpass";
  lp.frequency.value=220; lp.Q.value=.7;
  lp.connect(g); g.connect(MUSICA);

  const vozes=[[55,0],[55.35,-0.4],[82.5,-6],[110,-9]];
  const osc=vozes.map(([f,db])=>{
    const o=a.createOscillator(), vg=a.createGain();
    o.type="sine"; o.frequency.value=f;
    vg.gain.value=Math.pow(10,db/20);
    o.connect(vg).connect(lp); o.start();
    return o;
  });
  /* sopro de sala: ruído filtrado bem embaixo, dá corpo sem virar chiado */
  const s=ruido(8,false);
  let sN=null;
  if(s){ s.loop=true;
    const bp=a.createBiquadFilter(); bp.type="lowpass"; bp.frequency.value=140;
    const sg=a.createGain(); sg.gain.value=.045;
    s.connect(bp).connect(sg).connect(lp); s.start(); sN=s; }

  /* varredura lenta do filtro: 40 s de ida e volta */
  const lfo=a.createOscillator(), lfoG=a.createGain();
  lfo.type="sine"; lfo.frequency.value=1/40;
  lfoG.gain.value=90; lfo.connect(lfoG).connect(lp.frequency); lfo.start();

  g.gain.setValueAtTime(0.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.16,a.currentTime+3);   // entra devagar
  AMB={g,osc,lfo,noise:sN};
}
function trilhaDesliga(){
  if(!AMB||!AC)return;
  const t=AC.currentTime;
  AMB.g.gain.cancelScheduledValues(t);
  AMB.g.gain.setValueAtTime(Math.max(.0001,AMB.g.gain.value),t);
  AMB.g.gain.exponentialRampToValueAtTime(.0001,t+.8);
  const {osc,lfo,noise}=AMB;
  setTimeout(()=>{try{osc.forEach(o=>o.stop());lfo.stop();if(noise)noise.stop();}catch(e){}},900);
  AMB=null;
}

/* ---------------- EFEITOS ----------------
   Tudo transposto uma oitava e meia para baixo do que era antes, e com filtro
   passa-baixa no lugar de onda crua. Agudo corta a trilha e cansa. */
function tom(f,{tipo="sine",pico=.09,dur=.3,atq=.006,em=0,corte=null,varre=null}={}){
  const a=ctx();if(!a)return;
  const t=a.currentTime+em;
  const o=a.createOscillator(), g=a.createGain();
  o.type=tipo; o.frequency.setValueAtTime(f,t);
  if(varre)o.frequency.exponentialRampToValueAtTime(varre,t+dur);
  let no=o;
  if(corte){const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=corte;
    o.connect(lp); no=lp;}
  env(g,t,pico,dur,atq); no.connect(g).connect(BUS);
  o.start(t); o.stop(t+dur+.12);
}
/* Cada efeito tenta o arquivo real primeiro (toca) e, se ele ainda não
   carregou ou falhou, cai no sintetizado de sempre. */
const synthGolpe=(pico=.11)=>{ const a=ctx();if(!a)return;const t=a.currentTime;
  const s=ruido(.11);if(!s)return;
  const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(500,t);
  const g=a.createGain();env(g,t,pico,.12,.002);
  s.connect(lp).connect(g).connect(BUS);s.start(t);
  tom(70,{tipo:"sine",pico:pico*.64,dur:.1,varre:45}); };
const synthKnockdown=()=>{ tom(96,{tipo:"sine",pico:.24,dur:.42,varre:34,atq:.005});
  const a=ctx();if(!a)return;const t=a.currentTime;
  const s=ruido(.3);if(!s)return;
  const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(300,t);
  const g=a.createGain();env(g,t,.13,.3,.004);
  s.connect(lp).connect(g).connect(BUS);s.start(t); };
const SOM={
  toque(){ if(toca("clique",.7))return; tom(150,{tipo:"triangle",pico:.05,dur:.06,varre:96,corte:900}); },
  hover(){ toca("hover",.35); },
  aba(){ if(toca("aba",.55))return; tom(180,{tipo:"triangle",pico:.04,dur:.07,varre:130,corte:1100}); },
  carta(){ toca("carta",.55); },
  caixa(){ if(toca("caixa",.8))return; SOM.bom(); },
  conquista(){ if(toca("conquista",.8))return; SOM.bom(); },
  flashes(){ toca("flashes",.45); },
  vaia(){ toca("vaia",.6); },

  fixa(){ tom(98,{tipo:"sine",pico:.10,dur:.22,corte:700});
          tom(147,{tipo:"sine",pico:.07,dur:.26,em:.06,corte:800}); },

  /* golpe: luva em corpo */
  golpe(){ if(toca("golpePesado",.8))return; synthGolpe(); },
  golpeLeve(){ if(toca("golpeLeve",.45))return; synthGolpe(.06); },
  golpePesado(){ if(toca("golpePesado",.85))return; synthGolpe(); },
  /* queda = derrubada (takedown): corpo batendo na lona */
  queda(){ if(toca("queda",.8))return; tom(80,{tipo:"sine",pico:.16,dur:.3,varre:40,atq:.004}); },
  /* knockdown: golpe pesado e a torcida levantando */
  knockdown(){ const ok=toca("golpePesado",.9); toca("torcidaExplode",.55); if(!ok)synthKnockdown(); },
  quaseFinalizacao(){ toca("torcidaSobe",.55); },
  finalizacao(){ if(toca("torcidaExplode",.85))return; SOM.bom(); },

  nocaute(){ const ok=toca("golpePesado",1); toca("torcidaExplode",.9); if(ok)return;
    tom(120,{tipo:"sine",pico:.38,dur:.85,varre:26,atq:.004});
    const a=ctx();if(!a)return;const t=a.currentTime;
    const s=ruido(2.2);if(!s)return;
    const bp=a.createBiquadFilter();bp.type="lowpass";bp.frequency.setValueAtTime(700,t);
    const g=a.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.16,t+.35);     // a plateia leva um tempo
    g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
    s.connect(bp).connect(g).connect(BUS);s.start(t); },

  /* sino: uma batida no começo do round, três no fim */
  sinoInicio(){ if(toca("sinoInicio",.7))return; tom(330,{tipo:"sine",pico:.05,dur:.9,atq:.002,corte:1200}); },
  sinoFim(){ if(toca("sinoFim",.7))return; [330,495,660].forEach((f,i)=>
    tom(f,{tipo:"sine",pico:.055/(i+1),dur:1.4,atq:.002,corte:1200})); },

  /* VITÓRIA: vinheta de verdade; sem arquivo, acorde maior grave que abre */
  vitoria(){ if(tocarVinheta(true))return; tom(65,{tipo:"sine",pico:.16,dur:1.1,atq:.02});
    [131,165,196].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.085,dur:1.0,em:i*.10,atq:.02,corte:1000}));
    tom(262,{tipo:"sine",pico:.05,dur:1.2,em:.30,atq:.05,corte:900}); },

  /* Evento neutro: um toque só, discreto. Serve de pontuação. */
  evento(){ tom(147,{tipo:"sine",pico:.09,dur:.5,atq:.02,corte:900});
            tom(220,{tipo:"sine",pico:.045,dur:.4,em:.03,atq:.03,corte:1100}); },

  /* Evento BOM: terça maior subindo, curto. Menor que a vitória de propósito —
     é uma boa notícia, não o fim de uma luta. */
  bom(){ tom(98,{tipo:"sine",pico:.11,dur:.7,atq:.015});
    [196,247,294].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.075,dur:.55,em:i*.075,atq:.012,corte:1500})); },

  /* Evento RUIM: segunda menor descendo, com o chão saindo embaixo. */
  ruim(){ tom(110,{tipo:"sine",pico:.12,dur:.9,atq:.015});
    [233,208,175].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.07,dur:.55,em:i*.09,atq:.012,corte:1100}));
    tom(87,{tipo:"sine",pico:.09,dur:.8,em:.28,atq:.04}); },

  /* DERROTA: vinheta de verdade; sem arquivo, menor que desce */
  derrota(){ if(tocarVinheta(false))return; tom(98,{tipo:"sine",pico:.14,dur:1.3,atq:.02});
    [156,131,117].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.075,dur:.8,em:i*.16,atq:.02,corte:700}));
    tom(58,{tipo:"sine",pico:.10,dur:1.6,em:.5,atq:.08}); },
};

/* ---------------- ARQUIVOS (revamp fase 6) ----------------
   Música de verdade e efeitos reais, todos com licença de uso comercial
   (CC0 ou CC BY; tabela em audio/LICENCAS.md, arquivos gerados por
   audio/preparar.py). Música vem por <audio> em streaming ligado ao
   barramento MUSICA (decodificar faixas de minutos custaria dezenas de MB
   de memória no celular); efeitos curtos são decodificados em buffer.
   Arquivo que falha cai no sintetizado de sempre: o jogo nunca fica mudo
   por causa de um 404, e o testar.js roda sem áudio nenhum. */
const DIR_AUDIO="audio/";
const TRILHAS={menu:"musica-menu.mp3",hub:"musica-hub.mp3",noite:"musica-noite.mp3",walkout:"musica-walkout.mp3"};
/* nível de cada trilha dentro do barramento de música (o volume do painel
   multiplica por cima): cama por baixo dos efeitos, não primeiro plano */
const NIVEL_TRILHA={menu:.5,hub:.42,noite:.55,walkout:.75};
const EFEITOS={clique:["ui-clique"],hover:["ui-hover"],aba:["ui-aba"],carta:["carta"],caixa:["caixa"],
  conquista:["conquista"],flashes:["flashes"],vaia:["vaia"],vitoria:["vinheta-vitoria"],derrota:["vinheta-derrota"],
  golpeLeve:["golpe-leve-1","golpe-leve-2","golpe-leve-3"],golpePesado:["golpe-pesado-1","golpe-pesado-2","golpe-pesado-3"],
  queda:["queda-1","queda-2"],sinoInicio:["sino-inicio"],sinoFim:["sino-fim"],
  torcidaExplode:["torcida-explode"],torcidaSobe:["torcida-sobe"]};
const BUF={};          // nome do arquivo -> AudioBuffer, ou false se falhou
const CARREGANDO={};
function carregarEfeito(nome){
  const a=ctx(); if(!a)return Promise.resolve(null);
  if(nome in BUF)return Promise.resolve(BUF[nome]);
  if(!CARREGANDO[nome])CARREGANDO[nome]=(async()=>{
    try{
      const r=await fetch(DIR_AUDIO+nome+".mp3"); if(!r.ok)throw 0;
      BUF[nome]=await a.decodeAudioData(await r.arrayBuffer());
    }catch(e){ BUF[nome]=false; }   // fica sem: o sintetizado cobre
    return BUF[nome];
  })();
  return CARREGANDO[nome];
}
/* depois do primeiro gesto: baixa e decodifica os efeitos (~0,5 MB) em
   segundo plano, pra nenhum tocar atrasado na primeira vez */
function carregaAudio(){
  return Promise.all([].concat(...Object.values(EFEITOS)).map(carregarEfeito));
}
/* Toca um efeito real; devolve false se ele não existe ainda (carregando
   ou falhou) e quem chamou toca o sintetizado. A variação entre golpes usa
   Math.random: som não é jogo, nunca toca um gerador da carreira. */
function toca(k,ganho=1){
  const a=ctx(); if(!a)return false;
  const lista=EFEITOS[k]; if(!lista)return false;
  const nome=lista[Math.floor(Math.random()*lista.length)];
  const b=BUF[nome];
  if(!b){ if(!(nome in BUF))carregarEfeito(nome); return false; }
  const s=a.createBufferSource(); s.buffer=b;
  const g=a.createGain(); g.gain.value=ganho;
  s.connect(g).connect(BUS); s.start();
  return true;
}

/* ---------------- TRILHA POR TELA ----------------
   Uma função pura decide a trilha a partir da tela (contextoTrilha) e a
   troca é um crossfade de 1 s. O walkout entra na entrada da luta e, com
   a luta começando, continua por baixo com passa-baixa (a "batida grave
   baixa") e a torcida por cima. */
let audioLiberado=false,trilhaAtual=null,vinhetaAte=0,TORCIDA=null;
const FAIXAS={};
function rampa(p,v,s,atraso=0){
  if(!AC||!p)return;
  try{
    const t=AC.currentTime;
    p.cancelScheduledValues(t);
    p.setValueAtTime(Math.max(.0001,p.value),t);
    if(atraso)p.setValueAtTime(Math.max(.0001,p.value),t+atraso);
    p.linearRampToValueAtTime(Math.max(.0001,v),t+atraso+s);
  }catch(e){ try{ p.value=v; }catch(e2){} }
}
function faixaAudio(arquivo,destino){
  const a=ctx();
  if(!a||typeof Audio==="undefined"||!a.createMediaElementSource)return null;
  try{
    const el=new Audio(DIR_AUDIO+arquivo); el.loop=true; el.preload="auto";
    const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=20000;
    const g=a.createGain(); g.gain.value=.0001;
    a.createMediaElementSource(el).connect(f).connect(g).connect(destino);
    return{el,f,g,falhou:false};
  }catch(e){ return null; }
}
function faixa(nome){
  if(FAIXAS[nome])return FAIXAS[nome];
  const fx=faixaAudio(TRILHAS[nome],MUSICA);
  if(!fx)return null;
  fx.el.addEventListener("error",()=>{ fx.falhou=true; if(trilhaAtual===nome)trilhaLiga(); });
  FAIXAS[nome]=fx;
  return fx;
}
function tocarElemento(el){ try{ const p=el.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }
function trocarTrilha(nome){
  if(nome===trilhaAtual)return;
  trilhaAtual=nome;
  /* descer e pausar usa o AC que já existe (com mudo, ctx() devolve null
     e a música que estava tocando continuaria); só subir precisa de ctx() */
  Object.keys(FAIXAS).forEach(n=>{
    if(n===nome)return;
    const fx=FAIXAS[n];
    rampa(fx.g.gain,.0001,1);
    setTimeout(()=>{ if(trilhaAtual!==n){ try{ fx.el.pause(); }catch(e){} } },1150);
  });
  if(!nome){ trilhaDesliga(); return; }
  const a=ctx(); if(!a)return;
  const fx=faixa(nome);
  if(!fx||fx.falhou){ trilhaLiga(); return; }      // sem arquivo, cai no bordão sintetizado
  trilhaDesliga();
  tocarElemento(fx.el);
  /* vinheta tocando: a trilha nova espera ela acabar pra subir */
  rampa(fx.g.gain,NIVEL_TRILHA[nome]||.5,1,Math.max(0,vinhetaAte-a.currentTime));
}
function abafarWalkout(sim){
  const fx=FAIXAS.walkout;
  if(!fx||!AC)return;
  try{ fx.f.frequency.setTargetAtTime(sim?380:20000,AC.currentTime,sim?.35:.2); }catch(e){}
  if(trilhaAtual==="walkout")rampa(fx.g.gain,(sim?.55:1)*NIVEL_TRILHA.walkout,.8);
}
function torcidaAmbiente(liga){
  if(!AC)return;
  if(liga){
    if(!TORCIDA)TORCIDA=faixaAudio("torcida-ambiente.mp3",BUS);
    if(!TORCIDA)return;
    if(TORCIDA.el.paused)tocarElemento(TORCIDA.el);
    rampa(TORCIDA.g.gain,.5,1.2);
  }else if(TORCIDA){
    rampa(TORCIDA.g.gain,.0001,1);
    const t=TORCIDA;
    setTimeout(()=>{ if(!(noiteEtapa==="luta"||noiteEtapa==="entrada")){ try{ t.el.pause(); }catch(e){} } },1150);
  }
}
/* Qual trilha cabe na tela de agora. Pura: só lê a tela e a etapa da
   noite de luta. */
function contextoTrilha(){
  const tela=document.documentElement.dataset.tela;
  if(tela==="hub"){
    if(noiteEtapa==="entrada"||noiteEtapa==="luta")return "walkout";
    if(noiteEtapa)return "noite";
    return "hub";
  }
  return "menu";
}
function atualizarTrilha(){
  if(!audioLiberado||mudo)return;
  trocarTrilha(contextoTrilha());
  abafarWalkout(noiteEtapa==="luta");
  torcidaAmbiente(document.documentElement.dataset.tela==="hub"&&(noiteEtapa==="luta"||noiteEtapa==="entrada"));
}
/* Vinheta de vitória ou derrota: abaixa a trilha de agora enquanto toca,
   e a próxima trilha só sobe depois dela. */
function tocarVinheta(ganhou){
  const a=ctx(); if(!a)return false;
  const ok=toca(ganhou?"vitoria":"derrota",.95);
  if(!ok)return false;
  vinhetaAte=a.currentTime+(ganhou?5.5:4.5);
  const fx=trilhaAtual&&FAIXAS[trilhaAtual];
  if(fx){
    const n=trilhaAtual;
    rampa(fx.g.gain,(NIVEL_TRILHA[n]||.5)*.25,.25);
    setTimeout(()=>{ if(trilhaAtual===n)rampa(fx.g.gain,NIVEL_TRILHA[n]||.5,1.5); },(ganhou?5:4)*1000);
  }
  return true;
}
/* Efeito de cada linha da narração, pelo TIPO que o motor já dá e pelo
   texto: queda é derrubada (takedown), knockdown é "foi ao chão".
   Pura, testada na suíte som. */
function somDaLinha(L){
  const t=String(L&&L.text||"");
  if(L.kind==="rd")return /^Round/.test(t)?"sinoInicio":/^Fim/.test(t)?"sinoFim":null;
  if(L.kind==="kd")return "knockdown";
  if(L.kind==="fin")return /ocaute/.test(t)?"nocaute":/finaliza/i.test(t)?"finalizacao":null;
  if(L.kind==="big"){
    if(/finaliza/i.test(t))return "quaseFinalizacao";
    if(/^Queda de|Levou pro chão/.test(t))return "queda";
    return "golpePesado";
  }
  if(/acerta mais na troca|Troca parelha/.test(t))return "golpeLeve";
  return null;
}

function armarTrilha(){
  if(!document.addEventListener)return;      // ambiente sem eventos: sem trilha, sem erro
  const arma=()=>{
    audioLiberado=true;
    if(!mudo){ carregaAudio(); atualizarTrilha(); }
    document.removeEventListener("pointerdown",arma);
    document.removeEventListener("keydown",arma); };
  document.addEventListener("pointerdown",arma);
  document.addEventListener("keydown",arma);
  /* hover só com mouse de verdade (toque não tem hover), em card e botão */
  let ultimo=null,quando=0;
  document.addEventListener("pointerover",e=>{
    if(!e||e.pointerType!=="mouse"||!audioLiberado||semHover())return;
    const alvo=e.target&&e.target.closest&&e.target.closest(".cartao,.botao,.guia-hub,.opp,.camp,.el-opts button,.save-slot");
    if(!alvo||alvo===ultimo)return;
    ultimo=alvo;
    const agora=Date.now(); if(agora-quando<70)return; quando=agora;
    SOM.hover();
  });
}

/* Rampa curta em vez de salto: arrastar a barra mexe no ganho dezenas de vezes
   por segundo e salto de ganho estala. */
function ajustaGanho(no,v){
  if(!no)return;
  try{ no.gain.setTargetAtTime(v,AC.currentTime,.02); }
  catch(e){ try{ no.gain.value=v; }catch(e2){} }
}
function aplicarVolumes(){
  ajustaGanho(MUSICA,volMusica);
  ajustaGanho(BUS,volEfeitos);
}
function definirVolume(qual,v){
  v=clamp(Number(v)||0,0,1);
  if(qual==="musica"){ volMusica=v; try{localStorage.setItem("vol_musica",String(v));}catch(e){} }
  else               { volEfeitos=v; try{localStorage.setItem("vol_efeitos",String(v));}catch(e){} }
  aplicarVolumes();
}
function definirMudo(v){
  mudo=!!v;
  try{localStorage.setItem("mudo",mudo?"1":"0");}catch(e){}
  if(mudo){ ajustaGanho(MASTER,0); trocarTrilha(null); torcidaAmbiente(false); trilhaDesliga(); return; }
  SOM.toque();                 // é ele que faz o contexto nascer
  ajustaGanho(MASTER,.9);
  aplicarVolumes();
  audioLiberado=true;
  trilhaAtual=null;
  carregaAudio();
  atualizarTrilha();
}

/* =========================================================================
   CONFIGURAÇÕES — o painel da engrenagem
   O botão "Som on/off" que morava na barra fixa SAIU e virou item daqui. Ter a
   mesma função em dois lugares é a receita para os dois estados discordarem.
   ========================================================================= */
let cfgAberto=false;

function linhaVolume(id,rotulo,valor,aoMudar){
  const li=el("div","cfg-linha");
  const inp=el("input");
  inp.type="range"; inp.min="0"; inp.max="100"; inp.step="1";
  inp.value=String(Math.round(valor*100));
  inp.id=id; inp.className="cfg-range";
  inp.setAttribute&&inp.setAttribute("aria-label",rotulo);
  const num=el("b","cfg-num",inp.value+"%");
  const aplica=()=>{
    const v=clamp(Number(inp.value)/100,0,1);
    num.textContent=Math.round(v*100)+"%";
    aoMudar(v);
  };
  inp.oninput=aplica; inp.onchange=aplica;
  li.append(el("span","cfg-rot",rotulo),inp,num);
  return {li,inp};
}

function abrirConfig(){
  const cx=document.getElementById("cfg");
  if(!cx||cfgAberto)return;
  cfgAberto=true;
  cx.innerHTML="";

  const p=el("div","cfg-painel");
  const topo=el("div","cfg-top","<h2>Configurações</h2>");
  const fechar=el("button","cfg-x",ICONE("fechar"));
  fechar.id="cfgx"; fechar.type="button";
  fechar.setAttribute&&fechar.setAttribute("aria-label","Fechar");
  fechar.onclick=()=>{SOM.toque();fecharConfig();};
  topo.appendChild(fechar);

  const somL=el("div","cfg-linha");
  const tg=el("button","cfg-toggle","");
  tg.id="cfgmudo"; tg.type="button";
  const mus=linhaVolume("cfg_mus","Música",volMusica,v=>definirVolume("musica",v));
  const efe=linhaVolume("cfg_efe","Efeitos",volEfeitos,v=>definirVolume("efeitos",v));

  /* Um lugar só decide a aparência das três linhas, senão o mudo e as barras
     saem de sincronia como já saíam antes. */
  const pintar=()=>{
    tg.textContent=mudo?"Mudo":"Ligado";
    tg.className="cfg-toggle"+(mudo?"":" on");
    mus.li.className="cfg-linha"+(mudo?" cfg-off":"");
    efe.li.className="cfg-linha"+(mudo?" cfg-off":"");
    mus.inp.disabled=mudo; efe.inp.disabled=mudo;
  };
  tg.onclick=()=>{ definirMudo(!mudo); pintar(); };
  pintar();

  somL.append(el("span","cfg-rot","Som"),tg);
  p.append(topo,somL,mus.li,efe.li);
  p.appendChild(el("p","cfg-nota",
    "A trilha é cama de fundo e entra bem abaixo dos efeitos. Se quiser ouvir só "+
    "o soco, zere a música: os efeitos continuam no mesmo volume."));

  /* Clique no fundo fecha; clique dentro do painel não. */
  cx.onclick=e=>{ if(!e||e.target===cx)fecharConfig(); };
  p.onclick=e=>{ if(e&&e.stopPropagation)e.stopPropagation(); };

  cx.appendChild(p);
  cx.style.display="flex";
}
function fecharConfig(){
  const cx=document.getElementById("cfg");
  cfgAberto=false;
  if(!cx)return;
  cx.style.display="none";
  cx.innerHTML="";
}
function armarConfig(){
  const b=document.getElementById("cfgbtn");
  if(b)b.onclick=()=>{ SOM.toque(); cfgAberto?fecharConfig():abrirConfig(); };
  if(document.addEventListener)
    document.addEventListener("keydown",e=>{
      if(e&&e.key==="Escape"&&cfgAberto)fecharConfig(); });
}

/* =========================================================================
   FICHA DO LUTADOR — o painel que mostra a carreira acontecendo
   ========================================================================= */
const ROTULO_ATTR={slpm:"Volume",strDef:"Defesa de golpes",tdAvg:"Quedas",
  tdDef:"Defesa de queda",subAvg:"Finalizações",kdAvg:"Poder",
  durability:"Queixo",reach:"Alcance"};
const FMT_ATTR={slpm:v=>v.toFixed(2),strDef:v=>Math.round(v*100)+"%",tdAvg:v=>v.toFixed(2),
  tdDef:v=>Math.round(v*100)+"%",subAvg:v=>v.toFixed(2),kdAvg:v=>v.toFixed(2),
  durability:v=>v.toFixed(2),reach:v=>v.toFixed(0)+String.fromCharCode(34)};

/* Idade: começa em 24 e anda com a carreira. 22 lutas em ~9 anos é o ritmo de
   um cartel de UFC de verdade. */
const IDADE_INICIAL=24;
const idadeAtual=()=>IDADE_INICIAL+Math.floor(fightNo/2.4);

/* Assinatura derivada do eixo mais forte. É RÓTULO, não golpe simulado: o motor
   não tem tipos de golpe, e inventar um seria mentir para o jogador. */
function assinatura(){
  const f=lutadorEfetivo();
  const pares=[
    ["kdAvg", f.kdAvg/0.36,  me.stance==="Southpaw"?"Canhota de nocaute":"Cruzado de direita"],
    ["tdAvg", f.tdAvg/1.5,   "Queda dupla"],
    ["subAvg",f.subAvg/0.7,  "Mata-leão"],
    ["slpm",  f.slpm/3.5,    "Jab em série"],
    ["tdDef", f.tdDef/0.62,  "Sprawl de ferro"],
    ["strDef",f.strDef/0.58, "Esquiva e contra"],
  ];
  pares.sort((a,b)=>b[1]-a[1]);
  return pares[0][1]>1.05?pares[0][2]:"Sem golpe marcante";
}

/* O próximo passo para o cinturão, em linguagem de UFC. Limiares de standing
   intocados — são os mesmos que passam no testar.js. Só o texto mudou: nas
   duas últimas faixas dá pra nomear gente de verdade (RANKING), porque ali
   já são só 1-2 posições de banda. Entre 0.35 e 0.80 fica sem nome de
   propósito — com 26 empatados no peso-leve, nomear ali fingiria uma
   precisão que a escala não tem. */
function passoCinturao(){
  /* Interino: o próximo passo é sempre nomeado e explícito — a unificação
     é o que torna o interino incompleto até provar (ver
     CHANCE_CINTURAO_INTERINO), então "campeão" sozinho, sem dizer contra
     quem, esconderia isso. */
  if(st.title&&st.cinturaoInterino){
    const nm=RANKING&&RANKING.campeao?RANKING.campeao.name:"o campeão linear";
    return `Você é o campeão interino. A próxima luta é a unificação contra ${nm}`;
  }
  if(st.title)return null;
  const s=st.standing;
  /* Revamp fase 5: as três primeiras faixas falam na MESMA régua da
     posição que o Painel e a ficha mostram (#N de N). Antes diziam "top 5"
     e "ranking dos 15" numa hora em que a posição literal podia ser #95 de
     236 (a contradição anotada no CLAUDE.md). O alvo é a posição que o
     limiar da faixa dá na tabela desta divisão; limiares intocados. */
  const alvo=v=>{const p=posicaoDivisao(v);return p?`#${p.n}`:"o topo";};
  if(s<0.35)return `Vencer no card preliminar até chegar ao ${alvo(0.35)} da divisão`;
  if(s<0.60)return `Subir até o ${alvo(0.60)} vencendo quem está acima`;
  if(s<0.80)return `Chegar ao ${alvo(0.80)} da divisão`;
  if(s<0.88){
    const nm=RANKING&&RANKING.desafiante?RANKING.desafiante.name:"um contender do top 5";
    return `Vencer ${nm} para virar desafiante`;
  }
  if(st.streakW<3)return "Emplacar 3 vitórias seguidas para receber a disputa";
  /* candidatos() garante esse nome — a carta travada ignora `fought` (ver
     lá), então nomear aqui não promete o que o mecanismo pode não entregar.
     "concedida" junta st.disputaLiberada (persistente: já foi sorteado
     favorável antes, sobrevive entre lutas) com st.tituloEstaLuta (só é
     fresco DURANTE a decisão desta luta, setado em nextFight() — ver lá);
     qualquer um dos dois já garante que a próxima disputa, quando vier, é
     contra este nome. Reconquista (perdeu o cinturão antes) nomeia
     exCampeao, não RANKING.campeao — é contra quem tirou que a disputa de
     volta acontece. */
  const nm=st.exCampeao?st.exCampeao.name:(RANKING&&RANKING.campeao?RANKING.campeao.name:"o campeão");
  const concedida=st.disputaLiberada||st.tituloEstaLuta;
  return concedida
    ? `Você é o desafiante. A disputa contra ${nm} vem na próxima luta`
    : `Você é o desafiante. A disputa contra ${nm} pode vir ou não: depende de lesão do campeão, política e prioridade da organização`;
}

/* A posição sai da MESMA escala que escolhe adversário: candidatos() coloca o
   jogador em standing*(N-1) na escada, então essa é a posição que o jogo já
   usa de fato, só que invisível até agora.

   Não conto "quantos têm rating maior" de propósito: rating é vitórias em 18
   simulações, então só existem ~19 valores distintos e no peso-leve 26
   lutadores empatam no mesmo número. Uma vitória faria a posição saltar 20
   lugares de uma vez e a barra de progresso viraria escada de degrau alto. */
function posicaoDivisao(s){
  if(!LADDER||!LADDER.length||!st)return null;
  const N=LADDER.length;
  const v=clamp(s==null?st.standing:s,0,1);
  return {n:N-Math.round(v*(N-1)),de:N};
}

function textoDuracaoLesao(){
  if(st.lesao.permanente)return "Lesão permanente, não cura";
  const curaNaLuta=st.lesao.desdeLuta+st.lesao.duracao;
  if(curaNaLuta>TOTAL_FIGHTS)return "Dura até o fim da carreira";
  const restam=Math.max(0,curaNaLuta-(st.fightNo||0));
  return `Cura em ${restam} luta${restam===1?"":"s"}`;
}
function renderFicha(){
  const box=document.getElementById("ficha");
  if(!box||!st||!me)return;
  const passo=passoCinturao();
  const base=me.__base||{};
  /* Tale of the tape (revamp fase 5): o valor atual continua com o delta
     combinado (class g/dn, o que os testes de coerência conferem) e, ao
     lado, as três camadas que formam esse número: base do draft, treino
     permanente e evento (onde a lesão mora). Camada zerada não aparece. */
  const camada=(v,rot,cls)=>{const d=Math.round((v-1)*100);
    return d?`<span class="camada ${cls}${d<0?" cai":""}">${rot} ${d>0?"+":""}${d}%</span>`:"";};
  const linhas=ATTR_TREINAVEIS.concat(["reach"]).map(k=>{
    const b=base[k]!=null?base[k]:me[k];
    if(b==null)return "";
    const treinavel=ATTR_TREINAVEIS.includes(k);
    const atual=treinavel?statAtual(k):b;
    const ganho=b>0?(atual/b-1):0;
    const pct=Math.max(0,Math.min(1,PCT?PCT(k,atual):0.5));
    const pctBase=Math.max(0,Math.min(1,PCT?PCT(k,b):0.5));
    const tr=treinavel?((st.treino&&st.treino[k])||1):1;
    const ev=treinavel?((st.eventoMod&&st.eventoMod[k])||1):1;
    /* Marcador de lesão não pode depender só de cor (vermelho já é usado por
       qualquer perda comum, de propósito, ver LEIA-ME). Negrito no NOME do
       atributo é uma segunda pista que não é cor. */
    const machucado=st.lesao&&st.lesao.atributo===k;
    return `<div class="atr${machucado?" machucado":""}">
      <span class="r"${machucado?' style="font-weight:800"':""}>${ROTULO_ATTR[k]||k}</span>
      <span class="v">${FMT_ATTR[k]?FMT_ATTR[k](atual):atual.toFixed(2)}${
        ganho>0.005?`<span class="g">+${Math.round(ganho*100)}%</span>`
        :ganho<-0.005?`<span class="dn">${Math.round(ganho*100)}%</span>`:""}</span>
      <span class="atr-camadas"><span class="camada base">base ${FMT_ATTR[k]?FMT_ATTR[k](b):b.toFixed(2)}</span>${
        camada(tr,"treino","treino")}${camada(ev,"evento","evento")}</span>
      <span class="atrbar"><i class="base" style="width:${(pctBase*100).toFixed(0)}%"></i>
        <i class="gan" style="left:${(pctBase*100).toFixed(0)}%;width:${
          Math.max(0,(pct-pctBase)*100).toFixed(0)}%"></i>
        <i class="perda" style="left:${(pct*100).toFixed(0)}%;width:${
          Math.max(0,(pctBase-pct)*100).toFixed(0)}%"></i></span>
    </div>`;
  }).join("");

  const rk=posicaoDivisao();
  /* rankAnt é gravado antes do standing mudar, então o movimento é sempre
     o da última luta, não o acumulado. */
  const mov=rk&&st.rankAnt!=null?st.rankAnt-rk.n:0;
  const pico=rk?posicaoDivisao(st.peak):null;
  box.innerHTML=`<div class="ficha-grade">
    <div class="ficha-perfil">
      <div class="ficha-retrato">${bonecoSVG(ROSTO||cfgPadrao(),{w:220})}</div>
      <div class="ficha-id">
        <div class="nm">${me.name}</div>
        <div class="sub">${idadeAtual()} anos · ${st.wins}-${st.losses} · ${nomeDivisao(DIVISION)}${MODO==="lenda"?" · Seja uma lenda":""}</div>
      </div>
      <div class="ficha-dados">
        <div><span>Caixa</span><b>R$ ${fmtNum(st.dinheiro||0)}</b></div>
        <div><span>Golpe marcante</span><b>${assinatura()}</b></div>
      </div>
      <div class="ficha-sec">
        <h4>Cinturão</h4>
        <div class="cint"><span class="b ${st.title?"sim":"nao"}">${st.title?(st.cinturaoInterino?"Interino":"Campeão"):"Não"}</span>
          ${st.title&&!st.cinturaoInterino?`<small>${st.defesas||0} defesa${(st.defesas||0)===1?"":"s"}</small>`:""}
          ${st.cinturaoInterino?`<small>unificação na próxima luta</small>`:""}</div>
        ${passo?`<div class="passo-label">Caminho até o cinturão</div><div class="passo">${passo}</div>`:""}
      </div>
      ${RANKING&&RANKING.campeao?`<div class="ficha-sec">
        <h4>Ranking</h4>
        <div class="rank-pico">Campeão: <b>${(st.title&&!st.cinturaoInterino)?me.name:(st.exCampeao?st.exCampeao.name:RANKING.campeao.name)}</b></div>
        ${st.cinturaoInterino?`<div class="rank-pico">Interino: <b>${me.name}</b></div>`:""}
      </div>`:""}
      ${rk?`<div class="ficha-sec">
        <h4>Posição na divisão</h4>
        <div class="rank">
          <span class="pos">#${rk.n}</span>
          <span class="de">de ${rk.de}</span>
          ${mov?`<span class="mov ${mov>0?"sobe":"cai"}">${ICONE(mov>0?"sobe":"desce")}${Math.abs(mov)}</span>`:""}
        </div>
        ${pico&&pico.n<rk.n?`<div class="rank-pico">Melhor da carreira: #${pico.n}</div>`:""}
      </div>`:""}
      <div class="ficha-sec ficha-sair">
        <button id="btnAposentar" class="botao botao-sec botao-perigo" type="button">Aposentar-se</button>
      </div>
    </div>
    <div class="ficha-tape">
      ${st.lesao?`<div class="ficha-sec ficha-lesao">
        <h4>Lesão</h4>
        <div class="lesao">
          <div class="lesao-nome">${st.lesao.nome}</div>
          <div class="lesao-mag">${ROTULO_ATTR[st.lesao.atributo]||st.lesao.atributo}
            ${Math.round((st.lesao.mult-1)*100)}%</div>
          <div class="lesao-dur">${textoDuracaoLesao()}</div>
        </div>
      </div>`:""}
      <div class="ficha-sec">
        <h4>Atributos</h4>
        <div class="tape-legenda"><span class="camada base">base do draft</span><span class="camada treino">treino</span><span class="camada evento">eventos e lesão</span></div>
        <div class="atrs">${linhas}</div>
      </div>
    </div>
  </div>`;
  /* NÃO calcula disabled aqui dentro do innerHTML: renderFicha() só roda de
     novo quando alguém chama ela (fim de luta, aplicarCamp(), etc) — se
     ficasse travado no valor de playing/escolhaAberta/dilemaAberto DESTE
     instante, o botão nasceria "habilitado" no meio de uma luta que só
     começou DEPOIS da última renderFicha() e ficaria errado até a
     próxima chamada (achado testando: renderFicha() roda ANTES de
     iniciarTelaLuta() setar playing=true em lutar()). Quem decide
     visualmente é o CSS via html[data-estado-carreira] (ver @media no
     fim do legado.css, mesmo mecanismo de #next/#autob) — sempre correto
     porque atualizarEstadoCarreira() já roda em toda transição real.
     Botão vive dentro do innerHTML de cima (a ficha inteira é uma string
     só) — liga o handler de verdade depois, mesmo padrão de #nomeIn em
     screenCriador(). Trava dupla: CSS acima (visual, sempre em dia) E o
     guard em abrirConfirmarAposentadoria() (funcional, mesmo raciocínio
     de next.disabled em atualizarControles()) — pra não abrir o
     encerramento em cima de uma narração ou escolha em andamento mesmo
     no instante entre a luta começar e a próxima renderFicha(). */
  const btnApos=document.getElementById("btnAposentar");
  if(btnApos)btnApos.onclick=abrirConfirmarAposentadoria;
  renderBarraHub();
}
/* Aposentadoria voluntária: mesmo destino de fim de carreira natural
   (screenReport() — não hardcoda "22 lutas" em lugar nenhum, lê st.wins/
   st.losses/grade() do estado atual, então funciona em qualquer fightNo).
   Confirmação em painel próprio, não confirm() nativo — o jogo inteiro
   evita chrome de navegador (mesma razão do cfg-overlay/painel-momentos
   já existirem). Sem fechar em toque fora, de propósito: é permanente,
   merece escolha explícita entre Cancelar e Aposentar-se, não um toque
   sem querer no fundo. */
function abrirConfirmarAposentadoria(){
  if(playing||escolhaAberta||dilemaAberto)return;
  const p=document.getElementById("painelAposentar");
  if(!p)return;
  p.innerHTML="";
  const box=el("div","painel-n confirma-sair");
  box.appendChild(el("h2","painel-titulo","Aposentar-se agora?"));
  box.appendChild(el("p","confirma-txt",
    `A carreira de <b>${me.name}</b> termina aqui, com ${st.wins}-${st.losses} no cartel.
     Não dá pra desfazer. Você vai direto pro encerramento, igual ao fim das 22 lutas.`));
  const row=el("div","confirma-acoes");
  const cancelar=el("button","botao botao-sec","Cancelar");
  cancelar.onclick=()=>{SOM.toque();fecharConfirmarAposentadoria();};
  const confirmar=el("button","botao","Aposentar-se");
  confirmar.onclick=confirmarAposentadoria;
  row.append(cancelar,confirmar);
  box.appendChild(row);
  p.appendChild(box);
  p.style.display="flex";
}
function fecharConfirmarAposentadoria(){
  const p=document.getElementById("painelAposentar");
  if(p){p.style.display="none";p.innerHTML="";}
}
function confirmarAposentadoria(){
  SOM.toque();
  /* Mesma limpeza que o fim natural de carreira já faz (ver o bloco
     fightNo>=TOTAL_FIGHTS em finishFight()): sem isso, um autoTimer
     pendente do modo automático dispararia nextFight() por cima da tela
     de encerramento que screenReport() acabou de montar. */
  auto=false;clearTimeout(autoTimer);
  fecharConfirmarAposentadoria();
  screenReport();
}

/* =========================================================================
   ESCOLHAS DE CARREIRA
   O jogo pedia 4 decisões no draft e depois só "próxima luta" 22 vezes.
   Agora cada luta tem duas: contra quem lutar e como se preparar.
   ========================================================================= */
/* Treino agora é PERMANENTE. Isso obriga teto e retorno decrescente: sem eles,
   22 lutas de +10% viram +700% e a calibração toda vai embora.

   Cada atributo tem um multiplicador acumulado que começa em 1.00 e satura em
   TETO_TREINO. O ganho de cada camp é proporcional ao que FALTA para o teto,
   então os primeiros treinos rendem muito e os últimos quase nada — que é como
   evolução de atleta funciona de verdade.

   Baixado de 1.26 pra 1.18 nesta leva (decisão registrada em LEIA-ME.md,
   seção "Progressão do lutador"): medido que a alavanca do cinturão fácil
   demais era a ALTURA do teto, não o formato da curva (cortar o 1º camp
   pela metade não mudava o título em nada, 70,0%=70,0%; baixar o teto de
   1.26→1.18→1.12 tirava 9-10 pontos por passo). Efeito em vitórias
   remedido no teto novo — ver LEIA-ME. */
/* 1.18 -> 1.10 no balanço de 2026-09-28 (ver BUDGET_PCT). */
const TETO_TREINO=1.10;
const CAMPS=[
 {id:"boxe",nome:"Boxe",desc:"Semanas na luva, cabeça saindo da linha.",
  ganho:"defesa de golpes e volume",
  alvos:{strDef:1.00,slpm:0.55},
  contra:["Nocauteador","Pressão","Contragolpeador"]},
 {id:"wrestling",nome:"Wrestling",desc:"Camp inteiro no tatame, sprawl e levantada.",
  ganho:"defesa de queda e quedas",
  alvos:{tdDef:1.00,tdAvg:0.60},
  contra:["Wrestler","Finalizador","Antiqueda"]},
 {id:"jiujitsu",nome:"Jiu-jitsu",desc:"Guarda, raspagem e caça de pescoço.",
  ganho:"finalizações e defesa de queda",
  alvos:{subAvg:1.00,tdDef:0.45},
  contra:["Finalizador","Wrestler"]},
 {id:"fisico",nome:"Físico",desc:"Só condicionamento e força. Aguenta e machuca.",
  ganho:"queixo e poder",
  alvos:{durability:0.85,kdAvg:0.85},
  contra:["Queixo de ferro","Completo","Nocauteador"]},
];
/* Medidos nesta leva (item 4) — node testar.js dinheiro, 400 carreiras de
   bot, candidatos()/aplicarCamp()/simulateFight() reais. Meta: treinador
   melhor acessível entre a luta 6 e a 8 numa carreira mediana — bateu luta
   7 (mediana), 0/400 carreiras nunca alcançaram. Ver PENDENCIAS item 4. */
const RENDA_BASE=6000;
const CUSTO_TREINADOR=54000;
/* Trocado nesta leva seguinte: acelerar RITMO_TREINO media +0,05
   vitórias/22 (testado até 3x sem passar de +0,37) — a mesma curva de
   retorno decrescente do TETO_TREINO limitava qualquer multiplicador,
   comprar não mudava nada que se sentisse. Substituído por algo que o
   treino não toca: reduz o tempo de recuperação de lesão TEMPORÁRIA pela
   metade (não mexe em permanente — não tem "cura" pra acelerar ali).
   Medido (protocolo do LEIA-ME "Lesão": 300 carreiras, camp fixo mirando o
   atributo lesionado, lesão forçada na luta 6, mesmas seeds com/sem):
   baseline (duração 8) custa 1,07 vitórias/22 — bate com o 1,06 já
   documentado. Duração pela metade (4) recupera 0,37; duração num quarto
   (2) recupera 0,66. Fica em metade — visível na ficha (o "Cura em N
   lutas" desce mais rápido de verdade) sem zerar o custo da lesão, que é
   o ponto dela existir. Comparado com a outra ideia medida (reduzir a
   CHANCE da lesão acontecer, via rng próprio): a 50% de chance de evitar
   recupera 0,55/22, mesma ordem de grandeza — mas invisível quando "quase
   aconteceu" (nada pra mostrar), enquanto acelerar cura é um número que o
   jogador vê contar mais rápido. Escolhido por isso, não só pela medição. */
const REDUCAO_CURA_TREINADOR=0.5;
const ATTR_TREINAVEIS=["slpm","strDef","tdAvg","tdDef","subAvg","kdAvg","durability"];
const RITMO_TREINO=0.30;      // fração do que falta para o teto, por camp

function aplicarCamp(camp){
  st.campHist=st.campHist||{};
  st.campHist[camp.id]=(st.campHist[camp.id]||0)+1;
  st.treino=st.treino||{};
  for(const [k,peso] of Object.entries(camp.alvos)){
    const atual=st.treino[k]||1;
    const falta=TETO_TREINO-atual;
    st.treino[k]=atual+falta*RITMO_TREINO*peso;
  }
}
/* valor efetivo = base do draft × multiplicador de treino × modificadores de evento */
function statAtual(k){
  const base=(me.__base&&me.__base[k]!=null)?me.__base[k]:me[k];
  const t=(st.treino&&st.treino[k])||1;
  const ev=(st.eventoMod&&st.eventoMod[k])||1;
  return base*t*ev;
}
function lutadorEfetivo(){
  const f=Object.assign({},me);
  ATTR_TREINAVEIS.forEach(k=>{if(me[k]!=null)f[k]=statAtual(k);});
  if(f.strDef>.93)f.strDef=.93;
  if(f.tdDef>.95)f.tdDef=.95;
  return f;
}

/* Escalonamento aprovado nesta leva: base 0,65, +0,12 por recusa, teto
   0,95 — quanto mais vezes o jogador fica esperando elegível, mais fácil
   fica a próxima rolagem (frustração crescente, não sorteio isolado
   repetido pra sempre). Medido antes/depois (node testar.js espera,
   2.000 carreiras): efeito pequeno, e é isso mesmo — CHANCE_DISPUTA=.65
   já é alto sozinho, a mediana já era 0 luta extra ANTES do
   escalonamento (a maioria recebe na primeira rolagem elegível). Antes:
   p90=2, p95=4, p99=7, pior caso=10. Depois: p90=1, p95=4, p99=7, pior
   caso=11 (dentro do ruído de amostra, não piorou de verdade). O
   escalonamento só muda algo pra quem já teria 2+ recusas seguidas — uma
   fatia pequena da distribuição, porque a base já é generosa. Registrado
   honesto: pedido implementado, efeito real é modesto, não o tipo de
   mudança que se sente jogando. */
const CHANCE_DISPUTA=0.65;
const CHANCE_DISPUTA_INCREMENTO=0.12;
const CHANCE_DISPUTA_TETO=0.95;

/* Cinturão interino: quando a disputa pelo cinturão de verdade é concedida
   (tituloLiberado()==true, jogador ainda não é campeão de nada), o campeão
   nomeado (RANKING.campeao) pode estar indisponível — sorteio em holdRng,
   nunca em rng (mesmo motivo do sorteio acima). Se sair indisponível, a
   luta é pelo interino contra RANKING.desafiante (=RANKING.lista[1], o nº1
   da divisão), não pelo cinturão de verdade — RANKING.campeao não muda,
   é ausência, não derrota. Alvo do usuário: ~12% das CARREIRAS que chegam
   a uma disputa (não 12% por rolagem — uma carreira pode rolar de novo se
   perder a primeira disputa e for elegível outra vez, então o valor por
   carreira sai maior que o valor por rolagem). Medido (2026-09-05, 3.000
   carreiras por valor): .12 dá 10,4% no peso-leve (pool grande, poucas
   redisputas) e 13,5% no peso-pesado (pool menor, mais redisputa) — as
   duas divisões testadas ficam nos dois lados do alvo, sem precisar de
   valor por divisão. */
const CHANCE_CINTURAO_INTERINO=0.12;

/* Elegível (standing>.88 + streak 3) != disputa concedida. "Pode não vir"
   (lesão do campeão, política) é um sorteio em holdRng — nunca em rng, senão
   desloca a sequência e link de desafio antigo para de reproduzir a mesma
   carreira. Uma vez concedida fica concedida (st.disputaLiberada), não
   sorteia de novo a cada fight-decision. Defesa (st.title já true) não
   sorteia: é obrigatória, como no UFC real.

   st.disputaRecusas zera quando a elegibilidade cai (perdeu o streak ou o
   standing) — é frustração de UMA janela de espera, não uma dívida que
   atravessa a carreira inteira sem relação com a forma atual. */
function tituloLiberado(){
  if(st.title)return true;
  const elegivel=st.standing>.88&&st.streakW>=3;
  if(!elegivel){st.disputaRecusas=0;return false;}
  if(st.disputaLiberada)return true;
  const chance=Math.min(CHANCE_DISPUTA_TETO,
    CHANCE_DISPUTA+CHANCE_DISPUTA_INCREMENTO*(st.disputaRecusas||0));
  if(holdRng()<chance){st.disputaLiberada=true;return true;}
  st.disputaRecusas=(st.disputaRecusas||0)+1;
  st.maxDisputaRecusas=Math.max(st.maxDisputaRecusas||0,st.disputaRecusas);  // disputaRecusas zera quando a elegibilidade cai; isto não
  return false;
}

/* três candidatos: mais fraco, parelho e acima. A diferença não é só risco —
   é quanto o ranking anda. Ganhar de quem está acima vale muito mais.

   Campeão e desafiante nº1 (RANKING) nunca aparecem aqui — são reservados
   pra luta de título/defesa forçada abaixo. Sem essa reserva, standing alto
   deixa a faixa "duro" bem em cima do topo da escada, onde o campeão está:
   ele apareceria como luta comum antes da disputa, e a disputa de verdade
   viraria revanche. */
/* ---------- Modo Rival (Plano Pro, item 4) ----------
   Nome fictício, stats emprestados de um lutador real da divisão — mesma
   proteção de imagem que a ausência de retrato pros 1.527 reais (ver
   CLAUDE.md "Nada de rosto para os lutadores reais"): a IA vai dar VOZ a
   esse rival (coletiva/entrevista), e falas inventadas na boca de um
   atleta de verdade são o mesmo risco que retrato, só que em texto. Por
   isso o nome NUNCA é de um lutador real (pool próprio abaixo), e a
   bio emprestada (fights/era/titulos) é sanitizada — só os números de
   COMBATE (rating e os atributos treináveis) vêm do lutador real, pra
   manter a dificuldade justa no motor; o resto (quantas lutas teve, em
   que época, quantos títulos) seria história de uma pessoa de verdade
   contada como se fosse ficção, e isso continua sendo o problema que a
   regra de "sem retrato" já resolveu pro rosto. */
const RIVAL_PRIMEIRO_M=["Rafael","Thiago","Bruno","Igor","Cauê","Renan","Diego",
  "Vitor","Matheus","Gustavo","André","Felipe","Marcos","Leandro"];
const RIVAL_PRIMEIRO_F=["Camila","Larissa","Beatriz","Juliana","Fernanda","Priscila",
  "Vanessa","Aline","Débora","Renata","Patrícia","Gabriela","Carolina","Natália"];
const RIVAL_SOBRENOME=["Duarte","Farias","Cordeiro","Bastos","Teixeira","Amaral",
  "Pontes","Siqueira","Moraes","Cavalcante","Nogueira","Brandão","Falcão","Marinho"];
function nomeRival(nomesReais){
  const primeiros=(DIVISION||"").startsWith("w_")?RIVAL_PRIMEIRO_F:RIVAL_PRIMEIRO_M;
  let nome,tentativas=0;
  do{
    nome=primeiros[Math.floor(rivalRng()*primeiros.length)]+" "+
      RIVAL_SOBRENOME[Math.floor(rivalRng()*RIVAL_SOBRENOME.length)];
    tentativas++;
  }while(nomesReais.has(nome)&&tentativas<20); // some combinação bate um nome real — troca, não trava
  return nome;
}
/* Cedo na carreira (luta 3), reaparece a cada 4 lutas depois disso — pausa
   de vez quando o jogador já venceu ele uma vez (rivalidade "resolvida",
   não persegue pra sempre). Nunca durante luta de título/defesa (o motor
   já reserva essa luta pra uma coisa só, ver candidatos() acima).
   st.rivalAtivado (item 4, 2026-09-22): sem a escolha explícita em
   screenAtivarRival(), o rival NUNCA aparece — meuPro sozinho não basta
   mais (antes disso, todo Pro tinha rival automático e silencioso). */
function rivalDeveAparecer(){
  if(!meuPro||!st.rivalAtivado||st.tituloEstaLuta)return false;
  if(st.rival&&st.rival.historico.some(h=>h.ganhou))return false;
  const proximaLuta=fightNo+1;
  if(!st.rival)return proximaLuta===3;
  return proximaLuta>=3&&(proximaLuta-3)%4===0;
}
function gerarRival(){
  const reservados=new Set((RANKING&&RANKING.lista||[]).map(f=>f.name));
  const pool=LADDER.filter(f=>!reservados.has(f.name));
  const base=pool[Math.floor(rivalRng()*pool.length)]||LADDER[0];
  // nome do jogador (validado em screenAtivarRival(): não bate com
  // nenhum dos 1.527 reais, passou por CONTEUDO_INSEGURO) — nomeRival()
  // só entra como fallback se por algum motivo nada foi escolhido
  // (nunca deveria acontecer, rivalDeveAparecer() já exige rivalAtivado).
  const nome=st.rivalNomeEscolhido||nomeRival(new Set(LADDER.map(f=>f.name)));
  st.rival={
    nome,
    // stats de combate reais (mantém dificuldade justa), bio sanitizada
    // (nunca a carreira de verdade de quem emprestou os números)
    f:{...base,name:nome,fights:12+Math.floor(rivalRng()*16),era:null,
       titulos:{disputas:0,vitorias:0}},
    historico:[],
  };
}

function candidatos(){
  /* NÃO chama tituloLiberado() aqui. st.tituloEstaLuta já foi decidido em
     nextFight(), uma vez por luta, antes de existir tela ou pick automático.
     candidatos() só lê. Se o sorteio do holdRng morasse aqui, qualquer chamada
     futura a candidatos() fora de nextFight() (ou uma segunda chamada por
     engano) sortearia de novo e a chance efetiva de "a disputa vir" deixaria
     de ser CHANCE_DISPUTA por luta — passaria a depender de quantas vezes a
     função foi invocada. */
  if(st.tituloEstaLuta){
    /* A carta travada IGNORA `fought` de propósito — revanche de título é o
       caso NORMAL do UFC, não exceção. Perder pro campeão e voltar pra
       reconquistar, ou defender contra o mesmo desafiante nº1 mais de uma
       vez, é a história, não um furo. Isso já foi tentado com guard
       (`!fought.has(alvo.name)`) e quebrou: depois de qualquer disputa —
       vitória OU derrota — `lutar()` marca `fought.add(opp.name)`
       incondicional, então RANKING.campeao/desafiante ficam banidos de si
       mesmos pra sempre a partir da 1ª vez, e a reconquista caía no fallback
       comum contra um nome qualquer — o jogador ganhava o cinturão de
       alguém aleatório enquanto a ficha continuava nomeando o campeão de
       verdade. RANKING.campeao/desafiante continuam banidos das 3 BANDAS
       COMUNS (reservados, abaixo) — só este caminho travado passa por cima
       do `fought`. Repetir contra os dois nomeados é esperado e testado
       (`node testar.js interface`/`cinturao`, ver LEIA-ME "O passo para o
       cinturão" pela explicação completa); repetir contra qualquer outra
       pessoa continua sendo bug. */
    /* Defendendo, o alvo roda pelo RANKING.lista (rotação de contender —
       ver st.desafianteIdx em finishFight()); desafiando, é sempre o
       campeão nomeado, que não roda (só existe um campeão de verdade).
       Duas exceções, cinturão interino (ver CHANCE_CINTURAO_INTERINO):
       - desafiando com o campeão indisponível (tituloInterinoLuta): a
         disputa é pelo interino, contra RANKING.desafiante (nº1 da
         divisão), não contra o campeão que não apareceu.
       - já com o interino (st.cinturaoInterino): a próxima luta NÃO
         segue a rotação de contender — é a unificação, sempre contra
         RANKING.campeao, nomeado. Interino não defende antes de unificar
         (ver finishFight()): é incompleto até provar contra o de verdade. */
    let alvo;
    if(st.title&&st.cinturaoInterino) alvo=RANKING.campeao;
    else if(!st.title&&st.tituloInterinoLuta) alvo=RANKING.desafiante;
    else{
      const idx=Math.min(st.desafianteIdx||1,RANKING.lista.length-1);
      alvo=st.title?RANKING.lista[idx]:RANKING.campeao;
    }
    if(alvo)return[{f:alvo,ganho:st.title?.10:.15}];
  }
  const N=LADDER.length;
  /* Os 16 do RANKING.lista inteiro ficam de fora das 3 bandas comuns, não só
     campeão+desafiante — com rotação, qualquer um deles pode vir a ser o
     próximo desafiante trancado; medido antes de escrever (node testar.js
     divisoes): pior caso é peso-pesado lenda, 49-16=33 sobrando pras 22
     lutas, margem de 11. */
  const reservados=new Set((RANKING&&RANKING.lista||[]).map(f=>f.name));
  /* No topo do ranking não existe "acima": a faixa perigosa colapsava num
     único adversário repetido e virava a opção MAIS fácil. Recuamos o centro
     para que as três faixas sempre tenham gente de verdade. */
  /* Balanço 2026-09-28: as três faixas subiram na escada (eram -16..-7%,
     -3..+3% e +8..+20%) e o centro nunca fica abaixo de 25% da divisão:
     o fundo da tabela (quem quase não vence ninguém) não aparece mais, e
     perder não devolve o jogador pra uma fila de vitória fácil. Medido em
     node testar.js balanco (LEIA-ME "Balanço"). */
  const larg=0.30;
  const c=Math.floor((0.25+(1-larg-0.25)*Math.min(st.standing/(1-larg),1))*(N-1));
  const faixas=[[-0.06,0.03,0.045],[0.07,0.13,0.075],[0.18,larg,0.125]];
  const out=[];
  for(const [lo,hi,ganho] of faixas){
    const a=Math.max(0,Math.min(N-1,c+Math.round(lo*N)));
    const b=Math.max(a,Math.min(N-1,c+Math.round(hi*N)));
    let esc=null;
    for(let t=0;t<60;t++){
      const cand=LADDER[a+Math.floor(rng()*(b-a+1))];
      if(cand&&!fought.has(cand.name)&&!reservados.has(cand.name)&&!out.some(o=>o.f.name===cand.name)){esc=cand;break;}
    }
    if(!esc){ // varre a faixa inteira antes de desistir
      for(let i=a;i<=b;i++){const cd=LADDER[i];
        if(cd&&!fought.has(cd.name)&&!reservados.has(cd.name)&&!out.some(o=>o.f.name===cd.name)){esc=cd;break;}}
    }
    /* Último recurso: o mais próximo da faixa que ainda não foi enfrentado.
       Antes isso devolvia LADDER[a] direto e, num pool apertado, devolvia alguém
       JÁ ENFRENTADO em silêncio — o modo lenda (49 lutadores no peso-pesado) fez
       isso aparecer, mas o buraco sempre esteve aqui. A varredura não consome
       rng, então link de desafio antigo continua reproduzindo a mesma carreira. */
    if(!esc)for(let r=1;r<N&&!esc;r++){
      for(const i of [a-r,b+r]){
        const cd=LADDER[i];
        if(cd&&!fought.has(cd.name)&&!reservados.has(cd.name)&&!out.some(o=>o.f.name===cd.name)){esc=cd;break;}
      }
    }
    /* só sobra se o pool for menor que a carreira, e aí a divisão nem é oferecida */
    if(!esc)esc=LADDER[Math.max(0,Math.min(N-1,a))];
    out.push({f:esc,ganho});
  }
  /* Modo Rival: 4ª carta, só Pro, só quando elegível (rivalDeveAparecer()).
     Nunca troca uma das 3 bandas comuns — soma, não substitui. Guard contra
     colisão de nome com uma das 3 já escolhidas (raro, mas o rival empresta
     stats de alguém do mesmo LADDER que as bandas comuns também sorteiam). */
  if(rivalDeveAparecer()){
    if(!st.rival)gerarRival();
