function lerDesafio(){
  try{
    const p=new URLSearchParams(location.search);
    const d=p.get("d"), s=p.get("s");
    if(!d||!s)return null;
    if(!DIVISOES.some(x=>x.id===d))return null;
    const n=parseInt(s,36);
    if(!Number.isFinite(n)||n<=0)return null;
    return{div:d,seed:n>>>0,modo:p.get("m")==="lenda"?"lenda":"normal"};
  }catch(e){return null;}
}

     divisão tem — e quais delas deixam de fechar 22 lutas sem repetir. */
  const modos=el("div","modos");

      if(ROSTER.filter(f=>f.division===d.id).length<MIN_LUTADORES)return;

      const c=el("button","div-c"+(d.f?" fem":""),
        `<span class="n">${d.nome}</span>
         <span class="lb">até ${d.lbs} lb · ${ko>=1.3?"nocaute alto":ko>=.9?"nocaute médio":"nocaute baixo"}</span>
         <span class="qt"><b>${pool.length}</b> ${MODO==="lenda"?"lendas":"lutadores"}</span>
         <span class="top">o melhor daqui é ${top.name}</span>`);

      grid.appendChild(c);
    });

    nota.innerHTML=fora.length
      ? `Uma carreira são 22 lutas sem repetir adversário, então divisão com menos
         de ${MIN_LUTADORES} lendas não fecha. Fora daqui: ${fora.join(" · ")}.`
      : "";
  };
  desenha();
}
function startDraft(name){
  /* refeito a cada carreira porque a divisão OU o modo podem ter mudado */
  POOL=poolDivisao(DIVISION);
  PCT=makePercentiler(POOL);
  LADDER=[...POOL].sort((a,b)=>a.rating-b.rating);
  RANKING=buildRanking(POOL);
  /* A semente garante os ADVERSÁRIOS e a ordem deles — é isso que torna o
     link um desafio de verdade em vez de um print. Não garante mais o
     draft (o "Rolar novamente" consome rng sob demanda, uma vez por
     criação) nem os eventos de vida (agora gerados pela IA, sem sorteio
     determinístico nenhum) — ver PENDENCIAS.md e a tela de convite
     (screenName()) pro texto exato da promessa. */
  SEED=SEED||((Math.random()*4294967295)>>>0);
  rng=mulberry32(SEED);
  rerollUsado=false;
  /* Stream separado pra "a disputa pode não vir": nunca consome do rng
     principal, senão qualquer sorteio aqui deslocaria a sequência e link de
     desafio antigo pararia de reproduzir a mesma carreira. */
  holdRng=mulberry32((SEED^0x9E3779B9)>>>0);
  /* Mesmo motivo do holdRng, stream próprio: sorteia qual frase neutra do
     fallback local aparece, sem tocar no rng principal — senão qualquer
     dilema cortado localmente deslocaria a sequência e o link de desafio
     pararia de reproduzir a mesma carreira. */
  fraseRng=mulberry32((SEED^0x1234ABCD)>>>0);
  escolhaRng=mulberry32((SEED^0x5F3A9C21)>>>0);
  lesaoRng=mulberry32((SEED^0x7C3E1A55)>>>0);
  eventoRng=mulberry32((SEED^0x2B8D4F17)>>>0);
  dilemaRng=mulberry32((SEED^0x4D1E8A63)>>>0);
  me={name,division:DIVISION};picks=[];
  budgetLeft=TOTAL_WEIGHT*BUDGET_PCT;
  remaining=[...PAIRS];
  docmeta.textContent=`Registro · ${name}`;
  renderDraft();
}
/* Os 8 atributos ocupam os 8 lados do octógono, e cada par preenche dois lados
   VIZINHOS. O encaixe é exato — não é decoração adaptada. */
const SLOTS=[
 {k:"slpm",       lab:"Volume",    par:"trocacao", ang:-90},
 {k:"reach",      lab:"Alcance",   par:"trocacao", ang:-45},
 {k:"kdAvg",      lab:"Poder",     par:"poder",    ang:0},
 {k:"durability", lab:"Queixo",    par:"poder",    ang:45},
 {k:"tdAvg",      lab:"Quedas",    par:"chao",     ang:90},
 {k:"tdDef",      lab:"Def. queda",par:"chao",     ang:135},
 {k:"subAvg",     lab:"Finaliz.",  par:"jiujitsu", ang:180},
 {k:"strDef",     lab:"Def. golpe",par:"jiujitsu", ang:225},
];
const FMT={slpm:v=>v.toFixed(1),reach:v=>v.toFixed(0)+'"',kdAvg:v=>v.toFixed(2),
  durability:v=>v.toFixed(2),tdAvg:v=>v.toFixed(1),tdDef:v=>Math.round(v*100)+"%",
  subAvg:v=>v.toFixed(1),strDef:v=>Math.round(v*100)+"%"};

function octogonoSVG(){
  const p=[];
  for(let i=0;i<8;i++){const a=(i*45-67.5)*Math.PI/180;
    p.push(`${50+41*Math.cos(a)},${50+41*Math.sin(a)}`);}
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="${p.join(" ")}" fill="none" stroke="var(--line2)" stroke-width="1.1"/>
    <polygon points="${p.join(" ")}" fill="none" stroke="var(--line)" stroke-width="6"
      transform="translate(50 50) scale(.72) translate(-50 -50)"/>
    <polygon points="${p.join(" ")}" fill="none" stroke="var(--line)" stroke-width=".5"
      transform="translate(50 50) scale(.46) translate(-50 -50)"/></svg>`;
}
let parRecem=null;
function desenhaOctogono(destacar){
  const w=document.getElementById("oct");
  if(!w)return;
  const feitos=picks.length, total=4;
  w.innerHTML=octogonoSVG()+
    `<div class="oct-mid"><div class="n">${feitos}<span style="font-size:17px;color:var(--faded)">/${total}</span></div>
      <div class="l">montado</div><div class="b"><i style="width:${feitos/total*100}%"></i></div></div>`;
  SLOTS.forEach(s=>{
    const a=s.ang*Math.PI/180;
    const x=50+38*Math.cos(a), y=50+38*Math.sin(a);
    const v=me[s.k];
    const cheio=v!=null;
    const origem=(picks.find(p=>p.pair.id===s.par)||{}).from||"";
    const d=document.createElement("div");
    /* A fixada tem que rodar UMA vez, quando o par acaba de ser escolhido.
       Como esta função roda a cada passada de mouse, sem a flag ela reanimava
       atributos já preenchidos toda hora. */
    d.className="slot"+(cheio?" cheio":"")+(destacar===s.par?" mira":"")+
      (parRecem===s.par?" novo":"");
    d.style.left=x+"%"; d.style.top=y+"%";
    d.innerHTML=`<span class="lab">${s.lab}</span>
      <span class="val">${cheio?FMT[s.k](v):"—"}</span>
      <span class="src">${cheio?origem:"vazio"}</span>`;
    w.appendChild(d);
  });
  parRecem=null;                 // consumida: não reanima nas próximas passadas
}

function renderDraft(){
  app.innerHTML="";
  app.appendChild(el("div","eyebrow",
    `${(DIVISOES.find(d=>d.id===DIVISION)||{}).nome||DIVISION} · montagem ${4-remaining.length+1} de 4 · cada escolha traz dois atributos do mesmo lutador`));

  const arena=el("div","arena");
  const esq=el("div","painel");
  /* Antes esta coluna não tinha painel/moldura nenhuma — as outras duas
     tinham borda + título (.col-t) e esta só flutuava um diagrama sozinho
     no meio da tela, com muito vazio em volta em qualquer viewport largo.
     Mesma moldura das vizinhas agora, com título e legenda embaixo. */
  const meio=el("div","painel painel-oct");
  const dir=el("div","painel dossie");dir.id="dossie";
  meio.innerHTML=`<div class="col-t">Seu octógono</div>
    <div class="oct-wrap" id="oct"></div>
    <p class="oct-legenda">Cada vértice é um atributo do seu lutador — a carta
      escolhida no momento pisca no vértice e na célula do dossiê que ela preenche.</p>`;
  arena.append(esq,meio,dir);
  app.appendChild(arena);

  const pl=budgetLeft/(TOTAL_WEIGHT*BUDGET_PCT);
  esq.innerHTML=`<div class="col-t">Escolha o próximo par</div>
    <div class="budget"><span class="budget-num"><small>Orçamento</small>${budgetLeft.toFixed(2)}</span>
      <span class="budget-bar"><span class="budget-fill${pl<.3?" low":""}"
        style="width:calc(${(pl*100).toFixed(1)}% - 2px)"></span></span></div>
    <button class="btn btn-ghost btn-sm reroll" id="reroll"></button>
    <div class="cards cards-scroll" id="cards" style="grid-template-columns:1fr"></div>`;
  /* Item 3: uma rolagem nova da mesa atual, uma vez em toda a criação (não
     por par) — desabilita globalmente com rerollUsado, não um contador por
     tela. Consome rng (rollTable() chama rng() de novo pra sortear outra
     vez), então a partir daqui o draft deixa de ser reprodutível pelo link
     — só os ADVERSÁRIOS continuam garantidos pela semente (ver
     startDraft() e screenName()). .disabled setado em JS, não só no texto
     do template — mesmo padrão de go.disabled/inp.disabled em
     abrirDilema(), é o que fica de fato desabilitado (clicável ou não),
     não só visualmente cinza. */
  const rerollBtn=document.getElementById("reroll");
  rerollBtn.textContent=rerollUsado?"Já rolou":"Rolar novamente";
  rerollBtn.disabled=rerollUsado;
  rerollBtn.onclick=()=>{
    if(rerollUsado)return;
    rerollUsado=true;
    renderDraft();
  };

  const rows=rollTable(POOL,remaining,rng,PCT);
  const afford=rows.filter(r=>r.cost<=budgetLeft);
  const shown=afford.length?afford:[rows.reduce((m,r)=>r.cost<m.cost?r:m)];
  const grid=document.getElementById("cards");
  shown.forEach(r=>{
    const pa=PCT(r.pair.a.key,r.src[r.pair.a.key]),pb=PCT(r.pair.b.key,r.src[r.pair.b.key]);
    const attr=(d,p)=>`<span class="attr mira-attr" style="display:block">
      <span style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <span class="attr-l">${d.label}${p>=.90?'<span class="elite">elite</span>':""}</span>
        <span class="attr-v">${d.fmt(r.src[d.key])}</span></span>
      ${pctBar(p)}</span>`;
    const c=el("button","card",`
      <span class="pair">${r.pair.label}</span>
      <span class="src"><b style="color:var(--ink);font-weight:600;font-size:12.5px">${r.src.name}</b> · ${r.src.fights} lutas</span>
      ${attr(r.pair.a,pa)}${attr(r.pair.b,pb)}
      <span class="cost"><span>custo</span><b>${r.cost.toFixed(2)}</b></span>`);
    c.onclick=()=>pick(r);
    c.onmouseenter=()=>{mostraDossie(r);desenhaOctogono(r.pair.id);};
    c.onfocus=c.onmouseenter;
    grid.appendChild(c);
  });
  desenhaOctogono(null);
  mostraDossie(null);
  if(picks.length===0)app.appendChild(el("div","legend",
    `A barra é o <b>percentil na divisão</b>: quanto da divisão esse lutador supera
     naquele atributo. Passe o mouse numa carta para ver os dois lados que ela preenche.`));
}
function pick(r){
  me[r.pair.a.key]=r.src[r.pair.a.key];
  me[r.pair.b.key]=r.src[r.pair.b.key];
  [r.pair.a.key,r.pair.b.key].forEach(k=>(RIDERS[k]||[]).forEach(rk=>me[rk]=r.src[rk]));
  budgetLeft-=r.cost;
  picks.push({pair:r.pair,from:r.src.name});
  parRecem=r.pair.id;SOM.fixa();
  remaining=remaining.filter(p=>p.id!==r.pair.id);
  if(remaining.length)renderDraft(); else startCareer();
}

/* ---------- tela 3: carreira ---------- */

     "escolheu mais uma". */
  evento("terminou_draft");

      wins:0,losses:0,finishes:0,streakW:0,streakL:0,bestBeaten:0,bestWin:null,title:false,

/* Ponto único que decide o estado dos botões. Antes isso estava espalhado em
   quatro lugares e um deles esquecia o automático. */
function atualizarControles(){
  const next=document.getElementById("next");
  const ab=document.getElementById("autob");
  const ctrl=document.getElementById("controls");
  const cont=document.getElementById("counter");
  if(!next||!ab)return;
  const fim=fightNo>=TOTAL_FIGHTS;
  next.disabled=dilemaAberto||escolhaAberta||playing||auto||fim;
  ab.disabled=dilemaAberto||fim;
  if(ctrl)ctrl.classList.toggle("travado",dilemaAberto||escolhaAberta);
  if(cont&&dilemaAberto)cont.textContent="responda para continuar";
  else if(cont&&escolhaAberta)cont.textContent="escolha o adversário";
  else if(cont)cont.textContent=`${fightNo} de ${TOTAL_FIGHTS} · ${st.wins}-${st.losses}`;
  const cb=document.getElementById("cardsb");
  if(cb){const n=(st.momentos||[]).length;cb.textContent=n?`Cards (${n})`:"Cards";}
  atualizarBadgeConquistas();
}
/* Contagem é GLOBAL (localStorage), não da carreira atual — troféu não
   zera quando você começa outra. */
function atualizarBadgeConquistas(){
  const b=document.getElementById("conqb");
  if(!b)return;
  const n=CONQUISTAS_DESBLOQUEADAS.size,total=CONQUISTAS.length;
  b.textContent=`Conquistas (${n}/${total})`;
}
function cycleSpeed(){
  speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];
  document.getElementById("speedb").textContent=`Velocidade ${speed}x`;
}
function toggleAuto(){
  if(dilemaAberto)return;                 // não dá pra pular um dilema
  auto=!auto;
  if(auto&&escolhaAberta){                // automático assume as escolhas
    escolhaAberta=false;
    const b=document.getElementById("escolha");
    if(b){b.style.display="none";b.innerHTML="";}
  }
  const b=document.getElementById("autob");
  b.classList.toggle("on",auto);
  b.textContent=auto?"Parar automático":"Modo automático";
  atualizarControles();
  if(auto&&!playing)nextFight();
}
function pickOpponent(){
  const center=Math.floor(st.standing*(LADDER.length-1));
  const spread=Math.max(8,Math.floor(LADDER.length*.06));
  const lo=Math.max(0,center-spread),hi=Math.min(LADDER.length-1,center+spread);
  for(let t=0;t<40;t++){
    const c=LADDER[lo+Math.floor(rng()*(hi-lo+1))];
    if(!fought.has(c.name)){fought.add(c.name);return c;}
  }
  return LADDER[lo+Math.floor(rng()*(hi-lo+1))];
}
function nextFight(){
  if(fightNo>=TOTAL_FIGHTS||playing||dilemaAberto||escolhaAberta)return;
  /* Único lugar que decide "é luta de título?" pra esta luta. Uma vez por
     luta, aqui, antes de existir tela ou pick automático — candidatos() e
     lutar() só leem st.tituloEstaLuta depois disso. */
  st.tituloEstaLuta=tituloLiberado();
  /* Cinturão interino: só é sorteado no momento em que uma disputa pelo
     cinturão de VERDADE é concedida a quem ainda não é campeão de nada —
     reset todo fight pra não carregar um sorteio de uma disputa antiga
     (mesmo raciocínio de st.tituloEstaLuta acima). Enquanto já se é
     campeão (interino ou de verdade), tituloLiberado() devolve true
     incondicionalmente e este bloco não roda — quem já tem cinturão não
     rola disponibilidade de novo, só defende/unifica. */
  st.tituloInterinoLuta=false;
  if(st.tituloEstaLuta&&!st.title&&holdRng()<CHANCE_CINTURAO_INTERINO)
    st.tituloInterinoLuta=true;
  if(auto){                                  // no automático a máquina escolhe o meio
    const opts=candidatos();
    /* opts tem 3 cartas normalmente, mas 1 só em luta de título/defesa
       (oponente travado em RANKING) — min(1,length-1) pega "o do meio" nas
       três e a única carta quando só existe uma, sem consumir rng extra. */
    lutar(opts[Math.min(1,opts.length-1)],CAMPS[Math.floor(rng()*CAMPS.length)]);
    return;
  }
  escolhaAberta=true;atualizarControles();
  telaAdversario();
}

/* Repertório da escolha na luta (item 6, v2) — 31 ações reais de MMA,
   nenhuma exigindo mais de 4 palavras de conteúdo (cabe em card lado a
   lado), vocabulário de gíria de esporte antes de descrição técnica
   ("trocar queixo por queixo", não "resistir aos golpes recebidos").
   Cada ação exige UM atributo (attr) e aparece só nos sinais de round
   (pools) onde faz sentido — o scouting do round decide o trio, não um
   menu solto. Cobre os 7 eixos treináveis do motor (ATTR_TREINAVEIS);
   subAvg não tem "defesa de finalização" própria no motor, então usa
   tdDef do adversário como proxy de scramble (ver COUNTER_ATTR). */
const ACOES_LUTA=[
  {id:"trocar_distancia",nome:"Trocar na distância",attr:"slpm",pools:["vencendo","parelho"]},

/* Contra-atributo do ADVERSÁRIO que cada ação testa, escondido do
   jogador de propósito (item 6: "não deixe a escolha ser óbvia" — a
   opção que mais casa com você às vezes é a que ele defende melhor).
   Pares recíprocos do próprio motor: volume x defesa de golpe, poder x
   queixo, queda x defesa de queda. subAvg usa tdDef do adversário como
   proxy de scramble (motor não tem "defesa de finalização" própria). */
const COUNTER_ATTR={slpm:"strDef",kdAvg:"durability",tdAvg:"tdDef",
  strDef:"slpm",durability:"kdAvg",tdDef:"tdAvg",subAvg:"tdDef"};

function sinalDoRound(s){
  if(!s)return"parelho";
  if(s.ctrlB>=3||s.tdB>=2)return"dominado";
  if(s.tdB>=1)return"sofreu_queda";
  if(s.burstB>=s.burstA+3)return"perdendo_troca";
  if(s.burstA>=s.burstB+3)return"vencendo";
  return"parelho";
}

/* Histórico (mecanismo v1, .form único pra tudo): K=.16 dava gap
   0,5-0,8 mas estourava KO a 35,7-35,8% na política realista — o form
   escrito por QUALQUER ação vazava pra acurácia, volume E queda ao
   mesmo tempo, então nocaute subia mesmo quando a ação escolhida não
   tinha nada a ver com poder. Baixado pra .04 na hora: KO voltava a
   34,76%, mas o gap caía pra 0,07-0,21 — inerte.

   Mecanismo v2 (este, por eixo — mAttr): cada ação só escreve no SEU
   eixo (ver mkState()/exchange()/impact()), então uma ação de queda não
   toca mais nocaute. Medido (2026-09-05) com o protocolo fiel — sinal
   REAL do round 1, trio de 3 REALMENTE sorteado da pool (não a pool
   inteira, que superestima o gap): KO fica achatado perto de 34,8% até
   K=.50 (dentro de qualquer K testado até aí), sobe passando de 35% a
   partir de K≈.53 (35,04% em .55, 35,21% em .60, 35,31% em .65). Fixado
   em .50 — dentro da regra de nunca passar de 35% — que dá gap 0,38-0,47
   vitórias/22 (duas levas de seed, 3.000 pares cada, node testar.js
   gapescolha), ainda abaixo do alvo 0,5-0,8 mas 2-3x o mecanismo v1 na
   mesma margem de segurança de KO. Sobra pouca margem de KO (0,21pp até
   35%) pra fechar o resto só com K simétrico maior — se quiser fechar o
   gap que falta, o próximo passo é K_CIMA/K_BAIXO assimétrico (aprovado
   como ajuste secundário), não subir este K sozinho. */
const K_ESCOLHA_LUTA=.50;

/* modificador de uma ação: contest() (o mesmo do motor) entre o percentil
   do SEU atributo e o percentil do contra-atributo do adversário — não é
   só "seu número", é uma disputa escondida, então a opção que mais casa
   com você pode ainda sair cara se ele defende bem aquele eixo. */
function modificadorAcao(acao,jogadorRef,oppRef){
  if(!PCT)return 1;
  const pJog=PCT(acao.attr,jogadorRef[acao.attr]);
  const counter=COUNTER_ATTR[acao.attr];
  const pOpp=PCT(counter,oppRef[counter]);
  const matchup=contest(pJog,pOpp);
  return 1+K_ESCOLHA_LUTA*(matchup-.5)*2;
}

/* Escolha na luta — item 3/6: uma vez por luta, só depois do primeiro
   round que ela alcança sem terminar nele. Texto ancorado no scouting
   REAL do round (burst/queda/controle) decide qual POOL de ações
   aparece; escolhaRng (stream próprio, não mexe no rng principal — ver
   node testar.js desafio) decide QUAIS 3 dessa pool. Card mostra seu
   próprio valor no atributo, nunca o do adversário — é isso que mantém a
   escolha uma leitura de round, não aritmética pura. Automático nunca
   pausa — sempre neutro (mod 1, sem gastar rng), igual já escolhe
   adversário/camp sozinho. */
function abrirEscolhaLuta(scouting,jogadorRef,opp,onEscolher){
  if(auto){onEscolher(1);return;}
  const s=scouting||{burstA:0,burstB:0,tdA:0,tdB:0,ctrlA:0,ctrlB:0};
  let cabecalho;
  if(s.ctrlB>=3)cabecalho=`${opp.name} passou boa parte do round te segurando no chão.`;
  else if(s.tdB>0)cabecalho=`${opp.name} te derrubou ${s.tdB===1?"uma vez":s.tdB+" vezes"} no primeiro round.`;
  else if(s.burstB>=s.burstA+3)cabecalho=`${opp.name} acertou muito mais que você na troca — ${s.burstB} a ${s.burstA}.`;
  else if(s.burstA>=s.burstB+3)cabecalho=`Você levou a melhor na troca — ${s.burstA} a ${s.burstB}.`;
  else cabecalho=`Round parelho, nada decidido ainda.`;

  const sinal=sinalDoRound(s);
  const pool=ACOES_LUTA.filter(a=>a.pools.includes(sinal));
  const restante=[...pool];
  const trio=[];
  for(let i=0;i<3&&restante.length;i++){
    const idx=Math.floor((escolhaRng?escolhaRng():Math.random())*restante.length);
    trio.push(restante.splice(idx,1)[0]);
  }

  const box=document.getElementById("escolhaLuta");
  box.innerHTML="";
  box.style.display="";
  box.appendChild(el("div","el-cab",cabecalho));
  const opts=el("div","el-opts");
  box.appendChild(opts);
  const fechar=()=>{box.style.display="none";box.innerHTML="";};
  trio.forEach(acao=>{
    const mod=modificadorAcao(acao,jogadorRef,opp);
    const valor=FMT_ATTR[acao.attr]?FMT_ATTR[acao.attr](jogadorRef[acao.attr]):jogadorRef[acao.attr];
    const b=el("button","","");
    b.id="el_"+acao.id;
    b.innerHTML=`<span class="el-nome">${acao.nome}</span>
      <span class="el-attr">${ROTULO_ATTR[acao.attr]||acao.attr} <b>${valor}</b></span>`;
    b.onclick=()=>{fechar();onEscolher(mod,acao.attr);};
    opts.appendChild(b);
  });
}

/* Dispara o prefetch do feed e entrega pra finishFight(). Antes disto era
   uma chamada só (simulateFight() decidia a luta inteira ANTES de existir
   round 1 na tela), então dava pra prefetchar no instante 0 e deixar
   resolver nos ~12s de narração. Com o driver round a round (item 3) o
   resultado só existe quando o ÚLTIMO round termina — perde parte da
   sobreposição, mas ainda sobra o tempo de finishFight()/troca de tela
   antes do feed aparecer de verdade. Cadência de chamada intacta: só
   lutas pares ou com finish, ver testarDriverRodada() e o item 1. */
function finalizarLuta(opp,res,titleFight,won0,kd0,kdt0){
  const finish0=res.method!=="Decisão";
  if(fightNo%2===0||finish0)
    prefetchFeed(res,won0,opp,titleFight,kd0,kdt0,won0&&(opp.rating-st.standing)>.15);
  finishFight(opp,res,titleFight);
}
function lutar(escolhido,camp){
  escolhaAberta=false;
  fightNo++;st.fightNo=fightNo;
  const opp=escolhido.f;
  fought.add(opp.name);
  st.ganhoEscolhido=escolhido.ganho;
  aplicarCamp(camp);                    // permanente, com teto
  renderFicha();
  st.campEscolhido=camp.nome;
  const comCamp=lutadorEfetivo();
  me.__rating=st.standing;
  /* st.tituloEstaLuta já foi decidido em nextFight(), antes de existir tela
     ou pick automático. Recalcular aqui com tituloLiberado() de novo poderia
     consumir holdRng outra vez e discordar do que a tela mostrou. */
  const titleFight=!!st.tituloEstaLuta;
  const rounds=titleFight?5:3;

  /* Driver round a round (item 3, "escolha na luta"): o que simulateFight()
     fazia por dentro numa chamada só agora roda aqui, round a round, pra
     abrir uma pausa real de escolha depois do primeiro round que a luta
     alcança sem terminar nele. Consumo de rng NA MESMA ORDEM de antes — um
     seed por luta, form pros dois lutadores, depois um round de cada vez —
     provado bit a bit igual em testarDriverRodada() (node testar.js
     driverluta): rodar simularRound() em loop com o mesmo rng/A/B/scores
     bate exatamente com simulateFight() numa chamada só. */
  const rngL=mulberry32(Math.floor(rng()*1e9));
  const form=()=>1+(rngL()+rngL()+rngL()-1.5)/1.5*TUNING.formSpread;
  const A=mkState(comCamp,form()),B=mkState(opp,form());
  const log=[];
  const push=(round,clock,kind,text)=>log.push({round,clock,kind,text});
  const kds=()=>({[A.ref.name]:A.knockdowns,[B.ref.name]:B.knockdowns});
  const fin=(w,l,round,clock,m)=>{
    push(round,clock,"fin",`${w.ref.name} vence por ${m.toLowerCase()}`);
    return{winner:w.ref.name,loser:l.ref.name,method:m,round,clock,cards:null,log,knockdowns:kds()};
  };
  const scores={sa:0,sb:0};

  iniciarTelaLuta(opp,titleFight);

  const montarDecisao=()=>{
    const w=scores.sa>scores.sb?A:scores.sb>scores.sa?B:(rngL()<.5?A:B),l=w===A?B:A;
    log.push({round:rounds,clock:"0:00",kind:"fin",
      text:`Vai pros cartões. ${w.ref.name} vence por decisão, ${Math.max(scores.sa,scores.sb)}-${Math.min(scores.sa,scores.sb)}.`});
    return{winner:w.ref.name,loser:l.ref.name,method:"Decisão",round:rounds,clock:"0:00",
      cards:scores.sa+"-"+scores.sb,log,knockdowns:kds()};
  };
  const encerrar=res=>{
    const won0=res.winner===me.name;
    const kd0=res.knockdowns[opp.name]||0,kdt0=res.knockdowns[me.name]||0;
    finalizarLuta(opp,res,titleFight,won0,kd0,kdt0);
  };

  let round=1,marca=0;
  const proximaRodada=()=>{
    /* scouting do round 1: só interessa pra escolha, que só existe uma vez,
       logo depois do primeiro round que a luta alcança sem terminar */
    const antes=round===1?{a:A.sigStrikes,at:A.takedowns,ac:A.controlTicks,
                            b:B.sigStrikes,bt:B.takedowns,bc:B.controlTicks}:null;
    const res=simularRound(A,B,round,rngL,push,fin,scores);
    const trecho=log.slice(marca);marca=log.length;
    if(res){animarTrecho(trecho,()=>encerrar(res));return;}
    const scouting=antes&&{burstA:A.sigStrikes-antes.a,burstB:B.sigStrikes-antes.b,
      tdA:A.takedowns-antes.at,tdB:B.takedowns-antes.bt,
      ctrlA:A.controlTicks-antes.ac,ctrlB:B.controlTicks-antes.bc};
    animarTrecho(trecho,()=>{
      if(round===1){
        abrirEscolhaLuta(scouting,A.ref,opp,(mod,attr)=>{
          if(attr)A.mAttr[attr]=mod;
          round++;proximaRodada();
        });
      }else if(round<rounds){
        round++;proximaRodada();
      }else{
        /* montarDecisao() empurra a linha de resultado pro `log` DEPOIS que
           o trecho do round final já foi consumido acima — sem reanimar
           esse pedaço novo ela nunca chega na tela (achado jogando: luta
           que vai aos cartões terminava sem nenhuma linha de resultado,
           mesmo com finishFight() rodando certo por baixo). Mesma
           assinatura do branch de cima (if(res){...}): monta o resultado,
           fatia só o que ele acabou de empurrar, anima, só then encerra. */
        const res=montarDecisao();
        const trechoFinal=log.slice(marca);marca=log.length;
        animarTrecho(trechoFinal,()=>encerrar(res));
      }
    });
  };
  proximaRodada();
}
/* Narração: cabeçalho monta UMA vez por luta (iniciarTelaLuta), o log
   anima em PEDAÇOS (animarTrecho) — desde o item 3 ("escolha na luta"),
   lutar() é um driver round a round que chama animarTrecho() de novo a
   cada round, sem remontar o cabeçalho por baixo. animarTrecho() nunca
   decide o que vem depois de um pedaço — só avisa quem chamou. O botão de
   velocidade só divide o intervalo, nunca pula linha — nada de resultado
   escondido. */
function iniciarTelaLuta(opp,titleFight){
  playing=true;atualizarControles();
  const live=document.getElementById("live");
  document.getElementById("stage").style.display="";
  document.getElementById("phone").style.visibility="hidden";
  live.innerHTML=`<div class="live-head">
      <span class="vs" style="display:flex;align-items:center;gap:9px">
        ${bonecoSVG(ROSTO||cfgPadrao(),{w:38})}
        <span>${me.name} &nbsp;vs&nbsp; ${opp.name}${titleFight?" · cinturão":""}</span>
      </span>
      <span class="rd" id="rdlabel">Round 1</span></div>
    <div class="play" id="play"></div>`;
}
function animarTrecho(lines,aoTerminar){
  const play=document.getElementById("play");let i=0;
  const step=()=>{
    if(i>=lines.length){aoTerminar();return;}
    const L=lines[i++];
    if(L.kind==="rd"&&/^Round/.test(L.text))
      document.getElementById("rdlabel").textContent=`Round ${L.round}`;
    const row=el("div","pbp"+(L.kind?" "+L.kind:""),
      `<span class="clk">${L.clock}</span><span>${L.text}</span>`);
    play.appendChild(row);
    row.scrollIntoView({behavior:"smooth",block:"nearest"});
    /* o som sai do TIPO da linha, que o motor já classifica */
    if(L.kind==="kd")SOM.queda();
    else if(L.kind==="rd"&&/^Fim/.test(L.text))SOM.sino();
    else if(L.kind==="big")SOM.golpe();
    else if(L.kind==="fin"&&/ocaute/.test(L.text))SOM.nocaute();
    if(L.kind==="fin"&&/ocaute/.test(L.text)&&!reduceMotion()){
      document.body.classList.add("ko");
      setTimeout(()=>document.body.classList.remove("ko"),440);
    }
    const base=L.kind==="fin"?950:L.kind==="rd"?700:
               (L.kind==="kd"||L.kind==="big")?780:470;
    playTimer=setTimeout(step,reduceMotion()?10:base/speed);
  };
  step();
}
function finishFight(opp,r,titleFight){
  playing=false;atualizarControles();
  const momentosAntes=st.momentos.length;   // pra filtrar por prioridade no fim, ver ORDEM_MOMENTO
  const won=r.winner===me.name;
  const isKO=/ocaute/.test(r.method),finish=r.method!=="Decisão";
  const myKd=r.knockdowns[opp.name]||0,oppKd=r.knockdowns[me.name]||0;
  st.kdGiven+=myKd;st.kdTaken+=oppKd;
  /* Estreia no main card (item 8, já citado no item 1b): primeira vez que
     o jogador pega uma luta de nível de campeonato — vitória ou derrota,
     é o "chegou ao topo" que existe ANTES de "cinturao" (que só dispara
     ganhando). Sem evento numerado de verdade ainda (não construído);
     proxy: RANKING.lista (campeão+15) só aparece via a carta travada de
     título/defesa (candidatos() bane esses 16 das bandas comuns), então
     titleFight===true JÁ SIGNIFICA "adversário de main card" — não precisa
     checar o nome contra a lista de novo. */
  if(titleFight&&!st.estreouMainCard){
    st.estreouMainCard=true;
    st.momentos.push(criarMomento("estreia",FRASE_ESTREIA_MAIN_CARD(me.name),opp,r));
  }
  /* renda por luta (item 4) — paga em toda luta, vitória ou derrota, igual
     bolsa de MMA de verdade. Sobe com standing: quem está mais alto na
     divisão ganha mais por luta. st.dinheiro reseta por carreira (não é
     progressão permanente, é caixa da temporada). Guardado numa const —
     precisa aparecer na linha do resultado lá embaixo, calculado ANTES do
     standing desta luta mudar (mesmo valor que entrou no caixa). */
  const rendaLuta=RENDA_BASE+Math.round(RENDA_BASE*st.standing);
  st.dinheiro=(st.dinheiro||0)+rendaLuta;
  /* estado ANTES desta luta — precisa pra saber se um evento é a PRIMEIRA
     vez (cinturão, lesão) e pro upset comparar com quem o jogador era antes
     de vencer, não depois. standing muda logo abaixo; os outros três não
     mudam aqui, mas capturar junto deixa claro que são "antes desta luta",
     não "antes desta função". */
  const standingPre=st.standing;
  const foiCampeaoAntes=st.foiCampeao,lutandoMachucado=!!st.lesao;
  /* Antes de mexer no standing: é daqui que sai a seta de subiu/caiu na ficha. */
  const _rkAntes=posicaoDivisao();
  if(_rkAntes)st.rankAnt=_rkAntes.n;

  if(won){
    st.wins++;st.streakW++;st.streakL=0;st.longestW=Math.max(st.longestW,st.streakW);
    if(finish)st.finishes++;
    if(opp.rating>st.bestBeaten){st.bestBeaten=opp.rating;st.bestWin=opp.name;}
    st.standing=Math.min(1,st.standing+(titleFight?.05:(st.ganhoEscolhido??.07)));
    st.peak=Math.max(st.peak,st.standing);
    /* foiCampeao é permanente (histórico: já foi campeão, ninguém tira — usado
       pelo LEGACY). title é o status ATUAL, e É esse que zera na derrota
       abaixo — os dois precisam existir separados, senão reconquistar o
       cinturão não tem como ser distinguido de nunca tê-lo perdido. */
    if(titleFight){
      const eraUnificacao=st.title&&st.cinturaoInterino;
      if(st.title&&!eraUnificacao){
        /* rotação de contender: essa defesa (ganha) usou o desafiante da
           vez — a próxima aponta pro próximo nome do RANKING.lista, não
           repete o mesmo pra sempre. Unificação não veio da rotação (foi
           sempre contra RANKING.campeao, travado), não empurra o índice. */
        st.defesas=(st.defesas||0)+1;
        if(RANKING&&RANKING.lista)st.desafianteIdx=Math.min((st.desafianteIdx||1)+1,RANKING.lista.length-1);
        st.title=true;st.foiCampeao=true;st.exCampeao=null;
      }else if(!st.title&&st.tituloInterinoLuta){
        /* Cinturão interino: title=true pras regras que já existem (ficha,
           RARE, evento gerado pela IA, passoCinturao()), mas foiCampeao/vezesCampeao/o
           momento de 1º cinturão SÓ disparam na unificação, abaixo — é
           isso que torna o interino incompleto até provar (ver
           CHANCE_CINTURAO_INTERINO). */
        st.title=true;st.cinturaoInterino=true;st.exCampeao=null;
        st.momentos.push(criarMomento("cinturaoInterino",
          FRASE_CINTURAO_INTERINO(me.name,RANKING.campeao?RANKING.campeao.name:"o campeão"),opp,r));
      }else{
        /* conta AQUISIÇÃO nova do cinturão de verdade (1ª vez, reconquista
           ou unificação do interino) — usado pela conquista "Fênix". */
        st.vezesCampeao=(st.vezesCampeao||0)+1;
        st.title=true;st.foiCampeao=true;st.exCampeao=null;st.cinturaoInterino=false;
        if(!foiCampeaoAntes)st.momentos.push(criarMomento("cinturao",
          eraUnificacao?FRASE_UNIFICACAO(me.name,opp.name):FRASE_PRIMEIRO_CINTURAO(me.name),opp,r));
      }
    }
    /* rápido é clock ALTO nesta luta — ver clockSeconds() */
    if(isKO&&r.round===1&&(300-clockSeconds(r.clock))<60){
      const mko=criarMomento("ko",FRASE_KO_RAPIDO(me.name),opp,r);
      mko.segundosKO=300-clockSeconds(r.clock);      // pro rótulo "NOCAUTE EM Ns"
      st.momentos.push(mko);
    }
    if(lutandoMachucado&&!st.lesao.venceuMachucado){
      st.lesao.venceuMachucado=true;
      const fraseLesao=st.lesao.origem==="nocaute"?FRASE_LESAO_VENCIDA_NOCAUTE:FRASE_LESAO_VENCIDA;
      st.momentos.push(criarMomento("lesao",fraseLesao(me.name),opp,r));
    }
  }else{
    st.losses++;st.streakL++;st.streakW=0;
    if(isKO)st.koLosses++;
    if(r.method==="Finalização")st.subLosses=(st.subLosses||0)+1;
    /* Nocaute -> lesão (item cortado da v1): uma de cada vez, mesma regra
       do dilema — não pode ter duas lesões ativas ao mesmo tempo. lesaoRng
       é stream próprio, nunca o rng principal (mesmo motivo do holdRng —
       senão desloca a sequência e link de desafio antigo para de
       reproduzir a mesma carreira). Atributo sorteado, não escolhido —
       nocaute não tem "cena" pra dizer QUAL parte do corpo bateu. */
    if(isKO&&!st.lesao&&lesaoRng()<(st.equipamentoComprado?CHANCE_LESAO_NOCAUTE_EQUIP:CHANCE_LESAO_NOCAUTE)){
      const ATTRS_LESAO_KO=["slpm","strDef","durability","tdDef","subAvg","kdAvg"];
      const atr=ATTRS_LESAO_KO[Math.floor(lesaoRng()*ATTRS_LESAO_KO.length)];
      if(me[atr]!=null){
        st.eventoMod=st.eventoMod||{};
        st.eventoMod[atr]=(st.eventoMod[atr]||1)*LESAO_NOCAUTE.mult;
        st.lesao={nome:"Sequela do nocaute",atributo:atr,mult:LESAO_NOCAUTE.mult,
          permanente:false,desdeLuta:st.fightNo,duracao:LESAO_NOCAUTE.duracao,origem:"nocaute"};
      }
    }
    if(titleFight&&st.title){
      /* defesas só incrementa em vitória (acima), então defesas===0 aqui
         significa que esta é a PRIMEIRA defesa perdida — só nesse caso o
         evento raro "perdeu na primeira defesa" é verdade. Perder a 5ª
         defesa não é a mesma coisa e não pode usar o mesmo texto. Perder a
         UNIFICAÇÃO (cinturaoInterino) fica de fora: nunca houve reinado
         indiscutido pra "perder rápido" — o interino nem chega a defender,
         vai direto pra unificação (ver candidatos()). */
      if(!st.cinturaoInterino&&(st.defesas||0)===0){
        st.lostBeltFast=true;
        /* mesmo texto do RARE "lostBeltFast", achado por id — não duplica a
           frase nem depende de índice do array (ver comentário no RARE). */
        st.momentos.push(criarMomento("cinturaoPerdido",
          RARE.find(rr=>rr.id==="lostBeltFast").t(me.name),opp,r));
      }
      /* perder uma defesa (ou a unificação) custa o cinturão que se tinha:
         title volta a false, exCampeao guarda quem tirou (opp — no caso da
         unificação, é sempre RANKING.campeao, o campeão de verdade; a
         ficha e a próxima disputa passam a nomear essa pessoa, não mais o
         jogador), defesas zera (reinado novo começa do zero se
         reconquistar), cinturaoInterino zera (sem isso ficaria um "campeão
         interino" fantasma sem title) e disputaLiberada reseta — sem isso
         a reconquista aproveitaria a concessão antiga do holdRng e nunca
         sortearia de novo (ver candidatos()/tituloLiberado()). */
      st.title=false;st.exCampeao=opp;st.defesas=0;st.disputaLiberada=false;st.cinturaoInterino=false;
      /* Guarda o número da luta em que perdeu — evento por IA usa isso
         pra saber se foi NESTA luta (não é histórico permanente como
         foiCampeao, é só "aconteceu agora"). Ver dispararEventoIA(). */
      st.perdeuCinturaoNaLuta=st.fightNo;
      /* essa defesa (perdida) também usou o desafiante da vez — mesma
         rotação da vitória acima. Reconquistar mais tarde enfrenta de novo
         RANKING.campeao (não muda com rotação), mas ao voltar a DEFENDER o
         próximo nome já está um passo adiante. */
      if(RANKING&&RANKING.lista)st.desafianteIdx=Math.min((st.desafianteIdx||1)+1,RANKING.lista.length-1);
    }else if(titleFight&&!st.title){
      /* Perdeu a DISPUTA em si, antes de nunca ter sido campeão — st.title
         já era false, então o bloco acima não roda, mas o reset do
         disputaLiberada precisa acontecer aqui do mesmo jeito. Sem isso, a
         próxima vez que standing/streakW voltarem a bater o limiar,
         tituloLiberado() acha disputaLiberada ainda true (da concessão
         antiga) e devolve o campeão sem sortear holdRng de novo — só que
         agora ignorando `fought` (ver candidatos()), então mesmo achando o
         campeão em `fought` a carta trava nele mesmo assim, revanche de
         verdade. Esse ELSE existe só pra documentar por que o reset não
         soma com o bloco de cima: são estados mutuamente exclusivos
         (perdeu sendo campeão vs. perdeu não sendo). */
      st.disputaLiberada=false;
    }
    /* perder para quem estava abaixo custa mais caro que perder para um perigoso */
    const punicao=st.ganhoEscolhido<=.05?.13:st.ganhoEscolhido>=.12?.06:.09;
    st.standing=Math.max(.05,st.standing-punicao);
  }
  st.lastMethod=r.method;st.lastWon=won;st.lastRound=r.round;st.lastKO=isKO;

  /* Tick de cura. st.eventoMod já acumula multiplicativo (outro evento pode
     ter mexido no MESMO atributo antes ou depois da lesão) — dividir pelo
     mult da lesão desfaz só o que ela escreveu; um "=1" apagaria também um
     bônus de evento que nada tem a ver com a lesão. Roda depois da luta
     recém-simulada (a lesão ainda vale PRA ELA), então passa a valer pra
     próxima a partir daqui. */
  if(st.lesao&&!st.lesao.permanente&&st.fightNo-st.lesao.desdeLuta>=st.lesao.duracao){
    const a=st.lesao.atributo;
    st.eventoMod[a]=(st.eventoMod[a]||1)/st.lesao.mult;
    st.lesao=null;
  }

  /* --- repercussão --- */
  const hype=hypeOf(r,won,opp,me,titleFight,myKd,oppKd);
  /* Bônus de performance da noite: só rótulo, nenhum número novo — reaproveita
     hype, que já existe e já alimenta fã/seguidor. Sem limiar pra calibrar:
     é sempre a luta de MAIOR hype da carreira ATÉ AGORA, tipo st.bestWin/
     st.peak — não precisa medir nada porque não é um corte absoluto, é
     recorde relativo. Aparece no relatório final e no card compartilhável. */
  if(!st.bonusNoite||hype>st.bonusNoite.hype)
    st.bonusNoite={hype,luta:fightNo,adversario:opp.name,cartel:`${st.wins}-${st.losses}`};
  /* Card de "melhor atuação" (2026-09-11) — o número acima já existia sem
     virar card (ver LEIA-ME "Card de momento"/PENDENCIAS "onde
     desperdiça trabalho"). Medido ANTES de decidir o gatilho (500
     carreiras/divisão, estratégia "parelho" fixa, candidatos()/
     simulateFight()/finishFight() reais): "todo novo recorde vira card"
     dava 3,0-3,4 recordes por carreira em MÉDIA — ruído, deixaria de ser
     marco. Restringir a só a 2ª metade (luta>=12) não bastou sozinho:
     75-78% das carreiras batem pelo menos 1 recorde ali, ainda comum se
     repetir. Conserto: dispara UMA vez só por carreira, no PRIMEIRO
     recorde que a luta 12 em diante bate (`bonusNoiteMarco` trava,
     nunca mais dispara na mesma carreira) — st.bonusNoite continua
     sendo atualizado TODA luta, sem trava, então relatório final e card
     compartilhável sempre mostram o recorde VERDADEIRO, mesmo que ele
     seja batido de novo depois deste card. */
  if(fightNo>=12&&!st.bonusNoiteMarco&&st.bonusNoite.luta===fightNo){
    st.bonusNoiteMarco=true;
    st.momentos.push(criarMomento("bonusNoite",FRASE_BONUS_NOITE(me.name,opp.name),opp,r));
  }
  /* Card de "número 1 da tabela" (2026-09-11, apertado no mesmo dia) —
     posicaoDivisao() é a posição na tabela INTEIRA que a ficha já
     mostra (não o RANKING oficial de campeão+15, ver "Campeão nomeado"
     no LEIA-ME); reusa o mesmo número, sem calibrar nada.

     1ª medição (qualquer luta): 66,8%/67,6% das carreiras (leve/pesado)
     chegam ao nº1 em ALGUM momento — alto demais, fora da faixa dos
     outros gatilhos de momento (2%-30%), o mesmo padrão já cortado em
     "topo_da_divisao" (conquistas) e em streakW>=8 (RARE, ver "Card de
     momento"). Remedido: exigir CEDO, não só "algum dia" — mediana de
     "geral" já era luta 15-16, então até a luta 15 corta perto da
     metade de quem chega. `fightNo<=15` (não invicto: invicto até o
     topo caiu pra 8%/17%, longe demais pra baixo do alvo) fecha
     25,2%/36,4% — dentro de 25%-40%. Continua travando em 1x só
     (`st.topoDivisaoAlcancado`); depois da luta 15 o nº1 deixa de ser
     "cedo" e para de contar como marco, mesmo que aconteça. */
  if(!st.topoDivisaoAlcancado&&fightNo<=15){
    const posAtual=posicaoDivisao();
    if(posAtual&&posAtual.n===1){
      st.topoDivisaoAlcancado=true;
      st.momentos.push(criarMomento("topoDivisao",FRASE_TOPO_DIVISAO(me.name,posAtual.de),opp,r));
    }
  }
  /* upset compara com quem o jogador ERA antes de vencer — standingPre, não
     st.standing (que essa altura do won já subiu). Usar o pós-luta fazia
     "vitória sobre favorito" quase nunca disparar: o próprio salto de
     standing da vitória encolhia a diferença que definia o upset.
     fightNo>=6 e diferença >.20 (era >.15, sem piso): medido em 120
     carreiras, 77% dos upsets caíam nas lutas 1-5 só porque standing começa
     baixo (.18) — não é zebra de verdade, é o jogador ainda subindo do
     fundo da tabela. Ver LEIA-ME "Card de momento". */
  const upset=won&&fightNo>=6&&(opp.rating-standingPre)>.20;
  if(upset)st.momentos.push(criarMomento("upset",FRASE_UPSET(me.name,opp.name),opp,r));
  const alvo=Math.max(0,Math.min(10,1.3+hype*1.30));
  st.fan=Math.max(0,Math.min(10,st.fan*.62+alvo*.38));      /* média móvel */
  /* Casa melhor (loja): bônus permanente aplicado no delta já calculado,
     vitória ou derrota — não entra em followerDelta() (função pura,
     testada isolada) pra não misturar mecânica do motor com item de
     compra opcional. */
  const delta=Math.round(followerDelta(st.followers,hype,won,st.standing)
    *(st.casaComprada?CASA_FOLLOWER_MULT:1)*(st.consultoriaAtiva?CASA_FOLLOWER_MULT:1));
  st.followers=Math.max(120,st.followers+delta);
  st.peakFollowers=Math.max(st.peakFollowers,st.followers);
  st.consultoriaAtiva=false;   // pontual — consumida nesta luta, precisa comprar de novo
  st.lastDelta=delta;
  const ph=document.getElementById("phone");
  if(ph){
    const molde=buildFeed(r,won,titleFight,myKd,oppKd,upset,rng,me.name,st.followers);
    ph.style.visibility="visible";
    resolveFeed(molde,rng).then(f=>renderPhone(f,st.fan,delta,st.followers));
  }

  const bouts=document.getElementById("bouts");
  const line=el("div","bout"+(titleFight?" title-fight":""));
  line.innerHTML=`<span class="no">${String(fightNo).padStart(2,"0")}</span>
    <span><span class="opp">${opp.name}</span><br><span class="how">${r.method} · round ${r.round} ${r.clock}${r.cards?" · "+r.cards:""}${(myKd||oppKd)?` · quedas ${myKd}-${oppKd}`:""} · R$${fmtNum(rendaLuta)}</span></span>
    <span class="stamp${won?"":" d"}">${won?"Vitória":"Derrota"}</span>`;
  bouts.appendChild(line);
  (won?SOM.vitoria:SOM.derrota)();     // um só, no carimbo, seja qual for o método

  /* dilema interativo a cada 5 lutas; nas outras, evento — um por luta
     agora (era só luta par ou com finish, throttle que existia pra poupar
     índice do pool fixo; a IA não tem pool pra poupar, evento é chamada
     de IA em TODA luta que não caiu em dilema). RARE continua local e
     síncrono, checado primeiro (mesma prioridade de sempre); só o comum
     virou IA, sem fallback — ver dispararEventoIA(). */
  if(fightNo%5===0&&fightNo<TOTAL_FIGHTS){
    dilemaAberto=true;
    if(auto){auto=false;clearTimeout(autoTimer);
      const b=document.getElementById("autob");
      b.classList.remove("on");b.textContent="Modo automático";}
    atualizarControles();
    abrirDilema()
      .catch(()=>{})                       // falha do dilema não pode travar a carreira
      .then(()=>{dilemaAberto=false;verificarConquistas();atualizarControles();renderFicha();});
  }else{
    const raro=sortearRaro(st,rng,rareUsed);
    if(raro){
      bouts.appendChild(el("div","event rare",raro.t(me.name)));
      tocarSom(raro.tom||0);
      st.events++;
      st.rares.push(raro.t(me.name));
      if(raro.card){
        const mr=criarMomento("raro",raro.t(me.name),opp,r);
        mr.raroId=raro.id;                            // pro rótulo dizer o recorde certo
        st.momentos.push(mr);
      }
    }else{
      dispararEventoIA(bouts,opp,r);   // assíncrono, não bloqueia nada — mesmo padrão do feed
    }
  }
  /* Prioridade entre gatilhos da MESMA luta (achado jogando: cinturão +
     12-0 na mesma luta empurrava DOIS cards, o de raro por último — o
     jogador só viu o errado). Mais de um momento pode nascer nesta
     chamada (estreia+cinturao, cinturao+ko, cinturao+raro, etc.) — fica
     só o de maior prioridade (ORDEM_MOMENTO); os outros são removidos
     do CARD, mas o resto do efeito de cada gatilho (texto no feed,
     st.rares, st.events, contadores de conquista) já rodou antes desta
     linha e continua valendo — só a disputa por QUAL card aparece muda. */
  if(st.momentos.length>momentosAntes+1){
    const desdeAqui=st.momentos.slice(momentosAntes);
    const melhor=desdeAqui.reduce((a,b)=>
      ORDEM_MOMENTO.indexOf(a.tipo)<=ORDEM_MOMENTO.indexOf(b.tipo)?a:b);
    st.momentos.length=momentosAntes;
    st.momentos.push(melhor);
  }
  verificarConquistas();
  atualizarControles();renderFicha();

  /* "Terminou a luta 1", "terminou a luta 5" e "terminou as 22". fightNo já
     foi incrementado em lutar() antes de finishFight() rodar, então aqui já
     reflete a luta que acabou de concluir. Fixo nesses pontos, não "a cada
     N" — o funil quer corte, não série. terminou_luta_1 é o que a fase 2 do
     PLANO-LANCAMENTO.md precisa pra medir "abriu → primeira luta terminou":
     sem ele só dava pra medir até o fim do draft (terminou_draft), que é
     ANTES da primeira luta, ou até a luta 5, que é tarde demais pro corte
     que a fase 2 quer (3 minutos de crédito de quem clicou no anúncio). */
  if(fightNo===1)evento("terminou_luta_1",{segundos:Math.round((Date.now()-TEMPO_ABERTURA)/1000)});
  if(fightNo===5)evento("terminou_luta_5");
  if(fightNo>=TOTAL_FIGHTS)evento("terminou_22");

  if(fightNo>=TOTAL_FIGHTS){
    auto=false;clearTimeout(autoTimer);
    setTimeout(()=>{document.getElementById("stage").style.display="none";},2600);
    const c=document.getElementById("controls");c.innerHTML="";
    const fin=el("button","btn","Encerrar a carreira");fin.onclick=screenReport;
    c.appendChild(fin);return;
  }
  atualizarControles();
  if(auto&&!dilemaAberto)autoTimer=setTimeout(()=>{if(auto&&!dilemaAberto)nextFight();},1100/speed);
}

/* ---------- tela 4: relatório ---------- */
function grade(){
  const winPct=st.wins/Math.max(1,st.wins+st.losses);
  const finishPct=st.finishes/Math.max(1,st.wins);
  const score=st.peak*40+st.bestBeaten*30+winPct*12+finishPct*8+(st.title?10:0);
  const tiers=[[90,"S","Lenda. Vão passar essas lutas na TV por trinta anos."],
    [78,"A","Nome grande. Entrou no hall da fama da divisão."],
    [64,"B","Carreira sólida. Foi luta principal várias vezes."],
    [48,"C","Meio de card. Sustentou a família lutando."],
    [32,"D","Ficou pelo caminho. Teve momentos."],
    [0,"F","Não deu. Mas você entrou no octógono, que é mais do que a maioria."]];
  const t=tiers.find(x=>score>=x[0]);
  return{score:Math.round(score),letter:t[1],verdict:t[2]};
}
function screenReport(){
  const g=grade();
  /* Histórico (2026-09-09): salva local sempre (mesmo sem conta, mesmo
     padrão de conquistas), sincroniza com a nuvem embaixo se tiver
     sessão (mesmo bloco que já sincroniza conquistas, ver adiante). */
  salvarCarreiraLocal({seed:SEED,nome:me.name,cartel:`${st.wins}-${st.losses}`,
    nota:g.letter,data:new Date().toISOString()});
  app.innerHTML="";
  app.appendChild(el("div","eyebrow","Encerramento de registro"));
  app.appendChild(el("div","",`<div style="text-align:center;margin:4px 0 10px">
    ${bonecoSVG(ROSTO||cfgPadrao(),{w:150})}</div>`));
  const tape=el("table","tape"),row=(l,v)=>`<tr><td>${l}</td><td>${v}</td></tr>`;
  tape.innerHTML=
    row("Cartel",`${st.wins}-${st.losses}`)+
    row("Vitórias antes do fim",`${st.finishes} de ${st.wins} (${Math.round(100*st.finishes/Math.max(1,st.wins))}%)`)+
    row("Maior sequência",`${st.longestW} vitórias`)+
    row("Idade ao encerrar",`${idadeAtual()} anos`)+
    row("Defesas de cinturão",st.defesas||0)+
    row("Golpe marcante",assinatura())+
    row("Quedas aplicadas / sofridas",`${st.kdGiven} / ${st.kdTaken}`)+
    row("Nocautes sofridos",st.koLosses)+
    row("Pico no ranking",fmtPico(st.peak))+
    row("Melhor vitória",st.bestWin||"—")+
    (MODO==="lenda"?row("Modo","Seja uma lenda"):"")+
    row("Cinturão",st.title?"Sim":"Não")+
    row("Seguidores no fim",fmtNum(st.followers))+
    row("Pico de seguidores",fmtNum(st.peakFollowers))+
    row("Medidor de fã final",st.fan.toFixed(1)+" / 10")+
    row("Momentos fora do octógono",st.events)+
    row("Decisões que você tomou",st.dilemas||0)+
    (st.bonusNoite?row("Bônus da noite",`Luta ${st.bonusNoite.luta} · vs ${st.bonusNoite.adversario}`):"");
  app.appendChild(tape);

  const v=el("div","verdict");
  v.innerHTML=`<div class="letter">${g.letter}</div>
    <div class="said"><small>Parecer da comissão · ${g.score} de 100</small>${g.verdict}</div>`;
  app.appendChild(v);

  app.appendChild(el("div","legacy",LEGACY.find(l=>l.when(st)).t(me.name)));

  /* Contas: só aparece aqui, fim de carreira — nunca antes de jogar (o
     funil depende de gente chegar, jogar e printar antes de qualquer
     cadastro). getSupabase() devolve null se não estiver configurado —
     nesse caso a caixa nem aparece, sem placeholder vazio. */
  if(getSupabase()){
    const contaBox=el("div","conta-box");
    contaBox.appendChild(el("h4","","Salvar conquistas"));
    contaBox.appendChild(el("p","hint",
      "Suas conquistas já estão salvas neste aparelho. Entra ou cria conta pra não perder se trocar de aparelho."));
    app.appendChild(contaBox);
    sincronizarConquistasNaNuvem().then(async email=>{
      contaBox.innerHTML="";
      contaBox.appendChild(el("h4","","Salvar conquistas"));
      if(email){
        await sincronizarCarreirasNaNuvem(); // mesma sessão, mesmo instante — sobe a carreira que acabou de terminar
        contaBox.appendChild(el("p","hint",`Conectado como <b>${email}</b>. Conquistas e histórico sincronizados.`));
        return;
      }
      const formArea=el("div","");
      contaBox.appendChild(formArea);
      montarFormularioConta(formArea);
    });
  }

  if(st.rares.length)
    app.appendChild(el("p","made-of","<b>Fora da curva:</b> "+st.rares.join(" &nbsp;·&nbsp; ")));
  app.appendChild(el("p","made-of",`<b>${me.name}</b> era feito de: `+
    picks.map(p=>`${p.pair.label} do ${p.from}`).join(" · ")));

  const row2=el("div","row");
  const share=el("button","btn","Compartilhar");
  share.onclick=()=>compartilhar(g,share);
  const link=el("button","btn btn-ghost","Copiar desafio");
  link.onclick=async()=>{
    try{await navigator.clipboard.writeText(urlDesafio());link.textContent="Copiado";}
    catch(e){link.textContent=urlDesafio();}
    setTimeout(()=>link.textContent="Copiar desafio",2200);
  };
  const again=el("button","btn btn-ghost","Nova carreira");
  again.onclick=()=>{docmeta.textContent="Comissão Atlética · Registro";
    history.replaceState(null,"",location.pathname);SEED=0;screenName();};
  row2.append(share,link,again);app.appendChild(row2);
  app.appendChild(el("p","hint",
    `Semente <b>#${SEED.toString(36).toUpperCase()}</b> — quem abrir seu link pega as mesmas cartas e os mesmos adversários.`));
}
armarTrilha();
armarConfig();
boot();
</script>
