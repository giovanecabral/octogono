/* =========================================================================
   SAVE (revamp fase 3). O save é DADO: estado da carreira + estado interno
   dos 8 geradores (mulberry32 .estado()/.restaurar()). A tela é
   redesenhada a partir de st.registro. Carreira interrompida e retomada
   dá exatamente a mesma carreira de quem jogou direto (node testar.js
   save). Plano: docs/superpowers/plans/2026-09-27-revamp-fase-3.md.
   ========================================================================= */
const VERSAO_SAVE=1;
let SLOT_ATUAL=null,USUARIO_ID=null,PENDENTE=null;
function estadoGeradores(){
  const e=g=>g&&g.estado?g.estado():null;
  return{rng:e(rng),holdRng:e(holdRng),fraseRng:e(fraseRng),escolhaRng:e(escolhaRng),
    lesaoRng:e(lesaoRng),eventoRng:e(eventoRng),dilemaRng:e(dilemaRng),rivalRng:e(rivalRng)};
}
function restaurarGeradores(g){
  const r=v=>{const x=mulberry32(0);if(v!=null)x.restaurar(v);return x;};
  rng=r(g.rng);holdRng=r(g.holdRng);fraseRng=r(g.fraseRng);escolhaRng=r(g.escolhaRng);
  lesaoRng=r(g.lesaoRng);eventoRng=r(g.eventoRng);dilemaRng=r(g.dilemaRng);rivalRng=r(g.rivalRng);
}
function geradoresDoSave(){
  const g=estadoGeradores();
  /* escolha da luta aberta e ainda não feita: o save volta o escolhaRng
     pro ponto de antes do trio (a retomada sorteia o trio de novo) */
  if(PENDENTE&&PENDENTE.tipo==="luta"&&!PENDENTE.escolha&&PENDENTE.escolhaRngAntes!=null)g.escolhaRng=PENDENTE.escolhaRngAntes;
  return g;
}
function montarSave(){
  return{versao:VERSAO_SAVE,slot:SLOT_ATUAL,fase:"carreira",atualizadoEm:new Date().toISOString(),
    seed:SEED,divisao:DIVISION,modo:MODO,nome:me.name,rosto:ROSTO,
    rival:{ativado:RIVAL_ATIVADO,nome:RIVAL_NOME_ESCOLHIDO},
    picks:picks.map(p=>({label:p.pair?p.pair.label:p.label,from:p.from})),
    me,st,fightNo,fought:[...fought],rareUsed:[...rareUsed],
    geradores:geradoresDoSave(),pendente:PENDENTE};
}
/* Só estado global, sem tela. POOL/PCT/LADDER/RANKING saem de divisão +
   modo (determinístico), não vão no save. */
function aplicarSave(s){
  SEED=s.seed;DIVISION=s.divisao;MODO=s.modo;ROSTO=s.rosto||null;
  RIVAL_ATIVADO=!!(s.rival&&s.rival.ativado);RIVAL_NOME_ESCOLHIDO=s.rival?s.rival.nome:null;
  POOL=poolDivisao(DIVISION);PCT=makePercentiler(POOL);
  LADDER=[...POOL].sort((a,b)=>a.rating-b.rating);RANKING=buildRanking(POOL);
  me=s.me;st=s.st;fightNo=s.fightNo;
  picks=(s.picks||[]).map(p=>({pair:{label:p.label},from:p.from}));
  fought=new Set(s.fought||[]);rareUsed=new Set(s.rareUsed||[]);
  restaurarGeradores(s.geradores||{});
  PENDENTE=s.pendente||null;
  if(s.slot)SLOT_ATUAL=s.slot;
  auto=false;speed=1;playing=false;dilemaAberto=false;escolhaAberta=false;entrevistaAberta=false;
}
function retomarCarreira(s){
  evento("continuou_save",{luta:s&&s.fightNo});
  aplicarSave(s);
  atualizarStatusPro();
  montarTelaCarreira();
  const bouts=document.getElementById("bouts");
  (st.registro||[]).forEach(reg=>{
    bouts.appendChild(linhaBout(reg));
    (reg.extras||[]).forEach(x=>bouts.appendChild(linhaExtra(x)));
  });
  atualizarControles();renderFicha();
  retomarPendente();
}
/* #/carreira recarregado: abre o save mais recente deste usuário (é o da
   carreira que estava na tela). Sem save compatível, volta pro menu. */
async function retomarMaisRecente(){
  const saves=await listarSaves();
  let melhor=null,slot=null;
  saves.forEach((sv,i)=>{
    if(sv&&sv.versao===VERSAO_SAVE&&(!melhor||new Date(sv.atualizadoEm)>new Date(melhor.atualizadoEm))){melhor=sv;slot=i+1;}
  });
  if(!melhor){ irPara("menu",null,{substituir:true}); return; }
  SLOT_ATUAL=slot;
  retomarCarreira(melhor);
}
/* Luta em andamento ou dilema aberto na hora em que o save foi gravado:
   refaz a MESMA luta (mesma semente, mesma escolha do round 1 se já tinha
   sido feita) ou reabre o MESMO dilema. Adversário que não existe mais no
   elenco (save de outra versão do fighters.json) descarta a luta em vez de
   travar a carreira. */
function retomarPendente(){
  const p=PENDENTE;
  if(!p)return;
  if(p.tipo==="luta"){
    const opp=(p.rival&&st.rival)?st.rival.f
      :(LADDER.find(f=>f.name===p.adv)||(RANKING&&RANKING.lista.find(f=>f&&f.name===p.adv))||null);
    if(!opp){ PENDENTE=null; return; }
    rodarLuta(opp,!!st.tituloEstaLuta,!!p.rival,p.semL,p.escolha||null);
  }else if(p.tipo==="oferta"&&Array.isArray(p.opts)){
    /* Oferta que já tinha sido sorteada: reabre as MESMAS cartas, sem
       candidatos() (o rng salvo já passou dela). Adversário que não
       existe mais no elenco descarta a oferta em vez de travar. */
    const opts=p.opts.map(o=>{
      const f=o.rival&&st.rival?st.rival.f
        :(LADDER.find(x=>x.name===o.nome)||(RANKING&&RANKING.lista.find(x=>x&&x.name===o.nome))||null);
      return f?{f,ganho:o.ganho,rival:!!o.rival}:null;
    });
    if(opts.some(x=>!x)){ PENDENTE=null; return; }
    escolhaAberta=true;atualizarControles();
    telaAdversario(opts);
  }else if(p.tipo==="dilema"){
    dilemaAberto=true;
    novoPosLuta(fightNo);
    mostrarResultado(st.registro&&st.registro[st.registro.length-1],null);
    abrirDilema(p.d||null)
      .catch(()=>{})
      .then(()=>{dilemaAberto=false;PENDENTE=null;verificarConquistas();atualizarControles();renderFicha();salvarCarreira();});
  }
}
/* ---------- Conta obrigatória (revamp fase 3) ----------
   Jogar exige conta (decisão do dono, 2026-09-26, revertendo "jogar não
   exige conta" do LEIA-ME). Nova carreira, Continuar e link de desafio
   passam por comConta(): com sessão segue; sem sessão guarda a intenção e
   abre o portão. A intenção sobrevive ao login por Google e ao link de
   confirmação de e-mail (os dois recarregam a página sem a rota) e é
   seguida quando o Supabase avisa SIGNED_IN. */
/* O SDK do Supabase vem com defer e pode chegar depois do motor: espera
   um pouco antes de concluir "não tem sessão". */
async function esperarSupabase(){
  for(let i=0;i<30&&!getSupabase();i++)await new Promise(r=>setTimeout(r,100));
  return getSupabase();
}
async function sessaoAtual(){
  const sb=await esperarSupabase();
  if(!sb){ USUARIO_ID=null; return null; }
  try{ const{data:{session}}=await sb.auth.getSession(); USUARIO_ID=session?session.user.id:null; return session||null; }
  catch(e){ return null; }
}
function guardarIntencao(obj){ try{ localStorage.setItem("intencao",JSON.stringify({...obj,em:Date.now()})); }catch(e){} }
function consumirIntencao(){
  let v=null;
  try{ v=JSON.parse(localStorage.getItem("intencao")); localStorage.removeItem("intencao"); }catch(e){ return null; }
  return v&&typeof v.em==="number"&&Date.now()-v.em<864e5?v:null;
}
async function comConta(intencao,fn){
  const s=await sessaoAtual();
  if(s){
    consumirIntencao();   // já logado: intenção velha não serve mais
    /* As telas daqui pra frente mostram trava de Pro: confere antes de
       abrir, sem prender o jogador mais que 2,5 s se a rede demorar (a
       tela destrava sozinha depois, ver reconferirPro()). */
    await Promise.race([atualizarStatusPro(),new Promise(r=>setTimeout(r,2500))]);
    fn(); return;
  }
  guardarIntencao(intencao);
  screenPortao(intencao);
}
function screenPortao(intencao){
  const c=montarTela({fundo:"tunel",titulo:"Crie sua conta",classe:"tela-portao"});
  c.appendChild(el("p","tela-sub",intencao&&intencao.tipo==="desafio"
    ?"Alguém te desafiou. Crie sua conta ou entre pra aceitar: a carreira fica salva nela."
    :"Pra jogar você precisa de uma conta. Sua carreira fica salva nela e continua em qualquer aparelho."));
  const form=el("div","painel-n conta-form portao-form");
  c.appendChild(form);
  montarFormularioConta(form,{modoInicial:"criar"});
}
function seguirIntencao(v){
  if(!v)return false;
  if(v.tipo==="desafio"&&v.busca){ location.href=location.pathname+v.busca; return true; }
  irPara(v.tipo==="continuar"?"continuar":"nova",null,{substituir:true});
  return true;
}

/* Armazenamento: grava no aparelho NA HORA (localStorage, síncrono,
   sobrevive a recarregar mesmo sem rede) e manda pra nuvem 2 s depois
   (tabela saves, uma chamada por rajada de saves seguidos). Sem espaço
   ou sem usuário (teste, antes do login) não faz nada. Nada aqui pode
   derrubar o jogo: falha vira aviso no indicador, nunca exceção. */
const chaveSave=(uid,slot)=>`save:${uid}:${slot}`;
function lerSaveLocal(uid,slot){ try{ return JSON.parse(localStorage.getItem(chaveSave(uid,slot))); }catch(e){ return null; } }
function gravarSaveLocal(uid,slot,dados){ try{ localStorage.setItem(chaveSave(uid,slot),JSON.stringify(dados)); return true; }catch(e){ return false; } }
function apagarSaveLocal(uid,slot){ try{ localStorage.removeItem(chaveSave(uid,slot)); }catch(e){} }
let timerNuvem=null;
function salvarCarreira(){
  if(!SLOT_ATUAL||!USUARIO_ID||!st||!me)return;
  const d=montarSave();
  const local=gravarSaveLocal(USUARIO_ID,SLOT_ATUAL,d);
  indicadorSave(local?"salvando":"local");
  clearTimeout(timerNuvem);
  timerNuvem=setTimeout(()=>enviarSaveNuvem(d),2000);
}
async function enviarSaveNuvem(d){
  const sb=getSupabase();
  if(!sb){ indicadorSave("local"); return; }
  try{
    const{error}=await sb.from("saves").upsert({user_id:USUARIO_ID,slot:d.slot,versao:d.versao,dados:d,
      nome:d.nome,divisao:d.divisao,modo:d.modo,cartel:`${d.st.wins}-${d.st.losses}`,luta_n:d.fightNo,
      campeao:!!d.st.title,rosto:d.rosto||null,atualizado_em:d.atualizadoEm},{onConflict:"user_id,slot"});
    indicadorSave(error?"local":"salvo");
  }catch(e){ indicadorSave("local"); }
}
/* [save|null, save|null, save|null] (espaços 1..3). Entre aparelho e
   nuvem vale o mais novo; a versão da nuvem mais nova é copiada pro
   aparelho (jogou em outro celular, abre aqui e continua de lá). */
async function listarSaves(){
  const r=[null,null,null];
  if(!USUARIO_ID)return r;
  for(let s=1;s<=3;s++)r[s-1]=lerSaveLocal(USUARIO_ID,s);
  const sb=getSupabase();
  if(sb){
    try{
      const{data}=await sb.from("saves").select("slot,dados,atualizado_em").eq("user_id",USUARIO_ID);
      (data||[]).forEach(l=>{
        const i=l.slot-1,loc=r[i];
        if(i<0||i>2||!l.dados)return;
        if(!loc||new Date(l.atualizado_em)>new Date(loc.atualizadoEm)){ r[i]=l.dados; gravarSaveLocal(USUARIO_ID,l.slot,l.dados); }
      });
    }catch(e){}
  }
  return r;
}
async function apagarSave(slot){
  apagarSaveLocal(USUARIO_ID,slot);
  const sb=getSupabase();
  if(sb){ try{ await sb.from("saves").delete().eq("user_id",USUARIO_ID).eq("slot",slot); }catch(e){} }
}
function indicadorSave(estado){
  const i=document.getElementById("indicador-save");
  if(!i)return;
  const txt={salvando:"Salvando",salvo:"Salvo",local:"Sem conexão, salvo neste aparelho"}[estado];
  i.className="indicador-save on "+estado;
  i.innerHTML=`${ICONE(estado==="local"?"nuvem-off":"nuvem-ok")}<span>${txt}</span>`;
  clearTimeout(i._t);
  if(estado==="salvo")i._t=setTimeout(()=>{ i.className="indicador-save"; },2500);
  const h=document.getElementById("hubSave");
  if(h){ h.className="hub-save "+estado;
    h.innerHTML=`${ICONE(estado==="local"?"nuvem-off":"nuvem-ok")}<span>${estado==="local"?"No aparelho":txt}</span>`; }
}
/* sair da aba/fechar/trocar de app no celular: grava de novo na hora */
function armarSave(){
  try{
    window.addEventListener("pagehide",()=>salvarCarreira());
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden")salvarCarreira(); });
  }catch(e){}
}

/* ---------- carregar dados ---------- */
async function boot(){
  /* "Abriu o jogo" — evento 1 de 4 do funil (PLANO-LANCAMENTO.md, fase 0).
     Primeira linha de propósito: conta toda visita, mesmo as que falham
     depois (fetch do fighters.json caindo em askForFile()) — "abriu" não
     deveria depender de nada dar certo depois. */
  evento("abriu");
  avisarConfirmacaoEmail();
  app.innerHTML=`<p class="hint" style="margin-top:30px">Carregando os lutadores…</p>`;
  let data=null;
  try{
    const r=await fetch("./fighters.json");
    if(!r.ok)throw 0;
    data=await r.json();
  }catch(e){ return askForFile(); }
  ready(data);
}
function askForFile(){
  app.innerHTML="";
  const box=el("div","err",`<b>Não achei o fighters.json</b>
    O navegador bloqueia leitura de arquivo local quando a página é aberta direto.
    Rode um servidor na pasta do projeto:<br><br>
    <code>python3 -m http.server 8000</code><br><br>
    e abra <code>http://localhost:8000</code>. Ou escolha o arquivo aqui:`);
  const inp=el("input");inp.type="file";inp.accept=".json";
  inp.style.marginTop="12px";
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{ ready(JSON.parse(await f.text())); }
    catch(err){ box.appendChild(el("p","hint","Esse arquivo não é um fighters.json válido.")); }
  };
  box.appendChild(inp);app.appendChild(box);
}
function ready(data){
  app.innerHTML=`<p class="hint" style="margin-top:30px">Avaliando ${data.length} lutadores…</p>`;
  setTimeout(()=>{
    ROSTER=rateAll(data);
    CUTOFF_RANKING=Math.max(...ROSTER.map(f=>f.era?f.era[1]:0))-6;
    POOL=poolDivisao(DIVISION);
    PCT=makePercentiler(POOL);
    LADDER=[...POOL].sort((a,b)=>a.rating-b.rating);
    RANKING=buildRanking(POOL);
    /* Link de desafio pula a tela inicial de propósito — quem clicou
       num link de amigo já sabe o que veio fazer aqui, forçar passar
       pelo menu primeiro só atrapalharia. */
    if(lerDesafio()){ comConta({tipo:"desafio",busca:location.search},()=>iniciarNovaCarreira()); return; }
    /* Endereço com rota (#/ranking) abre direto nela. Endereço com
       resposta de login do Supabase no hash: cria o client ANTES de
       qualquer coisa mexer na URL (ele lê o token dali) e desenha o menu
       sem reescrever o endereço. */
    const r=lerRota();
    if(r.auth){ getSupabase(); rotaAtual="menu"; ROTAS.menu.tela(null); return; }
    irPara(r.nome,r.param,{substituir:true});
    /* entrou com senha no portão: a página recarrega na rota que pediu
       conta (#/nova...), que segue sozinha. Intenção só sobra no menu. */
    if(r.nome==="menu")sessaoAtual().then(ss=>{ if(ss)seguirIntencao(consumirIntencao()); });
  },30);
}

/* ---------- tela 1: nome ---------- */
/* ?d=divisao&s=semente vira desafio: mesma carreira, escolhas suas */
function lerDesafio(){
  try{
    const p=new URLSearchParams(location.search);
    const d=p.get("d"), s=p.get("s");
    if(!d||!s)return null;
    if(!DIVISOES.some(x=>x.id===d))return null;
    const n=parseInt(s,36);
    if(!Number.isFinite(n)||n<=0)return null;
    return{div:d,seed:n>>>0,modo:p.get("m")==="lenda"?"lenda":"normal"};
  }catch(e){return null;}
}
function screenName(nomeInicial=""){
  /* Passo 1 do assistente (revamp fase 4). Link de desafio pula divisão e
     rival (vêm do link): 3 passos em vez de 5. */

  const c=montarPasso(1,total,{titulo:"Nome do lutador",fundo:"tunel",voltar:"menu"});

  }
  const form=el("div","nome-form");
  const inp=el("input");inp.type="text";inp.className="input-hero";
  inp.placeholder="Nome do lutador";inp.maxLength=28;inp.value=nomeInicial||"";
  const go=el("button","botao botao-grande","Montar o lutador");
  go.type="button";
  go.onclick=()=>{
    const n=inp.value.trim();
    if(!n){inp.focus();return;}
    SOM.toque();
    const dz=lerDesafio();

    if(dz){DIVISION=dz.div;SEED=dz.seed;MODO=dz.modo;screenCriador(n);}
    else{SEED=0;MODO="normal";screenCriador(n);}
  };
  inp.onkeydown=e=>{if(e.key==="Enter")go.click();};
  form.append(inp,go);

  c.appendChild(el("p","tela-sub nome-dica","Aparece em cada luta, no card de momento e no ranking."));

/* Criador: personagem grande no palco, categorias em abas, alteração imediata.
   As categorias são declarativas — acrescentar uma opção nova é adicionar uma
   linha aqui, sem tocar em layout. */
const CATEGORIAS=[
 {rot:"Rosto",  itens:[["cor","Tom de pele",()=>PELES,"pele"],
                       ["lista","Porte",()=>PORTES,"porte"]]},
 {rot:"Cabelo", itens:[["lista","Estilo",()=>CABELO_TIPOS,"cabelo"],
                       ["cor","Cor",()=>CABELOS,"corCabelo"]]},
 {rot:"Barba",  itens:[["lista","Estilo",()=>BARBAS,"barba"]]},
 {rot:"Olhos",  itens:[["lista","Formato",()=>OLHOS,"olho"],
                       ["cor","Cor da íris",()=>OLHOS_COR,"corOlho"],
                       ["lista","Sobrancelha",()=>SOBRANCELHAS,"sobrancelha"]]},
 {rot:"Boca",   itens:[["lista","Formato",()=>BOCAS,"boca"]]},
 {rot:"Marcas", itens:[["lista","Cicatriz",()=>CICATRIZES,"cicatriz"],
                       ["cor","Cor do calção",()=>CALCOES,"calcao"]]},
];
let CAT_ATIVA=0;

function screenCriador(name){
  /* Passo 2 do assistente (revamp fase 4): mesma lógica de sempre, na
     moldura nova. Voltar leva ao Passo 1 com o nome preenchido. */
  ROSTO=ROSTO||cfgPadrao();
  const dzPasso=lerDesafio();
  const c=montarPasso(2,dzPasso?3:5,{titulo:"Visual",fundo:"vestiario",voltar:()=>screenName(name)});
  docmeta.textContent=`Registro · ${name}`;

  const wrap=el("div","criador");
  const palco=el("div","palco");palco.id="palco";
  const pain=el("div","painelC");
  pain.innerHTML=`<div class="abas" id="abas"></div><div class="corpoC" id="corpoC"></div>`;
  wrap.append(palco,pain);c.appendChild(wrap);

  const desenha=()=>{
    palco.innerHTML=`<div class="col-t">Seu lutador</div>`+bonecoSVG(ROSTO,{w:250})+
      `<div class="nomebox"><small>Nome do lutador</small>
        <input type="text" id="nomeIn" maxlength="28" value="${(name||"").replace(/"/g,"&quot;")}"></div>`;
    const ni=document.getElementById("nomeIn");
    if(ni)ni.oninput=e=>{name=e.target.value;};
  };

  const abas=document.getElementById("abas");
  CATEGORIAS.forEach((cat,i)=>{
    const b=el("button","aba"+(i===CAT_ATIVA?" on":""),cat.rot);
    b.onclick=()=>{CAT_ATIVA=i;SOM.toque();
      abas.querySelectorAll(".aba").forEach((x,j)=>x.classList.toggle("on",j===i));
      corpo();};
    abas.appendChild(b);
  });

  function corpo(){
    const alvo=document.getElementById("corpoC");
    alvo.innerHTML="";
    CATEGORIAS[CAT_ATIVA].itens.forEach(([tipo,rot,fonte,campo])=>{
      const lista=fonte();
      const bloco=el("div","linhaC");
      bloco.innerHTML=`<div class="linhaC-hd"><span>${rot}</span>
        <b id="v_${campo}">${tipo==="lista"?lista[ROSTO[campo]%lista.length]:""}</b></div>
        <div class="${tipo==="cor"?"swatches":"chips"}" id="g_${campo}"></div>`;
      alvo.appendChild(bloco);
      const g=bloco.querySelector("#g_"+campo);
      lista.forEach((item,i)=>{
        const b=tipo==="cor"
          ? el("button","sw"+(ROSTO[campo]===i?" on":""),"")
          : el("button","chip"+(ROSTO[campo]===i?" on":""),item);
        if(tipo==="cor"){
          b.style.background=item;
          /* amostra de cor não tem texto: sem nome o leitor de tela lê só "botão" */
          if(b.setAttribute)b.setAttribute("aria-label",`${rot} ${i+1}`);
        }
        if(b.setAttribute)b.setAttribute("aria-pressed",String(ROSTO[campo]===i));
        b.onclick=()=>{
          ROSTO[campo]=i;SOM.toque();
          g.querySelectorAll(tipo==="cor"?".sw":".chip")
            .forEach((x,j)=>{ x.classList.toggle("on",j===i); if(x.setAttribute)x.setAttribute("aria-pressed",String(j===i)); });
          const v=bloco.querySelector("#v_"+campo);
          if(v&&tipo==="lista")v.textContent=item;
          desenha();
        };
        g.appendChild(b);
      });
    });
  }

  const rostoAleatorio=()=>{
    const r=n=>Math.floor(Math.random()*n);
    return{pele:r(PELES.length),cabelo:r(CABELO_TIPOS.length),corCabelo:r(CABELOS.length),
      barba:r(BARBAS.length),olho:r(OLHOS.length),corOlho:r(OLHOS_COR.length),
      sobrancelha:r(SOBRANCELHAS.length),boca:r(BOCAS.length),
      cicatriz:r(CICATRIZES.length),calcao:r(CALCOES.length),porte:r(3)};
  };
  const dz=lerDesafio();
  /* pular() e ok.onclick avançam pro mesmo lugar — pular só decide o rosto
     por sorteio em vez de deixar o jogador escolher. PLANO-LANCAMENTO.md
     fase 2: quem clicou no anúncio tem uns 3 minutos, não 40; customizar 9
     componentes antes da primeira luta é exatamente o tipo de passo que
     sobra pra quem quer, e trava quem não quer. */
  const avancar=()=>{
    const ni=document.getElementById("nomeIn");
    const n=(ni?ni.value:name||"").trim();
    if(!n){if(ni)ni.focus();return;}
    SOM.toque();
    try{localStorage.setItem("rosto",JSON.stringify(ROSTO));}catch(e){}
    if(dz){DIVISION=dz.div;SEED=dz.seed;MODO=dz.modo;startDraft(n);}
    else screenDivisao(n);
  };

  const row=el("div","row");
  const rand=el("button","btn btn-ghost","Sortear");
  rand.onclick=()=>{SOM.toque();ROSTO=rostoAleatorio();desenha();corpo();};
  const pular=el("button","btn btn-ghost","Pular");
  pular.onclick=()=>{ROSTO=rostoAleatorio();evento("pulou_criador");avancar();};
  const ok=el("button","btn",dz?"Começar a carreira":"Escolher divisão");
  ok.onclick=avancar;
  row.className="row criador-acoes";
  row.append(ok,rand,pular);c.appendChild(row);
  desenha();corpo();
}

const MODOS=[
 {id:"normal",nome:"Carreira",
  desc:"A divisão inteira. Você começa no card preliminar e sobe."},
 /* O texto NÃO promete "mais difícil" porque a medição não confirma: o pool de
    lendas te dá um lutador melhor na mesma proporção em que dá adversários
    melhores. Muda quem entra no octógono, não o placar. */
 {id:"lenda", nome:"Seja uma lenda",
  desc:"Campeões e ex-desafiantes, no draft e do outro lado do octógono."},
];
function screenDivisao(name){
  RIVAL_ATIVADO=false;RIVAL_NOME_ESCOLHIDO=null; // reseta a cada carreira nova
  /* Passo 3 do assistente (revamp fase 4). Seja uma lenda passa pelo
     bloqueioPro() sem Pro: aparece apagado, só o selo clica. */
  const c=montarPasso(3,5,{titulo:"Divisão",fundo:"arena-alto",voltar:()=>screenCriador(name)});
  docmeta.textContent=`Registro · ${name}`;
  c.appendChild(el("p","tela-sub","A divisão decide quem você enfrenta e como as lutas terminam. Peso-pesado acaba cedo; mosca vai pros cartões."));
  /* O modo vem ANTES da divisão porque é ele que decide quantos lutadores cada
     divisão tem — e quais delas deixam de fechar 22 lutas sem repetir. */
  const modos=el("div","modos");
  const nota=el("p","modo-nota","");
  const grid=el("div","divs");
  c.append(modos,nota,grid);

  const desenha=()=>{
    modos.innerHTML="";
    MODOS.forEach(m=>{
      /* Item 1 do pedido pós-item-6: "Seja uma lenda" não checava meuPro
         nenhuma vez — clique normal, sem DevTools, entrava. O risco
         aceito no plano original era só forçar MODO="lenda" via
         console; pela interface, grátis não pode. */
      const travado=m.id==="lenda"&&!meuPro; // só pro RÓTULO — o clique confere meuPro de novo, ver abaixo
      const b=el("button","modo"+(MODO===m.id?" on":""),
        `<span class="n">${m.nome}</span><span class="d">${m.desc}</span>`);   // travado: o bloqueioPro() põe o selo por cima
      b.id="modo_"+m.id;
      b.onclick=()=>{
        if(MODO===m.id)return;
        SOM.toque();
        /* NUNCA usar o `travado` capturado no fechamento acima — ele é
           de quando o botão nasceu; meuPro pode ter mudado desde então
           (login/pagamento noutra aba) sem esta tela re-renderizar.
           Recalcula na hora do clique, senão um Pro de verdade podia
           ficar travado até sair e voltar da tela. */
        if(m.id==="lenda"&&!meuPro){
          nota.innerHTML=`Modo Lenda é recurso do <a href="#" id="notaLinkPro">Plano Pro</a>.`;
          document.getElementById("notaLinkPro").onclick=e=>{e.preventDefault();screenPlanoPro();};
          return;
        }
        MODO=m.id; desenha();
      };
      modos.appendChild(travado?bloqueioPro(b):b);
    });

    grid.innerHTML="";
    const fora=[];
    DIVISOES.forEach(d=>{
      /* divisão pequena demais no dataset inteiro nunca foi jogável */
      if(ROSTER.filter(f=>f.division===d.id).length<MIN_LUTADORES)return;
      const pool=poolDivisao(d.id);
      if(pool.length<MIN_LUTADORES){
        fora.push(`${d.nome}${d.f?" fem.":""} (${pool.length})`);
        return;
      }
      const top=[...pool].sort((a,b)=>b.rating-a.rating)[0];
      const ko=TUNING.koPower[d.id];
      const nivelKO=ko>=1.3?3:ko>=.9?2:1;
      const card=el("button","div-c"+(d.f?" fem":""),
        `<span class="n">${d.nome}</span>
         <span class="lb">até ${d.lbs} lb</span>
         <span class="ko-linha"><span class="ko-rot">Nocaute</span><span class="ko-niveis ko-${nivelKO}"><i></i><i></i><i></i></span><span class="ko-txt">${["","baixo","médio","alto"][nivelKO]}</span></span>
         <span class="qt"><b>${pool.length}</b> ${MODO==="lenda"?"lendas":"lutadores"}</span>
         <span class="top">O melhor daqui: ${top.name}</span>`);
      card.type="button";
      card.onclick=()=>{SOM.toque();DIVISION=d.id;screenAtivarRival(name);};
      grid.appendChild(card);
    });

    nota.innerHTML=fora.length
      ? `Uma carreira são 22 lutas sem repetir adversário, então divisão com menos
         de ${MIN_LUTADORES} lendas não fecha. Fora daqui: ${fora.join(" · ")}.`
      : "";
  };
  desenha();
  reconferirPro(desenha);
}
/* Modo Rival — ativação (item 4, 2026-09-22). Vitrine igual coletiva/
   entrevista: aparece pra todo mundo, o clique em "Sim" é que trava pra
   quem não é Pro (abre a oferta, "Continuar" dela segue sem rival —
   nunca trava o fluxo de criar carreira). Duas travas no nome livre:
   1) bate (sem acento, sem maiúscula) com qualquer um dos 1.527
   lutadores reais — a IA inventaria fala na boca de gente real, mesmo
   motivo do rival em si ser sempre fictício (ver nomeRival()); 2)
   CONTEUDO_INSEGURO, mesma rede de baixo do dilema. Função pura (sem
   DOM), separada de propósito — testável direto, sem precisar montar a
   tela inteira. Devolve null se o nome passa, ou a mensagem de recusa
   em português. */
function validarNomeRival(digitado){
  const nome=String(digitado||"").trim();
  if(!nome)return"Escreve um nome pro rival.";
  const bateReal=(ROSTER||[]).some(f=>semAcento(f.name)===semAcento(nome));
  if(bateReal)return"Já existe um lutador real com esse nome. Escolhe outro.";
  if(conteudoInseguro(nome))return"Esse nome não pode ser usado.";
  return null;
}
function screenAtivarRival(name){
  /* Passo 4 do assistente (revamp fase 4). "Sim" passa pelo bloqueioPro()
     sem Pro (antes abria a oferta do Pro no meio do fluxo de criação). */
  const c=montarPasso(4,5,{titulo:"Rival",fundo:"cartazes",voltar:()=>screenDivisao(name)});
  docmeta.textContent=`Registro · ${name}`;
  const box=el("div","tela-box rival-box");
  c.appendChild(box);
  box.appendChild(el("p","tela-sub","Um rival volta a cruzar seu caminho ao longo da carreira, com histórico e revanches. Você escolhe o nome; os números vêm de um lutador real."));

  const opts=el("div","modos");
  let simBtn=null;
  const naoBtn=el("button","modo on",`${ICONE("usuario","modo-ico")}<span class="n">Não, carreira normal</span><span class="d">Só você contra a divisão</span>`);
  naoBtn.type="button";
  box.appendChild(opts);

  const nomeArea=el("div","");
  box.appendChild(nomeArea);
  const msg=el("p","hint","");
  box.appendChild(msg);
  const continuar=el("button","botao","Continuar");continuar.type="button";
  box.appendChild(continuar);

  let escolha="nao",nomeIn=null;
  const marcar=()=>{
    simBtn.className="modo"+(escolha==="sim"?" on":"")+(meuPro?"":" bloqueado");   // não perde a trava
    naoBtn.className="modo"+(escolha==="nao"?" on":"");
  };
  const renderNome=()=>{
    nomeArea.innerHTML="";
    if(escolha!=="sim")return;
    nomeIn=el("input");nomeIn.type="text";nomeIn.placeholder="Nome do rival";nomeIn.maxLength=40;
    nomeArea.appendChild(nomeIn);
  };
  /* Monta as duas opções; de novo se a conferência do Pro voltar depois
     da tela nascer (reconferirPro). bloqueioPro() tira o clique do botão,
     então o "Sim" liberado precisa ser um botão novo. */
  const montarOpcoes=()=>{
    simBtn=el("button","modo",`${ICONE("luta","modo-ico")}<span class="n">Sim, quero um rival</span><span class="d">Recurso do Plano Pro</span>`);
    simBtn.type="button";
    simBtn.onclick=()=>{
      SOM.toque();
      if(!meuPro)return;   // sem Pro o botão nem chega a ter clique (bloqueioPro)
      escolha="sim";marcar();renderNome();
    };
    opts.innerHTML="";
    opts.append(meuPro?simBtn:bloqueioPro(simBtn),naoBtn);
  };
  naoBtn.onclick=()=>{ SOM.toque(); escolha="nao";marcar();renderNome(); };
  montarOpcoes();
  reconferirPro(montarOpcoes);

  continuar.onclick=()=>{
    SOM.toque();
    if(escolha==="sim"){
      const digitado=(nomeIn.value||"").trim();
      const erro=validarNomeRival(digitado);
      if(erro){ msg.className="hint msg-erro"; msg.textContent=erro; return; }
      RIVAL_ATIVADO=true;RIVAL_NOME_ESCOLHIDO=digitado;
    }else{
      RIVAL_ATIVADO=false;RIVAL_NOME_ESCOLHIDO=null;
    }
    startDraft(name);
  };
}
function startDraft(name){
  /* refeito a cada carreira porque a divisão OU o modo podem ter mudado */
  POOL=poolDivisao(DIVISION);
  PCT=makePercentiler(POOL);
  LADDER=[...POOL].sort((a,b)=>a.rating-b.rating);
  RANKING=buildRanking(POOL);
  /* A semente garante os ADVERSÁRIOS e a ordem deles — é isso que torna o
     link um desafio de verdade em vez de um print. Não garante mais o
     draft (o "Rolar novamente" consome rng sob demanda, uma vez por
     criação) nem os eventos de vida (agora gerados pela IA, sem sorteio
     determinístico nenhum) — ver PENDENCIAS.md e a tela de convite
     (screenName()) pro texto exato da promessa. */
  SEED=SEED||((Math.random()*4294967295)>>>0);
  rng=mulberry32(SEED);
  rerollUsado=false;
  /* Stream separado pra "a disputa pode não vir": nunca consome do rng
     principal, senão qualquer sorteio aqui deslocaria a sequência e link de
     desafio antigo pararia de reproduzir a mesma carreira. */
  holdRng=mulberry32((SEED^0x9E3779B9)>>>0);
  /* Mesmo motivo do holdRng, stream próprio: sorteia qual frase neutra do
     fallback local aparece, sem tocar no rng principal — senão qualquer
     dilema cortado localmente deslocaria a sequência e o link de desafio
     pararia de reproduzir a mesma carreira. */
  fraseRng=mulberry32((SEED^0x1234ABCD)>>>0);
  escolhaRng=mulberry32((SEED^0x5F3A9C21)>>>0);
  lesaoRng=mulberry32((SEED^0x7C3E1A55)>>>0);
  eventoRng=mulberry32((SEED^0x2B8D4F17)>>>0);
  dilemaRng=mulberry32((SEED^0x4D1E8A63)>>>0);
  /* Modo Rival (Plano Pro, item 4) — stream próprio, mesmo motivo de sempre:
     escolher o rival (nome fictício + de quem emprestar os stats) nunca pode
     tocar rng/escolhaRng/holdRng, senão um link de desafio compartilhado por
     um Pro deixaria de reproduzir o MESMO draft/adversários pra quem abre
     sem ser Pro. Rival é conteúdo Pro-only — só quem tem meuPro consome
     este stream, então nunca diverge do que um viewer grátis já reproduzia
     antes desta feature existir. */
  rivalRng=mulberry32((SEED^0x6A09E667)>>>0);
  me={name,division:DIVISION};picks=[];
  budgetLeft=TOTAL_WEIGHT*BUDGET_PCT;
  remaining=[...PAIRS];
  docmeta.textContent=`Registro · ${name}`;
  renderDraft();
}
/* Os 8 atributos ocupam os 8 lados do octógono, e cada par preenche dois lados
   VIZINHOS. O encaixe é exato — não é decoração adaptada. */
const SLOTS=[
 {k:"slpm",       lab:"Volume",    par:"trocacao", ang:-90},
 {k:"reach",      lab:"Alcance",   par:"trocacao", ang:-45},
 {k:"kdAvg",      lab:"Poder",     par:"poder",    ang:0},
 {k:"durability", lab:"Queixo",    par:"poder",    ang:45},
 {k:"tdAvg",      lab:"Quedas",    par:"chao",     ang:90},
 {k:"tdDef",      lab:"Def. queda",par:"chao",     ang:135},
 {k:"subAvg",     lab:"Finaliz.",  par:"jiujitsu", ang:180},
 {k:"strDef",     lab:"Def. golpe",par:"jiujitsu", ang:225},
];
const FMT={slpm:v=>v.toFixed(1),reach:v=>v.toFixed(0)+'"',kdAvg:v=>v.toFixed(2),
  durability:v=>v.toFixed(2),tdAvg:v=>v.toFixed(1),tdDef:v=>Math.round(v*100)+"%",
  subAvg:v=>v.toFixed(1),strDef:v=>Math.round(v*100)+"%"};

function octogonoSVG(){
  const p=[];
  for(let i=0;i<8;i++){const a=(i*45-67.5)*Math.PI/180;
    p.push(`${50+41*Math.cos(a)},${50+41*Math.sin(a)}`);}
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="${p.join(" ")}" fill="none" stroke="var(--line2)" stroke-width="1.1"/>
    <polygon points="${p.join(" ")}" fill="none" stroke="var(--line)" stroke-width="6"
      transform="translate(50 50) scale(.72) translate(-50 -50)"/>
    <polygon points="${p.join(" ")}" fill="none" stroke="var(--line)" stroke-width=".5"
      transform="translate(50 50) scale(.46) translate(-50 -50)"/></svg>`;
}
let parRecem=null;
function desenhaOctogono(destacar){
  const w=document.getElementById("oct");
  if(!w)return;
  const feitos=picks.length, total=4;
  w.innerHTML=octogonoSVG()+
    `<div class="oct-mid"><div class="n">${feitos}<span style="font-size:17px;color:var(--faded)">/${total}</span></div>
      <div class="l">montado</div><div class="b"><i style="width:${feitos/total*100}%"></i></div></div>`;
  SLOTS.forEach(s=>{
    const a=s.ang*Math.PI/180;
    const x=50+38*Math.cos(a), y=50+38*Math.sin(a);
    const v=me[s.k];
    const cheio=v!=null;
    const origem=(picks.find(p=>p.pair.id===s.par)||{}).from||"";
    const d=document.createElement("div");
    /* A fixada tem que rodar UMA vez, quando o par acaba de ser escolhido.
       Como esta função roda a cada passada de mouse, sem a flag ela reanimava
       atributos já preenchidos toda hora. */
    d.className="slot"+(cheio?" cheio":"")+(destacar===s.par?" mira":"")+
      (parRecem===s.par?" novo":"");
    d.style.left=x+"%"; d.style.top=y+"%";
    d.innerHTML=`<span class="lab">${s.lab}</span>
      <span class="val">${cheio?FMT[s.k](v):"?"}</span>
      <span class="src">${cheio?origem:"vazio"}</span>`;
    w.appendChild(d);
  });
  parRecem=null;                 // consumida: não reanima nas próximas passadas
}

function mostraDossie(r){
  const d=document.getElementById("dossie");
  if(!d)return;
  if(!r){
    /* Antes disto era só retrato + 1 linha de instrução, com muito vazio
       embaixo — o painel parecia quebrado antes do 1º hover. Nome e
       divisão já são dados de verdade nesse ponto (vêm de screenName(),
       antes do draft começar) — mostrar os dois já deixa o painel com a
       cara de "dossiê ainda incompleto", não "painel vazio". */
    const divNome=(DIVISOES.find(x=>x.id===DIVISION)||{}).nome||DIVISION;
    d.innerHTML=`<div class="col-t">Seu lutador</div>
    <div style="text-align:center;padding:6px 0 2px">${bonecoSVG(ROSTO||cfgPadrao(),{w:130})}</div>
    <div class="nm" style="text-align:center">${me.name||""}</div>
    <div class="tags" style="justify-content:center"><span class="tag">${divNome}</span></div>
    <div class="vazio" style="padding:10px 0 0">${semHover()
      ?"Toque numa carta<br>pra ver o dossiê de quem preenche ela."
      :"Passe o mouse numa carta<br>pra ver o dossiê de quem preenche ela."}</div>`;
    return;
  }
  const f=r.src, t=f.titulos||{disputas:0,vitorias:0};
  const pa=PCT(r.pair.a.key,f[r.pair.a.key]), pb=PCT(r.pair.b.key,f[r.pair.b.key]);
  const tags=[`${f.fights} lutas`];
  if(f.era)tags.push(`${f.era[0]}-${f.era[1]}`);
  if(f.stance)tags.push(f.stance);
  d.innerHTML=`<div class="col-t">Dossiê do lutador</div>
    <div class="nm">${f.name}</div>
    <div class="tags">${tags.map(x=>`<span class="tag">${x}</span>`).join("")}
      ${t.vitorias>0?`<span class="tag t">${t.vitorias}x campeão</span>`:
        t.disputas>0?`<span class="tag">${t.disputas} disputas de título</span>`:""}</div>
    <p>${f.arquetipo||"Completo"}${f.destaque?`. ${f.destaque.eixo.charAt(0).toUpperCase()+f.destaque.eixo.slice(1)} no <b style="color:var(--ink)">${Math.round(f.destaque.pct*100)}º percentil</b> da divisão.`:", sem eixo dominante."}</p>
    <div class="grid">
      <div class="cel mira"><small>${r.pair.a.label}</small><b>${r.pair.a.fmt(f[r.pair.a.key])}</b></div>
      <div class="cel mira"><small>${r.pair.b.label}</small><b>${r.pair.b.fmt(f[r.pair.b.key])}</b></div>
    </div>
    ${pctBar(pa)}${pctBar(pb)}
    <div class="grid" style="margin-top:11px">
      <div class="cel"><small>Custo</small><b>${r.cost.toFixed(2)}</b></div>
      <div class="cel"><small>Sobra</small><b>${(budgetLeft-r.cost).toFixed(2)}</b></div>
    </div>`;
}

function renderDraft(){
  /* Passo 5 do assistente (revamp fase 4; 3 de 3 no desafio). Voltar só
     antes da 1ª carta: depois dela a carta já gastou orçamento e sorteio,
     voltar deixaria o draft pela metade. */
  const dzPasso=lerDesafio(),totalP=dzPasso?3:5;
  const voltarP=picks.length?null:(dzPasso?()=>screenCriador(me.name):()=>screenAtivarRival(me.name));
  const c=montarPasso(totalP,totalP,{titulo:"Draft",fundo:"octogono-luz",voltar:voltarP});
  c.appendChild(el("p","tela-sub",
    `${(DIVISOES.find(d=>d.id===DIVISION)||{}).nome||DIVISION} · montagem ${4-remaining.length+1} de 4. Cada carta traz dois atributos do mesmo lutador real.`));

  const arena=el("div","arena");
  const esq=el("div","painel");
  /* Antes esta coluna não tinha painel/moldura nenhuma — as outras duas
     tinham borda + título (.col-t) e esta só flutuava um diagrama sozinho
     no meio da tela, com muito vazio em volta em qualquer viewport largo.
     Mesma moldura das vizinhas agora, com título e legenda embaixo. */
  const meio=el("div","painel painel-oct");
  const dir=el("div","painel dossie");dir.id="dossie";
  meio.innerHTML=`<div class="col-t">Seu octógono</div>
    <div class="oct-wrap" id="oct"></div>
    <p class="oct-legenda">Cada vértice é um atributo do seu lutador. A carta
      escolhida no momento pisca no vértice e na célula do dossiê que ela preenche.</p>`;
  arena.append(esq,meio,dir);
  c.appendChild(arena);

  const pl=budgetLeft/(TOTAL_WEIGHT*BUDGET_PCT);
  esq.innerHTML=`<div class="col-t">Escolha o próximo par</div>
    <div class="budget"><span class="budget-num"><small>Orçamento</small>${budgetLeft.toFixed(2)}</span>
      <span class="budget-bar"><span class="budget-fill${pl<.3?" low":""}"
        style="width:calc(${(pl*100).toFixed(1)}% - 2px)"></span></span></div>
    <button class="btn btn-ghost btn-sm reroll" id="reroll"></button>
    <div class="cards cards-scroll" id="cards" style="grid-template-columns:1fr"></div>`;
  /* Item 3: uma rolagem nova da mesa atual, uma vez em toda a criação (não
     por par) — desabilita globalmente com rerollUsado, não um contador por
     tela. Consome rng (rollTable() chama rng() de novo pra sortear outra
     vez), então a partir daqui o draft deixa de ser reprodutível pelo link
     — só os ADVERSÁRIOS continuam garantidos pela semente (ver
     startDraft() e screenName()). .disabled setado em JS, não só no texto
     do template — mesmo padrão de go.disabled/inp.disabled em
     abrirDilema(), é o que fica de fato desabilitado (clicável ou não),
     não só visualmente cinza. */
  const rerollBtn=document.getElementById("reroll");
  rerollBtn.textContent=rerollUsado?"Já rolou":"Rolar novamente";
  rerollBtn.disabled=rerollUsado;
  rerollBtn.onclick=()=>{
    if(rerollUsado)return;
    rerollUsado=true;
    renderDraft();
  };

  const rows=rollTable(POOL,remaining,rng,PCT);
  const afford=rows.filter(r=>r.cost<=budgetLeft);
  const shown=afford.length?afford:[rows.reduce((m,r)=>r.cost<m.cost?r:m)];
  const grid=document.getElementById("cards");
  /* Sem hover, o toque não tem "passar por cima de graça" — o 1º toque faz
     o que o mouseenter fazia (mostra dossiê/octógono) e SÓ o 2º toque na
     MESMA carta comita (pick). Precisa de sinal inequívoco na carta
     selecionada (classe .sel + rótulo .confirma) — cor sozinha não basta,
     ninguém espera esse padrão de cara. Tocar outra carta troca a seleção
     sem comitar (equivalente a mover o mouse); tocar fora desseleciona
     (equivalente a tirar o mouse de cima) — ver toqueForaDesseleciona()
     abaixo, testado com rolagem de verdade pra rolar não desselecionar. */
  let selecionado=null;
  const desmarcar=()=>{
    if(!selecionado)return;
    selecionado.el.classList.remove("sel");
    const lbl=selecionado.el.querySelector(".confirma");
    if(lbl)lbl.remove();
    selecionado=null;
  };
  shown.forEach(r=>{
    const pa=PCT(r.pair.a.key,r.src[r.pair.a.key]),pb=PCT(r.pair.b.key,r.src[r.pair.b.key]);
    const attr=(d,p)=>`<span class="attr mira-attr" style="display:block">
      <span style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <span class="attr-l">${d.label}${p>=.90?'<span class="elite">elite</span>':""}</span>
        <span class="attr-v">${d.fmt(r.src[d.key])}</span></span>
      ${pctBar(p)}</span>`;
    const c=el("button","card",`
      <span class="pair">${r.pair.label}</span>
      <span class="src"><b style="color:var(--ink);font-weight:600;font-size:12.5px">${r.src.name}</b> · ${r.src.fights} lutas</span>
      ${attr(r.pair.a,pa)}${attr(r.pair.b,pb)}
      <span class="cost"><span>custo</span><b>${r.cost.toFixed(2)}</b></span>`);
    if(semHover()){
      c.onclick=()=>{
        if(selecionado&&selecionado.r===r){pick(r);return;}
        desmarcar();
        selecionado={r,el:c};
        c.classList.add("sel");
        c.appendChild(el("span","confirma","toque de novo pra confirmar"));
        mostraDossie(r);desenhaOctogono(r.pair.id);
      };
    }else{
      c.onclick=()=>pick(r);
      c.onmouseenter=()=>{mostraDossie(r);desenhaOctogono(r.pair.id);};
      c.onfocus=c.onmouseenter;
    }
    grid.appendChild(c);
  });
  desenhaOctogono(null);
  mostraDossie(null);
  if(semHover()){
    /* Clique (não toque bruto): um arrasto de rolagem que termina fora de
       qualquer carta NÃO dispara "click" no navegador — só um toque sem
       deslocamento dispara. Rolar a lista não passa por aqui. */
    const toqueForaDesseleciona=e=>{if(e.target===grid||e.target===esq)desmarcar();};
    grid.onclick=toqueForaDesseleciona;
    esq.onclick=toqueForaDesseleciona;
  }
  if(picks.length===0)c.appendChild(el("div","legend",semHover()
    ?`A barra é o <b>percentil na divisão</b>: quanto da divisão esse lutador supera
     naquele atributo. Toque numa carta pra ver os dois lados que ela preenche.
     Toque de novo pra confirmar.`
    :`A barra é o <b>percentil na divisão</b>: quanto da divisão esse lutador supera
     naquele atributo. Passe o mouse numa carta para ver os dois lados que ela preenche.`));
}
function pick(r){
  me[r.pair.a.key]=r.src[r.pair.a.key];
  me[r.pair.b.key]=r.src[r.pair.b.key];
  [r.pair.a.key,r.pair.b.key].forEach(k=>(RIDERS[k]||[]).forEach(rk=>me[rk]=r.src[rk]));
  budgetLeft-=r.cost;
  picks.push({pair:r.pair,from:r.src.name});
  parRecem=r.pair.id;SOM.fixa();
  remaining=remaining.filter(p=>p.id!==r.pair.id);
  if(remaining.length)renderDraft(); else startCareer();
}

/* ---------- tela 3: carreira ---------- */
function startCareer(){
  /* "Terminou o draft" — evento 2 de 4. Chamada aqui, não em pick(), porque
     startCareer() só roda quando as 4 cartas já foram escolhidas
     (remaining.length===0 em pick()) — é o ponto exato de conclusão, não
     "escolheu mais uma". */
  evento("terminou_draft");
  /* Plano Pro — dispara sem esperar (fire-and-forget): meuPro é só cache
     de UI (ver comentário em atualizarStatusPro()), a carreira não pode
     travar esperando uma consulta de rede que pode nem existir sessão
     pra fazer. Se resolver depois do jogador já estar na tela de camp,
     tudo bem — a próxima renderização de telaColetiva()/botão de
     entrevista já lê o valor atualizado. */
  atualizarStatusPro();
  iniciarEstadoCarreira();
  montarTelaCarreira();
  salvarCarreira();
}
const SEGUIDORES_INICIAIS=2400;

  st={treino:{},eventoMod:{},campHist:{},

      topoDivisaoAlcancado:false,bonusNoiteMarco:false,consultoriaAtiva:false,
      longestL:0,foiCinturaoInterino:false,perdeuCinturaoPorNocaute:false,
      maxDisputaRecusas:0,tituloPorDecisao:false,
      /* Plano Pro — coletivaHype/coletivaPressao são escopados a UMA luta
         (ver reset em finishFight()), nunca acumulam. entrevistasFeitas é

      coletivaHype:1,coletivaPressao:null,entrevistasFeitas:0,rival:null,

      rivalAtivado:RIVAL_ATIVADO,rivalNomeEscolhido:RIVAL_NOME_ESCOLHIDO,rivalAnunciado:false};
  rareUsed=new Set();fought=new Set();

/* =========================================================================
   HUB DA CARREIRA (revamp fase 5). Casca nova: barra fixa e 7 abas com
   fundo próprio. A lógica do jogo continua achando tudo por id (#next,
   #escolha, #stage, #bouts, #ficha, #phone...); aqui só muda ONDE cada
   container mora. Plano: docs/superpowers/plans/2026-09-27-revamp-fase-5.md
   ========================================================================= */
const ABAS_HUB=[
  {id:"painel",rot:"Painel",ic:"painel",fundo:"arena"},
  {id:"lutador",rot:"Lutador",ic:"usuario",fundo:"vestiario"},
  {id:"cartel",rot:"Cartel",ic:"lista",fundo:"tunel"},
  {id:"midia",rot:"Mídia",ic:"jornal",fundo:"imprensa"},
  {id:"loja",rot:"Loja",ic:"loja",fundo:"academia"},
  {id:"cards",rot:"Cards",ic:"cards",fundo:"fotos"},
  {id:"conquistas",rot:"Conquistas",ic:"trofeu",fundo:"trofeus"},
];
/* No celular a barra de baixo só comporta 4 guias e o "Mais"; estas 3
   moram na folha que o "Mais" abre. */
const ABAS_NA_FOLHA=["loja","cards","conquistas"];
let abaHub="painel";
/* Carreira na tela (revamp fase 5): muda a cada tela de carreira montada
   e a cada saída. Toda continuação assíncrona (IA, timers) guarda o valor
   de quando começou e desiste se ele mudou: resposta atrasada de uma
   carreira nunca escreve na seguinte. */
let CARREIRA_TOKEN=0;
function pararCarreira(){
  CARREIRA_TOKEN++;
  clearTimeout(playTimer);clearTimeout(autoTimer);clearTimeout(entradaTimer);
  auto=false;
  document.documentElement.dataset.noite="0";
}
function montarTelaCarreira(){
  if(cfgAberto)fecharConfig();
  document.documentElement.dataset.tela="hub";
  document.documentElement.dataset.noite="0";
  CARREIRA_TOKEN++;
  noiteEtapa=null;ofertaAtual=null;escolhidoAtual=null;posLutaAtual=null;
  /* a carreira em andamento mora em #/carreira: recarregar volta pra ela */
  rotaAtual="carreira";
  try{ if(location.hash!=="#/carreira")history.replaceState(null,"","#/carreira"); }catch(e){}
  app.innerHTML="";
  const tela=el("div","tela tela-hub");
  const fundo=fundoTela("arena");fundo.id="hubFundo";
  tela.append(fundo,montarBarraHub(),montarGuiasHub());
  const folha=el("div","hub-folha");folha.id="hubFolha";folha.hidden=true;
  ABAS_NA_FOLHA.forEach(id=>{
    const a=ABAS_HUB.find(x=>x.id===id);
    const b=el("button","folha-item",`${ICONE(a.ic)}<span>${a.rot}</span>`);
    b.type="button";b.onclick=()=>{SOM.toque();abrirAbaHub(id);};
    folha.appendChild(b);
  });
  tela.appendChild(folha);
  const corpo=el("main","hub-corpo");
  const secao={};
  ABAS_HUB.forEach(a=>{
    const s=el("section","hub-aba hub-aba-"+a.id);s.id="aba_"+a.id;s.hidden=a.id!=="painel";
    if(a.id!=="painel"){
      const cab=el("div","hub-aba-cab");
      const v=el("button","btn-voltar voltar-painel",`${ICONE("seta-esq")}<span>Painel</span>`);
      v.type="button";v.onclick=()=>{SOM.toque();abrirAbaHub("painel");};
      cab.append(v,el("h2","hub-aba-titulo",a.rot));
      s.appendChild(cab);
    }
    secao[a.id]=s;corpo.appendChild(s);
  });
  tela.appendChild(corpo);

  /* Painel: bloco da próxima luta (com as ações), palco da luta (até a
     noite de luta em tela cheia chegar, tarefas 5 a 7 da fase 5), última
     luta; na lateral, caminho até o cinturão, posição, lesão e posts. */
  const grade=el("div","painel-grade");
  const principal=el("div","painel-principal");
  const lado=el("aside","painel-lado");
  grade.append(principal,lado);
  secao.painel.appendChild(grade);
  const prox=el("div","painel-proxima");
  const proxCab=el("div","proxima-cab");proxCab.id="painelProxima";
  const row=el("div","hub-acoes");row.id="controls";
  const next=el("button","botao botao-grande","Próxima luta");next.id="next";next.onclick=()=>nextFight();
  const ab=el("button","botao botao-sec","Modo automático");ab.id="autob";ab.onclick=toggleAuto;
  const hint=el("span","hub-contador",`0 de ${TOTAL_FIGHTS}`);hint.id="counter";
  row.append(next,ab,hint);
  /* oferta aberta com a noite fechada (Voltar na oferta): a escolha
     continua de pé, sem sortear de novo; este botão reabre a noite nela */
  const vn=el("button","botao botao-grande","Voltar à escolha do adversário");vn.id="voltarNoite";vn.hidden=true;
  vn.onclick=()=>{SOM.toque();mostrarNoite("oferta");};
  prox.append(proxCab,row,vn);
  principal.appendChild(prox);
  [["painelCinturao",""],["painelPosicao",""],["painelLesao","painel-bloco-lesao"],["painelPosts","painel-bloco-posts"]].forEach(([id,c])=>{
    const b=el("div","painel-bloco"+(c?" "+c:""));b.id=id;lado.appendChild(b);
  });
  const ultima=el("div","painel-bloco painel-ultima");ultima.id="painelUltima";ultima.hidden=true;
  principal.appendChild(ultima);

  const ficha=el("div","ficha");ficha.id="ficha";secao.lutador.appendChild(ficha);
  const resumo=el("div","cartel-resumo");resumo.id="cartelResumo";
  const cvz=vazio("lista","Nenhuma luta ainda","Cada luta da carreira entra aqui. Toque numa linha pra rever a narração.");cvz.id="cartelVazio";
  const bouts=el("div","bouts");bouts.id="bouts";

  const midia=el("div","midia-grade");

  const graf=el("div","painel-bloco midia-grafico");graf.id="midiaGrafico";

    const p=el("div","hub-painel");p.id=id;secao[a].appendChild(p);
  });
  tela.appendChild(montarNoite());
  /* Aposentar continua em sobreposição de propósito: é permanente e pede
     escolha explícita entre Cancelar e Aposentar-se. */
  const painelApos=el("div","painel-overlay");painelApos.id="painelAposentar";
  painelApos.style.display="none";tela.appendChild(painelApos);
  app.appendChild(tela);
  abrirAbaHub("painel");
  atualizarControles();
  atualizarTrilha();
}
/* =========================================================================
   NOITE DE LUTA (revamp fase 5): camada em tela cheia por cima do hub.
   Só troca de etapa DEPOIS que o estado do jogo mudou (nextFight,
   telaCamp, telaColetiva, iniciarTelaLuta); não decide nada. Voltar só
   existe antes da luta começar e nunca sorteia de novo: a oferta fica
   guardada em ofertaAtual e é redesenhada, não recalculada.
   ========================================================================= */
const ETAPAS_NOITE=[
  {id:"oferta",rot:"Oferta",fundo:"contrato"},
  {id:"camp",rot:"Camp",fundo:"saco"},
  {id:"coletiva",rot:"Coletiva",fundo:"imprensa"},
  {id:"entrada",rot:"Entrada",fundo:"entrada"},
  {id:"luta",rot:"Luta",fundo:"octogono-luz"},
  {id:"resultado",rot:"Resultado",fundo:"confete"},
];
let noiteEtapa=null,ofertaAtual=null,escolhidoAtual=null,posLutaAtual=null;
/* Pós-luta: um embrulho por luta dentro de #posluta recebe raro, evento
   da IA, dilema e convite de entrevista. Quando a noite fecha ou a
   próxima luta começa, o embrulho INTEIRO vai pro #bouts (Cartel) logo
   depois da linha da luta dele; evento da IA que chega atrasado cai no
   mesmo embrulho, então nunca aparece na luta errada. */
function novoPosLuta(n){
  const w=el("div","pos-luta");w.dataset.luta=String(n);
  const box=document.getElementById("posluta");
  if(box)box.appendChild(w);
  posLutaAtual=w;
  return w;
}
function arquivarPosLuta(){
  const box=document.getElementById("posluta"),bouts=document.getElementById("bouts");
  if(!box||!bouts)return;
  [...box.children].forEach(c=>bouts.appendChild(c));
  box.innerHTML="";
  posLutaAtual=null;
}
/* Resultado: carimbo gigante, método e (logo depois da luta) bolsa,
   seguidores e posição contando até o valor. Retomada de um dilema
   aberto mostra só o carimbo, a partir de st.registro. */
function mostrarResultado(reg,extra){
  const box=document.getElementById("resultado");
  if(!box||!reg)return;
  const num=(fmt,rot,ico,valor,txt)=>`<div class="res-num"><span class="res-rot">${ICONE(ico)}${rot}</span><b data-conta="${valor}" data-fmt="${fmt}">${txt}</b></div>`;
  const nums=extra?`<div class="res-nums">
      ${num("dinheiro","Bolsa","carteira",reg.renda,`+R$ ${fmtNum(reg.renda)}`)}
      ${num("seg","Seguidores","seguidores",extra.delta,`${extra.delta>=0?"+":"-"}${fmtNum(Math.abs(extra.delta))}`)}
      ${extra.rk?`<div class="res-num"><span class="res-rot">${ICONE("grafico")}Posição</span><b>#${extra.rk.n}</b>${
        extra.mov?`<span class="pos-mov ${extra.mov>0?"sobe":"cai"}">${ICONE(extra.mov>0?"sobe":"desce")}${Math.abs(extra.mov)}</span>`:""}</div>`:""}
    </div>`:"";
  box.innerHTML=`<div class="res-carimbo${reg.venceu?"":" d"}">${reg.venceu?"Vitória":"Derrota"}</div>
    <div class="res-como"><b>${reg.metodo}</b> · round ${reg.round} · ${reg.relogio}${reg.cartoes?" · "+reg.cartoes:""}</div>
    <div class="res-contra">contra ${reg.adv}${reg.titulo?` <span class="placar-cint">${ICONE("coroa")}Cinturão</span>`:""}</div>
    ${nums}`;
  mostrarNoite("resultado",reg.venceu?"confete":"apagado");
  contarNumeros(box);
}
function contarNumeros(box){
  if(reduceMotion()||!box.querySelectorAll||typeof requestAnimationFrame!=="function")return;
  box.querySelectorAll("[data-conta]").forEach(b=>{
    const alvo=+b.dataset.conta,fmt=b.dataset.fmt,t0=performance.now(),dur=900;
    const txt=v=>fmt==="dinheiro"?`+R$ ${fmtNum(v)}`:`${alvo>=0?"+":"-"}${fmtNum(Math.abs(v))}`;
    const passo=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
      b.textContent=txt(Math.round(alvo*e));if(k<1)requestAnimationFrame(passo);};
    requestAnimationFrame(passo);
  });
}

function mostrarNoite(etapa,fundo){
  const n=document.getElementById("noite");
  if(!n)return;
  const i=Math.max(0,ETAPAS_NOITE.findIndex(e=>e.id===etapa));
  const e=ETAPAS_NOITE[i];
  const mudou=noiteEtapa!==e.id;
  noiteEtapa=e.id;
  n.hidden=false;
  n.className="noite etapa-"+e.id;
  document.documentElement.dataset.noite="1";
  const img=fundo||e.fundo;
  const f=document.getElementById("noiteFundo");
  if(f&&(mudou||fundo)){
    if(f.parentNode){const novo=fundoTela(img);novo.id="noiteFundo";f.parentNode.replaceChild(novo,f);}
    else f.style.cssText=`--img:url(img/${img}.webp);--img-m:url(img/${img}-m.webp)`;
  }
  const et=document.getElementById("noiteEtapas");
  const atual=e.id==="entrada"?"luta":e.id;
  const pos=ETAPAS_NOITE.findIndex(x=>x.id===atual);
  if(et)et.innerHTML=ETAPAS_NOITE.filter(x=>x.id!=="entrada").map(x=>{
    const j=ETAPAS_NOITE.findIndex(y=>y.id===x.id);
    return `<span class="noite-etapa${x.id===atual?" on":j<pos?" feita":""}">${x.rot}</span>`;}).join("");

  if(v)v.hidden=!antes;

  if(l)l.innerHTML=`Luta <b>${Math.min(TOTAL_FIGHTS,antes?fightNo+1:fightNo)}</b> de ${TOTAL_FIGHTS}`;

   elemento é recriado pra animação de entrada rodar de novo) e o
   conteúdo que depende do estado é desenhado na hora. */
function abrirAbaHub(id){
  const a=ABAS_HUB.find(x=>x.id===id)||ABAS_HUB[0];
  abaHub=a.id;
  ABAS_HUB.forEach(x=>{
    const s=document.getElementById("aba_"+x.id);if(s)s.hidden=x.id!==a.id;
    const g=document.getElementById("guia_"+x.id);
    if(g)g.className="guia-hub"+(ABAS_NA_FOLHA.includes(x.id)?" guia-folha":"")+(x.id===a.id?" on":"");
  });
  const mais=document.getElementById("guiaMais");
  if(mais)mais.className="guia-hub guia-mais"+(ABAS_NA_FOLHA.includes(a.id)?" on":"");
  const folha=document.getElementById("hubFolha");if(folha)folha.hidden=true;
  const velho=document.getElementById("hubFundo");
  if(velho&&velho.parentNode){
    const novo=fundoTela(a.fundo);novo.id="hubFundo";
    velho.parentNode.replaceChild(novo,velho);
  }else if(velho)velho.style.cssText=`--img:url(img/${a.fundo}.webp);--img-m:url(img/${a.fundo}-m.webp)`;
  if(a.id==="loja")abrirPainelTreinador();
  else if(a.id==="cards")abrirPainelMomentos();
  else if(a.id==="conquistas")abrirPainelConquistas();
  else if(a.id==="lutador")renderFicha();
  else if(a.id==="midia")renderMidia();
  rolarTopo();
}

   quatro lugares e um deles esquecia o automático. */
function atualizarControles(){
  const next=document.getElementById("next");
  const ab=document.getElementById("autob");
  const ctrl=document.getElementById("controls");
  const cont=document.getElementById("counter");
  if(!next||!ab)return;
  atualizarEstadoCarreira();
  const fim=fightNo>=TOTAL_FIGHTS;
  next.disabled=dilemaAberto||escolhaAberta||entrevistaAberta||playing||auto||fim;
  ab.disabled=dilemaAberto||entrevistaAberta||fim;
  if(ctrl)ctrl.classList.toggle("travado",dilemaAberto||escolhaAberta||entrevistaAberta);
  if(cont&&dilemaAberto)cont.textContent="responda para continuar";
  else if(cont&&escolhaAberta)cont.textContent="escolha o adversário";
  else if(cont&&entrevistaAberta)cont.textContent="leia a entrevista pra continuar";
  else if(cont)cont.textContent=`${fightNo} de ${TOTAL_FIGHTS} · ${st.wins}-${st.losses}`;
  const cb=document.getElementById("badge_cards");
  if(cb){const n=(st.momentos||[]).length;cb.textContent=n?String(n):"";}
  atualizarBadgeConquistas();
  const vn=document.getElementById("voltarNoite");
  if(vn)vn.hidden=!(escolhaAberta&&!noiteEtapa);
  next.hidden=!!(escolhaAberta&&!noiteEtapa);
  const naut=document.getElementById("noiteAuto");
  if(naut){naut.textContent=auto?"Parar automático":"Modo automático";naut.disabled=ab.disabled;}
  const livre=!playing&&!dilemaAberto&&!entrevistaAberta&&!escolhaAberta&&!auto;
  const posLuta=noiteEtapa==="luta"||noiteEtapa==="resultado";
  const np=document.getElementById("noiteProxima");if(np)np.hidden=!(posLuta&&livre&&!fim);
  const nh=document.getElementById("noiteHub");if(nh)nh.hidden=!(posLuta&&livre);
  const ne=document.getElementById("noiteEncerrar");if(ne)ne.hidden=!(posLuta&&livre&&fim);

function pickOpponent(){
  const center=Math.floor(st.standing*(LADDER.length-1));
  const spread=Math.max(8,Math.floor(LADDER.length*.06));
  const lo=Math.max(0,center-spread),hi=Math.min(LADDER.length-1,center+spread);
  for(let t=0;t<40;t++){
    const c=LADDER[lo+Math.floor(rng()*(hi-lo+1))];
    if(!fought.has(c.name)){fought.add(c.name);return c;}
  }
  return LADDER[lo+Math.floor(rng()*(hi-lo+1))];
}
function nextFight(){
  if(fightNo>=TOTAL_FIGHTS||playing||dilemaAberto||escolhaAberta||entrevistaAberta)return;
  arquivarPosLuta();
  /* Único lugar que decide "é luta de título?" pra esta luta. Uma vez por
     luta, aqui, antes de existir tela ou pick automático — candidatos() e
     lutar() só leem st.tituloEstaLuta depois disso. */
  st.tituloEstaLuta=tituloLiberado();
  /* Cinturão interino: só é sorteado no momento em que uma disputa pelo
     cinturão de VERDADE é concedida a quem ainda não é campeão de nada —
     reset todo fight pra não carregar um sorteio de uma disputa antiga
     (mesmo raciocínio de st.tituloEstaLuta acima). Enquanto já se é
     campeão (interino ou de verdade), tituloLiberado() devolve true
     incondicionalmente e este bloco não roda — quem já tem cinturão não
     rola disponibilidade de novo, só defende/unifica. */
  st.tituloInterinoLuta=false;
  if(st.tituloEstaLuta&&!st.title&&holdRng()<CHANCE_CINTURAO_INTERINO)
    st.tituloInterinoLuta=true;
  if(auto){                                  // no automático a máquina escolhe o meio
    const opts=candidatos();
    /* opts tem 3 cartas normalmente, mas 1 só em luta de título/defesa
       (oponente travado em RANKING) — min(1,length-1) pega "o do meio" nas
       três e a única carta quando só existe uma, sem consumir rng extra. */
    lutar(opts[Math.min(1,opts.length-1)],CAMPS[Math.floor(rng()*CAMPS.length)]);
    return;
  }
  escolhaAberta=true;atualizarControles();
  telaAdversario();
}
