<script>
/* =========================================================================
   MOTOR — mesma lógica de fightsim.js, calibrada em 6.000 lutas
   ========================================================================= */
const TUNING={tickSeconds:15,roundSeconds:300,
  koPower:{flyweight:.55,bantamweight:.65,featherweight:.80,lightweight:.95,
    welterweight:1.05,middleweight:1.20,light_heavyweight:1.40,heavyweight:1.75,
    w_strawweight:.45,w_flyweight:.50,w_bantamweight:.60,w_featherweight:.65},
  reachPerInch:.012,reachCap:.10,gnpVolume:.65,gnpAccuracy:.80,
  kdBase:.045,finishGivenKd:.58,subBase:1.4,standUpBase:.08,contestTemp:.55,leagueStrDef:.60,formSpread:.22};

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
function mulberry32(seed){let a=seed>>>0;const g=function(){a|=0;a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296;};
  /* save (revamp fase 3): o estado inteiro do gerador é o `a`. Ler e
     restaurar não consome nada, a sequência continua idêntica (provado
     em node testar.js save contra valores gravados antes da mudança). */
  g.estado=()=>a|0; g.restaurar=v=>{a=v|0;};
  return g;}
function contest(attack,defense){const a=clamp(attack,.02,.98),d=clamp(defense,.02,.98);
  const k=TUNING.contestTemp,n=Math.pow(a*(1-d),k);
  return n/(n+Math.pow((1-a)*d,k));}
function poisson(l,rng){if(l<=0)return 0;const L=Math.exp(-l);let k=0,p=1;
  do{k++;p*=rng();}while(p>L);return k-1;}
function fmtClock(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
/* inverso do fmtClock — precisa pro card de momento saber se um nocaute no
   round 1 foi rápido: r.clock é o relógio REGRESSIVO (começa "5:00", desce),
   então "rápido" é clock ALTO, não baixo — o oposto do que a leitura de
   transmissão real sugere. Ver LEIA-ME "Card de momento". */
function clockSeconds(s){const[m,ss]=s.split(":").map(Number);return m*60+ss;}

/* mAttr: um multiplicador por eixo treinável (ATTR_TREINAVEIS), todos
   neutros (1) até a escolha na luta escrever no eixo específico da ação
   escolhida — ver abrirEscolhaLuta()/lutar() e o comentário em cima de
   K_ESCOLHA_LUTA. Substitui o antigo A.form*=mod (mecanismo v1): aquele
   lia .form em TRÊS pontos do motor ao mesmo tempo (acurácia, volume E
   queda), então qualquer ação vazava pros três, inclusive nocaute, e só
   K alto rendia gap perceptível — K alto estourava o KO. Com um slot por
   eixo, uma ação de queda só toca queda; .form continua existindo, mas
   agora é só a variação natural pré-luta (form()), nunca escrito pela
   escolha. */
function mkState(f,form){return{ref:f,form,damage:0,sigStrikes:0,takedowns:0,knockdowns:0,
  subAttempts:0,controlTicks:0,
  mAttr:{slpm:1,strDef:1,tdAvg:1,tdDef:1,subAvg:1,kdAvg:1,durability:1}};}

function exchange(att,def,rng,opts={}){
  const A=att.ref,D=def.ref,minutes=TUNING.tickSeconds/60;
  const reachEdge=clamp(((A.reach??72)-(D.reach??72))*TUNING.reachPerInch,-TUNING.reachCap,TUNING.reachCap);
  const baseAcc=opts.ground?TUNING.gnpAccuracy:A.strAcc;
  const baseDef=(opts.ground?D.strDef*.45:D.strDef)*def.mAttr.strDef;
  const effAcc=clamp(contest((baseAcc+reachEdge)*att.form,baseDef*def.form),.05,.95);
  const refAcc=clamp(contest(baseAcc,TUNING.leagueStrDef),.05,.95);
  let lambda=A.slpm*minutes*(effAcc/refAcc)*att.form*att.mAttr.slpm;
  if(opts.ground)lambda*=TUNING.gnpVolume;
  lambda*=clamp(1-att.damage/220,.45,1);
  const landed=poisson(lambda,rng);
  att.sigStrikes+=landed;
  const power=TUNING.koPower[A.division]??1;
  def.damage+=landed*power*(opts.ground?1.25:1)*2.15/(D.durability??1);
  return landed;
}
/* devolve "" | "kd" | "ko". A rolagem decide QUEDA; só depois decide se a queda
   vira nocaute. kdBase = koBase antigo / finishGivenKd, preservando a taxa de KO. */
function impact(att,def,landed,rng){
  if(!landed)return"";
  const power=TUNING.koPower[att.ref.division]??1;
  const punch=clamp((att.ref.kdAvg??.36)/.36,.45,2.4)*att.mAttr.kdAvg;
  /* durability é INVERSO — divide, nunca multiplica: mAttr.durability>1
     (escolha casou) tem que dar p MENOR (mais resistente), igual o
     durability real do lutador já faz. Multiplicar aqui inverteria o
     sentido e a ação de queixo que "casa" passaria a fragilizar. */
  const p=TUNING.kdBase*power*punch*landed*
    Math.pow(clamp(def.damage/100,0,2.5),1.6)/(def.ref.durability??1)/def.mAttr.durability;
  if(rng()>=clamp(p,0,.9))return"";
  def.knockdowns=(def.knockdowns||0)+1;
  return rng()<TUNING.finishGivenKd?"ko":"kd";
}
/* Extraído de simulateFight() pra abrir uma fronteira real de round — item
   1 do desenho de escolha na luta (PENDENCIAS/conversa), fase 1: SÓ a
   refatoração, nenhuma escolha ainda. Comportamento tem que ficar
   bit-a-bit idêntico — mesma ordem de rng(), mesmos pushes no log, mesmo
   texto. `scores` é objeto (não par de primitivos) porque JS não passa
   número por referência; sem isso o placar do round não voltaria pro
   chamador. Retorna o resultado de fin() se a luta acabou NESTE round
   (KO/finalização), ou `null` se o round terminou normal e a luta segue —
   esse `null` é exatamente o ponto onde uma pausa pra escolha entraria
   depois, sem mexer em mais nada aqui. */
function simularRound(A,B,round,rng,push,fin,scores){
  const tpr=TUNING.roundSeconds/TUNING.tickSeconds;
  const snap={a:A.sigStrikes,at:A.takedowns,ac:A.controlTicks,
              b:B.sigStrikes,bt:B.takedowns,bc:B.controlTicks};
  let pos="STANDING",burst={a:0,b:0},since=0;
  push(round,"5:00","rd",`Round ${round}`);

  for(let t=0;t<tpr;t++){
    const clock=fmtClock(TUNING.roundSeconds-t*TUNING.tickSeconds);
    if(pos==="STANDING"){
      for(const[att,def,tag]of[[A,B,"A"],[B,A,"B"]]){
        const rate=(att.ref.tdAvg/clamp(att.ref.tdAcc,.1,1))/(900/TUNING.tickSeconds)*att.mAttr.tdAvg;
        if(rng()<rate){
          if(rng()<contest(att.ref.tdAcc*att.form,def.ref.tdDef*def.form*def.mAttr.tdDef)){
            att.takedowns++;pos=tag==="A"?"GROUND_A":"GROUND_B";
            push(round,clock,"big",`Queda de ${att.ref.name}. Levou pro chão.`);
          }else push(round,clock,"",`${def.ref.name} defendeu a queda e voltou pra distância.`);
          break;
        }
      }
    }
    if(pos==="STANDING"){
      const la=exchange(A,B,rng),lb=exchange(B,A,rng);
      burst.a+=la;burst.b+=lb;since++;
      const ia=impact(A,B,la,rng);
      if(ia==="ko")return fin(A,B,round,clock,"Nocaute");
      if(ia==="kd")push(round,clock,"kd",`${B.ref.name} foi ao chão! Levantou cambaleando.`);
      const ib=impact(B,A,lb,rng);
      if(ib==="ko")return fin(B,A,round,clock,"Nocaute");
      if(ib==="kd")push(round,clock,"kd",`${A.ref.name} foi ao chão! Levantou cambaleando.`);
      if(since>=4){
        if(burst.a+burst.b===0)push(round,clock,"",`Round estudado. Ninguém quer se abrir.`);
        else if(burst.a>burst.b)push(round,clock,"",`${A.ref.name} acerta mais na troca, ${burst.a} a ${burst.b}.`);
        else if(burst.b>burst.a)push(round,clock,"",`${B.ref.name} acerta mais na troca, ${burst.b} a ${burst.a}.`);
        else push(round,clock,"",`Troca parelha, ${burst.a} a ${burst.b}.`);
        burst={a:0,b:0};since=0;
      }
    }else{
      const top=pos==="GROUND_A"?A:B,bot=pos==="GROUND_A"?B:A;
      top.controlTicks++;
      const landed=exchange(top,bot,rng,{ground:true});
      const im=impact(top,bot,landed,rng);
      if(im==="ko")return fin(top,bot,round,clock,"Nocaute técnico no chão");
      if(landed>=3)push(round,clock,"big",`${top.ref.name} martelando por cima. ${bot.ref.name} só protege.`);
      else if(top.controlTicks%3===0)push(round,clock,"",`${top.ref.name} controla a posição.`);
      for(const[g,opp,mult]of[[top,bot,1.4],[bot,top,1.0]]){
        const rate=(g.ref.subAvg/(900/TUNING.tickSeconds))*mult*g.mAttr.subAvg;
        if(rng()<rate){
          g.subAttempts++;
          const p=contest(TUNING.subBase*clamp(g.ref.subAvg/2.5,.15,.9),opp.ref.tdDef);
          if(rng()<p*3.6)return fin(g,opp,round,clock,"Finalização");
          push(round,clock,"big",`${g.ref.name} tenta a finalização! ${opp.ref.name} escapa.`);
        }
      }
      if(rng()<TUNING.standUpBase*(.5+bot.ref.tdDef)){
        pos="STANDING";push(round,clock,"",`${bot.ref.name} conseguiu levantar.`);
      }
    }
  }
  const pa=(A.sigStrikes-snap.a)+(A.takedowns-snap.at)*6+(A.controlTicks-snap.ac)*.7;
  const pb=(B.sigStrikes-snap.b)+(B.takedowns-snap.bt)*6+(B.controlTicks-snap.bc)*.7;
  if(pa>pb){scores.sa+=10;scores.sb+=9;push(round,"0:00","rd",`Fim do round ${round}. ${A.ref.name} levou.`);}
  else if(pb>pa){scores.sb+=10;scores.sa+=9;push(round,"0:00","rd",`Fim do round ${round}. ${B.ref.name} levou.`);}
  else{scores.sa+=10;scores.sb+=10;push(round,"0:00","rd",`Fim do round ${round}. Round dividido.`);}
  A.damage*=.88;B.damage*=.88;
  return null;
}

function simulateFight(fa,fb,{seed=1,rounds=3}={}){
  const rng=mulberry32(seed);
  const form=()=>1+(rng()+rng()+rng()-1.5)/1.5*TUNING.formSpread;
  const A=mkState(fa,form()),B=mkState(fb,form());
  const log=[];
  const push=(round,clock,kind,text)=>log.push({round,clock,kind,text});
  const kds=()=>({[A.ref.name]:A.knockdowns,[B.ref.name]:B.knockdowns});
  const fin=(w,l,round,clock,m)=>{
    push(round,clock,"fin",`${w.ref.name} vence por ${m.toLowerCase()}`);
    return{winner:w.ref.name,loser:l.ref.name,method:m,round,clock,cards:null,log,knockdowns:kds()};};

  const scores={sa:0,sb:0};
  for(let round=1;round<=rounds;round++){
    const resultado=simularRound(A,B,round,rng,push,fin,scores);
    if(resultado)return resultado;
  }
  const w=scores.sa>scores.sb?A:scores.sb>scores.sa?B:(rng()<.5?A:B),l=w===A?B:A;
  log.push({round:rounds,clock:"0:00",kind:"fin",
    text:`Vai pros cartões. ${w.ref.name} vence por decisão, ${Math.max(scores.sa,scores.sb)}-${Math.min(scores.sa,scores.sb)}.`});
  return{winner:w.ref.name,loser:l.ref.name,method:"Decisão",round:rounds,clock:"0:00",
    cards:scores.sa+"-"+scores.sb,log,knockdowns:kds()};
}

/* =========================================================================
   DRAFT — pares e pesos medidos (correlação e sensibilidade)
   ========================================================================= */
/* Medidos por ferramentas/sensibilidade.js contra ESTE motor.
   Rode a ferramenta de novo sempre que mexer no TUNING — se o motor muda,
   os pesos mudam junto e o draft passa a cobrar errado. */
const WEIGHTS={slpm:1.00,subAvg:.63,tdAvg:.63,kdAvg:.48,tdDef:.48,strDef:.42,durability:.31,reach:.28};
const RIDERS={slpm:["strAcc"],tdAvg:["tdAcc"],strDef:["sapm"]};
const PAIRS=[
 {id:"trocacao",label:"Trocação",
  a:{key:"slpm",label:"Volume",fmt:v=>v.toFixed(2)+"/min"},
  b:{key:"reach",label:"Envergadura",fmt:v=>v.toFixed(0)+'"'}},
 {id:"poder",label:"Pancada",
  a:{key:"kdAvg",label:"Poder",fmt:v=>v.toFixed(2)+"/15min"},
  b:{key:"durability",label:"Queixo",fmt:v=>v.toFixed(2)}},
 {id:"chao",label:"Luta agarrada",
  a:{key:"tdAvg",label:"Quedas",fmt:v=>v.toFixed(2)+"/15min"},
  b:{key:"tdDef",label:"Defesa de queda",fmt:v=>(v*100).toFixed(0)+"%"}},
 {id:"jiujitsu",label:"Jiu-jitsu",
  a:{key:"subAvg",label:"Finalizações",fmt:v=>v.toFixed(2)+"/15min"},
  b:{key:"strDef",label:"Defesa de golpes",fmt:v=>(v*100).toFixed(0)+"%"}},
];
const TOTAL_WEIGHT=Object.values(WEIGHTS).reduce((a,b)=>a+b,0);
/* Balanço 2026-09-28 (era .76): jogadores venciam quase tudo. Medido em
   50 carreiras por perfil (node testar.js balanco): com .76 o lutador
   draftado já nascia melhor que 84% da divisão e vencia 17 de 22 lutas,
   com cinturão em 46 a 66% das carreiras. Com .35 ele nasce perto do
   meio da divisão; junto com o teto de treino e a escada de adversários
   (candidatos()), quem joga bem vence ~11 de 22. Ver LEIA-ME "Balanço". */
const BUDGET_PCT=.35;

function makePercentiler(pool){
  const s={};Object.keys(WEIGHTS).forEach(k=>s[k]=pool.map(f=>f[k]).sort((x,y)=>x-y));
  return(key,value)=>{const arr=s[key];let lo=0,hi=arr.length;
    while(lo<hi){const m=(lo+hi)>>1;arr[m]<value?lo=m+1:hi=m;}return lo/arr.length;};
}
const cost=(pair,src,pct)=>WEIGHTS[pair.a.key]*pct(pair.a.key,src[pair.a.key])
                          +WEIGHTS[pair.b.key]*pct(pair.b.key,src[pair.b.key]);

/* Correção da dívida da iteração 3: se os dois candidatos de um par saírem
   zerados, a linha vira decisão morta. ~25% das rolagens caíam nisso. */
function rollTable(pool,remaining,rng,pct){
  const rows=[];
  for(const pair of remaining){
    let cand=[];
    for(let tries=0;tries<12;tries++){
      cand=[pool[Math.floor(rng()*pool.length)],pool[Math.floor(rng()*pool.length)]];
      if(cand.some(s=>s[pair.a.key]>0))break;
    }
    cand.forEach(src=>rows.push({pair,src,cost:cost(pair,src,pct)}));
  }
  return rows;
}

/* =========================================================================
   AVALIAÇÃO — rating sai do próprio motor, contra um oponente mediano
   ========================================================================= */
function rateAll(roster){
  const byDiv={};roster.forEach(f=>(byDiv[f.division]??=[]).push(f));
  for(const div in byDiv){
    const pool=byDiv[div];
    const med=k=>{const v=pool.map(f=>f[k]).sort((a,b)=>a-b);return v[Math.floor(v.length/2)];};
    const ref={name:"__med__",division:div};
    ["slpm","strAcc","strDef","kdAvg","tdAvg","tdAcc","tdDef","subAvg","durability","reach","sapm"]
      .forEach(k=>ref[k]=med(k));
    for(const f of pool){let w=0;
      for(let s=1;s<=18;s++)if(simulateFight(f,ref,{seed:s*31+7}).winner===f.name)w++;
      f.rating=w/18;}
  }
  return roster;
}

/* =========================================================================
   EVENTOS DE VIDA — o pool fixo de 28 frases (repetia entre carreiras,
   sempre as mesmas) saiu do caminho principal: a IA gera um evento por
   luta agora (ver dispararEventoIA(), "evento" em api/ai.js). RARE
   (abaixo) continua local — são calibrados à mão pra disparar fora da
   curva, texto e efeito exatos importam pro card de momento/conquistas,
   não é o tipo de coisa que se pede pra IA variar.
   ========================================================================= */
/* RAROS EXTREMOS — só disparam fora da curva, uma vez cada */
/* id em 4 entradas: referência estável pro card de momento (ver
   criarMomentoRaro() e o gatilho de cinturão perdido em finishFight()),
   sem depender de índice do array nem duplicar o texto. card:true marca as
   3 que viram card de momento — deliberadamente NÃO é "tom==1": streakW>=8
   ficou de fora por medição (62 de 119 raros positivos em 120 carreiras,
   mais da metade sozinho — ver LEIA-ME "Card de momento"), e continua só no
   relatório final. */
const RARE=[
 {id:"invicto18",card:true,tom:1,when:s=>s.fightNo>=18&&s.losses===0,
  t:n=>`Dezoito e zero. Nas casas de aposta, quem aposta contra ${n} recebe dez vezes o valor.`},
 {id:"invicto12",card:true,tom:1,when:s=>s.fightNo>=12&&s.losses===0,
  t:n=>`Doze lutas, doze vitórias. Já tem comentarista dizendo que a divisão está fraca pra explicar o cartel de ${n}.`},
 {tom:-1,when:s=>s.fightNo>=10&&s.wins===0,
  t:n=>`Dez derrotas em dez lutas. A comissão convocou ${n} pra uma conversa sobre continuar competindo.`},
 {tom:1,when:s=>s.streakW>=8,
  t:n=>`Oito vitórias seguidas. ${n} entra como favorito contra qualquer nome da divisão.`},
 {tom:-1,when:s=>s.streakL>=5,
  t:n=>`Cinco derrotas em sequência. O ginásio esvaziou antes da luta de ${n} terminar.`},
 {tom:-1,when:s=>s.koLosses>=4,
  t:n=>`Quarto nocaute sofrido. O médico da comissão pediu tomografia e perguntou a ${n} se já pensou em parar.`},
 {id:"finishStreak",card:true,tom:1,when:s=>s.fightNo>=8&&s.wins>=6&&s.finishes===s.wins,
  t:n=>`${n} nunca precisou dos juízes. Todas as vitórias terminaram antes do gongo final.`},
 {when:s=>s.fightNo>=14&&s.wins>=7&&s.finishes===0,
  t:n=>`Todas as vitórias de ${n} foram por decisão dos juízes, e a torcida já reclama da falta de finalização.`},
 {id:"lostBeltFast",tom:-1,when:s=>s.lostBeltFast,

/* LEGADO — a frase de fecho. O primeiro que casar vence, então a ordem importa. */
const LEGACY=[
 /* Aposentadoria voluntária (item novo) pode zerar fightNo antes de
    qualquer outra regra fazer sentido — sem isto, wins===0&&losses===0
    caía direto na regra de baixo ("saiu invicto e sem cinturão"), que
    pressupõe uma sequência invicta de verdade. Frase própria, honesta:
    não inventa carreira que não existiu. */
 {when:s=>s.wins===0&&s.losses===0,
  t:n=>`${n} pendurou as luvas antes da primeira luta. Não há cartel pra julgar.`},
 {when:s=>s.losses===0&&s.title,
  t:n=>`${n} se aposentou invicto e campeão: ${st.wins} vitórias, nenhuma derrota.`},

  t:n=>`${n} se aposentou com cartel de ${st.wins}-0 e nunca disputou o cinturão.`},
 {when:s=>s.wins===0,
  /* Era "Vinte e duas lutas, vinte e duas derrotas" cravado — só batia
     certo pra quem perdia as 22 e nunca se aposentava mais cedo. wins===0
     sempre implica losses===fightNo (perdeu todas as que lutou), então o
     número de verdade é st.fightNo, não a constante da carreira inteira. */
  t:n=>`${st.fightNo} lutas, ${st.fightNo} derrotas. O compilado das derrotas de ${n} no YouTube passou de quatro milhões de views.`},
 {when:s=>s.title&&s.peak>=.98,

 {when:s=>s.foiCampeao,

 {when:s=>s.peak>=.9,

 {when:s=>s.wins>s.losses,

 {when:s=>s.wins>=6,

 {when:()=>true,

];

/* =========================================================================
   CARD DE MOMENTO — congela um instante NO MEIO da carreira, não só no fim.
   Mesma voz do RARE/LEGACY: seca, específica, sem adjetivo de comentarista.
   st.momentos acumula silencioso (mesmo padrão de st.rares/st.events); nada

function criarMomento(tipo,frase,opp,r){
  /* 3 linhas fixas, sempre as mesmas 3 — adversário, resultado, posição na
     divisão. Capturadas AQUI (no instante do gatilho), não no desenho:
     por quando o jogador abrir o card, standing já andou. */
  const pos=posicaoDivisao();
  return{tipo,frase,cartel:`${st.wins}-${st.losses}`,luta:fightNo,
    adversario:opp?opp.name:null,
    resultado:r?`${r.method} · round ${r.round} ${r.clock}`:null,
    posicao:pos?`#${pos.n} de ${pos.de}`:null};
}
const FRASE_KO_RAPIDO=n=>`${n} não deixou o locutor terminar de apresentar o adversário.`;
const FRASE_PRIMEIRO_CINTURAO=n=>`${n} levantou o cinturão e não soltou pra nenhuma foto.`;
/* Interino é anunciado como incompleto de propósito — nomeia quem está
   faltando enfrentar, não só "ganhou um cinturão". */
const FRASE_CINTURAO_INTERINO=(n,campeao)=>`${n} é o novo campeão interino. ${campeao} continua campeão, e a próxima luta é a unificação.`;

const FRASE_UPSET=(n,opp)=>`Quem apostou em ${n} contra ${opp} multiplicou o dinheiro.`;
/* "Desbancar o nº1" é a posição na TABELA INTEIRA (posicaoDivisao(), a

   (campeão+15, ver "Campeão nomeado" no LEIA-ME) — de propósito, pra não

/* Duas frases, não uma — achado jogando em produção: o gatilho disparava
   pra QUALQUER st.lesao ativo, nocaute incluso, e "entrou mancando" narra
   uma escolha corajosa (aceitar lutar machucado) que não existe quando a
   lesão veio de apanhar. origem:"dilema" pega a decisão de verdade;

function raridadeDeTaxa(pct){
  if(pct>60)return "Comum";

/* Reaproveita o componente .badge já existente (4 variantes de
   SIGNIFICADO, não de cor à toa — ver comentário original do .badge)
   em vez de inventar cor nova pra raridade: dourado já é "prestígio/
   conquista rara" no resto do jogo, perigo(--stamp) já é "atenção",
   positivo já é "bom mas comum" — o mapeamento não é decoração, é o
   mesmo vocabulário de cor que a ficha inteira já fala. */
const RARIDADE_BADGE={"Comum":"neutral","Incomum":"win","Raro":"danger","Lendário":"gold"};

/* localStorage guarda só os ids desbloqueados, nunca o estado da carreira —
   mesmo princípio de mudo/vol_musica/rosto: try/catch, sem IA nem conta,
   sem derrubar a carreira se o navegador bloquear. */
let CONQUISTAS_DESBLOQUEADAS=(()=>{
  try{return new Set(JSON.parse(localStorage.getItem("conquistas")||"[]"));}
  catch(e){return new Set();}
})();
function salvarConquistas(){
  try{localStorage.setItem("conquistas",JSON.stringify([...CONQUISTAS_DESBLOQUEADAS]));}catch(e){}
}
/* Roda depois de toda luta (não só no fim) — desbloqueio acontece na hora,
   igual card de momento. Retorna as que acabaram de desbloquear NESTA
   checagem, pra quem quiser avisar o jogador sem reabrir o painel inteiro. */
function verificarConquistas(){
  const novas=[];
  for(const c of CONQUISTAS){
    if(CONQUISTAS_DESBLOQUEADAS.has(c.id))continue;
    if(c.check(st,MODO)){CONQUISTAS_DESBLOQUEADAS.add(c.id);novas.push(c);}
  }
  if(novas.length)salvarConquistas();
  return novas;
}

/* Em vez de rotular 28 eventos à mão (e errar quando alguém editar o texto),
   a direção sai do próprio efeito: aplica num clone e compara os atributos.
   Evento sem efeito é neutro. */
/* som de evento: direção do efeito, não o valor — usado tanto pro RARE
   (tom fixo, marcado à mão) quanto pro evento comum gerado pela IA (mult
   perto de 1 = neutro, mesmo limiar .008 que sempre existiu aqui). */
function tocarSom(dir){ (dir>0?SOM.bom:dir<0?SOM.ruim:SOM.evento)(); }

function sortearRaro(st,rng,rareUsed){
  const rare=RARE.filter((e,i)=>!rareUsed.has(i)&&e.when(st));
  if(rare.length&&rng()<.85){const e=rare[0];rareUsed.add(RARE.indexOf(e));return e;}
  return null;
}


/* =========================================================================
   REPERCUSSÃO — fã e seguidores saem da SIMULAÇÃO, não de texto gerado.
   A luta já sabe se teve nocaute no primeiro round, quantas quedas caíram e
   se foi zebra. Transformar isso em número é fórmula, não IA.
   ========================================================================= */
function hypeOf(r,won,opp,me_,titleFight,myKd,oppKd){
  let h=0;
  if(/ocaute/.test(r.method))h+=3.0;
  else if(r.method==="Finalização")h+=2.4;
  else h+=0.5;
  if(r.round===1&&r.method!=="Decisão")h+=1.6;
  if(r.round>=3&&r.method!=="Decisão")h+=0.8;      /* guerra longa */
  h+=myKd*1.1+oppKd*0.6;                          /* apanhar também é drama */
  if(titleFight)h+=2.2;
  /* zebra: chance real de vencer esta luta (chanceContra(), gravada em
     me.__chance antes dela); .5 - chance > .15 = vencer com menos de 35% */
  const upset=.5-(me_.__chance??.5);
  if(won&&upset>.15)h+=2.0*Math.min(1,upset*3);   /* zebra */
  h+=won?1.4:-0.8;
  return Math.max(0,h);
}
/* seguidores crescem em porcentagem, então campeão chega a milhões e
   perdedor apodrece devagar — igual à vida real */
function followerDelta(followers,hype,won,standing){
  /* multiplicado pelo standing: lutar no card principal rende muito mais
     audiência que lutar no preliminar. É o que faz seguidor separar carreira. */
  const g=(hype/6)*(won?.26:.07)*(.25+standing*1.8)-(won?0:.075);
  const floor=won?260:-90;
  return Math.round(followers*g+floor*(1+standing));
}

/* Sorteio SEM REPOSIÇÃO num pool combinado.
   O bug antigo: numa vitória por finalização o único bucket era subWin, com 3
   moldes pra 4 linhas. O laço tentava 8 vezes, desistia e repetia o comentário.
   Agora hater e meme sempre entram no pool, então nunca falta candidato. */
/* Hater pelo medidor de fã (pedido do dono, 2026-09-28): fã baixo = a
   timeline é contra você, fã alto = quase todo mundo a favor. Antes o hater
   crescia com a FAMA (seguidores). Peso por bucket, igual aos outros;
   medido (node testar.js feedfa): fã 0 → ~2/3 dos posts de hater, fã 10 →
   quase nenhum. HATERS_IA é a mesma régua em número de posts, pro prompt
   do feed da IA (api/ai.js). */
const pesoHater=fa=>0.3+14*Math.pow(1-Math.max(0,Math.min(10,fa))/10,1.5);
const HATERS_IA=fa=>fa<3?3:fa<5.5?2:fa<8?1:0;
function buildFeed(r,won,titleFight,myKd,oppKd,upset,rng,name,fa=5){
  const ko=/ocaute/.test(r.method),sub=r.method==="Finalização";
  const cand=[];
  /* peso é POR BUCKET, dividido entre os moldes dele. Sem isso o bucket com
     mais textos domina o sorteio só por ser maior — foi o que aconteceu com
     os haters, que tomaram 46% da timeline. */
  const add=(bucket,peso,hater)=>{
    const pool=TWEETS[bucket]||[];
    pool.forEach(fn=>cand.push({fn,peso:peso/pool.length,hater:!!hater}));
  };
  if(titleFight&&won)add("title",5);
  if(upset&&won)add("upset",5);
  add(won?(ko?"koWin":sub?"subWin":"decWin"):(ko?"koLoss":sub?"subLoss":"decLoss"),4);
  if(oppKd>0)add("knockdown",3);
  if(r.method==="Decisão"&&!titleFight)add("boring",3);
  add("meme",2);
  add("hater",pesoHater(fa),true);

  const out=[],usados=new Set();
  for(let i=0;i<4&&cand.length;i++){
    const total=cand.reduce((s,c)=>s+(usados.has(c.fn)?0:c.peso),0);
    if(total<=0)break;
    let alvo=rng()*total,esc=null;
    for(const c of cand){
      if(usados.has(c.fn))continue;
      alvo-=c.peso;
      if(alvo<=0){esc=c;break;}
    }
    if(!esc)break;
    usados.add(esc.fn);
    out.push({p:persona(rng),text:esc.fn(name),hater:esc.hater});
  }
  return out;
}

/* Celular: o teclado virtual cobre a metade de baixo da tela e o botão de

   rola de novo. */
function manterBotaoVisivel(campo,botao){
  const rolar=()=>{ try{ botao.scrollIntoView({block:"nearest"}); }catch(e){} };
  campo.onfocus=()=>{ rolar(); setTimeout(rolar,350); };
  const vv=typeof window!=="undefined"&&window.visualViewport;
  if(!vv||!vv.addEventListener)return;
  const aoMudar=()=>{
    if(campo.isConnected===false){ vv.removeEventListener("resize",aoMudar); return; }
    if(document.activeElement===campo)rolar();
  };
  vv.addEventListener("resize",aoMudar);
}

const SENHA_MIN=8;

/* Erros do Supabase chegam em inglês, texto cru — "User already
   registered" não é o que se mostra pra alguém criando conta. Casa por
   SUBSTRING (não código de erro — o client não recebe um código
   estável em todas as versões, o texto é o que sempre vem), nunca deixa
   o texto cru passar pro jogador. O bucket "password" cobre tanto
   "should be at least N characters" quanto uma política de força do
   painel que o client não tem como prever — mesma mensagem pros dois,
   porque não dá pra saber qual regra faltou sem o Supabase dizer. */
function traduzErroSupabase(msg){
  const m=String(msg||"").toLowerCase();
  if(m.includes("already registered")||m.includes("already exists"))
    return "Este e-mail já está cadastrado.";
  if(m.includes("invalid login credentials"))
    return "E-mail ou senha incorretos.";
  if(m.includes("email not confirmed"))
    return "Confirma seu e-mail antes de entrar. O link está na sua caixa de entrada.";
  if(m.includes("password"))
    return "Sua senha não atende aos requisitos de segurança do site. Tenta uma senha diferente.";
  if(m.includes("rate limit")||m.includes("too many requests")||m.includes("for security purposes"))
    return "Muitas tentativas seguidas. Espera um pouco antes de tentar de novo.";
  if(m.includes("invalid email")||m.includes("unable to validate email"))
    return "Esse e-mail não parece válido.";
  if(m.includes("network")||m==="failed to fetch")
    return "Falha de rede. Tenta de novo.";
  return "Não deu certo. Tenta de novo em instantes.";
}

/* E-mail+senha, não link mágico (2026-09-09) — decisão explícita: plano
   pago vem por aí, e conta precisa existir de verdade (login em outro
   aparelho sem depender de e-mail chegando), não só uma sessão que o
   link mágico concede de passagem. supabase.auth já suporta as duas
   nativamente, sem tabela nova. Confirmação de e-mail no cadastro
   continua ativa por padrão no Supabase — é ela que precisa do SMTP
   com a marca certa (ver LEIA-ME.md "Contas"), não é opcional só
   porque trocou de link mágico pra senha. */
async function criarConta(email,senha){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{data,error}=await sb.auth.signUp({email,password:senha});
    if(error)return{ok:false,erro:error.message};
    evento("criou_conta",{via:"email"});
    /* Supabase devolve sessão nula quando confirmação de e-mail está
       ligada (o normal) — cadastro funcionou, só falta confirmar. */
    return{ok:true,precisaConfirmar:!data.session};
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
async function entrarComSenha(email,senha){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error)return{ok:false,erro:error.message};
    return{ok:true};
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
/* Google resolve o atrito do cadastro (sem senha nova pra lembrar) e não
   depende de e-mail chegando — útil justamente porque o SMTP de marca
   própria ainda está pendente (ver LEIA-ME.md "Contas"). Redireciona
   pra fora e volta — precisa de OAuth client configurado no painel do
   Supabase (Authentication → Providers → Google), não só código. */
async function entrarComGoogle(){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:urlRetornoAuth()}});
    if(error)return{ok:false,erro:error.message};
    return{ok:true}; // navegador já está saindo da página aqui
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
/* Reenvia o e-mail de confirmação de cadastro — mesmo caminho do Supabase
   que criarConta() já dispara na primeira vez, chamado de novo quando o
   link caiu no spam ou expirou. `type:'signup'` é o que distingue esse
   reenvio do de recuperação de senha (enviarRecuperacaoSenha, outro
   endpoint). Rate limit do próprio Supabase é esperado se a pessoa clicar
   demais — por isso a tela trava o botão por 60s no lado do cliente
   também, pra não bater nesse limite antes mesmo de tentar. */
async function reenviarConfirmacaoEmail(email){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{error}=await sb.auth.resend({type:"signup",email});
    if(error)return{ok:false,erro:error.message};
    return{ok:true};
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
async function sairDaConta(){
  USUARIO_ID=null;SLOT_ATUAL=null;
  const sb=getSupabase();
  if(!sb)return;
  try{ await sb.auth.signOut(); }catch(e){}
}

/* "Esqueci minha senha" (2026-09-09) — com conta por senha e plano pago
   vindo, alguém esquece a senha no primeiro dia; sem isso a pessoa
   perde acesso ao que pagou. resetPasswordForEmail() manda o e-mail;
   quando a pessoa clica no link, o Supabase volta pra ESTA página com
   uma sessão de recuperação e dispara o evento "PASSWORD_RECOVERY" —
   é isso que getSupabase() escuta (abaixo) pra abrir screenNovaSenha()
   sozinho, sem precisar de rota nem parâmetro novo na URL. */
async function enviarRecuperacaoSenha(email){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:urlRetornoAuth()});
    if(error)return{ok:false,erro:error.message};
    return{ok:true};
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
async function definirNovaSenha(novaSenha){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{error}=await sb.auth.updateUser({password:novaSenha});
    if(error)return{ok:false,erro:error.message};
    return{ok:true};
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
function screenNovaSenha(){
  app.innerHTML="";
  app.appendChild(el("div","eyebrow","Nova senha"));
  const box=el("div","conta-box");
  box.appendChild(el("h4","","Escolher nova senha"));
  const inp=el("input");inp.type="password";inp.placeholder="Nova senha";inp.minLength=SENHA_MIN;
  const btn=el("button","btn btn-sm","Salvar nova senha");
  const msg=el("p","hint","");
  btn.onclick=async()=>{
    const senha=inp.value;
    if(senha.length<SENHA_MIN){msg.className="hint msg-erro";msg.textContent=`Senha precisa de pelo menos ${SENHA_MIN} caracteres.`;return;}
    btn.disabled=true;msg.className="hint";msg.textContent="Salvando…";
    const r=await definirNovaSenha(senha);
    if(r.ok){msg.className="hint msg-ok";msg.textContent="Senha atualizada. Redirecionando…";setTimeout(()=>location.reload(),1200);}
    else{msg.className="hint msg-erro";msg.textContent=traduzErroSupabase(r.erro);btn.disabled=false;}
  };
  box.append(inp,btn,msg);
  app.appendChild(box);
}

/* Formulário de login/cadastro, usado em 2 lugares (tela Conta e a caixa
   de fim de carreira) — uma função só, pra não duplicar markup nem
   lógica entre os dois. IDs fixos (não gerados por instância): as duas
   telas nunca aparecem ao mesmo tempo, mesmo padrão já usado pelos
   campos de dilema (`dilresp`/`dilgo`), reaproveitados por
   `document.getElementById()` em vez de guardar referência local. */
function montarFormularioConta(container,{modoInicial="entrar"}={}){
  // dois modos (entrar/criar) em vez de um formulário só — quem já tem
  // conta não deve ver confirmação de senha, quem está criando não
  // precisa ver "esqueci minha senha". IDs fixos: as duas telas (conta e
  // fim de carreira) nunca aparecem ao mesmo tempo, mesmo padrão de
  // dilresp/dilgo.
  let modo=modoInicial==="criar"?"criar":"entrar";
  let emailPendente=null; // e-mail aguardando confirmação — não persiste:
  // fechar a aba e voltar cai direto no formulário normal, de propósito.

  function campoSenha(rotulo,idBase,autocomplete){
    const rot=el("label","campo-rot",rotulo);
    const btnVer=el("button","","Mostrar");btnVer.type="button";btnVer.id=idBase+"-ver";
    rot.appendChild(btnVer);
    const inp=el("input");inp.type="password";inp.id=idBase;inp.placeholder=rotulo;inp.autocomplete=autocomplete;
    btnVer.onclick=()=>{
      const oculta=inp.type==="password";
      inp.type=oculta?"text":"password";
      btnVer.textContent=oculta?"Ocultar":"Mostrar";
    };
    const wrap=el("div","");wrap.append(rot,inp);
    return{wrap,inp};
  }

  /* Trava o botão de reenvio por N segundos com contagem visível — sem
     isso a pessoa clica várias vezes seguidas e esbarra no rate limit do
     Supabase antes mesmo de o primeiro reenvio ter chance de chegar. */
  function travarReenvio(btn,seg){
    let restante=seg;
    btn.disabled=true;
    btn.textContent=`Reenviar e-mail (${restante}s)`;
    const iv=setInterval(()=>{
      restante--;
      if(restante<=0){clearInterval(iv);btn.disabled=false;btn.textContent="Reenviar e-mail";}
      else btn.textContent=`Reenviar e-mail (${restante}s)`;
    },1000);
  }

  function renderConfirmacao(){
    container.innerHTML="";
    const email=emailPendente;
    container.appendChild(el("h4","","Confirme seu e-mail"));
    const p=el("p","hint","");
    p.append("Enviamos um link para ",el("b","",email),". Abra o link, volte aqui e entre com sua senha.");
    const aviso=el("p","hint","Não achou? Confere a caixa de spam.");
    const msg=el("p","hint","");
    const btnEntrar=el("button","btn","Já confirmei, entrar");
    btnEntrar.onclick=()=>{
      emailPendente=null;modo="entrar";render();
      const inp=document.getElementById("conta-email");
      if(inp)inp.value=email;
    };
    const btnReenviar=el("button","btn btn-ghost","Reenviar e-mail");
    btnReenviar.onclick=async()=>{
      btnReenviar.disabled=true;msg.className="hint";msg.textContent="Reenviando…";
      const r=await reenviarConfirmacaoEmail(email);
      if(r.ok){msg.className="hint msg-ok";msg.textContent="E-mail reenviado.";travarReenvio(btnReenviar,60);}
      else{msg.className="hint msg-erro";msg.textContent=traduzErroSupabase(r.erro);btnReenviar.disabled=false;}
    };
    container.append(p,aviso,btnEntrar,btnReenviar,msg);
  }

  function render(){
    if(emailPendente){renderConfirmacao();return;}
    container.innerHTML="";
    const msg=el("p","hint","");
    const inpEmail=el("input");inpEmail.type="email";inpEmail.placeholder="seu@email.com";inpEmail.id="conta-email";inpEmail.autocomplete="email";
    /* Rótulo visível (Fase 9): Senha já tem um (campoSenha() monta um
       <label class="campo-rot">), e-mail só tinha o placeholder — some
       assim que a pessoa digita. Mesma classe que Senha já usa, sem o
       botão Mostrar (não é senha, não faz sentido aqui). */
    const wrapEmail=el("div","");
    wrapEmail.append(el("label","campo-rot","E-mail"),inpEmail);
    const campoS=campoSenha("Senha","conta-senha",modo==="criar"?"new-password":"current-password");
    let campoC=null,regraTam=null,regraConf=null;

    function formValido(){
      if(modo==="entrar")return true;
      const s=campoS.inp.value;
      return s.length>=SENHA_MIN&&campoC.inp.value===s&&s.length>0;
    }
    function atualizaRegras(){
      const s=campoS.inp.value;
      const okTam=s.length>=SENHA_MIN;
      regraTam.className="regra-senha "+(okTam?"ok":(s.length?"falta":""));
      regraTam.innerHTML=okTam?`${ICONE("check")}<span>mínimo de ${SENHA_MIN} caracteres</span>`:
        `<span>faltam ${Math.max(0,SENHA_MIN-s.length)} caractere(s) para o mínimo de ${SENHA_MIN}</span>`;
      const c=campoC.inp.value;
      const okConf=c.length>0&&c===s;
      regraConf.className="regra-senha "+(okConf?"ok":(c.length?"falta":""));
      regraConf.innerHTML=okConf?`${ICONE("check")}<span>as senhas conferem</span>`
        :`<span>${c.length?"as senhas não conferem":"repete a senha para confirmar"}</span>`;
      btnAcao.disabled=!formValido();
    }

    const trava=v=>{
      btnAcao.disabled=v||!formValido();
      inpEmail.disabled=v;campoS.inp.disabled=v;btnGoogle.disabled=v;
      if(campoC)campoC.inp.disabled=v;
    };

    const btnAcao=el("button","btn",modo==="entrar"?"Entrar":"Criar conta");
    if(modo==="criar")btnAcao.disabled=true;
    const btnGoogle=el("button","btn btn-ghost","Entrar com Google");

    btnAcao.onclick=async()=>{
      const email=inpEmail.value.trim(),senha=campoS.inp.value;
      if(!email){msg.className="hint msg-erro";msg.textContent="Digita seu e-mail.";return;}
      if(!senha){msg.className="hint msg-erro";msg.textContent="Digita sua senha.";return;}
      if(modo==="criar"&&!formValido()){msg.className="hint msg-erro";msg.textContent="Confere as regras da senha acima.";return;}
      msg.className="hint";
      trava(true);
      if(modo==="entrar"){
        btnAcao.textContent="Entrando…";
        const r=await entrarComSenha(email,senha);
        if(r.ok)location.reload();          // sessão nova — recarrega pra sincronizar tudo
        else{msg.className="hint msg-erro";msg.textContent=traduzErroSupabase(r.erro);btnAcao.textContent="Entrar";trava(false);}
      }else{
        btnAcao.textContent="Criando conta…";
        const r=await criarConta(email,senha);
        if(!r.ok){msg.className="hint msg-erro";msg.textContent=traduzErroSupabase(r.erro);btnAcao.textContent="Criar conta";trava(false);return;}
        if(r.precisaConfirmar){emailPendente=email;render();}
        else setTimeout(()=>location.reload(),1200);
      }
    };
    btnGoogle.onclick=async()=>{
      trava(true);msg.className="hint";msg.textContent="Redirecionando…";
      const r=await entrarComGoogle();
      if(!r.ok){msg.className="hint msg-erro";msg.textContent=traduzErroSupabase(r.erro);trava(false);}
    };

    container.append(el("h4","",modo==="entrar"?"Entrar":"Criar conta"),wrapEmail,campoS.wrap);

    if(modo==="criar"){
      campoC=campoSenha("Confirmar senha","conta-senha-conf","new-password");
      regraTam=el("p","regra-senha","");
      regraConf=el("p","regra-senha","");
      campoS.inp.oninput=atualizaRegras;
      campoC.inp.oninput=atualizaRegras;
      container.append(campoC.wrap,regraTam,regraConf);
      atualizaRegras();
    }else{
      const linkEsqueci=el("a","","Esqueci minha senha");linkEsqueci.href="#";linkEsqueci.id="conta-link-esqueci";
      linkEsqueci.onclick=async e=>{
        e.preventDefault();
        const email=inpEmail.value.trim();
        if(!email){msg.className="hint msg-erro";msg.textContent="Digita seu e-mail primeiro.";return;}
        trava(true);msg.className="hint";msg.textContent="Enviando…";
        const r=await enviarRecuperacaoSenha(email);
        msg.className="hint "+(r.ok?"msg-ok":"msg-erro");
        msg.textContent=r.ok?"Link de recuperação enviado. Confira seu e-mail.":traduzErroSupabase(r.erro);
        trava(false);
      };
      container.append(linkEsqueci);
    }

    container.append(btnAcao,el("p","hint","ou"),btnGoogle,msg);

    const linkModo=el("p","conta-modo-link","");
    const link=el("a","",modo==="entrar"?"Criar conta":"Já tenho conta");link.href="#";link.id="conta-link-modo";
    link.onclick=e=>{e.preventDefault();modo=modo==="entrar"?"criar":"entrar";render();};
    linkModo.append(modo==="entrar"?"Não tem conta? ":"Já tem conta? ",link);
    container.appendChild(linkModo);

    if(modo==="criar"){
      const linkTermos=el("a","","Termos de Uso");linkTermos.href="#";linkTermos.id="conta-link-termos";
      const linkPriv=el("a","","Política de Privacidade");linkPriv.href="#";linkPriv.id="conta-link-privacidade";
      linkTermos.onclick=e=>{e.preventDefault();screenTermos();};
      linkPriv.onclick=e=>{e.preventDefault();screenPrivacidade();};
      const nota=el("p","hint termos-nota","Ao criar conta, você concorda com os ");
      nota.append(linkTermos," e a ",linkPriv,".");
      container.appendChild(nota);
    }
  }

  render();
}

      jaEhEsta?"Em uso":`Usar modelo ${modelo.nome}`);

/* Plano Pro — formulário de compra/renovação (2026-09-21, item 6;
   reaproveitado pela tela dedicada, 2026-09-22, item 2). Só roda com
   sessão ativa (assinaturas é chaveada por user_id, RLS só deixa o
   dono ler a própria linha — ver verificarPro() em api/ai.js pro
   mesmo padrão). Portão de verdade fica no servidor
   (TERMOS_PUBLICADOS em api/criar-pagamento.js, ver PENDENCIAS.md item
   "Plano Pro") — este botão SEMPRE tenta a chamada real; se o servidor
   ainda não estiver publicado, a resposta 503 vira a mensagem inline,
   sem esconder nada nem fingir estado que o cliente não pode saber de
   antemão. */
/* Pagamento em outra aba e conferência na volta (2026-09-28): pagamento
   real de teste ficou sem Pro porque só o webhook da Asaas ativava. O
   webhook continua sendo o caminho normal; quem volta pro jogo confere
   direto na Asaas (api/confirmar-pagamento.js), que ativa na hora e nunca
   duas vezes pelo mesmo pagamento. A marca de pagamento pendente (72 h)
   faz o jogo conferir sozinho ao voltar pra aba e ao abrir o jogo. */
const CHAVE_PAG_PENDENTE="pagamentoPendente";
function marcarPagamentoPendente(){ try{ localStorage.setItem(CHAVE_PAG_PENDENTE,String(Date.now())); }catch(e){} }
function pagamentoPendente(){ try{ const t=Number(localStorage.getItem(CHAVE_PAG_PENDENTE)); return !!t&&Date.now()-t<72*3600e3; }catch(e){ return false; } }
function limparPagamentoPendente(){ try{ localStorage.removeItem(CHAVE_PAG_PENDENTE); }catch(e){} }
let conferindoPagamento=null;
function conferirPagamento(){
  if(conferindoPagamento)return conferindoPagamento;
  conferindoPagamento=(async()=>{
    const token=await meuAccessToken();
    if(!token)return null;
    try{
      const r=await fetch("/api/confirmar-pagamento",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});
      const j=await r.json().catch(()=>null);
      if(!r.ok||!j)return null;
      if(j.pro){ meuPro=true; limparPagamentoPendente(); }
      return j;
    }catch(e){ return null; }
  })();
  conferindoPagamento.then(()=>{ conferindoPagamento=null; },()=>{ conferindoPagamento=null; });
  return conferindoPagamento;
}
/* Voltou pra aba do jogo com pagamento pendente: confere; se liberou e a
   tela do Plano Pro está aberta, redesenha. Um ouvinte só, pro jogo todo. */
let redesenharPlanoPro=null;
try{
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState!=="visible"||!pagamentoPendente())return;
    conferirPagamento().then(j=>{ if(j&&j.pro&&redesenharPlanoPro)redesenharPlanoPro(); });
  });
}catch(e){}
async function renderPlanoPro(container,session,{conferido=false}={}){
  const box=el("div","conta-pro");
  container.appendChild(box);
  box.appendChild(el("p","hint","Verificando Plano Pro…"));
  const sb=getSupabase();
  let data=null;
  try{
    ({data}=await sb.from("assinaturas").select("pro,expira_em").eq("user_id",session.user.id).maybeSingle());
  }catch(e){/* rede caiu — trata como não-Pro, mostra a oferta; não é
    decisão de segurança (isso é sempre revalidado no servidor) */}
  const pro=proAindaValido(data);
  meuPro=pro;
  box.innerHTML="";
  box.appendChild(el("h4","","Plano Pro"));
  const redesenhar=()=>{ if(box.remove)box.remove(); renderPlanoPro(container,session,{conferido:true}); };
  redesenharPlanoPro=redesenhar;
  if(!pro&&!conferido){
    /* pagou e o webhook não ativou (ou ainda não chegou): a própria tela
       confere na Asaas e redesenha já com o Pro */
    conferirPagamento().then(j=>{ if(j&&j.ativados&&j.pro)redesenhar(); });
  }
  if(pro&&!data.expira_em){
    /* Pro sem data de expiração (plano "unico", o pagamento de antes dos
       30 dias, ou conta liberada à mão): new Date(null) mostrava
       "Pro até 31/12/1969". Sem formulário: não há o que renovar, e um
       pagamento novo gravaria uma data (webhook-asaas.js soma 30 dias a
       partir de agora), encurtando o acesso. */
    box.appendChild(el("p","hint","Esta conta é Pro sem data de expiração: modo Lenda, coletiva de imprensa, entrevista pós-luta, Modo Rival e o acabamento de card estão liberados."));
    return;
  }
  if(pro){
    const ateFmt=new Date(data.expira_em).toLocaleDateString("pt-BR");
    box.appendChild(el("p","hint",`Esta conta é Pro até ${ateFmt}: modo Lenda, coletiva de imprensa, entrevista pós-luta, Modo Rival e o acabamento de card estão liberados. Sem cobrança automática: pra continuar depois dessa data, é só pagar de novo, a qualquer momento.`));
  }else if(data&&data.expira_em){
    box.appendChild(el("p","hint",`Seu Plano Pro expirou em ${new Date(data.expira_em).toLocaleDateString("pt-BR")}.`));
  }
  const cpfIn=el("input");cpfIn.type="text";cpfIn.placeholder="CPF (só números)";cpfIn.maxLength=14;cpfIn.inputMode="numeric";
  box.appendChild(cpfIn);
  /* innerHTML + getElementById pros links, não createTextNode — mesmo
     padrão da vitrine antiga do Pro. O DOM falso do testar.js não implementa
     document.createTextNode (achado rodando "tudo" completo: a suíte
     "inicial" reabre screenConta() já logada, então este bloco roda de
     verdade no sandbox, não só em produção). */
  const aceiteLabel=el("label","aceite-pro",
    `<input type="checkbox" id="aceiteProCheck"> Li e aceito os `+
    `<a href="#" id="aceiteProLinkT">Termos de Uso</a> e a `+
    `<a href="#" id="aceiteProLinkP">Política de Privacidade</a>, `+
    `incluindo a seção do Plano Pro.`);
  box.appendChild(aceiteLabel);
  const aceiteBox=document.getElementById("aceiteProCheck");
  document.getElementById("aceiteProLinkT").onclick=e=>{e.preventDefault();screenTermos();};
  document.getElementById("aceiteProLinkP").onclick=e=>{e.preventDefault();screenPrivacidade();};
  const btn=el("button","btn btn-sm",pro?"Renovar por R$9,99 (mais 30 dias)":"Confirmar pagamento de R$9,99 (30 dias)");
  btn.disabled=true;
  box.appendChild(btn);
  const msg=el("p","hint","");
  box.appendChild(msg);
  const validar=()=>{ btn.disabled=!(aceiteBox.checked&&cpfIn.value.replace(/\D/g,"").length===11); };
  aceiteBox.onchange=validar;
  cpfIn.oninput=validar;
  const erro=(txt)=>{ msg.className="hint msg-erro"; msg.textContent=txt; };
  btn.onclick=async()=>{
    /* Aba nova aberta JÁ, dentro do clique: depois dos awaits o navegador
       trata window.open como pop-up e bloqueia. Ela mostra "abrindo" até a
       cobrança existir; se o navegador bloquear mesmo assim, a tela mostra
       um link pra abrir na mão. */
    let aba=null;
    try{
      aba=window.open("","_blank");
      if(aba){
        try{ aba.opener=null; }catch(e){}
        try{ aba.document.title="Octógono: pagamento";
          aba.document.body.innerHTML='<p style="font-family:sans-serif;padding:24px">Abrindo a página de pagamento da Asaas…</p>'; }catch(e){}
      }
    }catch(e){ aba=null; }
    const falhar=t=>{ try{ if(aba)aba.close(); }catch(e){} erro(t); validar(); };
    btn.disabled=true;
    msg.className="hint";
    msg.textContent="Processando…";
    try{
      await sb.from("aceites_termos").upsert(
        {user_id:session.user.id,versao_termos:VERSAO_TERMOS_PAGAMENTO},
        {onConflict:"user_id,versao_termos",ignoreDuplicates:true});
    }catch(e){
      falhar("Não deu pra registrar o aceite dos Termos. Tenta de novo.");
      return;
    }
    let r,j;
    try{
      r=await fetch("/api/criar-pagamento",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({token:session.access_token,cpf:cpfIn.value}),
      });
      j=await r.json().catch(()=>({}));
    }catch(e){
      falhar("Falha de rede. Tenta de novo em instantes.");
      return;
    }
    if(r.status===503){ falhar("Pagamento ainda não está disponível nesta versão."); return; }
    if(!r.ok||!j.invoiceUrl){ falhar("Não deu pra criar o pagamento agora. Tenta de novo em instantes."); return; }
    marcarPagamentoPendente();
    let abriu=false;
    if(aba&&!aba.closed){ try{ aba.location.href=j.invoiceUrl; abriu=true; }catch(e){} }
    esperarPagamento(box,j.invoiceUrl,abriu,redesenhar);
  };
}
/* Depois de abrir a cobrança: o formulário sai, fica a espera. Confere
   sozinho a cada 10 s por 15 min (Pix pago no celular, com o jogo aberto
   no computador) e na volta pra aba; "Já paguei, conferir" confere na
   hora. */
function esperarPagamento(box,invoiceUrl,abriu,redesenhar){
  box.innerHTML="";
  box.appendChild(el("h4","","Plano Pro"));
  box.appendChild(el("p","hint",abriu
    ?"A página de pagamento da Asaas abriu em outra aba. Depois de pagar, volte aqui: o Pro é liberado sozinho assim que a Asaas confirmar (Pix leva segundos, cartão alguns minutos)."
    :"Seu navegador bloqueou a aba nova. Abra a página de pagamento pelo link abaixo; depois de pagar, volte aqui."));
  if(!abriu){
    const a=el("a","botao",`<span>Abrir a página de pagamento</span>${ICONE("seta-dir")}`);
    a.href=invoiceUrl;a.target="_blank";a.rel="noopener";
    box.appendChild(a);
  }
  const conferir=el("button","btn btn-sm","Já paguei, conferir");conferir.id="proConferir";conferir.type="button";
  box.appendChild(conferir);
  const aviso=el("p","hint","");
  box.appendChild(aviso);
  const liberado=()=>{ SOM.caixa&&SOM.caixa(); redesenhar(); };
  conferir.onclick=async()=>{
    conferir.disabled=true;aviso.className="hint";aviso.textContent="Conferindo na Asaas…";
    const j=await conferirPagamento();
    conferir.disabled=false;
    if(j&&j.pro)return liberado();
    aviso.className="hint msg-erro";
    aviso.textContent=j
      ?"A Asaas ainda não mostra o pagamento como pago. Se você já pagou, espere um pouco e confira de novo."
      :"Não deu pra conferir agora. Tenta de novo em instantes.";
  };
  const fim=Date.now()+15*60e3;
  const rodada=()=>{
    if(box.isConnected===false||Date.now()>fim||meuPro)return;
    conferirPagamento().then(j=>{ if(j&&j.pro)liberado(); else setTimeout(rodada,10e3); });
  };
  setTimeout(rodada,10e3);
}

/* Roda toda vez que a caixa de conta aparece (fim de carreira). Se não
   tem sessão, não faz nada (devolve null, mostra o formulário de
   login/cadastro). Se tem — sessão nova de login/cadastro, do Google,
   ou sessão antiga que o Supabase já mantinha — sincroniza os dois
   lados: sobe o que só
   existe local (upsert, idempotente — pode rodar toda vez sem duplicar
   nem precisar de flag "já migrei"), baixa o que só existe na nuvem
   (outro aparelho). Nunca apaga localStorage, só soma. */
async function sincronizarConquistasNaNuvem(){
  const sb=getSupabase();
  if(!sb)return null;
  let session;
  try{ ({data:{session}}=await sb.auth.getSession()); }catch(e){ return null; }
  if(!session)return null;
  const userId=session.user.id;
  try{
    const locais=[...CONQUISTAS_DESBLOQUEADAS];
    if(locais.length){
      const linhas=locais.map(id=>({user_id:userId,conquista_id:id}));
      await sb.from("conquistas_usuario").upsert(linhas,{onConflict:"user_id,conquista_id",ignoreDuplicates:true});
    }
    const{data:remotas}=await sb.from("conquistas_usuario").select("conquista_id").eq("user_id",userId);
    if(remotas){
      let mudou=false;
      remotas.forEach(r=>{if(!CONQUISTAS_DESBLOQUEADAS.has(r.conquista_id)){CONQUISTAS_DESBLOQUEADAS.add(r.conquista_id);mudou=true;}});
      if(mudou)salvarConquistas();
    }
  }catch(e){/* sincronização falhou (rede, RLS, o que for) — localStorage
    continua valendo, o jogador não perde nada por isso */}
  return session.user.email;
}

/* Histórico de carreiras (2026-09-09) — mesmo padrão de conquistas:
   localStorage sempre, conta sincroniza por cima, nunca substitui.
   `seed` já é único por carreira (mesmo número do link de desafio),
   serve de chave sem precisar de id novo. */
function lerCarreirasLocais(){
  try{ const v=JSON.parse(localStorage.getItem("carreiras")); return Array.isArray(v)?v:[]; }
  catch(e){ return []; }
}
function salvarCarreiraLocal(registro){
  const lista=lerCarreirasLocais().filter(c=>c.seed!==registro.seed);
  lista.push(registro);
  try{ localStorage.setItem("carreiras",JSON.stringify(lista)); }catch(e){}
}
async function sincronizarCarreirasNaNuvem(){
  const sb=getSupabase();
  if(!sb)return;
  let session;
  try{ ({data:{session}}=await sb.auth.getSession()); }catch(e){ return; }
  if(!session)return;
  const userId=session.user.id;
  try{
    const locais=lerCarreirasLocais();
    if(locais.length){
      const linhas=locais.map(c=>({user_id:userId,seed:c.seed,nome_lutador:c.nome,
        cartel:c.cartel,nota:c.nota,concluida_em:c.data}));
      await sb.from("carreiras_usuario").upsert(linhas,{onConflict:"user_id,seed",ignoreDuplicates:true});
    }
    const{data:remotas}=await sb.from("carreiras_usuario")
      .select("seed,nome_lutador,cartel,nota,concluida_em").eq("user_id",userId);
    if(remotas){
      const atuais=lerCarreirasLocais();
      const seedsConhecidos=new Set(atuais.map(c=>c.seed));
      let mudou=false;
      remotas.forEach(r=>{
        if(!seedsConhecidos.has(r.seed)){
          atuais.push({seed:r.seed,nome:r.nome_lutador,cartel:r.cartel,nota:r.nota,data:r.concluida_em});
          mudou=true;
        }
      });
      if(mudou)try{ localStorage.setItem("carreiras",JSON.stringify(atuais)); }catch(e){}
    }
  }catch(e){/* sincronização falhou — localStorage continua valendo */}
}

   REGRA À PARTE, mais forte que a do evento: JULGAR NUNCA RESPEITA A
   PAUSA. Se a cena já apareceu na tela, o jogador já escreveu a resposta
   — pausar o julgamento no meio é exatamente o "você seguiu em frente e
   nada aconteceu" que motivou a investigação inteira. Só `dilema` (a
   GERAÇÃO da cena, ainda ANTES de existir resposta do jogador) respeita
   a pausa e cai no fallback local sem tentar rede. Os dois ainda
   ATUALIZAM o mesmo contador de falha — um julgar que falhar pode pausar
   o PRÓXIMO `dilema`, só nunca pausa A SI MESMO.

   Circuito PRÓPRIO de coletiva/entrevista (2026-09-21, Plano Pro) — cada
   uma é uma família independente, nem a de feed nem a de dilema, mesmo
   raciocínio de sempre: um circuito compartilhado deixa a pausa de uma
   coisa decorativa derrubar a única coisa que o jogador escreveu.
   coletiva RESPEITA a pausa (roda ANTES da luta, sem resposta do jogador
   ainda — fallback local sem provocação, a luta segue normal); entrevista
   NUNCA respeita (roda DEPOIS que o jogador já escreveu a resposta, mesma
   regra do julgar — "cena já apareceu, resposta já foi escrita" é
   exatamente o caso que motivou a regra "nunca pausa a si mesmo").

   Generalizado (2026-09-21, Plano Pro) pra tabela em vez de variável solta
   por família — hardcodear um branch por kind (evento/dilema/feed) parava
   de escalar na 4ª família. FAMILIA_DO_KIND agrupa kinds que COMPARTILHAM
   contador de falha/pausa — só dilema+julgar (julgar é o veredito do MESMO
   dilema que já rodou "dilema" antes, ver acima). Os kinds novos
   (coletiva/entrevista) são cada um sua própria família, mesmo não tendo
   par — não têm por quê compartilhar. RESPEITA_PAUSA é por KIND, não
   por família: dentro da família dilema, "dilema" respeita e "julgar" não;
   mesma distinção se aplica agora dentro de qualquer par ANTES-da-decisão/
   DEPOIS-da-decisão que a família tiver. PODE_RETRY_429 (não medido pra
   coletiva/entrevista ainda, estendido por analogia com dilema/julgar —
   mesmo formato "reage a texto livre", mesma lógica de "vale uma segunda
   tentativa antes de desistir") controla o retry único de sempre. */
const FAMILIA_DO_KIND={evento:"evento",dilema:"dilema",julgar:"dilema",
  feed:"feed",coletiva:"coletiva",entrevista:"entrevista"};
const RESPEITA_PAUSA={evento:true,dilema:true,julgar:false,
  feed:true,coletiva:true,entrevista:false};
const PODE_RETRY_429={dilema:true,julgar:true,coletiva:true,entrevista:true};
const CIRCUITOS={evento:{pausadoAte:0,falhas:0},dilema:{pausadoAte:0,falhas:0},
  feed:{pausadoAte:0,falhas:0},coletiva:{pausadoAte:0,falhas:0},entrevista:{pausadoAte:0,falhas:0}};

/* Regra de texto do jogo (LEIA-ME "Regras de texto"): nenhum travessão.
   Os moldes já nascem sem; o que a IA escreve passa por aqui antes de
   aparecer, porque o prompt pede e o modelo às vezes esquece. Fala que
   começa com travessão perde o travessão; intervalo entre números vira
   hífen; depois de pontuação o travessão só some; no meio da frase vira
   vírgula. */
function semTravessao(t){
  if(typeof t!=="string"||!/[—–]/.test(t))return t;
  return t.replace(/(\d)\s*[—–]\s*(?=\d)/g,"$1-")
    .replace(/(^|\n)[ \t]*[—–][ \t]*/g,"$1")
    .replace(/[ \t]*[—–][ \t]*($|\n)/g,"$1")
    .replace(/([.!?:;,])[ \t]*[—–][ \t]*/g,"$1 ")
    .replace(/[ \t]*[—–][ \t]*/g,", ")
    .replace(/,\s*,/g,",").replace(/ {2,}/g," ");
}
/* Aplica semTravessao em todo texto de uma resposta da IA (objeto,
   lista ou texto solto); número, booleano e chave ficam como vieram. */
function limparTextoIA(v){
  if(typeof v==="string")return semTravessao(v);
  if(Array.isArray(v))return v.map(limparTextoIA);
  if(v&&typeof v==="object"){
    const o={};
    for(const k of Object.keys(v))o[k]=limparTextoIA(v[k]);
    return o;
  }
  return v;
}
async function ai(kind,data,ms=9500){
  /* Achado jogando: "aceito" (dilema binário comum) caiu no fallback
     genérico, e não tinha como saber POR QUÊ — ai() sempre devolvia null
     pelos mesmos 5 motivos possíveis, indistinguíveis de fora. Investigado
     na hora: nem piso de tamanho (não existe nenhum), nem falso positivo
     de CONTEUDO_INSEGURO (testado, nenhuma das frases curtas bate), nem
     falha de classificação (reproduzido ao vivo com a cena e resposta
     exatas, funcionou normal) — sobrou circuito aberto (aiVivo/pausa), o
     que bate com 429 tendo aparecido em 2 de 6 chamadas na medição. Este
     evento não conserta nada sozinho, mas da próxima vez dá pra saber
     qual dos 5 caminhos foi, em vez de reconstruir por eliminação. */
  if(!AI_URL){evento("ia_null",{motivo:"sem_url",kind});return null;}
  const c=CIRCUITOS[FAMILIA_DO_KIND[kind]];
  if(RESPEITA_PAUSA[kind]&&Date.now()<c.pausadoAte){evento("ia_null",{motivo:"pausado",kind});return null;}
  return tentarChamadaIA(kind,data,ms,true);
}
/* Extraído de ai() pra existir a retentativa (abaixo) sem duplicar a
   chamada de fetch inteira. podeRetentar=false na 2ª tentativa — nunca
   mais que 1 retry, senão um pool congestionado vira loop de espera. */
async function tentarChamadaIA(kind,data,ms,podeRetentar){
  const c=CIRCUITOS[FAMILIA_DO_KIND[kind]];
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms);
  try{
    const r=await fetch(AI_URL,{method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({kind,data})});
    clearTimeout(t);
    c.falhas=0;
    if(!r.ok){
      /* O servidor já sabe o que aconteceu — não adivinha por status HTTP
         externo (502 cobre seis coisas diferentes, ver api/ai.js). Corpo
         pode não vir (resposta não-JSON de algum proxy no meio do caminho)
         ou pode faltar "transitorio" (deploy do client mais novo que o do
         servidor) — nos dois casos não desliga nada, só essa chamada
         falhou. */
      let corpo=null;
      try{corpo=await r.json();}catch(e){}
      if(corpo&&corpo.status===429){
        /* Retentativa única, só em 429, só nas famílias de PODE_RETRY_429
           — pedido depois de medir 67% de fallback no dilema, mesmo padrão
           já usado no evento pra JSON malformado. Espera curta (2s, não
           AI_PAUSA_MS inteiro): 429 no pool compartilhado costuma ser blip
           momentâneo, uma segunda tentativa logo depois tem chance real de
           sair fora da MESMA janela de limite. */
        if(PODE_RETRY_429[kind]&&podeRetentar){
          await new Promise(res=>setTimeout(res,2000));
          return tentarChamadaIA(kind,data,ms,false);
        }
        c.pausadoAte=Date.now()+AI_PAUSA_MS;
        evento("ia_null",{motivo:"429",kind});
      }else if(corpo&&corpo.transitorio===false){
        /* erro_permanente (chave, crédito, permissão) NUNCA desliga pra
           sempre em nenhum kind agora, feed incluso (2026-09-11) — só
           pausa. Continuar tentando de qualquer jeito, mesmo sabendo que
           é "permanente" pro estado atual da conta, é seguro: quem
           resolve o problema (troca a chave, recarrega crédito) resolve
           fora do jogo, e a próxima janela de pausa já volta tentando de
           novo sozinha, sem precisar de reload. Também cobre 403 de plano
           Pro ausente (coletiva/entrevista, ver api/ai.js) — não é erro
           transitório, mas também não é motivo pra desligar a família
           inteira PRA SEMPRE: se o status mudar (usuário assinou), a
           próxima chamada, depois da pausa, já reflete isso sozinha. */
        c.pausadoAte=Date.now()+AI_PAUSA_MS;
        evento("ia_null",{motivo:"erro_permanente",kind});
      }else evento("ia_null",{motivo:"erro_transitorio",kind});
      return null;
    }
    const j=await r.json();
    return limparTextoIA(j.result??null);
  }catch(e){
    clearTimeout(t);
    c.falhas++;
    if(c.falhas>=2)c.pausadoAte=Date.now()+AI_PAUSA_MS;
    evento("ia_null",{motivo:"rede",kind});
    return null;
  }
}
/* Achado no Plano Pro (2026-09-21): Number(null)===0, que É finito — o
   padrão `lim(j&&j.campo,...)`, usado em toda a base (dilema/julgar/
   evento) pra cair no default quando `j` inteiro foi descartado (rede de
   CONTEUDO_INSEGURO), só funcionava por COINCIDÊNCIA nos casos cujo
   default já era 0 dentro do intervalo (seguidores/fã/dinheiro) — nos
   casos de multiplicador (default 1, intervalo tipo .85-1.20, sem o 0
   dentro) `v==null` virava o PISO do intervalo, não o default. Inerte
   até agora porque sempre vinha emparelhado com um atributo também nulo
   (nunca aplicado) — st.coletivaHype (Plano Pro) é o primeiro uso
   incondicional, onde o valor errado passava direto pro estado do jogo.
   `v==null` cobre null E undefined (comparação solta, de propósito). */
const lim=(v,lo,hi,def)=>{if(v==null)return def;const n=Number(v);
  return Number.isFinite(n)?Math.max(lo,Math.min(hi,n)):def;};

/* Analytics nunca pode derrubar a carreira de ninguém — mesmo princípio de
   áudio/localStorage. window.va existe sempre (stub no <head>, ver
   comentário lá) mas só vira a função de verdade se Analytics estiver
   ligado no projeto; se não estiver, script.js dá 404 e window.va fica
   sendo o stub que só enfileira sem nunca ler — sem custo, sem quebra. */
function evento(nome,dados){
  try{window.va&&window.va("event",{name:nome,data:dados});}catch(e){}
}
/* Marca de tempo no carregamento do script — praticamente o mesmo instante
   de evento("abriu") em boot(), sem depender do await de fetch() lá dentro
   atrasar a marcação. É contra ela que terminou_luta_1 mede quanto tempo
   passa até a primeira luta acabar (PLANO-LANCAMENTO.md fase 2). */
const TEMPO_ABERTURA=Date.now();

/* busca antecipada: dispara quando a luta COMEÇA e resolve durante a
   narração, que dura uns 12 segundos. Latência percebida vai a zero. */
let feedPromise=null;
function prefetchFeed(r,won,opp,titleFight,myKd,oppKd,upset){
  feedPromise=ai("feed",{name:me.name,opp:opp.name,won,method:r.method,
    round:r.round,clock:r.clock,myKd,oppKd,title:titleFight,upset,
    record:`${st.wins}-${st.losses}`,followers:fmtNum(st.followers),
    fa:Math.round(st.fan*10)/10,haters:HATERS_IA(st.fan)});
}
async function resolveFeed(fallback){
  /* Persona dos posts da IA com gerador PRÓPRIO (revamp fase 8). Antes
     saía do rng principal, depois da resposta chegar: com a IA no ar, a
     sequência da carreira dependia de quando o feed chegava e de quantos
     posts vieram, e link de desafio e save deixavam de reproduzir a
     carreira (offline nunca aparecia). Semente da carreira + luta: a
     mesma carreira mostra as mesmas personas. Sorteado ANTES do await,
     com a luta desta repercussão. */
  const g=mulberry32((SEED^Math.imul(fightNo+1,0x9E3779B1))>>>0);
  const got=await(feedPromise||Promise.resolve(null));
  feedPromise=null;
  if(!Array.isArray(got)||got.length===0)return fallback;
  return got.slice(0,4).map(o=>{
    const p=persona(g);
    if(o&&typeof o.nome==="string"&&o.nome.trim())
      {p.name=o.nome.trim().slice(0,14);p.initials=p.name.slice(0,2).toUpperCase();}
    return{p,text:String(o&&o.texto||"").slice(0,180)||"..."};
  }).filter(t=>t.text!=="...");
}

/* Memória ENTRE carreiras (2026-09-08): achado jogando — sorteio sem
   reposição e "recentes" (abaixo) só valem DENTRO de uma carreira; toda
   carreira nova reembaralha do zero, então o mesmo tema (ou, pro
   fallback local, o mesmo texto fixo) pode voltar na carreira seguinte.
   Quem joga várias carreiras seguidas via isso de verdade — inclusive um
   caso de eco palavra por palavra do fallback local, só 3 itens sem
   histórico nenhum (nem dentro da carreira). Guarda só IDENTIFICADOR
   (tema ou título), nunca o texto inteiro — localStorage é pequeno e
   não precisa do conteúdo pra evitar repetir. Tamanho da memória é
   PROPORCIONAL ao pool (60%), não um número fixo: pool pequeno (ex. 8
   itens) com memória fixa grande (ex. 30) bloquearia a cartela inteira
   e o sorteio ficaria sem opção livre pra escolher — 60% garante que
   sempre sobra pelo menos 40% do pool livre. */
function lerMemoriaEntreCarreiras(chave){
  try{
    const v=JSON.parse(localStorage.getItem(chave));
    return Array.isArray(v)?v:[];
  }catch(e){ return []; }
}
function marcarMemoriaEntreCarreiras(chave,id,tamanhoMax){
  const lista=lerMemoriaEntreCarreiras(chave).filter(x=>x!==id);
  lista.push(id);
  while(lista.length>tamanhoMax)lista.shift();
  try{ localStorage.setItem(chave,JSON.stringify(lista)); }catch(e){}
}
/* Cartela nova pra carreira: itens que JÁ estão na memória entre
   carreiras vêm por ÚLTIMO (embaralhados entre si), não são excluídos —
   deprioriza sem nunca deixar a cartela sem opção, mesmo se a memória
   um dia cobrir o pool inteiro (não deveria, é o que os 60% evitam). */
function cartelaComMemoria(pool,rng,chave,tamanhoMax){
  const vistos=new Set(lerMemoriaEntreCarreiras(chave));
  const embaralhar=arr=>{
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor((rng?rng():Math.random())*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  };
  const livres=pool.filter(x=>!vistos.has(x)),usados=pool.filter(x=>vistos.has(x));
  /* quem consome (proximoTema()/proximoDilemaSeed()/proximoDilemaFallback())
     tira do FIM com .pop() — "usados" (memória recente) precisa ficar no
     COMEÇO do array (índice baixo) pra ser consumido POR ÚLTIMO; "livres"
     no fim, consumido primeiro. Inverter isso faria o oposto do
     pretendido: priorizar quem acabou de aparecer. */
  return [...embaralhar(usados),...embaralhar(livres)];
}

/* Temas do evento — mesma ideia do SEEDS do dilema (ver abaixo): sortear
   um tema e MANDAR pro prompt, em vez de listar as opções e confiar que o
   modelo varia sozinho. Medido (2026-09-06, 40 chamadas reais sem tema
   forçado): 42% dos textos saíam com o mesmo esqueleto ("vídeo/clipe
   viraliza, família ou empresário reage") — o prompt só SUGERIA os temas,
   sem forçar nenhum por chamada, e o modelo convergia pro que "imprensa/
   redes sociais" sozinho já cobria. eventoRng é stream próprio (mesmo
   motivo do escolhaRng/lesaoRng — nunca desloca rng principal). */
const EVENTO_TEMAS=["imprensa","dinheiro","família","rotina de treino",
  "patrocínio","redes sociais","saúde leve (nada grave)","vida pessoal",
  "reação do público","bastidor da academia"];
/* Sorteio SEM reposição, não com reposição: com 10 temas e só ~18 lutas
   elegíveis/carreira, sortear cada vez do zero podia repetir um tema
   cedo (ex. duas vezes em 5 lutas) por puro acaso — não é a repetição
   DENTRO do tema que foi medida (essa é o modelo, ver
   st.eventosRecentes abaixo), mas é uma repetição EVITÁVEL de graça: os
   10 primeiros sorteios de qualquer carreira são garantidos diferentes.
   st.temasRestantes é a "cartela" da carreira, embaralhada uma vez com
   eventoRng e consumida um a um; reembaralha (nova cartela) só quando
   esgota — então o 11º tema pode repetir um dos 10 primeiros, mas nunca
   antes disso. */
const MEM_EVENTO_TEMAS=Math.round(EVENTO_TEMAS.length*.6);
function proximoTema(){
  if(!st.temasRestantes||!st.temasRestantes.length){
    st.temasRestantes=cartelaComMemoria(EVENTO_TEMAS,eventoRng,"memTemasEvento",MEM_EVENTO_TEMAS);
  }
  const tema=st.temasRestantes.pop();
  marcarMemoriaEntreCarreiras("memTemasEvento",tema,MEM_EVENTO_TEMAS);
  return tema;
}

/* Evento de vida a cada luta (substitui o pool fixo de 28 frases, que
   repetia entre carreiras — ver o bloco "EVENTOS DE VIDA" logo acima de
   RARE). SEM FALLBACK LOCAL, de propósito: se a chamada falhar ou o
   filtro esvaziar o texto, a luta passa sem evento — nenhuma frase de
   reserva, nenhum número inventado (RARE, acima em sortearRaro(), continua
   cobrindo o fora-da-curva, local e síncrono, sem depender da IA).
   Assíncrono e não bloqueia nextFight() nem a tela — mesmo padrão do
   feed (prefetchFeed/resolveFeed): aparece quando fica pronto, sem
   spinner, sem pausa; se o jogador já avançou pra próxima luta antes de
   resolver, o efeito em st.eventoMod só vale a partir da luta seguinte
   (lutadorEfetivo() da luta em andamento já foi lido antes disso). */
const ATTRS_EVENTO=["slpm","strDef","tdAvg","tdDef","subAvg","kdAvg","durability"];
async function dispararEventoIA(bouts,opp,r){
  const tk=CARREIRA_TOKEN,luta=fightNo;
  const tema=proximoTema();
  /* Medido 2026-09-06: forçar o tema resolveu o COLAPSO ENTRE temas (42%
     convergindo pra "vídeo viraliza" mesmo quando o tema pedido era
     outro) — mas não resolve repetição DENTRO do mesmo tema: o modelo
     tem uma história "padrão" pra cada tema e a repete quase igual
     quando o tema volta na mesma carreira. st.eventosRecentes guarda os
     últimos 3 textos já mostrados; vão no prompt pra evitar repetir a
     mesma situação.

     Contexto de carreira (posicao/lesao/perdeuCinturao/dinheiro): pedido
     depois de medir que 40 chamadas isoladas não é a experiência do
     jogador (ele vê 1 evento por luta, ao longo de ~40 minutos — duas
     lutas de intervalo não incomoda do jeito que 40 lado a lado
     parecem). Evento ANCORADO no que está acontecendo de verdade
     (posição no ranking, se tá machucado, se acabou de perder o
     cinturão) tem menos espaço de sobra pra cair na resposta genérica
     "padrão" do tema — repete menos por construção, não por instrução. */
  const pos=posicaoDivisao();
  const dados={name:me.name,record:`${st.wins}-${st.losses}`,
    followers:fmtNum(st.followers),fan:st.fan.toFixed(1),
    ganhou:st.lastWon,metodo:st.lastMethod,round:st.lastRound,nocaute:st.lastKO,
    streakW:st.streakW,streakL:st.streakL,title:!!st.title,
    fightNo,totalFights:TOTAL_FIGHTS,tema,recentes:(st.eventosRecentes||[]).slice(-3),
    posicao:pos?`#${pos.n} de ${pos.de}`:null,
    lesao:st.lesao?`${ROTULO_ATTR[st.lesao.atributo]||st.lesao.atributo} machucado(a)`:null,
    perdeuCinturaoAgora:st.perdeuCinturaoNaLuta===fightNo,
    dinheiro:fmtNum(st.dinheiro||0)};
  let j=await ai("evento",dados);
  if(tk!==CARREIRA_TOKEN)return;
  /* Medido: 10% das respostas vêm com ok:true mas sem o campo "texto" no
     JSON (a IA às vezes não obedece o formato pedido). Uma retentativa
     antes de desistir da luta — custo é 1 chamada extra em ~10% das ~18
     lutas elegíveis/carreira, ~1,8 chamada a mais por carreira. Só pra
     ESTE caso (json malformado); falha de rede/429/erro do servidor NÃO
     tenta de novo aqui — ai() já tem sua própria disciplina de pausa/
     desligamento pra essas, insistir por cima seria gastar chamada
     fadada a repetir o mesmo erro. */
  if(j&&!j.texto)j=await ai("evento",dados);
  if(tk!==CARREIRA_TOKEN||!j||!j.texto)return;
  /* Medido: a instrução "não repita" em cima de "recentes" ajuda mas não
     é garantia — o modelo às vezes ecoa um dos recentes quase palavra
     por palavra mesmo assim (achado: pedido explícito de não repetir, e
     saiu idêntico ao 1º evento de novo no 3º). Rede de baixo igual às
     outras (CONTEUDO_INSEGURO/RESULTADO_LUTA): não confia só na
     instrução, verifica e descarta — sem fallback, a luta passa sem
     evento igual qualquer outra falha. */
  if((st.eventosRecentes||[]).some(r=>r.toLowerCase()===String(j.texto).toLowerCase()))return;
  /* CONTEUDO_INSEGURO continua (rede de baixo pra conteúdo impróprio,
     igual ao dilema) — RESULTADO_LUTA NÃO se aplica aqui, de propósito
     (corrigido 2026-09-06). Esse filtro foi desenhado pra impedir o
     desfecho do DILEMA de afirmar o resultado de uma luta que ainda vai
     acontecer (contradizer o motor). Evento narra uma luta que JÁ
     terminou — "o clipe do nocaute viralizou" é um FATO conhecido, não
     uma previsão, e o filtro cortava a frase inteira mesmo assim (~8%
     dos eventos, medido). Aplicar o mesmo filtro nos dois lugares
     confundia "onde ele foi desenhado pra proteger" com "todo texto que
     a IA gera" — são problemas diferentes. */
  if(conteudoInseguro(j.texto))return;
  const texto=String(j.texto).slice(0,300).trim();
  if(!texto)return;
  bouts.appendChild(el("div","event",texto));
  registrarExtra({tipo:"evento",texto},luta);
  st.eventosRecentes=st.eventosRecentes||[];
  st.eventosRecentes.push(texto);
  if(st.eventosRecentes.length>3)st.eventosRecentes.shift();
  const atr=ATTRS_EVENTO.includes(j.atributo)?j.atributo:null;
  const mult=atr?lim(j.efeito,.90,1.10,1):1;
  tocarSom(mult>1.008?1:mult<0.992?-1:0);
  st.events++;
  if(atr&&me[atr]!=null){
    st.eventoMod=st.eventoMod||{};
    st.eventoMod[atr]=(st.eventoMod[atr]||1)*mult;
  }
  renderFicha();
  salvarCarreira();   // evento chega depois da luta, fora do save do fim dela
}

/* ---------- dilema: o jogador escreve o que faz, a IA julga ---------- */
const SEEDS=["imprensa provocando","dinheiro curto","família cobrando",
  "lesão escondida","proposta de patrocínio duvidosa","polêmica nas redes",
  "adversário te humilhando","convite pra outro esporte","treinador querendo sair",
  "fã passando do limite","corte de peso dando errado","entrevista ao vivo"];
/* Sorteio SEM reposição, mesmo desenho de proximoTema() (evento): com 12
   tipos e só 4 dilemas por carreira, sortear cada vez do zero podia repetir
   um tipo cedo por puro acaso — st.dilemaSeedsRestantes é a cartela da
   carreira, embaralhada com dilemaRng (stream próprio, nunca o rng
   principal — sortear aqui deslocaria a sequência e o link de desafio
   antigo pararia de reproduzir os mesmos adversários) e consumida um a
   um; com só 4 sorteios por carreira, a cartela de 12 nunca esgota — os 4
   tipos de qualquer carreira são sempre diferentes entre si. */
const MEM_DILEMA_SEEDS=Math.round(SEEDS.length*.6);
function proximoDilemaSeed(){
  if(!st.dilemaSeedsRestantes||!st.dilemaSeedsRestantes.length){
    st.dilemaSeedsRestantes=cartelaComMemoria(SEEDS,dilemaRng,"memDilemaSeeds",MEM_DILEMA_SEEDS);
  }
  const seed=st.dilemaSeedsRestantes.pop();
  marcarMemoriaEntreCarreiras("memDilemaSeeds",seed,MEM_DILEMA_SEEDS);
  return seed;
}
/* Fallback local — só aparece quando a IA falha ou o texto dela é
   descartado (sem cena, conteúdo inseguro, eco de um recente). Quem vê
   isso já está numa sessão degradada, então cada cena tem que se
   sustentar SOZINHA — nenhuma cita carreira, lesão ou cinturão, porque
   o fallback não tem esse contexto disponível. Território DIFERENTE dos
   12 SEEDS de propósito (achado jogando: os 3 antigos duplicavam tema
   com "imprensa provocando"/"entrevista ao vivo" e "proposta de
   patrocínio duvidosa" — parecia versão pobre do mesmo dilema, não uma
   situação nova). Cortado desta leva: um dilema sobre esconder dor no
   peito — sintoma cardíaco real num atleta de combate não é o mesmo
   tipo de risco que uma lesão de queixo ou joelho (que têm mecânica
   própria pra dar consequência, ver LESAO_TIPOS/CHANCE_LESAO_NOCAUTE);
   esse especificamente premiava esconder o sintoma, sem trava nenhuma
   no julgar depois. */
const DILEMA_LOCAL=[
 {titulo:"Parceiro de treino de olho na sua vaga",cena:"Seu parceiro de treino, do mesmo peso, vem ganhando confiança demais nos últimos rounds de sparring. Ele comentou, meio de brincadeira, que também merecia uma chance como a sua."},
 {titulo:"O amigo de infância na aba",cena:"Um amigo de infância te chamou de lado, sem graça, pra pedir um empréstimo que ele nunca te pediu antes. Ele jura que devolve em dois meses."},
 {titulo:"Convite pra virar rosto de marca",cena:"Uma agência quer você posando pra uma campanha de roupa, nada a ver com luta. O dinheiro é bom e a exposição também, mas não é assim que você imaginou aparecer."},
 {titulo:"Rumor no vestiário",cena:"Um preparador de outra academia comentou, baixinho, que viu algo estranho no protocolo do próximo adversário. Ele não teria motivo pra inventar isso, mas também não tem prova nenhuma."},
 {titulo:"Câmera querendo te seguir",cena:"Uma produtora quer gravar sua rotina pra um documentário, câmera dentro da academia e tudo. Parece bom pro nome, mas ninguém ali costuma treinar sendo filmado."},
 {titulo:"Festa na véspera errada",cena:"O casamento de um amigo caiu na véspera da pesagem, com festa até de madrugada. Ele faz questão da sua presença."},
 {titulo:"O primo com ideia",cena:"Seu primo apareceu com um plano de abrir uma academia com seu nome. Ele quer que você entre com tudo e não trouxe nenhum papel."},
 {titulo:"Técnico querendo mudar seu estilo",cena:"Seu técnico decidiu que sua base inteira está errada e quer refazer a postura do zero, a três semanas da próxima luta. Ele não mostrou nenhum vídeo nem plano de treino pra isso."},
];
const MEM_DILEMA_LOCAL=Math.round(DILEMA_LOCAL.length*.6);
/* Sem reposição + memória entre carreiras, mesmo tratamento do resto —
   o fallback não tinha NENHUM histórico antes (nem dentro da carreira),
   com só 3 itens isso significava ~33% de chance de repetir palavra por
   palavra a cada vez que disparava. */
function proximoDilemaFallback(){
  if(!st.dilemaFallbackRestante||!st.dilemaFallbackRestante.length){
    const ordem=cartelaComMemoria(DILEMA_LOCAL.map(d=>d.titulo),dilemaRng,"memDilemaFallback",MEM_DILEMA_LOCAL);
    st.dilemaFallbackRestante=ordem.map(t=>DILEMA_LOCAL.find(d=>d.titulo===t));
  }
  const d=st.dilemaFallbackRestante.pop();
