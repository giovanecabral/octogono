/* Sorteio SEM REPOSIÇÃO num pool combinado.
   O bug antigo: numa vitória por finalização o único bucket era subWin, com 3
   moldes pra 4 linhas. O laço tentava 8 vezes, desistia e repetia o comentário.
   Agora hater e meme sempre entram no pool, então nunca falta candidato. */
function buildFeed(r,won,titleFight,myKd,oppKd,upset,rng,name,followers=0){
  const ko=/ocaute/.test(r.method),sub=r.method==="Finalização";
  const cand=[];
  /* peso é POR BUCKET, dividido entre os moldes dele. Sem isso o bucket com
     mais textos domina o sorteio só por ser maior — foi o que aconteceu com
     os haters, que tomaram 46% da timeline. */
  const add=(bucket,peso,hater)=>{
    const pool=TWEETS[bucket]||[];
    pool.forEach(fn=>cand.push({fn,peso:peso/pool.length,hater:!!hater}));
  };
  if(titleFight&&won)add("title",5);
  if(upset&&won)add("upset",5);
  add(won?(ko?"koWin":sub?"subWin":"decWin"):(ko?"koLoss":sub?"subLoss":"decLoss"),4);
  if(oppKd>0)add("knockdown",3);
  if(r.method==="Decisão"&&!titleFight)add("boring",3);
  add("meme",2);
  /* fama atrai hater: quase nenhum no começo, presença real no topo.
     Escala entre 2 mil (fama 0) e 1 milhão de seguidores (fama 1). */
  const fama=Math.max(0,Math.min(1,(Math.log10(Math.max(100,followers))-3.3)/2.7));
  add("hater",.5+fama*4.5,true);

  const out=[],usados=new Set();
  for(let i=0;i<4&&cand.length;i++){
    const total=cand.reduce((s,c)=>s+(usados.has(c.fn)?0:c.peso),0);
    if(total<=0)break;
    let alvo=rng()*total,esc=null;
    for(const c of cand){
      if(usados.has(c.fn))continue;
      alvo-=c.peso;
      if(alvo<=0){esc=c;break;}
    }
    if(!esc)break;
    usados.add(esc.fn);
    out.push({p:persona(rng),text:esc.fn(name),hater:esc.hater});
  }
  return out;
}

/* Só tamanho, nada de exigir maiúscula/número/símbolo — regra complexa
   demais no cadastro afasta gente (decisão explícita). Precisa bater
   com o mínimo configurado no painel (Authentication → Providers →

/* Erros do Supabase chegam em inglês, texto cru — "User already
   registered" não é o que se mostra pra alguém criando conta. Casa por
   SUBSTRING (não código de erro — o client não recebe um código
   estável em todas as versões, o texto é o que sempre vem), nunca deixa
   o texto cru passar pro jogador. O bucket "password" cobre tanto
   "should be at least N characters" quanto uma política de força do
   painel que o client não tem como prever — mesma mensagem pros dois,
   porque não dá pra saber qual regra faltou sem o Supabase dizer. */
function traduzErroSupabase(msg){
  const m=String(msg||"").toLowerCase();
  if(m.includes("already registered")||m.includes("already exists"))
    return "Este e-mail já está cadastrado.";
  if(m.includes("invalid login credentials"))
    return "E-mail ou senha incorretos.";
  if(m.includes("email not confirmed"))
    return "Confirma seu e-mail antes de entrar — veja sua caixa de entrada.";
  if(m.includes("password"))
    return "Sua senha não atende aos requisitos de segurança do site. Tenta uma senha diferente.";
  if(m.includes("rate limit")||m.includes("too many requests")||m.includes("for security purposes"))
    return "Muitas tentativas seguidas. Espera um pouco antes de tentar de novo.";
  if(m.includes("invalid email")||m.includes("unable to validate email"))
    return "Esse e-mail não parece válido.";
  if(m.includes("network")||m==="failed to fetch")
    return "Falha de rede. Tenta de novo.";
  return "Não deu certo. Tenta de novo em instantes.";
}

/* E-mail+senha, não link mágico (2026-09-09) — decisão explícita: plano
   pago vem por aí, e conta precisa existir de verdade (login em outro
   aparelho sem depender de e-mail chegando), não só uma sessão que o
   link mágico concede de passagem. supabase.auth já suporta as duas
   nativamente, sem tabela nova. Confirmação de e-mail no cadastro
   continua ativa por padrão no Supabase — é ela que precisa do SMTP
   com a marca certa (ver LEIA-ME.md "Contas"), não é opcional só
   porque trocou de link mágico pra senha. */
async function criarConta(email,senha){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{data,error}=await sb.auth.signUp({email,password:senha});
    if(error)return{ok:false,erro:error.message};
    /* Supabase devolve sessão nula quando confirmação de e-mail está
       ligada (o normal) — cadastro funcionou, só falta confirmar. */
    return{ok:true,precisaConfirmar:!data.session};
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
async function entrarComSenha(email,senha){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error)return{ok:false,erro:error.message};
    return{ok:true};
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
/* Google resolve o atrito do cadastro (sem senha nova pra lembrar) e não
   depende de e-mail chegando — útil justamente porque o SMTP de marca
   própria ainda está pendente (ver LEIA-ME.md "Contas"). Redireciona
   pra fora e volta — precisa de OAuth client configurado no painel do
   Supabase (Authentication → Providers → Google), não só código. */
async function entrarComGoogle(){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.href}});
    if(error)return{ok:false,erro:error.message};
    return{ok:true}; // navegador já está saindo da página aqui
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
/* Reenvia o e-mail de confirmação de cadastro — mesmo caminho do Supabase
   que criarConta() já dispara na primeira vez, chamado de novo quando o
   link caiu no spam ou expirou. `type:'signup'` é o que distingue esse
   reenvio do de recuperação de senha (enviarRecuperacaoSenha, outro
   endpoint). Rate limit do próprio Supabase é esperado se a pessoa clicar
   demais — por isso a tela trava o botão por 60s no lado do cliente
   também, pra não bater nesse limite antes mesmo de tentar. */
async function reenviarConfirmacaoEmail(email){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{error}=await sb.auth.resend({type:"signup",email});
    if(error)return{ok:false,erro:error.message};
    return{ok:true};
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
async function sairDaConta(){
  const sb=getSupabase();
  if(!sb)return;
  try{ await sb.auth.signOut(); }catch(e){}
}

/* "Esqueci minha senha" (2026-09-09) — com conta por senha e plano pago
   vindo, alguém esquece a senha no primeiro dia; sem isso a pessoa
   perde acesso ao que pagou. resetPasswordForEmail() manda o e-mail;
   quando a pessoa clica no link, o Supabase volta pra ESTA página com
   uma sessão de recuperação e dispara o evento "PASSWORD_RECOVERY" —
   é isso que getSupabase() escuta (abaixo) pra abrir screenNovaSenha()
   sozinho, sem precisar de rota nem parâmetro novo na URL. */
async function enviarRecuperacaoSenha(email){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});
    if(error)return{ok:false,erro:error.message};
    return{ok:true};
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
async function definirNovaSenha(novaSenha){
  const sb=getSupabase();
  if(!sb)return{ok:false,erro:"Conta não configurada ainda."};
  try{
    const{error}=await sb.auth.updateUser({password:novaSenha});
    if(error)return{ok:false,erro:error.message};
    return{ok:true};
  }catch(e){return{ok:false,erro:"Falha de rede. Tenta de novo."};}
}
function screenNovaSenha(){
  app.innerHTML="";
  app.appendChild(el("div","eyebrow","Nova senha"));
  const box=el("div","conta-box");
  box.appendChild(el("h4","","Escolher nova senha"));
  const inp=el("input");inp.type="password";inp.placeholder="Nova senha";inp.minLength=SENHA_MIN;
  const btn=el("button","btn btn-sm","Salvar nova senha");
  const msg=el("p","hint","");
  btn.onclick=async()=>{
    const senha=inp.value;
    if(senha.length<SENHA_MIN){msg.className="hint msg-erro";msg.textContent=`Senha precisa de pelo menos ${SENHA_MIN} caracteres.`;return;}
    btn.disabled=true;msg.className="hint";msg.textContent="Salvando…";
    const r=await definirNovaSenha(senha);
    if(r.ok){msg.className="hint msg-ok";msg.textContent="Senha atualizada. Redirecionando…";setTimeout(()=>location.reload(),1200);}
    else{msg.className="hint msg-erro";msg.textContent=traduzErroSupabase(r.erro);btn.disabled=false;}
  };
  box.append(inp,btn,msg);
  app.appendChild(box);
}

/* Formulário de login/cadastro, usado em 2 lugares (tela Conta e a caixa
   de fim de carreira) — uma função só, pra não duplicar markup nem
   lógica entre os dois. IDs fixos (não gerados por instância): as duas
   telas nunca aparecem ao mesmo tempo, mesmo padrão já usado pelos
   campos de dilema (`dilresp`/`dilgo`), reaproveitados por
   `document.getElementById()` em vez de guardar referência local. */
function montarFormularioConta(container){
  // dois modos (entrar/criar) em vez de um formulário só — quem já tem
  // conta não deve ver confirmação de senha, quem está criando não
  // precisa ver "esqueci minha senha". IDs fixos: as duas telas (conta e
  // fim de carreira) nunca aparecem ao mesmo tempo, mesmo padrão de
  // dilresp/dilgo.
  let modo="entrar";
  let emailPendente=null; // e-mail aguardando confirmação — não persiste:
  // fechar a aba e voltar cai direto no formulário normal, de propósito.

  function campoSenha(rotulo,idBase,autocomplete){
    const rot=el("label","campo-rot",rotulo);
    const btnVer=el("button","","Mostrar");btnVer.type="button";btnVer.id=idBase+"-ver";
    rot.appendChild(btnVer);
    const inp=el("input");inp.type="password";inp.id=idBase;inp.placeholder=rotulo;inp.autocomplete=autocomplete;
    btnVer.onclick=()=>{
      const oculta=inp.type==="password";
      inp.type=oculta?"text":"password";
      btnVer.textContent=oculta?"Ocultar":"Mostrar";
    };
    const wrap=el("div","");wrap.append(rot,inp);
    return{wrap,inp};
  }

  /* Trava o botão de reenvio por N segundos com contagem visível — sem
     isso a pessoa clica várias vezes seguidas e esbarra no rate limit do
     Supabase antes mesmo de o primeiro reenvio ter chance de chegar. */
  function travarReenvio(btn,seg){
    let restante=seg;
    btn.disabled=true;
    btn.textContent=`Reenviar e-mail (${restante}s)`;
    const iv=setInterval(()=>{
      restante--;
      if(restante<=0){clearInterval(iv);btn.disabled=false;btn.textContent="Reenviar e-mail";}
      else btn.textContent=`Reenviar e-mail (${restante}s)`;
    },1000);
  }

  function renderConfirmacao(){
    container.innerHTML="";
    const email=emailPendente;
    container.appendChild(el("h4","","Confirme seu e-mail"));
    const p=el("p","hint","");
    p.append("Enviamos um link para ",el("b","",email),". Abra o link, volte aqui e entre com sua senha.");
    const aviso=el("p","hint","Não achou? Confere a caixa de spam.");
    const msg=el("p","hint","");
    const btnEntrar=el("button","btn","Já confirmei — entrar");
    btnEntrar.onclick=()=>{
      emailPendente=null;modo="entrar";render();
      const inp=document.getElementById("conta-email");
      if(inp)inp.value=email;
    };
    const btnReenviar=el("button","btn btn-ghost","Reenviar e-mail");
    btnReenviar.onclick=async()=>{
      btnReenviar.disabled=true;msg.className="hint";msg.textContent="Reenviando…";
      const r=await reenviarConfirmacaoEmail(email);
      if(r.ok){msg.className="hint msg-ok";msg.textContent="E-mail reenviado.";travarReenvio(btnReenviar,60);}
      else{msg.className="hint msg-erro";msg.textContent=traduzErroSupabase(r.erro);btnReenviar.disabled=false;}
    };
    container.append(p,aviso,btnEntrar,btnReenviar,msg);
  }

  function render(){
    if(emailPendente){renderConfirmacao();return;}
    container.innerHTML="";
    const msg=el("p","hint","");
    const inpEmail=el("input");inpEmail.type="email";inpEmail.placeholder="seu@email.com";inpEmail.id="conta-email";inpEmail.autocomplete="email";
    /* Rótulo visível (Fase 9): Senha já tem um (campoSenha() monta um
       <label class="campo-rot">), e-mail só tinha o placeholder — some
       assim que a pessoa digita. Mesma classe que Senha já usa, sem o
       botão Mostrar (não é senha, não faz sentido aqui). */
    const wrapEmail=el("div","");
    wrapEmail.append(el("label","campo-rot","E-mail"),inpEmail);
    const campoS=campoSenha("Senha","conta-senha",modo==="criar"?"new-password":"current-password");
    let campoC=null,regraTam=null,regraConf=null;

    function formValido(){
      if(modo==="entrar")return true;
      const s=campoS.inp.value;
      return s.length>=SENHA_MIN&&campoC.inp.value===s&&s.length>0;
    }
    function atualizaRegras(){
      const s=campoS.inp.value;
      const okTam=s.length>=SENHA_MIN;
      regraTam.className="regra-senha "+(okTam?"ok":(s.length?"falta":""));
      regraTam.textContent=okTam?`✓ mínimo de ${SENHA_MIN} caracteres`:
        `faltam ${Math.max(0,SENHA_MIN-s.length)} caractere(s) para o mínimo de ${SENHA_MIN}`;
      const c=campoC.inp.value;
      const okConf=c.length>0&&c===s;
      regraConf.className="regra-senha "+(okConf?"ok":(c.length?"falta":""));
      regraConf.textContent=okConf?"✓ as senhas conferem":(c.length?"as senhas não conferem":"repete a senha para confirmar");
      btnAcao.disabled=!formValido();
    }

    const trava=v=>{
      btnAcao.disabled=v||!formValido();
      inpEmail.disabled=v;campoS.inp.disabled=v;btnGoogle.disabled=v;
      if(campoC)campoC.inp.disabled=v;
    };

    const btnAcao=el("button","btn",modo==="entrar"?"Entrar":"Criar conta");
    if(modo==="criar")btnAcao.disabled=true;
    const btnGoogle=el("button","btn btn-ghost","Entrar com Google");

    btnAcao.onclick=async()=>{
      const email=inpEmail.value.trim(),senha=campoS.inp.value;
      if(!email){msg.className="hint msg-erro";msg.textContent="Digita seu e-mail.";return;}
      if(!senha){msg.className="hint msg-erro";msg.textContent="Digita sua senha.";return;}
      if(modo==="criar"&&!formValido()){msg.className="hint msg-erro";msg.textContent="Confere as regras da senha acima.";return;}
      msg.className="hint";
      trava(true);
      if(modo==="entrar"){
        btnAcao.textContent="Entrando…";
        const r=await entrarComSenha(email,senha);
        if(r.ok)location.reload();          // sessão nova — recarrega pra sincronizar tudo
        else{msg.className="hint msg-erro";msg.textContent=traduzErroSupabase(r.erro);btnAcao.textContent="Entrar";trava(false);}
      }else{
        btnAcao.textContent="Criando conta…";
        const r=await criarConta(email,senha);
        if(!r.ok){msg.className="hint msg-erro";msg.textContent=traduzErroSupabase(r.erro);btnAcao.textContent="Criar conta";trava(false);return;}
        if(r.precisaConfirmar){emailPendente=email;render();}
        else setTimeout(()=>location.reload(),1200);
      }
    };
    btnGoogle.onclick=async()=>{
      trava(true);msg.className="hint";msg.textContent="Redirecionando…";
      const r=await entrarComGoogle();
      if(!r.ok){msg.className="hint msg-erro";msg.textContent=traduzErroSupabase(r.erro);trava(false);}
    };

    container.append(el("h4","",modo==="entrar"?"Entrar":"Criar conta"),wrapEmail,campoS.wrap);

    if(modo==="criar"){
      campoC=campoSenha("Confirmar senha","conta-senha-conf","new-password");
      regraTam=el("p","regra-senha","");
      regraConf=el("p","regra-senha","");
      campoS.inp.oninput=atualizaRegras;
      campoC.inp.oninput=atualizaRegras;
      container.append(campoC.wrap,regraTam,regraConf);
      atualizaRegras();
    }else{
      const linkEsqueci=el("a","","Esqueci minha senha");linkEsqueci.href="#";linkEsqueci.id="conta-link-esqueci";
      linkEsqueci.onclick=async e=>{
        e.preventDefault();
        const email=inpEmail.value.trim();
        if(!email){msg.className="hint msg-erro";msg.textContent="Digita seu e-mail primeiro.";return;}
        trava(true);msg.className="hint";msg.textContent="Enviando…";
        const r=await enviarRecuperacaoSenha(email);
        msg.className="hint "+(r.ok?"msg-ok":"msg-erro");
        msg.textContent=r.ok?"Link de recuperação enviado. Confira seu e-mail.":traduzErroSupabase(r.erro);
        trava(false);
      };
      container.append(linkEsqueci);
    }

    container.append(btnAcao,el("p","hint","ou"),btnGoogle,msg);

    const linkModo=el("p","conta-modo-link","");
    const link=el("a","",modo==="entrar"?"Criar conta":"Já tenho conta");link.href="#";link.id="conta-link-modo";
    link.onclick=e=>{e.preventDefault();modo=modo==="entrar"?"criar":"entrar";render();};
    linkModo.append(modo==="entrar"?"Não tem conta? ":"Já tem conta? ",link);
    container.appendChild(linkModo);

    if(modo==="criar"){
      const linkTermos=el("a","","Termos de Uso");linkTermos.href="#";linkTermos.id="conta-link-termos";
      const linkPriv=el("a","","Política de Privacidade");linkPriv.href="#";linkPriv.id="conta-link-privacidade";
      linkTermos.onclick=e=>{e.preventDefault();screenTermos();};
      linkPriv.onclick=e=>{e.preventDefault();screenPrivacidade();};
      const nota=el("p","hint termos-nota","Ao criar conta, você concorda com os ");
      nota.append(linkTermos," e a ",linkPriv,".");
      container.appendChild(nota);
    }
  }

  render();
}

/* Roda toda vez que a caixa de conta aparece (fim de carreira). Se não
   tem sessão, não faz nada (devolve null, mostra o formulário de
   login/cadastro). Se tem — sessão nova de login/cadastro, do Google,
   ou sessão antiga que o Supabase já mantinha — sincroniza os dois
   lados: sobe o que só
   existe local (upsert, idempotente — pode rodar toda vez sem duplicar
   nem precisar de flag "já migrei"), baixa o que só existe na nuvem
   (outro aparelho). Nunca apaga localStorage, só soma. */
async function sincronizarConquistasNaNuvem(){
  const sb=getSupabase();
  if(!sb)return null;
  let session;
  try{ ({data:{session}}=await sb.auth.getSession()); }catch(e){ return null; }
  if(!session)return null;
  const userId=session.user.id;
  try{
    const locais=[...CONQUISTAS_DESBLOQUEADAS];
    if(locais.length){
      const linhas=locais.map(id=>({user_id:userId,conquista_id:id}));
      await sb.from("conquistas_usuario").upsert(linhas,{onConflict:"user_id,conquista_id",ignoreDuplicates:true});
    }
    const{data:remotas}=await sb.from("conquistas_usuario").select("conquista_id").eq("user_id",userId);
    if(remotas){
      let mudou=false;
      remotas.forEach(r=>{if(!CONQUISTAS_DESBLOQUEADAS.has(r.conquista_id)){CONQUISTAS_DESBLOQUEADAS.add(r.conquista_id);mudou=true;}});
      if(mudou)salvarConquistas();
    }
  }catch(e){/* sincronização falhou (rede, RLS, o que for) — localStorage
    continua valendo, o jogador não perde nada por isso */}
  return session.user.email;
}

/* Histórico de carreiras (2026-09-09) — mesmo padrão de conquistas:
   localStorage sempre, conta sincroniza por cima, nunca substitui.
   `seed` já é único por carreira (mesmo número do link de desafio),
   serve de chave sem precisar de id novo. */
function lerCarreirasLocais(){
  try{ const v=JSON.parse(localStorage.getItem("carreiras")); return Array.isArray(v)?v:[]; }
  catch(e){ return []; }
}
function salvarCarreiraLocal(registro){
  const lista=lerCarreirasLocais().filter(c=>c.seed!==registro.seed);
  lista.push(registro);
  try{ localStorage.setItem("carreiras",JSON.stringify(lista)); }catch(e){}
}
async function sincronizarCarreirasNaNuvem(){
  const sb=getSupabase();
  if(!sb)return;
  let session;
  try{ ({data:{session}}=await sb.auth.getSession()); }catch(e){ return; }
  if(!session)return;
  const userId=session.user.id;
  try{
    const locais=lerCarreirasLocais();
    if(locais.length){
      const linhas=locais.map(c=>({user_id:userId,seed:c.seed,nome_lutador:c.nome,
        cartel:c.cartel,nota:c.nota,concluida_em:c.data}));
      await sb.from("carreiras_usuario").upsert(linhas,{onConflict:"user_id,seed",ignoreDuplicates:true});
    }
    const{data:remotas}=await sb.from("carreiras_usuario")
      .select("seed,nome_lutador,cartel,nota,concluida_em").eq("user_id",userId);
    if(remotas){
      const atuais=lerCarreirasLocais();
      const seedsConhecidos=new Set(atuais.map(c=>c.seed));
      let mudou=false;
      remotas.forEach(r=>{
        if(!seedsConhecidos.has(r.seed)){
          atuais.push({seed:r.seed,nome:r.nome_lutador,cartel:r.cartel,nota:r.nota,data:r.concluida_em});
          mudou=true;
        }
      });
      if(mudou)try{ localStorage.setItem("carreiras",JSON.stringify(atuais)); }catch(e){}
    }
  }catch(e){/* sincronização falhou — localStorage continua valendo */}
}

/* Timestamp (ms), não segundos: rate limit (429) é ESPERADO com tráfego
   real, não exceção — pausa com espera, não desliga a carreira inteira por
   causa de 60s ruins. 60000 é chute inicial, não medido — não sei a janela
   real do limite do OpenRouter nesse plano; se 429 continuar comum mesmo
   com a pausa, é isso que precisa remedir, não o desenho. */
const AI_PAUSA_MS=60000;

/* Circuito PRÓPRIO do feed (2026-09-11) — até aqui, feed era o ÚLTIMO kind
   que ainda desistia da carreira inteira (`aiVivo=false`, sem religar):
   2 falhas de rede seguidas OU 1 erro `transitorio:false`, e nenhuma luta
   mais teria linha de repercussão, do início ao fim. Achado jogando — 3
   lutas seguidas sem feed, luta 1 e 3 eram nocaute (deveriam furar o
   throttle par/finish em `finalizarLuta()`, e furavam: a condição
   `fightNo%2===0||finish0` estava certa, não era o bug). O bug real era
   este: bastava 1 falha ruim bem no início da carreira pra `aiVivo` cair
   e nunca mais voltar — o "desliga pra sempre" que já tinha sido corrigido
   pro evento (2026-09-07) e pro dilema/julgar (2026-09-09) nunca chegou
   no feed, porque a suposição da época ("feed é decorativo, cai em molde
   local sem o jogador notar") continuava parecendo verdade — só que
   deixou de ser: o jogador SENTE falta das 3 falas de torcedor depois do
   resultado, mesmo sendo cosmético. Mesmo padrão do evento: falha vira
   PAUSA por `AI_PAUSA_MS`, nunca desligamento permanente — feed volta
   sozinho depois da janela, sem religar manual. */
let feedPausadoAte=0;
let feedFalhasSeguidas=0;

/* Circuito PRÓPRIO do evento (2026-09-07) — achado medindo 20 carreiras
   reais: 3/20 perderam TODOS os eventos por causa de uma falha comum de
   rede, porque evento não tem molde local (decisão explícita, sem
   fallback) — o desligamento permanente que era invisível no feed virou
   "carreira inteira sem evento nenhum". Mesmo remédio que o feed ganhou
   depois: PAUSA por `AI_PAUSA_MS`, nunca desligamento permanente. */
let eventoPausadoAte=0;
let eventoFalhasSeguidas=0;

/* Circuito PRÓPRIO de dilema+julgar (2026-09-09), nunca o de feed — achado
   medindo com ritmo REALISTA (>60s entre chamadas, cada uma rede fresca):
   67% dos dilemas perdiam consequência (8 de 12, 3 carreiras reais). O
   circuito compartilhado antigo piorava isso — uma pausa de 60s disparada
   por FEED (decorativo, três comentários de torcedor) bloqueava dilema (a
   ÚNICA coisa que o jogador escreve) pelo mesmo tempo. Mesmo raciocínio já
   aplicado ao evento: feed pode desistir de vez, dilema/julgar não podem
   morrer junto com ele nem esperar a pausa dele passar.

   REGRA À PARTE, mais forte que a do evento: JULGAR NUNCA RESPEITA A
   PAUSA. Se a cena já apareceu na tela, o jogador já escreveu a resposta
   — pausar o julgamento no meio é exatamente o "você seguiu em frente e
   nada aconteceu" que motivou a investigação inteira. Só `dilema` (a
   GERAÇÃO da cena, ainda ANTES de existir resposta do jogador) respeita
   a pausa e cai no fallback local sem tentar rede. Os dois ainda
   ATUALIZAM o mesmo contador de falha — um julgar que falhar pode pausar
   o PRÓXIMO `dilema`, só nunca pausa A SI MESMO. */
let dilemaPausadoAte=0;
let dilemaFalhasSeguidas=0;

async function ai(kind,data,ms=9500){
  /* Achado jogando: "aceito" (dilema binário comum) caiu no fallback
     genérico, e não tinha como saber POR QUÊ — ai() sempre devolvia null
     pelos mesmos 5 motivos possíveis, indistinguíveis de fora. Investigado
     na hora: nem piso de tamanho (não existe nenhum), nem falso positivo
     de CONTEUDO_INSEGURO (testado, nenhuma das frases curtas bate), nem
     falha de classificação (reproduzido ao vivo com a cena e resposta
     exatas, funcionou normal) — sobrou circuito aberto (aiVivo/pausa), o
     que bate com 429 tendo aparecido em 2 de 6 chamadas na medição. Este
     evento não conserta nada sozinho, mas da próxima vez dá pra saber
     qual dos 5 caminhos foi, em vez de reconstruir por eliminação. */
  if(!AI_URL){evento("ia_null",{motivo:"sem_url",kind});return null;}
  const ehEvento=kind==="evento";
  const ehDilema=kind==="dilema"||kind==="julgar";
  const ehJulgar=kind==="julgar";
  if(ehEvento){
    if(Date.now()<eventoPausadoAte){evento("ia_null",{motivo:"pausado",kind});return null;}
  }else if(ehDilema){
    if(!ehJulgar&&Date.now()<dilemaPausadoAte){evento("ia_null",{motivo:"pausado",kind});return null;}
  }else{
    // só "feed" chega aqui (os outros 3 kinds têm circuito próprio, acima)
    if(Date.now()<feedPausadoAte){evento("ia_null",{motivo:"pausado",kind});return null;}
  }
  return tentarChamadaIA(kind,data,ms,ehEvento,ehDilema,true);
}
/* Extraído de ai() pra existir a retentativa (abaixo) sem duplicar a
   chamada de fetch inteira. podeRetentar=false na 2ª tentativa — nunca
   mais que 1 retry, senão um pool congestionado vira loop de espera. */
async function tentarChamadaIA(kind,data,ms,ehEvento,ehDilema,podeRetentar){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms);
  try{
    const r=await fetch(AI_URL,{method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({kind,data})});
    clearTimeout(t);
    if(ehEvento)eventoFalhasSeguidas=0; else if(ehDilema)dilemaFalhasSeguidas=0; else feedFalhasSeguidas=0;
    if(!r.ok){
      /* O servidor já sabe o que aconteceu — não adivinha por status HTTP
         externo (502 cobre seis coisas diferentes, ver api/ai.js). Corpo
         pode não vir (resposta não-JSON de algum proxy no meio do caminho)
         ou pode faltar "transitorio" (deploy do client mais novo que o do
         servidor) — nos dois casos não desliga nada, só essa chamada
         falhou. */
      let corpo=null;
      try{corpo=await r.json();}catch(e){}
      if(corpo&&corpo.status===429){
        /* Retentativa única, só em 429, só dilema/julgar — pedido depois
           de medir 67% de fallback, mesmo padrão já usado no evento pra
           JSON malformado. Espera curta (2s, não AI_PAUSA_MS inteiro):
           429 no pool compartilhado costuma ser blip momentâneo, uma
           segunda tentativa logo depois tem chance real de sair fora da
           MESMA janela de limite. */
        if(ehDilema&&podeRetentar){
          await new Promise(res=>setTimeout(res,2000));
          return tentarChamadaIA(kind,data,ms,ehEvento,ehDilema,false);
        }
        if(ehEvento)eventoPausadoAte=Date.now()+AI_PAUSA_MS;
        else if(ehDilema)dilemaPausadoAte=Date.now()+AI_PAUSA_MS;
        else feedPausadoAte=Date.now()+AI_PAUSA_MS;
        evento("ia_null",{motivo:"429",kind});
      }else if(corpo&&corpo.transitorio===false){
        /* erro_permanente (chave, crédito, permissão) NUNCA desliga pra
           sempre em nenhum kind agora, feed incluso (2026-09-11) — só
           pausa. Continuar tentando de qualquer jeito, mesmo sabendo que
           é "permanente" pro estado atual da conta, é seguro: quem
           resolve o problema (troca a chave, recarrega crédito) resolve
           fora do jogo, e a próxima janela de pausa já volta tentando de
           novo sozinha, sem precisar de reload. */
        if(ehEvento)eventoPausadoAte=Date.now()+AI_PAUSA_MS;
        else if(ehDilema)dilemaPausadoAte=Date.now()+AI_PAUSA_MS;
        else feedPausadoAte=Date.now()+AI_PAUSA_MS;
        evento("ia_null",{motivo:"erro_permanente",kind});
      }else evento("ia_null",{motivo:"erro_transitorio",kind});
      return null;
    }
    const j=await r.json();
    return j.result??null;
  }catch(e){
    clearTimeout(t);
    if(ehEvento){
      eventoFalhasSeguidas++;
      if(eventoFalhasSeguidas>=2)eventoPausadoAte=Date.now()+AI_PAUSA_MS;
    }else if(ehDilema){
      dilemaFalhasSeguidas++;
      if(dilemaFalhasSeguidas>=2)dilemaPausadoAte=Date.now()+AI_PAUSA_MS;
    }else{
      feedFalhasSeguidas++;
      if(feedFalhasSeguidas>=2)feedPausadoAte=Date.now()+AI_PAUSA_MS;
    }
    evento("ia_null",{motivo:"rede",kind});
    return null;
  }
}
const lim=(v,lo,hi,def)=>{const n=Number(v);
  return Number.isFinite(n)?Math.max(lo,Math.min(hi,n)):def;};

/* Analytics nunca pode derrubar a carreira de ninguém — mesmo princípio de
   áudio/localStorage. window.va existe sempre (stub no <head>, ver
   comentário lá) mas só vira a função de verdade se Analytics estiver
   ligado no projeto; se não estiver, script.js dá 404 e window.va fica
   sendo o stub que só enfileira sem nunca ler — sem custo, sem quebra. */
function evento(nome,dados){
  try{window.va&&window.va("event",{name:nome,data:dados});}catch(e){}
}
/* Marca de tempo no carregamento do script — praticamente o mesmo instante
   de evento("abriu") em boot(), sem depender do await de fetch() lá dentro
   atrasar a marcação. É contra ela que terminou_luta_1 mede quanto tempo
   passa até a primeira luta acabar (PLANO-LANCAMENTO.md fase 2). */
const TEMPO_ABERTURA=Date.now();

/* busca antecipada: dispara quando a luta COMEÇA e resolve durante a
   narração, que dura uns 12 segundos. Latência percebida vai a zero. */
let feedPromise=null;
function prefetchFeed(r,won,opp,titleFight,myKd,oppKd,upset){
  feedPromise=ai("feed",{name:me.name,opp:opp.name,won,method:r.method,
    round:r.round,clock:r.clock,myKd,oppKd,title:titleFight,upset,
    record:`${st.wins}-${st.losses}`,followers:fmtNum(st.followers)});
}
async function resolveFeed(fallback,rng){
  const got=await(feedPromise||Promise.resolve(null));
  feedPromise=null;
  if(!Array.isArray(got)||got.length===0)return fallback;
  return got.slice(0,4).map(o=>{
    const p=persona(rng);
    if(o&&typeof o.nome==="string"&&o.nome.trim())
      {p.name=o.nome.trim().slice(0,14);p.initials=p.name.slice(0,2).toUpperCase();}
    return{p,text:String(o&&o.texto||"").slice(0,180)||"..."};
  }).filter(t=>t.text!=="...");
}

/* Memória ENTRE carreiras (2026-09-08): achado jogando — sorteio sem
   reposição e "recentes" (abaixo) só valem DENTRO de uma carreira; toda
   carreira nova reembaralha do zero, então o mesmo tema (ou, pro
   fallback local, o mesmo texto fixo) pode voltar na carreira seguinte.
   Quem joga várias carreiras seguidas via isso de verdade — inclusive um
   caso de eco palavra por palavra do fallback local, só 3 itens sem
   histórico nenhum (nem dentro da carreira). Guarda só IDENTIFICADOR
   (tema ou título), nunca o texto inteiro — localStorage é pequeno e
   não precisa do conteúdo pra evitar repetir. Tamanho da memória é
   PROPORCIONAL ao pool (60%), não um número fixo: pool pequeno (ex. 8
   itens) com memória fixa grande (ex. 30) bloquearia a cartela inteira
   e o sorteio ficaria sem opção livre pra escolher — 60% garante que
   sempre sobra pelo menos 40% do pool livre. */
function lerMemoriaEntreCarreiras(chave){
  try{
    const v=JSON.parse(localStorage.getItem(chave));
    return Array.isArray(v)?v:[];
  }catch(e){ return []; }
}
function marcarMemoriaEntreCarreiras(chave,id,tamanhoMax){
  const lista=lerMemoriaEntreCarreiras(chave).filter(x=>x!==id);
  lista.push(id);
  while(lista.length>tamanhoMax)lista.shift();
  try{ localStorage.setItem(chave,JSON.stringify(lista)); }catch(e){}
}
/* Cartela nova pra carreira: itens que JÁ estão na memória entre
   carreiras vêm por ÚLTIMO (embaralhados entre si), não são excluídos —
   deprioriza sem nunca deixar a cartela sem opção, mesmo se a memória
   um dia cobrir o pool inteiro (não deveria, é o que os 60% evitam). */
function cartelaComMemoria(pool,rng,chave,tamanhoMax){
  const vistos=new Set(lerMemoriaEntreCarreiras(chave));
  const embaralhar=arr=>{
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor((rng?rng():Math.random())*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  };
  const livres=pool.filter(x=>!vistos.has(x)),usados=pool.filter(x=>vistos.has(x));
  /* quem consome (proximoTema()/proximoDilemaSeed()/proximoDilemaFallback())
     tira do FIM com .pop() — "usados" (memória recente) precisa ficar no
     COMEÇO do array (índice baixo) pra ser consumido POR ÚLTIMO; "livres"
     no fim, consumido primeiro. Inverter isso faria o oposto do
     pretendido: priorizar quem acabou de aparecer. */
  return [...embaralhar(usados),...embaralhar(livres)];
}

/* Temas do evento — mesma ideia do SEEDS do dilema (ver abaixo): sortear
   um tema e MANDAR pro prompt, em vez de listar as opções e confiar que o
   modelo varia sozinho. Medido (2026-09-06, 40 chamadas reais sem tema
   forçado): 42% dos textos saíam com o mesmo esqueleto ("vídeo/clipe
   viraliza, família ou empresário reage") — o prompt só SUGERIA os temas,
   sem forçar nenhum por chamada, e o modelo convergia pro que "imprensa/
   redes sociais" sozinho já cobria. eventoRng é stream próprio (mesmo
   motivo do escolhaRng/lesaoRng — nunca desloca rng principal). */
const EVENTO_TEMAS=["imprensa","dinheiro","família","rotina de treino",
  "patrocínio","redes sociais","saúde leve (nada grave)","vida pessoal",
  "reação do público","bastidor da academia"];
/* Sorteio SEM reposição, não com reposição: com 10 temas e só ~18 lutas
   elegíveis/carreira, sortear cada vez do zero podia repetir um tema
   cedo (ex. duas vezes em 5 lutas) por puro acaso — não é a repetição
   DENTRO do tema que foi medida (essa é o modelo, ver
   st.eventosRecentes abaixo), mas é uma repetição EVITÁVEL de graça: os
   10 primeiros sorteios de qualquer carreira são garantidos diferentes.
   st.temasRestantes é a "cartela" da carreira, embaralhada uma vez com
   eventoRng e consumida um a um; reembaralha (nova cartela) só quando
   esgota — então o 11º tema pode repetir um dos 10 primeiros, mas nunca
   antes disso. */
const MEM_EVENTO_TEMAS=Math.round(EVENTO_TEMAS.length*.6);
function proximoTema(){
  if(!st.temasRestantes||!st.temasRestantes.length){
    st.temasRestantes=cartelaComMemoria(EVENTO_TEMAS,eventoRng,"memTemasEvento",MEM_EVENTO_TEMAS);
  }
  const tema=st.temasRestantes.pop();
  marcarMemoriaEntreCarreiras("memTemasEvento",tema,MEM_EVENTO_TEMAS);
  return tema;
}

/* Evento de vida a cada luta (substitui o pool fixo de 28 frases, que
   repetia entre carreiras — ver o bloco "EVENTOS DE VIDA" logo acima de
   RARE). SEM FALLBACK LOCAL, de propósito: se a chamada falhar ou o
   filtro esvaziar o texto, a luta passa sem evento — nenhuma frase de
   reserva, nenhum número inventado (RARE, acima em sortearRaro(), continua
   cobrindo o fora-da-curva, local e síncrono, sem depender da IA).
   Assíncrono e não bloqueia nextFight() nem a tela — mesmo padrão do
   feed (prefetchFeed/resolveFeed): aparece quando fica pronto, sem
   spinner, sem pausa; se o jogador já avançou pra próxima luta antes de
   resolver, o efeito em st.eventoMod só vale a partir da luta seguinte
   (lutadorEfetivo() da luta em andamento já foi lido antes disso). */
const ATTRS_EVENTO=["slpm","strDef","tdAvg","tdDef","subAvg","kdAvg","durability"];
async function dispararEventoIA(bouts,opp,r){
  const tema=proximoTema();
  /* Medido 2026-09-06: forçar o tema resolveu o COLAPSO ENTRE temas (42%
     convergindo pra "vídeo viraliza" mesmo quando o tema pedido era
     outro) — mas não resolve repetição DENTRO do mesmo tema: o modelo
     tem uma história "padrão" pra cada tema e a repete quase igual
     quando o tema volta na mesma carreira. st.eventosRecentes guarda os
     últimos 3 textos já mostrados; vão no prompt pra evitar repetir a
     mesma situação.

     Contexto de carreira (posicao/lesao/perdeuCinturao/dinheiro): pedido
     depois de medir que 40 chamadas isoladas não é a experiência do
     jogador (ele vê 1 evento por luta, ao longo de ~40 minutos — duas
     lutas de intervalo não incomoda do jeito que 40 lado a lado
     parecem). Evento ANCORADO no que está acontecendo de verdade
     (posição no ranking, se tá machucado, se acabou de perder o
     cinturão) tem menos espaço de sobra pra cair na resposta genérica
     "padrão" do tema — repete menos por construção, não por instrução. */
  const pos=posicaoDivisao();
  const dados={name:me.name,record:`${st.wins}-${st.losses}`,
    followers:fmtNum(st.followers),fan:st.fan.toFixed(1),
    ganhou:st.lastWon,metodo:st.lastMethod,round:st.lastRound,nocaute:st.lastKO,
    streakW:st.streakW,streakL:st.streakL,title:!!st.title,
    fightNo,totalFights:TOTAL_FIGHTS,tema,recentes:(st.eventosRecentes||[]).slice(-3),
    posicao:pos?`#${pos.n} de ${pos.de}`:null,
    lesao:st.lesao?`${ROTULO_ATTR[st.lesao.atributo]||st.lesao.atributo} machucado(a)`:null,
    perdeuCinturaoAgora:st.perdeuCinturaoNaLuta===fightNo,
    dinheiro:fmtNum(st.dinheiro||0)};
  let j=await ai("evento",dados);
  /* Medido: 10% das respostas vêm com ok:true mas sem o campo "texto" no
     JSON (a IA às vezes não obedece o formato pedido). Uma retentativa
     antes de desistir da luta — custo é 1 chamada extra em ~10% das ~18
     lutas elegíveis/carreira, ~1,8 chamada a mais por carreira. Só pra
     ESTE caso (json malformado); falha de rede/429/erro do servidor NÃO
     tenta de novo aqui — ai() já tem sua própria disciplina de pausa/
     desligamento pra essas, insistir por cima seria gastar chamada
     fadada a repetir o mesmo erro. */
  if(j&&!j.texto)j=await ai("evento",dados);
  if(!j||!j.texto)return;
  /* Medido: a instrução "não repita" em cima de "recentes" ajuda mas não
     é garantia — o modelo às vezes ecoa um dos recentes quase palavra
     por palavra mesmo assim (achado: pedido explícito de não repetir, e
     saiu idêntico ao 1º evento de novo no 3º). Rede de baixo igual às
     outras (CONTEUDO_INSEGURO/RESULTADO_LUTA): não confia só na
     instrução, verifica e descarta — sem fallback, a luta passa sem
     evento igual qualquer outra falha. */
  if((st.eventosRecentes||[]).some(r=>r.toLowerCase()===String(j.texto).toLowerCase()))return;
  /* CONTEUDO_INSEGURO continua (rede de baixo pra conteúdo impróprio,
     igual ao dilema) — RESULTADO_LUTA NÃO se aplica aqui, de propósito
     (corrigido 2026-09-06). Esse filtro foi desenhado pra impedir o
     desfecho do DILEMA de afirmar o resultado de uma luta que ainda vai
     acontecer (contradizer o motor). Evento narra uma luta que JÁ
     terminou — "o clipe do nocaute viralizou" é um FATO conhecido, não
     uma previsão, e o filtro cortava a frase inteira mesmo assim (~8%
     dos eventos, medido). Aplicar o mesmo filtro nos dois lugares
     confundia "onde ele foi desenhado pra proteger" com "todo texto que
     a IA gera" — são problemas diferentes. */
  if(conteudoInseguro(j.texto))return;
  const texto=String(j.texto).slice(0,300).trim();
  if(!texto)return;
  bouts.appendChild(el("div","event","— "+texto));
  st.eventosRecentes=st.eventosRecentes||[];
  st.eventosRecentes.push(texto);
  if(st.eventosRecentes.length>3)st.eventosRecentes.shift();
  const atr=ATTRS_EVENTO.includes(j.atributo)?j.atributo:null;
  const mult=atr?lim(j.efeito,.90,1.10,1):1;
  tocarSom(mult>1.008?1:mult<0.992?-1:0);
  st.events++;
  if(atr&&me[atr]!=null){
    st.eventoMod=st.eventoMod||{};
    st.eventoMod[atr]=(st.eventoMod[atr]||1)*mult;
  }
  renderFicha();
}

/* ---------- dilema: o jogador escreve o que faz, a IA julga ---------- */
const SEEDS=["imprensa provocando","dinheiro curto","família cobrando",
  "lesão escondida","proposta de patrocínio duvidosa","polêmica nas redes",
  "adversário te humilhando","convite pra outro esporte","treinador querendo sair",
  "fã passando do limite","corte de peso dando errado","entrevista ao vivo"];
/* Sorteio SEM reposição, mesmo desenho de proximoTema() (evento): com 12
   tipos e só 4 dilemas por carreira, sortear cada vez do zero podia repetir
   um tipo cedo por puro acaso — st.dilemaSeedsRestantes é a cartela da
   carreira, embaralhada com dilemaRng (stream próprio, nunca o rng
   principal — sortear aqui deslocaria a sequência e o link de desafio
   antigo pararia de reproduzir os mesmos adversários) e consumida um a
   um; com só 4 sorteios por carreira, a cartela de 12 nunca esgota — os 4
   tipos de qualquer carreira são sempre diferentes entre si. */
const MEM_DILEMA_SEEDS=Math.round(SEEDS.length*.6);
function proximoDilemaSeed(){
  if(!st.dilemaSeedsRestantes||!st.dilemaSeedsRestantes.length){
    st.dilemaSeedsRestantes=cartelaComMemoria(SEEDS,dilemaRng,"memDilemaSeeds",MEM_DILEMA_SEEDS);
  }
  const seed=st.dilemaSeedsRestantes.pop();
  marcarMemoriaEntreCarreiras("memDilemaSeeds",seed,MEM_DILEMA_SEEDS);
  return seed;
}
/* Fallback local — só aparece quando a IA falha ou o texto dela é
   descartado (sem cena, conteúdo inseguro, eco de um recente). Quem vê
   isso já está numa sessão degradada, então cada cena tem que se
   sustentar SOZINHA — nenhuma cita carreira, lesão ou cinturão, porque
   o fallback não tem esse contexto disponível. Território DIFERENTE dos
   12 SEEDS de propósito (achado jogando: os 3 antigos duplicavam tema
   com "imprensa provocando"/"entrevista ao vivo" e "proposta de
   patrocínio duvidosa" — parecia versão pobre do mesmo dilema, não uma
   situação nova). Cortado desta leva: um dilema sobre esconder dor no
   peito — sintoma cardíaco real num atleta de combate não é o mesmo
   tipo de risco que uma lesão de queixo ou joelho (que têm mecânica
   própria pra dar consequência, ver LESAO_TIPOS/CHANCE_LESAO_NOCAUTE);
   esse especificamente premiava esconder o sintoma, sem trava nenhuma
   no julgar depois. */
const DILEMA_LOCAL=[
 {titulo:"Parceiro de treino de olho na sua vaga",cena:"Seu parceiro de treino, o mesmo peso, vem ganhando confiança demais nos últimos rounds de sparring. Ele comentou, meio de brincadeira, que também merecia uma chance como a sua."},
 {titulo:"O amigo de infância na aba",cena:"Um amigo de infância te chamou de lado, sem graça, pra pedir um empréstimo que ele nunca te pediu antes. Ele jurou que devolve, do jeito que sempre jura."},
 {titulo:"Convite pra virar rosto de marca",cena:"Uma agência quer você posando pra uma campanha de roupa, nada a ver com luta. O dinheiro é bom e a exposição também, mas não é assim que você imaginou aparecer."},
 {titulo:"Rumor no vestiário",cena:"Um preparador de outra academia comentou, baixinho, que viu algo estranho no protocolo do próximo adversário. Ele não teria motivo pra inventar isso, mas também não tem prova nenhuma."},
 {titulo:"Câmera querendo te seguir",cena:"Uma produtora quer gravar sua rotina pra um documentário, câmera dentro da academia e tudo. Parece bom pro nome, mas ninguém ali costuma treinar sendo filmado."},
 {titulo:"Festa na véspera errada",cena:"O casamento de um amigo caiu bem na pior semana possível pra sair de casa. Todo mundo vai entender se você faltar, e todo mundo vai notar do mesmo jeito."},
 {titulo:"O primo com ideia",cena:"Seu primo apareceu com um plano de abrir uma academia com seu nome. Ele quer que você entre com tudo e não trouxe nenhum papel."},
 {titulo:"Técnico querendo mudar seu estilo",cena:"Seu técnico decidiu, do nada, que sua base inteira está errada e quer refazer sua postura da estaca zero, a poucas semanas de qualquer coisa. Ele jura que é pro seu bem, mas parece mais experimento do que plano."},
];
const MEM_DILEMA_LOCAL=Math.round(DILEMA_LOCAL.length*.6);
/* Sem reposição + memória entre carreiras, mesmo tratamento do resto —
   o fallback não tinha NENHUM histórico antes (nem dentro da carreira),
   com só 3 itens isso significava ~33% de chance de repetir palavra por
   palavra a cada vez que disparava. */
function proximoDilemaFallback(){
  if(!st.dilemaFallbackRestante||!st.dilemaFallbackRestante.length){
    const ordem=cartelaComMemoria(DILEMA_LOCAL.map(d=>d.titulo),dilemaRng,"memDilemaFallback",MEM_DILEMA_LOCAL);
    st.dilemaFallbackRestante=ordem.map(t=>DILEMA_LOCAL.find(d=>d.titulo===t));
  }
  const d=st.dilemaFallbackRestante.pop();
  marcarMemoriaEntreCarreiras("memDilemaFallback",d.titulo,MEM_DILEMA_LOCAL);
  return d;
}

/* O lim() trava número que a IA devolve; isto trava TEXTO no mesmo espírito
   — a IA nunca é dependência. O desfecho do dilema é sobre a vida FORA do
   octógono; nenhum resultado de luta é dela pra afirmar, quem decide isso é
   o motor (ver api/ai.js, prompt de "julgar"). Corta só a FRASE que ofende,
   não o desfecho inteiro — perder a narração toda por causa de uma frase
   sai caro. CONTEXTO_TREINO existe porque um dilema pode ser sobre sparring
   ou o desempenho de outra pessoa (parceiro de treino, adversário no
   passado) sem afirmar nada da carreira do jogador — "nocauteou o parceiro
   no sparring" não pode cair aqui. Medido em 40 desfechos reais da IA: 5%
   das frases batem, sem falso positivo nos casos de terceiro.

   Dois buracos achados jogando, fechados depois: "venceu por KO" (sem a
   palavra nocaute) e "o médico parou a luta"/"a médica interrompeu"
   (resultado afirmado sem a palavra árbitro). `ko` sozinho na alternação
   basta — o \b da regex inteira já impede grudar em outra palavra ("KOch"
   não bate). O padrão de médico é restrito a "parou/interrompeu/
   encerrou/deteve" logo depois, de propósito — "menção a médico" sozinha
   sem isso (curativo de rotina, check-up) não pode virar corte.
   `node testar.js resultado` cobre os dois buracos e 6 controles. */
const RESULTADO_LUTA=/\b(nocaute\w*|ko|finaliz\w*(ou|ad[oa])|foi parad[oa] pelo árbitro|médic[oa]\s+(da comissão\s+)?(parou|interrompeu|encerrou|deteve)|perdeu (a luta|o combate) por|venceu (a luta|o combate) por|(saiu|saí)\s+d[oa]\s+(oct[aáoó]gono|tatame|ringue)\s+(carregad\w*|derrotad\w*|chorando)|decis[ãa]o\s+(un[âa]nime|dividida|majorit[áa]ria))\b/i;
const CONTEXTO_TREINO=/\b(sparring|trein\w*)\b/i;
function semResultadoDeLuta(texto){
  const frases=String(texto).split(/(?<=[.!?])\s+/).filter(Boolean);
  const mantidas=frases.filter(f=>!(RESULTADO_LUTA.test(f)&&!CONTEXTO_TREINO.test(f)));
  return mantidas.join(" ").trim();
}

/* A DEFESA PRINCIPAL É A INSTRUÇÃO NO PROMPT (api/ai.js, "julgar" e VOZ) —
   isto aqui é REDE DE BAIXO, não o freio. RESULTADO_LUTA funciona por regex
   porque o vocabulário de "quem venceu a luta" é fechado (nocaute, decisão,
   finalização — um punhado de palavras). Automutilação, violência gráfica e
   conteúdo sexual não têm vocabulário fechado: a IA narra a mesma coisa com
   outra palavra, eufemismo, ou outra língua, e o regex não pega. Por isso
   ESTE filtro não mira falso positivo baixo como o RESULTADO_LUTA (~5%) —
   mira pegar tudo que puder, aceitando gastar desfecho legítimo se precisar.
   Dispara em dois pontos: no texto do JOGADOR, antes de sequer chamar a IA
   (mais barato, e não depende da IA ter obedecido a instrução); e no
   "desfecho" que a IA devolve, como rede pro que passar da instrução. Se
   disparar em qualquer um dos dois, a resposta inteira da IA é descartada —
   não só o texto: um "j" que narrou isso não é confiável em nenhum campo,
   número incluso. */
/* Achado medindo direto contra produção (2026-09-11): a versão anterior
   ("cort" + qualquer parte do corpo dentro de 25 caracteres, nas duas
   ordens) disparava em texto de dilema completamente comum — "corte feio
   na perna", "cortei a mão treinando", "corte no braço" são vocabulário
   de ROTINA de MMA (o esporte é sobre apanhar corte), não indício de
   automutilação. Medido: 5 de 12 respostas de dilema plausíveis (todas
   mencionando corte/lesão de treino ou luta, nenhuma remotamente insegura)
   bloqueadas ANTES de a IA sequer ser chamada — 41,7%, contra as 40
   frases benignas antigas que nunca continham essa combinação e por isso
   nunca pegaram esse buraco. Esse bloqueio não passa por ai(), não gera
   `evento("ia_null",...)` — é invisível pra instrumentação que existe,
   diferente dos outros motivos de fallback.

   Conserto: só dispara SEM exigir "fora" quando a parte do corpo é pulso
   ou veia — as únicas da lista que não têm uso corriqueiro de MMA (luta
   não produz corte de pulso/veia como vocabulário normal, self-harm
   sim). "mãos/braços/pernas/dedos/membros" (as que colidem com
   vocabulário de luta) só disparam junto de "fora" (cortar X FORA é
   mutilação, nunca é como se descreve um corte de treino ou sparring).
   Reflexivo "me/se cort-" ("eu me corto", "ele se cortou") cobre o caso
   sem parte do corpo nenhuma, sem depender da lista.

   Isso ESTREITA a rede de baixo pra caber o jogo: "eu corto meus braços"
   (primeira pessoa, sem "fora", sem reflexivo) deixaria de disparar por
   aqui — cenário real de risco que a versão antiga pegava e esta não.
   A defesa PRINCIPAL continua sendo o prompt em api/ai.js (ver comentário
   acima), não este regex; isto é rede de baixo, e uma rede de baixo que
   quebra o próprio jogo na maioria das respostas normais não está
   protegendo ninguém, só empurrando o jogador pro fallback genérico
   toda vez que descreve um corte de luta — o caso mais comum do gênero. */
const CONTEUDO_INSEGURO=/\b(automutila\w*|mutila\w*|amputa\w*|decepa\w*|cutelo|suicid\w*|se\s+matar|tirar\s+a\s+(própria\s+)?vida|overdose\s+proposital|esfaquea\w*|estrangula\w*|tortura\w*|degola\w*|desmembra\w*|estupr\w*|abus\w*\s+sexual|(me|se)\s+cort\w*|cort\w*.{0,20}(pulsos?|veias?)|(pulsos?|veias?).{0,20}cort\w*|cort\w*.{0,20}(mãos?|braços?|pernas?|dedos?|membros?)\s+fora)/i;
function conteudoInseguro(texto){
  return CONTEUDO_INSEGURO.test(String(texto||""));
}
/* Fallback quando j vem nulo — filtro local (antes da chamada), rede pós-
   chamada pegando o desfecho da IA, ou falha de rede pura: as três causas
   caem aqui, indistinguíveis entre si de propósito. O que não pode
   acontecer é UMA FRASE SÓ, sempre igual — isso vira assinatura do filtro
   tão forte quanto a que já foi resolvida do lado da IA (ver LEIA-ME
   "Conteúdo inseguro no dilema"). Em segunda pessoa, igual sempre foi —
   não confundir com o texto neutro que a própria IA gera (terceira
   pessoa) quando é ELA quem decide neutralizar. */
/* Terceira pessoa de propósito — o desfecho REAL da IA (aplicarDilema()) e o
   próprio molde neutro dela (api/ai.js, prompt de "julgar") narram na
   terceira pessoa. Se este fallback local ficasse em segunda ("Você..."),
   ficaria distinguível dos dois outros por pronome só — a mesma assinatura
   de filtro, só mais sutil. Ver LEIA-ME "Conteúdo inseguro no dilema". */
const FALLBACK_NEUTRO=[
  n=>`${n} mudou de assunto e ninguém insistiu.`,
  n=>`${n} deu de ombros e voltou pro treino, sem clima.`,
  n=>`A pergunta ficou no ar e a pauta virou outra coisa.`,
  n=>`${n} não se estendeu no assunto e a rotina seguiu igual.`,
  n=>`${n} respondeu por cima e a semana passou sem barulho.`,
  n=>`Ninguém comentou mais nada e a rotina continuou normal.`,
  n=>`${n} ficou na sua e nada mais aconteceu por causa disso.`,
  n=>`${n} desconversou e a entrevista seguiu andando.`,
];
function fraseFallback(){
  const f=FALLBACK_NEUTRO[Math.floor((fraseRng?fraseRng():Math.random())*FALLBACK_NEUTRO.length)];
  return f(me&&me.name||"Ele");
}

async function abrirDilema(){
  const bouts=document.getElementById("bouts");
  const box=el("div","dilema");
  box.innerHTML=`<div class="dil-t">Carregando…</div>`;
  bouts.appendChild(box);
  box.scrollIntoView({behavior:"smooth",block:"nearest"});

  const seed=proximoDilemaSeed();
  const mood=st.streakW>=3?"em alta":st.streakL>=2?"em queda":"estável";
  const recentes=(st.dilemaRecentes||[]).slice(-3);
  let d=await ai("dilema",{name:me.name,record:`${st.wins}-${st.losses}`,
    followers:fmtNum(st.followers),fan:st.fan.toFixed(1),mood,seed,recentes});
  /* dilema não recebe texto do jogador — não dá pra provocar ele do jeito
     que dá pra provocar o julgar. Ainda assim, rede embaixo: se a IA gerar
     algo ruim sem provocação (improvável, mas não impossível), cai no
     mesmo fallback que já existe pra quando ela falha. Mesma rede pro
     título repetir um dos recentes — a instrução de não repetir (acima,
     no prompt) reduz mas não garante, mesma regra do evento. */
  if(!d||!d.cena||conteudoInseguro(d.cena)||conteudoInseguro(d.titulo)||
    recentes.some(t=>t.toLowerCase()===String(d.titulo||"").toLowerCase()))
    d=proximoDilemaFallback();
  st.dilemaRecentes=st.dilemaRecentes||[];
  st.dilemaRecentes.push(String(d.titulo||"E agora?"));
  if(st.dilemaRecentes.length>3)st.dilemaRecentes.shift();

  box.innerHTML=`<div class="dil-eyebrow">Decisão</div>
    <div class="dil-t">${String(d.titulo||"E agora?").slice(0,60)}</div>
    <div class="dil-c">${String(d.cena).slice(0,400)}</div>
    <div class="dil-in">
      <textarea id="dilresp" maxlength="200" rows="3" placeholder="O que você faz?"></textarea>
      <button class="btn btn-sm" id="dilgo">Decidir</button></div>`;
  const inp=document.getElementById("dilresp"),go=document.getElementById("dilgo");
  /* Textarea de verdade (2026-09-16), não <input> de uma linha — medido em
     380px: um input só mostrava ~220px de um campo com 852px de conteúdo
     pra uma resposta de duas frases, a pessoa não conseguia reler o que
     escreveu. É o único lugar do jogo com texto livre, o diferencial
     contra a concorrência — não podia ficar ruim no celular. Cresce com
     o conteúdo (scrollHeight) em vez de rolar escondido por dentro.
     Enter quebra linha, não envia — só o botão Decidir envia. */
  const cresce=()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";};
  inp.addEventListener("input",cresce);
  inp.focus();
  const enviar=async()=>{
    const txt=inp.value.trim();
    if(!txt)return inp.focus();
    go.disabled=true;inp.disabled=true;go.textContent="…";
    /* Corta ANTES de chamar a IA, não só depois: mais barato (economiza a
       chamada inteira) e não depende de o julgar ter obedecido a instrução
       de conteúdo inseguro — o texto nunca sai daqui. */
    const j=conteudoInseguro(txt)?null:await ai("julgar",{name:me.name,cena:d.cena,resposta:txt,
      record:`${st.wins}-${st.losses}`,followers:fmtNum(st.followers),fan:st.fan.toFixed(1),
      rendaBase:RENDA_BASE});
    aplicarDilema(box,d,txt,j);
  };
  go.onclick=enviar;
  return new Promise(res=>{box.__done=res;});
}
/* Severidade e duração da lesão são do JOGO, medidas — não da IA. Medido em
   400 carreiras (candidatos()/simulateFight() reais), do jeito que o
   TETO_TREINO foi medido: temporária custa ~0,7-0,9 vitórias em 22,
   permanente ~1,0 (mesma ordem de grandeza do treino, não maior — é evento
   situacional). A IA só classifica TIPO e ATRIBUTO (ver prompt de "julgar"
   em api/ai.js) — deixar a MAGNITUDE com ela decepcionou: em 40 desfechos
   reais medidos, o "efeito" que ela devolveu ficou quase sempre perto de
   1.0, mesmo em cena dramática. Isto não passa por lim() porque não é
   número da IA — é constante do jogo. lim() continua travando "efeito" no
   dilema comum, abaixo. */
const LESAO_TIPOS={
  temporaria:{mult:.50,duracao:8},
  permanente:{mult:.75,duracao:null},
};

/* Nocaute -> lesão (item cortado da v1, medido nesta leva): severidade
   PRÓPRIA, não reaproveita LESAO_TIPOS.temporaria — um nocaute justifica
   mais dano que uma decisão de dilema, e mudar o valor compartilhado
   também mudaria o custo da lesão de dilema sem pedido pra isso. Alvo
   dado: 0,3-0,5 vitórias em 22 de custo TOTAL desta fonte (não por
   lesão isolada). Medido direto (simulação de carreira inteira com o
   mecanismo probabilístico real, não algebra sobre o custo isolado —
   a algebra superestimava: nocaute pode acontecer perto do fim da
   carreira, sobrando pouco tempo pra lesão custar algo). Combinação
   chance/severidade que fechou o alvo com folga nas duas pontas de
   seed testadas (0,32 e 0,33 vitórias/22, 1.500 carreiras cada):
   chance=.70, -70% (chance sozinha não bastava — 100% de chance com
   -50%/8 lutas só chegava a 0,25; -50% permanente pra sempre só
   chegava a 0,27 — o teto de 22 lutas limita quanto UMA lesão pode
   custar, tem que ser mais severa, não só mais provável). */
const CHANCE_LESAO_NOCAUTE=.70;
const LESAO_NOCAUTE={mult:.30,duracao:8};
/* Item de loja "Equipamento de proteção" (leva seguinte): reduz a MESMA
   chance acima, não a severidade/duração — item separado de propósito
   (severidade é o que fecha o alvo de custo, ver comentário acima; mexer
   nela mudaria o balanceamento medido sem pedido pra isso). .45 escolhido
   e medido em CHANCE_LESAO_NOCAUTE_EQUIP mais abaixo (node testar.js
   equipamento) — não é chute, é fração testada contra 1.500 carreiras
   pareadas com/sem, mesma seed, mesmo lesaoRng. */
const CHANCE_LESAO_NOCAUTE_EQUIP=.45;
/* Preço ancorado em RENDA_BASE, mesmo protocolo do CUSTO_TREINADOR (node
   testar.js dinheiro): 400 carreiras de bot ganancioso, luta em que o
   caixa acumulado alcança o preço. 42000 bate mediana na luta 6 — dentro
   do alvo 6-8, na ponta cedo (é o item mais valioso da loja por
   vitória/22 até aqui: ver medição acima do "benefício da compra"). */
const CUSTO_EQUIPAMENTO=42000;
/* Empresário financeiro (loja): reduz pela metade o lado NEGATIVO de
   dDinheiro no julgar do dilema — ver aplicarDilema() mais abaixo. Não
   precisa de simulação pra "medir": é metade exata por construção, não
   probabilística. Preço mais baixo que os outros dois — não muda
   vitória nenhuma, é rede de segurança de caixa, coerente com custar
   menos que algo que muda combate. */
const CUSTO_EMPRESARIO=24000;
/* Casa melhor (loja): bônus permanente no followerDelta de toda luta,
   vitória ou derrota. followerDelta() já cresce PROPORCIONAL ao total de
   seguidores (crescimento composto luta a luta) — um multiplicador
   parece pequeno de cara mas AMPLIFICA ao longo de 22 lutas. Medido
   (400 carreiras de bot, candidatos()/simulateFight()/finishFight()
   reais): 1.15 (+15%/luta) chegou a +160% de seguidores ao fim da
   carreira — descartado, exagerado demais pra "casa melhor". 1.03
   (+3%/luta) fecha em +21% ao fim da carreira — perceptível, não
   quebra a curva. */
const CASA_FOLLOWER_MULT=1.03;
const CUSTO_CASA=30000;
/* Consultoria de mídia (loja, item RECORRENTE — 2026-09-11): os quatro
   itens acima são compra única, e por volta da luta 10 o jogador já tem
   todos — dinheiro perde função pro resto da carreira (ver
   PENDENCIAS.md "onde desperdiça trabalho já feito"). Reusa a MESMA
   alavanca já medida/calibrada de "Casa melhor" (CASA_FOLLOWER_MULT),
   só que PONTUAL (1 luta, não permanente) — nenhum multiplicador novo
   pra calibrar. Preço testado em 4 pontos (400 carreiras/preço, bot
   guloso comprando toda vez que tem caixa, candidatos()/simulateFight()/
   finishFight() reais): 10000 rende 18,3 compras/carreira e +21,5% de
   seguidores (empata com o permanente de Casa melhor — caro demais pro
   item ficar redundante); 24000 (mesmo preço do Empresário, o mais
   barato dos 4 originais) rende 7,8 compras/carreira e +9,5% — menos da
   metade do +21% de Casa melhor, não compete com ele, e ainda dá pra
   comprar bastante vez ao longo da carreira mesmo depois dos outros 4
   itens levados. `node testar.js loja` cobre o consumo (1 luta só,
   precisa comprar de novo) e o efeito medido. */
const CUSTO_CONSULTORIA=24000;

function aplicarDilema(box,d,txt,jBruto){
  /* Rede de baixo do conteúdo inseguro (ver CONTEUDO_INSEGURO acima): um "j"
     cujo desfecho narrou automutilação/violência/sexual não é confiável em
     NENHUM campo, não só no texto — descarta o objeto inteiro, não só a
     frase. A partir daqui só se usa jSeguro, nunca jBruto. */
  const jSeguro=(jBruto&&conteudoInseguro(jBruto.desfecho))?null:jBruto;
  const j=jSeguro;
  /* Todo número volta limitado. O jogador digita texto livre que entra no
     prompt, então nada que o modelo devolve é aceito sem trava. */
  const dSeg=lim(j&&j.seguidores,-.35,.60,0);
  const dFan=lim(j&&j.fa,-2.5,2.5,0);
  /* Dinheiro do dilema (item 2): fração de UMA bolsa de luta (RENDA_BASE),
     pra cima ou pra baixo — mesma âncora que "seguidores" já usa (fração
     relativa, não número solto). ±1 bolsa inteira é o teto: um dilema é
     evento situacional, não pode valer mais que uma luta inteira paga. */
  /* Empresário financeiro (loja, item recém-medido): reduz pela metade o
     lado NEGATIVO de dDinheiro — perda de dilema custa menos, ganho
     continua o mesmo. Efeito aplicado no valor JÁ arredondado, não antes
     de lim()/Math.round — mais simples de medir e não muda o teto de
     ±1 bolsa que lim() já trava. */
  /* Rede de baixo pro mesmo problema do "não repita" (LEIA-ME.md, "Regra
     geral: restrição negativa no prompt não é garantia"): pedir no prompt
     pra só preencher "dinheiro" quando o desfecho narra um evento
     financeiro de verdade reduz, mas não impede, a IA inventar um valor
     sem nenhum r$/multa/contrato/prêmio no texto (medido: 4 de 20
     desfechos tinham "dinheiro" não-zero sem NENHUMA palavra de dinheiro
     na narração). Checagem mecânica, não sentimento — só confere se o
     TEXTO menciona algo financeiro; não tenta decidir se a cena foi boa
     ou ruim (isso é frágil demais em texto livre com gíria, não vale a
     pena arriscar falso positivo). Sem acento de propósito (semAcento):
     não depender de a IA ter acentuado igual. */
  const semAcento=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  /* Raiz de palavra (\w*), não forma exata: medido contra os 20 desfechos
     reais da leva anterior, "pagou"/"recebeu" sozinhos perderam "não PAGA
     a segunda parcela"/"sem RECEBER o resto" (conjugação diferente) — só
     não incomodou aquela vez porque o padrão (zera quando não acha) deu
     por acaso o resultado certo. Ampliado pra não depender de sorte. */
  /* Conta a CENA também, não só o desfecho: medido (v2 dos 20 casos) — quando
     a cena já estabelece a oferta ("R$500 pra postar isso"), o desfecho às
     vezes narra só o desdobramento e nunca repete o valor, porque já foi
     dito antes. Checar só o desfecho zerava um "dinheiro" certo (0.083,
     batendo com os R$500 da cena) por engano. */
  const mencionaDinheiro=/r\$|\breais?\b|multas?|patrocin\w*|contrat\w*|premi\w*|bolsas?|cache|\bpag(a|as|ou|am|ando|amento|amentos|ar|avel|aveis)\b|receb\w*|indeniza\w*|apost\w*|salari\w*|\bpix\b|divida\w*|emprest\w*|dinheiro/
    .test(semAcento((j&&j.desfecho||"")+" "+(d&&d.cena||"")));
  const dDinheiroBruto=mencionaDinheiro?Math.round(RENDA_BASE*lim(j&&j.dinheiro,-1,1,0)):0;
  const dDinheiro=(st.empresarioComprado&&dDinheiroBruto<0)?Math.round(dDinheiroBruto/2):dDinheiroBruto;
  const ATTRS_LESAO=["slpm","strDef","durability","tdDef","subAvg","kdAvg"];

  /* Uma lesão de cada vez: st.lesao é objeto único, não lista. Se uma nova
     sobrescrevesse a ativa, o multiplicador da primeira ficaria órfão em
     st.eventoMod pra sempre (o tick de cura, em finishFight(), divide pelo
     mult guardado em st.lesao — sem ele não tem como reverter o que já foi
     aplicado). "já está machucado" também é defensável sozinho: não
     empilha um segundo problema em cima do primeiro.

     Existiu aqui um portão exigindo j.houveLesao===true concordando com o
     objeto lesao, mais um campo separado no prompt do julgar pedindo pra
     decidir isso ANTES do resto. Foi revertido: medido depois de deploy de
     verdade (a medição anterior tinha testado uma versão do prompt que
     nunca tinha saído do arquivo local — ver LEIA-ME.md, seção "Lesão"), o
     prompt sem o portão já acerta 8/8 nas cenas de lesão e 0/34 nas sem
     lesão. O portão era complexidade resolvendo um problema que não
     existia. A IA às vezes preenche lesao E o atributo/efeito comum ao
     mesmo tempo (o prompt pede pra não fazer isso, mas acontece — visto em
     3 das 8 respostas medidas) — isso é ignorado aqui de propósito, só a
     validade do PRÓPRIO objeto lesao importa. */
  const lesaoBruta=j&&j.lesao;
  const lesaoValida=!st.lesao&&lesaoBruta
    &&ATTRS_LESAO.includes(lesaoBruta.atributo)&&me[lesaoBruta.atributo]!=null;
  let atr=null, mult=1;
  if(lesaoValida){
    const tipo=LESAO_TIPOS[lesaoBruta.permanente?"permanente":"temporaria"];
    atr=lesaoBruta.atributo; mult=tipo.mult;
    /* treinador melhor (item 2, trocado do treino pra cá): corta a
       duração da lesão TEMPORÁRIA pela metade. Não mexe em permanente —
       não existe "cura" pra acelerar ali. */
    const duracao=(tipo.duracao!=null&&st.treinadorComprado)
      ?Math.round(tipo.duracao*REDUCAO_CURA_TREINADOR):tipo.duracao;
    st.eventoMod=st.eventoMod||{};
    st.eventoMod[atr]=(st.eventoMod[atr]||1)*mult;
    /* origem:"dilema" — distingue de "nocaute" (ver finishFight()). Achado
       jogando em produção: o momento "lesão aceita e vencida" disparava
       pra QUALQUER st.lesao ativo, nocaute incluso — a frase ("entrou
       mancando e saiu com a mão levantada") narra uma escolha corajosa
       que o jogador nunca fez quando a lesão veio de apanhar, não de
       decidir lutar machucado. */
    st.lesao={nome:String(lesaoBruta.regiao||"Lesão").slice(0,40),atributo:atr,mult,
      permanente:!!lesaoBruta.permanente,desdeLuta:st.fightNo,duracao,origem:"dilema"};
  }else{
    /* dilema comum (ou lesão bloqueada por já ter uma ativa): atributo/efeito
       seguem vindo da IA, travados no lim() de sempre — o bypass acima é só
       pra tabela de lesão, nunca pra isto. */
    atr=ATTRS_LESAO.includes(j&&j.atributo)?j.atributo:null;
    mult=lim(j&&j.efeito,.90,1.10,1);
    if(atr&&me[atr]!=null){st.eventoMod=st.eventoMod||{};
      st.eventoMod[atr]=(st.eventoMod[atr]||1)*mult;}
  }

  /* evitouLesao: risco físico evitado por escolha prudente. O custo em fama
     já sai de dSeg/dFan (o prompt pede pra IA não tratar recusa como
     neutra); o custo em ranking é mecânica nova — dilema nunca tocou
     st.standing antes de hoje — e por isso fica fixo aqui, não depende da
     IA lembrar de aplicar um número certo. */
  if(j&&j.evitouLesao){st.standing=Math.max(.05,st.standing-.06);st.evitouAlgumaVez=true;}

  const antes=st.followers;
  st.followers=Math.max(120,Math.round(st.followers*(1+dSeg)));
  st.fan=Math.max(0,Math.min(10,st.fan+dFan));
  st.dinheiro=Math.max(0,(st.dinheiro||0)+dDinheiro);
  const dif=st.followers-antes;
  /* aqui a direção é direta: os números já vieram limitados pelo lim() */
  const peso=(dSeg*2.2)+(dFan*0.55)+(dDinheiro/RENDA_BASE*1.4);
  (peso>0.12?SOM.bom:peso<-0.12?SOM.ruim:SOM.evento)();
  /* Filtra ANTES do slice: cortar frase por regex depois de truncar
     poderia deixar uma frase pela metade sem o ponto final que a divide.
     1200 (era 2000, 2026-09-18; e 500 antes disso, 2026-09-11): desfecho
     voltou de 6-10 pra 4-6 frases — virava parede de texto na tela,
     sobretudo no celular. Medido antes de escolher o número (20
     desfechos reais de 6-10 frases, sessão anterior): média 595-687
     caracteres, máximo observado 953 pra ~9-10 frases — pra 4-6 frases
     o esperado é bem menor que isso. 1200 é rede de segurança contra
     resposta fugindo do tamanho pedido, não um limite que a resposta
     normal deveria tocar — a caixa (.dil-o, max-width mas sem
     max-height) já cresce com o texto, quem rola é o container de
     narração (`box.scrollIntoView` já existe). */
  const bruto=(j&&j.desfecho)?semResultadoDeLuta(String(j.desfecho)).slice(0,1200):"";
  const desfecho=bruto||fraseFallback();
  box.innerHTML=`<div class="dil-eyebrow">Decisão</div>
    <div class="dil-t">${String(d.titulo||"E agora?").slice(0,60)}</div>
    <div class="dil-c">${String(d.cena).slice(0,400)}</div>
    <div class="dil-r">"${txt.replace(/</g,"&lt;")}"</div>
    <div class="dil-eyebrow">O desfecho</div>
    <div class="dil-o">${desfecho}</div>
    <div class="dil-fx">
      ${dif!==0?`<span class="delta ${dif>=0?"up":"down"}">${dif>=0?"+":"−"}${fmtNum(Math.abs(dif))} seguidores</span>`:""}
      ${Math.abs(dFan)>=0.05?`<span class="delta ${dFan>=0?"up":"down"}">${dFan>=0?"+":"−"}${Math.abs(dFan).toFixed(1)} de fã</span>`:""}
      ${dDinheiro!==0?`<span class="delta ${dDinheiro>=0?"up":"down"}">${dDinheiro>=0?"+":"−"}R$${fmtNum(Math.abs(dDinheiro))}</span>`:""}
      ${atr?`<span class="hint">${ROTULO_ATTR[atr]||atr} <span class="${mult>=1?"g":"dn"}">${
        mult>=1?"+":""}${Math.round((mult-1)*100)}%</span></span>`:""}</div>`;
  st.dilemas=(st.dilemas||0)+1;
  if(box.__done)box.__done();
}




/* =========================================================================
   SOM — sintetizado na Web Audio API, sem nenhum arquivo.
   Motivos: o jogo continua sendo um HTML só, não depende de licença de
   sample, não tem download nem espera. E o navegador BLOQUEIA áudio antes do
   primeiro clique do usuário, então o contexto só nasce quando ele interage.
   ========================================================================= */
let AC=null, MASTER=null, BUS=null, MUSICA=null, AMB=null;
let mudo=(()=>{try{return localStorage.getItem("mudo")==="1";}catch(e){return false;}})();

/* Música e efeitos em barramentos separados porque na prática a pessoa quer
   abaixar a trilha e manter o soco. O padrão dos dois é 1.00, que é o nível em
   que o jogo foi equilibrado — quem não abrir o painel ouve exatamente o que
   ouvia antes. Number() e não parseFloat(): o testar.js roda num sandbox
   enxuto e parseFloat não está lá. */
const lerVol=k=>{try{
    const b=localStorage.getItem(k); if(b===null)return 1;
    const v=Number(b); return isNaN(v)?1:clamp(v,0,1);
  }catch(e){return 1;}};
let volMusica=lerVol("vol_musica"), volEfeitos=lerVol("vol_efeitos");

/* Dois barramentos sob o mesmo master: BUS carrega os efeitos, MUSICA carrega a
   trilha. O mudo continua sendo ponto único — com ele ligado o contexto nem
   nasce. */
function ctx(){
  if(mudo)return null;
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      MASTER=AC.createGain(); MASTER.gain.value=.9;        MASTER.connect(AC.destination);
      BUS=AC.createGain();    BUS.gain.value=volEfeitos;   BUS.connect(MASTER);
      MUSICA=AC.createGain(); MUSICA.gain.value=volMusica; MUSICA.connect(MASTER);
    }catch(e){AC=null;return null;}
  }
  if(AC.state==="suspended")AC.resume();
  return AC;
}
function env(g,t,pico,dur,atq=0.006){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(pico,t+atq);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
}
function ruido(dur,decai=true){
  const a=ctx();if(!a)return null;
  const n=Math.floor(a.sampleRate*dur);
  const buf=a.createBuffer(1,n,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(decai?(1-i/n):1);
  const s=a.createBufferSource();s.buffer=buf;return s;
}

/* ---------------- TRILHA ----------------
   Bordão grave contínuo: fundamental em Lá0 (55 Hz), a quinta acima e uma
   oitava, todas levemente desafinadas entre si. A desafinação é o que produz o
   batimento lento que faz o som "respirar" em vez de zumbir parado.
   Um filtro passa-baixa varre devagar por cima. Volume baixo de propósito:
   é cama, não música. */
function trilhaLiga(){
  const a=ctx(); if(!a||AMB) return;
  const g=a.createGain(); g.gain.value=0;
  const lp=a.createBiquadFilter(); lp.type="lowpass";
  lp.frequency.value=220; lp.Q.value=.7;
  lp.connect(g); g.connect(MUSICA);

  const vozes=[[55,0],[55.35,-0.4],[82.5,-6],[110,-9]];
  const osc=vozes.map(([f,db])=>{
    const o=a.createOscillator(), vg=a.createGain();
    o.type="sine"; o.frequency.value=f;
    vg.gain.value=Math.pow(10,db/20);
    o.connect(vg).connect(lp); o.start();
    return o;
  });
  /* sopro de sala: ruído filtrado bem embaixo, dá corpo sem virar chiado */
  const s=ruido(8,false);
  let sN=null;
  if(s){ s.loop=true;
    const bp=a.createBiquadFilter(); bp.type="lowpass"; bp.frequency.value=140;
    const sg=a.createGain(); sg.gain.value=.045;
    s.connect(bp).connect(sg).connect(lp); s.start(); sN=s; }

  /* varredura lenta do filtro: 40 s de ida e volta */
  const lfo=a.createOscillator(), lfoG=a.createGain();
  lfo.type="sine"; lfo.frequency.value=1/40;
  lfoG.gain.value=90; lfo.connect(lfoG).connect(lp.frequency); lfo.start();

  g.gain.setValueAtTime(0.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.16,a.currentTime+3);   // entra devagar
  AMB={g,osc,lfo,noise:sN};
}
function trilhaDesliga(){
  if(!AMB||!AC)return;
  const t=AC.currentTime;
  AMB.g.gain.cancelScheduledValues(t);
  AMB.g.gain.setValueAtTime(Math.max(.0001,AMB.g.gain.value),t);
  AMB.g.gain.exponentialRampToValueAtTime(.0001,t+.8);
  const {osc,lfo,noise}=AMB;
  setTimeout(()=>{try{osc.forEach(o=>o.stop());lfo.stop();if(noise)noise.stop();}catch(e){}},900);
  AMB=null;
}

/* ---------------- EFEITOS ----------------
   Tudo transposto uma oitava e meia para baixo do que era antes, e com filtro
   passa-baixa no lugar de onda crua. Agudo corta a trilha e cansa. */
function tom(f,{tipo="sine",pico=.09,dur=.3,atq=.006,em=0,corte=null,varre=null}={}){
  const a=ctx();if(!a)return;
  const t=a.currentTime+em;
  const o=a.createOscillator(), g=a.createGain();
  o.type=tipo; o.frequency.setValueAtTime(f,t);
  if(varre)o.frequency.exponentialRampToValueAtTime(varre,t+dur);
  let no=o;
  if(corte){const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=corte;
    o.connect(lp); no=lp;}
  env(g,t,pico,dur,atq); no.connect(g).connect(BUS);
  o.start(t); o.stop(t+dur+.12);
}
const SOM={
  toque(){ if(toca("click",.75))return; tom(150,{tipo:"triangle",pico:.05,dur:.06,varre:96,corte:900}); },

  fixa(){ tom(98,{tipo:"sine",pico:.10,dur:.22,corte:700});
          tom(147,{tipo:"sine",pico:.07,dur:.26,em:.06,corte:800}); },

  /* estalo abafado, tipo luva em corpo */
  golpe(){ const a=ctx();if(!a)return;const t=a.currentTime;
    const s=ruido(.11);if(!s)return;
    const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(500,t);
    const g=a.createGain();env(g,t,.11,.12,.002);
    s.connect(lp).connect(g).connect(BUS);s.start(t);
    tom(70,{tipo:"sine",pico:.07,dur:.1,varre:45}); },

  queda(){ tom(96,{tipo:"sine",pico:.24,dur:.42,varre:34,atq:.005});
    const a=ctx();if(!a)return;const t=a.currentTime;
    const s=ruido(.3);if(!s)return;
    const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.setValueAtTime(300,t);
    const g=a.createGain();env(g,t,.13,.3,.004);
    s.connect(lp).connect(g).connect(BUS);s.start(t); },

  nocaute(){ tom(120,{tipo:"sine",pico:.38,dur:.85,varre:26,atq:.004});
    const a=ctx();if(!a)return;const t=a.currentTime;
    const s=ruido(2.2);if(!s)return;
    const bp=a.createBiquadFilter();bp.type="lowpass";bp.frequency.setValueAtTime(700,t);
    const g=a.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.16,t+.35);     // a plateia leva um tempo
    g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
    s.connect(bp).connect(g).connect(BUS);s.start(t); },

  /* sino de round: grave e abafado, não o triângulo agudo de antes */
  sino(){ [330,495,660].forEach((f,i)=>
    tom(f,{tipo:"sine",pico:.055/(i+1),dur:1.4,atq:.002,corte:1200})); },

  /* VITÓRIA: acorde maior grave que abre, com um peso embaixo */
  vitoria(){ if(toca("vitoria",.85))return; tom(65,{tipo:"sine",pico:.16,dur:1.1,atq:.02});
    [131,165,196].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.085,dur:1.0,em:i*.10,atq:.02,corte:1000}));
    tom(262,{tipo:"sine",pico:.05,dur:1.2,em:.30,atq:.05,corte:900}); },

  /* Evento neutro: um toque só, discreto. Serve de pontuação. */
  evento(){ tom(147,{tipo:"sine",pico:.09,dur:.5,atq:.02,corte:900});
            tom(220,{tipo:"sine",pico:.045,dur:.4,em:.03,atq:.03,corte:1100}); },

  /* Evento BOM: terça maior subindo, curto. Menor que a vitória de propósito —
     é uma boa notícia, não o fim de uma luta. */
  bom(){ tom(98,{tipo:"sine",pico:.11,dur:.7,atq:.015});
    [196,247,294].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.075,dur:.55,em:i*.075,atq:.012,corte:1500})); },

  /* Evento RUIM: segunda menor descendo, com o chão saindo embaixo. */
  ruim(){ tom(110,{tipo:"sine",pico:.12,dur:.9,atq:.015});
    [233,208,175].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.07,dur:.55,em:i*.09,atq:.012,corte:1100}));
    tom(87,{tipo:"sine",pico:.09,dur:.8,em:.28,atq:.04}); },

  /* DERROTA: menor, desce, e a fundamental fica sozinha no fim */
  derrota(){ if(toca("derrota",.85))return; tom(98,{tipo:"sine",pico:.14,dur:1.3,atq:.02});
    [156,131,117].forEach((f,i)=>
      tom(f,{tipo:"triangle",pico:.075,dur:.8,em:i*.16,atq:.02,corte:700}));
    tom(58,{tipo:"sine",pico:.10,dur:1.6,em:.5,atq:.08}); },
};

/* O navegador só libera áudio depois de um gesto do usuário. Este ouvinte roda
   uma vez e morre — é a única janela em que dá pra iniciar a trilha. */
/* ---------------- ARQUIVOS ----------------
   Os quatro áudios da pasta /audio substituem os sons sintetizados quando
   carregam. Se algum faltar ou o navegador recusar o formato, o sintetizado
   assume — o jogo nunca fica mudo por causa de um 404. */
const ARQ={click:"audio/button_click.wav",vitoria:"audio/victory.wav",
           derrota:"audio/defeat.wav",bgm:"audio/bgm_fight.ogg"};
const BUF={};
async function carregaAudio(){
  const a=ctx(); if(!a) return;
  await Promise.all(Object.entries(ARQ).map(async ([k,url])=>{
    try{
      const r=await fetch(url); if(!r.ok)throw 0;
      BUF[k]=await a.decodeAudioData(await r.arrayBuffer());
    }catch(e){ /* fica sem: o sintetizado cobre */ }
  }));
}
function toca(k,ganho=1){
  const a=ctx(); if(!a||!BUF[k])return false;
  const s=a.createBufferSource(); s.buffer=BUF[k];
  const g=a.createGain(); g.gain.value=ganho;
  s.connect(g).connect(BUS); s.start();
  return true;
}
let BGM=null;
function bgmLiga(){
  const a=ctx(); if(!a||!BUF.bgm||BGM) return false;
  const s=a.createBufferSource(); s.buffer=BUF.bgm; s.loop=true;
  const g=a.createGain(); g.gain.setValueAtTime(.0001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.34,a.currentTime+2.5);
  s.connect(g).connect(MUSICA); s.start();
  BGM={s,g}; return true;
}
function bgmDesliga(){
  if(!BGM||!AC)return;
  const t=AC.currentTime;
  BGM.g.gain.cancelScheduledValues(t);
  BGM.g.gain.setValueAtTime(Math.max(.0001,BGM.g.gain.value),t);
  BGM.g.gain.exponentialRampToValueAtTime(.0001,t+.9);
  const s=BGM.s; setTimeout(()=>{try{s.stop();}catch(e){}},1000);
  BGM=null;
}

function armarTrilha(){
  if(!document.addEventListener)return;      // ambiente sem eventos: sem trilha, sem erro
  const arma=async()=>{
    await carregaAudio();
    if(!bgmLiga())trilhaLiga();          // sem arquivo, cai no bordão sintetizado
    document.removeEventListener("pointerdown",arma);
    document.removeEventListener("keydown",arma); };
  document.addEventListener("pointerdown",arma);
  document.addEventListener("keydown",arma);
}

/* Rampa curta em vez de salto: arrastar a barra mexe no ganho dezenas de vezes
   por segundo e salto de ganho estala. */
function ajustaGanho(no,v){
  if(!no)return;
  try{ no.gain.setTargetAtTime(v,AC.currentTime,.02); }
  catch(e){ try{ no.gain.value=v; }catch(e2){} }
}
function aplicarVolumes(){
  ajustaGanho(MUSICA,volMusica);
  ajustaGanho(BUS,volEfeitos);
}
function definirVolume(qual,v){
  v=clamp(Number(v)||0,0,1);
