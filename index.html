/* Ponto único que decide o estado dos botões. Antes isso estava espalhado em
   quatro lugares e um deles esquecia o automático. */
function atualizarControles(){
  const next=document.getElementById("next");
  const ab=document.getElementById("autob");
  const ctrl=document.getElementById("controls");
  const cont=document.getElementById("counter");
  if(!next||!ab)return;
  const fim=fightNo>=TOTAL_FIGHTS;
  next.disabled=dilemaAberto||escolhaAberta||playing||auto||fim;
  ab.disabled=dilemaAberto||fim;
  if(ctrl)ctrl.classList.toggle("travado",dilemaAberto||escolhaAberta);
  if(cont&&dilemaAberto)cont.textContent="responda para continuar";
  else if(cont&&escolhaAberta)cont.textContent="escolha o adversário";
  else if(cont)cont.textContent=`${fightNo} de ${TOTAL_FIGHTS} · ${st.wins}-${st.losses}`;
  const cb=document.getElementById("cardsb");
  if(cb){const n=(st.momentos||[]).length;cb.textContent=n?`Cards (${n})`:"Cards";}
  atualizarBadgeConquistas();
}
/* Contagem é GLOBAL (localStorage), não da carreira atual — troféu não
   zera quando você começa outra. */
function atualizarBadgeConquistas(){
  const b=document.getElementById("conqb");
  if(!b)return;
  const n=CONQUISTAS_DESBLOQUEADAS.size,total=CONQUISTAS.length;
  b.textContent=`Conquistas (${n}/${total})`;

function cycleSpeed(){
  speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];
  document.getElementById("speedb").textContent=`Velocidade ${speed}x`;
}
function toggleAuto(){
  if(dilemaAberto)return;                 // não dá pra pular um dilema
  auto=!auto;
  if(auto&&escolhaAberta){                // automático assume as escolhas
    escolhaAberta=false;
    const b=document.getElementById("escolha");
    if(b){b.style.display="none";b.innerHTML="";}
  }
  const b=document.getElementById("autob");
  b.classList.toggle("on",auto);
  b.textContent=auto?"Parar automático":"Modo automático";
  atualizarControles();
  if(auto&&!playing)nextFight();
}
function pickOpponent(){
  const center=Math.floor(st.standing*(LADDER.length-1));
  const spread=Math.max(8,Math.floor(LADDER.length*.06));
  const lo=Math.max(0,center-spread),hi=Math.min(LADDER.length-1,center+spread);
  for(let t=0;t<40;t++){
    const c=LADDER[lo+Math.floor(rng()*(hi-lo+1))];
    if(!fought.has(c.name)){fought.add(c.name);return c;}
  }
  return LADDER[lo+Math.floor(rng()*(hi-lo+1))];
}
function nextFight(){
  if(fightNo>=TOTAL_FIGHTS||playing||dilemaAberto||escolhaAberta)return;
  /* Único lugar que decide "é luta de título?" pra esta luta. Uma vez por
     luta, aqui, antes de existir tela ou pick automático — candidatos() e
     lutar() só leem st.tituloEstaLuta depois disso. */
  st.tituloEstaLuta=tituloLiberado();
  if(auto){                                  // no automático a máquina escolhe o meio
    const opts=candidatos();
    /* opts tem 3 cartas normalmente, mas 1 só em luta de título/defesa
       (oponente travado em RANKING) — min(1,length-1) pega "o do meio" nas
       três e a única carta quando só existe uma, sem consumir rng extra. */
    lutar(opts[Math.min(1,opts.length-1)],CAMPS[Math.floor(rng()*CAMPS.length)]);
    return;
  }
  escolhaAberta=true;atualizarControles();
  telaAdversario();
}

function lutar(escolhido,camp){
  escolhaAberta=false;
  fightNo++;st.fightNo=fightNo;
  const opp=escolhido.f;
  fought.add(opp.name);
  st.ganhoEscolhido=escolhido.ganho;
  aplicarCamp(camp);                    // permanente, com teto
  renderFicha();
  st.campEscolhido=camp.nome;
  const comCamp=lutadorEfetivo();
  me.__rating=st.standing;
  /* st.tituloEstaLuta já foi decidido em nextFight(), antes de existir tela
     ou pick automático. Recalcular aqui com tituloLiberado() de novo poderia
     consumir holdRng outra vez e discordar do que a tela mostrou. */
  const titleFight=!!st.tituloEstaLuta;
  const r=simulateFight(comCamp,opp,{seed:Math.floor(rng()*1e9),rounds:titleFight?5:3});
  const won0=r.winner===me.name;
  const kd0=r.knockdowns[opp.name]||0, kdt0=r.knockdowns[me.name]||0;
  /* dispara agora; resolve durante os ~12s de narração */
  prefetchFeed(r,won0,opp,titleFight,kd0,kdt0,won0&&(opp.rating-st.standing)>.15);
  narrate(opp,r,titleFight);
}
/* Narração completa: percorre o log tick a tick. O botão de velocidade só
   divide o intervalo, nunca pula linha — nada de resultado escondido. */
function narrate(opp,r,titleFight){
  playing=true;atualizarControles();
  const live=document.getElementById("live");
  document.getElementById("stage").style.display="";
  document.getElementById("phone").style.visibility="hidden";
  live.innerHTML=`<div class="live-head">
      <span class="vs" style="display:flex;align-items:center;gap:9px">
        ${bonecoSVG(ROSTO||cfgPadrao(),{w:38})}
        <span>${me.name} &nbsp;vs&nbsp; ${opp.name}${titleFight?" · cinturão":""}</span>
      </span>
      <span class="rd" id="rdlabel">Round 1</span></div>
    <div class="play" id="play"></div>`;
  const play=document.getElementById("play"),lines=r.log;let i=0;
  const step=()=>{
    if(i>=lines.length){finishFight(opp,r,titleFight);return;}
    const L=lines[i++];
    if(L.kind==="rd"&&/^Round/.test(L.text))
      document.getElementById("rdlabel").textContent=`Round ${L.round}`;
    const row=el("div","pbp"+(L.kind?" "+L.kind:""),
      `<span class="clk">${L.clock}</span><span>${L.text}</span>`);
    play.appendChild(row);
    row.scrollIntoView({behavior:"smooth",block:"nearest"});
    /* o som sai do TIPO da linha, que o motor já classifica */
    if(L.kind==="kd")SOM.queda();
    else if(L.kind==="rd"&&/^Fim/.test(L.text))SOM.sino();
    else if(L.kind==="big")SOM.golpe();
    else if(L.kind==="fin"&&/ocaute/.test(L.text))SOM.nocaute();
    if(L.kind==="fin"&&/ocaute/.test(L.text)&&!reduceMotion()){
      document.body.classList.add("ko");
      setTimeout(()=>document.body.classList.remove("ko"),440);
    }
    const base=L.kind==="fin"?950:L.kind==="rd"?700:
               (L.kind==="kd"||L.kind==="big")?780:470;
    playTimer=setTimeout(step,reduceMotion()?10:base/speed);
  };
  step();
}
function finishFight(opp,r,titleFight){
  playing=false;atualizarControles();
  const won=r.winner===me.name;
  const isKO=/ocaute/.test(r.method),finish=r.method!=="Decisão";
  const myKd=r.knockdowns[opp.name]||0,oppKd=r.knockdowns[me.name]||0;
  st.kdGiven+=myKd;st.kdTaken+=oppKd;
  /* estado ANTES desta luta — precisa pra saber se um evento é a PRIMEIRA
     vez (cinturão, lesão) e pro upset comparar com quem o jogador era antes
     de vencer, não depois. standing muda logo abaixo; os outros três não
     mudam aqui, mas capturar junto deixa claro que são "antes desta luta",
     não "antes desta função". */
  const standingPre=st.standing;
  const foiCampeaoAntes=st.foiCampeao,lutandoMachucado=!!st.lesao;
  /* Antes de mexer no standing: é daqui que sai a seta de subiu/caiu na ficha. */
  const _rkAntes=posicaoDivisao();
  if(_rkAntes)st.rankAnt=_rkAntes.n;

  if(won){
    st.wins++;st.streakW++;st.streakL=0;st.longestW=Math.max(st.longestW,st.streakW);
    if(finish)st.finishes++;
    if(opp.rating>st.bestBeaten){st.bestBeaten=opp.rating;st.bestWin=opp.name;}
    st.standing=Math.min(1,st.standing+(titleFight?.05:(st.ganhoEscolhido??.07)));
    st.peak=Math.max(st.peak,st.standing);
    /* foiCampeao é permanente (histórico: já foi campeão, ninguém tira — usado
       pelo LEGACY). title é o status ATUAL, e É esse que zera na derrota
       abaixo — os dois precisam existir separados, senão reconquistar o
       cinturão não tem como ser distinguido de nunca tê-lo perdido. */
    if(titleFight){
      /* rotação de contender: essa defesa (ganha) usou o desafiante da vez
         — a próxima aponta pro próximo nome do RANKING.lista, não repete o
         mesmo pra sempre. Só avança em DEFESA (st.title já true antes desta
         linha) — desafiar o campeão nomeado não mexe na rotação, que é só
         sobre quem desafia O JOGADOR. */
      if(st.title){
        st.defesas=(st.defesas||0)+1;
        if(RANKING&&RANKING.lista)st.desafianteIdx=Math.min((st.desafianteIdx||1)+1,RANKING.lista.length-1);
      }else{
        /* conta AQUISIÇÃO nova do cinturão (1ª vez ou reconquista), não
           defesa — usado pela conquista "Fênix" (perder e reconquistar). */
        st.vezesCampeao=(st.vezesCampeao||0)+1;
      }
      st.title=true;st.foiCampeao=true;st.exCampeao=null;
      if(!foiCampeaoAntes)st.momentos.push(criarMomento("cinturao",FRASE_PRIMEIRO_CINTURAO(me.name),opp,r));
    }
    /* rápido é clock ALTO nesta luta — ver clockSeconds() */
    if(isKO&&r.round===1&&(300-clockSeconds(r.clock))<60)
      st.momentos.push(criarMomento("ko",FRASE_KO_RAPIDO(me.name),opp,r));
    if(lutandoMachucado&&!st.lesao.venceuMachucado){
      st.lesao.venceuMachucado=true;
      st.momentos.push(criarMomento("lesao",FRASE_LESAO_VENCIDA(me.name),opp,r));
    }
  }else{
    st.losses++;st.streakL++;st.streakW=0;
    if(isKO)st.koLosses++;
    if(r.method==="Finalização")st.subLosses=(st.subLosses||0)+1;
    if(titleFight&&st.title){
      /* defesas só incrementa em vitória (acima), então defesas===0 aqui
         significa que esta é a PRIMEIRA defesa perdida — só nesse caso o
         evento raro "perdeu na primeira defesa" é verdade. Perder a 5ª
         defesa não é a mesma coisa e não pode usar o mesmo texto. */
      if((st.defesas||0)===0){
        st.lostBeltFast=true;
        /* mesmo texto do RARE "lostBeltFast", achado por id — não duplica a
           frase nem depende de índice do array (ver comentário no RARE). */
        st.momentos.push(criarMomento("cinturaoPerdido",
          RARE.find(rr=>rr.id==="lostBeltFast").t(me.name),opp,r));
      }
      /* perder uma defesa custa o cinturão de verdade: title volta a false,
         exCampeao guarda quem tirou (a ficha e a próxima disputa passam a
         nomear essa pessoa, não mais o jogador), defesas zera (reinado novo
         começa do zero se reconquistar) e disputaLiberada reseta — sem isso
         a reconquista aproveitaria a concessão antiga do holdRng e nunca
         sortearia de novo (ver candidatos()/tituloLiberado()). */
      st.title=false;st.exCampeao=opp;st.defesas=0;st.disputaLiberada=false;
      /* essa defesa (perdida) também usou o desafiante da vez — mesma
         rotação da vitória acima. Reconquistar mais tarde enfrenta de novo
         RANKING.campeao (não muda com rotação), mas ao voltar a DEFENDER o
         próximo nome já está um passo adiante. */
      if(RANKING&&RANKING.lista)st.desafianteIdx=Math.min((st.desafianteIdx||1)+1,RANKING.lista.length-1);
    }else if(titleFight&&!st.title){
      /* Perdeu a DISPUTA em si, antes de nunca ter sido campeão — st.title
         já era false, então o bloco acima não roda, mas o reset do
         disputaLiberada precisa acontecer aqui do mesmo jeito. Sem isso, a
         próxima vez que standing/streakW voltarem a bater o limiar,
         tituloLiberado() acha disputaLiberada ainda true (da concessão
         antiga) e devolve o campeão sem sortear holdRng de novo — só que
         agora ignorando `fought` (ver candidatos()), então mesmo achando o
         campeão em `fought` a carta trava nele mesmo assim, revanche de
         verdade. Esse ELSE existe só pra documentar por que o reset não
         soma com o bloco de cima: são estados mutuamente exclusivos
         (perdeu sendo campeão vs. perdeu não sendo). */
      st.disputaLiberada=false;
    }
    /* perder para quem estava abaixo custa mais caro que perder para um perigoso */
    const punicao=st.ganhoEscolhido<=.05?.13:st.ganhoEscolhido>=.12?.06:.09;
    st.standing=Math.max(.05,st.standing-punicao);
  }
  st.lastMethod=r.method;st.lastWon=won;st.lastRound=r.round;st.lastKO=isKO;

  /* Tick de cura. st.eventoMod já acumula multiplicativo (outro evento pode
     ter mexido no MESMO atributo antes ou depois da lesão) — dividir pelo
     mult da lesão desfaz só o que ela escreveu; um "=1" apagaria também um
     bônus de evento que nada tem a ver com a lesão. Roda depois da luta
     recém-simulada (a lesão ainda vale PRA ELA), então passa a valer pra
     próxima a partir daqui. */
  if(st.lesao&&!st.lesao.permanente&&st.fightNo-st.lesao.desdeLuta>=st.lesao.duracao){
    const a=st.lesao.atributo;
    st.eventoMod[a]=(st.eventoMod[a]||1)/st.lesao.mult;
    st.lesao=null;
  }

  /* --- repercussão --- */
  const hype=hypeOf(r,won,opp,me,titleFight,myKd,oppKd);
  /* Bônus de performance da noite: só rótulo, nenhum número novo — reaproveita
     hype, que já existe e já alimenta fã/seguidor. Sem limiar pra calibrar:
     é sempre a luta de MAIOR hype da carreira ATÉ AGORA, tipo st.bestWin/
     st.peak — não precisa medir nada porque não é um corte absoluto, é
     recorde relativo. Aparece no relatório final e no card compartilhável. */
  if(!st.bonusNoite||hype>st.bonusNoite.hype)
    st.bonusNoite={hype,luta:fightNo,adversario:opp.name,cartel:`${st.wins}-${st.losses}`};
  /* upset compara com quem o jogador ERA antes de vencer — standingPre, não
     st.standing (que essa altura do won já subiu). Usar o pós-luta fazia
     "vitória sobre favorito" quase nunca disparar: o próprio salto de
     standing da vitória encolhia a diferença que definia o upset.
     fightNo>=6 e diferença >.20 (era >.15, sem piso): medido em 120
     carreiras, 77% dos upsets caíam nas lutas 1-5 só porque standing começa
     baixo (.18) — não é zebra de verdade, é o jogador ainda subindo do
     fundo da tabela. Ver LEIA-ME "Card de momento". */
  const upset=won&&fightNo>=6&&(opp.rating-standingPre)>.20;
  if(upset)st.momentos.push(criarMomento("upset",FRASE_UPSET(me.name,opp.name),opp,r));
  const alvo=Math.max(0,Math.min(10,1.3+hype*1.30));
  st.fan=Math.max(0,Math.min(10,st.fan*.62+alvo*.38));      /* média móvel */
  const delta=followerDelta(st.followers,hype,won,st.standing);
  st.followers=Math.max(120,st.followers+delta);
  st.peakFollowers=Math.max(st.peakFollowers,st.followers);
  st.lastDelta=delta;
  const ph=document.getElementById("phone");
  if(ph){
    const molde=buildFeed(r,won,titleFight,myKd,oppKd,upset,rng,me.name,st.followers);
    ph.style.visibility="visible";
    resolveFeed(molde,rng).then(f=>renderPhone(f,st.fan,delta,st.followers));
  }

  const bouts=document.getElementById("bouts");
  const line=el("div","bout"+(titleFight?" title-fight":""));
  line.innerHTML=`<span class="no">${String(fightNo).padStart(2,"0")}</span>
    <span><span class="opp">${opp.name}</span><br><span class="how">${r.method} · round ${r.round} ${r.clock}${r.cards?" · "+r.cards:""}${(myKd||oppKd)?` · quedas ${myKd}-${oppKd}`:""}</span></span>
    <span class="stamp${won?"":" d"}">${won?"Vitória":"Derrota"}</span>`;
  bouts.appendChild(line);
  (won?SOM.vitoria:SOM.derrota)();     // um só, no carimbo, seja qual for o método

  /* dilema interativo a cada 5 lutas; nas outras, evento normal */
  if(fightNo%5===0&&fightNo<TOTAL_FIGHTS){
    dilemaAberto=true;
    if(auto){auto=false;clearTimeout(autoTimer);
      const b=document.getElementById("autob");
      b.classList.remove("on");b.textContent="Modo automático";}
    atualizarControles();
    abrirDilema()
      .catch(()=>{})                       // falha do dilema não pode travar a carreira
      .then(()=>{dilemaAberto=false;verificarConquistas();atualizarControles();renderFicha();});
  }else if(fightNo%2===0||finish){
    const d=drawEvent(st,rng,usedEvents,rareUsed);
    if(d){
      bouts.appendChild(el("div","event"+(d.rare?" rare":""),(d.rare?"":"— ")+d.e.t(me.name)));
      somDoEvento(d.e,lutadorEfetivo());
      st.events++;
      if(d.rare){
        st.rares.push(d.e.t(me.name));
        if(d.e.card)st.momentos.push(criarMomento("raro",d.e.t(me.name),opp,r));
      }
      if(d.e.fx){
        /* o efeito entra numa camada separada: se fosse direto no atributo,
           ele apagaria a base e o treino perderia referência */
        const d2=d.e.fx(lutadorEfetivo());
        st.eventoMod=st.eventoMod||{};
        for(const k in d2){
          const antes=statAtual(k)||1;
          st.eventoMod[k]=(st.eventoMod[k]||1)*(d2[k]/antes);
        }
      }
    }
  }
  verificarConquistas();
  atualizarControles();renderFicha();

  /* "Terminou a luta 1", "terminou a luta 5" e "terminou as 22". fightNo já
     foi incrementado em lutar() antes de finishFight() rodar, então aqui já
     reflete a luta que acabou de concluir. Fixo nesses pontos, não "a cada
     N" — o funil quer corte, não série. terminou_luta_1 é o que a fase 2 do
     PLANO-LANCAMENTO.md precisa pra medir "abriu → primeira luta terminou":
     sem ele só dava pra medir até o fim do draft (terminou_draft), que é
     ANTES da primeira luta, ou até a luta 5, que é tarde demais pro corte
     que a fase 2 quer (3 minutos de crédito de quem clicou no anúncio). */
  if(fightNo===1)evento("terminou_luta_1",{segundos:Math.round((Date.now()-TEMPO_ABERTURA)/1000)});
  if(fightNo===5)evento("terminou_luta_5");
  if(fightNo>=TOTAL_FIGHTS)evento("terminou_22");

  if(fightNo>=TOTAL_FIGHTS){
    auto=false;clearTimeout(autoTimer);
    setTimeout(()=>{document.getElementById("stage").style.display="none";},2600);
    const c=document.getElementById("controls");c.innerHTML="";
    const fin=el("button","btn","Encerrar a carreira");fin.onclick=screenReport;
    c.appendChild(fin);return;
  }
  atualizarControles();
  if(auto&&!dilemaAberto)autoTimer=setTimeout(()=>{if(auto&&!dilemaAberto)nextFight();},1100/speed);
}

/* ---------- tela 4: relatório ---------- */
function grade(){
  const winPct=st.wins/Math.max(1,st.wins+st.losses);
  const finishPct=st.finishes/Math.max(1,st.wins);
  const score=st.peak*40+st.bestBeaten*30+winPct*12+finishPct*8+(st.title?10:0);
  const tiers=[[90,"S","Lenda. Vão passar essas lutas na TV por trinta anos."],
    [78,"A","Nome grande. Entrou no hall da fama da divisão."],
    [64,"B","Carreira sólida. Foi luta principal várias vezes."],
    [48,"C","Meio de card. Sustentou a família lutando."],
    [32,"D","Ficou pelo caminho. Teve momentos."],
    [0,"F","Não deu. Mas você entrou no octógono, que é mais do que a maioria."]];
  const t=tiers.find(x=>score>=x[0]);
  return{score:Math.round(score),letter:t[1],verdict:t[2]};
}
function screenReport(){
  const g=grade();
  app.innerHTML="";
  app.appendChild(el("div","eyebrow","Encerramento de registro"));
  app.appendChild(el("div","",`<div style="text-align:center;margin:4px 0 10px">
    ${bonecoSVG(ROSTO||cfgPadrao(),{w:150})}</div>`));
  const tape=el("table","tape"),row=(l,v)=>`<tr><td>${l}</td><td>${v}</td></tr>`;
  tape.innerHTML=
    row("Cartel",`${st.wins}-${st.losses}`)+
    row("Vitórias antes do fim",`${st.finishes} de ${st.wins} (${Math.round(100*st.finishes/Math.max(1,st.wins))}%)`)+
    row("Maior sequência",`${st.longestW} vitórias`)+
    row("Idade ao encerrar",`${idadeAtual()} anos`)+
    row("Defesas de cinturão",st.defesas||0)+
    row("Golpe marcante",assinatura())+
    row("Quedas aplicadas / sofridas",`${st.kdGiven} / ${st.kdTaken}`)+
    row("Nocautes sofridos",st.koLosses)+
    row("Pico no ranking",fmtPico(st.peak))+
    row("Melhor vitória",st.bestWin||"—")+
    (MODO==="lenda"?row("Modo","Seja uma lenda"):"")+
    row("Cinturão",st.title?"Sim":"Não")+
    row("Seguidores no fim",fmtNum(st.followers))+
    row("Pico de seguidores",fmtNum(st.peakFollowers))+
    row("Medidor de fã final",st.fan.toFixed(1)+" / 10")+
    row("Momentos fora do octógono",st.events)+
    row("Decisões que você tomou",st.dilemas||0)+
    (st.bonusNoite?row("Bônus da noite",`Luta ${st.bonusNoite.luta} · vs ${st.bonusNoite.adversario}`):"");
  app.appendChild(tape);

  const v=el("div","verdict");
  v.innerHTML=`<div class="letter">${g.letter}</div>
    <div class="said"><small>Parecer da comissão · ${g.score} de 100</small>${g.verdict}</div>`;
  app.appendChild(v);

  app.appendChild(el("div","legacy",LEGACY.find(l=>l.when(st)).t(me.name)));

  if(st.rares.length)
    app.appendChild(el("p","made-of","<b>Fora da curva:</b> "+st.rares.join(" &nbsp;·&nbsp; ")));
  app.appendChild(el("p","made-of",`<b>${me.name}</b> era feito de: `+
    picks.map(p=>`${p.pair.label} do ${p.from}`).join(" · ")));

  const row2=el("div","row");
  const share=el("button","btn","Compartilhar");
  share.onclick=()=>compartilhar(g,share);
  const link=el("button","btn btn-ghost","Copiar desafio");
  link.onclick=async()=>{
    try{await navigator.clipboard.writeText(urlDesafio());link.textContent="Copiado";}
    catch(e){link.textContent=urlDesafio();}
    setTimeout(()=>link.textContent="Copiar desafio",2200);
  };
  const again=el("button","btn btn-ghost","Nova carreira");
  again.onclick=()=>{docmeta.textContent="Comissão Atlética · Registro";
    history.replaceState(null,"",location.pathname);SEED=0;screenName();};
  row2.append(share,link,again);app.appendChild(row2);
  app.appendChild(el("p","hint",
    `Semente <b>#${SEED.toString(36).toUpperCase()}</b> — quem abrir seu link pega as mesmas cartas e os mesmos adversários.`));
}

armarConfig();
boot();
